  var state = {

  function colCount() {

  function authHeaders(json) {
    var h = {};
    if (json) h["Content-Type"] = "application/json";
    try {
      var t = localStorage.getItem("authToken");
      if (t) h["x-auth-token"] = t;
    } catch (_) {}
    return h;
  }

  function el(id) {
    return document.getElementById(id);
  }

  function showLog(kind, html) {
    var box = el("dg-np-action-log");
    if (!box) return;
    box.className = "alert mt-3 mb-0 alert-" + (kind || "info");
    box.innerHTML = html;
    box.classList.remove("d-none");
    if (box.dataset) box.dataset.dgNpAutoWarn = "";
  }

  function fmtDt(v) {
    if (!v) return "—";
    try {
      var d = new Date(v);
      if (isNaN(d.getTime())) return String(v);
      return d.toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" });
    } catch (_) {
      return String(v);
    }
  }

  function fmtMoney(v) {
    if (v == null || v === "" || !Number.isFinite(Number(v))) return "";
    var n = Number(v);
    if (window.DatagonFmt && window.DatagonFmt.formatNumber) {
      if (Math.abs(n - Math.round(n)) < 1e-9) {
        return window.DatagonFmt.formatInteger(n);
      }
      return window.DatagonFmt.formatNumber(n, { maxFractionDigits: 2, minFractionDigits: 0 });
    }
    var abs = Math.abs(Math.round(n));
    var s = String(abs).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (n < 0 ? "-" : "") + s;
  }

  function parsePriceInput(raw) {
    if (window.DatagonFmt && window.DatagonFmt.parseNumberInput) {
      return window.DatagonFmt.parseNumberInput(raw);
    }
    var s = String(raw == null ? "" : raw).trim();
    if (!s) return null;
    s = s.replace(/\s/g, "").replace(",", ".");
    var n = Number(s);
    return Number.isFinite(n) ? n : null;
  }

  /** Живой формат тысяч пробелами: 1 → 10 → 100 → 1 000 → 10 000 */
  function formatPriceTyping(raw) {
    var s = String(raw == null ? "" : raw);
    if (!s.trim()) return "";
    var neg = /^\s*-/.test(s);
    s = s.replace(/[^\d.,]/g, "");
    if (!s) return neg ? "-" : "";
    var sep = s.indexOf(",") >= 0 ? "," : s.indexOf(".") >= 0 ? "." : "";
    var intPart = s;
    var frac = "";
    if (sep) {
      var i = s.indexOf(sep);
      intPart = s.slice(0, i);
      frac = s.slice(i + 1).replace(/\D/g, "").slice(0, 2);
    }
    intPart = intPart.replace(/\D/g, "");
    if (!intPart && !frac && !sep) return neg ? "-" : "";
    var formatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    if (sep) formatted += "," + frac;
    return (neg ? "-" : "") + formatted;
  }

  function bindPriceLiveFormat(inp) {
    inp.addEventListener("input", function () {
      var start = inp.selectionStart;
      var before = String(inp.value || "");
      var next = formatPriceTyping(before);
      if (next === before) return;
      var digitsBefore = before.slice(0, start).replace(/\D/g, "").length;
      inp.value = next;
      var pos = 0;
      var seen = 0;
      while (pos < next.length && seen < digitsBefore) {
        if (/\d/.test(next.charAt(pos))) seen += 1;
        pos += 1;
      }
      try {
        inp.setSelectionRange(pos, pos);
      } catch (_) {}
    });
  }

  function copyText(text) {
    var t = String(text == null ? "" : text);
    if (!t) return;
    var done = function () {
      if (window.DatagonNotify && window.DatagonNotify.toast) {
        window.DatagonNotify.toast({ type: "success", message: "Скопировано" });
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done).catch(function () {
        fallbackCopy(t);
        done();
      });
    } else {
      fallbackCopy(t);
      done();
    }
  }

  function fallbackCopy(t) {
    var ta = document.createElement("textarea");
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
    } catch (_) {}
    document.body.removeChild(ta);
  }

  function makeCopyCell(text, opts) {
    var o = opts || {};
    var td = document.createElement("td");
    td.className = "dg-np-cell" + (o.extraClass ? " " + o.extraClass : "");
    var span = document.createElement("span");
    span.className = "dg-np-cell-text" + (o.wrap ? " dg-np-wrap" : "");
    span.textContent = text == null || text === "" ? "—" : String(text);
    span.title = text == null ? "" : String(text);
    td.appendChild(span);
    if (text != null && String(text).trim() !== "") {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn btn-outline-secondary btn-sm dg-np-copy";
      btn.textContent = "⧉";
      btn.title = "Копировать";
      btn.setAttribute("data-dg-no-activity", "1");
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        copyText(text);
      });
      td.appendChild(btn);
    }
    return td;
  }

  function makeIdCell(row) {
    var td = document.createElement("td");
    td.className = "dg-np-cell dg-np-id-cell";
    var wrap = document.createElement("div");
    wrap.className = "dg-np-id-row";
    var displayId = row.channel_num != null ? row.channel_num : row.id;
    var span = document.createElement("span");
    span.className = "dg-np-cell-text dg-np-id-num";
    span.textContent = String(displayId);
    span.title =
      "№ " +
      displayId +
      " на этой вкладке (внутренний id " +
      row.id +
      ")";
    wrap.appendChild(span);
    var logBtn = document.createElement("button");
    logBtn.type = "button";
    logBtn.className = "btn btn-outline-secondary btn-sm dg-np-log-btn";
    logBtn.textContent = "Лог";
    logBtn.title = "Журнал изменений строки";
    logBtn.setAttribute("data-dg-np-log-id", String(row.id));
    logBtn.setAttribute(
      "data-dg-np-log-label",
      String(row.title || row.article || row.product_code || "#" + displayId)
    );
    logBtn.setAttribute("data-dg-notify-start", "Открываем журнал…");
    wrap.appendChild(logBtn);
    td.appendChild(wrap);

    var linkedChannel = null;
    var linkedLabel = "";
    if (row.channel === "marketplaces" && row.source_almamed_id) {
      linkedChannel = "almamed";
      var almNum =
        row.source_almamed_channel_num != null ? row.source_almamed_channel_num : row.source_almamed_id;
      linkedLabel = "← Альм. #" + almNum;
    } else if (row.channel === "almamed" && row.markets_product_id) {
      linkedChannel = "marketplaces";
      var mkNum = row.markets_channel_num != null ? row.markets_channel_num : row.markets_product_id;
      linkedLabel = "→ Марк. #" + mkNum;
    }
    if (linkedChannel && linkedLabel) {
      var focusNum =
        linkedChannel === "almamed"
          ? row.source_almamed_channel_num != null
            ? row.source_almamed_channel_num
            : null
          : row.markets_channel_num != null
            ? row.markets_channel_num
            : null;
      var link = document.createElement("button");
      link.type = "button";
      link.className = "btn btn-link btn-sm p-0 dg-np-id-crosslink";
      link.textContent = linkedLabel;
      link.title =
        "Открыть только этот товар на другой вкладке (с комплектами, если есть)";
      link.setAttribute("data-dg-no-activity", "1");
      link.addEventListener("click", function () {
        setChannel(linkedChannel, { focusChannelNum: focusNum });
      });
      td.appendChild(link);
    }
    return td;
  }

  function userSelect(selectedId, includeEmpty, list) {
    var sel = document.createElement("select");
    sel.className = "form-select form-select-sm";
    if (includeEmpty !== false) {
      var o0 = document.createElement("option");
      o0.value = "";
      o0.textContent = "—";
      sel.appendChild(o0);
    }
    var source = Array.isArray(list) ? list : state.managers || [];
    var hasSelected = false;
    source.forEach(function (u) {
      var o = document.createElement("option");
      o.value = String(u.id);
      o.textContent = u.label || u.username;
      if (selectedId != null && Number(selectedId) === Number(u.id)) {
        o.selected = true;
        hasSelected = true;
      }
      sel.appendChild(o);
    });
    // если выбранный пользователь уже не в группе — показать его отдельно
    if (selectedId != null && !hasSelected) {
      var oX = document.createElement("option");
      oX.value = String(selectedId);
      oX.textContent = "ID " + selectedId + " (вне группы)";
      oX.selected = true;
      sel.appendChild(oX);
    }
    return sel;
  }

  function fillAssigneeFilters() {
    var fill = function (id, list) {
      var sel = el(id);
      if (!sel) return;
      var cur = sel.value;
      while (sel.options.length > 2) sel.remove(2);
      (list || []).forEach(function (u) {
        var o = document.createElement("option");
        o.value = String(u.id);
        o.textContent = u.label || u.username;
        sel.appendChild(o);
      });
      if (cur) sel.value = cur;
    };
    fill("dg-np-f-manager", state.managers);
    fill("dg-np-f-responsible", state.responsibles);
  }

  function fillStatusFilter() {
    var sel = el("dg-np-f-status");
    if (!sel) return;
    var cur = sel.value || state.pending.status || state.status || "";
    while (sel.options.length > 1) sel.remove(1);
    getStatusOpts().forEach(function (p) {
      var o = document.createElement("option");
      o.value = p.key;
      o.textContent = p.label;
      sel.appendChild(o);
    });
    var valid = cur === "" || getStatusOpts().some(function (p) {
      return p.key === cur;
    });
    var next = valid ? cur : "";
    sel.value = next;
    if (!valid && cur) {
      state.status = "";
      state.pending.status = "";
    }
  }

  function syncTabUi() {
    var isMp = state.channel === "marketplaces";
    document.querySelectorAll("#dg-np-tabs [data-dg-np-channel]").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-dg-np-channel") === state.channel);
    });
    var title = el("dg-np-table-title");
    if (title) {
      title.textContent = isMp ? "Выгрузка Размещение на маркеты" : "Выгрузка Альмамед";
    }
    var hint = el("dg-np-hint");
    if (hint) {
      if (isMp) {
        hint.innerHTML =
          "Статус <b>Новый</b> → автоматически <b>Не добавлен</b>, когда заполнены обязательные поля " +
          "(код, артикул, название, штрихкод, цена, длина/ширина/высота/вес, НДС, ссылка на РУ, приоритет; пустые подсвечены). " +
          "После появления товара в МС (по артикулу) подтягиваются код МС и габариты из измерений; зелёные бейджи в «Размещении» — ссылки на карточку МП. " +
          "Размещение на всех МП (Ozon / WB / Я.М) → <b>Добавлен</b>. Комментарий → <b>На доработке</b>. " +
          "«Не сотрудничаем» и «В составе комплекта» — ручные статусы. " +
          "«Обновить очередь маркетов» подтягивает из Альмамед («Добавлен»), МС и снапшотов. " +
          "У вкладок своя нумерация 1, 2, 3… (не общий счётчик); связь: «← Альм. #…» / «→ Марк. #…» под номером. " +
          "«Убрать размещенные» убирает строки со статусом «Добавлен» после проверки.";
      } else {
        hint.innerHTML =
          "Статус <b>Новый</b> → автоматически <b>Не добавлен</b>, когда заполнены: артикул, название, цена Альмамед, ссылка поставщика, приоритет " +
          "(пустые подсвечены). Контент: <b>В работе</b> → <b>Добавлен</b>; замечания — <b>На доработке</b> + комментарий. " +
          "Галочки «Маркеты»/«Комплект» создают <b>отдельную</b> строку на вкладке маркетов со <b>своей</b> нумерацией 1, 2…; связь «→ Марк. #…» под номером.";
      }
    }
    var btnSync = el("dg-np-sync-markets");
    var btnRemove = el("dg-np-remove-placed");
    if (btnSync) btnSync.classList.toggle("d-none", !isMp);
    if (btnRemove) btnRemove.classList.toggle("d-none", !isMp);
    fillStatusFilter();
  }

  function readPendingFromForm() {
    state.pending.search = String((el("dg-np-search") || {}).value || "").trim();
    state.pending.status = String((el("dg-np-f-status") || {}).value || "");
    state.pending.priority = String((el("dg-np-f-priority") || {}).value || "");
    state.pending.brand = String((el("dg-np-f-brand") || {}).value || "").trim();
    state.pending.responsible = String((el("dg-np-f-responsible") || {}).value || "");
    state.pending.manager = String((el("dg-np-f-manager") || {}).value || "");
  }

  function commitFilters() {
    readPendingFromForm();
    state.search = state.pending.search;
    state.status = state.pending.status;
    state.priority = state.pending.priority;
    state.brand = state.pending.brand;
    state.responsible = state.pending.responsible;
    state.manager = state.pending.manager;
    state.offset = 0;
    load();
  }

  function resetFilters() {
    el("dg-np-search").value = "";
    el("dg-np-f-status").value = "";
    el("dg-np-f-priority").value = "";
    el("dg-np-f-brand").value = "";
    el("dg-np-f-responsible").value = "";
    el("dg-np-f-manager").value = "";
    commitFilters();
  }

  function patchRow(id, payload) {
    return fetch("/api/exports/new-products/" + id, {
      method: "PATCH",
      credentials: "same-origin",
      headers: authHeaders(true),
      body: JSON.stringify(payload),
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
        return j;
      });
    });
  }

  /** Очередь PATCH по id — галочки «Маркеты»+«Комплект» не улетают параллельно. */
  var patchQueues = Object.create(null);
  function patchRowQueued(id, payload) {
    var key = String(id);
    var prev = patchQueues[key] || Promise.resolve();
    var next = prev
      .catch(function () {
        /* previous error already handled by caller */
      })
      .then(function () {
        return patchRow(id, payload);
      });
    patchQueues[key] = next;
    return next;
  }

  function missingKeys(row) {
    var list = (row && row.missing_required) || [];
    var set = {};
    list.forEach(function (m) {
      if (m && m.key) set[m.key] = m.label || m.key;
    });
    return set;
  }

  function markRequired(td, key, missMap) {
    if (!td) return;
    if (missMap && missMap[key]) {
      td.classList.add("dg-np-required-empty");
      td.setAttribute("data-dg-np-miss", "не заполнено");
    } else {
      td.classList.remove("dg-np-required-empty");
      td.removeAttribute("data-dg-np-miss");
    }
  }

  function notifyMissing(row, opts) {
    var o = opts || {};
    var miss = (row && row.missing_required) || [];
    if (!miss.length) {
      if (o.readyToast && window.DatagonNotify && window.DatagonNotify.toast) {
        window.DatagonNotify.toast({
          type: "success",
          message: "Все обязательные поля заполнены → «Не добавлен»",
        });
      }
      return;
    }
    var labels = miss.map(function (m) {
      return m.label || m.key;
    });
    var msg = "Не заполнены: " + labels.join(", ");
    if (window.DatagonNotify && window.DatagonNotify.toast) {
      window.DatagonNotify.toast({ type: "warning", message: msg });
    }
  }

  function applyPatched(row, j) {
    Object.assign(row, j.data || {});
    // всегда перерисовываем: снять/поставить «не заполнено» и обновить статус
    renderTable();
    if (row.missing_required && row.missing_required.length) {
      notifyMissing(row);
    } else if (j.auto_status_changed && row.status === "not_added") {
      notifyMissing(row, { readyToast: true });
    }
    return row;
  }

  function appendSortableTh(tr, c) {
    var th = document.createElement("th");
    th.textContent = c.label;
    if (c.sort) {
      th.className = "dg-np-sortable";
      if (state.sort_by === c.key) {
        th.classList.add(state.sort_dir === "asc" ? "sorted-asc" : "sorted-desc");
      }
      th.addEventListener("click", function () {
        if (window.getSelection && String(window.getSelection()).trim()) return;
        if (state.sort_by === c.key) state.sort_dir = state.sort_dir === "asc" ? "desc" : "asc";
        else {
          state.sort_by = c.key;
          state.sort_dir = c.key === "priority" ? "asc" : "desc";
        }
        load();
      });
    }
    tr.appendChild(th);
  }

    var thead = el("dg-np-thead");

      cols = [
        { key: "id", label: "ID", sort: true },
        { key: "product_manager_name", label: "Менеджер товара", sort: true },
        { key: "created_at", label: "Дата добавления", sort: true },
        { key: "priority", label: "Приоритет", sort: true },
        { key: "responsible_name", label: "Ответственный", sort: true },
        { key: "product_code", label: "Код", sort: true },
        { key: "article", label: "Артикул", sort: true },
        { key: "title", label: "Название для маркета", sort: true },
        { key: "barcode", label: "Штрихкод", sort: false },
        { key: "price_markets", label: "Цена на маркеты", sort: true },
        { key: "status", label: "Статус", sort: true },
        { key: "placement", label: "Размещение", sort: false },
        { key: "comment", label: "Комментарий", sort: false },
        { key: "infographic", label: "Инфографика", sort: true },
        { key: "photo", label: "Фото", sort: true },
        { key: "placement_date", label: "Дата размещения", sort: true },
        { key: "length_cm", label: "Длина, см", sort: false },
        { key: "width_cm", label: "Ширина, см", sort: false },
        { key: "height_cm", label: "Высота, см", sort: false },
        { key: "weight_kg", label: "Вес, кг", sort: false },
        { key: "vat", label: "НДС", sort: false },
        { key: "ru_url", label: "Ссылка на РУ", sort: false },
        { key: "_actions", label: "", sort: false },
      ];
    } else {
      cols = [
        { key: "id", label: "ID", sort: true },
        { key: "product_manager_name", label: "Менеджер товара", sort: true },
        { key: "created_at", label: "Дата в таблице", sort: true },
        { key: "responsible_name", label: "Ответственный", sort: true },
        { key: "sell_on_markets", label: "Маркеты", sort: false },
        { key: "has_kits", label: "Комплект", sort: false },
        { key: "article", label: "Артикул", sort: true },
        { key: "title", label: "Название", sort: true },
        { key: "price_almamed", label: "Цена Альмамед", sort: true },
        { key: "supplier_url", label: "Ссылка поставщика", sort: false },
        { key: "brand", label: "Бренд", sort: true },
        { key: "priority", label: "Приоритет", sort: true },
        { key: "status", label: "Статус", sort: true },
        { key: "comment", label: "Комментарий", sort: false },
        { key: "almamed_added_at", label: "Дата на Альмамед", sort: true },
        { key: "almamed_url", label: "Ссылка Альмамед", sort: false },
        { key: "_actions", label: "", sort: false },
      ];
    }
    cols.forEach(function (c) {
      appendSortableTh(tr, c);

  var confirmState = { resolve: null };

  function closeNpConfirm(ok) {
    var overlay = el("dg-np-confirm-overlay");
    if (overlay) {
      overlay.style.display = "none";
      overlay.setAttribute("aria-hidden", "true");
    }
    var resolve = confirmState.resolve;
    confirmState.resolve = null;
    if (typeof resolve === "function") resolve(!!ok);
  }

  function openNpConfirm(opts) {
    var o = opts || {};
    return new Promise(function (resolve) {
      if (confirmState.resolve) closeNpConfirm(false);
      confirmState.resolve = resolve;
      var title = el("dg-np-confirm-title");
      var text = el("dg-np-confirm-text");
      var okBtn = el("dg-np-confirm-ok");
      if (title) title.textContent = o.title || "Удалить?";
      if (text) text.textContent = o.message || "Действие нельзя отменить.";
      if (okBtn) {
        okBtn.textContent = o.okLabel || "Удалить";
        if (o.notifyStart) okBtn.setAttribute("data-dg-notify-start", o.notifyStart);
        else okBtn.setAttribute("data-dg-notify-start", "Удаляем…");
      }
      var overlay = el("dg-np-confirm-overlay");
      if (!overlay) {
        resolve(window.confirm(o.message || "Удалить?"));
        return;
      }
      overlay.style.display = "flex";
      overlay.setAttribute("aria-hidden", "false");
      if (okBtn) {
        try {
          okBtn.focus();
        } catch (_) {}
      }
    });
  }

  function bindNpConfirmUi() {
    var cancel = el("dg-np-confirm-cancel");
    var ok = el("dg-np-confirm-ok");
    var backdrop = el("dg-np-confirm-backdrop");
    if (cancel) cancel.addEventListener("click", function () { closeNpConfirm(false); });
    if (ok) ok.addEventListener("click", function () { closeNpConfirm(true); });
    if (backdrop) backdrop.addEventListener("click", function () { closeNpConfirm(false); });
    document.addEventListener("keydown", function (e) {
      var overlay = el("dg-np-confirm-overlay");
      if (!overlay || overlay.style.display === "none") return;
      if (e.key === "Escape") {
        e.preventDefault();
        closeNpConfirm(false);
      } else if (e.key === "Enter") {
        e.preventDefault();
        closeNpConfirm(true);
      }
    });
  }

  function makeDeleteActions(row, opts) {
    var options = opts || {};
    var tdAct = document.createElement("td");
    tdAct.className = "text-nowrap dg-np-actions";
    if (options.addKit) {
      var bKit = document.createElement("button");

      bKit.setAttribute("data-dg-notify-start", "Добавляем комплект…");
      bKit.addEventListener("click", function () {
        var run = function () {
          return kitApi(row.id, "POST", "", { title: "" }).then(function (j) {
            if (!Array.isArray(row.kits)) row.kits = [];
            if (j.data) row.kits.push(j.data);

            if (window.DatagonNotify && window.DatagonNotify.toast) {
              window.DatagonNotify.toast({ type: "success", message: "Комплект добавлен" });
            }
          });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun) {
          window.DatagonNotify.busyRun(bKit, run).catch(function (e) {
            if (window.DatagonNotify && window.DatagonNotify.toast) {
              window.DatagonNotify.toast({ type: "danger", message: e.message || "Ошибка" });
            }
          });
        } else {
          run().catch(function (e) {
            alert(e.message || "Ошибка");
          });
        }
      });
      tdAct.appendChild(bKit);
    }
    var bDel = document.createElement("button");
    bDel.type = "button";
    bDel.className = "btn btn-outline-danger btn-sm";
    bDel.textContent = "×";
    bDel.title = "Удалить";
    bDel.setAttribute("data-dg-no-activity", "1");
    bDel.addEventListener("click", function () {
      var label = String(row.title || row.article || row.product_code || "").trim();
      var msg =
        "Удалить запись №" +
        rowDisplayId(row) +
        (label ? " («" + label + "»)" : "") +
        "? Действие нельзя отменить.";
      openNpConfirm({ title: "Удалить товар?", message: msg }).then(function (ok) {
        if (!ok) return;
        var run = function () {
          return fetch("/api/exports/new-products/" + row.id, {
            method: "DELETE",
            credentials: "same-origin",
            headers: authHeaders(false),
          })
            .then(function (r) {
              return r.json().then(function (j) {
                if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
              });
            })
            .then(function () {
              if (window.DatagonNotify && window.DatagonNotify.toast) {
                window.DatagonNotify.toast({ type: "success", message: "Удалено" });
              }
              load();
            });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun) {
          window.DatagonNotify.busyRun(bDel, run).catch(function (e) {
            if (window.DatagonNotify && window.DatagonNotify.toast) {
              window.DatagonNotify.toast({ type: "danger", message: e.message || "Ошибка" });
            }
          });
        } else {
          run().catch(function (e) {
            alert(e.message || "Ошибка удаления");
          });
        }
      });
    });
    tdAct.appendChild(bDel);
    return tdAct;
  }

  function kitApi(parentId, method, pathSuffix, body) {
    var url = "/api/exports/new-products/" + parentId + "/kits" + (pathSuffix || "");
    var opts = {
      method: method || "GET",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
    };
    if (body != null) opts.body = JSON.stringify(body);
    return fetch(url, opts).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || (j && j.success === false)) {
          throw new Error((j && (j.error || j.message)) || "HTTP " + r.status);
        }
        return j;
      });
    });
  }

  function mutedCell(text, opts) {
    var td = document.createElement("td");
    td.className = "dg-np-cell dg-np-kit-inherited";
    if (opts && opts.title) td.title = opts.title;
    var span = document.createElement("span");
    span.className = "text-muted small";
    span.textContent = text == null || text === "" ? "—" : String(text);
    td.appendChild(span);
    return td;
  }

  function bindKitFieldSave(inp, parent, kit, field, opts) {
    var o = opts || {};
    inp.addEventListener("change", function () {
      var payload = {};
      if (o.price) {
        var n = parsePriceInput(inp.value);
        if (String(inp.value || "").trim() !== "" && n == null) {
          if (window.DatagonNotify && window.DatagonNotify.toast) {
            window.DatagonNotify.toast({ type: "warning", message: "Некорректная цена" });
          }
          return;
        }
        payload[field] = n;
        if (n != null) inp.value = fmtMoney(n);
      } else if (o.num) {
        var raw = String(inp.value || "").trim().replace(/\s/g, "").replace(",", ".");
        var nn = raw === "" ? null : Number(raw);
        if (raw !== "" && !Number.isFinite(nn)) {
          if (window.DatagonNotify && window.DatagonNotify.toast) {
            window.DatagonNotify.toast({ type: "warning", message: "Некорректное число" });
          }
          inp.value = kit[field] != null ? String(kit[field]) : "";
          return;
        }
        payload[field] = nn;
        if (nn != null) inp.value = String(nn);
      } else {
        var v = String(inp.value || "").trim();
        if (o.maxLen && v.length > o.maxLen) v = v.slice(0, o.maxLen);
        payload[field] = v;
      }
      kitApi(parent.id, "PATCH", "/" + kit.id, payload)
        .then(function (j) {
          if (j.data) Object.assign(kit, j.data);
          if (window.DatagonNotify && window.DatagonNotify.toast) {
            window.DatagonNotify.toast({ type: "success", message: "Комплект сохранён" });
          }
        })
        .catch(function (e) {
          if (window.DatagonNotify && window.DatagonNotify.toast) {
            window.DatagonNotify.toast({ type: "danger", message: e.message || "Ошибка" });
          }
        });
    });
  }

  function renderTable() {
    buildThead();
    var tbody = el("dg-np-tbody");
    tbody.replaceChildren();
    if (!state.rows.length) {
      var tr0 = document.createElement("tr");
      var td0 = document.createElement("td");
      td0.colSpan = colCount();
      td0.className = "text-muted";
      td0.textContent = state.loading ? "Загрузка…" : "Нет записей — добавьте товар или смените фильтры";
      tr0.appendChild(td0);
      tbody.appendChild(tr0);
      updatePager();
      return;
    }
    state.rows.forEach(function (row) {
      if (state.channel === "marketplaces") {
        tbody.appendChild(renderMarketsRow(row));
        if (row.has_kits && Array.isArray(row.kits)) {
          row.kits.forEach(function (kit) {
            tbody.appendChild(renderMarketsKitRow(row, kit));
          });
        }
      } else {
        tbody.appendChild(renderAlmamedRow(row));
      }
    });
    updatePager();
    refreshIncompleteBanner();
  }

  function refreshIncompleteBanner() {
    var n = 0;
    (state.rows || []).forEach(function (r) {
      if (r.missing_required && r.missing_required.length) n += 1;
    });
    var box = el("dg-np-action-log");
    if (!box) return;
    if (!n) {
      if (box.dataset.dgNpAutoWarn === "1") {
        box.classList.add("d-none");
        box.dataset.dgNpAutoWarn = "";
      }
      return;
    }
    if (!box.classList.contains("d-none") && box.dataset.dgNpAutoWarn !== "1") return;
    var fieldsHint =
      state.channel === "marketplaces"
        ? "код, артикул, название, штрихкод, цена, длина/ширина/высота/вес, НДС, ссылка на РУ, приоритет"
        : "артикул, название, цена, ссылка, приоритет";
    showLog(
      "warning",
      "На странице <b>" +
        n +
        "</b> строк(и) с незаполненными обязательными полями (" +
        fieldsHint +
        "). Ячейки подсвечены."
    );
    box.dataset.dgNpAutoWarn = "1";
  }

  function updatePager() {
    var pages = Math.max(1, Math.ceil(state.total / state.limit) || 1);
    var page = Math.floor(state.offset / state.limit) + 1;
    var shown = state.rows.length;
    var st = el("dg-np-page-status");
    if (st) {
      st.textContent =
        "Найдено: " + state.total + "; страница " + page + "/" + pages + "; показано: " + shown;
    }
    var prev = el("dg-np-prev");
    var next = el("dg-np-next");
    if (prev) prev.disabled = state.offset <= 0;
    if (next) next.disabled = state.offset + state.limit >= state.total;
  }

  function load() {
    state.loading = true;
    renderTable();
    var p = new URLSearchParams();
    p.set("channel", state.channel);
    p.set("limit", String(state.limit));
    p.set("offset", String(state.offset));
    p.set("sort_by", state.sort_by);
    p.set("sort_dir", state.sort_dir);
    if (state.search) p.set("search", state.search);
    if (state.status) p.set("status", state.status);
    if (state.priority) p.set("priority", state.priority);
    if (state.brand) p.set("brand", state.brand);
    if (state.responsible) p.set("responsible", state.responsible);
    if (state.manager) p.set("manager", state.manager);
    return fetch("/api/exports/new-products?" + p.toString(), {
      credentials: "same-origin",
      headers: authHeaders(false),
    })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
          return j;
        });
      })
      .then(function (j) {
        state.rows = j.data || [];
        state.total = Number(j.total || 0);
        state.loading = false;
        renderTable();
      })
      .catch(function (e) {
        state.loading = false;
        state.rows = [];
        renderTable();
        showLog("danger", e.message || "Ошибка загрузки");
      });
  }

      .catch(function () {
        state.managers = [];
        state.responsibles = [];
        state.assignees = [];

  }

  function syncMarketsQueue() {
    var t0 = Date.now();
    var tick = null;
    var filtersLine = "Канал: <b>Размещение на маркеты</b>";
    showLog(
      "warning",
      "Обновление очереди маркетов…<br>" +
        filtersLine +
        "<br>Подтягиваем из Альмамед (transferred), МС и снапшотов Ozon/WB/ЯМ<br>" +
        '<span id="dg-np-sync-tick">идёт, прошло 0 с…</span>'
    );
    tick = setInterval(function () {
      var elTick = el("dg-np-sync-tick");
      if (elTick) {
        elTick.textContent = "идёт, прошло " + Math.round((Date.now() - t0) / 1000) + " с…";
      }
    }, 1000);

    var run = function () {
      return fetch("/api/exports/new-products/sync-markets-queue", {
        method: "POST",
        credentials: "same-origin",
        headers: authHeaders(true),
        body: JSON.stringify({}),
      })
        .then(function (r) {
          return r.json().then(function (j) {
            if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
            return j;
          });
        })
        .then(function (j) {
          if (tick) clearInterval(tick);
          var sec = j.duration_sec != null ? j.duration_sec : Math.round((Date.now() - t0) / 1000);
          showLog(
            "success",
            "Итог обновления очереди маркетов<br>" +
              filtersLine +
              "<br>Новых из Альмамед: <b>" +
              (j.from_almamed || 0) +
              "</b>; обновлено строк: <b>" +
              (j.updated || 0) +
              "</b>; уже на всех МП (пропуск): <b>" +
              (j.skipped_all_mp || 0) +
              "</b>; длительность: <b>" +
              sec +
              "</b> с"
          );
          load();
        })
        .catch(function (e) {
          if (tick) clearInterval(tick);
          showLog("danger", "Ошибка обновления очереди: " + (e.message || "unknown") + "<br>" + filtersLine);
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun) {
      window.DatagonNotify.busyRun(el("dg-np-sync-markets"), run);
    } else run();
  }

  function removePlaced() {
    if (
      !window.confirm(
        "Убрать из таблицы все строки со статусом «Добавлен» (размещение на маркетах)?\nДелайте после проверки."
      )
    ) {
      return;
    }
    var t0 = Date.now();
    var tick = null;
    var filtersLine = "Канал: <b>Размещение на маркеты</b>; статус: <b>Добавлен</b>";

    showLog("warning", "Preflight: считаем строки «Добавлен»…<br>" + filtersLine);

    var run = function () {
      return fetch("/api/exports/new-products/remove-placed", {
        method: "POST",
        credentials: "same-origin",
        headers: authHeaders(true),
        body: JSON.stringify({ dry_run: 1 }),
      })
        .then(function (r) {
          return r.json().then(function (j) {
            if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
            return j;
          });
        })
        .then(function (pre) {
          var would = Number(pre.would_remove != null ? pre.would_remove : pre.total || 0);
          showLog(
            "warning",
            "Убираем размещённые…<br>" +
              filtersLine +
              "<br>К удалению из таблицы: <b>" +
              would +
              "</b><br>" +
              '<span id="dg-np-remove-tick">идёт, прошло 0 с…</span>'
          );
          tick = setInterval(function () {
            var elTick = el("dg-np-remove-tick");
            if (elTick) {
              elTick.textContent = "идёт, прошло " + Math.round((Date.now() - t0) / 1000) + " с…";
            }
          }, 1000);
          if (!would) {
            if (tick) clearInterval(tick);
            showLog("info", "Нет товаров со статусом «Добавлен» для удаления из таблицы.<br>" + filtersLine);
            return null;
          }
          return fetch("/api/exports/new-products/remove-placed", {
            method: "POST",
            credentials: "same-origin",
            headers: authHeaders(true),
            body: JSON.stringify({}),
          }).then(function (r) {
            return r.json().then(function (j) {
              if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
              return j;
            });
          });
        })
        .then(function (j) {
          if (tick) clearInterval(tick);
          if (!j) return;
          var sec = j.duration_sec != null ? j.duration_sec : Math.round((Date.now() - t0) / 1000);
          showLog(
            "success",
            "Итог «Убрать размещенные»<br>" +
              filtersLine +
              "<br>Всего «Добавлен»: <b>" +
              (j.total || 0) +
              "</b>; убрано из таблицы ✓: <b>" +
              (j.removed || 0) +
              "</b>; длительность: <b>" +
              sec +
              "</b> с"
          );
          load();
        })
        .catch(function (e) {
          if (tick) clearInterval(tick);
          showLog("danger", "Ошибка: " + (e.message || "unknown") + "<br>" + filtersLine);
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun) {
      window.DatagonNotify.busyRun(el("dg-np-remove-placed"), run);
    } else run();
  }

  function distribute() {
    if (
      !window.confirm(
        "Раздать поровну строки без ответственного между контент-менеджерами?"
      )
    ) {
      return;
    }
    var t0 = Date.now();
    showLog(
      "warning",
      "Раздаём ответственных… канал: <b>" +
        (state.channel === "marketplaces" ? "Размещение на маркеты" : "Альмамед") +
        "</b>, только без ответственного."
    );
    var run = function () {
      return fetch("/api/exports/new-products/distribute", {
        method: "POST",
        credentials: "same-origin",
        headers: authHeaders(true),
        body: JSON.stringify({ channel: state.channel, scope: "unassigned" }),
      })
        .then(function (r) {
          return r.json().then(function (j) {
            if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
            return j;
          });
        })
        .then(function (j) {
          var sec = Math.round((Date.now() - t0) / 1000);
          showLog(
            "success",
            "Раздано: <b>" +
              (j.assigned || 0) +
              "</b> строк на <b>" +
              (j.users || 0) +
              "</b> пользователей · " +
              sec +
              " с"
          );
          load();
        })
        .catch(function (e) {
          showLog("danger", e.message || "Ошибка раздачи");
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun) {
      window.DatagonNotify.busyRun(el("dg-np-distribute"), run);
    } else run();
  }

  function bindCollapse(btnId, bodyId, key) {
    var btn = el(btnId);
    var body = el(bodyId);
    if (!btn || !body) return;
    function apply(collapsed) {
      body.style.display = collapsed ? "none" : "";
      btn.textContent = collapsed ? "Развернуть" : "Свернуть";
      try {
        localStorage.setItem(key, collapsed ? "1" : "0");
      } catch (_) {}
    }
    var start = false;
    try {
      start = localStorage.getItem(key) === "1";
    } catch (_) {}
    apply(start);
    btn.addEventListener("click", function () {
      apply(body.style.display !== "none");
    });
  }

  function setChannel(ch, opts) {
    var o = opts || {};
    state.channel = ch === "marketplaces" ? "marketplaces" : "almamed";
    try {
      localStorage.setItem(CHANNEL_KEY, state.channel);
    } catch (_) {}
    state.offset = 0;
    syncTabUi();

    if (o.focusChannelNum != null && Number.isFinite(Number(o.focusChannelNum))) {
      var q = "id:" + Number(o.focusChannelNum);
      if (el("dg-np-search")) el("dg-np-search").value = q;
      if (el("dg-np-f-status")) el("dg-np-f-status").value = "";
      if (el("dg-np-f-priority")) el("dg-np-f-priority").value = "";
      if (el("dg-np-f-brand")) el("dg-np-f-brand").value = "";
      if (el("dg-np-f-responsible")) el("dg-np-f-responsible").value = "";
      if (el("dg-np-f-manager")) el("dg-np-f-manager").value = "";
      // развернуть фильтры, чтобы было видно активный поиск
      try {
        var filtersBody = el("dg-np-filters-body");
        var filtersToggle = el("dg-np-filters-toggle");
        if (filtersBody && filtersBody.style.display === "none") {
          filtersBody.style.display = "";
          if (filtersToggle) filtersToggle.textContent = "Свернуть";
          localStorage.setItem(FILTERS_KEY, "0");
        }
      } catch (_) {}
      commitFilters();
      return;
    }

    load();
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  var logState = { productId: null, label: "", limit: 100, offset: 0, total: 0 };

  function npLogActionLabel(action) {
    var map = {
      set: "Изменение",
      create: "Создание",
      delete: "Удаление",
      kit_add: "Комплект +",
      kit_set: "Комплект",
      kit_delete: "Комплект −",
    };
    return map[action] || action || "set";
  }

  function closeNpLog() {
    var overlay = el("dg-np-log-overlay");
    if (!overlay) return;
    overlay.style.display = "none";
    overlay.setAttribute("aria-hidden", "true");
  }

  function openNpLog(productId, label) {
    logState.productId = productId;
    logState.label = label || "#" + productId;
    logState.offset = 0;
    var overlay = el("dg-np-log-overlay");
    var titleEl = el("dg-np-log-title");
    var subEl = el("dg-np-log-subtitle");
    if (titleEl) titleEl.textContent = "Журнал изменений #" + productId;
    if (subEl) subEl.textContent = logState.label;
    if (overlay) {
      overlay.style.display = "flex";
      overlay.setAttribute("aria-hidden", "false");
    }
    loadNpLog();
  }

  function renderNpLogPager() {
    var pages = Math.max(1, Math.ceil((logState.total || 0) / logState.limit) || 1);
    var page = Math.floor(logState.offset / logState.limit) + 1;
    var prevDisabled = logState.offset <= 0 ? " disabled" : "";
    var nextDisabled = logState.offset + logState.limit >= logState.total ? " disabled" : "";
    return (
      '<div class="dg-np-log-pager d-flex align-items-center justify-content-between gap-2 px-3 py-2 border-top">' +
      '<span class="small text-muted">Найдено: ' +
      logState.total +
      "; страница " +
      page +
      "/" +
      pages +
      "</span>" +
      '<div class="btn-group">' +
      '<button type="button" class="btn btn-sm btn-outline-secondary dg-np-log-prev"' +
      prevDisabled +
      ">Назад</button>" +
      '<button type="button" class="btn btn-sm btn-outline-secondary dg-np-log-next"' +
      nextDisabled +
      ">Вперёд</button>" +
      "</div></div>"
    );
  }

  function loadNpLog() {
    var body = el("dg-np-log-body");
    if (!body || !logState.productId) return;
    body.innerHTML = '<div class="text-muted small text-center py-4">Загрузка журнала…</div>';
    var qs = new URLSearchParams();
    qs.set("limit", String(logState.limit));
    qs.set("offset", String(logState.offset));
    fetch("/api/exports/new-products/" + logState.productId + "/log?" + qs.toString(), {
      credentials: "same-origin",
      headers: authHeaders(false),
    })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok || (j && j.success === false)) {
            throw new Error((j && j.error) || "HTTP " + r.status);
          }
          return j;
        });
      })
      .then(function (j) {
        logState.total = Number(j.total || 0);
        var rows = j.rows || [];
        if (!rows.length) {
          body.innerHTML =
            '<div class="text-muted small text-center py-4">Журнал пуст: по этой строке ещё не было изменений.</div>' +
            renderNpLogPager();
          return;
        }
        var html =
          '<div class="table-responsive"><table class="table table-sm mb-0"><thead><tr>' +
          "<th>Когда</th><th>Кто</th><th>Действие</th><th>Поле</th><th>Было → Стало</th>" +
          "</tr></thead><tbody>";
        rows.forEach(function (r) {
          var when = r.changed_at
            ? String(r.changed_at).replace("T", " ").replace(/\.\d+Z?$/, "").slice(0, 19)
            : "—";
          var who = escapeHtml(r.changed_by_name || "—");
          var field = escapeHtml(r.field_label || r.field || "—");
          if (r.kit_id) field += ' <span class="text-muted">#kit' + r.kit_id + "</span>";
          var oldVal =
            r.old_value == null
              ? '<span class="text-muted">∅</span>'
              : '<span class="dg-np-log-old">' + escapeHtml(r.old_value) + "</span>";
          var newVal =
            r.new_value == null
              ? '<span class="text-muted">∅</span>'
              : '<span class="dg-np-log-new">' + escapeHtml(r.new_value) + "</span>";
          html +=
            "<tr>" +
            "<td class=\"text-nowrap small\">" +
            escapeHtml(when) +
            "</td>" +
            "<td>" +
            who +
            "</td>" +
            '<td><span class="badge bg-light text-dark border dg-np-log-action">' +
            escapeHtml(npLogActionLabel(r.action)) +
            "</span></td>" +
            "<td>" +
            field +
            "</td>" +
            "<td>" +
            oldVal +
            '<span class="dg-np-log-arrow">→</span>' +
            newVal +
            "</td>" +
            "</tr>";
        });
        html += "</tbody></table></div>" + renderNpLogPager();
        body.innerHTML = html;
      })
      .catch(function (e) {
        body.innerHTML =
          '<div class="text-danger small text-center py-4">' +
          escapeHtml(e.message || "Ошибка загрузки журнала") +
          "</div>";
      });
  }

  function bindNpLogUi() {
    document.addEventListener("click", function (ev) {
      var btn = ev.target && ev.target.closest && ev.target.closest(".dg-np-log-btn");
      if (btn) {
        ev.preventDefault();
        var id = parseInt(btn.getAttribute("data-dg-np-log-id") || "", 10);
        var label = btn.getAttribute("data-dg-np-log-label") || "";
        if (Number.isFinite(id) && id > 0) openNpLog(id, label);
        return;
      }
      var prev = ev.target && ev.target.closest && ev.target.closest(".dg-np-log-prev");
      if (prev && logState.productId) {
        logState.offset = Math.max(0, logState.offset - logState.limit);
        loadNpLog();
        return;
      }
      var next = ev.target && ev.target.closest && ev.target.closest(".dg-np-log-next");
      if (next && logState.productId) {
        if (logState.offset + logState.limit < logState.total) {
          logState.offset += logState.limit;
          loadNpLog();
        }
      }
    });
    var closeBtn = el("dg-np-log-close");
    if (closeBtn) closeBtn.addEventListener("click", closeNpLog);
    var refreshBtn = el("dg-np-log-refresh");
    if (refreshBtn) refreshBtn.addEventListener("click", loadNpLog);
    var backdrop = el("dg-np-log-backdrop");
    if (backdrop) backdrop.addEventListener("click", closeNpLog);
    document.addEventListener("keydown", function (ev) {
      if (ev.key !== "Escape") return;
      var overlay = el("dg-np-log-overlay");
      if (overlay && overlay.style.display !== "none") closeNpLog();
    });
  }

  function init() {
    try {
      var saved = localStorage.getItem(CHANNEL_KEY);
      if (saved === "marketplaces" || saved === "almamed") state.channel = saved;
    } catch (_) {}
    syncTabUi();
    bindCollapse("dg-np-filters-toggle", "dg-np-filters-body", FILTERS_KEY);
    bindCollapse("dg-np-table-toggle", "dg-np-table-body", TABLE_KEY);
    bindNpLogUi();
    bindNpConfirmUi();

    document.querySelectorAll("#dg-np-tabs [data-dg-np-channel]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setChannel(btn.getAttribute("data-dg-np-channel"));
      });
    });

    el("dg-np-apply").addEventListener("click", commitFilters);
    el("dg-np-reset").addEventListener("click", resetFilters);
    el("dg-np-add").addEventListener("click", addRow);
    el("dg-np-distribute").addEventListener("click", distribute);
    var btnSync = el("dg-np-sync-markets");
    if (btnSync) btnSync.addEventListener("click", syncMarketsQueue);
    var btnRemove = el("dg-np-remove-placed");
    if (btnRemove) btnRemove.addEventListener("click", removePlaced);
    el("dg-np-search").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        commitFilters();
      }
      if (e.key === "Escape") {
        el("dg-np-search").value = "";
        commitFilters();
      }
    });
    el("dg-np-page-size").addEventListener("change", function () {
      state.limit = parseInt(el("dg-np-page-size").value, 10) || 100;
      state.offset = 0;
      load();
    });
    el("dg-np-prev").addEventListener("click", function () {
      state.offset = Math.max(0, state.offset - state.limit);
      load();
    });
    el("dg-np-next").addEventListener("click", function () {
      state.offset = state.offset + state.limit;
      load();
    });

    loadAssignees().then(load);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
