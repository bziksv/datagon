  function currentCols() {
    return state.channel === "marketplaces" ? NP_COLS_MARKETS : NP_COLS_ALMAMED;
  }
  function defaultVisibleKeys() {
    return currentCols().map(function (c) {
      return c.key;
    });
  }
  function visibleColsKey() {
    return "dg.np.visible-cols.v1:" + state.channel;
  }
  function colWidthsKey() {
    return "dg.np.col-widths.v1:" + state.channel;
  }
  function visibleColsArray() {
    return currentCols()
      .map(function (c) {
        return c.key;
      })
      .filter(function (k) {
        return state.visibleCols.has(k);
      });
  }
  function colCount() {
    return visibleColsArray().length || 1;
  }
  function getColDef(key) {
    var cols = currentCols();
    for (var i = 0; i < cols.length; i++) {
      if (cols[i].key === key) return cols[i].defWidth || cols[i].minWidth || 100;
    }
    return 100;
  }
  function getColMin(key) {
    var cols = currentCols();
    for (var i = 0; i < cols.length; i++) {
      if (cols[i].key === key) return cols[i].minWidth || 60;
    }
    return 60;
  }
  function getColMeta(key) {
    var cols = currentCols();
    for (var i = 0; i < cols.length; i++) if (cols[i].key === key) return cols[i];
    return null;
  }
  function saveVisibleCols() {
    try {
      localStorage.setItem(visibleColsKey(), JSON.stringify(Array.from(state.visibleCols)));
    } catch (_) {}
  }
  function saveWidths() {
    try {
      localStorage.setItem(colWidthsKey(), JSON.stringify(state.columnWidths || {}));
    } catch (_) {}
  }
  function loadVisibleColsForChannel() {
    var allowed = new Set(defaultVisibleKeys());
    var loaded = null;
    try {
      loaded = JSON.parse(localStorage.getItem(visibleColsKey()) || "null");
    } catch (_) {
      loaded = null;
    }
    var next = new Set();
    if (Array.isArray(loaded) && loaded.length) {
      loaded.forEach(function (k) {
        if (allowed.has(k)) next.add(k);
      });
    }
    if (!next.size) next = new Set(defaultVisibleKeys());
    currentCols().forEach(function (c) {
      if (c.locked) next.add(c.key);
    });
    state.visibleCols = next;
  }
  function loadWidthsForChannel() {
    var out = {};
    try {
      var raw = JSON.parse(localStorage.getItem(colWidthsKey()) || "{}");
      if (raw && typeof raw === "object") out = raw;
    } catch (_) {}
    state.columnWidths = out;
  }
  function appendVisibleCells(tr, cells) {
    visibleColsArray().forEach(function (key) {
      if (cells[key]) tr.appendChild(cells[key]);
    });
  }
  /** Оставляет в <tr> только видимые ячейки (порядок = currentCols). */
  function pruneHiddenCells(tr) {
    var cols = currentCols();
    var keep = [];
    for (var i = 0; i < cols.length; i++) {
      var td = tr.cells[i];
      if (!td) continue;
      if (state.visibleCols.has(cols[i].key)) keep.push(td);
    }
    while (tr.firstChild) tr.removeChild(tr.firstChild);
    keep.forEach(function (td) {
      tr.appendChild(td);
    });
  }
  function resolvedColWidthPx(key) {
    var w = Number(state.columnWidths[key]);
    if (!Number.isFinite(w) || w <= 0) w = getColDef(key);
    return Math.max(getColMin(key), Math.min(700, Math.round(w)));
  }

  /** Ширины через <colgroup> + th/td (как shop/moysklad): шапка и тело всегда в одной колонке. */
  function applyColumnWidths() {
    var table = el("dg-np-table");
    var thead = el("dg-np-thead");
    var tbody = el("dg-np-tbody");
    if (!table || !thead) return;
    var visibleKeys = visibleColsArray();
    var existing = table.querySelector(":scope > colgroup");
    if (existing) existing.parentNode.removeChild(existing);
    var cg = document.createElement("colgroup");
    visibleKeys.forEach(function (key) {
      var col = document.createElement("col");
      var px = resolvedColWidthPx(key) + "px";
      col.style.width = px;
      col.setAttribute("data-col-key", key);
      cg.appendChild(col);
    });
    table.insertBefore(cg, table.firstElementChild);

    var headRow = thead.rows && thead.rows[0];
    if (headRow) {
      visibleKeys.forEach(function (key, idx) {
        var th = headRow.cells[idx];
        if (!th) return;
        var px = resolvedColWidthPx(key) + "px";
        th.style.width = px;
        th.style.minWidth = px;
        th.style.maxWidth = px;
      });
    }
    if (tbody) {
      Array.prototype.forEach.call(tbody.rows, function (tr) {
        if (!tr.cells) return;
        visibleKeys.forEach(function (key, idx) {
          var td = tr.cells[idx];
          if (!td) return;
          var px = resolvedColWidthPx(key) + "px";
          td.style.width = px;
          td.style.minWidth = px;
          td.style.maxWidth = px;
        });
      });
    }
  }

  function getStatusOpts() {

  function authHeaders(json) {

    if (json) h["Content-Type"] = "application/json";

  function el(id) {

  function showLog(kind, html) {

  function fmtDt(v) {
    if (!v) return "—";
    try {
      var d = new Date(v);
      if (isNaN(d.getTime())) return String(v);
      return d.toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" });
    } catch (_) {
      return String(v);
    }
  }

  function fmtMoney(v) {
    if (v == null || v === "" || !Number.isFinite(Number(v))) return "";
    var n = Number(v);
    if (window.DatagonFmt && window.DatagonFmt.formatNumber) {
      if (Math.abs(n - Math.round(n)) < 1e-9) {
        return window.DatagonFmt.formatInteger(n);
      }
      return window.DatagonFmt.formatNumber(n, { maxFractionDigits: 2, minFractionDigits: 0 });
    }
    var abs = Math.abs(Math.round(n));
    var s = String(abs).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (n < 0 ? "-" : "") + s;
  }

  function parsePriceInput(raw) {
    if (window.DatagonFmt && window.DatagonFmt.parseNumberInput) {
      return window.DatagonFmt.parseNumberInput(raw);
    }
    var s = String(raw == null ? "" : raw).trim();
    if (!s) return null;
    s = s.replace(/\s/g, "").replace(",", ".");
    var n = Number(s);
    return Number.isFinite(n) ? n : null;
  }

  /** Живой формат тысяч пробелами: 1 → 10 → 100 → 1 000 → 10 000 */
  function formatPriceTyping(raw) {
    var s = String(raw == null ? "" : raw);
    if (!s.trim()) return "";
    var neg = /^\s*-/.test(s);
    s = s.replace(/[^\d.,]/g, "");
    if (!s) return neg ? "-" : "";
    var sep = s.indexOf(",") >= 0 ? "," : s.indexOf(".") >= 0 ? "." : "";
    var intPart = s;
    var frac = "";
    if (sep) {
      var i = s.indexOf(sep);
      intPart = s.slice(0, i);
      frac = s.slice(i + 1).replace(/\D/g, "").slice(0, 2);
    }
    intPart = intPart.replace(/\D/g, "");
    if (!intPart && !frac && !sep) return neg ? "-" : "";
    var formatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    if (sep) formatted += "," + frac;
    return (neg ? "-" : "") + formatted;
  }

  function bindPriceLiveFormat(inp) {
    inp.addEventListener("input", function () {
      var start = inp.selectionStart;
      var before = String(inp.value || "");
      var next = formatPriceTyping(before);
      if (next === before) return;
      var digitsBefore = before.slice(0, start).replace(/\D/g, "").length;
      inp.value = next;
      var pos = 0;
      var seen = 0;
      while (pos < next.length && seen < digitsBefore) {
        if (/\d/.test(next.charAt(pos))) seen += 1;
        pos += 1;
      }
      try {
        inp.setSelectionRange(pos, pos);
      } catch (_) {}
    });
  }

  function copyText(text) {
    var t = String(text == null ? "" : text);
    if (!t) return;
    var done = function () {
      if (window.DatagonNotify && window.DatagonNotify.toast) {
        window.DatagonNotify.toast({ type: "success", message: "Скопировано" });
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done).catch(function () {
        fallbackCopy(t);
        done();
      });
    } else {
      fallbackCopy(t);
      done();
    }
  }

  function fallbackCopy(t) {
    var ta = document.createElement("textarea");
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
    } catch (_) {}
    document.body.removeChild(ta);
  }

  function makeCopyCell(text, opts) {
    var o = opts || {};
    var td = document.createElement("td");
    td.className = "dg-np-cell" + (o.extraClass ? " " + o.extraClass : "");
    var raw = text == null || text === "" ? "" : String(text);
    var valueNode;
    if (o.href && raw) {
      valueNode = document.createElement("a");
      valueNode.href = o.href;
      valueNode.target = "_blank";
      valueNode.rel = "noopener noreferrer";
      valueNode.className =
        "dg-np-cell-text dg-np-readonly-link dg-np-click-copy" + (o.wrap ? " dg-np-wrap" : "");
      valueNode.textContent = raw;
      valueNode.title = "Клик — копировать; Ctrl+клик — открыть";
      valueNode.setAttribute("data-dg-no-activity", "1");
    } else {
      valueNode = document.createElement("span");
      valueNode.className = "dg-np-cell-text" + (raw ? " dg-np-click-copy" : "") + (o.wrap ? " dg-np-wrap" : "");
      valueNode.textContent = raw ? raw : "—";
      valueNode.title = raw ? "Клик — копировать" : "";
    }
    if (raw) {
      valueNode.addEventListener("click", function (e) {
        // Выделение текста — не мешаем обычному копированию Cmd/Ctrl+C
        var sel = window.getSelection && window.getSelection();
        if (sel && String(sel.toString() || "").trim()) return;
        // Ссылка: Ctrl/Cmd/средняя кнопка — открыть как обычно
        if (o.href && (e.metaKey || e.ctrlKey || e.button === 1)) return;
        e.preventDefault();
        e.stopPropagation();
        copyText(raw);
      });
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn btn-outline-secondary btn-sm dg-np-copy";
      btn.textContent = "⧉";
      btn.title = "Копировать";
      btn.setAttribute("data-dg-no-activity", "1");
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        copyText(raw);
      });
      td.appendChild(valueNode);
      td.appendChild(btn);
    } else {
      td.appendChild(valueNode);
    }
    if (o.missKey) markRequired(td, o.missKey, o.missMap);
    if (o.row && o.field) attachFieldLog(td, o.row, o.field);
    return td;
  }

  /** Микрокнопка «лог» при наведении на ячейку — журнал только по этому полю. */
  function attachFieldLog(td, row, field) {
    if (!td || !row || !field) return td;
    td.classList.add("dg-np-field-cell");
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "dg-np-field-log-btn";
    btn.textContent = "лог";
    var flabel = FIELD_LOG_LABELS_UI[field] || field;
    btn.title = "Журнал изменений: " + flabel;
    btn.setAttribute("data-dg-np-log-id", String(row.id));
    btn.setAttribute("data-dg-np-log-field", field);
    btn.setAttribute("data-dg-np-log-field-label", flabel);
    btn.setAttribute(
      "data-dg-np-log-label",
      String(row.title || row.article || row.product_code || "#" + (row.channel_num != null ? row.channel_num : row.id))
    );
    btn.setAttribute("data-dg-no-activity", "1");
    td.appendChild(btn);
    return td;
  }

  function msOpenInWebHref(uuid, typeMs) {
    var u = String(uuid || "").trim();
    if (!u) return "";
    var t = String(typeMs || "").toLowerCase();
    if (t.indexOf("комплект") >= 0) {
      return "https://online.moysklad.ru/app/#bundle/edit?id=" + encodeURIComponent(u);
    }
    return "https://online.moysklad.ru/app/#good/edit?id=" + encodeURIComponent(u);
  }
  function msKindQueryParam(typeMs) {
    var t = String(typeMs || "").toLowerCase();
    if (t.indexOf("комплект") >= 0) return "bundle";
    return "product";
  }
  function closeMsDetailModal() {
    var ov = document.getElementById("dg-ms-detail-overlay");
    if (!ov) return;
    ov.style.display = "none";
    ov.setAttribute("aria-hidden", "true");
  }
  function trimMsLinkHref(raw) {
    return String(raw || "").replace(/[)\].,;:!?]+$/g, "");
  }
  function isDangerousMsLinkHref(href) {
    var low = String(href || "").trim().toLowerCase();
    return (
      low.indexOf("javascript:") === 0 ||
      low.indexOf("data:") === 0 ||
      low.indexOf("vbscript:") === 0
    );
  }
  function appendMsTextWithAutoLinks(el, raw) {
    var s = String(raw == null ? "" : raw);
    el.textContent = "";
    if (!s) return;
    var re =
      /(https?:\/\/[^\s<>"'`]+)|(www\.[^\s<>"'`]+)|([a-z][a-z0-9+.-]*:\/\/[^\s<>"'`]+)|(mailto:[^\s<>"'`]+)|(tel:\+?[^\s<>"'`]+)/gi;
    var last = 0;
    var m;
    while ((m = re.exec(s)) !== null) {
      if (m.index > last) el.appendChild(document.createTextNode(s.slice(last, m.index)));
      var full = m[0];
      var href = trimMsLinkHref(full);
      var display = href;
      if (!href) {
        last = m.index + full.length;
        continue;
      }
      if (/^www\./i.test(href)) href = "https://" + href;
      if (href.length < 4 || isDangerousMsLinkHref(href)) {
        el.appendChild(document.createTextNode(full));
        last = m.index + full.length;
        continue;
      }
      var a = document.createElement("a");
      a.href = href;
      a.className = "text-break";
      a.textContent = display;
      var low = href.toLowerCase();
      if (low.indexOf("http:") === 0 || low.indexOf("https:") === 0 || low.indexOf("ftp:") === 0) {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
      el.appendChild(a);
      last = m.index + full.length;
    }
    if (last < s.length) el.appendChild(document.createTextNode(s.slice(last)));
  }
  function renderMsDetailBlocks(blocks) {
    var body = document.getElementById("dg-ms-detail-body");
    if (!body) return;
    body.innerHTML = "";
    if (!blocks || !blocks.length) {
      body.textContent = "Нет данных.";
      return;
    }
    blocks.forEach(function (blk) {
      if (blk.title) {
        var h = document.createElement("div");
        h.className = "fw-semibold mb-2 mt-2";
        h.style.fontSize = "0.9rem";
        h.textContent = blk.title;
        body.appendChild(h);
      }
      var tbl = document.createElement("table");
      tbl.className = "dg-ms-detail-kv mb-3";
      (blk.rows || []).forEach(function (row) {
        var tr = document.createElement("tr");
        var th = document.createElement("th");
        th.textContent = row.label || "";
        var td = document.createElement("td");
        td.style.whiteSpace = "pre-wrap";

  function openMsDetailModal(uuid, code, nameText, typeMs) {

    var titleEl = document.getElementById("dg-ms-detail-title");
    var body = document.getElementById("dg-ms-detail-body");

    if (!ov || !titleEl || !body) return;

    body.innerHTML = '<p class="text-muted mb-0">Загрузка…</p>';

      openMs.classList.add("d-none");

    ov.setAttribute("aria-hidden", "false");
    var q =
      "/api/ms/detail/" + encodeURIComponent(u) + "?kind=" + encodeURIComponent(msKindQueryParam(typeMs));

      .then(function (r) {

      .then(function (x) {

  /** Хвост всех PATCH — при смене вкладки load() ждёт его (иначе вспышка старого ответственного). */
  var almamedPatchTail = Promise.resolve();
  var loadSeq = 0;
  function patchRow(id, payload) {
    var p = fetch("/api/exports/new-products/" + id, {
      method: "PATCH",
      credentials: "same-origin",
      headers: authHeaders(true),
      body: JSON.stringify(payload),
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
        return j;
      });
    });
    almamedPatchTail = almamedPatchTail
      .catch(function () {})
      .then(function () {
        return p;
      });
    return p;
  }

  /** Очередь PATCH по id — галочки «Маркеты»+«Комплект» не улетают параллельно. */
  var patchQueues = Object.create(null);
  function patchRowQueued(id, payload) {
    var key = String(id);
    var prev = patchQueues[key] || Promise.resolve();
    var next = prev
      .catch(function () {
        /* previous error already handled by caller */
      })
      .then(function () {
        return patchRow(id, payload);
      });
    patchQueues[key] = next;
    return next;
  }

        });

  }

  function notifyMissing(row, opts) {

        });

    });
    var msg = "Не заполнены: " + labels.join(", ");
    if (window.DatagonNotify && window.DatagonNotify.toast) {

  function applyPatched(row, j) {
    Object.assign(row, j.data || {});
    // Если уже ушли на другую вкладку / другой load — не перерисовываем чужой список по старой ссылке.
    var stillVisible = (state.rows || []).some(function (r) {
      return r && Number(r.id) === Number(row.id);
    });
    if (!stillVisible) return row;
    renderTable();
    if (row.missing_required && row.missing_required.length) {
      notifyMissing(row);
    } else if (j.auto_status_changed && row.status === "not_added") {
      notifyMissing(row, { readyToast: true });
    }
    return row;
  }

    inp.addEventListener("change", function () {
      var v = String(inp.value || "").trim();
      if (maxLen && v.length > maxLen) v = v.slice(0, maxLen);
      var payload = {};
      payload[field] = v;
      patchRow(row.id, payload)
        .then(function (j) {
          applyPatched(row, j);
          if (!(row.missing_required && row.missing_required.length) && window.DatagonNotify && window.DatagonNotify.toast) {
            window.DatagonNotify.toast({ type: "success", message: "Сохранено" });
          }

        .catch(function (e) {
          if (window.DatagonNotify && window.DatagonNotify.toast) {
            window.DatagonNotify.toast({ type: "danger", message: e.message || "Ошибка" });
          }
          load();
        });
    });
  }

    bindPriceLiveFormat(inp);

      payload[field] = n;
      patchRow(row.id, payload)
        .then(function (j) {
          applyPatched(row, j);
        })
        .catch(function (e) {
          if (window.DatagonNotify && window.DatagonNotify.toast) {
            window.DatagonNotify.toast({ type: "danger", message: e.message || "Ошибка" });

  var confirmState = { resolve: null };

  function closeNpConfirm(ok) {
    var overlay = el("dg-np-confirm-overlay");
    if (overlay) {
      overlay.style.display = "none";
      overlay.setAttribute("aria-hidden", "true");
    }
    var resolve = confirmState.resolve;
    confirmState.resolve = null;
    if (typeof resolve === "function") resolve(!!ok);
  }

  function openNpConfirm(opts) {
    var o = opts || {};
    return new Promise(function (resolve) {
      if (confirmState.resolve) closeNpConfirm(false);
      confirmState.resolve = resolve;
      var title = el("dg-np-confirm-title");
      var text = el("dg-np-confirm-text");
      var okBtn = el("dg-np-confirm-ok");
      if (title) title.textContent = o.title || "Удалить?";
      if (text) text.textContent = o.message || "Действие нельзя отменить.";
      if (okBtn) {
        okBtn.textContent = o.okLabel || "Удалить";
        if (o.notifyStart) okBtn.setAttribute("data-dg-notify-start", o.notifyStart);
        else okBtn.setAttribute("data-dg-notify-start", "Удаляем…");
      }
      var overlay = el("dg-np-confirm-overlay");
      if (!overlay) {
        resolve(window.confirm(o.message || "Удалить?"));
        return;
      }
      overlay.style.display = "flex";
      overlay.setAttribute("aria-hidden", "false");
      if (okBtn) {
        try {
          okBtn.focus();
        } catch (_) {}
      }
    });
  }

  function bindNpConfirmUi() {
    var cancel = el("dg-np-confirm-cancel");
    var ok = el("dg-np-confirm-ok");
    var backdrop = el("dg-np-confirm-backdrop");
    if (cancel) cancel.addEventListener("click", function () { closeNpConfirm(false); });
    if (ok) ok.addEventListener("click", function () { closeNpConfirm(true); });
    if (backdrop) backdrop.addEventListener("click", function () { closeNpConfirm(false); });
    document.addEventListener("keydown", function (e) {
      var overlay = el("dg-np-confirm-overlay");
      if (!overlay || overlay.style.display === "none") return;
      if (e.key === "Escape") {
        e.preventDefault();
        closeNpConfirm(false);
      } else if (e.key === "Enter") {
        e.preventDefault();
        closeNpConfirm(true);
      }
    });
  }

  function bindNumSave(inp, row, field) {
    inp.addEventListener("change", function () {
      var raw = String(inp.value || "").trim().replace(/\s/g, "").replace(",", ".");

      if (raw !== "" && !Number.isFinite(n)) {
        if (window.DatagonNotify && window.DatagonNotify.toast) {
          window.DatagonNotify.toast({ type: "warning", message: "Некорректное число" });
        }
        inp.value = row[field] != null ? String(row[field]) : "";
        return;
      }
      var payload = {};
      payload[field] = n;
      patchRow(row.id, payload)
        .then(function (j) {
          applyPatched(row, j);
          if (row[field] != null) inp.value = String(row[field]);

        .catch(function (e) {
          if (window.DatagonNotify && window.DatagonNotify.toast) {
            window.DatagonNotify.toast({ type: "danger", message: e.message || "Ошибка" });

          load();

  function kitApi(parentId, method, pathSuffix, body) {
    var url = "/api/exports/new-products/" + parentId + "/kits" + (pathSuffix || "");
    var opts = {
      method: method || "GET",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
    };
    if (body != null) opts.body = JSON.stringify(body);
    return fetch(url, opts).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || (j && j.success === false)) {
          throw new Error((j && (j.error || j.message)) || "HTTP " + r.status);
        }
        return j;
      });
    });
  }

  function mutedCell(text, opts) {
    var td = document.createElement("td");
    td.className = "dg-np-cell dg-np-kit-inherited";
    if (opts && opts.title) td.title = opts.title;
    var span = document.createElement("span");
    span.className = "text-muted small";
    span.textContent = text == null || text === "" ? "—" : String(text);
    td.appendChild(span);
    return td;
  }

  function bindKitFieldSave(inp, parent, kit, field, opts) {
    var o = opts || {};
    inp.addEventListener("change", function () {
      var payload = {};
      if (o.price) {
        var n = parsePriceInput(inp.value);
        if (String(inp.value || "").trim() !== "" && n == null) {
          if (window.DatagonNotify && window.DatagonNotify.toast) {
            window.DatagonNotify.toast({ type: "warning", message: "Некорректная цена" });
          }
          return;
        }
        payload[field] = n;
        if (n != null) inp.value = fmtMoney(n);
      } else if (o.num) {
        var raw = String(inp.value || "").trim().replace(/\s/g, "").replace(",", ".");
        var nn = raw === "" ? null : Number(raw);
        if (raw !== "" && !Number.isFinite(nn)) {
          if (window.DatagonNotify && window.DatagonNotify.toast) {
            window.DatagonNotify.toast({ type: "warning", message: "Некорректное число" });
          }
          inp.value = kit[field] != null ? String(kit[field]) : "";
          return;
        }
        payload[field] = nn;
        if (nn != null) inp.value = String(nn);
      } else {
        var v = String(inp.value || "").trim();
        if (o.maxLen && v.length > o.maxLen) v = v.slice(0, o.maxLen);
        payload[field] = v;
      }
      kitApi(parent.id, "PATCH", "/" + kit.id, payload)
        .then(function (j) {
          if (j.data) Object.assign(kit, j.data);
          if (window.DatagonNotify && window.DatagonNotify.toast) {
            window.DatagonNotify.toast({ type: "success", message: "Комплект сохранён" });
          }
        })
        .catch(function (e) {
          if (window.DatagonNotify && window.DatagonNotify.toast) {
            window.DatagonNotify.toast({ type: "danger", message: e.message || "Ошибка" });
          }
        });
    });
  }

  function renderTable() {
    buildThead();
    var tbody = el("dg-np-tbody");
    tbody.replaceChildren();
    if (!state.rows.length) {
      var tr0 = document.createElement("tr");
      var td0 = document.createElement("td");
      td0.colSpan = colCount();
      td0.className = "text-muted";
      td0.textContent = state.loading ? "Загрузка…" : "Нет записей — добавьте товар или смените фильтры";
      tr0.appendChild(td0);
      tbody.appendChild(tr0);
      updatePager();
      return;
    }
    state.rows.forEach(function (row) {
      if (state.channel === "marketplaces") {
        tbody.appendChild(renderMarketsRow(row));
        if (row.has_kits && Array.isArray(row.kits)) {
          row.kits.forEach(function (kit) {
            tbody.appendChild(renderMarketsKitRow(row, kit));
          });
        }
      } else {
        tbody.appendChild(renderAlmamedRow(row));
      }
    });
    updatePager();
    refreshIncompleteBanner();
    applyColumnWidths();
  }

  function refreshIncompleteBanner() {
    var n = 0;
    (state.rows || []).forEach(function (r) {
      if (r.missing_required && r.missing_required.length) n += 1;
    });
    var box = el("dg-np-action-log");
    if (!box) return;
    if (!n) {
      if (box.dataset.dgNpAutoWarn === "1") {
        box.classList.add("d-none");
        box.dataset.dgNpAutoWarn = "";
      }
      return;
    }
    if (!box.classList.contains("d-none") && box.dataset.dgNpAutoWarn !== "1") return;
    var fieldsHint =
      state.channel === "marketplaces"
        ? "код, артикул, название, штрихкод, цена, длина/ширина/высота/вес, НДС, ссылка на РУ, приоритет"
        : "артикул, название, цена, ссылка, приоритет";
    showLog(
      "warning",
      "На странице <b>" +
        n +
        "</b> строк(и) с незаполненными обязательными полями (" +
        fieldsHint +
        "). Ячейки подсвечены."
    );
    box.dataset.dgNpAutoWarn = "1";
  }

  function updatePager() {
    var pages = Math.max(1, Math.ceil(state.total / state.limit) || 1);
    var page = Math.floor(state.offset / state.limit) + 1;
    var shown = state.rows.length;
    var st = el("dg-np-page-status");
    if (st) {
      st.textContent =
        "Найдено: " + state.total + "; страница " + page + "/" + pages + "; показано: " + shown;
    }
    var prev = el("dg-np-prev");
    var next = el("dg-np-next");
    if (prev) prev.disabled = state.offset <= 0;
    if (next) next.disabled = state.offset + state.limit >= state.total;
  }

  function load() {
    var seq = ++loadSeq;
    var channelAtStart = state.channel;
    state.loading = true;
    renderTable();
    var p = new URLSearchParams();
    p.set("channel", channelAtStart);
    p.set("limit", String(state.limit));
    p.set("offset", String(state.offset));
    p.set("sort_by", state.sort_by);
    p.set("sort_dir", state.sort_dir);
    if (state.search) p.set("search", state.search);
    if (state.status) p.set("status", state.status);
    if (state.priority) p.set("priority", state.priority);
    if (state.brand) p.set("brand", state.brand);
    if (state.responsible) p.set("responsible", state.responsible);
    if (state.manager) p.set("manager", state.manager);
    return fetch("/api/exports/new-products?" + p.toString(), {
      credentials: "same-origin",
      headers: authHeaders(false),
    })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
          return j;
        });
      })
      .then(function (j) {
        if (seq !== loadSeq || state.channel !== channelAtStart) return;
        state.rows = j.data || [];
        state.total = Number(j.total || 0);
        state.loading = false;
        renderTable();
      })
      .catch(function (e) {
        if (seq !== loadSeq || state.channel !== channelAtStart) return;
        state.loading = false;
        state.rows = [];
        renderTable();
        showLog("danger", e.message || "Ошибка загрузки");
      });
  }

  function loadAssignees() {
    return fetch("/api/exports/new-products/assignees", {
      credentials: "same-origin",
      headers: authHeaders(false),
    })
      .then(function (r) {
        return r.json();
      })
      .then(function (j) {
        state.managers = (j && j.managers) || (j && j.data) || [];
        state.responsibles = (j && j.responsibles) || [];
        state.assignees = state.managers;
        fillAssigneeFilters();
      })
      .catch(function () {
        state.managers = [];
        state.responsibles = [];
        state.assignees = [];
      });
  }

      };
      return fetch("/api/exports/new-products", {
        method: "POST",

      })
        .then(function (r) {

          load();
        })
        .catch(function (e) {
          if (tick) clearInterval(tick);
          showLog("danger", "Ошибка: " + (e.message || "unknown") + "<br>" + filtersLine);
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun) {
      window.DatagonNotify.busyRun(el("dg-np-remove-placed"), run);
    } else run();
  }

  function distribute() {
    if (
      !window.confirm(
        "Раздать поровну строки без ответственного между контент-менеджерами?"
      )
    ) {
      return;
    }
    var t0 = Date.now();
    showLog(
      "warning",
      "Раздаём ответственных… канал: <b>" +
        (state.channel === "marketplaces" ? "Размещение на маркеты" : "Альмамед") +
        "</b>, только без ответственного."
    );
    var run = function () {
      return fetch("/api/exports/new-products/distribute", {
        method: "POST",
        credentials: "same-origin",
        headers: authHeaders(true),
        body: JSON.stringify({ channel: state.channel, scope: "unassigned" }),
      })
        .then(function (r) {
          return r.json().then(function (j) {
            if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
            return j;
          });
        })
        .then(function (j) {
          var sec = Math.round((Date.now() - t0) / 1000);
          showLog(
            "success",
            "Раздано: <b>" +
              (j.assigned || 0) +
              "</b> строк на <b>" +
              (j.users || 0) +
              "</b> пользователей · " +
              sec +
              " с"
          );
          load();
        })
        .catch(function (e) {
          showLog("danger", e.message || "Ошибка раздачи");
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun) {
      window.DatagonNotify.busyRun(el("dg-np-distribute"), run);
    } else run();
  }

  function bindCollapse(btnId, bodyId, key) {
    var btn = el(btnId);
    var body = el(bodyId);
    if (!btn || !body) return;
    function apply(collapsed) {
      body.style.display = collapsed ? "none" : "";
      btn.textContent = collapsed ? "Развернуть" : "Свернуть";
      try {
        localStorage.setItem(key, collapsed ? "1" : "0");
      } catch (_) {}
    }
    var start = false;
    try {
      start = localStorage.getItem(key) === "1";
    } catch (_) {}
    apply(start);
    btn.addEventListener("click", function () {
      apply(body.style.display !== "none");
    });
  }

  function renderColumnControls() {
    var list = el("dg-np-columns-list");
    if (!list) return;
    list.replaceChildren();
    currentCols().forEach(function (col) {
      if (col.key === "_actions" && !col.label) {
        /* actions always locked — still show as «Действия» */
      }
      var wrap = document.createElement("label");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = state.visibleCols.has(col.key);
      cb.disabled = !!col.locked;
      cb.setAttribute("data-col-key", col.key);
      cb.addEventListener("change", function () {
        var key = this.getAttribute("data-col-key");
        var meta = getColMeta(key);
        if (meta && meta.locked) {
          this.checked = true;
          return;
        }
        if (this.checked) state.visibleCols.add(key);
        else if (visibleColsArray().length > 2) state.visibleCols.delete(key);
        else this.checked = true;
        saveVisibleCols();
        renderTable();
      });
      var span = document.createElement("span");
      span.textContent = " " + (col.label || (col.key === "_actions" ? "Действия" : col.key));
      wrap.appendChild(cb);
      wrap.appendChild(span);
      list.appendChild(wrap);
    });
  }

  function renderWidthControls() {
    var list = el("dg-np-widths-list");
    if (!list) return;
    list.replaceChildren();
    currentCols().forEach(function (col) {
      var current = Number(state.columnWidths[col.key] || 0);
      if (!Number.isFinite(current) || current <= 0) current = getColDef(col.key);
      var wrap = document.createElement("label");
      var span = document.createElement("span");
      span.textContent = col.label || (col.key === "_actions" ? "Действия" : col.key);
      span.style.flex = "1 1 auto";
      span.style.overflow = "hidden";
      span.style.textOverflow = "ellipsis";
      span.style.whiteSpace = "nowrap";
      var input = document.createElement("input");
      input.type = "number";
      input.className = "form-control form-control-sm";
      input.min = String(getColMin(col.key));
      input.max = "700";
      input.step = "10";
      input.value = String(current);
      input.setAttribute("data-col-key", col.key);
      input.addEventListener("change", function () {
        var k = this.getAttribute("data-col-key");
        var n = parseInt(this.value, 10);
        if (!Number.isFinite(n)) {
          this.value = String(state.columnWidths[k] || getColDef(k));
          return;
        }
        n = Math.max(getColMin(k), Math.min(700, n));
        state.columnWidths[k] = n;
        saveWidths();
        applyColumnWidths();
        this.value = String(n);
      });
      wrap.appendChild(span);
      wrap.appendChild(input);
      list.appendChild(wrap);
    });
  }

  function bindColumnPanels() {
    var colsToggle = el("dg-np-columns-toggle");
    var widthsToggle = el("dg-np-widths-toggle");
    var colsPanel = el("dg-np-columns-panel");
    var widthsPanel = el("dg-np-widths-panel");
    var wrap = el("dg-np-toolbox-panels");
    function syncWrap() {
      if (!wrap) return;
      var open =
        (colsPanel && colsPanel.classList.contains("open")) ||
        (widthsPanel && widthsPanel.classList.contains("open"));
      wrap.classList.toggle("d-none", !open);
    }
    if (colsToggle && colsPanel) {
      colsToggle.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        colsPanel.classList.toggle("open");
        if (widthsPanel) widthsPanel.classList.remove("open");
        if (colsPanel.classList.contains("open")) renderColumnControls();
        syncWrap();
      });
    }
    if (widthsToggle && widthsPanel) {
      widthsToggle.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        widthsPanel.classList.toggle("open");
        if (colsPanel) colsPanel.classList.remove("open");
        if (widthsPanel.classList.contains("open")) renderWidthControls();
        syncWrap();
      });
    }
    document.addEventListener("click", function (e) {
      if (!colsPanel && !widthsPanel) return;
      if (e.target.closest("#dg-np-columns-panel")) return;
      if (e.target.closest("#dg-np-columns-toggle")) return;
      if (e.target.closest("#dg-np-widths-panel")) return;
      if (e.target.closest("#dg-np-widths-toggle")) return;
      if (colsPanel) colsPanel.classList.remove("open");
      if (widthsPanel) widthsPanel.classList.remove("open");
      syncWrap();
    });

    var allBtn = el("dg-np-columns-all");
    var noneBtn = el("dg-np-columns-none");
    var defBtn = el("dg-np-columns-default");
    var widthsDef = el("dg-np-widths-default");
    if (allBtn)
      allBtn.addEventListener("click", function () {
        state.visibleCols = new Set(defaultVisibleKeys());
        saveVisibleCols();
        renderColumnControls();
        renderTable();
      });
    if (noneBtn)
      noneBtn.addEventListener("click", function () {
        var next = new Set();
        currentCols().forEach(function (c) {
          if (c.locked) next.add(c.key);
        });
        if (!next.has("id")) next.add("id");
        if (!next.has("title") && getColMeta("title")) next.add("title");
        else if (!next.has("article") && getColMeta("article")) next.add("article");
        state.visibleCols = next;
        saveVisibleCols();
        renderColumnControls();
        renderTable();
      });
    if (defBtn)
      defBtn.addEventListener("click", function () {
        state.visibleCols = new Set(defaultVisibleKeys());
        saveVisibleCols();
        renderColumnControls();
        renderTable();
      });
    if (widthsDef)
      widthsDef.addEventListener("click", function () {
        state.columnWidths = {};
        saveWidths();
        applyColumnWidths();
        renderWidthControls();
      });
  }

  function setChannel(ch, opts) {
    var o = opts || {};
    state.channel = ch === "marketplaces" ? "marketplaces" : "almamed";
    try {
      localStorage.setItem(CHANNEL_KEY, state.channel);
    } catch (_) {}
    loadVisibleColsForChannel();
    loadWidthsForChannel();
    state.offset = 0;
    // Не оставляем чужие/устаревшие строки на экране на время ожидания PATCH + load.
    state.rows = [];
    state.loading = true;
    syncTabUi();
    renderTable();

    function finish() {
      if (o.focusChannelNum != null && Number.isFinite(Number(o.focusChannelNum))) {
        var q = "id:" + Number(o.focusChannelNum);
        if (el("dg-np-search")) el("dg-np-search").value = q;
        if (el("dg-np-f-status")) el("dg-np-f-status").value = "";
        if (el("dg-np-f-priority")) el("dg-np-f-priority").value = "";
        if (el("dg-np-f-brand")) el("dg-np-f-brand").value = "";
        if (el("dg-np-f-responsible")) el("dg-np-f-responsible").value = "";
        if (el("dg-np-f-manager")) el("dg-np-f-manager").value = "";
        try {
          var filtersBody = el("dg-np-filters-body");
          var filtersToggle = el("dg-np-filters-toggle");
          if (filtersBody && filtersBody.style.display === "none") {
            filtersBody.style.display = "";
            if (filtersToggle) filtersToggle.textContent = "Свернуть";
            localStorage.setItem(FILTERS_KEY, "0");
          }
        } catch (_) {}
        commitFilters();
        return;
      }
      load();
    }

    // Ждём незавершённые PATCH на любой вкладке — иначе при быстром «туда-сюда» вспыхивает старое значение.
    almamedPatchTail.catch(function () {}).then(finish);
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  var logState = { productId: null, label: "", field: "", fieldLabel: "", limit: 100, offset: 0, total: 0 };

  function npLogActionLabel(action) {
    var map = {
      set: "Изменение",
      create: "Создание",
      delete: "Удаление",
      kit_add: "Комплект +",
      kit_set: "Комплект",
      kit_delete: "Комплект −",
    };
    return map[action] || action || "set";
  }

  function npLogWhoLabel(r) {
    var name = String((r && r.changed_by_name) || "").trim();
    var src = String((r && r.source) || "").trim();
    if (src === "ms_enrich") return name ? name + " · МС" : "система · МС";
    if (src === "import_match") return name ? name + " · импорт" : "система · импорт";
    if (name) return name;
    if (src && src !== "ui") return "система · " + src;
    return "—";
  }

  function closeNpLog() {
    var overlay = el("dg-np-log-overlay");
    if (!overlay) return;
    overlay.style.display = "none";
    overlay.setAttribute("aria-hidden", "true");
  }

  function openNpLog(productId, label, field, fieldLabel) {
    logState.productId = productId;
    logState.label = label || "#" + productId;
    logState.field = field ? String(field) : "";
    logState.fieldLabel = fieldLabel ? String(fieldLabel) : FIELD_LOG_LABELS_UI[logState.field] || logState.field;
    logState.offset = 0;
    var overlay = el("dg-np-log-overlay");
    var titleEl = el("dg-np-log-title");
    var subEl = el("dg-np-log-subtitle");
    if (titleEl) {
      titleEl.textContent = logState.field
        ? "Журнал: " + (logState.fieldLabel || logState.field)
        : "Журнал изменений #" + productId;
    }
    if (subEl) {
      subEl.textContent = logState.field
        ? "#" + productId + " · " + logState.label
        : logState.label;
    }
    if (overlay) {
      overlay.style.display = "flex";
      overlay.setAttribute("aria-hidden", "false");
    }
    loadNpLog();
  }

  function renderNpLogPager() {
    var pages = Math.max(1, Math.ceil((logState.total || 0) / logState.limit) || 1);
    var page = Math.floor(logState.offset / logState.limit) + 1;
    var prevDisabled = logState.offset <= 0 ? " disabled" : "";
    var nextDisabled = logState.offset + logState.limit >= logState.total ? " disabled" : "";
    return (
      '<div class="dg-np-log-pager d-flex align-items-center justify-content-between gap-2 px-3 py-2 border-top">' +
      '<span class="small text-muted">Найдено: ' +
      logState.total +
      "; страница " +
      page +
      "/" +
      pages +
      "</span>" +
      '<div class="btn-group">' +
      '<button type="button" class="btn btn-sm btn-outline-secondary dg-np-log-prev"' +
      prevDisabled +
      ">Назад</button>" +
      '<button type="button" class="btn btn-sm btn-outline-secondary dg-np-log-next"' +
      nextDisabled +
      ">Вперёд</button>" +
      "</div></div>"
    );
  }

  function loadNpLog() {
    var body = el("dg-np-log-body");
    if (!body || !logState.productId) return;
    body.innerHTML = '<div class="text-muted small text-center py-4">Загрузка журнала…</div>';
    var qs = new URLSearchParams();
    qs.set("limit", String(logState.limit));
    qs.set("offset", String(logState.offset));
    if (logState.field) qs.set("field", logState.field);
    fetch("/api/exports/new-products/" + logState.productId + "/log?" + qs.toString(), {
      credentials: "same-origin",
      headers: authHeaders(false),
    })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok || (j && j.success === false)) {
            throw new Error((j && j.error) || "HTTP " + r.status);
          }
          return j;
        });
      })
      .then(function (j) {
        logState.total = Number(j.total || 0);
        var rows = j.rows || [];
        if (!rows.length) {
          body.innerHTML =
            '<div class="text-muted small text-center py-4">' +
            (logState.field
              ? "По полю «" +
                escapeHtml(logState.fieldLabel || logState.field) +
                "» изменений ещё не было."
              : "Журнал пуст: по этой строке ещё не было изменений.") +
            "</div>" +
            renderNpLogPager();
          return;
        }
        var showFieldCol = !logState.field;
        var html =
          '<div class="table-responsive"><table class="table table-sm mb-0"><thead><tr>' +
          "<th>Когда</th><th>Кто</th><th>Действие</th>" +
          (showFieldCol ? "<th>Поле</th>" : "") +
          "<th>Было → Стало</th>" +
          "</tr></thead><tbody>";
        rows.forEach(function (r) {
          var when = r.changed_at
            ? String(r.changed_at).replace("T", " ").replace(/\.\d+Z?$/, "").slice(0, 19)
            : "—";
          var who = escapeHtml(npLogWhoLabel(r));
          var field = escapeHtml(r.field_label || r.field || "—");
          if (r.kit_id) field += ' <span class="text-muted">#kit' + r.kit_id + "</span>";
          var oldVal =
            r.old_value == null
              ? '<span class="text-muted">∅</span>'
              : '<span class="dg-np-log-old">' + escapeHtml(r.old_value) + "</span>";
          var newVal =
            r.new_value == null
              ? '<span class="text-muted">∅</span>'
              : '<span class="dg-np-log-new">' + escapeHtml(r.new_value) + "</span>";
          var note =
            r.note && String(r.note).trim()
              ? '<div class="small text-muted mt-1">' + escapeHtml(r.note) + "</div>"
              : "";
          html +=
            "<tr>" +
            "<td class=\"text-nowrap small\">" +
            escapeHtml(when) +
            "</td>" +
            "<td>" +
            who +
            "</td>" +
            '<td><span class="badge bg-light text-dark border dg-np-log-action">' +
            escapeHtml(npLogActionLabel(r.action)) +
            "</span></td>" +
            (showFieldCol ? "<td>" + field + "</td>" : "") +
            "<td>" +
            oldVal +
            '<span class="dg-np-log-arrow">→</span>' +
            newVal +
            note +
            "</td>" +
            "</tr>";
        });
        html += "</tbody></table></div>" + renderNpLogPager();
        body.innerHTML = html;
      })
      .catch(function (e) {
        body.innerHTML =
          '<div class="text-danger small text-center py-4">' +
          escapeHtml(e.message || "Ошибка загрузки журнала") +
          "</div>";
      });
  }

  function bindNpLogUi() {
    document.addEventListener("click", function (ev) {
      var fieldBtn = ev.target && ev.target.closest && ev.target.closest(".dg-np-field-log-btn");
      if (fieldBtn) {
        ev.preventDefault();
        ev.stopPropagation();
        var fid = parseInt(fieldBtn.getAttribute("data-dg-np-log-id") || "", 10);
        var flabel = fieldBtn.getAttribute("data-dg-np-log-label") || "";
        var fkey = fieldBtn.getAttribute("data-dg-np-log-field") || "";
        var fflabel = fieldBtn.getAttribute("data-dg-np-log-field-label") || "";
        if (Number.isFinite(fid) && fid > 0 && fkey) openNpLog(fid, flabel, fkey, fflabel);
        return;
      }
      var btn = ev.target && ev.target.closest && ev.target.closest(".dg-np-log-btn");
      if (btn) {
        ev.preventDefault();
        var id = parseInt(btn.getAttribute("data-dg-np-log-id") || "", 10);
        var label = btn.getAttribute("data-dg-np-log-label") || "";
        if (Number.isFinite(id) && id > 0) openNpLog(id, label, "", "");
        return;
      }
      var prev = ev.target && ev.target.closest && ev.target.closest(".dg-np-log-prev");
      if (prev && logState.productId) {
        logState.offset = Math.max(0, logState.offset - logState.limit);
        loadNpLog();
        return;
      }
      var next = ev.target && ev.target.closest && ev.target.closest(".dg-np-log-next");
      if (next && logState.productId) {
        if (logState.offset + logState.limit < logState.total) {
          logState.offset += logState.limit;
          loadNpLog();
        }
      }
    });
    var closeBtn = el("dg-np-log-close");
    if (closeBtn) closeBtn.addEventListener("click", closeNpLog);
    var refreshBtn = el("dg-np-log-refresh");
    if (refreshBtn) refreshBtn.addEventListener("click", loadNpLog);
    var backdrop = el("dg-np-log-backdrop");
    if (backdrop) backdrop.addEventListener("click", closeNpLog);
    document.addEventListener("keydown", function (ev) {
      if (ev.key !== "Escape") return;
      var overlay = el("dg-np-log-overlay");
      if (overlay && overlay.style.display !== "none") closeNpLog();
    });
  }

  function init() {
    try {
      var saved = localStorage.getItem(CHANNEL_KEY);
      if (saved === "marketplaces" || saved === "almamed") state.channel = saved;
    } catch (_) {}
    loadVisibleColsForChannel();
    loadWidthsForChannel();
    syncTabUi();
    bindCollapse("dg-np-filters-toggle", "dg-np-filters-body", FILTERS_KEY);
    bindCollapse("dg-np-table-toggle", "dg-np-table-body", TABLE_KEY);
    bindColumnPanels();
    bindNpLogUi();
    bindNpConfirmUi();
    bindMsDetailModal();

    document.querySelectorAll("#dg-np-tabs [data-dg-np-channel]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setChannel(btn.getAttribute("data-dg-np-channel"));
      });
    });

    el("dg-np-apply").addEventListener("click", commitFilters);
    el("dg-np-reset").addEventListener("click", resetFilters);
    el("dg-np-add").addEventListener("click", addRow);
    el("dg-np-distribute").addEventListener("click", distribute);
    var btnSync = el("dg-np-sync-markets");
    if (btnSync) btnSync.addEventListener("click", syncMarketsQueue);
    var btnRemove = el("dg-np-remove-placed");
    if (btnRemove) btnRemove.addEventListener("click", removePlaced);
    el("dg-np-search").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        commitFilters();
      }
      if (e.key === "Escape") {
        el("dg-np-search").value = "";
        commitFilters();
      }
    });
    el("dg-np-page-size").addEventListener("change", function () {
      state.limit = parseInt(el("dg-np-page-size").value, 10) || 100;
      state.offset = 0;
      load();
    });
    el("dg-np-prev").addEventListener("click", function () {
      state.offset = Math.max(0, state.offset - state.limit);
      load();
    });
    el("dg-np-next").addEventListener("click", function () {
      state.offset = state.offset + state.limit;
      load();
    });

    loadAssignees().then(load);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
