  <script>
    (function () {
      var chartJsPromise = null;
      var revenueChart = null;
      var shareChart = null;
      var trendChart = null;

      /** По умолчанию — три маркетплейса с отгрузками (имена из ms_demand.project_name). */
      function isDefaultMarketplaceProjectName(name) {
        var n = String(name || "").trim().toLowerCase();
        if (!n) return false;
        if (n === "озон" || n.indexOf("ozon") >= 0) return true;
        if (n.indexOf("вайлдберриз") >= 0 || n.indexOf("wildberries") >= 0) return true;
        if (n.indexOf("яндекс") >= 0 && n.indexOf("маркет") >= 0) return true;
        return false;
      }

      function pickDefaultMarketplaceProjectUuids(projects) {
        var out = [];
        var used = new Set();
        (projects || []).forEach(function (p) {
          var u = String(p.uuid || "").trim().toLowerCase();
          if (!u || used.has(u) || !isDefaultMarketplaceProjectName(p.name)) return;
          out.push(u);
          used.add(u);
        });
        return out.sort();
      }

      function applyDefaultMarketplaceProjectSelection() {
        var uuids = pickDefaultMarketplaceProjectUuids(state.projectsCatalog);
        state.pending.project_mode = "selected";
        state.pending.project_uuids = uuids;
        state.project_mode = "selected";
        state.project_uuids = uuids.slice();
        var modeSel = document.getElementById("dg-sa-project-mode-selected");
        if (modeSel) modeSel.checked = true;
        var wrap = document.getElementById("dg-sa-projects-wrap");
        var selAll = document.getElementById("dg-sa-projects-select-all");
        var clearBtn = document.getElementById("dg-sa-projects-clear");
        if (wrap) wrap.classList.remove("d-none");
        if (selAll) selAll.classList.remove("d-none");
        if (clearBtn) clearBtn.classList.remove("d-none");
        renderProjectsList(state.projectsCatalog);
        updateProjectFilterHint();
      }

      var state = {
        days: 90,
        new_stock_days: 30,
        project_mode: "selected",
        project_uuids: [],
        focus: "all",
        search: "",
        limit: 100,
        offset: 0,
        sort_by: "sales_revenue",
        sort_dir: "desc",
        pending: { days: 90, new_stock_days: 30, search: "", project_mode: "selected", project_uuids: [] },
        total: 0,
        rows: [],
        selectedKey: "",
        detailView: "summary",
        highlights: null,
        overview: null,
        breakdown: null,
        breakdownOffset: 0,
        breakdownLimit: 50,
        projectsCatalog: [],
      };

      function projectUuidsEqual(a, b) {
        var sa = (a || []).slice().sort().join(",");
        var sb = (b || []).slice().sort().join(",");
        return sa === sb;
      }

      function readPendingProjectUuids() {
        var list = document.getElementById("dg-sa-projects-list");
        if (!list) return (state.pending.project_uuids || []).slice();
        var out = [];
        list.querySelectorAll('input[type="checkbox"][data-dg-sa-project-uuid]:checked').forEach(function (cb) {
          var u = String(cb.getAttribute("data-dg-sa-project-uuid") || "").trim().toLowerCase();
          if (u) out.push(u);
        });
        return out.sort();
      }

      function appendProjectParams(p) {
        p.set("project_mode", state.project_mode || "all");
        if (state.project_mode === "selected" && state.project_uuids.length) {
          p.set("project_uuids", state.project_uuids.join(","));
        }
        return p;
      }

      function authHeaders() {
        var h = { Accept: "application/json" };
        try {
          var t = localStorage.getItem("datagon_token");
          if (t) h.Authorization = "Bearer " + t;
        } catch (e) {}
        return h;
      }

      function fmtMoney(n) {
        var x = Number(n);
        if (!Number.isFinite(x)) return "—";
        return x.toLocaleString("ru-RU", { maximumFractionDigits: 0 }) + " ₽";
      }

      function fmtQty(n) {
        var x = Number(n);
        if (!Number.isFinite(x)) return "—";
        return x.toLocaleString("ru-RU", { maximumFractionDigits: 0 });
      }

      function fmtPct(n) {
        if (n == null || n === "") return "—";
        var x = Number(n);
        if (!Number.isFinite(x)) return "—";
        var cls = x >= 0 ? "dg-sa-pct-up" : "dg-sa-pct-down";
        var sign = x > 0 ? "+" : "";
        return '<span class="' + cls + '">' + sign + x.toFixed(1) + "%</span>";
      }

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }

      function loadChartJs() {
        if (window.Chart && typeof window.Chart === "function") return Promise.resolve(window.Chart);
        if (chartJsPromise) return chartJsPromise;
        chartJsPromise = new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js";
          s.async = true;
          s.onload = function () { resolve(window.Chart); };
          s.onerror = function () { reject(new Error("Chart.js")); };
          document.head.appendChild(s);
        });
        return chartJsPromise;
      }

      function destroyChart(ch) {
        if (ch && typeof ch.destroy === "function") ch.destroy();
      }

      function syncDirtyApply() {
        var btn = document.getElementById("dg-sa-apply");
        if (!btn) return;
        state.pending.project_uuids = readPendingProjectUuids();
        var dirty =
          state.pending.days !== state.days ||
          state.pending.new_stock_days !== state.new_stock_days ||
          state.pending.search !== state.search ||
          state.pending.project_mode !== state.project_mode ||
          !projectUuidsEqual(state.pending.project_uuids, state.project_uuids);
        btn.textContent = dirty ? "Применить •" : "Применить";
        btn.classList.toggle("dg-flt-dirty", dirty);
      }

      function commitFilters() {
        state.days = Number(state.pending.days) || 90;
        state.new_stock_days = Number(state.pending.new_stock_days) || 30;
        state.search = String(state.pending.search || "").trim();
        state.project_mode = state.pending.project_mode === "selected" ? "selected" : "all";
        state.project_uuids =
          state.project_mode === "selected" ? readPendingProjectUuids() : [];
        state.offset = 0;
        state.breakdownOffset = 0;
        syncDirtyApply();
        updateProjectFilterHint();
        return loadAll();
      }

      function updateProjectFilterHint(label) {
        var el = document.getElementById("dg-sa-project-filter-hint");
        if (!el) return;
        var text =
          label ||
          (state.project_mode === "selected"
            ? state.project_uuids.length
              ? "Учитываются продажи по " + state.project_uuids.length + " выбранным проектам"
              : "Режим «только выбранные»: список пуст — продажи не учитываются"
            : "");
        if (!text) {
          el.classList.add("d-none");
          el.textContent = "";
          return;
        }
        el.textContent = text;
        el.classList.remove("d-none");
      }

      function syncProjectModeUi() {
        var selected =
          document.getElementById("dg-sa-project-mode-selected") &&
          document.getElementById("dg-sa-project-mode-selected").checked;
        state.pending.project_mode = selected ? "selected" : "all";
        var wrap = document.getElementById("dg-sa-projects-wrap");
        var selAll = document.getElementById("dg-sa-projects-select-all");
        var clearBtn = document.getElementById("dg-sa-projects-clear");
        if (wrap) wrap.classList.toggle("d-none", !selected);
        if (selAll) selAll.classList.toggle("d-none", !selected);
        if (clearBtn) clearBtn.classList.toggle("d-none", !selected);
        if (selected && !state.projectsCatalog.length) loadProjectsList();
        syncDirtyApply();
      }

      function renderProjectsList(projects) {
        var list = document.getElementById("dg-sa-projects-list");
        if (!list) return;
        var saved = new Set((state.pending.project_uuids || []).map(function (u) { return String(u).toLowerCase(); }));
        if (!projects.length) {
          list.innerHTML =
            '<p class="text-muted small mb-0">Проекты не найдены за период. Выполните синхронизацию «Продажи МС».</p>';
          return;
        }
        list.innerHTML = projects
          .map(function (p) {
            var u = String(p.uuid || "").trim().toLowerCase();
            var name = String(p.name || u || "—");
            var cnt = Number(p.count || 0);
            var id = "dg-sa-proj-" + u.replace(/[^a-z0-9]/g, "");
            var checked = saved.has(u) ? " checked" : "";
            return (
              '<div class="form-check">' +
              '<input class="form-check-input" type="checkbox" id="' +
              id +
              '" data-dg-sa-project-uuid="' +
              u +
              '"' +
              checked +
              " />" +
              '<label class="form-check-label small" for="' +
              id +
              '">' +
              esc(name) +
              ' <span class="text-muted">(' +
              cnt +
              " отгр.)</span></label></div>"
            );
          })
          .join("");
        list.querySelectorAll('input[type="checkbox"][data-dg-sa-project-uuid]').forEach(function (cb) {
          cb.addEventListener("change", syncDirtyApply);
        });
      }

      function loadProjectsList() {
        var statusEl = document.getElementById("dg-sa-projects-status");
        var days = Number(state.pending.days) || state.days || 90;
        if (statusEl) statusEl.textContent = "Загрузка проектов…";
        return fetch("/api/supplier-analysis/projects?days=" + encodeURIComponent(String(days)), {
          credentials: "same-origin",
          headers: authHeaders(),
        })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (!j || !j.success) throw new Error((j && j.error) || "Ошибка");
            state.projectsCatalog = j.projects || [];
            renderProjectsList(state.projectsCatalog);
            if (statusEl) {
              statusEl.textContent =
                "Проекты с отгрузками за " + String(j.days || days) + " дн. Отметьте нужные и нажмите «Применить».";
            }
          })
          .catch(function (e) {
            if (statusEl) statusEl.textContent = (e && e.message) || "Не удалось загрузить проекты";
            var list = document.getElementById("dg-sa-projects-list");
            if (list) list.innerHTML = "";
          });
      }

      function loadFreshness() {
        return fetch("/api/supplier-analysis/data-freshness", {
          credentials: "same-origin",
          headers: authHeaders(),
        })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            var row = document.getElementById("dg-sa-data-freshness-row");
            var loading = document.getElementById("dg-sa-data-freshness-loading");
            if (loading) loading.remove();
            if (!row || !j || !j.sources) return;
            row.innerHTML = j.sources
              .map(function (src) {
                var st = src.status || "unknown";
                var badge =
                  st === "ok" ? "success" : st === "running" ? "primary" : st === "stale" ? "warning" : "secondary";
                return (
                  '<div class="col-lg-6"><div class="card card-body py-2 px-3 border">' +
                  '<div class="d-flex justify-content-between gap-2"><span class="small fw-semibold">' +
                  esc(src.title) +
                  '</span><span class="badge bg-' +
                  badge +
                  '">' +
                  esc(st) +
                  "</span></div>" +
                  '<div class="text-muted small">' +
                  esc(src.finished_at_msk ? "Обновлено: " + src.finished_at_msk : "Нет даты") +
                  "</div></div></div>"
                );
              })
              .join("")
          })
          .catch(function () {});
      }

      function firstSignalText(r) {
        var sig = r && r.signals;
        if (sig && sig.length && sig[0].text) return sig[0].text;
        return "";
      }

      function findSupplierRow(key) {
        if (!key) return null;
        var fromTable = state.rows.find(function (r) { return r.supplier_key === key; });
        if (fromTable) return fromTable;
        var h = state.highlights || {};
        var pools = [h.needs_attention, h.top_revenue, h.top_growth, h.weak];
        for (var i = 0; i < pools.length; i++) {
          var list = pools[i] || [];
          var hit = list.find(function (r) { return r.supplier_key === key; });
          if (hit) return hit;
        }
        return null;
      }

      function fmtDateTime(iso) {
        if (!iso) return "—";
        var d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso).slice(0, 10);
        return d.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" });
      }

      function renderSalesBreakdown() {
        var j = state.breakdown;
        var summary = document.getElementById("dg-sa-breakdown-summary");
        var tbody = document.getElementById("dg-sa-breakdown-tbody");
        var info = document.getElementById("dg-sa-breakdown-pager-info");
        var prev = document.getElementById("dg-sa-breakdown-prev");
        var next = document.getElementById("dg-sa-breakdown-next");
        if (!tbody) return;
        if (!j || !j.success) {
          if (summary) summary.textContent = (j && j.error) || "Нет данных";
          tbody.innerHTML = '<tr><td colspan="12" class="text-muted">—</td></tr>';
          return;
        }
        var t = j.totals || {};
        if (summary) {
          summary.innerHTML =
            "Итого по фильтру: <strong>" +
            fmtMoney(t.sales_revenue) +
            "</strong> выручка · <strong>" +
            fmtMoney(t.gross_margin_est) +
            "</strong> маржа" +
            (t.margin_pct != null ? " (" + Number(t.margin_pct).toFixed(1) + "%)" : "") +
            " · " +
            fmtQty(t.demands_count) +
            " отгр. · " +
            fmtQty(t.lines_count) +
            " строк";
        }
        var rows = j.rows || [];
        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="12" class="text-muted">Нет строк за период</td></tr>';
        } else {
          tbody.innerHTML = rows
            .map(function (r) {
              return (
                "<tr>" +
                "<td>" +
                esc(fmtDateTime(r.moment)) +
                "</td>" +
                "<td>" +
                esc(r.doc_name || "—") +
                "</td>" +
                "<td>" +
                esc(r.project_name || "—") +
                "</td>" +
                '<td><a href="/product.html?code=' +
                encodeURIComponent(r.code || "") +
                '" target="_blank" rel="noopener">' +
                esc(r.code) +
                "</a></td>" +
                "<td>" +
                esc(r.name) +
                "</td>" +
                "<td>" +
                esc(r.supplier) +
                "</td>" +
                '<td class="text-end">' +
                fmtQty(r.quantity) +
                "</td>" +
                '<td class="text-end">' +
                fmtMoney(r.line_price) +
                "</td>" +
                '<td class="text-end">' +
                fmtMoney(r.line_revenue) +
                "</td>" +
                '<td class="text-end">' +
                fmtMoney(r.buy_price_unit) +
                "</td>" +
                '<td class="text-end">' +
                fmtMoney(r.line_cost) +
                "</td>" +
                '<td class="text-end">' +
                fmtMoney(r.line_margin) +
                "</td>" +
                "</tr>"
              );
            })
            .join("");
        }
        var total = j.total || 0;
        var from = total ? state.breakdownOffset + 1 : 0;
        var to = Math.min(state.breakdownOffset + state.breakdownLimit, total);
        if (info) {
          info.textContent =
            "Строки " + from + "–" + to + " из " + total + " · на странице " + state.breakdownLimit;
        }
        if (prev) prev.disabled = state.breakdownOffset <= 0;
        if (next) next.disabled = state.breakdownOffset + state.breakdownLimit >= total;
      }

      function loadSalesBreakdown() {
        var q = new URLSearchParams();
        q.set("days", String(state.days));
        q.set("limit", String(state.breakdownLimit));
        q.set("offset", String(state.breakdownOffset));
        if (state.search) q.set("search", state.search);
        appendProjectParams(q);
        return fetch("/api/supplier-analysis/sales-breakdown?" + q.toString(), {
          credentials: "same-origin",
          headers: authHeaders(),
        })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (j) {
            if (!j || !j.success) throw new Error((j && j.error) || "Ошибка");
            state.breakdown = j;
            renderSalesBreakdown();
          })
          .catch(function (e) {
            state.breakdown = { success: false, error: e.message };
            renderSalesBreakdown();
          });
      }

      function renderKpis() {
        var t = (state.overview && state.overview.totals) || {};
        var pf = (state.overview && state.overview.project_filter) || null;
        var scopeHint = document.getElementById("dg-sa-sales-scope-hint");
        if (scopeHint) {
          var scopeText =
            pf && pf.label
              ? pf.label
              : state.project_mode === "selected"
                ? "Только выбранные проекты (примените фильтр)"
                : "";
          if (scopeText) {
            scopeHint.textContent = scopeText;
            scopeHint.classList.remove("d-none");
          } else {
            scopeHint.textContent = "";
            scopeHint.classList.add("d-none");
          }
        }
        var el = function (id, v) {
          var n = document.getElementById(id);
          if (n) n.textContent = v;
        };
        el("dg-sa-kpi-suppliers", fmtQty(t.suppliers_total));
        el("dg-sa-kpi-revenue", fmtMoney(t.sales_revenue));
        el("dg-sa-kpi-margin", fmtMoney(t.gross_margin_est));
        var mgp = document.getElementById("dg-sa-kpi-margin-pct");
        if (mgp) {
          if (t.margin_pct != null && Number.isFinite(Number(t.margin_pct))) {
            mgp.textContent = Number(t.margin_pct).toFixed(1) + "% от выручки";
          } else {
            mgp.textContent = "";
          }
        }
        var ch = document.getElementById("dg-sa-kpi-change");
        if (ch) ch.innerHTML = fmtPct(t.revenue_change_pct);
        el("dg-sa-kpi-no-sales", fmtQty(t.suppliers_no_sales));
        el("dg-sa-kpi-declining", fmtQty(t.suppliers_declining));
        el("dg-sa-kpi-stock", fmtMoney(t.stock_value_rub));
      }

      function renderHighlightList(id, items, mode) {
        var ul = document.getElementById(id);
        if (!ul) return;
        if (!items || !items.length) {
          var empty =
            mode === "attention"
              ? "Нет поставщиков с тревожными сигналами"
              : mode === "weak"
                ? ""
                : "Нет данных за период";
          ul.innerHTML = empty
            ? '<li class="list-group-item text-muted small">' + empty + "</li>"
            : "";
          return;
        }
        ul.innerHTML = items
          .map(function (r) {
            var meta = fmtMoney(r.sales_revenue);
            if (mode === "growth" && r.revenue_change_pct != null) {
              meta += " · рост " + r.revenue_change_pct + "%";
            }
            if (mode === "weak") meta = "Остаток " + fmtMoney(r.stock_value_rub);
            var sigHtml = "";
            if (mode === "attention") {
              var st = firstSignalText(r);
              if (st) sigHtml = '<div class="dg-sa-highlight-signal">' + esc(st) + "</div>";
            }
            return (
              '<li class="list-group-item dg-sa-pick" data-key="' +
              esc(r.supplier_key) +
              '" data-name="' +
              esc(r.supplier_name) +
              '"><div class="fw-semibold">' +
              esc(r.supplier_name) +
              '</div><div class="dg-sa-highlight-meta">' +
              meta +
              "</div>" +
              sigHtml +
              "</li>"
            );
          })
          .join("");
      }

      function syncInsightPanel(cfg) {
        var countEl = document.getElementById(cfg.countId);
        var bodyEl = document.getElementById(cfg.bodyId);
        var footEl = document.getElementById(cfg.footId);
        var n = cfg.count || 0;
        if (countEl) countEl.textContent = n > 0 ? "(" + n + ")" : "";
        if (!bodyEl) return;
        function updateScrollHint() {
          var overflow = bodyEl.scrollHeight > bodyEl.clientHeight + 2;
          bodyEl.classList.toggle("dg-sa-scroll-more", overflow);
          if (!footEl) return;
          if (!n) {
            footEl.classList.add("d-none");
            footEl.textContent = "";
            return;
          }
          if (overflow) {
            footEl.classList.remove("d-none");
            footEl.textContent =
              "В списке " +
              n +
              " — прокрутите, чтобы увидеть всех (полоса справа)";
          } else {
            footEl.classList.add("d-none");
            footEl.textContent = "";
          }
        }
        if (!bodyEl._dgSaScrollBound) {
          bodyEl._dgSaScrollBound = 1;
          bodyEl.addEventListener("scroll", updateScrollHint);
        }
        requestAnimationFrame(updateScrollHint);
      }

      function renderHighlights() {
        var h = state.highlights || {};
        renderHighlightList("dg-sa-list-attention", h.needs_attention, "attention");
        renderHighlightList("dg-sa-list-revenue", h.top_revenue, "revenue");
        renderHighlightList("dg-sa-list-growth", h.top_growth, "growth");
        var weakUl = document.getElementById("dg-sa-list-weak");
        var weakHdr = document.getElementById("dg-sa-weak-header");
        var weakCount = 0;
        if (weakUl) {
          var attKeys = {};
          (h.needs_attention || []).forEach(function (r) {
            if (r && r.supplier_key) attKeys[r.supplier_key] = 1;
          });
          var weak = (h.weak || []).filter(function (r) {
            return r && r.supplier_key && !attKeys[r.supplier_key];
          });
          weakCount = weak.length;
          if (!weak.length) {
            weakUl.innerHTML = "";
            weakUl.classList.add("d-none");
            if (weakHdr) weakHdr.classList.add("d-none");
          } else {
            weakUl.classList.remove("d-none");
            if (weakHdr) weakHdr.classList.remove("d-none");
            renderHighlightList("dg-sa-list-weak", weak, "weak");
          }
        }
        var attN = (h.needs_attention || []).length + weakCount;
        syncInsightPanel({
          countId: "dg-sa-count-attention",
          bodyId: "dg-sa-body-attention",
          footId: "dg-sa-foot-attention",
          count: attN,
        });
        syncInsightPanel({
          countId: "dg-sa-count-revenue",
          bodyId: "dg-sa-body-revenue",
          footId: "dg-sa-foot-revenue",
          count: (h.top_revenue || []).length,
        });
        syncInsightPanel({
          countId: "dg-sa-count-growth",
          bodyId: "dg-sa-body-growth",
          footId: "dg-sa-foot-growth",
          count: (h.top_growth || []).length,
        });
      }

      function renderCharts() {
        var top = (state.highlights && state.highlights.top_revenue) || [];
        loadChartJs()
          .then(function (Chart) {
            destroyChart(revenueChart);
            destroyChart(shareChart);
            var labels = top.map(function (r) {
              var n = r.supplier_name || r.supplier_key;
              return n.length > 28 ? n.slice(0, 26) + "…" : n;
            });
            var data = top.map(function (r) { return r.sales_revenue; });
            var canvasR = document.getElementById("dg-sa-chart-revenue");
            if (canvasR) {
              revenueChart = new Chart(canvasR, {
                type: "bar",
                data: {
                  labels: labels,
                  datasets: [{ label: "Выручка ₽", data: data, backgroundColor: "rgba(30, 107, 184, 0.75)" }],
                },
                options: {
                  indexAxis: "y",
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { display: false } },
                },
              });
            }
            var canvasD = document.getElementById("dg-sa-chart-share");

        var header = document.querySelector(".app-header");
        var fixed = Boolean(app && app.classList && app.classList.contains("fixed-header"));
        var top = 0;
        if (fixed && header && header.getBoundingClientRect) {
          var rect = header.getBoundingClientRect();
          top = rect && rect.height ? rect.height : 60;
        }
        document.documentElement.style.setProperty("--dg-table-sticky-top", top + "px");
      }
      function getSaStickyTopPx() {
        var app = document.querySelector(".app-container");
        var header = document.querySelector(".app-header");
        var fixed = Boolean(app && app.classList && app.classList.contains("fixed-header"));
        if (!fixed) return 0;
        if (!header || !header.getBoundingClientRect) return 60;
        var rect = header.getBoundingClientRect();
        return rect && rect.height ? rect.height : 60;

      function clearSaHeaderFloatStyles(thead, row) {
        if (!thead) return;
        thead.style.transform = "";
        thead.style.position = "";
        thead.style.zIndex = "";
        thead.style.willChange = "";
        thead.removeAttribute("data-dg-floating");
        if (!row) return;
        row.style.transform = "";
        row.style.position = "";
        row.style.zIndex = "";
        row.style.willChange = "";

      function captureSaTheadBaseTop() {
        var thead = document.getElementById("dg-sa-thead");
        if (!thead) return;
        var row = thead.querySelector("tr");
        if (!row) return;
        clearSaHeaderFloatStyles(thead, row);
        var rect = row.getBoundingClientRect();
        var absTop =
          (window.scrollY || window.pageYOffset || 0) + (rect && rect.top ? rect.top : 0);
        thead.setAttribute("data-dg-base-top", String(absTop));
      }
      function updateSaFloatingHeaderFallback() {
        if (state.selectedKey) {
          clearSaFloatingHeaderForDetail();
          return;
        }
        var thead = document.getElementById("dg-sa-thead");
        if (!thead) return;
        var table = thead.closest("table");
        if (!table || !table.getBoundingClientRect) return;
        var row = thead.querySelector("tr");
        if (!row) return;

        var y = window.scrollY || window.pageYOffset || 0;
        var headerTop = getSaStickyTopPx();
        var tableRect = table.getBoundingClientRect();
        var tableBottom = tableRect.bottom + y;
        var rowRect = row.getBoundingClientRect();
        var rowHeight = rowRect && rowRect.height ? rowRect.height : 0;
        var isFloating = thead.getAttribute("data-dg-floating") === "1" || !!row.style.transform;

        /* Пока шапка не «плывёт», держим base-top актуальным (сводка/графики выше таблицы сдвигают её). */
        if (!isFloating) {
          var liveBase = y + (rowRect && rowRect.top ? rowRect.top : 0);
          if (Number.isFinite(liveBase) && liveBase > 0) {
            thead.setAttribute("data-dg-base-top", String(liveBase));
          }
        }

        var baseTopAbs = Number(thead.getAttribute("data-dg-base-top") || 0);
        if (!Number.isFinite(baseTopAbs) || baseTopAbs <= 0) return;

        var headerLine = y + headerTop;
        var start = baseTopAbs + FLOATING_HEADER_START_EPS_PX;
        var end = tableBottom - rowHeight;
        if (headerLine <= start || headerLine >= end) {
          if (row.style.transform || thead.getAttribute("data-dg-floating")) {
            clearSaHeaderFloatStyles(thead, row);
          }
          return;
        }

        var zoomAwareOffset = FLOATING_HEADER_OFFSET_PX;
        var dpr = window.devicePixelRatio || 1;
        if (Math.abs(dpr - 1) < 0.03) zoomAwareOffset = FLOATING_HEADER_OFFSET_PX - 3;
        var shift = Math.max(0, headerLine - start - zoomAwareOffset);
        var shiftPx = Number(shift.toFixed(3));
        var nextTransform = "translate3d(0," + shiftPx + "px,0)";
        if (row.style.transform !== nextTransform) {
          thead.style.transform = "";
          thead.style.position = "";
          thead.style.zIndex = "";
          thead.style.willChange = "";
          row.style.transform = nextTransform;
          row.style.position = "relative";
          row.style.zIndex = "25";
          row.style.willChange = "transform";
          thead.setAttribute("data-dg-floating", "1");
        }
      }
      function saFloatingHeaderTick(ts) {

      function scheduleSaFloatingHeaderUpdate() {
        saFloatingLastScrollTs = performance.now();

        saFloatingHeaderRaf = requestAnimationFrame(saFloatingHeaderTick);

          opts = opts || {};
          var th = document.createElement("th");
          th.scope = "col";
          if (opts.expand) th.className = "dg-sa-expand-col";
          else if (opts.num) th.className = "text-end dg-sa-col-num";
          else {
            if (opts.center) th.className = "text-end";
            if (opts.sortKey) {
              th.classList.add("dg-sa-sortable");
              th.setAttribute("data-sort", opts.sortKey);
            }
          }
          var w = opts.width;
          if (opts.sortKey) {
            w = getSaColWidthPx(opts.sortKey);
            th.setAttribute("data-col-key", opts.sortKey);
          } else if (opts.expand) w = getSaColWidthPx("__expand");
          else if (opts.num) w = getSaColWidthPx("__num");
          if (w) setSaCellWidthStyle(th, w);
          if (opts.sortKey) {
            if (opts.sortKey === state.sort_by) {
              th.classList.add("dg-sa-sort-active");
              th.setAttribute("aria-sort", state.sort_dir === "asc" ? "ascending" : "descending");
            }
            setSaThLabel(th, label, {
              sortKey: opts.sortKey,
              headerLines: opts.headerLines,
            });
          } else if (opts.expand || opts.num) {
            th.textContent = label;
          }
          if (opts.sortKey) {
            var colOpts = SA_COL_OPTS[opts.sortKey] || {};
            applySaThTooltip(th, colOpts);
          }
          if (opts.sortKey) {
            th.style.cursor = "pointer";
            th.addEventListener("click", function () {
              if (window.getSelection && window.getSelection().toString().trim()) return;
              if (state.sort_by === opts.sortKey) {

      function bindSaHeaderSearchMirror() {
        var primary = document.getElementById("dg-sa-search");
        var mirror = document.getElementById("dg-sa-table-search-mirror");
        var applyBtn = document.getElementById("dg-sa-apply");
        if (!primary || !mirror) return;
        var syncing = false;
        function sync(from, to) {
          if (syncing) return;
          syncing = true;
          to.value = from.value;
          state.pending.search = String(from.value || "").trim();
          syncing = false;
          syncDirtyApply();
        }
        primary.addEventListener("input", function () { sync(primary, mirror); });
        mirror.addEventListener("input", function () { sync(mirror, primary); });
        function applySearchNow() {
          state.pending.search = String(mirror.value || "").trim();
          primary.value = mirror.value;
          if (applyBtn) applyBtn.click();
          else commitFilters();
        }
        function onEnter(ev) {
          if (ev.key !== "Enter") return;
          ev.preventDefault();
          applySearchNow();
        }
        function onEsc(ev) {
          if (ev.key !== "Escape") return;
          ev.preventDefault();
          mirror.value = "";
          primary.value = "";
          state.pending.search = "";
          commitFilters();
        }
        mirror.addEventListener("keydown", onEnter);
        mirror.addEventListener("keydown", onEsc);
        // Уход с поля после ввода = применить (иначе кажется, что поиск «не работает»)
        mirror.addEventListener("change", function () {
          applySearchNow();
        });
        mirror.addEventListener("search", function () {
          if (mirror.value === "") {
            primary.value = "";
            state.pending.search = "";
            commitFilters();
          }
        });
      }

      function saColumnControls() {
        var wrap = document.getElementById("dg-sa-toolbox-panels");
        var colPanel = document.getElementById("dg-sa-columns-panel");
        var widthPanel = document.getElementById("dg-sa-widths-panel");
        var colList = document.getElementById("dg-sa-columns-list");
        var widthList = document.getElementById("dg-sa-widths-list");
        function syncWrap() {
          var open =
            (colPanel && colPanel.classList.contains("open")) ||
            (widthPanel && widthPanel.classList.contains("open"));
          if (wrap) wrap.classList.toggle("d-none", !open);
        }
        function renderColumnControls() {
          if (!colList) return;
          colList.innerHTML = "";
          SA_COLS.forEach(function (p) {
            var key = p[0];
            var label = document.createElement("label");
            var cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = visibleSaCols.indexOf(key) >= 0;
            cb.addEventListener("change", function () {
              if (cb.checked) {
                if (visibleSaCols.indexOf(key) < 0) visibleSaCols.push(key);
              } else {
                visibleSaCols = visibleSaCols.filter(function (k) { return k !== key; });
              }
              if (!visibleSaCols.length) visibleSaCols = ["supplier_name"];
              saveSaVisibleCols(visibleSaCols);
              renderTable();
            });
            label.appendChild(cb);
            label.appendChild(document.createTextNode(" " + p[1]));
            colList.appendChild(label);
          });
        }
        function renderWidthControls() {
          if (!widthList) return;
          widthList.innerHTML = "";
          SA_COLS.forEach(function (p) {
            var key = p[0];
            var label = document.createElement("label");
            label.textContent = p[1];
            var inp = document.createElement("input");
            inp.type = "number";
            inp.min = "32";
            inp.max = "800";
            inp.value = String(getSaColWidthPx(key));
            inp.addEventListener("change", function () {
              var w = parseInt(inp.value, 10);
              if (!Number.isFinite(w)) w = SA_COL_MIN[key] || 90;
              saColWidths[key] = Math.max(32, Math.min(800, w));
              inp.value = String(saColWidths[key]);
              saveSaColWidths(saColWidths);
              buildSaThead();
              applySaBodyColumnWidths();
            });
            label.appendChild(inp);
            widthList.appendChild(label);
          });
        }
        renderColumnControls();
        renderWidthControls();
        var colToggle = document.getElementById("dg-sa-columns-toggle");
        var widthToggle = document.getElementById("dg-sa-widths-toggle");
        if (colToggle) {
          colToggle.addEventListener("click", function (e) {
            e.stopPropagation();
            if (widthPanel) widthPanel.classList.remove("open");
            if (colPanel) colPanel.classList.toggle("open");
            syncWrap();
          });
        }
        if (widthToggle) {
          widthToggle.addEventListener("click", function (e) {
            e.stopPropagation();
            if (colPanel) colPanel.classList.remove("open");
            if (widthPanel) widthPanel.classList.toggle("open");
            syncWrap();
          });
        }
        document.addEventListener("click", function () {
          if (colPanel) colPanel.classList.remove("open");
          if (widthPanel) widthPanel.classList.remove("open");
          syncWrap();
        });
        if (wrap) wrap.addEventListener("click", function (e) { e.stopPropagation(); });
        var colAll = document.getElementById("dg-sa-columns-all");
        var colNone = document.getElementById("dg-sa-columns-none");
        var colDef = document.getElementById("dg-sa-columns-default");
        if (colAll) colAll.addEventListener("click", function () {
          visibleSaCols = SA_DEFAULT_VISIBLE.slice();
          saveSaVisibleCols(visibleSaCols);
          renderColumnControls();
          renderTable();
        });
        if (colNone) colNone.addEventListener("click", function () {
          visibleSaCols = ["supplier_name"];
          saveSaVisibleCols(visibleSaCols);
          renderColumnControls();
          renderTable();
        });
        if (colDef) colDef.addEventListener("click", function () {
          visibleSaCols = SA_DEFAULT_VISIBLE.slice();
          saveSaVisibleCols(visibleSaCols);
          renderColumnControls();
          renderTable();
        });
        var widthDef = document.getElementById("dg-sa-widths-default");
        if (widthDef) widthDef.addEventListener("click", function () {
          saColWidths = {};
          saveSaColWidths(saColWidths);
          renderWidthControls();
          renderTable();
        });
      }


      /** Перед перерисовкой tbody — иначе innerHTML уничтожает #dg-sa-detail-card вместе со слотом. */
      function stashDetailCardInHost() {
        var host = document.getElementById("dg-sa-detail-host");
        var card = document.getElementById("dg-sa-detail-card");
        if (!host || !card) return;
        host.appendChild(card);
        card.classList.add("d-none");
        host.classList.add("d-none");
        host.setAttribute("aria-hidden", "true");
      }

      function mountDetailCard() {
        var host = document.getElementById("dg-sa-detail-host");
        var card = document.getElementById("dg-sa-detail-card");
        if (!card) return;
        var slot =
          state.selectedKey &&
          document.querySelector("#dg-sa-tbody tr.dg-sa-detail-row #dg-sa-detail-slot");
        if (slot) {
          slot.appendChild(card);
          card.classList.remove("d-none");
          card.removeAttribute("aria-hidden");
          if (host) {
            host.classList.add("d-none");
            host.setAttribute("aria-hidden", "true");
          }
          return;
        }
        if (host) {
          host.appendChild(card);
          card.classList.add("d-none");
          host.classList.add("d-none");
          host.setAttribute("aria-hidden", "true");
        }
      }

      function fmtPctPlain(n) {
        if (n == null || n === "") return "—";
        var x = Number(n);
        if (!Number.isFinite(x)) return "—";
        return x.toFixed(1) + "%";
      }

      /** Доля оборота в месяц в % от суммы остатка (бэкенд отдаёт коэффициент, не проценты). */
      function fmtTurnoverMonthlyPct(n) {
        if (n == null || n === "") return "—";
        var x = Number(n);
        if (!Number.isFinite(x)) return "—";
        return (x * 100).toFixed(1) + "%";
      }

      function fmtNewCell(r) {
        var n = Number(r.skus_new_on_stock);
        if (!Number.isFinite(n) || n <= 0) return "0";
        var avg = r.new_avg_days_on_stock;
        if (avg != null && Number.isFinite(Number(avg))) {
          return fmtQty(n) + " · ср." + Math.round(Number(avg)) + "д";
        }
        return fmtQty(n);
      }

        var open = r.supplier_key === state.selectedKey;
        var active = open ? " dg-sa-row-active" : "";
        var viewHint = open && state.detailView ? " dg-sa-row-view-" + state.detailView : "";
        var html =
          '<tr class="dg-sa-row dg-sa-row-expandable' +
          active +
          viewHint +
          '" data-key="' +
          esc(r.supplier_key) +
          '" data-name="' +

          fmtQty(rowNum) +

      function renderTable() {
        var theadEl = document.getElementById("dg-sa-thead");
        var rowEl = theadEl && theadEl.querySelector("tr");
        if (theadEl && rowEl) clearSaHeaderFloatStyles(theadEl, rowEl);
        buildSaThead();
        var tbody = document.getElementById("dg-sa-tbody");
        if (!tbody) return;
        destroyChart(trendChart);
        trendChart = null;
        stashDetailCardInHost();
        if (!state.rows.length) {
          tbody.innerHTML =
            '<tr><td colspan="' +
            saColCount() +
            '" class="text-center text-muted py-4">Ничего не найдено</td></tr>';
          mountDetailCard();
          return;
        }
        var html = [];
        var placed = false;
        state.rows.forEach(function (r, idx) {
          html.push(buildSupplierRowHtml(r, state.offset + idx + 1));
          if (r.supplier_key === state.selectedKey) {
            html.push(supplierDetailSlotRowHtml());
            placed = true;
          }
        });
        if (state.selectedKey && !placed) {
          html.push(supplierDetailSlotRowHtml());
        }
        tbody.innerHTML = html.join("");
        applySaBodyColumnWidths();
        mountDetailCard();
        if (state.selectedKey) {
          refreshDetailTablesFromCache();
          clearSaFloatingHeaderForDetail();
          var detailTr = tbody.querySelector("tr.dg-sa-detail-row");
          if (detailTr) {
            requestAnimationFrame(function () {
              captureSaTheadBaseTop();
              detailTr.scrollIntoView({ behavior: "smooth", block: "nearest" });
            });
          }
        }
        var page = Math.floor(state.offset / state.limit) + 1;
        var pages = Math.max(1, Math.ceil(state.total / state.limit));
        var status = document.getElementById("dg-sa-pager-status");
        if (status) {
          status.textContent =
            "Найдено: " +
            state.total +
            "; страница " +
            page +
            "/" +
            pages +
            "; показано: " +
            state.rows.length;
        }
        saRefreshFloatingAfterLayout();
        var prev = document.getElementById("dg-sa-prev");
        var next = document.getElementById("dg-sa-next");
        if (prev) prev.disabled = state.offset <= 0;
        if (next) next.disabled = state.offset + state.limit >= state.total;
      }
