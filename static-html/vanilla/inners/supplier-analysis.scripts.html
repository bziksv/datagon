      function userSaDetailWidthsKey(profile) {
        try {
          var u = String(localStorage.getItem("currentUser") || "guest").trim() || "guest";
          return "dg.supplier_analysis.detailWidths.v1:" + profile + ":" + u;
        } catch (e) {
          return "dg.supplier_analysis.detailWidths.v1:" + profile + ":guest";
        }
      }

      function loadDetailWidths(profile) {
        var defs = SA_DETAIL_WIDTH_DEFAULTS[profile] || {};
        try {
          var raw = localStorage.getItem(userSaDetailWidthsKey(profile));
          if (!raw) return Object.assign({}, defs);
          var parsed = JSON.parse(raw);
          return Object.assign({}, defs, parsed || {});
        } catch (e) {
          return Object.assign({}, defs);
        }
      }

      function saveDetailWidths(profile, map) {
        try {
          localStorage.setItem(userSaDetailWidthsKey(profile), JSON.stringify(map || {}));
        } catch (e) {}
      }

      function ensureDetailWidths(profile) {
        if (!detailWidthsByProfile[profile]) {
          detailWidthsByProfile[profile] = loadDetailWidths(profile);
        }
        return detailWidthsByProfile[profile];
      }

      function ensureDetailSort(tableKey) {
        var def = SA_DETAIL_TABLES[tableKey];
        if (!def) return { by: "code", dir: "asc" };
        if (!detailSortUi[tableKey]) {
          detailSortUi[tableKey] = {
            by: def.defaultSort.by,
            dir: def.defaultSort.dir,
          };
        }
        return detailSortUi[tableKey];
      }

      function detailSortArrow(dir) {
        return dir === "asc" ? " ↑" : " ↓";
      }

      function detailSortValue(p, key) {
        if (key === "stock_rub") return stockLineRub(p);
        if (key === "name" || key === "code") return String(p[key] || "");
        var n = Number(p[key]);
        return Number.isFinite(n) ? n : null;
      }

      function sortDetailRows(rows, ui, cols) {
        var list = rows.slice();
        var colMap = {};
        cols.forEach(function (c) {
          colMap[c[0]] = (c[2] && c[2].type) || "string";
        });
        var type = colMap[ui.by] || "string";
        list.sort(function (a, b) {
          var va = detailSortValue(a, ui.by);
          var vb = detailSortValue(b, ui.by);
          if (type === "number") {
            var na = va == null ? -Infinity : va;
            var nb = vb == null ? -Infinity : vb;
            if (na === nb) return 0;
            return ui.dir === "asc" ? na - nb : nb - na;
          }
          var sa = String(va || "");
          var sb = String(vb || "");
          var cmp = sa.localeCompare(sb, "ru", { sensitivity: "base" });
          return ui.dir === "asc" ? cmp : -cmp;
        });
        return list;
      }

      var SA_DETAIL_COL_MIN = 32;
      var SA_DETAIL_COL_MAX = 600;

      function clampDetailColWidthPx(w, fallback) {
        var n = Number(w);
        if (!Number.isFinite(n)) return fallback;
        return Math.max(SA_DETAIL_COL_MIN, Math.min(SA_DETAIL_COL_MAX, Math.round(n)));
      }

      function detailColWidth(profile, key, cols) {
        var widths = ensureDetailWidths(profile);
        var stored = Number(widths[key]);
        if (Number.isFinite(stored) && stored > 0) {
          return clampDetailColWidthPx(stored, stored);
        }
        var defs = SA_DETAIL_WIDTH_DEFAULTS[profile] || {};
        if (defs[key]) return defs[key];
        var col = cols.find(function (c) { return c[0] === key; });
        if (col && col[2] && col[2].nameCol) return 220;
        return 72;
      }

      function getDetailTableColumnWidths(def) {
        return def.cols.map(function (c) {
          return detailColWidth(def.widthProfile, c[0], def.cols);
        });
      }

      function getDetailTableEl(def) {
        if (def.tableId) {
          var byId = document.getElementById(def.tableId);
          if (byId) return byId;
        }
        var tbody = document.getElementById(def.tbodyId);
        return tbody ? tbody.closest("table") : null;
      }

      function applyDetailColgroup(colgroupId, widths) {
        var cg = document.getElementById(colgroupId);
        if (!cg) return;
        cg.innerHTML = widths
          .map(function (w) {
            return (
              '<col style="width:' +
              w +
              "px;min-width:" +
              w +
              "px;max-width:" +
              w +
              'px">'
            );
          })
          .join("");
      }

      function applyDetailTableLayout(tableKey) {
        var def = SA_DETAIL_TABLES[tableKey];
        if (!def || !def.colgroupId || !def.widthProfile) return;
        var table = getDetailTableEl(def);
        if (!table) return;
        var widths = getDetailTableColumnWidths(def);
        var total = widths.reduce(function (s, w) {
          return s + w;
        }, 0);
        applyDetailColgroup(def.colgroupId, widths);
        table.classList.add("dg-sa-detail-table-sized");
        table.style.tableLayout = "fixed";
        table.style.width = total + "px";
        table.style.minWidth = total + "px";
        table.style.maxWidth = total + "px";
        var headTr = table.querySelector("thead tr");
        if (headTr) {
          Array.prototype.forEach.call(headTr.children, function (th, i) {
            if (widths[i]) setSaCellWidthStyle(th, widths[i]);
          });
        }
        table.querySelectorAll("tbody tr").forEach(function (tr) {
          if (tr.querySelector("td[colspan]")) return;
          Array.prototype.forEach.call(tr.children, function (td, i) {
            if (widths[i]) setSaCellWidthStyle(td, widths[i]);
          });
        });
      }

      function buildDetailThead(tableKey) {
        var def = SA_DETAIL_TABLES[tableKey];
        if (!def) return;
        var thead = document.getElementById(def.theadId);
        if (!thead) return;
        var ui = ensureDetailSort(tableKey);
        thead.innerHTML = "";
        var tr = document.createElement("tr");
        def.cols.forEach(function (c) {
          var key = c[0];
          var label = c[1];
          var opts = c[2] || {};
          var th = document.createElement("th");
          th.scope = "col";
          th.className = "dg-sa-detail-sortable" + (opts.align === "end" ? " text-end" : "");
          if (opts.nameCol) th.classList.add("dg-sa-detail-name-col");
          th.setAttribute("data-dg-detail-table", tableKey);
          th.setAttribute("data-sort-key", key);
          if (ui.by === key) {
            th.classList.add("dg-sa-detail-sort-active");
            th.setAttribute("aria-sort", ui.dir === "asc" ? "ascending" : "descending");
            th.textContent = label + detailSortArrow(ui.dir);
          } else {
            th.textContent = label;
          }
          applySaThTooltip(th, opts);
          tr.appendChild(th);
        });
        thead.appendChild(tr);
        if (def.colgroupId && def.widthProfile) {
          applyDetailTableLayout(tableKey);
        }
      }

      function detailCodeCellHtml(p) {
        return (
          '<td class="dg-sa-detail-code-cell"><a href="' +
          productHref(p.code) +
          '" target="_blank" rel="noopener">' +
          esc(p.code) +
          "</a></td>"
        );
      }

      function detailNameCellHtml(p) {
        var title = esc(p.name);
        return (
          '<td class="dg-sa-detail-name-cell" title="' +
          title +
          '"><a href="' +
          productHref(p.code) +
          '" target="_blank" rel="noopener">' +
          title +
          "</a></td>"
        );
      }

      function detailCellHtml(key, p) {
        switch (key) {
          case "code":
            return detailCodeCellHtml(p);
          case "name":
            return detailNameCellHtml(p);
          case "stock":
            return '<td class="text-end">' + fmtQty(p.stock) + "</td>";
          case "in_transit":
            return (
              '<td class="text-end">' +
              (p.in_transit != null && Number.isFinite(Number(p.in_transit)) ? fmtQty(p.in_transit) : "—") +
              "</td>"
            );
          case "stock_rub":
            return '<td class="text-end">' + fmtMoney(stockLineRub(p)) + "</td>";
          case "sales_qty":
            return '<td class="text-end">' + fmtQty(p.sales_qty) + "</td>";
          case "sales_revenue":
            return '<td class="text-end">' + fmtMoney(p.sales_revenue) + "</td>";
          case "gross_margin_est":
            return '<td class="text-end">' + fmtMoney(p.gross_margin_est) + "</td>";
          case "margin_pct":
            return '<td class="text-end">' + fmtPctPlain(p.margin_pct) + "</td>";
          case "days_on_stock":
            return (
              '<td class="text-end">' +
              (p.days_on_stock != null && Number(p.days_on_stock) > 0 ? fmtQty(p.days_on_stock) : "—") +
              "</td>"
            );
          case "max_streak_days":
            return '<td class="text-end">' + fmtQty(p.max_streak_days) + "</td>";
          case "episode_count":
            return '<td class="text-end">' + fmtQty(p.episode_count) + "</td>";
          case "avg_episode_days":
            return (
              '<td class="text-end">' +
              (p.avg_episode_days != null ? String(p.avg_episode_days) : "—") +
              "</td>"
            );
          case "absent_days":
            return '<td class="text-end">' + fmtQty(p.absent_days) + "</td>";
          case "flags":
            return (
              '<td class="small">' +
              (p.chronic ? '<span class="badge bg-danger me-1">долгий</span>' : "") +
              (p.flicker ? '<span class="badge bg-warning text-dark">частый</span>' : "") +
              (!p.chronic && !p.flicker ? "—" : "") +
              "</td>"
            );
          default:
            return '<td>—</td>';
        }
      }

      function detailSkuRowHtml(p, cols) {
        if (!p || !cols || !cols.length) return "";
        return "<tr>" + cols.map(function (c) { return detailCellHtml(c[0], p); }).join("") + "</tr>";
      }

      function renderDetailTable(tableKey) {
        var def = SA_DETAIL_TABLES[tableKey];
        if (!def || !def.cols || !def.cols.length) return;
        var tbody = document.getElementById(def.tbodyId);
        if (!tbody) return;
        var rows = detailRowsCache[def.cacheKey] || [];
        var ui = ensureDetailSort(tableKey);
        buildDetailThead(tableKey);
        var sorted = sortDetailRows(rows, ui, def.cols);
        var colSpan = def.cols.length;
        if (!sorted.length) {
          tbody.innerHTML =
            '<tr><td colspan="' +
            colSpan +
            '" class="text-muted">' +
            def.emptyText +
            "</td></tr>";
          if (def.colgroupId && def.widthProfile) applyDetailTableLayout(tableKey);
          return;
        }
        try {
          var html = sorted
            .map(function (p) {
              return detailSkuRowHtml(p, def.cols);
            })
            .filter(Boolean)
            .join("");
          tbody.innerHTML = html || (
            '<tr><td colspan="' + colSpan + '" class="text-muted">' + def.emptyText + "</td></tr>"
          );
          if (def.colgroupId && def.widthProfile) applyDetailTableLayout(tableKey);
        } catch (err) {
          console.error("[supplier-analysis] detail table", tableKey, err);
          tbody.innerHTML =
            '<tr><td colspan="' +
            colSpan +
            '" class="text-danger">Ошибка отрисовки: ' +
            esc(err && err.message ? err.message : String(err)) +
            "</td></tr>";
        }
      }

      function refreshDetailTablesFromCache() {
        if (!state.selectedKey) return;
        mountDetailCard();
        Object.keys(SA_DETAIL_TABLES).forEach(function (tableKey) {
          var def = SA_DETAIL_TABLES[tableKey];
          if (!def) return;
          var cached = detailRowsCache[def.cacheKey];
          if (cached && cached.length) renderDetailTable(tableKey);
        });
      }

      function setDetailRows(tableKey, rows) {
        var def = SA_DETAIL_TABLES[tableKey];
        if (!def) return;
        detailRowsCache[def.cacheKey] = rows || [];
        if (state.selectedKey) mountDetailCard();
        renderDetailTable(tableKey);
      }

      function renderDetailTablesForProfile(widthProfile) {
        Object.keys(SA_DETAIL_TABLES).forEach(function (tableKey) {
          var def = SA_DETAIL_TABLES[tableKey];
          if (def.widthProfile === widthProfile) renderDetailTable(tableKey);
        });
      }

      function renderDetailWidthControls(profile) {
        var rootId = profile === "ext" ? "dg-sa-detail-widths-ext" : "dg-sa-detail-widths-simple";
        var root = document.getElementById(rootId);
        if (!root) return;
        var cols = profile === "ext" ? SA_DETAIL_COLS_EXT : SA_DETAIL_COLS_SIMPLE;
        var widths = ensureDetailWidths(profile);
        root.innerHTML = "";
        cols.forEach(function (c) {
          var key = c[0];
          var label = document.createElement("label");
          label.textContent = c[1];
          var inp = document.createElement("input");
          inp.type = "number";
          inp.min = String(SA_DETAIL_COL_MIN);
          inp.max = String(SA_DETAIL_COL_MAX);
          inp.value = String(detailColWidth(profile, key, cols));
          inp.addEventListener("change", function () {
            var fb = SA_DETAIL_WIDTH_DEFAULTS[profile][key] || 80;
            widths[key] = clampDetailColWidthPx(parseInt(inp.value, 10), fb);
            inp.value = String(widths[key]);
            saveDetailWidths(profile, widths);
            renderDetailTablesForProfile(profile);
          });
          label.appendChild(inp);
          root.appendChild(label);
        });
      }

      function bindSaDetailTables() {
        var card = document.getElementById("dg-sa-detail-card");
        if (card) {
          card.addEventListener("click", function (ev) {
            var th = ev.target.closest("th.dg-sa-detail-sortable");
            if (!th) return;
            if (window.getSelection && window.getSelection().toString().trim()) return;
            var tableKey = th.getAttribute("data-dg-detail-table");
            var sortKey = th.getAttribute("data-sort-key");
            if (!tableKey || !sortKey) return;
            var ui = ensureDetailSort(tableKey);
            if (ui.by === sortKey) ui.dir = ui.dir === "asc" ? "desc" : "asc";
            else {
              ui.by = sortKey;
              ui.dir = sortKey === "name" || sortKey === "code" ? "asc" : "desc";
            }
            renderDetailTable(tableKey);
          });
        }
        document.querySelectorAll(".dg-sa-detail-widths-btn").forEach(function (btn) {
          btn.addEventListener("click", function (e) {
            e.stopPropagation();
            var profile = btn.getAttribute("data-dg-detail-profile");
            if (!profile) return;
            var wrap = document.querySelector(
              '.dg-sa-detail-widths-panel-wrap[data-dg-detail-profile="' + profile + '"]'
            );
            if (!wrap) return;
            var willOpen = wrap.classList.contains("d-none");
            wrap.classList.toggle("d-none");
            if (willOpen) renderDetailWidthControls(profile);
          });
        });
        document.querySelectorAll(".dg-sa-detail-widths-default").forEach(function (btn) {
          btn.addEventListener("click", function (e) {
            e.stopPropagation();
            var profile = btn.getAttribute("data-dg-detail-profile");
            if (!profile) return;
            detailWidthsByProfile[profile] = Object.assign({}, SA_DETAIL_WIDTH_DEFAULTS[profile] || {});
            saveDetailWidths(profile, detailWidthsByProfile[profile]);
            renderDetailWidthControls(profile);
            renderDetailTablesForProfile(profile);
          });
        });
        renderDetailWidthControls("ext");
        renderDetailWidthControls("simple");
      }

      function stockLineRub(p) {
        var s = Number(p.stock);
        var b = Number(p.buy_price);
        if (!Number.isFinite(s) || !Number.isFinite(b)) return null;
        return s * b;
      }

      function setDetailBlockCount(elId, payload, fallbackTotal) {
        var el = document.getElementById(elId);
        if (!el) return;
        var total = payload && payload.total != null ? Number(payload.total) : fallbackTotal;
        var shown = (payload && payload.rows && payload.rows.length) || 0;
        if (!Number.isFinite(total)) total = shown;
        var txt = "— " + fmtQty(total);
        if (payload && payload.truncated && shown < total) {
          txt += ", показано " + fmtQty(shown);
        }
        el.textContent = txt;
      }

      function fetchProducts(supplierKey, mode, limit) {
        var px = new URLSearchParams();
        px.set("supplier_key", supplierKey);
        px.set("days", String(state.days));
        px.set("mode", mode);
        px.set("limit", String(limit || 20));
        if (mode === "stale" || mode === "laggards" || mode === "new") {
          px.set("new_stock_days", String(state.new_stock_days));
        }
        appendProjectParams(px);
        return fetch("/api/supplier-analysis/products?" + px.toString(), {
          credentials: "same-origin",
          headers: authHeaders(),
        })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (payload) {
            if (!payload || payload.success === false) {
              throw new Error((payload && payload.error) || "Ошибка загрузки SKU");
            }
            return payload;
          });
      }

      function setDetailTbodyLoading(tbodyId, colCount, message) {
        var el = document.getElementById(tbodyId);
        if (!el) return;
        var n = Math.max(1, colCount || 1);
        el.innerHTML =
          '<tr><td colspan="' +
          n +
          '" class="text-muted">' +
          esc(message || "Загрузка…") +
          "</td></tr>";
      }

      function showDetailLoadError(tbodyIds, colCount, message) {
        (tbodyIds || []).forEach(function (id) {
          setDetailTbodyLoading(id, colCount, message);
        });
      }

      function syncDetailPanels(viewMode) {
        var summary = document.getElementById("dg-sa-detail-view-summary");
        var wh = document.getElementById("dg-sa-detail-view-warehouse");
        var all = document.getElementById("dg-sa-detail-view-all-skus");
        if (summary) summary.classList.toggle("d-none", viewMode !== "summary");
        if (wh) wh.classList.toggle("d-none", viewMode !== "warehouse");
        if (all) all.classList.toggle("d-none", viewMode !== "all_skus");
      }

      function updateDetailChrome(key, name, viewMode) {
        var title = document.getElementById("dg-sa-detail-title");
        var sig = document.getElementById("dg-sa-detail-signals");
        var row = findSupplierRow(key);
        var label = name || key;
        if (title) {
          if (viewMode === "warehouse") title.textContent = "SKU складская: " + label;
          else if (viewMode === "all_skus") title.textContent = "SKU всего: " + label;
          else title.textContent = "Сводка: " + label;
        }
        if (sig) {
          if (viewMode === "summary" && row) sig.innerHTML = signalBadges(row.signals);
          else if (viewMode === "warehouse")
            sig.innerHTML =
              '<span class="text-muted small">Складские SKU: остатки, продажи и эпизоды нулевого остатка по каждому коду</span>';
          else if (viewMode === "all_skus")
            sig.innerHTML =
              '<span class="text-muted small">Сначала позиции без «складская», затем складские с полными показателями</span>';
          else
            sig.innerHTML =
              '<span class="text-muted small">Поставщик не на этой странице — данные SKU ниже</span>';
        }
      }

      function mergeAbsenceIntoSkuRows(skuRows, absenceRows) {
        var map = {};
        (absenceRows || []).forEach(function (a) {
          if (!a || !a.code) return;
          map[String(a.code)] = a;
        });
        return (skuRows || []).map(function (p) {
          var a = map[String(p.code || "")];
          if (!a) {
            return Object.assign({}, p, {
              max_streak_days: null,
              episode_count: null,
              avg_episode_days: null,
              absent_days: null,
              chronic: false,
              flicker: false,
            });
          }
          return Object.assign({}, p, {
            max_streak_days: a.max_streak_days,
            episode_count: a.episode_count,
            avg_episode_days: a.avg_episode_days,
            absent_days: a.absent_days,
            chronic: !!a.chronic,
            flicker: !!a.flicker,
          });
        });
      }

      function loadDetailContent(key, name, viewMode, loadSeq) {
        syncDetailPanels(viewMode);
        updateDetailChrome(key, name, viewMode);
        var supplierRow = findSupplierRow(key);

        if (viewMode === "warehouse") {
          setDetailTbodyLoading("dg-sa-detail-warehouse-ext", SA_DETAIL_COLS_EXT.length);
          Promise.all([fetchProducts(key, "warehouse", 500), fetchProducts(key, "absence", 500)])
            .then(function (parts) {
              if (loadSeq !== detailLoadSeq || state.selectedKey !== key) return;
              var payload = parts[0] || {};
              var absRows = (parts[1] && parts[1].rows) || [];
              var rows = mergeAbsenceIntoSkuRows(payload.rows || [], absRows);
              setDetailBlockCount(
                "dg-sa-detail-warehouse-ext-count",
                payload,
                supplierRow && (supplierRow.skus_warehouse != null ? supplierRow.skus_warehouse : supplierRow.products_total)
              );
              setDetailRows("warehouse_ext", rows);
            })
            .catch(function (err) {
              if (loadSeq !== detailLoadSeq || state.selectedKey !== key) return;
              showDetailLoadError(["dg-sa-detail-warehouse-ext"], SA_DETAIL_COLS_EXT.length, err.message || String(err));
            });
          return;
        }

        if (viewMode === "all_skus") {
          setDetailTbodyLoading("dg-sa-detail-non-warehouse", SA_DETAIL_COLS_SIMPLE.length);
          setDetailTbodyLoading("dg-sa-detail-warehouse-in-all", SA_DETAIL_COLS_EXT.length);
          Promise.all([fetchProducts(key, "all_skus", 500), fetchProducts(key, "absence", 500)])
            .then(function (parts) {
              if (loadSeq !== detailLoadSeq || state.selectedKey !== key) return;
              var payload = parts[0] || {};
              var absRows = (parts[1] && parts[1].rows) || [];
              var rows = mergeAbsenceIntoSkuRows(payload.rows || [], absRows);
              var nonWh = rows.filter(function (p) {
                return !p.is_warehouse;
              });
              var wh = rows.filter(function (p) {
                return p.is_warehouse;
              });
              setDetailBlockCount("dg-sa-detail-non-wh-count", { total: nonWh.length, rows: nonWh, truncated: false }, nonWh.length);
              setDetailBlockCount(
                "dg-sa-detail-wh-in-all-count",
                { total: wh.length, rows: wh, truncated: payload && payload.truncated },
                wh.length
              );
              setDetailRows("non_warehouse", nonWh);
              setDetailRows("warehouse_in_all", wh);
            })
            .catch(function (err) {
              if (loadSeq !== detailLoadSeq || state.selectedKey !== key) return;
              showDetailLoadError(
                ["dg-sa-detail-non-warehouse", "dg-sa-detail-warehouse-in-all"],
                SA_DETAIL_COLS_EXT.length,
                err.message || String(err)
              );
            });
          return;
        }

        loadChartJs().then(function (Chart) {
          if (loadSeq !== detailLoadSeq || state.selectedKey !== key) return;
          loadTrendChart(Chart);
        });
        ["dg-sa-detail-absence", "dg-sa-detail-stale", "dg-sa-detail-new", "dg-sa-detail-weak"].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.innerHTML = '<tr><td colspan="10" class="text-muted">Загрузка…</td></tr>';
        });
        var absLink = document.getElementById("dg-sa-detail-absence-suppliers");
        if (absLink) absLink.href = suppliersHref(name || key);
        Promise.all([
          fetchProducts(key, "absence", 100),
          fetchProducts(key, "stale", 25),
          fetchProducts(key, "new", 25),
          fetchProducts(key, "weak", 25),
        ]).then(function (parts) {
          if (loadSeq !== detailLoadSeq || state.selectedKey !== key) return;
          var absencePayload = parts[0] || {};
          var absence = absencePayload.rows || [];
          var stale = (parts[1] && parts[1].rows) || [];
          var fresh = (parts[2] && parts[2].rows) || [];
          var weak = (parts[3] && parts[3].rows) || [];
          var roll = absencePayload.rollup;
          var rollEl = document.getElementById("dg-sa-detail-absence-rollup");
          if (rollEl) {
            if (roll && (roll.chronic_sku_count > 0 || roll.flicker_sku_count > 0 || roll.absence_sku_count > 0)) {
              rollEl.textContent =
                "Долгих SKU: " +
                (roll.chronic_sku_count || 0) +
                " · частых коротких: " +
                (roll.flicker_sku_count || 0) +
                " · SKU с нулём: " +
                (roll.absence_sku_count || 0) +
                (roll.chronic_max_streak_days
                  ? " · макс. простой: " + roll.chronic_max_streak_days + " дн."
                  : "");
            } else {
              rollEl.textContent = "Эпизоды нулевого остатка по SKU за период анализа";
            }
          }
          setDetailBlockCount("dg-sa-detail-absence-count", absencePayload, absence.length);
          setDetailRows("absence", absence);
          setDetailRows("stale", stale);
          setDetailRows("new", fresh);
          setDetailRows("weak", weak);
        });
      }

      function openDetail(key, name, viewMode) {
        if (!key) return;
        viewMode = viewMode || "summary";
        if (state.selectedKey === key && state.detailView === viewMode) {
          closeDetail();
          return;
        }
        state.selectedKey = key;
        state.detailView = viewMode;
        var loadSeq = ++detailLoadSeq;
        renderTable();
        var supLink = document.getElementById("dg-sa-detail-suppliers");
        if (supLink) {
          supLink.href = suppliersHref(name || key);
          supLink.classList.remove("d-none");
        }
        requestAnimationFrame(function () {
          if (state.selectedKey !== key || loadSeq !== detailLoadSeq) return;
          mountDetailCard();
          loadDetailContent(key, name, viewMode, loadSeq);
        });
      }

      function resolveRowClickView(cell) {
        if (!cell) return "summary";
        if (cell.classList.contains("dg-sa-cell-skus-warehouse")) return "warehouse";
        if (cell.classList.contains("dg-sa-cell-skus-total")) return "all_skus";
        if (
          cell.classList.contains("dg-sa-cell-drill") ||
          cell.classList.contains("dg-sa-expand-cell") ||
          cell.classList.contains("dg-sa-cell-num") ||
          cell.classList.contains("dg-sa-cell-supplier")
        )
          return "summary";
        return null;
      }

      function loadRanking() {
        var p = new URLSearchParams();
        p.set("days", String(state.days));
        p.set("new_stock_days", String(state.new_stock_days));
        p.set("focus", state.focus || "all");
        p.set("limit", String(state.limit));
        p.set("offset", String(state.offset));
        p.set("sort_by", state.sort_by);
        p.set("sort_dir", state.sort_dir);
        if (state.search) p.set("search", state.search);
        appendProjectParams(p);
        return fetch("/api/supplier-analysis/ranking?" + p.toString(), {
          credentials: "same-origin",
          headers: authHeaders(),
        })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (j) {
            if (!j || !j.success) throw new Error((j && j.error) || "Ошибка");
            var rows = j.rows || [];
            // Страховка: если бэкенд по какой-то причине не отфильтровал — режем по применённому search.
            if (state.search) {
              var q = String(state.search).toLowerCase();
              var before = rows.length;
              rows = rows.filter(function (r) {
                return String((r && r.supplier_name) || "")
                  .toLowerCase()
                  .indexOf(q) >= 0;
              });
              state.total = rows.length !== before ? rows.length : j.total || 0;
            } else {
              state.total = j.total || 0;
            }
            state.rows = rows;
            renderTable();
          });
      }

      function loadAll() {
        var days = state.days;
        var q = new URLSearchParams();
        q.set("days", String(days));
        q.set("new_stock_days", String(state.new_stock_days));
        if (state.search) q.set("search", state.search);
        appendProjectParams(q);
        var pOverview = fetch("/api/supplier-analysis/overview?" + q.toString(), {
          credentials: "same-origin",
          headers: authHeaders(),
        }).then(function (r) { return r.json(); });
        var pHigh = fetch("/api/supplier-analysis/highlights?" + q.toString(), {
          credentials: "same-origin",
          headers: authHeaders(),
        }).then(function (r) { return r.json(); });
        return Promise.all([pOverview, pHigh, loadRanking(), loadSalesBreakdown()])
          .then(function (parts) {
            if (parts[0] && parts[0].success) {
              state.overview = parts[0];
              if (parts[0].project_filter && parts[0].project_filter.label) {
                updateProjectFilterHint(parts[0].project_filter.label);
              }
              renderKpis();
            }
            if (parts[1] && parts[1].success) {
              state.highlights = parts[1];
              renderHighlights();
              renderCharts();
            }

          })
          .catch(function (e) {
            if (window.DatagonNotify) {
              DatagonNotify.toast({ type: "danger", message: e.message || "Ошибка загрузки" });
            }
          });
      }

      function bindCollapse(toggleId, bodyId, key) {
        var btn = document.getElementById(toggleId);
        var body = document.getElementById(bodyId);
        if (!btn || !body) return;
        var storageKey = "dg.sa." + key + ".collapsed.v1";
        function apply(collapsed) {
          body.classList.toggle("d-none", collapsed);
          btn.textContent = collapsed ? "Развернуть" : "Свернуть";
        }
        try {
          apply(localStorage.getItem(storageKey) === "1");
        } catch (e) {}
        btn.addEventListener("click", function () {
          var c = !body.classList.contains("d-none");
          apply(c);
          try {
            localStorage.setItem(storageKey, c ? "1" : "0");
          } catch (e2) {}
        });
      }

      function bindSaTableCardCollapse() {
        var key = "dg.supplier_analysis.table-card.collapsed.v1";
        var body = document.getElementById("dg-sa-table-body");
        var btn = document.getElementById("dg-sa-table-toggle");
        if (!body || !btn) return;
        var collapsed = false;
        try {
          collapsed = window.localStorage.getItem(key) === "1";
        } catch (e) {}
        function apply() {
          body.style.display = collapsed ? "none" : "";
          btn.textContent = collapsed ? "Развернуть" : "Свернуть";
        }
        apply();
        btn.addEventListener("click", function () {
          collapsed = !collapsed;
          try {
            window.localStorage.setItem(key, collapsed ? "1" : "0");
          } catch (e2) {}
          apply();
          if (!collapsed) saRefreshFloatingAfterLayout();
        });
      }

      function init() {
        bindCollapse("dg-sa-filters-toggle", "dg-sa-filters-body", "filters");
        bindCollapse("dg-sa-summary-toggle", "dg-sa-summary-body", "summary");
        (function bindSaSummaryCollapseFloating() {
          var btn = document.getElementById("dg-sa-summary-toggle");
          if (!btn) return;
          btn.addEventListener("click", function () {
            requestAnimationFrame(function () {
              requestAnimationFrame(saRefreshFloatingAfterLayout);
            });
          });
        })();
        bindCollapse("dg-sa-breakdown-toggle", "dg-sa-breakdown-body", "breakdown");
        bindSaTableCardCollapse();

        var bdPrev = document.getElementById("dg-sa-breakdown-prev");
        var bdNext = document.getElementById("dg-sa-breakdown-next");
        if (bdPrev) {
          bdPrev.addEventListener("click", function () {
            state.breakdownOffset = Math.max(0, state.breakdownOffset - state.breakdownLimit);
            loadSalesBreakdown();
          });
        }
        if (bdNext) {
          bdNext.addEventListener("click", function () {
            var total = (state.breakdown && state.breakdown.total) || 0;
            if (state.breakdownOffset + state.breakdownLimit < total) {
              state.breakdownOffset += state.breakdownLimit;
              loadSalesBreakdown();
            }
          });
        }

        var daysEl = document.getElementById("dg-sa-days");
        var searchEl = document.getElementById("dg-sa-search");
        var pageSize = document.getElementById("dg-sa-page-size");

        var newStockEl = document.getElementById("dg-sa-new-stock-days");
        if (newStockEl) {
          newStockEl.addEventListener("change", function () {
            state.pending.new_stock_days = Number(newStockEl.value) || 30;
            syncDirtyApply();
          });
        }
        if (daysEl) {
          daysEl.addEventListener("change", function () {
            state.pending.days = Number(daysEl.value) || 90;
            syncDirtyApply();
          });
        }
        if (searchEl) {
          searchEl.addEventListener("input", function () {
            state.pending.search = searchEl.value;
            syncDirtyApply();
          });
          searchEl.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter") {
              ev.preventDefault();
              document.getElementById("dg-sa-apply").click();
            }
            if (ev.key === "Escape") {
              searchEl.value = "";
              state.pending.search = "";
              commitFilters();
            }
          });
        }
        if (pageSize) {
          pageSize.addEventListener("change", function () {
            state.limit = Number(pageSize.value) || 100;
            state.offset = 0;
            loadAll();
          });
        }

        document.getElementById("dg-sa-apply").addEventListener("click", commitFilters);
        var exportBtn = document.getElementById("dg-sa-export");
        if (exportBtn) {
          exportBtn.addEventListener("click", function () {
            var p = new URLSearchParams();
            p.set("days", String(state.days));
            p.set("new_stock_days", String(state.new_stock_days));
            if (state.search) p.set("search", state.search);
            appendProjectParams(p);
            window.location.href = "/api/supplier-analysis/export?" + p.toString();
            if (window.DatagonNotify) {
              DatagonNotify.toast({ type: "success", message: "Скачивание CSV…" });
            }
          });
        }

        document.getElementById("dg-sa-reset").addEventListener("click", function () {
          state.pending = { days: 90, new_stock_days: 30, search: "", project_mode: "selected", project_uuids: [] };
          if (daysEl) daysEl.value = "90";
          if (newStockEl) newStockEl.value = "30";
          if (searchEl) searchEl.value = "";
          var mirror = document.getElementById("dg-sa-table-search-mirror");
          if (mirror) mirror.value = "";
          syncSaPageSize(100);
          var modeSel = document.getElementById("dg-sa-project-mode-selected");
          if (modeSel) modeSel.checked = true;
          state.sort_by = "sales_revenue";
          state.sort_dir = "desc";
          buildSaThead();
          loadProjectsList()
            .then(function () {
              applyDefaultMarketplaceProjectSelection();
              syncDirtyApply();
              return commitFilters();
            })
            .catch(function () {
              syncDirtyApply();
              return commitFilters();
            });
        });

        ["dg-sa-project-mode-all", "dg-sa-project-mode-selected"].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.addEventListener("change", syncProjectModeUi);
        });
        var projReload = document.getElementById("dg-sa-projects-reload");
        if (projReload) projReload.addEventListener("click", loadProjectsList);
        var projSelAll = document.getElementById("dg-sa-projects-select-all");
        if (projSelAll) {
          projSelAll.addEventListener("click", function () {
            var list = document.getElementById("dg-sa-projects-list");
            if (!list) return;
            list.querySelectorAll('input[type="checkbox"][data-dg-sa-project-uuid]').forEach(function (cb) {
              cb.checked = true;
            });
            syncDirtyApply();
          });
        }
        var projClear = document.getElementById("dg-sa-projects-clear");
        if (projClear) {
          projClear.addEventListener("click", function () {
            var list = document.getElementById("dg-sa-projects-list");
            if (!list) return;
            list.querySelectorAll('input[type="checkbox"][data-dg-sa-project-uuid]').forEach(function (cb) {
              cb.checked = false;
            });
            syncDirtyApply();
          });
        }
        if (daysEl) {
          daysEl.addEventListener("change", function () {
            if (
              document.getElementById("dg-sa-project-mode-selected") &&
              document.getElementById("dg-sa-project-mode-selected").checked
            ) {
              loadProjectsList();
            }
          });
        }

        document.getElementById("dg-sa-prev").addEventListener("click", function () {
          state.offset = Math.max(0, state.offset - state.limit);
          loadRanking();
        });
        document.getElementById("dg-sa-next").addEventListener("click", function () {
          if (state.offset + state.limit < state.total) {
            state.offset += state.limit;
            loadRanking();
          }
        });

        document.getElementById("dg-sa-detail-close").addEventListener("click", closeDetail);

        document.getElementById("dg-sa-tbody").addEventListener("click", function (ev) {
          if (ev.target.closest("a") || ev.target.closest(".dg-sa-detail-row")) return;
          var tr = ev.target.closest("tr.dg-sa-row-expandable");
          if (!tr) return;
          var cell = ev.target.closest("td");
          var view = resolveRowClickView(cell);
          if (!view) return;
          openDetail(tr.getAttribute("data-key"), tr.getAttribute("data-name"), view);
        });
        document.getElementById("dg-sa-tbody").addEventListener("keydown", function (ev) {
          if (ev.key !== "Enter" && ev.key !== " ") return;
          var tr = ev.target.closest("tr.dg-sa-row-expandable");
          if (!tr) return;
          var cell = ev.target.closest("td");
          var view = resolveRowClickView(cell) || "summary";
          ev.preventDefault();
          openDetail(tr.getAttribute("data-key"), tr.getAttribute("data-name"), view);
        });

        document.getElementById("dg-sa-highlights-row").addEventListener("click", function (ev) {
          var li = ev.target.closest(".dg-sa-pick");
          if (!li) return;
          openDetail(li.getAttribute("data-key"), li.getAttribute("data-name"), "summary");
        });

        bindSaDetailTables();
        bindSaHeaderSearchMirror();
        bindSaPagination();
        saColumnControls();
        buildSaThead();
        updateSaStickyTopVar();
        window.addEventListener("scroll", onScrollSaFloatingHeader, { passive: true });
        window.addEventListener("resize", function () {
          updateSaStickyTopVar();
          saRefreshFloatingAfterLayout();
        });
        (function bindSaScrollContainers() {
          var mainOuter = document.querySelector(".app-main__outer");
          var scrollOuter = document.getElementById("dg-sa-table-scroll-outer");
          if (mainOuter) mainOuter.addEventListener("scroll", onScrollSaFloatingHeader, { passive: true });
          if (scrollOuter) scrollOuter.addEventListener("scroll", onScrollSaFloatingHeader, { passive: true });
        })();
        loadFreshness();
        state.pending.project_mode = "selected";
        state.project_mode = "selected";
        var modeSelInit = document.getElementById("dg-sa-project-mode-selected");
        if (modeSelInit) modeSelInit.checked = true;
        var wrapInit = document.getElementById("dg-sa-projects-wrap");
        var selAllInit = document.getElementById("dg-sa-projects-select-all");
        var clearInit = document.getElementById("dg-sa-projects-clear");
        if (wrapInit) wrapInit.classList.remove("d-none");
        if (selAllInit) selAllInit.classList.remove("d-none");
        if (clearInit) clearInit.classList.remove("d-none");
        loadProjectsList()
          .then(function () {
            applyDefaultMarketplaceProjectSelection();
            syncDirtyApply();
            return commitFilters();
          })
          .catch(function () {
            syncDirtyApply();
            return commitFilters();
          });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
