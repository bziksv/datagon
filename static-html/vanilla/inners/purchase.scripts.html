      function purchaseFmtDateTime(v) {
        if (!v) return "";
        try {
          var d = new Date(v);
          if (isNaN(d.getTime())) return String(v);
          return d.toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "medium" });
        } catch (e) {
          return String(v);
        }
      }

      function formulaCacheStatusClass(running, dbStatus) {
        if (running) return "text-warning";
        var st = String(dbStatus || "");
        if (st === "failed") return "text-danger";
        if (st === "completed") return "text-success";
        return "text-muted";
      }

      function renderFormulaCacheProgress(payload) {
        var statusEl = document.getElementById("dg-pu-formula-cache-status");
        var logEl = document.getElementById("dg-pu-formula-cache-log");
        var barWrap = document.getElementById("dg-pu-formula-cache-progress-wrap");
        var bar = document.getElementById("dg-pu-formula-cache-progress-bar");
        if (!statusEl || !logEl) return;
        var live = (payload && payload.live) || {};
        var db = payload && payload.db_run;
        var running = !!(payload && payload.running);
        var msg = String(live.message || (db && db.message) || "").trim();
        var pct = running ? Math.max(0, Math.min(100, Number(live.pct) || 0)) : 0;
        if (!running && db && String(db.status) === "completed") pct = 100;

        if (running) {
          var total = Number(live.selection_total) || 0;
          var done = Number(live.processed) || 0;
          statusEl.textContent =
            msg ||
            (total > 0
              ? "Выполняется: " + fmtNum(done) + " / " + fmtNum(total)
              : "Выполняется…");
        } else if (db && db.status) {
          statusEl.textContent = msg || "Задача: " + db.status;
        } else {
          statusEl.textContent = msg || "—";
        }
        statusEl.className = formulaCacheStatusClass(running, db && db.status);

        if (barWrap && bar) {
          if (running) {
            barWrap.classList.remove("d-none");
            bar.style.width = pct + "%";
            bar.setAttribute("aria-valuenow", String(Math.round(pct)));
            bar.classList.add("progress-bar-animated");
          } else if (db && String(db.status) === "completed") {
            barWrap.classList.remove("d-none");
            bar.style.width = "100%";
            bar.setAttribute("aria-valuenow", "100");
            bar.classList.remove("progress-bar-animated");
          } else {
            barWrap.classList.add("d-none");
            bar.style.width = "0%";
            bar.setAttribute("aria-valuenow", "0");
          }
        }

        var lines = [];
        var doneN = Number(live.processed) || 0;
        var totalN = Number(live.selection_total) || 0;
        if (running) {
          if (totalN > 0) {
            lines.push(
              "Прогресс: " +
                fmtNum(doneN) +
                " / " +
                fmtNum(totalN) +
                " поз., в кэш " +
                fmtNum(live.upserted || 0)
            );
          } else if (doneN > 0) {
            lines.push(
              "Обработано " +
                fmtNum(doneN) +
                " поз., в кэш " +
                fmtNum(live.upserted || 0) +
                " (идёт пересчёт, между пакетами пауза на формулу — это нормально)"
            );
          }
          if (live.last_tick_ms) {
            var secAgo = Math.max(0, Math.round((Date.now() - Number(live.last_tick_ms)) / 1000));
            lines.push("Последнее обновление: " + secAgo + " с назад");
          }
        }
        if (msg && lines.indexOf(msg) < 0 && lines.join("\n").indexOf(msg) < 0) lines.push(msg);
        if (db && db.started_at) lines.push("Старт: " + purchaseFmtDateTime(db.started_at));
        if (db && db.finished_at && !running) {
          lines.push("Завершено: " + purchaseFmtDateTime(db.finished_at));
        }
        if (db && db.trigger_type) {
          lines.push(
            "Запуск: " + (db.trigger_type === "manual" ? "вручную" : db.trigger_type)
          );
        }
        logEl.textContent =
          lines.length > 0 ? lines.join("\n") : "Журнал пересчёта: пока нет запусков.";
      }

              return;

            var running = !!x.j.running;
            renderFormulaCacheProgress(x.j);
            if (running) {
              if (!formulaCachePollTimer) {
                formulaCachePollTimer = window.setInterval(function () {

              if (formulaCacheWasRunning) {
                formulaCacheWasRunning = false;

                      type: "success",

                      message:

                        "Пересчёт кэша завершился с ошибкой.",

              }
            }
          })

            var logEl = document.getElementById("dg-pu-formula-cache-log");
            if (logEl) logEl.textContent = "Сетевая ошибка загрузки журнала пересчёта.";

      function loadData() {
        if (loading) return;
        var mySeq = ++loadSeq;
        var p = buildListParams();
        purchaseToPurchaseMode = p.get("to_purchase") === "1" || p.get("to_buy") === "1";
        syncToPurchaseColumnVisibility();
        loading = true;
        lastColumnTotals = null;
        lastKpiTotals = null;
        lastColumnTotalsSource = "";
        lastKpiTotalsSource = "";
        lastFormulaKpiApproximate = false;
        lastFormulaKpiEnriching = false;
        lastToPurchaseActive = false;
        setApplyResetDisabled(true);
        renderPurchaseSummary();
        buildThead();
        renderColumnControls();
        renderTable(lastRows);
        fetch("/api/purchase?" + p.toString(), { credentials: "same-origin" })
          .then(function (r) {
            var ct = String(r.headers.get("content-type") || "").toLowerCase();
            if (ct.indexOf("application/json") < 0 && ct.indexOf("+json") < 0) {
              return r.text().then(function (body) {
                var snippet = String(body || "")
                  .replace(/<[^>]+>/g, " ")
                  .replace(/\s+/g, " ")
                  .trim()
                  .slice(0, 160);
                var hint =
                  r.status === 502 || r.status === 504
                    ? " (прокси/nginx: таймаут или Node упал — см. pm2 logs)"
                    : r.status === 401
                      ? " (сессия истекла — перелогиньтесь)"
                      : "";
                throw new Error("Ответ не JSON, HTTP " + r.status + hint + (snippet ? ": " + snippet : ""));
              });
            }
            return r.json().then(function (j) {
              if (!r.ok || !j || j.success === false) {
                throw new Error((j && j.error) || "HTTP " + r.status);
              }
              return j;
            });
          })
          .then(function (j) {
            if (mySeq !== loadSeq) return;
            total = Number(j.total || 0);
            lastRows = Array.isArray(j.data) ? j.data : [];
            lastColumnTotals = j && j.column_totals ? j.column_totals : null;
            lastKpiTotals =
              j && j.kpi_totals ? j.kpi_totals : lastColumnTotals;
            lastColumnTotalsSource = (j && j.column_totals_source) || "";
            lastKpiTotalsSource = (j && j.kpi_totals_source) || lastColumnTotalsSource;
            lastFormulaKpiApproximate = !!(j && j.formula_kpi_approximate);
            lastToPurchaseActive = !!(j && j.to_purchase_active);
            lastPurchaseCacheMeta = j && j.cache ? j.cache : null;
            loading = false;
            setApplyResetDisabled(false);
            renderPurchaseSummary();
            if (lastFormulaKpiApproximate && !lastToPurchaseActive) {
              fetchEnrichedKpiTotals(mySeq);
            }
            buildThead();
            renderTable(lastRows);
            updateTableHint();
            syncUrlFromState();
            var ds = document.getElementById("dg-pu-status");
            if (ds) {
              ds.style.display = "none";
              ds.textContent = "";
              ds.classList.remove("text-danger");
            }
            puRefreshFloatingAfterLayout();
          })
          .catch(function (e) {
            if (mySeq !== loadSeq) return;
            loading = false;
            setApplyResetDisabled(false);
            total = 0;
            lastRows = [];
            lastColumnTotals = null;
            lastKpiTotals = null;
            lastColumnTotalsSource = "";
            lastKpiTotalsSource = "";
            lastFormulaKpiApproximate = false;
            lastFormulaKpiEnriching = false;
            lastToPurchaseActive = false;
            renderPurchaseSummary();
            buildThead();
            renderTable([]);
            buildTfoot();
            updateTableHint();
            var ds = document.getElementById("dg-pu-status");
            if (ds) {
              ds.style.display = "";
              ds.textContent = "Ошибка: " + (e && e.message ? e.message : e);
              ds.classList.add("text-danger");
            }
            puRefreshFloatingAfterLayout();
          });
      }

      function resetFilters() {

      // Двусторонняя синхронизация дублирующего поля «Умный поиск» в шапке таблицы
      // (#dg-pu-table-search-mirror) с основным полем фильтра (#pu-f-search).
      // Enter — применить, Esc — очистить и применить (одиночное действие).
      (function bindHeaderSearchMirror() {
        var primary = document.getElementById("pu-f-search");
        var mirror = document.getElementById("dg-pu-table-search-mirror");
        var applyBtn = document.getElementById("purchase-apply");
        if (!primary || !mirror) return;
        var syncing = false;
        function copy(from, to) {
          if (syncing) return;
          if (to.value === from.value) return;
          syncing = true;
          to.value = from.value;
          to.dispatchEvent(new Event("input", { bubbles: true }));
          syncing = false;
        }
        primary.addEventListener("input", function () { copy(primary, mirror); });
        mirror.addEventListener("input", function () { copy(mirror, primary); });
        function apply() {
          if (applyBtn) applyBtn.click();
          else { page = 1; loadData(); }
        }
        function bindKeys(el) {
          el.addEventListener("keydown", function (e) {
            if (e.key === "Enter") { e.preventDefault(); apply(); }
            else if (e.key === "Escape") {
              if (!el.value) return;
              el.value = "";
              copy(el, el === primary ? mirror : primary);
              apply();
            }
          });
          el.addEventListener("search", function () {
            copy(el, el === primary ? mirror : primary);
            apply();
          });
        }
        bindKeys(primary);
        bindKeys(mirror);
        copy(primary, mirror);
      })();

      // Сворачивание карточки фильтров (по эталону moysklad).
      (function filtersCollapse() {
        var body = document.getElementById("dg-pu-filters-body");
        var btn = document.getElementById("dg-pu-filters-toggle");
        function apply() {
          try {
            var c = localStorage.getItem(FILTERS_KEY) === "1";
            if (c) { body.style.display = "none"; btn.textContent = "Развернуть"; }
            else { body.style.display = ""; btn.textContent = "Свернуть"; }
          } catch (e) {}
        }
        try { if (localStorage.getItem(FILTERS_KEY) === "1") body.style.display = "none"; } catch (e) {}
        apply();
        btn.addEventListener("click", function () {
          var hidden = body.style.display === "none";
          body.style.display = hidden ? "" : "none";
          btn.textContent = hidden ? "Свернуть" : "Развернуть";
          try { localStorage.setItem(FILTERS_KEY, hidden ? "0" : "1"); } catch (e) {}
          puRefreshFloatingAfterLayout();
        });
      })();

      // Шестерёнка «Поля фильтров» — по эталону moysklad.
      (function purchaseFilterFieldVisibility() {
        var FIELD_GROUPS = [
          {
            title: "Верхний ряд",
            subtitle: "Поиск, поставщик, архив, складская позиция",
            items: [
              { key: "pu_smart", title: "Умный поиск", hint: "" },
              { key: "pu_supplier", title: "Поставщик", hint: "" },
              { key: "pu_archived", title: "Архивные", hint: "Активные / Архив / Все" },
              { key: "pu_stock_position", title: "Складская позиция", hint: "Да / Нет / Все" },
              { key: "pu_limit", title: "На странице", hint: "" },
            ],
          },
          {
            title: "Перестали сотрудничать, менеджер, расхождение НС и доп. фильтр",
            subtitle: "",
            items: [
              { key: "pu_no_longer_cooperation", title: "Перестали сотрудничать", hint: "Все / Нет / Да (как в МС)" },
              { key: "pu_manager", title: "Менеджер", hint: "Свойство МС «Менеджер поддерживающий товар» (точное совпадение)" },
              { key: "pu_ms_formula_diff", title: "Расхождение НС", hint: "МС ≠ предлагаемый по формуле (целые шт.)" },
              { key: "pu_extra_filter", title: "Доп. фильтр", hint: "Один режим: остаток, комплекты, нули, кратность, упаковка" },
            ],
          },
          {
            title: "Кнопки",
            subtitle: "",
            items: [{ key: "pu_filter_actions", title: "Кнопки действий", hint: "" }],
          },
        ];
        if (window.DatagonFilterFieldsVisibility && window.DatagonFilterFieldsVisibility.init) {
          window.DatagonFilterFieldsVisibility.init({
            storageKeyPrefix: "datagon_purchase_filter_fields_v1",
            attr: "data-dg-pu-filter-field",
            fieldGroups: FIELD_GROUPS,
            togglesRootId: "dg-pu-filter-blocks-toggles",
            idPrefix: "dg-pu-ff-",
            exposeAs: "DatagonPurchaseFilterBlocks",
            onAfterApply: puRefreshFloatingAfterLayout,
          });
        }
      })();

      (function columnControls() {
        var toggle = document.getElementById("dg-pu-columns-toggle");
        var panel = document.getElementById("dg-pu-columns-panel");
        var allBtn = document.getElementById("dg-pu-columns-all");
        var noneBtn = document.getElementById("dg-pu-columns-none");
        var defBtn = document.getElementById("dg-pu-columns-default");
        var widthsToggle = document.getElementById("dg-pu-widths-toggle");
        var widthsPanel = document.getElementById("dg-pu-widths-panel");
        var panelsWrap = document.getElementById("dg-pu-toolbox-panels");
        if (!toggle || !panel) return;
        function syncWrap() {
          if (!panelsWrap) return;
          var open = panel.classList.contains("open") || (widthsPanel && widthsPanel.classList.contains("open"));
          panelsWrap.classList.toggle("d-none", !open);
        }
        toggle.addEventListener("click", function (e) {
          e.preventDefault(); e.stopPropagation();
          panel.classList.toggle("open");
          if (widthsPanel) widthsPanel.classList.remove("open");
          syncWrap();
        });
        if (widthsToggle && widthsPanel) {
          widthsToggle.addEventListener("click", function (e) {
            e.preventDefault(); e.stopPropagation();
            widthsPanel.classList.toggle("open");
            panel.classList.remove("open");
            if (widthsPanel.classList.contains("open")) renderWidthControls();
            syncWrap();
          });
        }
        function saveVisible() {
          try { localStorage.setItem(userVisibleColsKey(), JSON.stringify(Array.from(visibleCols))); } catch (e) {}
        }
        if (allBtn) allBtn.addEventListener("click", function () {
          visibleCols = new Set(PU_COLS.map(function (p) { return p[0]; }));
          saveVisible();
          renderColumnControls();
          buildThead();
          renderTable(lastRows);
          updateTableHint();
        });
        if (noneBtn) noneBtn.addEventListener("click", function () {
          visibleCols = new Set(["code", "name"]);
          saveVisible();
          renderColumnControls();
          buildThead();
          renderTable(lastRows);
          updateTableHint();
        });
        if (defBtn) defBtn.addEventListener("click", function () {
          visibleCols = new Set(DEFAULT_VISIBLE_KEYS);
          saveVisible();
          renderColumnControls();
          buildThead();
          renderTable(lastRows);
          updateTableHint();
        });
        document.addEventListener("click", function (e) {
          if (e.target.closest("#dg-pu-columns-panel")) return;
          if (e.target.closest("#dg-pu-columns-toggle")) return;
          if (e.target.closest("#dg-pu-widths-panel")) return;
          if (e.target.closest("#dg-pu-widths-toggle")) return;
          panel.classList.remove("open");
          if (widthsPanel) widthsPanel.classList.remove("open");
          syncWrap();
        });
        var widthsDefault = document.getElementById("dg-pu-widths-default");
        if (widthsDefault) widthsDefault.addEventListener("click", function () {
          columnWidths = {};
          try { localStorage.removeItem(userColWidthKey()); } catch (e) {}
          buildThead();
          renderTable(lastRows);
          renderWidthControls();
        });
      })();

      function renderWidthControls() {
        var list = document.getElementById("dg-pu-widths-list");
        if (!list) return;
        list.innerHTML = "";
        getPuColsList().forEach(function (pair) {
          var key = pair[0];
          var label = pair[1];
          var minW = getColMin(key);
          var current = Number(columnWidths[key] || 0);
          if (!Number.isFinite(current) || current <= 0) current = minW;
          var wrap = document.createElement("label");
          var span = document.createElement("span");
          span.textContent = label;
          span.style.flex = "1 1 auto";
          span.style.overflow = "hidden";
          span.style.textOverflow = "ellipsis";
          span.style.whiteSpace = "nowrap";
          var input = document.createElement("input");
          input.type = "number";
          input.className = "form-control form-control-sm";
          input.min = "50";
          input.max = "700";
          input.step = "10";
          input.value = String(current);
          input.setAttribute("data-col-key", key);
          input.addEventListener("change", function () {
            var k = this.getAttribute("data-col-key");
            var n = parseInt(this.value, 10);
            if (!Number.isFinite(n)) { this.value = String(columnWidths[k] || getColMin(k)); return; }
            n = Math.max(50, Math.min(700, n));
            applyColumnWidth(k, n);
            try { localStorage.setItem(userColWidthKey(), JSON.stringify(columnWidths || {})); } catch (e) {}
            this.value = String(n);
          });
          wrap.appendChild(span);
          wrap.appendChild(input);
          list.appendChild(wrap);
        });
      }

      // Сворачивание карточки таблицы (только card-body).
      (function tableCardCollapse() {
        var btn = document.getElementById("dg-pu-table-toggle");
        var body = document.getElementById("dg-pu-table-body");
        if (!btn || !body) return;
        var STORAGE_KEY = "dg.purchase.table-card.collapsed.v1";
        function apply() {
          var c = false;
          try { c = localStorage.getItem(STORAGE_KEY) === "1"; } catch (e) {}
          if (c) { body.style.display = "none"; btn.textContent = "Развернуть"; }
          else { body.style.display = ""; btn.textContent = "Свернуть"; }
        }
        apply();
        btn.addEventListener("click", function () {
          var hidden = body.style.display === "none";
          body.style.display = hidden ? "" : "none";
          btn.textContent = hidden ? "Свернуть" : "Развернуть";
          try { localStorage.setItem(STORAGE_KEY, hidden ? "0" : "1"); } catch (e) {}
          puRefreshFloatingAfterLayout();
        });
      })();

      /** Ширины/видимость завязаны на localStorage currentUser; он выставляется после /api/auth/me (datagon-vanilla.js). */
      function loadPurchaseColumnPreferences() {
        try {
          columnWidths = JSON.parse(localStorage.getItem(userColWidthKey()) || "{}") || {};
        } catch (e) { columnWidths = {}; }
        try {
          var allowed = new Set(PU_COLS.map(function (p) { return p[0]; }));
          var rawVisible = JSON.parse(localStorage.getItem(userVisibleColsKey()) || "[]");
          if (Array.isArray(rawVisible) && rawVisible.length) {
            visibleCols = new Set(rawVisible.filter(function (k) { return allowed.has(k); }));
          }
          if (!visibleCols.has("code")) visibleCols.add("code");
          if (visibleCols.size && !visibleCols.has("name")) visibleCols.add("name");
          if (!visibleCols.size) visibleCols = new Set(DEFAULT_VISIBLE_KEYS);
          ["to_purchase_qty", "purchase_sum"].forEach(function (k) {
            if (allowed.has(k)) visibleCols.add(k);
          });
        } catch (e) {}
      }

      function redrawPurchaseTableAfterPrefs() {
        renderColumnControls();
        buildThead();
        renderTable(lastRows);
        updateTableHint();
        var wp = document.getElementById("dg-pu-widths-panel");
        if (wp && wp.classList.contains("open")) renderWidthControls();
        puRefreshFloatingAfterLayout();
      }

      loadPurchaseColumnPreferences();

      window.addEventListener("datagon-profile-loaded", function () {
        loadPurchaseColumnPreferences();
        redrawPurchaseTableAfterPrefs();
      });

      bindPurchaseCellTooltips();
      loadPurchaseManagers().then(function () {
        parseUrlToForm();
        rebuildPurchaseManagerSelect(document.getElementById("pu-f-manager").value);
        renderColumnControls();
        updatePuStickyTopVar();
        buildThead();
        loadData();
      });
      window.addEventListener("pageshow", function (e) {
        if (!e || !e.persisted) return;
        loading = false;
        loadPurchaseManagers().then(function () {
          parseUrlToForm();
          rebuildPurchaseManagerSelect(document.getElementById("pu-f-manager").value);
          page = 1;
          loadData();
        });
      });
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          updatePuStickyTopVar();
          puRefreshFloatingAfterLayout();
        });
      }
      window.addEventListener("load", function () {
        updatePuStickyTopVar();
        puRefreshFloatingAfterLayout();
      });
    })();
  </script>
