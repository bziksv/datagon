  <script>
    (function () {
      // Один источник истины для колонок: видимость, ширины, шапка и тело берут отсюда.
      // [key, label, opts?]
      //   opts.editable → редактируемое override-поле (POST /api/purchase/override)
      //   opts.future   → зарезервированная пустая колонка (сейчас не используется)
      //   opts.puSub    → подпись под числом в шапке (продажи / дни отсутствия)
      //   opts.center   → центрирование текста
      var PU_COLS = [
        ["code", "Код"],
        ["article", "Артикул", { center: true }],
        ["name", "Наименование"],
        ["supplier_label", "Поставщик"],
        ["buy_price", "Закупочная цена", { center: true }],
        ["min_stock", "Неснижаемый остаток", { center: true }],
        ["formula_proposed_min_stock", "Предлагаемый нес.ост.", { center: true }],
        ["automation_price", "Автоматизация цены", { center: true }],
        ["min_stock_dg", "Нес.остаток Датагон", { center: true, editable: true }],
        ["multiplicity", "Кратность товара", { center: true, editable: true }],
        ["pack_qty", "Кол-во в упаковке", { center: true }],
        ["stock", "Остаток", { center: true }],
        ["in_transit", "Ожидание", { center: true }],
        ["d_15a", "15", { center: true, puSub: "прод., шт" }],
        ["d_15b", "15", { center: true, puSub: "дн. нет" }],
        ["d_30a", "30", { center: true, puSub: "прод., шт" }],
        ["d_30b", "30", { center: true, puSub: "дн. нет" }],
        ["d_60a", "60", { center: true, puSub: "прод., шт" }],
        ["d_60b", "60", { center: true, puSub: "дн. нет" }],
        ["d_90a", "90", { center: true, puSub: "прод., шт" }],
        ["d_90b", "90", { center: true, puSub: "дн. нет" }],
        ["d_180a", "180", { center: true, puSub: "прод., шт" }],
        ["d_180b", "180", { center: true, puSub: "дн. нет" }],
        ["d_365a", "365", { center: true, puSub: "прод., шт" }],
        ["d_365b", "365", { center: true, puSub: "дн. нет" }],
      ];

      var COL_OPTS = {};
      PU_COLS.forEach(function (p) { COL_OPTS[p[0]] = p[2] || {}; });

      var SORTABLE = new Set([
        "code", "article", "name", "supplier", "buy_price",
        "min_stock", "formula_proposed_min_stock", "automation_price",
        "min_stock_dg", "multiplicity",
        "stock", "is_archived", "in_transit",
        "d_15a", "d_15b", "d_30a", "d_30b",
        "d_60a", "d_60b", "d_90a", "d_90b", "d_180a", "d_180b", "d_365a", "d_365b",
      ]);

      // По смыслу сортировки — поставщик в БД лежит как `supplier`/`supplier2`,
      // карточка в UI собирается отдельно, поэтому маппим к ключу `supplier`.
      var SORT_KEY_REMAP = { supplier_label: "supplier" };

      // Минимальные ширины = дефолт «📏 Ширины» для новых пользователей / сброса localStorage.
      var COL_MIN = {
        code: 60,
        article: 80,
        name: 260,
        supplier_label: 110,
        buy_price: 100,
        min_stock: 70,
        formula_proposed_min_stock: 70,
        automation_price: 70,
        min_stock_dg: 70,
        multiplicity: 70,
        pack_qty: 70,
        stock: 80,
        in_transit: 60,
        d_15a: 60,
        d_15b: 60,
        d_30a: 60,
        d_30b: 60,
        d_60a: 60,
        d_60b: 60,
        d_90a: 60,
        d_90b: 60,
        d_180a: 60,
        d_180b: 60,
        d_365a: 60,
        d_365b: 60,
      };
      function getColMin(key) {
        if (COL_MIN[key] != null) return COL_MIN[key];
        return COL_OPTS[key] && COL_OPTS[key].future ? 60 : 90;
      }

      var FLOATING_HEADER_OFFSET_PX = 2;
      var FLOATING_HEADER_START_EPS_PX = 3;
      var puFloatingHeaderRaf = 0;
      var puFloatingLastScrollTs = 0;

      function updatePuStickyTopVar() {
        var app = document.querySelector(".app-container");
        var header = document.querySelector(".app-header");
        var fixed = Boolean(app && app.classList && app.classList.contains("fixed-header"));
        var top = 0;
        if (fixed && header && header.getBoundingClientRect) {
          var rect = header.getBoundingClientRect();
          top = rect && rect.height ? rect.height : 60;
        }
        document.documentElement.style.setProperty("--dg-table-sticky-top", top + "px");
      }

      function getPuStickyTopPx() {
        var app = document.querySelector(".app-container");
        var hdr = document.querySelector(".app-header");
        var fixed = Boolean(app && app.classList && app.classList.contains("fixed-header"));
        if (!fixed) return 0;
        if (!hdr || !hdr.getBoundingClientRect) return 60;
        var r = hdr.getBoundingClientRect();
        var h = r && r.height ? r.height : 60;
        return h > 0 ? h : 60;
      }

      function capturePuTheadBaseTop() {
        var thead = document.getElementById("dg-pu-thead");
        if (!thead) return;
        thead.style.transform = "";
        thead.style.position = "";
        thead.style.zIndex = "";
        thead.style.willChange = "";
        thead.removeAttribute("data-dg-floating");
        var rect = thead.getBoundingClientRect();
        var absTop = (window.scrollY || window.pageYOffset || 0) + (rect && rect.top ? rect.top : 0);
        thead.setAttribute("data-dg-base-top", String(absTop));
      }

      function updatePuFloatingHeaderFallback() {
        var thead = document.getElementById("dg-pu-thead");
        if (!thead) return;
        var table = thead.closest("table");
        if (!table || !table.getBoundingClientRect) return;
        var row = thead.querySelector("tr");
        if (!row) return;

        var y = window.scrollY || window.pageYOffset || 0;
        var headerTop = getPuStickyTopPx();

        var baseTopAbs = Number(thead.getAttribute("data-dg-base-top") || 0);
        if (!Number.isFinite(baseTopAbs) || baseTopAbs <= 0) return;
        var tableRect = table.getBoundingClientRect();
        var tableBottom = tableRect.bottom + y;
        var rowRect = row.getBoundingClientRect();
        var rowHeight = rowRect && rowRect.height ? rowRect.height : 0;

        var headerLine = y + headerTop;
        var start = baseTopAbs + FLOATING_HEADER_START_EPS_PX;
        var end = tableBottom - rowHeight;
        if (headerLine <= start || headerLine >= end) {
          if (thead.style.transform) {
            thead.style.transform = "";
            thead.style.position = "";
            thead.style.zIndex = "";
            thead.style.willChange = "";
            thead.removeAttribute("data-dg-floating");
          }
          return;
        }

        var zoomAwareOffset = FLOATING_HEADER_OFFSET_PX;
        var dpr = window.devicePixelRatio || 1;
        if (Math.abs(dpr - 1) < 0.03) zoomAwareOffset = FLOATING_HEADER_OFFSET_PX - 3;
        var shift = Math.max(0, headerLine - start - zoomAwareOffset);
        var shiftPx = Number(shift.toFixed(3));
        var nextTransform = "translate3d(0," + shiftPx + "px,0)";
        if (thead.style.transform !== nextTransform) {
          thead.style.transform = nextTransform;
          thead.style.position = "relative";
          thead.style.zIndex = "25";
          thead.style.willChange = "transform";
          thead.setAttribute("data-dg-floating", "1");
        }
      }

      function puFloatingHeaderTick(ts) {
        puFloatingHeaderRaf = 0;
        updatePuFloatingHeaderFallback();
        if (ts - puFloatingLastScrollTs < 140) {
          puFloatingHeaderRaf = requestAnimationFrame(puFloatingHeaderTick);
        }
      }

      function schedulePuFloatingHeaderUpdate() {
        puFloatingLastScrollTs = performance.now();
        if (puFloatingHeaderRaf) return;
        puFloatingHeaderRaf = requestAnimationFrame(puFloatingHeaderTick);
      }

      function onScrollPuFloatingHeader() {
        schedulePuFloatingHeaderUpdate();
      }

      function puRefreshFloatingAfterLayout() {
        requestAnimationFrame(function () {
          capturePuTheadBaseTop();
          schedulePuFloatingHeaderUpdate();
        });
      }

      var HEADER_FONT = {
        verticalAlign: "middle", fontSize: "12px", textAlign: "center",
        paddingTop: "8px", paddingBottom: "8px",
      };

      var initialFilters = {
        limit: 100,
        archived: "active",
        stock_position: "yes",
        no_longer_cooperation: "not_stopped",
        search: "",
        supplier: "",
        only_stock: "0",
        include_bundles: "0",
        zero_stock: "0",
        zero_stock_no_transit: "0",
        no_multiplicity: "0",
        incomplete_pack: "0",
      };

      var FILTERS_KEY = "datagon_purchase_filters_collapsed_v1";

      function userColWidthKey() {
        try {
          var u = String(localStorage.getItem("currentUser") || "guest").trim() || "guest";
          return "datagon_purchase_col_widths_v1:" + u;
        } catch (e) { return "datagon_purchase_col_widths_v1:guest"; }
      }
      function userVisibleColsKey() {
        try {
          var u = String(localStorage.getItem("currentUser") || "guest").trim() || "guest";
          return "datagon_purchase_visible_cols_v2:" + u;
        } catch (e) { return "datagon_purchase_visible_cols_v2:guest"; }
      }

      var page = 1;
      var sortBy = "code";
      var sortDir = "asc";
      var total = 0;
      var limit = 100;
      var lastRows = [];
      var puLogModal = { code: "", name: "", offset: 0, limit: 100, total: 0, filterField: "" };
      var PURCHASE_LOG_SOURCE_LABELS = { override: "Ячейка", import: "Импорт CSV" };
      var loading = false;
      var lastWarmupProgress = null;
      var puWarmupTimer = 0;
      var puWarmupDismissUntilDone = false;
      var columnWidths = {};
      var DEFAULT_VISIBLE_KEYS = PU_COLS.map(function (p) { return p[0]; });
      var visibleCols = new Set(DEFAULT_VISIBLE_KEYS);
      var resizeState = null;
      var urlSyncTimer = null;

      function fmtNum(n) {
        var x = Number(n || 0);
        return Number.isFinite(x) ? x.toLocaleString("ru-RU") : "0";
      }
      function fmtPuSnapQty(v) {
        if (v == null || v === "") return "—";
        var x = Number(v);
        if (!Number.isFinite(x)) return "—";
        return x.toLocaleString("ru-RU", { maximumFractionDigits: 3, minimumFractionDigits: 0 });
      }
      function fmtNumEditable(n) {
        if (n == null) return "";
        var x = Number(n);
        if (!Number.isFinite(x)) return "";
        return Number.isInteger(x) ? String(x) : String(x);
      }

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatDateTimeMsk(value) {
        if (!value) return "";
        var d;
        try {
          d = new Date(value);
        } catch (e) {
          return String(value);
        }
        if (!d || isNaN(d.getTime())) return String(value);
        try {
          return d.toLocaleString("ru-RU", { timeZone: "Europe/Moscow" });
        } catch (e) {
          return d.toISOString();
        }
      }

      function purchaseLogSourceLabel(src) {
        var k = String(src || "override");
        return PURCHASE_LOG_SOURCE_LABELS[k] || k;
      }

      /* ----- Hover-журнал по полю override (как .dg-dim-cell-tip на exports-dimensions) ----- */
      var puTipCache = {};
      var PU_TIP_CACHE_TTL_MS = 60000;
      var puTipEl = null;
      var puTipShowTimer = null;
      var puTipHideTimer = null;
      var puTipCurrentTarget = null;
      var puTipListenersBound = false;

      function ensurePuTipEl() {
        if (puTipEl) return puTipEl;
        puTipEl = document.createElement("div");
        puTipEl.className = "dg-pu-cell-tip";
        puTipEl.setAttribute("role", "tooltip");
        puTipEl.style.display = "none";
        document.body.appendChild(puTipEl);
        puTipEl.addEventListener("mouseenter", cancelPuHideTip);
        puTipEl.addEventListener("mouseleave", schedulePuHideTip);
        return puTipEl;
      }

      function positionPuTip(target) {
        if (!puTipEl || !target) return;
        var r = target.getBoundingClientRect();
        puTipEl.style.maxWidth = "360px";
        puTipEl.style.left = "-9999px";
        puTipEl.style.top = "-9999px";
        puTipEl.style.display = "";
        var tipRect = puTipEl.getBoundingClientRect();
        var top = r.bottom + 6 + window.scrollY;
        var left = r.left + window.scrollX;
        var maxLeft = window.scrollX + document.documentElement.clientWidth - tipRect.width - 8;
        if (left > maxLeft) left = Math.max(window.scrollX + 8, maxLeft);
        puTipEl.style.left = left + "px";
        puTipEl.style.top = top + "px";
      }

      function renderPuTipContent(rows, fieldKey) {
        if (!rows || rows.length === 0) {
          return (
            '<div class="dg-pu-cell-tip-empty">Это поле ещё не правили.</div>'
          );
        }
        var title =
          "Последние правки поля «" +
          escapeHtml(rows[0].field_label || purchaseColLabel(fieldKey) || fieldKey) +
          "»";
        var out = '<div class="dg-pu-cell-tip-title">' + title + '</div><ul class="dg-pu-cell-tip-list">';
        for (var i = 0; i < rows.length; i++) {
          var row = rows[i] || {};
          var oldV = row.old_value == null ? "∅" : escapeHtml(row.old_value);
          var newV = row.new_value == null ? "∅" : escapeHtml(row.new_value);
          var who = row.changed_by_name || ("user#" + (row.changed_by_user_id || "—"));
          var srcRaw = String(row.source || "override");
          var srcCls = "dg-pu-log-action " + purchaseLogSourceClass(srcRaw);
          out +=
            "<li>" +
            '<div class="dg-pu-cell-tip-row1"><span>' +
            escapeHtml(formatDateTimeMsk(row.changed_at)) +
            "</span> · <span>" +
            escapeHtml(who) +
            '</span> · <span class="' +
            srcCls +
            '" title="' +
            escapeHtml(srcRaw) +
            '">' +
            escapeHtml(purchaseLogSourceLabel(srcRaw)) +
            "</span></div>" +
            '<div class="dg-pu-cell-tip-row2"><span class="dg-pu-cell-tip-old">' +
            oldV +
            '</span> → <span class="dg-pu-cell-tip-new">' +
            newV +
            "</span></div>" +
            "</li>";
        }
        out += "</ul>";
        return out;
      }

      function showPuTipFor(target) {
        if (!target) return;
        var code = target.getAttribute("data-dg-code") || "";
        var field = target.getAttribute("data-dg-field") || "";
        if (!code || !field) return;
        ensurePuTipEl();
        var cacheKey = code + "/" + field;
        var now = Date.now();
        var cached = puTipCache[cacheKey];
        if (cached && now - cached.ts < PU_TIP_CACHE_TTL_MS) {
          puTipEl.innerHTML = renderPuTipContent(cached.rows, field);
          positionPuTip(target);
          return;
        }
        puTipEl.innerHTML = '<div class="dg-pu-cell-tip-loading">Загрузка журнала…</div>';
        positionPuTip(target);
        var qs = new URLSearchParams({ code: String(code), limit: "3", field: String(field) });
        fetch("/api/purchase/log?" + qs.toString(), { credentials: "same-origin" })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            if (!x.ok || !x.j || x.j.success === false) {
              if (puTipCurrentTarget === target) {
                puTipEl.innerHTML =
                  '<div class="dg-pu-cell-tip-err">' +
                  escapeHtml((x.j && x.j.error) || "Не удалось загрузить") +
                  "</div>";
              }
              return;
            }
            var rows = (x.j.rows || []).slice(0, 3);
            puTipCache[cacheKey] = { ts: Date.now(), rows: rows };
            if (puTipCurrentTarget === target) {
              puTipEl.innerHTML = renderPuTipContent(rows, field);
              positionPuTip(target);
            }
          })
          .catch(function () {
            if (puTipCurrentTarget === target) {
              puTipEl.innerHTML = '<div class="dg-pu-cell-tip-err">Сетевая ошибка</div>';
            }
          });
      }

      function schedulePuShowTip(target) {
        cancelPuShowTip();
        puTipCurrentTarget = target;
        puTipShowTimer = setTimeout(function () { showPuTipFor(target); }, 350);
      }

      function schedulePuHideTip() {
        cancelPuHideTip();
        puTipHideTimer = setTimeout(function () {
          if (puTipEl) puTipEl.style.display = "none";
          puTipCurrentTarget = null;
        }, 150);
      }

      function cancelPuShowTip() {
        if (puTipShowTimer) { clearTimeout(puTipShowTimer); puTipShowTimer = null; }
      }
      function cancelPuHideTip() {
        if (puTipHideTimer) { clearTimeout(puTipHideTimer); puTipHideTimer = null; }
      }

      function puTipTargetFromEvent(el) {
        if (!el || !el.closest) return null;
        return el.closest(".dg-pu-edit-tip-wrap[data-dg-code][data-dg-field]");
      }

      function invalidatePuTipCache(code, field) {
        if (!code) return;
        try {
          if (field) {
            delete puTipCache[code + "/" + field];
          } else {
            for (var k in puTipCache) {
              if (Object.prototype.hasOwnProperty.call(puTipCache, k) && k.indexOf(code + "/") === 0) {
                delete puTipCache[k];
              }
            }
          }
        } catch (e) {}
      }

      function bindPurchaseCellTooltips() {
        if (puTipListenersBound) return;
        var tbody = document.getElementById("dg-pu-tbody");
        if (!tbody) return;
        puTipListenersBound = true;
        tbody.addEventListener("mouseover", function (ev) {
          var t = puTipTargetFromEvent(ev.target);
          if (!t) return;
          cancelPuHideTip();
          if (puTipCurrentTarget === t) return;
          schedulePuShowTip(t);
        });
        tbody.addEventListener("mouseout", function (ev) {
          var t = puTipTargetFromEvent(ev.target);
          if (!t) return;
          var related = ev.relatedTarget;
          if (related && puTipEl && puTipEl.contains(related)) return;
          if (related && puTipTargetFromEvent(related) === t) return;
          cancelPuShowTip();
          schedulePuHideTip();
        });
        function dismissOnScroll() {
          cancelPuShowTip();
          if (puTipEl && puTipEl.style.display !== "none") {
            puTipEl.style.display = "none";
            puTipCurrentTarget = null;
          }
        }
        window.addEventListener("scroll", dismissOnScroll, { passive: true, capture: true });
        var appOuter = document.querySelector(".app-main__outer");
        if (appOuter) appOuter.addEventListener("scroll", dismissOnScroll, { passive: true });
        var outer = document.getElementById("dg-pu-table-scroll-outer");
        if (outer) outer.addEventListener("scroll", dismissOnScroll, { passive: true });
      }
      function formatMoneyText(value) {
        var raw = String(value == null ? "" : value).trim();
        if (!raw) return "";
        var parsed = Number(raw.replace(/[^\d.,-]/g, "").replace(",", "."));
        if (!Number.isFinite(parsed)) return raw;
        return parsed.toLocaleString("ru-RU") + " ₽";
      }

      /** Один режим «Доп. фильтр» → те же query-параметры, что раньше у чекбоксов (взаимоисключающе). */
      function readPuExtraFilterSelect() {
        var sel = document.getElementById("pu-f-extra-filter");
        return sel ? String(sel.value || "").trim() : "";
      }

      function extraFilterModeToFlags(mode) {
        var o = {
          only_stock: "0",
          include_bundles: "0",
          zero_stock: "0",
          zero_stock_no_transit: "0",
          no_multiplicity: "0",
          incomplete_pack: "0",
        };
        switch (String(mode || "")) {
          case "only_stock":
            o.only_stock = "1";
            break;
          case "include_bundles":
            o.include_bundles = "1";
            break;
          case "zero_stock":
            o.zero_stock = "1";
            break;
          case "zero_stock_no_transit":
            o.zero_stock_no_transit = "1";
            break;
          case "no_multiplicity":
            o.no_multiplicity = "1";
            break;
          case "incomplete_pack":
            o.incomplete_pack = "1";
            break;
          default:
            break;
        }
        return o;
      }

      /**
       * Восстановление селекта из URL: при нескольких флагах=1 (старые закладки) — приоритет «узкого» фильтра.
       */
      function syncPuExtraFilterFromUrlParams(params) {
        var sel = document.getElementById("pu-f-extra-filter");
        if (!sel) return;
        function is1(k) {
          return params.get(k) === "1";
        }
        var next = "";
        if (is1("zero_stock_no_transit")) next = "zero_stock_no_transit";
        else if (is1("zero_stock")) next = "zero_stock";
        else if (is1("incomplete_pack")) next = "incomplete_pack";
        else if (is1("no_multiplicity")) next = "no_multiplicity";
        else if (is1("only_stock")) next = "only_stock";
        else if (is1("include_bundles")) next = "include_bundles";
        sel.value = next;
      }

      function readFilters() {
        var xf = extraFilterModeToFlags(readPuExtraFilterSelect());
        return {
          search: document.getElementById("pu-f-search").value.trim(),
          supplier: document.getElementById("pu-f-supplier").value.trim(),
          archived: document.getElementById("pu-f-archived").value,
          stock_position: document.getElementById("pu-f-stock_position").value,
          no_longer_cooperation: document.getElementById("pu-f-no_longer_cooperation").value,
          limit: Number(document.getElementById("pu-f-limit").value) || 100,
          only_stock: xf.only_stock,
          include_bundles: xf.include_bundles,
          zero_stock: xf.zero_stock,
          zero_stock_no_transit: xf.zero_stock_no_transit,
          no_multiplicity: xf.no_multiplicity,
          incomplete_pack: xf.incomplete_pack,
        };
      }

      function appendFilterParams(p, f) {
        if (f.search) p.set("search", f.search);
        if (f.supplier) p.set("supplier", f.supplier);
        if (f.archived && f.archived !== initialFilters.archived) p.set("archived", f.archived);
        if (f.stock_position && f.stock_position !== initialFilters.stock_position) p.set("stock_position", f.stock_position);
        if (f.no_longer_cooperation && f.no_longer_cooperation !== initialFilters.no_longer_cooperation) {
          p.set("no_longer_cooperation", f.no_longer_cooperation);
        }
        if (f.only_stock === "1") p.set("only_stock", "1");
        if (f.include_bundles === "1") p.set("include_bundles", "1");
        if (f.zero_stock === "1") p.set("zero_stock", "1");
        if (f.zero_stock_no_transit === "1") p.set("zero_stock_no_transit", "1");
        if (f.no_multiplicity === "1") p.set("no_multiplicity", "1");
        if (f.incomplete_pack === "1") p.set("incomplete_pack", "1");
      }

      function buildListParams() {
        var f = readFilters();
        limit = f.limit;
        var offset = (page - 1) * limit;
        var p = new URLSearchParams();
        appendFilterParams(p, f);
        p.set("limit", String(limit));
        p.set("offset", String(offset));
        var apiSort = SORT_KEY_REMAP[sortBy] || sortBy;
        p.set("sort_by", apiSort);
        p.set("sort_dir", sortDir);
        // archived нам нужно всегда отправлять явно: бэк трактует "active" как дефолт
        if (!p.has("archived")) p.set("archived", f.archived);
        if (!p.has("stock_position")) p.set("stock_position", f.stock_position);
        if (!p.has("no_longer_cooperation")) p.set("no_longer_cooperation", f.no_longer_cooperation);
        return p;
      }

      function syncUrlFromState() {
        var f = readFilters();
        var params = new URLSearchParams();
        Object.keys(f).forEach(function (k) {
          var v = f[k];
          if (v === undefined || v === null || v === "") return;
          if (k === "limit" && Number(v) === Number(initialFilters.limit)) return;
          if (String(v) === String(initialFilters[k])) return;
          params.set(k, String(v));
        });
        if (Number(page) > 1) params.set("page", String(page));
        if (sortBy !== "code") {
          var urlSortKey = sortBy;
          try {
            for (var colK in SORT_KEY_REMAP) {
              if (Object.prototype.hasOwnProperty.call(SORT_KEY_REMAP, colK) && SORT_KEY_REMAP[colK] === sortBy) {
                urlSortKey = colK;
                break;
              }
            }
          } catch (eSk) {}
          params.set("sort_by", urlSortKey);
        }
        if (sortDir !== "asc") params.set("sort_dir", sortDir);
        var next = params.toString()
          ? window.location.pathname + "?" + params.toString()
          : window.location.pathname;
        try { window.history.replaceState(null, "", next); } catch (e) {}
      }

      function scheduleUrlSync() {
        if (urlSyncTimer) clearTimeout(urlSyncTimer);
        urlSyncTimer = setTimeout(function () {
          urlSyncTimer = null;
          syncUrlFromState();
        }, 200);
      }

      function parseUrlToForm() {
        var params = new URLSearchParams(window.location.search);
        var keys = ["limit", "archived", "stock_position", "no_longer_cooperation", "search", "supplier"];
        keys.forEach(function (k) {
          var v = params.get(k);
          if (v === null) return;
          if (k === "limit") document.getElementById("pu-f-limit").value = String(Number(v) || 100);
          else if (k === "search") document.getElementById("pu-f-search").value = v;
          else if (k === "supplier") document.getElementById("pu-f-supplier").value = v;
          else if (k === "archived") document.getElementById("pu-f-archived").value = v;
          else if (k === "stock_position") document.getElementById("pu-f-stock_position").value = v;
          else if (k === "no_longer_cooperation") {
            if (v === "all" || v === "not_stopped" || v === "stopped") {
              document.getElementById("pu-f-no_longer_cooperation").value = v;
            }
          }
        });
        syncPuExtraFilterFromUrlParams(params);
        var pg = Number(params.get("page") || 1);
        if (Number.isFinite(pg) && pg > 0) page = pg;
        var sb = params.get("sort_by");
        if (sb === "supplier_label") sb = "supplier";
        if (sb && SORTABLE.has(sb)) sortBy = sb;
        var sd = params.get("sort_dir");
        if (sd === "asc" || sd === "desc") sortDir = sd;
      }

      /** Паритет с lib/datagonSalesFormula.js applyMinStockDgFloor — обновление «Предлагаемый» после смены min_stock_dg без полного reload. */
      function applyMinStockDgFloorPu(proposed, minDgRaw) {
        var p = Number(proposed);
        var base = Number.isFinite(p) ? Math.trunc(p) : 0;
        if (minDgRaw == null || minDgRaw === "") return Math.max(0, base);
        var s = String(minDgRaw).replace(/\u00a0/g, " ").trim().replace(/\s+/g, "").replace(",", ".");
        if (!s) return Math.max(0, base);
        var dg = Number(s);
        if (!Number.isFinite(dg) || dg <= 0) return Math.max(0, base);
        var floorInt = Math.ceil(dg - 1e-9);
        return Math.max(base, floorInt);
      }

      function saveOverride(input) {
        var code = input.dataset.code || "";
        var field = input.dataset.field || "";
        var value = String(input.value || "").trim();
        if (!code || !field) return;
        if (value === input.dataset.original) return;
        input.classList.remove("is-saved", "is-error");
        input.classList.add("is-saving");
        fetch("/api/purchase/override", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code, field: field, value: value })
        })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            input.classList.remove("is-saving");
            if (!x.ok || !x.j || x.j.success === false) {
              input.classList.add("is-error");
              input.title = (x.j && x.j.error) ? String(x.j.error) : "Ошибка сохранения";
              return;
            }
            var stored = x.j.stored || {};
            var v = stored[field];
            input.value = fmtNumEditable(v);
            input.dataset.original = input.value;
            input.classList.add("is-saved");
            input.title = "Сохранено: " + new Date().toLocaleTimeString("ru-RU");
            invalidatePuTipCache(code, field);
            // Обновим локальный кэш строки, чтобы перерисовка не сбрасывала значение
            var rowIdx = lastRows.findIndex(function (rr) { return String(rr.code) === String(code); });
            if (rowIdx >= 0) {
              lastRows[rowIdx][field] = v;
              if (field === "min_stock_dg") {
                lastRows[rowIdx].formula_proposed_min_stock = applyMinStockDgFloorPu(
                  lastRows[rowIdx].formula_proposed_min_stock,
                  v
                );
                renderTable(lastRows);
              }
            }
          })
          .catch(function (e) {
            input.classList.remove("is-saving");
            input.classList.add("is-error");
            input.title = "Сеть недоступна: " + (e && e.message ? e.message : e);
          });
      }

        var overlay = document.getElementById("dg-pu-log-overlay");

      function loadPuLogFor(code, opts) {
        var body = document.getElementById("dg-pu-log-body");
        if (!body || !code) return;
        var o = opts && typeof opts === "object" ? opts : {};
        var offset = Math.max(0, Number.isFinite(Number(o.offset)) ? Number(o.offset) : 0);
        var limit = Math.max(1, Number.isFinite(Number(o.limit)) ? Number(o.limit) : 100);
        var qs = new URLSearchParams({ code: String(code), limit: String(limit), offset: String(offset) });
        if (puLogModal.filterField) qs.set("field", puLogModal.filterField);
        body.innerHTML = '<div class="text-muted small text-center py-4">Загрузка журнала…</div>';
        fetch("/api/purchase/log?" + qs.toString(), { credentials: "same-origin" })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            if (!x.ok || !x.j || x.j.success === false) {
              body.innerHTML = '<div class="text-danger small text-center py-4">' +
                escapeHtml((x.j && x.j.error) || "Ошибка загрузки журнала") + "</div>";
              return;
            }
            puLogModal.code = String(code);
            puLogModal.offset = Number(x.j.offset || 0);
            puLogModal.limit = Number(x.j.limit || limit);
            puLogModal.total = Number(x.j.total || 0);
            renderPuLogRows(body, x.j.rows || [], {
              total: puLogModal.total,
              limit: puLogModal.limit,
              offset: puLogModal.offset,
            });
          })
          .catch(function (e) {
            body.innerHTML = '<div class="text-danger small text-center py-4">Сетевая ошибка: ' +
              escapeHtml((e && e.message) || String(e)) + "</div>";
          });
      }

      function purchaseLogSourceClass(src) {

        return s === "import" ? "src-import" : "src-override";
      }

      function renderPuLogPager(total, limit, offset) {
        var pages = total > 0 ? Math.max(1, Math.ceil(total / limit)) : 1;
        var current = Math.floor(offset / limit) + 1;
        var prevDisabled = offset <= 0 ? " disabled" : "";
        var nextDisabled = (offset + limit) >= total ? " disabled" : "";
        var shown = Math.min(limit, Math.max(0, total - offset));
        return (
          '<div class="dg-pu-log-pager d-flex align-items-center justify-content-between gap-2 px-3 py-2 border-top">' +
          '<div class="text-muted small">Найдено: ' + total + "; страница " + current + "/" + pages + "; показано: " + shown + "</div>" +
          '<div class="d-flex align-items-center gap-2">' +
          '<button type="button" class="btn btn-sm btn-outline-secondary dg-pu-log-prev"' + prevDisabled + ">Назад</button>" +
          '<button type="button" class="btn btn-sm btn-outline-secondary dg-pu-log-next"' + nextDisabled + ">Вперёд</button>" +
          "</div></div>"
        );
      }

      function renderPuLogRows(container, rows, meta) {
        var total = meta && Number(meta.total) > 0 ? Number(meta.total) : 0;
        var limit = meta && Number(meta.limit) > 0 ? Number(meta.limit) : 100;
        var offset = meta && Number(meta.offset) >= 0 ? Number(meta.offset) : 0;
        if (!Array.isArray(rows) || rows.length === 0) {
          var emptyHtml = '<div class="text-muted small text-center py-4">';
          if (total === 0) {
            emptyHtml += "Журнал пуст: по этой позиции ещё не было изменений полей закупок.";
          } else {
            emptyHtml += "Пустая страница (offset=" + offset + ").";
          }
          emptyHtml += "</div>";
          if (total > 0) emptyHtml += renderPuLogPager(total, limit, offset);
          container.innerHTML = emptyHtml;
          return;
        }
        var html = "<table><thead><tr>" +
          '<th style="width:16%">Когда (МСК)</th>' +
          '<th style="width:20%">Кто</th>' +
          '<th style="width:11%">Источник</th>' +
          '<th style="width:18%">Поле</th>' +
          "<th>Было → стало</th>" +
          "</tr></thead><tbody>";
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i] || {};
          var who = r.changed_by_name || ("user#" + (r.changed_by_user_id != null ? r.changed_by_user_id : "—"));
          var oldVal = r.old_value == null ? '<span class="text-muted">∅</span>' : '<span class="dg-pu-log-old">' + escapeHtml(r.old_value) + "</span>";
          var newVal = r.new_value == null ? '<span class="text-muted">∅</span>' : '<span class="dg-pu-log-new">' + escapeHtml(r.new_value) + "</span>";
          var srcRaw = String(r.source || "override");
          var srcCls = "dg-pu-log-action " + purchaseLogSourceClass(r.source);
          html += "<tr>" +
            "<td>" + escapeHtml(formatDateTimeMsk(r.changed_at)) + "</td>" +
            "<td>" + escapeHtml(who) + "</td>" +
            '<td><span class="' + srcCls + '" title="' + escapeHtml(srcRaw) + '">' + escapeHtml(purchaseLogSourceLabel(r.source)) + "</span></td>" +
            "<td>" + escapeHtml(r.field_label || r.field || "") + "</td>" +
            "<td>" + oldVal + '<span class="dg-pu-log-arrow">→</span>' + newVal + "</td>" +
            "</tr>";
        }
        html += "</tbody></table>";
        html += renderPuLogPager(total, limit, offset);
        container.innerHTML = html;
      }

        }

        var colIdx = cols.findIndex(function (p) { return p[0] === key; });
        if (colIdx < 0) return;
        document.querySelectorAll("#dg-pu-tbody tr").forEach(function (tr) {
          var td = tr.children[colIdx];
          if (td) {
            td.style.width = nextWidth + "px";
            td.style.minWidth = nextWidth + "px";
            td.style.maxWidth = nextWidth + "px";
          }
        });
      }

      function onMouseMove(e) {
        if (!resizeState) return;
        var delta = e.clientX - resizeState.startX;
        var nextWidth = Math.max(50, Math.min(700, Math.round(resizeState.startWidth + delta)));
        applyColumnWidth(resizeState.key, nextWidth);
        schedulePuFloatingHeaderUpdate();
      }
      function onMouseUp() {
        if (!resizeState) return;
        resizeState = null;
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        try { localStorage.setItem(userColWidthKey(), JSON.stringify(columnWidths || {})); } catch (e) {}
        puRefreshFloatingAfterLayout();
      }

      function buildThead() {
        var thead = document.getElementById("dg-pu-thead");
        thead.innerHTML = "";
        var tr = document.createElement("tr");
        var cols = getVisibleColumns();
        cols.forEach(function (pair) {
          var key = pair[0];
          var label = pair[1];
          var opts = COL_OPTS[key] || {};
          var th = document.createElement("th");
          th.dataset.colKey = key;
          th.setAttribute("data-col-key", key);
          var apiSort = SORT_KEY_REMAP[key] || (opts.sortKey || key);
          var isSortable = SORTABLE.has(apiSort);
          var minW = getColMin(key);
          var cw = Number(columnWidths[key] || 0);
          th.style.position = "sticky";
          th.style.top = "0";
          th.style.zIndex = "30";
          Object.assign(th.style, HEADER_FONT);
          th.style.background = opts.future ? "#f5f7fb" : "#ffffff";
          if (opts.future) th.classList.add("dg-pu-future-th");
          th.style.borderRight = "1px solid #e6e9ee";
          if (Number.isFinite(cw) && cw > 0) {
            th.style.width = cw + "px";
            th.style.minWidth = cw + "px";
            th.style.maxWidth = cw + "px";
          } else {
            /* Без явной тройки width/min/max при table-layout:fixed и min-width таблицы 2500px
               браузер раздувает колонки; дефолт = COL_MIN как фиксированная ширина. */
            th.style.width = minW + "px";
            th.style.minWidth = minW + "px";
            th.style.maxWidth = minW + "px";
          }
          th.style.whiteSpace = "normal";
          th.style.wordBreak = "break-word";
          th.style.overflowWrap = "break-word";
          th.style.overflow = "hidden";
          if (isSortable) th.style.cursor = "pointer";
          var labelText = document.createTextNode(
            label + (sortBy === apiSort ? (sortDir === "asc" ? " ↑" : " ↓") : "")
          );
          var labelWrap = document.createElement("div");
          labelWrap.style.textAlign = "center";
          if (key === "name" || key === "code") labelWrap.style.textAlign = "left";
          labelWrap.style.fontVariantNumeric = "tabular-nums";
          labelWrap.appendChild(labelText);
          th.appendChild(labelWrap);
          if (opts.puSub) {
            var sub = document.createElement("div");
            sub.className = "text-muted";
            sub.style.fontSize = "10px";
            sub.style.fontWeight = "400";
            sub.style.lineHeight = "1.15";
            sub.style.marginTop = "2px";
            sub.textContent = opts.puSub;
            labelWrap.appendChild(sub);
          }

          var handle = document.createElement("span");
          handle.setAttribute("role", "separator");
          handle.title = "Потяните, чтобы изменить ширину";
          handle.style.cssText =
            "position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;z-index:4;" +
            "background:linear-gradient(to right,transparent 47%,#d9dee5 47%,#d9dee5 53%,transparent 53%);opacity:0.55";
          handle.addEventListener("mousedown", function (ev) {
            ev.stopPropagation();
            startColumnResize(ev, key);
          });
          handle.addEventListener("click", function (ev) { ev.stopPropagation(); });
          th.appendChild(handle);

          th.addEventListener("click", function () {
            // По правилам baseline: если в документе есть выделение текста — клик
            // НЕ должен переключать сортировку (иначе подпись схлопывается и копировать нельзя).
            try {
              var sel = window.getSelection ? window.getSelection() : null;
              if (sel && String(sel.toString() || "").trim().length > 0) return;
            } catch (e) {}
            if (!isSortable) return;
            if (sortBy === apiSort) sortDir = sortDir === "asc" ? "desc" : "asc";
            else { sortBy = apiSort; sortDir = "asc"; }
            page = 1;
            buildThead();
            loadData();
          });
          tr.appendChild(th);
        });
        thead.appendChild(tr);
        puRefreshFloatingAfterLayout();
      }

      function getTdStyle(key) {
        var opts = COL_OPTS[key] || {};
        var s = { verticalAlign: opts.editable ? "middle" : "top", whiteSpace: "normal", wordBreak: "break-word" };
        if (key === "name" || key === "code") s.textAlign = "left";
        var minW = getColMin(key);
        var cw = Number(columnWidths[key] || 0);
        if (Number.isFinite(cw) && cw > 0) {
          s.width = cw + "px"; s.minWidth = cw + "px"; s.maxWidth = cw + "px";
        } else {
          s.width = minW + "px"; s.minWidth = minW + "px"; s.maxWidth = minW + "px";
        }
        return s;
      }
      function applyTdStyle(td, key) {
        var o = getTdStyle(key);
        Object.keys(o).forEach(function (k) { td.style[k] = o[k]; });
      }

      function renderTable(rows) {
        var tbody = document.getElementById("dg-pu-tbody");
        tbody.replaceChildren();
        var cols = getVisibleColumns();
        if (loading) {
          var trL = document.createElement("tr");
          var tdL = document.createElement("td");
          tdL.colSpan = Math.max(1, cols.length);
          tdL.className = "text-muted";
          tdL.textContent = "Загрузка...";
          trL.appendChild(tdL);
          tbody.appendChild(trL);
          puRefreshFloatingAfterLayout();
          return;
        }
        var list = rows || [];
        if (!list.length) {
          var tr = document.createElement("tr");

          td.textContent = "Нет данных";

          puRefreshFloatingAfterLayout();

        list.forEach(function (r) {

          cols.forEach(function (pair) {
            var key = pair[0];
            var opts = COL_OPTS[key] || {};

            applyTdStyle(td, key);
            td.style.borderRight = "1px solid #f3f5f8";

              td.classList.add("dg-pu-future-td");
              td.style.background = "#fbfcfe";
            }
            if (opts.center) td.className = (td.className ? td.className + " " : "") + "text-center";
            if (key === "name") td.classList.add("dg-pu-cell-name");
            if (key === "code") td.classList.add("dg-pu-cell-code");
            td.appendChild(renderCell(key, r));
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        puRefreshFloatingAfterLayout();
      }

      function renderColumnControls() {
        var list = document.getElementById("dg-pu-columns-list");
        if (!list) return;
        list.innerHTML = "";
        PU_COLS.forEach(function (pair) {
          var key = pair[0];
          var label = pair[1];
          var wrap = document.createElement("label");
          wrap.className = "form-check d-flex align-items-center gap-2 mb-0";

          cb.type = "checkbox";
          cb.className = "form-check-input m-0";

          cb.addEventListener("change", function () {
            if (cb.checked) visibleCols.add(key);
            else {
              if (visibleCols.size <= 1) { cb.checked = true; return; }
              visibleCols.delete(key);
            }
            try { localStorage.setItem(userVisibleColsKey(), JSON.stringify(Array.from(visibleCols))); } catch (e) {}
            buildThead();
            renderTable(lastRows);
            updateTableHint();
          });
          var text = document.createElement("span");
          text.textContent = label;
          wrap.appendChild(cb);

      function totalPages() {
        return Math.max(1, Math.ceil(Number(total || 0) / Number(limit || 100)));
      }
      function updateTableHint() {
        var el = document.getElementById("dg-pu-table-hint");
        var foot = document.getElementById("dg-pu-footer-left");
        var pages = totalPages();
        var shown = Math.min(Number(limit || 100), Math.max(0, Number(total || 0) - (page - 1) * limit));
        var t = "Найдено: " + fmtNum(total) + "; страница " + page + "/" + pages + "; показано: " + fmtNum(shown);
        if (el) el.textContent = t;
        if (foot) foot.textContent = "Всего: " + fmtNum(total);
        var prev = document.getElementById("pu-btn-prev");
        var next = document.getElementById("pu-btn-next");
        if (prev) prev.disabled = page <= 1;
        if (next) next.disabled = page >= pages;

      function setApplyResetDisabled(dis) {
        ["purchase-apply", "purchase-reset", "purchase-refresh", "pu-btn-prev", "pu-btn-next"].forEach(function (id) {
          var b = document.getElementById(id);

      function stopPuWarmupPoll() {
        if (puWarmupTimer) {
          window.clearInterval(puWarmupTimer);
          puWarmupTimer = 0;
        }
      }

      function puWarmupProgressNeedsBanner(wp) {
        if (!wp || puWarmupDismissUntilDone) return false;
        if (wp.running) return true;
        if (wp.finished_at_ms != null && Date.now() - Number(wp.finished_at_ms) < 8000) return true;
        return false;
      }

      /** Убирает дублирование «4/28» + label «пресет 4/28» от бэкенда. */
      function puWarmupDedupePresetLabel(idx, tot, label) {
        var s = String(label || "").trim();
        if (!tot || !s) return s;
        try {
          if (new RegExp("^пресет\\s*" + Number(idx) + "\\s*/\\s*" + Number(tot) + "\\s*$", "i").test(s)) return "";
        } catch (e) {}
        return s;
      }

      function updatePuWarmupBannerFromProgress(wp) {
        lastWarmupProgress = wp || null;
        var banner = document.getElementById("dg-pu-cache-warmup-banner");
        var bar = document.getElementById("dg-pu-warmup-bar");
        var badge = document.getElementById("dg-pu-warmup-badge");
        var preset = document.getElementById("dg-pu-warmup-preset");
        if (!banner) return;
        var show = puWarmupProgressNeedsBanner(wp);
        if (!show) {
          banner.classList.add("d-none");
          stopPuWarmupPoll();
          return;
        }
        banner.classList.remove("d-none");
        var pct = Math.max(0, Math.min(100, Number(wp && wp.pct != null ? wp.pct : 0)));
        if (bar) {
          bar.style.width = pct + "%";
          bar.setAttribute("aria-valuenow", String(pct));
        }
        var idx = Number((wp && wp.preset_index) || 0);
        var tot = Number((wp && wp.preset_total) || 0);
        var labelRaw = wp && String(wp.label || "").trim();
        var labelLine = puWarmupDedupePresetLabel(idx, tot, labelRaw);
        var running = Boolean(wp && wp.running);
        if (badge) {
          if (tot) {
            var bits = ["Шаг " + idx + " из " + tot];
            if (labelLine) bits.push(labelLine);
            else if (running) bits.push("сервер собирает кэш по типовым фильтрам");
            badge.textContent = bits.join(" — ");
          } else {
            badge.textContent = labelRaw || (running ? "Идёт прогрев…" : "Готово");
          }
        }
        if (preset) {
          var sec = wp && typeof wp.preset_elapsed_sec === "number" ? Math.max(0, Math.floor(wp.preset_elapsed_sec)) : null;
          var runMs = wp && wp.progressive_run_started_ms != null ? Number(wp.progressive_run_started_ms) : 0;
          var runLine = "";
          if (tot && running && runMs > 0) {
            try {
              runLine =
                "Старт этого прогона: " +
                new Date(runMs).toLocaleString() +
                " (после рестарта Node — новый отсчёт). ";
            } catch (eR) {}
          }
          if (tot && running) {
            preset.textContent =
              runLine +
              (sec != null ? "На этом шаге уже " + sec + " с — если число растёт, Node занят, зависания нет. " : "") +
              "Полоска % обновляется только между пресетами: внутри шага идёт тяжёлая сборка снимка и прогрев сортировок в памяти (на большом каталоге это минуты). " +
              "«Шаг N из M» — сейчас обрабатывается N-й пресет. Фиксированный набор на сервере, не клики в форме. Подробности — logs/purchase-cache.log.";
          } else if (tot && !running && labelRaw === "Готово") {
            preset.textContent = "Типовые пресеты на сервере прогреты; сортировка и фильтры на странице к этому не привязаны.";
          } else if (labelRaw && labelRaw.indexOf("Ошибка") === 0) {
            preset.textContent = labelRaw;
          } else {
            preset.textContent = "Фоновый прогрев кэша на сервере (см. logs/purchase-cache.log).";
          }
        }
      }

      function schedulePuWarmupPoll() {
        if (puWarmupTimer) return;
        if (!puWarmupProgressNeedsBanner(lastWarmupProgress)) return;
        puWarmupTimer = window.setInterval(function () {
          fetch("/api/purchase/warmup-progress", { credentials: "same-origin" })
            .then(function (r) {
              return r.json();
            })
            .then(function (j) {
              if (!j || j.success === false) return;
              updatePuWarmupBannerFromProgress(j);
              if (!puWarmupProgressNeedsBanner(j)) stopPuWarmupPoll();
            })
            .catch(function () {});
        }, 2500);
      }

      function loadData() {
        if (loading) return;
        loading = true;
        setApplyResetDisabled(true);
        renderTable(lastRows);
        var p = buildListParams();
        fetch("/api/purchase?" + p.toString(), { credentials: "same-origin" })
          .then(function (r) {
            var ct = String(r.headers.get("content-type") || "").toLowerCase();
            if (ct.indexOf("application/json") < 0 && ct.indexOf("+json") < 0) {
              return r.text().then(function (body) {
                var snippet = String(body || "")
                  .replace(/<[^>]+>/g, " ")
                  .replace(/\s+/g, " ")
                  .trim()
                  .slice(0, 160);
                var hint =
                  r.status === 502 || r.status === 504
                    ? " (прокси/nginx: таймаут или Node упал — см. pm2 logs)"
                    : r.status === 401
                      ? " (сессия истекла — перелогиньтесь)"
                      : "";
                throw new Error("Ответ не JSON, HTTP " + r.status + hint + (snippet ? ": " + snippet : ""));
              });
            }
            return r.json().then(function (j) {
              if (!r.ok || !j || j.success === false) {
                throw new Error((j && j.error) || "HTTP " + r.status);
              }
              return j;
            });
          })
          .then(function (j) {
            total = Number(j.total || 0);
            lastRows = Array.isArray(j.data) ? j.data : [];
            loading = false;
            setApplyResetDisabled(false);
            var wp = j.cache && j.cache.warmup_progress ? j.cache.warmup_progress : null;
            updatePuWarmupBannerFromProgress(wp);
            if (puWarmupProgressNeedsBanner(wp)) schedulePuWarmupPoll();
            buildThead();
            renderTable(lastRows);
            updateTableHint();
            syncUrlFromState();
            var ds = document.getElementById("dg-pu-status");
            if (ds) {
              ds.style.display = "none";
              ds.textContent = "";
              ds.classList.remove("text-danger");
            }
            puRefreshFloatingAfterLayout();
          })
          .catch(function (e) {
            loading = false;
            setApplyResetDisabled(false);
            total = 0;
            lastRows = [];
            buildThead();
            renderTable([]);
            updateTableHint();
            var ds = document.getElementById("dg-pu-status");
            if (ds) {
              ds.style.display = "";
              ds.textContent = "Ошибка: " + (e && e.message ? e.message : e);
              ds.classList.add("text-danger");
            }
            puRefreshFloatingAfterLayout();
          });
      }

      // Двусторонняя синхронизация дублирующего поля «Умный поиск» в шапке таблицы
      // (#dg-pu-table-search-mirror) с основным полем фильтра (#pu-f-search).
      // Enter — применить, Esc — очистить и применить (одиночное действие).
      (function bindHeaderSearchMirror() {
        var primary = document.getElementById("pu-f-search");
        var mirror = document.getElementById("dg-pu-table-search-mirror");
        var applyBtn = document.getElementById("purchase-apply");
        if (!primary || !mirror) return;
        var syncing = false;
        function copy(from, to) {
          if (syncing) return;
          if (to.value === from.value) return;
          syncing = true;
          to.value = from.value;
          to.dispatchEvent(new Event("input", { bubbles: true }));
          syncing = false;
        }
        primary.addEventListener("input", function () { copy(primary, mirror); });
        mirror.addEventListener("input", function () { copy(mirror, primary); });
        function apply() {
          if (applyBtn) applyBtn.click();
          else { page = 1; loadData(); }
        }
        function bindKeys(el) {
          el.addEventListener("keydown", function (e) {
            if (e.key === "Enter") { e.preventDefault(); apply(); }
            else if (e.key === "Escape") {
              if (!el.value) return;
              el.value = "";
              copy(el, el === primary ? mirror : primary);
              apply();
            }
          });
          el.addEventListener("search", function () {
            copy(el, el === primary ? mirror : primary);
            apply();
          });
        }
        bindKeys(primary);
        bindKeys(mirror);
        copy(primary, mirror);
      })();

      (function columnControls() {
        var toggle = document.getElementById("dg-pu-columns-toggle");
        var panel = document.getElementById("dg-pu-columns-panel");
        var allBtn = document.getElementById("dg-pu-columns-all");
        var noneBtn = document.getElementById("dg-pu-columns-none");
        var defBtn = document.getElementById("dg-pu-columns-default");
        var widthsToggle = document.getElementById("dg-pu-widths-toggle");
        var widthsPanel = document.getElementById("dg-pu-widths-panel");
        var panelsWrap = document.getElementById("dg-pu-toolbox-panels");
        if (!toggle || !panel) return;
        function syncWrap() {
          if (!panelsWrap) return;
          var open = panel.classList.contains("open") || (widthsPanel && widthsPanel.classList.contains("open"));
          panelsWrap.classList.toggle("d-none", !open);
        }
        toggle.addEventListener("click", function (e) {
          e.preventDefault(); e.stopPropagation();
          panel.classList.toggle("open");
          if (widthsPanel) widthsPanel.classList.remove("open");
          syncWrap();
        });
        if (widthsToggle && widthsPanel) {
          widthsToggle.addEventListener("click", function (e) {
            e.preventDefault(); e.stopPropagation();
            widthsPanel.classList.toggle("open");
            panel.classList.remove("open");
            if (widthsPanel.classList.contains("open")) renderWidthControls();
            syncWrap();
          });
        }
        function saveVisible() {
          try { localStorage.setItem(userVisibleColsKey(), JSON.stringify(Array.from(visibleCols))); } catch (e) {}
        }
        if (allBtn) allBtn.addEventListener("click", function () {
          visibleCols = new Set(PU_COLS.map(function (p) { return p[0]; }));
          saveVisible();
          renderColumnControls();
          buildThead();
          renderTable(lastRows);
          updateTableHint();
        });
        if (noneBtn) noneBtn.addEventListener("click", function () {
          visibleCols = new Set(["code", "name"]);
          saveVisible();
          renderColumnControls();
          buildThead();
          renderTable(lastRows);
          updateTableHint();
        });
        if (defBtn) defBtn.addEventListener("click", function () {
          visibleCols = new Set(DEFAULT_VISIBLE_KEYS);
          saveVisible();
          renderColumnControls();
          buildThead();
          renderTable(lastRows);
          updateTableHint();
        });
        document.addEventListener("click", function (e) {
          if (e.target.closest("#dg-pu-columns-panel")) return;
          if (e.target.closest("#dg-pu-columns-toggle")) return;
          if (e.target.closest("#dg-pu-widths-panel")) return;
          if (e.target.closest("#dg-pu-widths-toggle")) return;
          panel.classList.remove("open");
          if (widthsPanel) widthsPanel.classList.remove("open");
          syncWrap();
        });
        var widthsDefault = document.getElementById("dg-pu-widths-default");
        if (widthsDefault) widthsDefault.addEventListener("click", function () {
          columnWidths = {};
          try { localStorage.removeItem(userColWidthKey()); } catch (e) {}
          buildThead();
          renderTable(lastRows);
          renderWidthControls();
        });
      })();

      function renderWidthControls() {
        var list = document.getElementById("dg-pu-widths-list");
        if (!list) return;
        list.innerHTML = "";
        PU_COLS.forEach(function (pair) {
          var key = pair[0];
          var label = pair[1];
          var minW = getColMin(key);
          var current = Number(columnWidths[key] || 0);
          if (!Number.isFinite(current) || current <= 0) current = minW;
          var wrap = document.createElement("label");
          var span = document.createElement("span");
          span.textContent = label;
          span.style.flex = "1 1 auto";
          span.style.overflow = "hidden";
          span.style.textOverflow = "ellipsis";
          span.style.whiteSpace = "nowrap";
          var input = document.createElement("input");
          input.type = "number";
          input.className = "form-control form-control-sm";
          input.min = "50";
          input.max = "700";
          input.step = "10";
          input.value = String(current);
          input.setAttribute("data-col-key", key);
          input.addEventListener("change", function () {
            var k = this.getAttribute("data-col-key");
            var n = parseInt(this.value, 10);
            if (!Number.isFinite(n)) { this.value = String(columnWidths[k] || getColMin(k)); return; }
            n = Math.max(50, Math.min(700, n));
            applyColumnWidth(k, n);
            try { localStorage.setItem(userColWidthKey(), JSON.stringify(columnWidths || {})); } catch (e) {}
            this.value = String(n);
          });
          wrap.appendChild(span);
          wrap.appendChild(input);
          list.appendChild(wrap);
        });
      }

      // Сворачивание карточки таблицы (только card-body).
      (function tableCardCollapse() {
        var btn = document.getElementById("dg-pu-table-toggle");
        var body = document.getElementById("dg-pu-table-body");
        if (!btn || !body) return;
        var STORAGE_KEY = "dg.purchase.table-card.collapsed.v1";
        function apply() {
          var c = false;
          try { c = localStorage.getItem(STORAGE_KEY) === "1"; } catch (e) {}
          if (c) { body.style.display = "none"; btn.textContent = "Развернуть"; }
          else { body.style.display = ""; btn.textContent = "Свернуть"; }
        }
        apply();
        btn.addEventListener("click", function () {
          var hidden = body.style.display === "none";
          body.style.display = hidden ? "" : "none";
          btn.textContent = hidden ? "Свернуть" : "Развернуть";
          try { localStorage.setItem(STORAGE_KEY, hidden ? "0" : "1"); } catch (e) {}
          puRefreshFloatingAfterLayout();
        });
      })();

      /** Ширины/видимость завязаны на localStorage currentUser; он выставляется после /api/auth/me (datagon-vanilla.js). */
      function loadPurchaseColumnPreferences() {
        try {
          columnWidths = JSON.parse(localStorage.getItem(userColWidthKey()) || "{}") || {};
        } catch (e) { columnWidths = {}; }
        try {
          var allowed = new Set(PU_COLS.map(function (p) { return p[0]; }));
          var rawVisible = JSON.parse(localStorage.getItem(userVisibleColsKey()) || "[]");
          if (Array.isArray(rawVisible) && rawVisible.length) {
            visibleCols = new Set(rawVisible.filter(function (k) { return allowed.has(k); }));
          }
          if (!visibleCols.has("code")) visibleCols.add("code");
          if (visibleCols.size && !visibleCols.has("name")) visibleCols.add("name");
          if (!visibleCols.size) visibleCols = new Set(DEFAULT_VISIBLE_KEYS);
        } catch (e) {}
      }

      function redrawPurchaseTableAfterPrefs() {
        renderColumnControls();
        buildThead();
        renderTable(lastRows);
        updateTableHint();
        var wp = document.getElementById("dg-pu-widths-panel");
        if (wp && wp.classList.contains("open")) renderWidthControls();
        puRefreshFloatingAfterLayout();
      }

      loadPurchaseColumnPreferences();

      window.addEventListener("datagon-profile-loaded", function () {
        loadPurchaseColumnPreferences();
        redrawPurchaseTableAfterPrefs();
      });

      bindPurchaseCellTooltips();
      parseUrlToForm();
      var puWarmupDismiss = document.getElementById("dg-pu-warmup-dismiss");
      if (puWarmupDismiss) {
        puWarmupDismiss.addEventListener("click", function () {
          puWarmupDismissUntilDone = true;
          stopPuWarmupPoll();
          var b = document.getElementById("dg-pu-cache-warmup-banner");
          if (b) b.classList.add("d-none");
        });
      }
      renderColumnControls();
      updatePuStickyTopVar();
      buildThead();
      loadData();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          updatePuStickyTopVar();
          puRefreshFloatingAfterLayout();
        });
      }
      window.addEventListener("load", function () {
        updatePuStickyTopVar();
        puRefreshFloatingAfterLayout();
      });
    })();
  </script>
