  <script>
    (function () {
      // Один источник истины для колонок: видимость, ширины, шапка и тело берут отсюда.

      var PU_COLS = [

        ["name", "Наименование"],

      var COL_OPTS = {};
      PU_COLS.forEach(function (p) { COL_OPTS[p[0]] = p[2] || {}; });

      /** Подсказки к заголовкам колонок (глобальный tooltip Datagon, `data-dg-tooltip`). */
      var PU_TH_TIPS = {
        code: "Код товара в МойСклад (ms_export). Клик по коду в строке — карточка товара.",
        article: "Артикул из карточки МС (ms_entity_details или payload).",
        name: "Наименование из выгрузки МойСклад. Ссылка — карточка товара Datagon.",
        supplier_label: "Поставщик 1 и 2 из МС (как в карточке товара).",
        price_comment: "Поле «Проработка цены / коммент» из ms_export.",
        buy_price: "Закупочная цена из МойСклад (строка в ms_export.buy_price).",
        min_stock: "Неснижаемый остаток из МС (minimumBalance). Участвует в расчёте «К закупке».",
        formula_proposed_min_stock:
          "Предлагаемый неснижаемый по формуле продаж (кэш dg_formula_proposed_cache). Не подменяет МС в расчёте «К закупке».",
        automation_price: "Автоматизация цены из МС.",
        min_stock_dg:
          "Override «Нес.остаток Датагон» (редактируется здесь). В формуле продаж — нижняя граница предложения, не baseline.",
        multiplicity: "Кратность заказа (override Datagon, POST /api/purchase/override).",
        stock: "Остаток на складе из ms_export.stock.",
        in_transit:
          "В пути (inTransit): denorm_in_transit или payload_json после синка МС.",
        to_purchase_qty:
          "К закупке: max(0, неснижаемый МС − остаток − ожидание). Та же логика, что на «Поставщиках».",
        purchase_sum: "Сумма закупки: «К закупке» × закупочная цена. Без цены — прочерк.",
        d_15a:
          "Продано за последние 15 календарных дней (шт.): проведённые отгрузки МС, прямой код и через комплекты.",
        d_15b:
          "Число календарных дней за 15 дн., когда в логе был «нулевой» остаток (dg_product_zero_stock_log).",
        d_30a: "Продано за последние 30 календарных дней (шт.), см. колонку «15 / прод., шт».",
        d_30b: "Дней без остатка за 30 дн., см. колонку «15 / дн. нет».",
        d_60a: "Продано за последние 60 календарных дней (шт.).",
        d_60b: "Дней без остатка за 60 дн.",
        d_90a: "Продано за последние 90 календарных дней (шт.).",
        d_90b: "Дней без остатка за 90 дн.",
        d_180a: "Продано за последние 180 календарных дней (шт.).",
        d_180b: "Дней без остатка за 180 дн.",
        d_365a: "Продано за последние 365 календарных дней (шт.).",
        d_365b: "Дней без остатка за 365 дн.",
      };

      function applyPuThTooltip(th, key) {
        if (!th) return;
        var opts = COL_OPTS[key] || {};
        var tip = String(opts.thTip || PU_TH_TIPS[key] || "").trim();
        if (tip) th.setAttribute("data-dg-tooltip", tip);
      }

      /** После «Применить» с доп. фильтром «К закупке» / to_buy — скрываем «Автоматизация цены». */
      var purchaseToPurchaseMode = false;

      var lastColumnTotals = null;
      var lastKpiTotals = null;
      var lastKpiTotalsSource = "";
      var lastFormulaKpiApproximate = false;
      var lastFormulaKpiEnriching = false;
      var lastToPurchaseActive = false;
      var PU_SUM_COL_KEYS = new Set([
        "min_stock",
        "formula_proposed_min_stock",
        "stock",
        "in_transit",
        "to_purchase_qty",
        "purchase_sum",
      ]);

      var SORTABLE = new Set([
        "code", "article", "name", "supplier", "price_comment", "buy_price",
        "min_stock", "formula_proposed_min_stock", "automation_price",
        "min_stock_dg", "multiplicity",
        "stock", "is_archived", "in_transit",
        "d_15a", "d_15b", "d_30a", "d_30b",
        "d_60a", "d_60b", "d_90a", "d_90b", "d_180a", "d_180b", "d_365a", "d_365b",
      ]);

      // По смыслу сортировки — поставщик в БД лежит как `supplier`/`supplier2`,
      // карточка в UI собирается отдельно, поэтому маппим к ключу `supplier`.
      var SORT_KEY_REMAP = { supplier_label: "supplier" };

      /** Паритет с `PURCHASE_HEAVY_SORT_KEYS` в `routes/purchase.js`. */
      var PURCHASE_HEAVY_SORT = new Set([
        "formula_proposed_min_stock",
        "d_15a", "d_15b", "d_30a", "d_30b",
        "d_60a", "d_60b", "d_90a", "d_90b", "d_180a", "d_180b", "d_365a", "d_365b",
      ]);

      function purchaseAuthHeaders(withJson) {
        var headers = {};
        try {
          var username = window.localStorage.getItem("currentUser");
          var token = window.localStorage.getItem("authToken");
          if (username) headers["x-auth-username"] = username;
          if (token) headers["x-auth-token"] = token;
        } catch (e) {}
        if (withJson) headers["Content-Type"] = "application/json";
        return headers;
      }

      function currentApiSortKey() {
        return SORT_KEY_REMAP[sortBy] || sortBy;
      }

      function isHeavySortActive() {
        return PURCHASE_HEAVY_SORT.has(currentApiSortKey());
      }

      var lastPurchaseCacheMeta = null;

      function updateSortHint() {
        var el = document.getElementById("dg-pu-sort-hint");
        if (!el) return;
        if (!isHeavySortActive()) {
          el.classList.add("d-none");
          el.textContent = "";
          return;
        }
        el.classList.remove("d-none");
        el.className = "alert py-2 px-3 small mb-2";
        var fc = lastPurchaseCacheMeta && lastPurchaseCacheMeta.formula_cache;
        var memNote = "";
        if (lastPurchaseCacheMeta && lastPurchaseCacheMeta.source === "memory") {
          memNote =
            " Ответ списка из кратковременного кэша (~" +
            Math.round(Number(lastPurchaseCacheMeta.age_ms || 0) / 1000) +
            " с) — обновите страницу после пересчёта.";
        }
        var ok = fc && fc.last_batch_success;
        var interrupted = fc && fc.last_run_interrupted;
        var revMismatch = fc && fc.rev_mismatch;
        if (fc && fc.ready) {
          el.classList.add("alert-success");
          var whenOk = "";
          if (ok && ok.finished_at) {
            whenOk =
              " Пересчёт: " +
              formatDateTimeMsk(ok.finished_at) +
              (ok.upserted != null ? ", записано " + fmtNum(ok.upserted) : "") +
              ".";
          }
          el.textContent =
            "Сортировка по формуле / d_*: кэш столбцов актуален — " +
            fmtNum(fc.cached_rows) +
            " из " +
            fmtNum(fc.selection_total) +
            " (100%)." +
            whenOk +
            memNote;
          return;
        }
        if (fc && Number(fc.cached_rows || 0) > 0) {
          el.classList.add("alert-warning");
          var parts = [];
          parts.push(
            "Сортировка по формуле / d_*: для текущей ревизии данных в кэше " +
              fmtNum(fc.cached_rows) +
              " из " +
              fmtNum(fc.selection_total) +
              " (" +
              String(fc.coverage_pct != null ? fc.coverage_pct : "—") +
              "%)."
          );
          if (interrupted) {
            parts.push(
              " Последний запуск пересчёта прерван (перезапуск Node ~39 с) — в processes см. «закрыта при старте сервера»."
            );
          }
          if (ok && ok.upserted != null && ok.processed != null) {
            parts.push(
              " Последний успешный пересчёт: " +
                formatDateTimeMsk(ok.finished_at) +
                ", записано " +
                fmtNum(ok.upserted) +
                " из " +
                fmtNum(ok.processed) +
                "."
            );
          }
          if (revMismatch && Number(fc.cached_rows_stale_rev || 0) > 0) {
            parts.push(
              " У " +
                fmtNum(fc.cached_rows_stale_rev) +
                " позиций кэш с устаревшей ревизией (после синка МС/продаж) — нужен новый «Пересчитать кэш»."
            );
          } else if (!interrupted) {
            parts.push(
              " Для части товаров формула не дала число (не записано в кэш) — такие строки в конце списка."
            );
          }
          parts.push(" Нажмите «Пересчитать кэш» и дождитесь ~10–15 мин (не перезапускайте сервер).");
          parts.push(memNote);
          el.textContent = parts.join("");
          return;
        }
        el.classList.add("alert-warning");
        var emptyParts = [
          "Сортировка по формуле / d_*: кэш столбцов пуст для текущей ревизии данных.",
        ];
        if (interrupted) {
          emptyParts.push(" Последний пересчёт прерван перезапуском сервера — повторите «Пересчитать кэш».");
        } else {
          emptyParts.push(" Нажмите «Пересчитать кэш» или дождитесь автосинхронизации.");
        }
        emptyParts.push(memNote);
        el.textContent = emptyParts.join("");
      }

      // Минимальные ширины = дефолт «📏 Ширины» для новых пользователей / сброса localStorage.
      var COL_MIN = {
        code: 60,
        article: 80,
        name: 260,
        supplier_label: 110,
        price_comment: 220,
        buy_price: 100,
        min_stock: 70,
        formula_proposed_min_stock: 70,
        automation_price: 70,
        min_stock_dg: 70,
        multiplicity: 70,
        stock: 80,
        in_transit: 60,
        to_purchase_qty: 76,
        purchase_sum: 110,
        d_15a: 60,
        d_15b: 60,
        d_30a: 60,
        d_30b: 60,
        d_60a: 60,
        d_60b: 60,
        d_90a: 60,
        d_90b: 60,
        d_180a: 60,
        d_180b: 60,
        d_365a: 60,
        d_365b: 60,
      };
      function getColMin(key) {
        if (COL_MIN[key] != null) return COL_MIN[key];
        return COL_OPTS[key] && COL_OPTS[key].future ? 60 : 90;
      }

      var FLOATING_HEADER_OFFSET_PX = 2;
      var FLOATING_HEADER_START_EPS_PX = 3;
      var puFloatingHeaderRaf = 0;
      var puFloatingLastScrollTs = 0;

      function updatePuStickyTopVar() {
        var app = document.querySelector(".app-container");
        var header = document.querySelector(".app-header");
        var fixed = Boolean(app && app.classList && app.classList.contains("fixed-header"));
        var top = 0;
        if (fixed && header && header.getBoundingClientRect) {
          var rect = header.getBoundingClientRect();
          top = rect && rect.height ? rect.height : 60;
        }
        document.documentElement.style.setProperty("--dg-table-sticky-top", top + "px");
      }

      function getPuStickyTopPx() {
        var app = document.querySelector(".app-container");
        var hdr = document.querySelector(".app-header");
        var fixed = Boolean(app && app.classList && app.classList.contains("fixed-header"));
        if (!fixed) return 0;
        if (!hdr || !hdr.getBoundingClientRect) return 60;
        var r = hdr.getBoundingClientRect();
        var h = r && r.height ? r.height : 60;
        return h > 0 ? h : 60;
      }

      function capturePuTheadBaseTop() {
        var thead = document.getElementById("dg-pu-thead");
        if (!thead) return;
        thead.style.transform = "";
        thead.style.position = "";
        thead.style.zIndex = "";
        thead.style.willChange = "";
        thead.removeAttribute("data-dg-floating");
        var rect = thead.getBoundingClientRect();
        var absTop = (window.scrollY || window.pageYOffset || 0) + (rect && rect.top ? rect.top : 0);
        thead.setAttribute("data-dg-base-top", String(absTop));
      }

      function updatePuFloatingHeaderFallback() {
        var thead = document.getElementById("dg-pu-thead");
        if (!thead) return;
        var table = thead.closest("table");
        if (!table || !table.getBoundingClientRect) return;
        var row = thead.querySelector("tr");
        if (!row) return;

        var y = window.scrollY || window.pageYOffset || 0;
        var headerTop = getPuStickyTopPx();

        var baseTopAbs = Number(thead.getAttribute("data-dg-base-top") || 0);
        if (!Number.isFinite(baseTopAbs) || baseTopAbs <= 0) return;
        var tableRect = table.getBoundingClientRect();
        var tableBottom = tableRect.bottom + y;
        var rowRect = row.getBoundingClientRect();
        var rowHeight = rowRect && rowRect.height ? rowRect.height : 0;

        var headerLine = y + headerTop;
        var start = baseTopAbs + FLOATING_HEADER_START_EPS_PX;
        var end = tableBottom - rowHeight;
        if (headerLine <= start || headerLine >= end) {
          if (thead.style.transform) {
            thead.style.transform = "";
            thead.style.position = "";
            thead.style.zIndex = "";
            thead.style.willChange = "";
            thead.removeAttribute("data-dg-floating");
          }
          return;
        }

        var zoomAwareOffset = FLOATING_HEADER_OFFSET_PX;
        var dpr = window.devicePixelRatio || 1;
        if (Math.abs(dpr - 1) < 0.03) zoomAwareOffset = FLOATING_HEADER_OFFSET_PX - 3;
        var shift = Math.max(0, headerLine - start - zoomAwareOffset);
        var shiftPx = Number(shift.toFixed(3));
        var nextTransform = "translate3d(0," + shiftPx + "px,0)";
        if (thead.style.transform !== nextTransform) {
          thead.style.transform = nextTransform;
          thead.style.position = "relative";
          thead.style.zIndex = "25";
          thead.style.willChange = "transform";
          thead.setAttribute("data-dg-floating", "1");
        }
      }

      function puFloatingHeaderTick(ts) {
        puFloatingHeaderRaf = 0;
        updatePuFloatingHeaderFallback();
        if (ts - puFloatingLastScrollTs < 140) {
          puFloatingHeaderRaf = requestAnimationFrame(puFloatingHeaderTick);
        }
      }

      function schedulePuFloatingHeaderUpdate() {
        puFloatingLastScrollTs = performance.now();
        if (puFloatingHeaderRaf) return;
        puFloatingHeaderRaf = requestAnimationFrame(puFloatingHeaderTick);
      }

      function onScrollPuFloatingHeader() {
        schedulePuFloatingHeaderUpdate();
      }

      function puRefreshFloatingAfterLayout() {
        requestAnimationFrame(function () {
          capturePuTheadBaseTop();
          schedulePuFloatingHeaderUpdate();
        });
      }

      var HEADER_FONT = {
        verticalAlign: "middle", fontSize: "12px", textAlign: "center",
        paddingTop: "8px", paddingBottom: "8px",
      };

      var initialFilters = {
        limit: 100,
        archived: "active",
        stock_position: "yes",
        no_longer_cooperation: "not_stopped",
        search: "",
        supplier: "",
        manager: "",
        only_stock: "0",
        include_bundles: "0",
        zero_stock: "0",
        zero_stock_no_transit: "0",
        no_multiplicity: "0",
        incomplete_pack: "0",
        to_purchase: "0",
        ms_formula_diff: "0",
      };

      /** Переход с «Поставщики» (?supplier=…&to_buy=1): короткая ссылка только пока доп. фильтр = «К закупке». */
      var purchaseToBuyLink = false;

      function isPuSupplierToBuyDeepLink() {
        return purchaseToBuyLink && readPuExtraFilterSelect() === "to_purchase";
      }

      function clearPurchaseToBuyLinkIfExtraChanged() {
        if (purchaseToBuyLink && readPuExtraFilterSelect() !== "to_purchase") {
          purchaseToBuyLink = false;
        }
      }

      var FILTERS_KEY = "datagon_purchase_filters_collapsed_v1";

      function userColWidthKey() {
        try {
          var u = String(localStorage.getItem("currentUser") || "guest").trim() || "guest";
          return "datagon_purchase_col_widths_v1:" + u;
        } catch (e) { return "datagon_purchase_col_widths_v1:guest"; }
      }
      function userVisibleColsKey() {
        try {
          var u = String(localStorage.getItem("currentUser") || "guest").trim() || "guest";
          return "datagon_purchase_visible_cols_v2:" + u;
        } catch (e) { return "datagon_purchase_visible_cols_v2:guest"; }
      }

      var page = 1;
      var sortBy = "code";
      var sortDir = "asc";
      var total = 0;
      var limit = 100;
      var lastRows = [];
      var lastColumnTotalsSource = "";
      var puLogModal = { code: "", name: "", offset: 0, limit: 100, total: 0, filterField: "" };
      var PURCHASE_LOG_SOURCE_LABELS = { override: "Ячейка", import: "Импорт CSV" };
      var loading = false;
      var loadSeq = 0;
      var columnWidths = {};
      var DEFAULT_VISIBLE_KEYS = PU_COLS.map(function (p) { return p[0]; });
      var visibleCols = new Set(DEFAULT_VISIBLE_KEYS);
      var resizeState = null;
      var urlSyncTimer = null;

      function fmtNum(n) {
        var x = Number(n || 0);
        return Number.isFinite(x) ? x.toLocaleString("ru-RU") : "0";
      }
      function fmtPuSnapQty(v) {
        if (v == null || v === "") return "—";
        var x = Number(v);
        if (!Number.isFinite(x)) return "—";
        return x.toLocaleString("ru-RU", { maximumFractionDigits: 3, minimumFractionDigits: 0 });
      }
      function fmtMoneyRub(n) {
        if (n == null || !Number.isFinite(Number(n))) return "—";
        return (
          Math.round(Number(n)).toLocaleString("ru-RU") + " ₽"
        );
      }
      function fmtPuKpiQtySub(label, qty) {
        if (qty == null || !Number.isFinite(Number(qty))) return "";
        return label + ": " + fmtPuSnapQty(qty) + " шт.";
      }

      function fmtPuPct(pct) {
        if (pct == null || !Number.isFinite(Number(pct))) return "—";
        var x = Number(pct);
        return x.toLocaleString("ru-RU", { minimumFractionDigits: 0, maximumFractionDigits: 1 }) + "%";
      }

      function renderPurchaseMsFormulaDiff(t) {
        var block = document.getElementById("dg-pu-ms-formula-diff-block");
        var textEl = document.getElementById("dg-pu-ms-formula-diff-text");
        var marker = document.getElementById("dg-pu-ms-formula-diff-marker");
        var track = document.getElementById("dg-pu-ms-formula-diff-track");
        if (!block || !textEl || !marker) return;
        if (loading) {
          block.classList.add("is-loading");
          textEl.textContent = "…";
          marker.style.left = "0%";
          if (track) track.title = "";
          return;
        }
        block.classList.remove("is-loading");
        var pos = Number((t && t.positions_count) || total || 0);
        var diff = Number((t && t.ms_formula_diff_count) || 0);
        var pctRaw = t && t.ms_formula_diff_pct != null ? Number(t.ms_formula_diff_pct) : null;
        var withProp = Number((t && t.ms_formula_with_proposed_count) || 0);
        if (pos <= 0) {
          textEl.textContent = "—";
          marker.style.left = "0%";
          if (track) track.title = "Нет позиций в фильтре";
          return;
        }
        if (lastFormulaKpiEnriching || lastFormulaKpiApproximate) {
          textEl.textContent = lastFormulaKpiEnriching ? "пересчёт…" : "~ " + fmtNum(diff) + " из " + fmtNum(pos);
          marker.style.left = "0%";
          if (track) {
            track.title =
              "Ориентировочно по кэшу SQL; для точной доли дождитесь пересчёта формулы";
          }
          return;
        }
        var pct = pctRaw != null && Number.isFinite(pctRaw) ? Math.max(0, Math.min(100, pctRaw)) : (pos > 0 ? (100 * diff) / pos : 0);
        textEl.textContent =
          fmtNum(diff) + " из " + fmtNum(pos) + " поз. · " + fmtPuPct(pct);
        marker.style.left = pct + "%";
        if (track) {
          track.title =
            "Позиций с расхождением (неснижаемый МС ≠ предлагаемый, целые шт.): " +
            fmtNum(diff) +
            " из " +
            fmtNum(pos) +
            " (" +
            fmtPuPct(pct) +

      function fmtNumEditable(n) {
        if (n == null) return "";

        if (!Number.isFinite(x)) return "";
        return Number.isInteger(x) ? String(x) : String(x);
      }

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatDateTimeMsk(value) {
        if (!value) return "";
        var d;
        try {
          d = new Date(value);
        } catch (e) {
          return String(value);
        }
        if (!d || isNaN(d.getTime())) return String(value);
        try {
          return d.toLocaleString("ru-RU", { timeZone: "Europe/Moscow" });
        } catch (e) {
          return d.toISOString();

      function purchaseLogSourceLabel(src) {

      /* ----- Hover-журнал по полю override (как .dg-dim-cell-tip на exports-dimensions) ----- */
      var puTipCache = {};
      var PU_TIP_CACHE_TTL_MS = 60000;
      var puTipEl = null;
      var puTipShowTimer = null;
      var puTipHideTimer = null;
      var puTipCurrentTarget = null;
      var puTipListenersBound = false;

      function ensurePuTipEl() {
        if (puTipEl) return puTipEl;
        puTipEl = document.createElement("div");
        puTipEl.className = "dg-pu-cell-tip";
        puTipEl.setAttribute("role", "tooltip");
        puTipEl.style.display = "none";
        document.body.appendChild(puTipEl);
        puTipEl.addEventListener("mouseenter", cancelPuHideTip);
        puTipEl.addEventListener("mouseleave", schedulePuHideTip);
        return puTipEl;
      }

      function positionPuTip(target) {
        if (!puTipEl || !target) return;
        var r = target.getBoundingClientRect();
        puTipEl.style.maxWidth = "360px";
        puTipEl.style.left = "-9999px";
        puTipEl.style.top = "-9999px";
        puTipEl.style.display = "";
        var tipRect = puTipEl.getBoundingClientRect();
        var top = r.bottom + 6 + window.scrollY;
        var left = r.left + window.scrollX;
        var maxLeft = window.scrollX + document.documentElement.clientWidth - tipRect.width - 8;
        if (left > maxLeft) left = Math.max(window.scrollX + 8, maxLeft);
        puTipEl.style.left = left + "px";
        puTipEl.style.top = top + "px";
      }

      function renderPuTipContent(rows, fieldKey) {
        if (!rows || rows.length === 0) {
          return (
            '<div class="dg-pu-cell-tip-empty">Это поле ещё не правили.</div>'
          );
        }
        var title =
          "Последние правки поля «" +
          escapeHtml(rows[0].field_label || purchaseColLabel(fieldKey) || fieldKey) +
          "»";
        var out = '<div class="dg-pu-cell-tip-title">' + title + '</div><ul class="dg-pu-cell-tip-list">';
        for (var i = 0; i < rows.length; i++) {
          var row = rows[i] || {};
          var oldV = row.old_value == null ? "∅" : escapeHtml(row.old_value);
          var newV = row.new_value == null ? "∅" : escapeHtml(row.new_value);
          var who = row.changed_by_name || ("user#" + (row.changed_by_user_id || "—"));
          var srcRaw = String(row.source || "override");
          var srcCls = "dg-pu-log-action " + purchaseLogSourceClass(srcRaw);
          out +=
            "<li>" +
            '<div class="dg-pu-cell-tip-row1"><span>' +
            escapeHtml(formatDateTimeMsk(row.changed_at)) +
            "</span> · <span>" +
            escapeHtml(who) +
            '</span> · <span class="' +
            srcCls +
            '" title="' +
            escapeHtml(srcRaw) +
            '">' +
            escapeHtml(purchaseLogSourceLabel(srcRaw)) +
            "</span></div>" +
            '<div class="dg-pu-cell-tip-row2"><span class="dg-pu-cell-tip-old">' +
            oldV +
            '</span> → <span class="dg-pu-cell-tip-new">' +
            newV +
            "</span></div>" +
            "</li>";
        }
        out += "</ul>";
        return out;
      }

      function showPuTipFor(target) {
        if (!target) return;
        var code = target.getAttribute("data-dg-code") || "";
        var field = target.getAttribute("data-dg-field") || "";
        if (!code || !field) return;
        ensurePuTipEl();
        var cacheKey = code + "/" + field;
        var now = Date.now();
        var cached = puTipCache[cacheKey];
        if (cached && now - cached.ts < PU_TIP_CACHE_TTL_MS) {
          puTipEl.innerHTML = renderPuTipContent(cached.rows, field);
          positionPuTip(target);
          return;
        }
        puTipEl.innerHTML = '<div class="dg-pu-cell-tip-loading">Загрузка журнала…</div>';
        positionPuTip(target);
        var qs = new URLSearchParams({ code: String(code), limit: "3", field: String(field) });
        fetch("/api/purchase/log?" + qs.toString(), { credentials: "same-origin" })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            if (!x.ok || !x.j || x.j.success === false) {
              if (puTipCurrentTarget === target) {
                puTipEl.innerHTML =
                  '<div class="dg-pu-cell-tip-err">' +
                  escapeHtml((x.j && x.j.error) || "Не удалось загрузить") +
                  "</div>";
              }
              return;
            }
            var rows = (x.j.rows || []).slice(0, 3);
            puTipCache[cacheKey] = { ts: Date.now(), rows: rows };
            if (puTipCurrentTarget === target) {
              puTipEl.innerHTML = renderPuTipContent(rows, field);
              positionPuTip(target);
            }
          })
          .catch(function () {
            if (puTipCurrentTarget === target) {
              puTipEl.innerHTML = '<div class="dg-pu-cell-tip-err">Сетевая ошибка</div>';
            }
          });
      }

      function schedulePuShowTip(target) {
        cancelPuShowTip();
        puTipCurrentTarget = target;
        puTipShowTimer = setTimeout(function () { showPuTipFor(target); }, 350);
      }

      function schedulePuHideTip() {
        cancelPuHideTip();
        puTipHideTimer = setTimeout(function () {
          if (puTipEl) puTipEl.style.display = "none";
          puTipCurrentTarget = null;
        }, 150);
      }

      function cancelPuShowTip() {
        if (puTipShowTimer) { clearTimeout(puTipShowTimer); puTipShowTimer = null; }
      }
      function cancelPuHideTip() {
        if (puTipHideTimer) { clearTimeout(puTipHideTimer); puTipHideTimer = null; }
      }

      function puTipTargetFromEvent(el) {
        if (!el || !el.closest) return null;
        return el.closest(".dg-pu-edit-tip-wrap[data-dg-code][data-dg-field]");
      }

      function invalidatePuTipCache(code, field) {
        if (!code) return;
        try {
          if (field) {
            delete puTipCache[code + "/" + field];
          } else {
            for (var k in puTipCache) {
              if (Object.prototype.hasOwnProperty.call(puTipCache, k) && k.indexOf(code + "/") === 0) {
                delete puTipCache[k];
              }
            }
          }
        } catch (e) {}
      }

      function bindPurchaseCellTooltips() {
        if (puTipListenersBound) return;
        var tbody = document.getElementById("dg-pu-tbody");
        if (!tbody) return;
        puTipListenersBound = true;
        tbody.addEventListener("mouseover", function (ev) {
          var t = puTipTargetFromEvent(ev.target);
          if (!t) return;
          cancelPuHideTip();
          if (puTipCurrentTarget === t) return;
          schedulePuShowTip(t);
        });
        tbody.addEventListener("mouseout", function (ev) {
          var t = puTipTargetFromEvent(ev.target);
          if (!t) return;
          var related = ev.relatedTarget;
          if (related && puTipEl && puTipEl.contains(related)) return;
          if (related && puTipTargetFromEvent(related) === t) return;
          cancelPuShowTip();
          schedulePuHideTip();
        });
        function dismissOnScroll() {
          cancelPuShowTip();
          if (puTipEl && puTipEl.style.display !== "none") {
            puTipEl.style.display = "none";
            puTipCurrentTarget = null;
          }
        }
        window.addEventListener("scroll", dismissOnScroll, { passive: true, capture: true });
        var appOuter = document.querySelector(".app-main__outer");
        if (appOuter) appOuter.addEventListener("scroll", dismissOnScroll, { passive: true });
        var outer = document.getElementById("dg-pu-table-scroll-outer");
        if (outer) outer.addEventListener("scroll", dismissOnScroll, { passive: true });
      }
      function formatMoneyText(value) {
        var raw = String(value == null ? "" : value).trim();
        if (!raw) return "";
        var parsed = Number(raw.replace(/[^\d.,-]/g, "").replace(",", "."));
        if (!Number.isFinite(parsed)) return raw;
        return parsed.toLocaleString("ru-RU") + " ₽";
      }

      /** Один режим «Доп. фильтр» → те же query-параметры, что раньше у чекбоксов (взаимоисключающе). */
      function readPuExtraFilterSelect() {
        var sel = document.getElementById("pu-f-extra-filter");
        return sel ? String(sel.value || "").trim() : "";
      }

      function extraFilterModeToFlags(mode) {
        var o = {
          only_stock: "0",
          include_bundles: "0",
          zero_stock: "0",
          zero_stock_no_transit: "0",
          no_multiplicity: "0",
          incomplete_pack: "0",
          to_purchase: "0",
        };
        switch (String(mode || "")) {
          case "only_stock":
            o.only_stock = "1";
            break;
          case "include_bundles":
            o.include_bundles = "1";
            break;
          case "zero_stock":
            o.zero_stock = "1";
            break;
          case "zero_stock_no_transit":
            o.zero_stock_no_transit = "1";
            break;
          case "no_multiplicity":
            o.no_multiplicity = "1";
            break;
          case "incomplete_pack":
            o.incomplete_pack = "1";
            break;
          case "to_purchase":
            o.to_purchase = "1";
            break;
          default:
            break;
        }
        return o;
      }

      /**
       * Восстановление селекта из URL: при нескольких флагах=1 (старые закладки) — приоритет «узкого» фильтра.
       */
      function syncPuExtraFilterFromUrlParams(params) {
        var sel = document.getElementById("pu-f-extra-filter");
        if (!sel) return;
        function is1(k) {
          return params.get(k) === "1";
        }
        var next = "";
        if (is1("zero_stock_no_transit")) next = "zero_stock_no_transit";
        else if (is1("zero_stock")) next = "zero_stock";
        else if (is1("incomplete_pack")) next = "incomplete_pack";
        else if (is1("no_multiplicity")) next = "no_multiplicity";
        else if (is1("only_stock")) next = "only_stock";
        else if (is1("include_bundles")) next = "include_bundles";
        else if (is1("to_purchase") || is1("to_buy")) next = "to_purchase";
        sel.value = next;
      }

      var purchaseManagerOptions = [];

      function rebuildPurchaseManagerSelect(currentValue) {
        var el = document.getElementById("pu-f-manager");
        if (!el) return;
        currentValue = currentValue != null ? String(currentValue).trim() : "";
        el.innerHTML = "";
        var optAll = document.createElement("option");
        optAll.value = "";
        optAll.textContent = "— все —";
        el.appendChild(optAll);
        var hasCurrent = false;
        purchaseManagerOptions.forEach(function (name) {
          var opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          if (name === currentValue) {
            opt.selected = true;
            hasCurrent = true;
          }
          el.appendChild(opt);
        });
        if (currentValue && !hasCurrent) {
          var ghost = document.createElement("option");
          ghost.value = currentValue;
          ghost.textContent = currentValue + " (нет в справочнике МС)";
          ghost.selected = true;
          el.appendChild(ghost);
        }
      }

      function loadPurchaseManagers() {
        return fetch("/api/purchase/managers", { credentials: "same-origin" })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (j) {
            if (!j || j.success === false) throw new Error((j && j.error) || "Ошибка загрузки менеджеров");
            purchaseManagerOptions = Array.isArray(j.managers)
              ? j.managers.map(function (m) { return String(m || "").trim(); }).filter(Boolean)
              : [];
            try {
              purchaseManagerOptions.sort(function (a, b) {
                return a.localeCompare(b, "ru", { sensitivity: "base" });
              });
            } catch (eSort) {
              purchaseManagerOptions.sort();
            }
          })
          .catch(function () {
            purchaseManagerOptions = [];
          });
      }

      function readFilters() {
        var xf = extraFilterModeToFlags(readPuExtraFilterSelect());
        return {
          search: document.getElementById("pu-f-search").value.trim(),
          supplier: document.getElementById("pu-f-supplier").value.trim(),
          manager: document.getElementById("pu-f-manager").value.trim(),
          archived: document.getElementById("pu-f-archived").value,
          stock_position: document.getElementById("pu-f-stock_position").value,
          no_longer_cooperation: document.getElementById("pu-f-no_longer_cooperation").value,
          limit: Number(document.getElementById("pu-f-limit").value) || 100,
          only_stock: xf.only_stock,
          include_bundles: xf.include_bundles,
          zero_stock: xf.zero_stock,
          zero_stock_no_transit: xf.zero_stock_no_transit,
          no_multiplicity: xf.no_multiplicity,
          incomplete_pack: xf.incomplete_pack,
          to_purchase: xf.to_purchase,
          ms_formula_diff: readPuMsFormulaDiffSelect(),
        };

      function readPuMsFormulaDiffSelect() {
        var sel = document.getElementById("pu-f-ms-formula-diff");
        return sel && String(sel.value || "").trim() === "1" ? "1" : "0";
      }

      function appendFilterParams(p, f) {
        if (f.search) p.set("search", f.search);
        if (f.supplier) p.set("supplier", f.supplier);
        if (f.manager) p.set("manager", f.manager);
        if (f.archived && f.archived !== initialFilters.archived) p.set("archived", f.archived);
        if (f.stock_position && f.stock_position !== initialFilters.stock_position) p.set("stock_position", f.stock_position);
        if (f.no_longer_cooperation && f.no_longer_cooperation !== initialFilters.no_longer_cooperation) {
          p.set("no_longer_cooperation", f.no_longer_cooperation);
        }
        if (f.only_stock === "1") p.set("only_stock", "1");
        if (f.include_bundles === "1") p.set("include_bundles", "1");
        if (f.zero_stock === "1") p.set("zero_stock", "1");
        if (f.zero_stock_no_transit === "1") p.set("zero_stock_no_transit", "1");
        if (f.no_multiplicity === "1") p.set("no_multiplicity", "1");
        if (f.incomplete_pack === "1") p.set("incomplete_pack", "1");
        if (f.to_purchase === "1") p.set("to_purchase", "1");
        if (f.ms_formula_diff === "1") p.set("ms_formula_diff", "1");
        if (isPuSupplierToBuyDeepLink()) {
          p.set("to_buy", "1");
          p.set("to_purchase", "1");
          if (f.supplier) p.set("supplier_exact", "1");
        }
      }

      function buildListParams() {
        var f = readFilters();
        limit = f.limit;
        var offset = (page - 1) * limit;
        var p = new URLSearchParams();
        appendFilterParams(p, f);
        p.set("limit", String(limit));
        p.set("offset", String(offset));
        var apiSort = SORT_KEY_REMAP[sortBy] || sortBy;
        p.set("sort_by", apiSort);
        p.set("sort_dir", sortDir);
        // archived нам нужно всегда отправлять явно: бэк трактует "active" как дефолт
        if (!p.has("archived")) p.set("archived", f.archived);
        if (!p.has("stock_position")) p.set("stock_position", f.stock_position);
        if (!p.has("no_longer_cooperation")) p.set("no_longer_cooperation", f.no_longer_cooperation);
        return p;
      }

      function syncUrlFromState() {
        clearPurchaseToBuyLinkIfExtraChanged();
        var f = readFilters();
        if (isPuSupplierToBuyDeepLink() && f.supplier) {
          var shortP = new URLSearchParams();
          shortP.set("supplier", f.supplier);
          shortP.set("to_buy", "1");
          if (Number(page) > 1) shortP.set("page", String(page));
          if (sortBy !== "code") {
            var urlSortKey = sortBy;
            try {
              for (var colK in SORT_KEY_REMAP) {
                if (Object.prototype.hasOwnProperty.call(SORT_KEY_REMAP, colK) && SORT_KEY_REMAP[colK] === sortBy) {
                  urlSortKey = colK;
                  break;
                }
              }
            } catch (eSk) {}
            shortP.set("sort_by", urlSortKey);
          }
          if (sortDir !== "asc") shortP.set("sort_dir", sortDir);
          var shortNext = window.location.pathname + "?" + shortP.toString();
          try { window.history.replaceState(null, "", shortNext); } catch (e) {}
          return;
        }
        var params = new URLSearchParams();
        Object.keys(f).forEach(function (k) {
          var v = f[k];
          if (v === undefined || v === null || v === "") return;
          if (k === "limit" && Number(v) === Number(initialFilters.limit)) return;
          if (String(v) === String(initialFilters[k])) return;
          params.set(k, String(v));
        });
        if (Number(page) > 1) params.set("page", String(page));
        if (sortBy !== "code") {
          var urlSortKey = sortBy;
          try {
            for (var colK in SORT_KEY_REMAP) {
              if (Object.prototype.hasOwnProperty.call(SORT_KEY_REMAP, colK) && SORT_KEY_REMAP[colK] === sortBy) {
                urlSortKey = colK;
                break;
              }
            }
          } catch (eSk) {}
          params.set("sort_by", urlSortKey);
        }
        if (sortDir !== "asc") params.set("sort_dir", sortDir);
        var next = params.toString()
          ? window.location.pathname + "?" + params.toString()
          : window.location.pathname;
        try { window.history.replaceState(null, "", next); } catch (e) {}
      }

      function scheduleUrlSync() {
        if (urlSyncTimer) clearTimeout(urlSyncTimer);
        urlSyncTimer = setTimeout(function () {
          urlSyncTimer = null;
          syncUrlFromState();
        }, 200);
      }

      function parseUrlToForm() {
        var params = new URLSearchParams(window.location.search);
        var supFromUrl = params.get("supplier") || params.get("supplier_key") || "";
        var toBuy =
          params.get("to_buy") === "1" ||
          (params.get("to_purchase") === "1" && supFromUrl);
        if (toBuy) {
          purchaseToBuyLink = true;
          var sup = params.get("supplier") || params.get("supplier_key") || "";
          if (sup) document.getElementById("pu-f-supplier").value = sup;
          document.getElementById("pu-f-archived").value = "active";
          document.getElementById("pu-f-stock_position").value = "yes";
          document.getElementById("pu-f-no_longer_cooperation").value = "not_stopped";

        if (!toBuy) syncPuExtraFilterFromUrlParams(params);

      /** Паритет с lib/datagonSalesFormula.js applyMinStockDgFloor — обновление «Предлагаемый» после смены min_stock_dg без полного reload. */
      function applyMinStockDgFloorPu(proposed, minDgRaw) {
        var p = Number(proposed);
        var base = Number.isFinite(p) ? Math.trunc(p) : 0;
        if (minDgRaw == null || minDgRaw === "") return Math.max(0, base);
        var s = String(minDgRaw).replace(/\u00a0/g, " ").trim().replace(/\s+/g, "").replace(",", ".");
        if (!s) return Math.max(0, base);
        var dg = Number(s);
        if (!Number.isFinite(dg) || dg <= 0) return Math.max(0, base);
        var floorInt = Math.ceil(dg - 1e-9);
        return Math.max(base, floorInt);
      }

      function saveOverride(input) {
        var code = input.dataset.code || "";
        var field = input.dataset.field || "";
        var value = String(input.value || "").trim();
        if (!code || !field) return;
        if (value === input.dataset.original) return;
        input.classList.remove("is-saved", "is-error");
        input.classList.add("is-saving");
        fetch("/api/purchase/override", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code, field: field, value: value })
        })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            input.classList.remove("is-saving");
            if (!x.ok || !x.j || x.j.success === false) {
              input.classList.add("is-error");
              input.title = (x.j && x.j.error) ? String(x.j.error) : "Ошибка сохранения";
              return;
            }
            var stored = x.j.stored || {};
            var v = stored[field];
            input.value = fmtNumEditable(v);
            input.dataset.original = input.value;
            input.classList.add("is-saved");
            input.title = "Сохранено: " + new Date().toLocaleTimeString("ru-RU");
            invalidatePuTipCache(code, field);
            // Обновим локальный кэш строки, чтобы перерисовка не сбрасывала значение
            var rowIdx = lastRows.findIndex(function (rr) { return String(rr.code) === String(code); });
            if (rowIdx >= 0) {
              lastRows[rowIdx][field] = v;
              if (field === "min_stock_dg") {
                lastRows[rowIdx].formula_proposed_min_stock = applyMinStockDgFloorPu(
                  lastRows[rowIdx].formula_proposed_min_stock,
                  v
                );
                renderTable(lastRows);
              }
            }
          })
          .catch(function (e) {
            input.classList.remove("is-saving");
            input.classList.add("is-error");
            input.title = "Сеть недоступна: " + (e && e.message ? e.message : e);
          });
      }

      function openPuLogFor(code, name, opts) {
        var overlay = document.getElementById("dg-pu-log-overlay");
        var titleEl = document.getElementById("dg-pu-log-title");
        var subEl = document.getElementById("dg-pu-log-subtitle");
        var body = document.getElementById("dg-pu-log-body");
        if (!overlay || !body) return;
        puLogModal.code = String(code || "");
        puLogModal.name = String(name || "");
        puLogModal.filterField = opts && opts.field ? String(opts.field) : "";
        puLogModal.offset = 0;
        puLogModal.limit = 100;
        puLogModal.total = 0;
        overlay.dataset.dgPuLogCode = puLogModal.code;
        if (titleEl) titleEl.textContent = "Журнал закупок (overrides)";
        if (subEl) {
          var base = (puLogModal.name ? puLogModal.name + " · " : "") + "код: " + String(code || "—");
          if (puLogModal.filterField) base += " · только: " + purchaseColLabel(puLogModal.filterField);
          subEl.textContent = base;
        }
        body.innerHTML = '<div class="text-muted small text-center py-4">Загрузка журнала…</div>';
        overlay.style.display = "";
        overlay.setAttribute("aria-hidden", "false");
        loadPuLogFor(puLogModal.code, { offset: 0, limit: puLogModal.limit });
      }

      function closePuLog() {
        var overlay = document.getElementById("dg-pu-log-overlay");
        if (!overlay) return;
        overlay.style.display = "none";
        overlay.setAttribute("aria-hidden", "true");
        delete overlay.dataset.dgPuLogCode;
        puLogModal.code = "";
        puLogModal.name = "";
        puLogModal.filterField = "";
        puLogModal.offset = 0;
        puLogModal.total = 0;
      }

      function loadPuLogFor(code, opts) {
        var body = document.getElementById("dg-pu-log-body");
        if (!body || !code) return;
        var o = opts && typeof opts === "object" ? opts : {};
        var offset = Math.max(0, Number.isFinite(Number(o.offset)) ? Number(o.offset) : 0);
        var limit = Math.max(1, Number.isFinite(Number(o.limit)) ? Number(o.limit) : 100);
        var qs = new URLSearchParams({ code: String(code), limit: String(limit), offset: String(offset) });
        if (puLogModal.filterField) qs.set("field", puLogModal.filterField);
        body.innerHTML = '<div class="text-muted small text-center py-4">Загрузка журнала…</div>';
        fetch("/api/purchase/log?" + qs.toString(), { credentials: "same-origin" })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            if (!x.ok || !x.j || x.j.success === false) {
              body.innerHTML = '<div class="text-danger small text-center py-4">' +
                escapeHtml((x.j && x.j.error) || "Ошибка загрузки журнала") + "</div>";
              return;
            }
            puLogModal.code = String(code);
            puLogModal.offset = Number(x.j.offset || 0);
            puLogModal.limit = Number(x.j.limit || limit);
            puLogModal.total = Number(x.j.total || 0);
            renderPuLogRows(body, x.j.rows || [], {
              total: puLogModal.total,
              limit: puLogModal.limit,
              offset: puLogModal.offset,
            });
          })
          .catch(function (e) {
            body.innerHTML = '<div class="text-danger small text-center py-4">Сетевая ошибка: ' +
              escapeHtml((e && e.message) || String(e)) + "</div>";
          });
      }

      function purchaseLogSourceClass(src) {
        var s = String(src || "override").toLowerCase();
        return s === "import" ? "src-import" : "src-override";
      }

      function renderPuLogPager(total, limit, offset) {
        var pages = total > 0 ? Math.max(1, Math.ceil(total / limit)) : 1;
        var current = Math.floor(offset / limit) + 1;
        var prevDisabled = offset <= 0 ? " disabled" : "";
        var nextDisabled = (offset + limit) >= total ? " disabled" : "";
        var shown = Math.min(limit, Math.max(0, total - offset));
        return (
          '<div class="dg-pu-log-pager d-flex align-items-center justify-content-between gap-2 px-3 py-2 border-top">' +
          '<div class="text-muted small">Найдено: ' + total + "; страница " + current + "/" + pages + "; показано: " + shown + "</div>" +
          '<div class="d-flex align-items-center gap-2">' +
          '<button type="button" class="btn btn-sm btn-outline-secondary dg-pu-log-prev"' + prevDisabled + ">Назад</button>" +
          '<button type="button" class="btn btn-sm btn-outline-secondary dg-pu-log-next"' + nextDisabled + ">Вперёд</button>" +
          "</div></div>"
        );
      }

      function renderPuLogRows(container, rows, meta) {
        var total = meta && Number(meta.total) > 0 ? Number(meta.total) : 0;
        var limit = meta && Number(meta.limit) > 0 ? Number(meta.limit) : 100;
        var offset = meta && Number(meta.offset) >= 0 ? Number(meta.offset) : 0;
        if (!Array.isArray(rows) || rows.length === 0) {
          var emptyHtml = '<div class="text-muted small text-center py-4">';
          if (total === 0) {
            emptyHtml += "Журнал пуст: по этой позиции ещё не было изменений полей закупок.";
          } else {
            emptyHtml += "Пустая страница (offset=" + offset + ").";
          }
          emptyHtml += "</div>";
          if (total > 0) emptyHtml += renderPuLogPager(total, limit, offset);
          container.innerHTML = emptyHtml;
          return;
        }
        var html = "<table><thead><tr>" +
          '<th style="width:16%">Когда (МСК)</th>' +
          '<th style="width:20%">Кто</th>' +
          '<th style="width:11%">Источник</th>' +
          '<th style="width:18%">Поле</th>' +
          "<th>Было → стало</th>" +
          "</tr></thead><tbody>";
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i] || {};
          var who = r.changed_by_name || ("user#" + (r.changed_by_user_id != null ? r.changed_by_user_id : "—"));
          var oldVal = r.old_value == null ? '<span class="text-muted">∅</span>' : '<span class="dg-pu-log-old">' + escapeHtml(r.old_value) + "</span>";
          var newVal = r.new_value == null ? '<span class="text-muted">∅</span>' : '<span class="dg-pu-log-new">' + escapeHtml(r.new_value) + "</span>";
          var srcRaw = String(r.source || "override");
          var srcCls = "dg-pu-log-action " + purchaseLogSourceClass(r.source);
          html += "<tr>" +
            "<td>" + escapeHtml(formatDateTimeMsk(r.changed_at)) + "</td>" +
            "<td>" + escapeHtml(who) + "</td>" +
            '<td><span class="' + srcCls + '" title="' + escapeHtml(srcRaw) + '">' + escapeHtml(purchaseLogSourceLabel(r.source)) + "</span></td>" +
            "<td>" + escapeHtml(r.field_label || r.field || "") + "</td>" +
            "<td>" + oldVal + '<span class="dg-pu-log-arrow">→</span>' + newVal + "</td>" +
            "</tr>";
        }
        html += "</tbody></table>";
        html += renderPuLogPager(total, limit, offset);
        container.innerHTML = html;
      }

      function bindPuLogModal() {
        document.addEventListener("click", function (ev) {
          var btn = ev.target && ev.target.closest && ev.target.closest(".dg-pu-log-btn");
          if (btn) {
            ev.preventDefault();
            var c = btn.getAttribute("data-dg-pu-log-code") || "";
            var n = btn.getAttribute("data-dg-pu-log-name") || "";
            if (c) openPuLogFor(c, n);
            return;
          }
        });
        var closeBtn = document.getElementById("dg-pu-log-close");
        if (closeBtn) closeBtn.addEventListener("click", closePuLog);
        var refreshBtn = document.getElementById("dg-pu-log-refresh");
        if (refreshBtn) refreshBtn.addEventListener("click", function () {
          if (puLogModal.code) loadPuLogFor(puLogModal.code, { offset: puLogModal.offset, limit: puLogModal.limit });
        });
        var backdrop = document.getElementById("dg-pu-log-backdrop");
        if (backdrop) backdrop.addEventListener("click", closePuLog);
        document.addEventListener("click", function (ev) {
          var prev = ev.target && ev.target.closest && ev.target.closest(".dg-pu-log-prev");
          if (prev && !prev.disabled && puLogModal.code) {
            ev.preventDefault();
            var nextOff = Math.max(0, puLogModal.offset - puLogModal.limit);
            loadPuLogFor(puLogModal.code, { offset: nextOff, limit: puLogModal.limit });
          }
          var next = ev.target && ev.target.closest && ev.target.closest(".dg-pu-log-next");
          if (next && !next.disabled && puLogModal.code) {
            ev.preventDefault();
            var off2 = puLogModal.offset + puLogModal.limit;
            if (off2 < puLogModal.total) loadPuLogFor(puLogModal.code, { offset: off2, limit: puLogModal.limit });
          }
        });
      }
      bindPuLogModal();

          }
          spSum.title =
            "Сумма закупки: количество «к закупке» × закупочная цена из МойСклад. Без цены или при нулевой потребности — «—».";
          return spSum;
        }
        if (key === "supplier_label") {
          var sp4 = document.createElement("span");
          sp4.textContent = r.supplier_label || "-";
          sp4.title = (r.supplier && r.supplier2 && r.supplier !== r.supplier2)
            ? ("Поставщик 1: " + r.supplier + "\nПоставщик 2: " + r.supplier2)
            : (r.supplier || r.supplier2 || "");
          return sp4;
        }
        var val = r[key];
        var out = document.createElement("span");
        out.textContent = (val != null && val !== "") ? String(val) : "-";
        return out;
      }

      function startColumnResize(e, key) {
        e.preventDefault();
        e.stopPropagation();
        var th = e.currentTarget.closest("th");
        var w = Number(columnWidths[key] || 0);
        if (!Number.isFinite(w) || w <= 0) {
          var rect = th && th.getBoundingClientRect ? th.getBoundingClientRect() : null;
          w = rect && rect.width ? Math.round(rect.width) : getColMin(key);
        }
        resizeState = { key: key, startX: e.clientX, startWidth: w };
        document.body.style.cursor = "col-resize";
        document.body.style.userSelect = "none";
      }

      function applyColumnWidth(key, nextWidth) {
        columnWidths[key] = nextWidth;
        var thead = document.getElementById("dg-pu-thead");
        if (thead) {
          var th = thead.querySelector('th[data-col-key="' + key + '"]');
          if (th) {
            th.style.width = nextWidth + "px";
            th.style.minWidth = nextWidth + "px";
            th.style.maxWidth = nextWidth + "px";
          }
        }
        var cols = getVisibleColumns();
        var colIdx = cols.findIndex(function (p) { return p[0] === key; });
        if (colIdx < 0) return;
        document.querySelectorAll("#dg-pu-tbody tr").forEach(function (tr) {
          var td = tr.children[colIdx];
          if (td) {
            td.style.width = nextWidth + "px";
            td.style.minWidth = nextWidth + "px";
            td.style.maxWidth = nextWidth + "px";
          }
        });
        buildTfoot();
      }

      function onMouseMove(e) {
        if (!resizeState) return;
        var delta = e.clientX - resizeState.startX;
        var nextWidth = Math.max(50, Math.min(700, Math.round(resizeState.startWidth + delta)));
        applyColumnWidth(resizeState.key, nextWidth);
        schedulePuFloatingHeaderUpdate();
      }
      function onMouseUp() {
        if (!resizeState) return;
        resizeState = null;
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        try { localStorage.setItem(userColWidthKey(), JSON.stringify(columnWidths || {})); } catch (e) {}
        puRefreshFloatingAfterLayout();
      }

      function buildThead() {
        var thead = document.getElementById("dg-pu-thead");
        thead.innerHTML = "";
        var tr = document.createElement("tr");
        var cols = getVisibleColumns();
        cols.forEach(function (pair) {
          var key = pair[0];
          var label = pair[1];
          var opts = COL_OPTS[key] || {};
          var th = document.createElement("th");
          th.dataset.colKey = key;
          th.setAttribute("data-col-key", key);
          var apiSort = SORT_KEY_REMAP[key] || (opts.sortKey || key);
          var isSortable = SORTABLE.has(apiSort);
          var minW = getColMin(key);
          var cw = Number(columnWidths[key] || 0);
          th.style.position = "sticky";
          th.style.top = "0";
          th.style.zIndex = "30";
          Object.assign(th.style, HEADER_FONT);
          th.style.background = opts.future ? "#f5f7fb" : "#ffffff";
          if (opts.future) th.classList.add("dg-pu-future-th");
          th.style.borderRight = "1px solid #e6e9ee";
          if (Number.isFinite(cw) && cw > 0) {
            th.style.width = cw + "px";
            th.style.minWidth = cw + "px";
            th.style.maxWidth = cw + "px";
          } else {
            /* Без явной тройки width/min/max при table-layout:fixed и min-width таблицы 2500px
               браузер раздувает колонки; дефолт = COL_MIN как фиксированная ширина. */
            th.style.width = minW + "px";
            th.style.minWidth = minW + "px";
            th.style.maxWidth = minW + "px";
          }
          th.style.whiteSpace = "normal";
          th.style.wordBreak = "break-word";
          th.style.overflowWrap = "break-word";
          th.style.overflow = "hidden";
          if (isSortable) th.style.cursor = "pointer";
          var labelText = document.createTextNode(
            label + (sortBy === apiSort ? (sortDir === "asc" ? " ↑" : " ↓") : "")
          );
          var labelWrap = document.createElement("div");
          labelWrap.style.textAlign = "center";
          if (key === "name" || key === "code") labelWrap.style.textAlign = "left";
          labelWrap.style.fontVariantNumeric = "tabular-nums";
          labelWrap.appendChild(labelText);
          th.appendChild(labelWrap);
          applyPuThTooltip(th, key);
          if (opts.puSub) {
            var sub = document.createElement("div");
            sub.className = "text-muted";
            sub.style.fontSize = "10px";
            sub.style.fontWeight = "400";
            sub.style.lineHeight = "1.15";
            sub.style.marginTop = "2px";
            sub.textContent = opts.puSub;
            labelWrap.appendChild(sub);
          }

          var handle = document.createElement("span");
          handle.setAttribute("role", "separator");
          handle.title = "Потяните, чтобы изменить ширину";
          handle.style.cssText =
            "position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;z-index:4;" +
            "background:linear-gradient(to right,transparent 47%,#d9dee5 47%,#d9dee5 53%,transparent 53%);opacity:0.55";
          handle.addEventListener("mousedown", function (ev) {
            ev.stopPropagation();
            startColumnResize(ev, key);
          });
          handle.addEventListener("click", function (ev) { ev.stopPropagation(); });
          th.appendChild(handle);

          th.addEventListener("click", function () {
            // По правилам baseline: если в документе есть выделение текста — клик
            // НЕ должен переключать сортировку (иначе подпись схлопывается и копировать нельзя).
            try {
              var sel = window.getSelection ? window.getSelection() : null;
              if (sel && String(sel.toString() || "").trim().length > 0) return;
            } catch (e) {}
            if (!isSortable) return;
            if (sortBy === apiSort) sortDir = sortDir === "asc" ? "desc" : "asc";
            else { sortBy = apiSort; sortDir = "asc"; }
            page = 1;
            buildThead();
            loadData();
          });
          tr.appendChild(th);
        });
        thead.appendChild(tr);
        buildTfoot();
        puRefreshFloatingAfterLayout();
      }

      function getTdStyle(key) {
        var opts = COL_OPTS[key] || {};
        var s = { verticalAlign: opts.editable ? "middle" : "top", whiteSpace: "normal", wordBreak: "break-word" };
        if (key === "name" || key === "code") s.textAlign = "left";
        var minW = getColMin(key);
        var cw = Number(columnWidths[key] || 0);
        if (Number.isFinite(cw) && cw > 0) {
          s.width = cw + "px"; s.minWidth = cw + "px"; s.maxWidth = cw + "px";
        } else {
          s.width = minW + "px"; s.minWidth = minW + "px"; s.maxWidth = minW + "px";
        }
        return s;
      }
      function applyTdStyle(td, key) {
        var o = getTdStyle(key);
        Object.keys(o).forEach(function (k) { td.style[k] = o[k]; });
      }

      function formatPuColumnTotal(key, val) {
        if (val == null || !Number.isFinite(Number(val))) return "—";
        if (key === "purchase_sum") return fmtMoneyRub(val);
        if (key === "min_stock" || key === "formula_proposed_min_stock") return fmtNum(val);
        return fmtPuSnapQty(val);
      }

      function buildTfoot() {
        var tfoot = document.getElementById("dg-pu-tfoot");
        if (!tfoot) return;
        tfoot.replaceChildren();
        if (loading || !lastColumnTotals) return;
        var posInTotals = Number(lastColumnTotals.positions_count || 0);
        var posMismatch =
          Number.isFinite(posInTotals) &&
          posInTotals > 0 &&
          Number(total || 0) > 0 &&
          posInTotals !== Number(total || 0);
        var cols = getVisibleColumns();
        if (!cols.length) return;
        var tr = document.createElement("tr");
        tr.className = "dg-pu-tfoot-row";
        var labelPlaced = false;
        cols.forEach(function (pair) {
          var key = pair[0];
          var td = document.createElement("td");
          applyTdStyle(td, key);
          if (COL_OPTS[key] && COL_OPTS[key].center) td.classList.add("text-center");
          if (!labelPlaced) {
            labelPlaced = true;
            var lab = document.createElement("span");
            lab.className = "dg-pu-tfoot-label";
            var posLabel =
              posInTotals > 0 ? " (" + fmtNum(posInTotals) + " поз.)" : "";
            lab.textContent = "Σ по фильтру" + posLabel;
            lab.title =
              "Сумма по всем строкам текущего фильтра (все страницы, не только эта)." +
              (posInTotals > 0 ? " Позиций в выборке: " + posInTotals + "." : "") +
              (posMismatch
                ? " Внимание: число позиций в итогах не совпадает с «Найдено» — обновите страницу или нажмите «Применить»."
                : "");
            if (posMismatch) lab.classList.add("text-warning");
            td.appendChild(lab);
          } else if (PU_SUM_COL_KEYS.has(key)) {
            var sp = document.createElement("span");
            sp.className = "dg-pu-tfoot-sum";
            sp.textContent = formatPuColumnTotal(key, lastColumnTotals[key]);
            td.appendChild(sp);
          }
          tr.appendChild(td);
        });
        tfoot.appendChild(tr);
      }

      function renderTable(rows) {
        var tbody = document.getElementById("dg-pu-tbody");
        tbody.replaceChildren();
        var cols = getVisibleColumns();
        if (loading) {
          var trL = document.createElement("tr");
          var tdL = document.createElement("td");
          tdL.colSpan = Math.max(1, cols.length);
          tdL.className = "text-muted";
          tdL.textContent = "Загрузка...";
          trL.appendChild(tdL);
          tbody.appendChild(trL);
          buildTfoot();
          puRefreshFloatingAfterLayout();
          return;
        }
        var list = rows || [];
        if (!list.length) {
          var tr = document.createElement("tr");
          var td = document.createElement("td");
          td.colSpan = Math.max(1, cols.length);
          td.className = "text-muted";
          td.textContent = "Нет данных";
          tr.appendChild(td);
          tbody.appendChild(tr);
          buildTfoot();
          puRefreshFloatingAfterLayout();
          return;
        }
        list.forEach(function (r) {
          var tr = document.createElement("tr");
          if (Number(r.is_archived) === 1) tr.className = "table-danger";
          cols.forEach(function (pair) {
            var key = pair[0];
            var opts = COL_OPTS[key] || {};
            var td = document.createElement("td");
            applyTdStyle(td, key);
            td.style.borderRight = "1px solid #f3f5f8";
            if (opts.future) {
              td.classList.add("dg-pu-future-td");
              td.style.background = "#fbfcfe";
            }
            if (opts.center) td.className = (td.className ? td.className + " " : "") + "text-center";
            if (key === "name") td.classList.add("dg-pu-cell-name");
            if (key === "code") td.classList.add("dg-pu-cell-code");
            td.appendChild(renderCell(key, r));
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        buildTfoot();
        puRefreshFloatingAfterLayout();
      }

      function renderColumnControls() {
        var list = document.getElementById("dg-pu-columns-list");
        if (!list) return;
        list.innerHTML = "";
        getPuColsList().forEach(function (pair) {
          var key = pair[0];
          var label = pair[1];
          var wrap = document.createElement("label");
          wrap.className = "form-check d-flex align-items-center gap-2 mb-0";
          var cb = document.createElement("input");
          cb.type = "checkbox";
          cb.className = "form-check-input m-0";
          cb.checked = visibleCols.has(key);
          cb.addEventListener("change", function () {
            if (cb.checked) visibleCols.add(key);
            else {
              if (visibleCols.size <= 1) { cb.checked = true; return; }
              visibleCols.delete(key);
            }
            try { localStorage.setItem(userVisibleColsKey(), JSON.stringify(Array.from(visibleCols))); } catch (e) {}
            buildThead();
            renderTable(lastRows);
            buildTfoot();
            updateTableHint();
          });
          var text = document.createElement("span");
          text.textContent = label;
          wrap.appendChild(cb);
          wrap.appendChild(text);
          list.appendChild(wrap);
        });
      }

      function totalPages() {
        return Math.max(1, Math.ceil(Number(total || 0) / Number(limit || 100)));
      }
      function updateTableHint() {
        var el = document.getElementById("dg-pu-table-hint");
        var foot = document.getElementById("dg-pu-footer-left");
        var pages = totalPages();
        var shown = Math.min(Number(limit || 100), Math.max(0, Number(total || 0) - (page - 1) * limit));
        var t = "Найдено: " + fmtNum(total) + "; страница " + page + "/" + pages + "; показано: " + fmtNum(shown);
        if (el) el.textContent = t;
        if (foot) foot.textContent = "Всего: " + fmtNum(total);
        var prev = document.getElementById("pu-btn-prev");
        var next = document.getElementById("pu-btn-next");
        if (prev) prev.disabled = page <= 1;
        if (next) next.disabled = page >= pages;
        updateSortHint();
      }

      var msApplyPollTimer = null;
      var msApplyActiveBatchId = null;
      var msApplyExpandedBatchId = null;
      var msApplyItemsCache = {};
      var formulaCachePollTimer = null;
      var formulaCacheWasRunning = false;

      function buildApplyFilterObject() {
        var f = readFilters();
        var p = new URLSearchParams();
        appendFilterParams(p, f);
        var o = {};
        p.forEach(function (v, k) {
          if (k === "limit" || k === "offset" || k === "sort_by" || k === "sort_dir") return;
          o[k] = v;
        });
        if (!o.archived) o.archived = f.archived;
        if (!o.stock_position) o.stock_position = f.stock_position;
        if (!o.no_longer_cooperation) o.no_longer_cooperation = f.no_longer_cooperation;
        return o;
      }

      function fmtMinStockVal(n) {
        if (n == null || n === "") return "∅";
        var x = Number(n);
        if (!Number.isFinite(x)) return String(n);
        if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x));
        return x.toFixed(2);
      }

      function msApplyCountsLabel(batch) {
        if (!batch) return "—";
        var st = String(batch.status || "");
        if (st === "running") {
          return "выполняется… обновлено " + fmtNum(batch.rows_updated || 0);
        }
        if (st === "failed") {
          return "ошибка — " + (batch.error_message || "?");
        }
        if (st === "reverted") {
          return "откачен " + formatDateTimeMsk(batch.reverted_at);
        }
        return (
          "обновлено " +
          fmtNum(batch.rows_updated || 0) +
          ", без изм. " +
          fmtNum(batch.rows_unchanged || 0) +
          ", пропуск " +
          fmtNum(batch.rows_skipped || 0)
        );
      }

      function msApplyStatusLabel(batch) {
        if (!batch) return "—";
        return "пакет #" + batch.id + " — " + msApplyCountsLabel(batch);
      }

      function msApplyWhoLabel(meta) {
        if (!meta) return "—";
        var name = String(meta.created_by_name || "").trim();
        if (name) return name;
        if (meta.created_by_user_id != null && meta.created_by_user_id !== "") {
          return "user#" + meta.created_by_user_id;
        }
        return "не записан";
      }

      function msApplyWhoHeaderHtml(meta) {
        var who = escapeHtml(msApplyWhoLabel(meta));
        var html = '<span class="text-nowrap"><span class="fw-semibold">Кто:</span> ' + who + "</span>";
        if (meta && String(meta.status) === "reverted") {
          var rev = String(meta.reverted_by_name || "").trim();
          if (rev) {
            html +=
              ' <span class="text-muted text-nowrap">· откатил: <span class="fw-semibold">' +
              escapeHtml(rev) +
              "</span></span>";
          }
        }
        return html;
      }

      function renderMsApplyItemRows(items, batchMeta) {
        var meta = batchMeta && typeof batchMeta === "object" ? batchMeta : {};
        var whoCell = escapeHtml(msApplyWhoLabel(meta));
        var fieldLabel =
          String(meta.status || "") === "reverted" ? "откачен" : "неснижаемый МС";
        if (!Array.isArray(items) || !items.length) {
          return (
            '<tr><td colspan="5" class="text-muted py-2 text-center">В пакете нет изменённых позиций.</td></tr>'
          );
        }
        var out = "";
        for (var i = 0; i < items.length; i++) {
          var it = items[i] || {};
          var oldV =
            it.old_min_stock == null
              ? '<span class="text-muted">∅</span>'
              : '<span class="dg-pu-ms-apply-old">' + escapeHtml(fmtMinStockVal(it.old_min_stock)) + "</span>";
          var newV =
            it.new_min_stock == null
              ? '<span class="text-muted">∅</span>'
              : '<span class="dg-pu-ms-apply-new">' + escapeHtml(fmtMinStockVal(it.new_min_stock)) + "</span>";
          var pr =
            it.formula_proposed != null
              ? '<div style="font-size:0.7rem" class="text-muted">пр. ' +
                escapeHtml(fmtMinStockVal(it.formula_proposed)) +
                "</div>"
              : "";
          var nameCell = it.name
            ? '<div class="text-truncate" style="max-width:220px" title="' + escapeHtml(it.name) + '">' + escapeHtml(it.name) + "</div>"
            : '<span class="text-muted">—</span>';
          out +=
            "<tr>" +
            '<td class="text-nowrap"><code>' + escapeHtml(it.code || "") + "</code></td>" +
            "<td>" + nameCell + "</td>" +
            '<td class="text-end text-nowrap">' + oldV +
            '<span class="dg-pu-ms-apply-arrow">→</span>' + newV + pr + "</td>" +
            "<td>" + whoCell + "</td>" +
            '<td class="text-muted text-nowrap">' + escapeHtml(fieldLabel) + "</td></tr>";
        }
        return out;
      }

      function loadMsApplyBatchItems(batchId, bodyEl) {
        if (!bodyEl) return Promise.resolve();
        var bid = Number(batchId);
        if (!Number.isFinite(bid) || bid <= 0) return Promise.resolve();
        if (msApplyItemsCache[bid] && msApplyItemsCache[bid].loaded) {
          bodyEl.innerHTML = msApplyItemsCache[bid].html;
          return Promise.resolve();
        }
        bodyEl.innerHTML = '<div class="text-muted small py-2 px-2">Загрузка позиций пакета…</div>';
        return fetch("/api/purchase/min-stock-apply/batch/" + bid + "/items?limit=500", {
          credentials: "same-origin",
          headers: purchaseAuthHeaders(false),
        })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            if (!x.ok || !x.j || x.j.success === false) {
              bodyEl.innerHTML = '<div class="text-danger small py-2 px-2">' + escapeHtml((x.j && x.j.error) || "Ошибка загрузки") + "</div>";
              return;
            }
            var meta = (msApplyItemsCache[bid] && msApplyItemsCache[bid].whoMeta) || {};
            if (x.j.batch) meta = x.j.batch;
            var rows = renderMsApplyItemRows(x.j.items || [], meta);
            var more = Number(x.j.total || 0) > (x.j.items ? x.j.items.length : 0)
              ? '<div class="text-muted small px-2 py-1">Показано ' + fmtNum(x.j.items.length) + " из " + fmtNum(x.j.total) + ".</div>"
              : "";
            var html = '<div class="table-responsive"><table class="table table-sm dg-pu-ms-apply-items-table mb-0">' +
              '<thead><tr><th>Код</th><th>Наименование</th><th class="text-end">Было → стало</th><th>Кто</th><th>Поле</th></tr></thead><tbody>' +
              rows + "</tbody></table></div>" + more;
            msApplyItemsCache[bid] = {
              loaded: true,
              html: html,
              whoMeta: meta,
              status: String(meta.status || ""),
            };
            bodyEl.innerHTML = html;
          })
          .catch(function (e) {
            bodyEl.innerHTML = '<div class="text-danger small py-2 px-2">Сеть: ' + escapeHtml((e && e.message) || String(e)) + "</div>";
          });
      }

      function toggleMsApplyBatch(batchId) {
        var bid = Number(batchId);
        if (!Number.isFinite(bid) || bid <= 0) return;
        msApplyExpandedBatchId = msApplyExpandedBatchId === bid ? null : bid;
        var wrap = document.getElementById("dg-pu-ms-apply-batches");
        if (!wrap) return;
        wrap.querySelectorAll(".dg-pu-ms-apply-batch").forEach(function (block) {
          var id = Number(block.getAttribute("data-batch-id"));
          var open = id === msApplyExpandedBatchId;
          var body = block.querySelector(".dg-pu-ms-apply-batch-body");
          var btn = block.querySelector(".dg-pu-ms-apply-expand");
          if (body) body.classList.toggle("d-none", !open);
          if (btn) btn.textContent = open ? "▾" : "▸";
          if (open && body) loadMsApplyBatchItems(id, body);
        });
      }

      function bindMsApplyBatchUi(root) {
        if (!root) return;
        root.querySelectorAll(".dg-pu-ms-apply-expand").forEach(function (btn) {
          btn.addEventListener("click", function () { toggleMsApplyBatch(btn.getAttribute("data-batch-id")); });
        });
        root.querySelectorAll(".dg-pu-ms-apply-revert").forEach(function (btn) {
          btn.addEventListener("click", function (e) {
            e.stopPropagation();
            var bid = Number(btn.getAttribute("data-batch-id"));
            if (!Number.isFinite(bid) || bid <= 0) return;
            if (!window.confirm("Откатить пакет #" + bid + "? Неснижаемый остаток (МС) вернётся к значениям до переноса.")) return;
            revertMsApplyBatch(bid, btn);
          });
        });
      }

      function renderMsApplyLog(batches) {
        var logEl = document.getElementById("dg-pu-ms-apply-batches");
        if (!logEl) return;
        if (!Array.isArray(batches) || !batches.length) {
          logEl.innerHTML = '<span class="text-muted">Пакетов переноса пока нет.</span>';
          msApplyExpandedBatchId = null;
          return;
        }
        if (
          msApplyExpandedBatchId != null &&
          !batches.some(function (b) {
            return Number(b.id) === Number(msApplyExpandedBatchId);
          })
        ) {
          msApplyExpandedBatchId = null;
        }
        var html = "";
        for (var i = 0; i < batches.length; i++) {
          var b = batches[i] || {};
          var bid = Number(b.id);
          msApplyItemsCache[bid] = msApplyItemsCache[bid] || {};
          msApplyItemsCache[bid].status = String(b.status || "");
          msApplyItemsCache[bid].whoMeta = {
            created_by_name: b.created_by_name,
            created_by_user_id: b.created_by_user_id,
            reverted_by_name: b.reverted_by_name,
            status: b.status,
          };
          if (String(b.status) === "reverted" || String(b.status) === "running") msApplyItemsCache[bid].loaded = false;
          var open = Number(msApplyExpandedBatchId) === bid;
          var st = String(b.status || "");
          var statusBadge = st === "running" ? '<span class="badge bg-warning text-dark">в работе</span>'

      var msApplyRunBlocked = false;

      function syncMsApplyRunButton(batches, meta) {
        var btn = document.getElementById("dg-pu-apply-formula-min-stock");

          (meta && meta.has_running_batch) ||

          });

      function loadMsApplyLog() {
        return fetch("/api/purchase/min-stock-apply/log?limit=12", {
          credentials: "same-origin",
          headers: purchaseAuthHeaders(false),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { ok: r.ok, j: j };
            });
          })
          .then(function (x) {
            if (!x.ok || !x.j || x.j.success === false) {
              var logEl = document.getElementById("dg-pu-ms-apply-batches");
              if (logEl) {
                logEl.textContent =
                  "Ошибка журнала: " + ((x.j && x.j.error) || "неизвестно");
              }
              return;
            }
            var batches = Array.isArray(x.j.batches) ? x.j.batches : [];
            renderMsApplyLog(batches);
            syncMsApplyRunButton(batches, x.j);
            var active = null;
            if (msApplyActiveBatchId != null) {
              for (var bi = 0; bi < batches.length; bi++) {
                if (Number(batches[bi].id) === Number(msApplyActiveBatchId)) {
                  active = batches[bi];
                  break;
                }
              }
            }
            if (!active && batches.length) active = batches[0];
            if (active) setMsApplyStatusFromBatch(active);
            else setMsApplyStatusFromBatch(null);
            var stillRunning = batches.some(function (b) {
              return String(b.status) === "running";
            });
            if (stillRunning && !msApplyPollTimer) {
              msApplyPollTimer = window.setInterval(function () {
                loadMsApplyLog();
              }, 2500);
            } else if (!stillRunning && msApplyPollTimer) {
              window.clearInterval(msApplyPollTimer);
              msApplyPollTimer = null;
              msApplyActiveBatchId = null;
            }
          })
          .catch(function () {
            var logEl = document.getElementById("dg-pu-ms-apply-batches");
            if (logEl) logEl.textContent = "Сетевая ошибка загрузки журнала переноса.";
          });
      }

      function pollMsApplyBatch(batchId) {
        msApplyActiveBatchId = batchId;
        if (msApplyPollTimer) {
          window.clearInterval(msApplyPollTimer);
          msApplyPollTimer = null;
        }
        function tick() {
          return fetch("/api/purchase/min-stock-apply/batch/" + batchId, {
            credentials: "same-origin",
            headers: purchaseAuthHeaders(false),
          })
            .then(function (r) {
              return r.json().then(function (j) {
                return { ok: r.ok, j: j };
              });
            })
            .then(function (x) {
              if (!x.ok || !x.j || !x.j.batch) return;
              setMsApplyStatusFromBatch(x.j.batch);
              if (String(x.j.batch.status) !== "running") {
                msApplyActiveBatchId = null;
                loadData();
                return loadMsApplyLog();
              }
            });
        }
        tick();
        msApplyPollTimer = window.setInterval(tick, 2500);
      }
