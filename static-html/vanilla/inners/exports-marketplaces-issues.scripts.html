    <script>
        (function () {
            'use strict';

            // ---- шапка таблицы: --dg-table-sticky-top (прочие стили) + как /my-products.html —
            // transform на #dg-mpu-thead при вертикальном скролле; горизонтальный скролл —
            // #dg-mpu-table-scroll-outer. Таблица вне markBaselineTables (datagon-table-behavior-lock).
            function syncStickyTopVar() {
                try {
                    var app = document.querySelector('.app-container');
                    var header = document.querySelector('.app-header');
                    var fixed = Boolean(app && app.classList && app.classList.contains('fixed-header'));
                    var top = 0;
                    if (fixed && header && header.getBoundingClientRect) {
                        var r = header.getBoundingClientRect();
                        top = r && r.height ? Math.round(r.height) : 60;
                    }
                    document.documentElement.style.setProperty('--dg-table-sticky-top', top + 'px');
                } catch (_) {}
            }
            function bindStickyTopVar() {
                syncStickyTopVar();
                window.addEventListener('resize', syncStickyTopVar, { passive: true });
                if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {
                    document.fonts.ready.then(syncStickyTopVar).catch(function () {});
                }
                window.addEventListener('load', syncStickyTopVar, { passive: true });
                try {
                    var header = document.querySelector('.app-header');
                    if (header && typeof ResizeObserver !== 'undefined') {
                        new ResizeObserver(function () {
                            syncStickyTopVar();
                        }).observe(header);
                    }
                } catch (_) {}
            }
            bindStickyTopVar();

            var MPU_FLOATING_HEADER_OFFSET_PX = 2;
            var MPU_FLOATING_HEADER_START_EPS_PX = 3;
            var mpuFloatingHeaderRaf = 0;
            var mpuFloatingLastScrollTs = 0;

            function getMpuStickyTopPx() {
                var app = document.querySelector('.app-container');
                var header = document.querySelector('.app-header');
                var fixed = Boolean(app && app.classList && app.classList.contains('fixed-header'));
                if (!fixed) return 0;
                if (!header || !header.getBoundingClientRect) return 60;
                var rect = header.getBoundingClientRect();
                var h = rect && rect.height ? rect.height : 60;
                return h > 0 ? h : 60;
            }

            function captureMpuTheadBaseTop() {
                var thead = document.getElementById('dg-mpu-thead');
                if (!thead) return;
                thead.style.transform = '';
                thead.style.position = '';
                thead.style.zIndex = '';
                thead.style.willChange = '';
                thead.removeAttribute('data-dg-floating');
                var rect = thead.getBoundingClientRect();
                var absTop = (window.scrollY || window.pageYOffset || 0) + (rect && rect.top ? rect.top : 0);
                thead.setAttribute('data-dg-base-top', String(absTop));
            }

            function updateMpuFloatingHeaderFallback() {
                var thead = document.getElementById('dg-mpu-thead');
                if (!thead) return;
                var table = thead.closest('table');
                if (!table || !table.getBoundingClientRect) return;
                var row = thead.querySelector('tr');
                if (!row) return;

                var y = window.scrollY || window.pageYOffset || 0;
                var headerTop = getMpuStickyTopPx();

                var baseTopAbs = Number(thead.getAttribute('data-dg-base-top') || 0);
                if (!Number.isFinite(baseTopAbs) || baseTopAbs <= 0) return;
                var tableRect = table.getBoundingClientRect();
                var tableBottom = tableRect.bottom + y;
                var rowRect = row.getBoundingClientRect();
                var rowHeight = rowRect && rowRect.height ? rowRect.height : 0;

                var headerLine = y + headerTop;
                var start = baseTopAbs + MPU_FLOATING_HEADER_START_EPS_PX;
                var end = tableBottom - rowHeight;
                if (headerLine <= start || headerLine >= end) {
                    if (thead.style.transform) {
                        thead.style.transform = '';
                        thead.style.position = '';
                        thead.style.zIndex = '';
                        thead.style.willChange = '';
                        thead.removeAttribute('data-dg-floating');
                    }
                    return;
                }

                var zoomAwareOffset = MPU_FLOATING_HEADER_OFFSET_PX;
                var dpr = window.devicePixelRatio || 1;
                if (Math.abs(dpr - 1) < 0.03) zoomAwareOffset = MPU_FLOATING_HEADER_OFFSET_PX - 3;
                var shift = Math.max(0, headerLine - start - zoomAwareOffset);
                var shiftPx = Number(shift.toFixed(3));
                var nextTransform = 'translate3d(0,' + shiftPx + 'px,0)';
                if (thead.style.transform !== nextTransform) {
                    thead.style.transform = nextTransform;
                    thead.style.position = 'relative';
                    thead.style.zIndex = '40';
                    thead.style.willChange = 'transform';
                    thead.setAttribute('data-dg-floating', '1');
                }
            }

            function mpuFloatingHeaderTick(ts) {
                mpuFloatingHeaderRaf = 0;
                updateMpuFloatingHeaderFallback();
                if (ts - mpuFloatingLastScrollTs < 140) {
                    mpuFloatingHeaderRaf = requestAnimationFrame(mpuFloatingHeaderTick);
                }
            }

            function scheduleMpuFloatingHeaderUpdate() {
                mpuFloatingLastScrollTs =
                    typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now();
                if (mpuFloatingHeaderRaf) return;
                mpuFloatingHeaderRaf = requestAnimationFrame(mpuFloatingHeaderTick);
            }

            function onScrollMpuFloatingHeader() {
                scheduleMpuFloatingHeaderUpdate();
            }

            function mpuRefreshFloatingAfterLayout() {
                requestAnimationFrame(function () {
                    captureMpuTheadBaseTop();
                    scheduleMpuFloatingHeaderUpdate();
                });
            }

            function mpuSyncLayoutAndFloating() {
                if (typeof syncStickyTopVar === 'function') syncStickyTopVar();
                mpuRefreshFloatingAfterLayout();
            }

            (function bindMpuIssuesFloatingScroll() {
                window.addEventListener('scroll', onScrollMpuFloatingHeader, { passive: true });
                window.addEventListener('resize', function () {
                    mpuSyncLayoutAndFloating();
                }, { passive: true });
                var mainOuter = document.querySelector('.app-main__outer');
                if (mainOuter && mainOuter.addEventListener) {
                    mainOuter.addEventListener('scroll', onScrollMpuFloatingHeader, { passive: true });
                }
                var horiz = document.getElementById('dg-mpu-table-scroll-outer');
                if (horiz && horiz.addEventListener) {
                    horiz.addEventListener('scroll', onScrollMpuFloatingHeader, { passive: true });
                }
                if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {
                    document.fonts.ready.then(function () {
                        mpuRefreshFloatingAfterLayout();
                    }).catch(function () {});
                }
                window.addEventListener('load', function () {
                    mpuRefreshFloatingAfterLayout();
                }, { passive: true });
            })();

            /** Как на /moysklad.html: ссылка на карточку в веб-интерфейсе МС и kind для /api/ms/detail */
            function msOpenInWebHref(uuid, typeMs) {
                var u = String(uuid || '').trim();
                if (!u) return '';
                var t = String(typeMs || '').toLowerCase();
                if (t.indexOf('комплект') >= 0) {
                    return 'https://online.moysklad.ru/app/#bundle/edit?id=' + encodeURIComponent(u);
                }
                return 'https://online.moysklad.ru/app/#good/edit?id=' + encodeURIComponent(u);
            }
            function msKindQueryParam(typeMs) {
                var t = String(typeMs || '').toLowerCase();
                if (t.indexOf('комплект') >= 0) return 'bundle';
                return 'product';
            }
            function closeMsDetailModal() {
                var ov = document.getElementById('dg-ms-detail-overlay');
                if (!ov) return;
                ov.style.display = 'none';
                ov.setAttribute('aria-hidden', 'true');
            }
            function trimLinkHref(raw) {
                return String(raw || '').replace(/[)\].,;:!?]+$/g, '');
            }
            function isDangerousAutoLinkHref(href) {
                var low = String(href || '').trim().toLowerCase();
                return (
                    low.indexOf('javascript:') === 0 ||
                    low.indexOf('data:') === 0 ||
                    low.indexOf('vbscript:') === 0
                );
            }
            function appendTextWithAutoLinks(el, raw) {
                var s = String(raw == null ? '' : raw);
                el.textContent = '';
                if (!s) return;
                var re =
                    /(https?:\/\/[^\s<>"'`]+)|(www\.[^\s<>"'`]+)|([a-z][a-z0-9+.-]*:\/\/[^\s<>"'`]+)|(mailto:[^\s<>"'`]+)|(tel:\+?[^\s<>"'`]+)/gi;
                var last = 0;
                var m;
                while ((m = re.exec(s)) !== null) {
                    if (m.index > last) {
                        el.appendChild(document.createTextNode(s.slice(last, m.index)));
                    }
                    var full = m[0];
                    var href = trimLinkHref(full);
                    var display = href;
                    if (!href) {
                        last = m.index + full.length;
                        continue;
                    }
                    if (/^www\./i.test(href)) {
                        href = 'https://' + href;
                    }
                    if (href.length < 4 || isDangerousAutoLinkHref(href)) {
                        el.appendChild(document.createTextNode(full));
                        last = m.index + full.length;
                        continue;
                    }
                    var a = document.createElement('a');
                    a.href = href;
                    a.className = 'text-break';
                    a.textContent = display;
                    var low = href.toLowerCase();
                    if (
                        low.indexOf('http:') === 0 ||
                        low.indexOf('https:') === 0 ||
                        low.indexOf('ftp:') === 0
                    ) {
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                    }
                    el.appendChild(a);
                    last = m.index + full.length;
                }
                if (last < s.length) {
                    el.appendChild(document.createTextNode(s.slice(last)));
                }
            }
            function renderMsDetailBlocks(blocks) {
                var body = document.getElementById('dg-ms-detail-body');
                if (!body) return;
                body.innerHTML = '';
                if (!blocks || !blocks.length) {
                    body.textContent = 'Нет данных.';
                    return;
                }
                blocks.forEach(function (blk) {
                    if (blk.title) {
                        var h = document.createElement('div');
                        h.className = 'fw-semibold mb-2 mt-2';
                        h.style.fontSize = '0.9rem';
                        h.textContent = blk.title;
                        body.appendChild(h);
                    }
                    var tbl = document.createElement('table');
                    tbl.className = 'dg-ms-detail-kv mb-3';
                    (blk.rows || []).forEach(function (row) {
                        var tr = document.createElement('tr');
                        var th = document.createElement('th');
                        th.textContent = row.label || '';
                        var td = document.createElement('td');
                        td.style.whiteSpace = 'pre-wrap';
                        td.style.wordBreak = 'break-word';
                        appendTextWithAutoLinks(td, row.value == null ? '' : String(row.value));
                        tr.appendChild(th);
                        tr.appendChild(td);
                        tbl.appendChild(tr);
                    });
                    body.appendChild(tbl);
                });
            }
            function openMsDetailModal(uuid, code, nameText, typeMs) {
                var u = String(uuid || '').trim();
                var ov = document.getElementById('dg-ms-detail-overlay');
                var titleEl = document.getElementById('dg-ms-detail-title');
                var body = document.getElementById('dg-ms-detail-body');
                var openMs = document.getElementById('dg-ms-detail-open-ms');
                if (!ov || !titleEl || !body) return;
                if (!u) return;
                titleEl.textContent = nameText || 'Товар МойСклад';
                body.innerHTML = '<p class="text-muted mb-0">Загрузка…</p>';
                if (openMs) {
                    openMs.classList.add('d-none');
                    openMs.href = '#';
                }
                ov.style.display = 'flex';
                ov.setAttribute('aria-hidden', 'false');
                var q = '/api/ms/detail/' + encodeURIComponent(u) + '?kind=' + encodeURIComponent(msKindQueryParam(typeMs));
                fetch(q, { credentials: 'same-origin' })
                    .then(function (r) {
                        return r.json().then(function (j) {
                            return { ok: r.ok, st: r.status, j: j };
                        });
                    })
                    .then(function (x) {
                        if (!x.ok) {
                            body.innerHTML =
                                '<p class="text-danger mb-0">' +
                                String(x.j && x.j.error ? x.j.error : 'Ошибка ' + x.st) +
                                '</p>';
                            return;
                        }
                        var j = x.j || {};
                        if (openMs) {
                            var hrefMs = j.webHref || msOpenInWebHref(u, typeMs);
                            if (hrefMs) {
                                openMs.href = hrefMs;
                                openMs.classList.remove('d-none');
                            }
                        }
                        renderMsDetailBlocks(j.blocks);
                    })
                    .catch(function () {
                        body.innerHTML = '<p class="text-danger mb-0">Сеть недоступна</p>';
                    });
            }
            function initMsDetailModal() {
                var ov = document.getElementById('dg-ms-detail-overlay');
                var closeBtn = document.getElementById('dg-ms-detail-close');
                var panel = ov ? ov.querySelector('.dg-ms-detail-panel') : null;
                if (closeBtn) closeBtn.addEventListener('click', closeMsDetailModal);
                if (ov) {
                    ov.addEventListener('click', function (e) {
                        if (e.target === ov) closeMsDetailModal();
                    });
                }
                if (panel) {
                    panel.addEventListener('click', function (e) {
                        e.stopPropagation();
                    });
                }
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') closeMsDetailModal();
                });
            }
            initMsDetailModal();

                if (!state.filters || !state.filters.smart_columns) return false;
                return Object.prototype.hasOwnProperty.call(SMART_COLS_BY_SCOPE, String(state.scope || ''));
            }
            function visibleHeaders() {
                if (isSmartColumnsActive()) {
                    var allowed = SMART_COLS_BASE_MS.concat(SMART_COLS_BY_SCOPE[state.scope] || []);
                    var allowedSet = {};
                    for (var i = 0; i < allowed.length; i++) allowedSet[allowed[i]] = true;
                    return state.headers.filter(function (k) { return !!allowedSet[k]; });
                }
                return state.headers.filter(isColVisible);
            }

            // ---- <colgroup> с дефолтными/сохранёнными ширинами + drag-resize ----
            function widthForKey(k) {
                var w = state.colWidths[k];
                if (Number.isFinite(w) && w >= COL_MIN_WIDTH && w <= COL_MAX_WIDTH) return w;
                return defaultWidthForKey(k);
            }
            /** Ширина колонки — только `<col>` (как exports-marketplaces-shop.scripts.html).
             * Не задаём width/minWidth/maxWidth на tbody td: сумма min-width по всем колонкам
             * давала таблице intrinsic min шире viewport и ломала вписывание в 100% карточки.
             * thead th не трогаем — иначе в связке position:sticky + overflow на th часть движков
             * ломает порядок thead/tbody. */
            function syncColWidthToDom(k, w) {
                if (!elTable) return;
                var esc = cssEscape(k);
                var cg = elTable.querySelector(':scope > colgroup');
                if (cg) {
                    var col = cg.querySelector('col[data-col-key="' + esc + '"]');
                    if (col) col.style.width = w + 'px';
                }
            }
            function syncVisibleColumnWidthsToDom(headers) {
                if (!headers || !elTable) return;
                for (var i = 0; i < headers.length; i++) {
                    var kk = headers[i];
                    syncColWidthToDom(kk, widthForKey(kk));
                }
            }
            /** @param {boolean} [skipPersist] — при drag не пишем localStorage на каждый mousemove */
            function setWidthForKey(k, w, skipPersist) {
                w = Math.max(COL_MIN_WIDTH, Math.min(COL_MAX_WIDTH, Math.round(w)));
                state.colWidths[k] = w;
                if (!skipPersist) writeJsonToStorage(COLS_WIDTH_KEY, state.colWidths);
                syncColWidthToDom(k, w);
            }
            function cssEscape(s) {
                if (window.CSS && CSS.escape) return CSS.escape(String(s || ''));
                return String(s || '').replace(/[^a-zA-Z0-9_\-]/g, '\\$&');
            }
            function applyColgroup(headers) {
                var theadEl = elTable.querySelector('thead');
                if (!theadEl) return;
                var existing = elTable.querySelector(':scope > colgroup');
                if (existing) existing.remove();
                var cg = document.createElement('colgroup');
                for (var i = 0; i < headers.length; i++) {
                    var k = headers[i];
                    var col = document.createElement('col');
                    col.setAttribute('data-col-key', k);
                    col.style.width = widthForKey(k) + 'px';
                    cg.appendChild(col);
                }
                /* Всегда сразу перед <thead>, не перед firstChild (там бывает #text от разметки —
                   иначе в части движков ломается порядок thead/tbody и «шапка уезжает» под строку). */
                elTable.insertBefore(cg, theadEl);
            }
            function attachResizers(thead, headers) {
                var ths = thead.querySelectorAll('th[data-col-key]');
                ths.forEach(function (th) {
                    var k = th.getAttribute('data-col-key');
                    if (!k) return;
                    var grip = document.createElement('span');
                    grip.className = 'dg-mpu-resizer';
                    grip.setAttribute('data-col-key', k);
                    grip.setAttribute('aria-hidden', 'true');
                    grip.addEventListener('mousedown', startResize);
                    grip.addEventListener('touchstart', startResize, { passive: false });
                    grip.addEventListener('click', function (e) { e.stopPropagation(); });
                    th.appendChild(grip);
                });
            }
            function startResize(ev) {
                if (ev.cancelable) ev.preventDefault();
                ev.stopPropagation();
                var grip = ev.currentTarget;
                var k = grip.getAttribute('data-col-key');
                if (!k) return;
                var startX = (ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX);
                var startW = widthForKey(k);
                grip.classList.add('dg-mpu-resizing');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                function move(e) {
                    if (e.cancelable) e.preventDefault();
                    var x = (e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX);
                    var dx = x - startX;
                    setWidthForKey(k, startW + dx, true);
                }
                function up() {
                    grip.classList.remove('dg-mpu-resizing');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    try {
                        writeJsonToStorage(COLS_WIDTH_KEY, state.colWidths);
                    } catch (_) {}
                    window.removeEventListener('mousemove', move);
                    window.removeEventListener('mouseup', up);
                    window.removeEventListener('touchmove', move);
                    window.removeEventListener('touchend', up);
                    mpuRefreshFloatingAfterLayout();
                }
                window.addEventListener('mousemove', move);
                window.addEventListener('mouseup', up);
                window.addEventListener('touchmove', move, { passive: false });
                window.addEventListener('touchend', up);
            }

            // ---- Toolbox: панель видимости столбцов ----
            function rebuildColsPanel() {
                if (!elColsGrid) return;
                var smartActive = isSmartColumnsActive();
                if (elColsSmartNote) {
                    elColsSmartNote.classList.toggle('d-none', !smartActive);
                }
                elColsGrid.innerHTML = '';
                for (var i = 0; i < state.headers.length; i++) {
                    var k = state.headers[i];
                    var label = state.headerLabels[i] || k;
                    var lab = document.createElement('label');
                    var cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.checked = isColVisible(k);
                    cb.disabled = smartActive;
                    cb.setAttribute('data-col-key', k);
                    cb.addEventListener('change', function () {
                        setColVisible(this.getAttribute('data-col-key'), this.checked);
                        renderTable();
                    });
                    lab.appendChild(cb);
                    lab.appendChild(document.createTextNode(' ' + label));
                    if (smartActive) lab.classList.add('text-muted');
                    elColsGrid.appendChild(lab);
                }
            }
            // Универсальный toggle для одной из dropdown-панелей тулбокса (cols/widths).
            // При открытии одной — другая принудительно закрывается, чтобы не перекрывались.
            function togglePanel(panel, otherPanel, open) {
                if (!panel) return;
                if (open == null) panel.classList.toggle('open');
                else panel.classList.toggle('open', !!open);
                if (panel.classList.contains('open') && otherPanel) {
                    otherPanel.classList.remove('open');
                }
            }
            function closeAllToolboxPanels() {
                if (elColsPanel) elColsPanel.classList.remove('open');
                if (elWidthsPanel) elWidthsPanel.classList.remove('open');
            }
            if (elColsToggle && elColsPanel) {
                elColsToggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    togglePanel(elColsPanel, elWidthsPanel);
                });
            }
            if (elWidthsToggle && elWidthsPanel) {
                elWidthsToggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    togglePanel(elWidthsPanel, elColsPanel);
                    if (elWidthsPanel.classList.contains('open')) rebuildWidthsPanel();
                });
            }
            document.addEventListener('click', function (e) {
                var anyOpen = (elColsPanel && elColsPanel.classList.contains('open')) ||
                              (elWidthsPanel && elWidthsPanel.classList.contains('open'));
                if (!anyOpen) return;
                if (e.target === elColsToggle || (elColsPanel && elColsPanel.contains(e.target))) return;
                if (e.target === elWidthsToggle || (elWidthsPanel && elWidthsPanel.contains(e.target))) return;
                closeAllToolboxPanels();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeAllToolboxPanels();
            });
            if (elColsReset) {
                elColsReset.addEventListener('click', function (e) {
                    e.preventDefault();
                    state.visible = {};
                    writeJsonToStorage(COLS_VISIBLE_KEY, {});
                    rebuildColsPanel();
                    renderTable();
                });
            }

            // ---- Toolbox: панель числовой ширины колонок (px) ----
            // Перерисовываем по запросу при открытии панели или после изменения headers.
            function rebuildWidthsPanel() {
                if (!elWidthsGrid) return;
                elWidthsGrid.innerHTML = '';
                if (!state.headers.length) {
                    elWidthsGrid.innerHTML = '<div class="text-muted small">Нет колонок</div>';
                    return;
                }
                for (var i = 0; i < state.headers.length; i++) {
                    var k = state.headers[i];
                    var label = state.headerLabels[i] || k;
                    var ctl = document.createElement('label');
                    ctl.className = 'dg-mp-width-control';
                    var span = document.createElement('span');
                    span.textContent = label;
                    var inp = document.createElement('input');
                    inp.type = 'number';
                    inp.className = 'form-control form-control-sm';
                    inp.min = String(COL_MIN_WIDTH);
                    inp.max = String(COL_MAX_WIDTH);
                    inp.step = '10';
                    inp.value = String(widthForKey(k));
                    inp.setAttribute('data-col-key', k);
                    inp.addEventListener('change', function () {
                        var key = this.getAttribute('data-col-key');
                        var n = parseInt(this.value, 10);
                        if (!Number.isFinite(n)) { this.value = String(widthForKey(key)); return; }
                        setWidthForKey(key, n);
                        this.value = String(widthForKey(key));
                    });
                    ctl.appendChild(span);
                    ctl.appendChild(inp);
                    elWidthsGrid.appendChild(ctl);
                }
            }
            if (elWidthsReset) {
                elWidthsReset.addEventListener('click', function (e) {
                    e.preventDefault();
                    state.colWidths = {};
                    writeJsonToStorage(COLS_WIDTH_KEY, {});
                    rebuildWidthsPanel();
                    renderTable();
                });
            }

            // ---- Render ----
            function renderTable() {
                if (!elTable) return;
                var thead = elTable.querySelector('thead');
                var tbody = elTable.querySelector('tbody');
                if (!thead || !tbody) return;

                var rows = state.rows;
                var headers = visibleHeaders();
                var allHeaders = state.headers;
                var labels = state.headerLabels;
                var total = rows.length;
                var pageSize = Math.max(1, state.pageSize | 0);
                var pageCount = Math.max(1, Math.ceil(total / pageSize));
                if (state.page > pageCount) state.page = pageCount;
                if (state.page < 1) state.page = 1;
                var startIdx = (state.page - 1) * pageSize;
                var endIdx = Math.min(total, startIdx + pageSize);
                var slice = rows.slice(startIdx, endIdx);

                if (!total) {
                    var existingCg = elTable.querySelector(':scope > colgroup');
                    if (existingCg) existingCg.remove();
                    thead.innerHTML = '<tr><th class="text-muted">' +
                        escapeHtml('Нет данных по фильтру «' + (SCOPE_LABELS[state.scope] || state.scope) + '».') +
                        '</th></tr>';
                    tbody.innerHTML = '<tr><td class="text-muted py-3">Список пуст. Возможные причины: фильтр МС (складская позиция = Да, перестали сотрудничать = Нет) никого не нашёл, либо снапшоты маркетплейсов содержат все коды МС. Обновите снапшоты на вкладках Ozon / Wildberries / Я.Маркет.</td></tr>';
                    if (elPageHint) elPageHint.textContent = 'Найдено: 0; страница 0/0; показано: 0';
                    if (elPagePrev) elPagePrev.disabled = true;
                    if (elPageNext) elPageNext.disabled = true;
                    mpuRefreshFloatingAfterLayout();
                    return;
                }

                applyColgroup(headers);

                // ---- thead с сортировкой ----
                var theadHtml = '<tr>';
                for (var i = 0; i < headers.length; i++) {
                    var k = headers[i];
                    var labelIdx = allHeaders.indexOf(k);
                    var label = (labelIdx >= 0 && labels[labelIdx]) ? labels[labelIdx] : k;
                    var arrow = '';
                    if (state.sortKey === k) arrow = state.sortDir === 'desc' ? ' ▼' : ' ▲';
                    theadHtml +=
                        '<th scope="col" class="dg-mp-sortable" data-col-key="' + escapeHtml(k) + '" ' +
                        'role="button" tabindex="0" aria-sort="' +
                        (state.sortKey === k ? (state.sortDir === 'desc' ? 'descending' : 'ascending') : 'none') +
                        '" title="Сортировать по «' + escapeHtml(label) + '» (потяните за правый край колонки, чтобы изменить ширину)">' +
                        escapeHtml(label) +
                        '<span class="dg-mp-sort-arrow">' + arrow + '</span>' +
                        '</th>';
                }
                theadHtml += '</tr>';
                thead.innerHTML = theadHtml;
                var ths = thead.querySelectorAll('th[data-col-key]');
                ths.forEach(function (th) {
                    th.addEventListener('click', function (ev) {
                        if (ev.target && ev.target.classList && ev.target.classList.contains('dg-mpu-resizer')) return;
                        var sel = (window.getSelection && window.getSelection().toString() || '').trim();
                        if (sel.length) return;
                        var k = th.getAttribute('data-col-key');
                        if (k) setSort(k);
                    });
                    th.addEventListener('keydown', function (e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            var k = th.getAttribute('data-col-key');
                            if (k) setSort(k);
                        }
                    });
                });
                attachResizers(thead, headers);

                // ---- tbody: подсветки зависят от scope ----
                var scopeIsAll = String(state.scope || '') === 'all';
                var html = '';
                for (var r = 0; r < slice.length; r++) {
                    var row = slice[r];
                    // Пара (code+name) пустая = маркетплейс не нашёл товар.
                    var missingCols = {};
                    for (var p = 0; p < MISSING_PAIRS.length; p++) {
                        var pair = MISSING_PAIRS[p];
                        if (isEmptyVal(row[pair[0]]) && isEmptyVal(row[pair[1]])) {
                            missingCols[pair[0]] = true;
                            missingCols[pair[1]] = true;
                        }
                    }
                    var dimMismatchCols = scopeIsAll ? {} : dimsMismatchHighlightKeys(row);
                    html += '<tr>';
                    for (var c = 0; c < headers.length; c++) {
                        var key = headers[c];
                        var val = row && row[key] != null ? row[key] : '';
                        var tdClasses = [];
                        if (missingCols[key]) {
                            // «Все товары»: только колонки кода площадки (нет товара); name/vat/габариты — на других фильтрах.
                            if (!scopeIsAll || key === 'ozon_code' || key === 'wb_code' || key === 'ym_code') {
                                tdClasses.push('dg-mpu-missing');
                            }
                        }
                        if (!scopeIsAll) {
                            // НДС МС подсвечиваем мягким жёлтым (это справочное значение МС;
                            // фактическая ошибка — на стороне маркетплейса). Ячейки
                            // маркетплейсных НДС (ozon_vat / wb_vat / ym_vat) остаются
                            // красными, как у `dg-mpu-missing`.
                            if (key === 'ms_vat') {
                                if (isMsVatRowAnyMpMismatch(row)) {
                                    tdClasses.push('dg-mpu-vat-mismatch-ms');
                                }
                            } else if (isVatCellMismatchMpVsMs(row, key)) {
                                tdClasses.push('dg-mpu-vat-mismatch');
                            }
                            if (dimMismatchCols[key]) tdClasses.push('dg-mpu-dims-mismatch');
                        }
                        var cls = tdClasses.length ? ' class="' + tdClasses.join(' ') + '"' : '';
                        var cellInner;
                        if (key === 'name') {
                            var uuid = String(row.uuid || '').trim();
                            var typeMs = row.type || '';
                            var codeStr = row.code || '';
                            var valStr = val == null ? '' : String(val);
                            if (uuid) {
                                cellInner =
                                    '<button type="button" class="btn btn-link p-0 text-start text-decoration-none text-body dg-mpu-ms-name" ' +
                                    'style="white-space:normal;word-break:break-word;vertical-align:baseline;" ' +
                                    'title="Карточка и все свойства из МойСклад" ' +
                                    'data-ms-uuid="' + escapeHtml(uuid) + '" ' +
                                    'data-ms-code="' + escapeHtml(codeStr) + '" ' +
                                    'data-ms-type="' + escapeHtml(typeMs) + '">' +
                                    escapeHtml(valStr) +
                                    '</button>';
                            } else {
                                cellInner = escapeHtml(valStr);
                            }
                        } else if (key === 'ozon_cabinet_url' || key === 'wb_cabinet_url' || key === 'ym_cabinet_url' ||
                                   key === 'ozon_buyer_url' || key === 'wb_buyer_url' || key === 'ym_buyer_url') {
                            var rawUrl = val == null ? '' : String(val).trim();
                            if (rawUrl && /^https?:\/\//i.test(rawUrl)) {
                                cellInner =
                                    '<a href="' + escapeHtml(rawUrl) + '" target="_blank" rel="noopener noreferrer" class="text-primary" ' +
                                    'title="' + escapeHtml(rawUrl) + '">Открыть</a>';
                            } else {
                                cellInner = escapeHtml(rawUrl);
                            }
                        } else {
                            cellInner = escapeHtml(val == null ? '' : String(val));
                        }
                        var dimSlot = DIM_KEY_TO_SLOT[key];
                        var dimAttr = dimSlot ? ' data-dg-mpu-dim-slot="' + dimSlot + '"' : '';
                        html += '<td' + cls + ' data-col-key="' + escapeHtml(key) + '"' + dimAttr + '>' + cellInner + '</td>';
                    }
                    html += '</tr>';
                }
                tbody.innerHTML = html;
                syncVisibleColumnWidthsToDom(headers);
                if (!tbody._dgMpuMsNameBound) {
                    tbody._dgMpuMsNameBound = true;
                    tbody.addEventListener('click', function (e) {
                        var btn = e.target && e.target.closest ? e.target.closest('.dg-mpu-ms-name') : null;
                        if (!btn || !tbody.contains(btn)) return;
                        e.preventDefault();
                        e.stopPropagation();
                        openMsDetailModal(
                            btn.getAttribute('data-ms-uuid'),
                            btn.getAttribute('data-ms-code') || '',
                            String(btn.textContent || '').trim(),
                            btn.getAttribute('data-ms-type') || ''
                        );
                    });
                }
                // Hover-cross по слоту габарита: при наведении на ячейку
                // length/width/height/weight подсвечиваем все ячейки того же слота
                // в этой же строке (МС + 3 маркетплейса). Делегируем mouseover/mouseout
                // на tbody, чтобы при перерисовке innerHTML связь не разрывалась.
                if (!tbody._dgMpuDimHoverBound) {
                    tbody._dgMpuDimHoverBound = true;
                    var clearDimHover = function (tr) {
                        if (!tr) return;
                        var hot = tr.querySelectorAll('td.dg-mpu-dim-hover');
                        for (var i = 0; i < hot.length; i++) hot[i].classList.remove('dg-mpu-dim-hover');
                    };
                    tbody.addEventListener('mouseover', function (e) {
                        var td = e.target && e.target.closest ? e.target.closest('td[data-dg-mpu-dim-slot]') : null;
                        if (!td || !tbody.contains(td)) return;
                        var slot = td.getAttribute('data-dg-mpu-dim-slot');
                        var tr = td.parentElement;
                        if (!slot || !tr) return;
                        // Если уже подсвечен этот же слот — не дёргать DOM.
                        if (td.classList.contains('dg-mpu-dim-hover')) return;
                        clearDimHover(tr);
                        var cells = tr.querySelectorAll('td[data-dg-mpu-dim-slot="' + slot + '"]');
                        for (var i = 0; i < cells.length; i++) cells[i].classList.add('dg-mpu-dim-hover');
                    });
                    tbody.addEventListener('mouseout', function (e) {
                        var td = e.target && e.target.closest ? e.target.closest('td[data-dg-mpu-dim-slot]') : null;
                        if (!td || !tbody.contains(td)) return;
                        // Если курсор уходит на ячейку того же слота в той же строке —
                        // подсветка остаётся (mouseover её обновит/сохранит).
                        var related = e.relatedTarget;
                        var relatedTd = related && related.closest
                            ? related.closest('td[data-dg-mpu-dim-slot]')
                            : null;
                        if (relatedTd
                            && relatedTd.parentElement === td.parentElement
                            && relatedTd.getAttribute('data-dg-mpu-dim-slot') === td.getAttribute('data-dg-mpu-dim-slot')) {
                            return;
                        }
                        clearDimHover(td.parentElement);
                    });
                }

                if (elPageHint) {
                    var hasFilter = !!String(state.search || '').trim();
                    var base = 'Найдено: ' + total + '; страница ' + state.page + '/' + pageCount + '; показано: ' + slice.length;
                    if (hasFilter) base += ' (фильтр из ' + state.rowsAll.length + ')';
                    elPageHint.textContent = base;
                }
                if (elPagePrev) elPagePrev.disabled = state.listLoading || state.page <= 1;
                if (elPageNext) elPageNext.disabled = state.listLoading || state.page >= pageCount;
                requestAnimationFrame(function () {
                    mpuSyncLayoutAndFloating();
                });
            }

            function setTitleByScope() {
                if (!elTitle) return;
                elTitle.textContent = 'Таблица — ' + (SCOPE_LABELS[state.scope] || state.scope);
            }

            function load() {
                if (state.listLoading) return;
                state.listLoading = true;
                if (elFltApply) elFltApply.disabled = true;
                if (elFltReset) elFltReset.disabled = true;
                if (elPagePrev) elPagePrev.disabled = true;
                if (elPageNext) elPageNext.disabled = true;
                setMsg('Загрузка…', 'info');
                var url = API_URL + '?scope=' + encodeURIComponent(state.scope) +
                    '&exclude_bundle_components=' + (state.filters.exclude_bundle_components ? '1' : '0');
                fetch(url, { credentials: 'same-origin' })
                    .then(function (r) {
                        if (!r.ok) {
                            return r.json().catch(function () { return {}; }).then(function (j) {
                                throw new Error((j && (j.error || j.message)) || ('HTTP ' + r.status));
                            });
                        }
                        return r.json();
                    })
                    .then(function (data) {
                        state.rowsAll = Array.isArray(data && data.rows) ? data.rows : [];
                        state.headers = Array.isArray(data && data.headers) ? data.headers : [];
                        state.headerLabels = Array.isArray(data && data.headerLabels) ? data.headerLabels : state.headers;
                        if (!state.sortKey || state.headers.indexOf(state.sortKey) < 0) {
                            state.sortKey = state.headers.indexOf('code') >= 0 ? 'code' : (state.headers[0] || null);
                            state.sortDir = 'asc';
                        }
                        rebuildAdvancedFilters();
                        // После rebuildAdvancedFilters select.value мог быть скорректирован
                        // (значение могло пропасть из набора). Синхронизируем pending с
                        // фактически отображаемыми значениями, чтобы dirty-индикатор не врал.
                        if (elFltManager) state.pending.filters.manager = String(elFltManager.value || '');
                        if (elFltCmgr) state.pending.filters.content_manager = String(elFltCmgr.value || '');
                        applySearchFilter();
                        applySort();
                        state.page = 1;
                        setMsg('');
                        rebuildColsPanel();
                        if (elWidthsPanel && elWidthsPanel.classList.contains('open')) {
                            rebuildWidthsPanel();
                        }
                        refreshDirtyIndicator();
                        renderTable();
                    })
                    .catch(function (err) {
                        state.rowsAll = [];
                        state.rows = [];
                        state.headers = [];
                        state.headerLabels = [];
                        renderTable();
                        setMsg('Ошибка загрузки: ' + (err && err.message ? err.message : err), 'error');
                    })
                    .finally(function () {
                        state.listLoading = false;
                        if (elFltApply) elFltApply.disabled = false;

            // ---- Двухслойные фильтры: pending → applied только по «Применить» ----
            // См. .cursor/rules/datagon-table-filter-apply.mdc:
            //   • scope-радио, поиск, селекты Менеджер/КМ — пишут в state.pending.*;
            //   • commit() копирует в state.* и при необходимости перезапрашивает API;
            //   • Enter в поле поиска и одиночные действия (очистить поиск, сбросить
            //     фильтры) считаются «явным действием» и применяются сразу.
            function commitFilters() {
                var scopeChanged = state.pending.scope !== state.scope;
                var pendingExcludeBundle = !!(state.pending.filters && state.pending.filters.exclude_bundle_components);
                var bundleChanged = pendingExcludeBundle !== !!state.filters.exclude_bundle_components;
                var pendingStockPositive = !!(state.pending.filters && state.pending.filters.stock_positive);
                var pendingSmartCols = !!(state.pending.filters && state.pending.filters.smart_columns);
                state.scope = String(state.pending.scope || 'all');
                state.search = String(state.pending.search || '');
                state.filters.manager = String((state.pending.filters && state.pending.filters.manager) || '');
                state.filters.content_manager = String((state.pending.filters && state.pending.filters.content_manager) || '');
                state.filters.exclude_bundle_components = pendingExcludeBundle;
                state.filters.stock_positive = pendingStockPositive;
                state.filters.smart_columns = pendingSmartCols;
                writeStr(FILTER_MANAGER_KEY, state.filters.manager);
                writeStr(FILTER_CONTENT_MGR_KEY, state.filters.content_manager);
                writeStr(FILTER_EXCLUDE_BUNDLE_COMPONENTS_KEY, state.filters.exclude_bundle_components ? '1' : '0');
                writeStr(FILTER_STOCK_POSITIVE_KEY, state.filters.stock_positive ? '1' : '0');
                writeStr(FILTER_SMART_COLUMNS_KEY, state.filters.smart_columns ? '1' : '0');
                setTitleByScope();
                refreshDirtyIndicator();
                if (scopeChanged || bundleChanged) {
                    // exclude_bundle_components — серверный фильтр, при его смене
                    // нужно перезапросить /issues, иначе клиент не сможет «вернуть»
                    // ранее отрезанные строки (их нет в state.rowsAll).
                    load();
                } else {
                    applySearchFilter();
                    applySort();
                    state.page = 1;
                    // Smart-режим может изменить набор видимых колонок без перезапроса —
                    // обновляем панель `🧩 Столбцы` (disabled-чекбоксы / заметка) перед
                    // ререндером таблицы, чтобы UI был согласован.
                    rebuildColsPanel();
                    renderTable();
                }
            }

            function getSortedPairs(obj) {
                var pairs = [];
                if (obj && typeof obj === 'object') {
                    for (var k in obj) {
                        if (Object.prototype.hasOwnProperty.call(obj, k)) pairs.push([k, obj[k]]);
                    }
                }
                pairs.sort(function (a, b) {
                    var d = (Number(b[1]) || 0) - (Number(a[1]) || 0);
                    if (d !== 0) return d;
                    return String(a[0]).localeCompare(String(b[0]), 'ru');
                });
                return pairs;
            }

            function renderBucketBars(obj, total, maxN) {
                maxN = maxN || 7;
                var pairs = getSortedPairs(obj);
                if (!pairs.length) return '<span class="text-muted small">—</span>';
                var t = Math.max(1, Number(total) || 0);
                var html = '';
                for (var i = 0; i < pairs.length && i < maxN; i++) {
                    var label = pairs[i][0];
                    var n = Number(pairs[i][1] || 0);
                    var pct = Math.min(100, Math.round((n / t) * 1000) / 10);
                    if (n > 0 && pct < 5) pct = 5;
                    html +=
                        '<div class="dg-snap-bar-block">' +
                        '<div class="dg-snap-bar-label" title="' +
                        escapeHtml(label) +
                        '">' +
                        escapeHtml(label) +
                        '</div>' +
                        '<div class="dg-snap-bar-row">' +
                        '<div class="dg-snap-bar-track"><div class="dg-snap-bar-fill" style="width:' +
                        pct +
                        '%"></div></div>' +
                        '<span class="dg-snap-bar-num">' +
                        n +
                        '</span>' +
                        '</div></div>';
                }
                if (pairs.length > maxN) {
                    html += '<div class="small text-muted mt-1">… +' + (pairs.length - maxN) + '</div>';
                }
                return html;
            }

            function shortSnapHeaderCell(r) {
                var d = String(r.stat_date || '').trim() || '—';
                var rec = String(r.recorded_at || '');
                var timePart = '—';
                var m = rec.match(/,\s*(\d{1,2}:\d{2})/);
                if (m) timePart = m[1];
                return (
                    '<div class="lh-sm">' +
                    escapeHtml(d) +
                    '<br><span class="text-muted" style="font-size:0.65rem">' +
                    escapeHtml(timePart) +
                    '</span></div>'
                );
            }

            function renderSnapshotDynamics(rows, bucketProp) {
                var wrap = document.getElementById('dg-mp-issues-snapshot-dynamics-wrap');
                var inner = document.getElementById('dg-mp-issues-snapshot-dynamics');
                if (!wrap || !inner) return;
                if (!rows || rows.length < 2) {
                    wrap.classList.add('d-none');
                    inner.innerHTML = '';
                    return;
                }
                wrap.classList.remove('d-none');
                var maxCols = 12;
                var chron = rows.slice().reverse();
                if (chron.length > maxCols) chron = chron.slice(-maxCols);
                var keyScores = {};
                var ci;
                var cj;
                var ri;
                var k;
                for (ci = 0; ci < chron.length; ci++) {
                    var b = chron[ci][bucketProp];
                    if (!b || typeof b !== 'object') continue;
                    for (k in b) {
                        if (!Object.prototype.hasOwnProperty.call(b, k)) continue;
                        keyScores[k] = (keyScores[k] || 0) + Number(b[k] || 0);
                    }
                }
                var names = Object.keys(keyScores);
                names.sort(function (a, b) {
                    return (keyScores[b] - keyScores[a]) || String(a).localeCompare(String(b), 'ru');
                });
                names = names.slice(0, 14);
                if (!names.length) {
                    inner.innerHTML = '<p class="text-muted small mb-0">Нет данных по сотрудникам в выбранных снимках.</p>';
                    return;
                }
                var colMaxes = [];
                for (cj = 0; cj < chron.length; cj++) {
                    var mx = 0;
                    for (ri = 0; ri < names.length; ri++) {
                        var vv = Number((chron[cj][bucketProp] || {})[names[ri]] || 0);
                        if (vv > mx) mx = vv;
                    }
                    colMaxes.push(mx);
                }
                var headHtml = '<tr><th>Сотрудник</th>';
                for (var h = 0; h < chron.length; h++) {
                    headHtml += '<th>' + shortSnapHeaderCell(chron[h]) + '</th>';
                }
                headHtml += '</tr>';
                var bodyHtml = '';
                for (ri = 0; ri < names.length; ri++) {
                    var name = names[ri];
                    bodyHtml += '<tr><td title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</td>';
                    for (cj = 0; cj < chron.length; cj++) {
                        var v = Number((chron[cj][bucketProp] || {})[name] || 0);
                        var cl = 'dg-snap-cell' + (v === 0 ? ' dg-snap-cell-muted' : '');
                        var bg = '';
                        var cm = colMaxes[cj] || 0;
                        if (v > 0 && cm > 0) {
                            var alpha = 0.1 + (v / cm) * 0.58;
                            bg = ' style="background:rgba(220,53,69,' + alpha.toFixed(3) + ')"';
                        }
                        var deltaHtml = '';
                        if (cj > 0) {
                            var prevV = Number((chron[cj - 1][bucketProp] || {})[name] || 0);
                            var dlt = v - prevV;
                            if (dlt > 0) {
                                deltaHtml =
                                    '<div class="dg-snap-delta dg-snap-delta-up" title="к предыдущему снимку">▲ +' +
                                    dlt +
                                    '</div>';
                            } else if (dlt < 0) {
                                deltaHtml =
                                    '<div class="dg-snap-delta dg-snap-delta-down" title="к предыдущему снимку">▼ ' +
                                    Math.abs(dlt) +
                                    '</div>';
                            } else if (v !== 0 || prevV !== 0) {
                                deltaHtml =
                                    '<div class="dg-snap-delta dg-snap-delta-flat" title="к предыдущему снимку">0</div>';
                            }
                        }
                        var valBlock =
                            '<div class="dg-snap-cell-val">' +
                            (v === 0 ? '—' : String(v)) +
                            '</div>' +
                            deltaHtml;
                        bodyHtml += '<td class="' + cl + '"' + bg + '>' + valBlock + '</td>';
                    }
                    bodyHtml += '</tr>';
                }
                inner.innerHTML =
                    '<table class="dg-snap-matrix"><thead>' + headHtml + '</thead><tbody>' + bodyHtml + '</tbody></table>';
            }

            function bindSnapshotDynamicsTabs() {
                var bM = document.getElementById('dg-snap-dyn-mgr');

            function loadSnapshotLog() {
                var tb = document.getElementById('dg-mp-issues-snapshot-tbody');
                if (!tb) return;
                tb.innerHTML = '<tr><td colspan="4" class="text-muted small py-3">Загрузка…</td></tr>';
                fetch(SNAPSHOT_LOG_URL + '?days=120&limit=200', { credentials: 'same-origin' })
                    .then(function (r) {
                        return r.json().then(function (j) {
                            return { ok: r.ok, j: j };
                        });
                    })
                    .then(function (x) {
                        if (!x.ok) {
                            tb.innerHTML =
                                '<tr><td colspan="4" class="text-danger small py-3">' +
                                escapeHtml((x.j && x.j.error) || 'Ошибка загрузки журнала') +
                                '</td></tr>';
                            snapshotRowsCache = [];
                            renderSnapshotDynamics([], 'by_manager');
                            return;
                        }
                        var rows = (x.j && x.j.rows) || [];
                        snapshotRowsCache = rows;
                        bindSnapshotDynamicsTabs();
                        renderSnapshotDynamics(rows, snapshotDynamicsKind);
                        if (!rows.length) {
                            tb.innerHTML =
                                '<tr><td colspan="4" class="text-muted small py-3">Пока нет записей. Нажмите «Записать снимок сейчас» (пересчёт из БД) или выполните полное обновление маркетплейсов в настройках / по расписанию — тогда снимок добавится автоматически.</td></tr>';
                            return;
                        }
                        var html = '';
                        for (var i = 0; i < rows.length; i++) {
                            var r = rows[i];
                            var trig = String(r.trigger_type || '');
                            var slot = String(r.schedule_slot_time || '').trim();
                            var src =
                                trig === 'schedule'
                                    ? '<span class="badge rounded-pill bg-primary">Расписание</span>'
                                    : trig === 'manual'
                                      ? '<span class="badge rounded-pill bg-info text-dark">Синк МП</span>'
                                      : trig === 'manual_ui'
                                        ? '<span class="badge rounded-pill bg-secondary">С экрана</span>'
                                        : '<span class="badge rounded-pill bg-light text-dark">' +
                                          escapeHtml(trig) +
                                          '</span>';
                            var slotLine =
                                slot && trig === 'schedule'
                                    ? '<div class="dg-snap-meta-muted mt-1">Авто, слот <strong>' +
                                      escapeHtml(slot) +
                                      '</strong> МСК</div>'
                                    : '';
                            var total = Number(r.total_count || 0);
                            html +=
                                '<tr>' +
                                '<td><div class="fw-semibold text-body">' +
                                escapeHtml(String(r.recorded_at || '')) +
                                '</div><div class="dg-snap-meta-muted mt-1">Дата учёта: ' +
                                escapeHtml(String(r.stat_date || '—')) +
                                '</div><div class="mt-2 d-flex flex-wrap gap-1 align-items-center">' +
                                src +
                                '</div>' +
                                slotLine +
                                '</td>' +
                                '<td class="text-center align-middle">' +
                                '<span class="dg-snap-total-pill">' +
                                total +
                                '</span></td>' +
                                '<td>' +
                                renderBucketBars(r.by_manager, total, 7) +
                                '</td>' +
                                '<td>' +
                                renderBucketBars(r.by_content_manager, total, 7) +
                                '</td>' +
                                '</tr>';
                        }
                        tb.innerHTML = html;
                    })
                    .catch(function (e) {
                        tb.innerHTML =
                            '<tr><td colspan="4" class="text-danger small py-3">' +
                            escapeHtml(e && e.message ? e.message : 'Сеть') +
                            '</td></tr>';
                        snapshotRowsCache = [];
                        renderSnapshotDynamics([], 'by_manager');
                    });
            }

                var panel = document.getElementById('dg-mp-issues-workflow-panel');
                var label = document.getElementById('dg-mp-issues-workflow-toggle-label');
                var icon = document.getElementById('dg-mp-issues-workflow-toggle-icon');
                if (!btn || !panel) return;
                function setOpen(open) {
                    if (open) {
                        panel.classList.remove('d-none');
                        btn.setAttribute('aria-expanded', 'true');
                        if (label) label.textContent = 'Свернуть';
                        if (icon) {
                            icon.className = 'pe-7s-angle-up';
                            icon.style.fontSize = '1.1rem';
                        }
                    } else {
                        panel.classList.add('d-none');
                        btn.setAttribute('aria-expanded', 'false');
                        if (label) label.textContent = 'Развернуть';
                        if (icon) {
                            icon.className = 'pe-7s-angle-down';
                            icon.style.fontSize = '1.1rem';
                        }
                    }
                    try {
                        localStorage.setItem(MP_ISSUES_WORKFLOW_PANEL_OPEN_KEY, open ? '1' : '0');
                    } catch (e) {}
                    mpuSyncLayoutAndFloating();
                }
                try {
                    setOpen(localStorage.getItem(MP_ISSUES_WORKFLOW_PANEL_OPEN_KEY) === '1');
                } catch (e3) {
                    setOpen(false);
                }
                btn.addEventListener('click', function () {
                    setOpen(panel.classList.contains('d-none'));
                });
            })();

            bindMpIssuesPersistedSectionCollapse(MP_ISSUES_WORKFLOW_TEXT_1_KEY, 'dg-mp-issues-workflow-t1-body', 'dg-mp-issues-workflow-t1-toggle');
            bindMpIssuesPersistedSectionCollapse(MP_ISSUES_WORKFLOW_TEXT_2_KEY, 'dg-mp-issues-workflow-t2-body', 'dg-mp-issues-workflow-t2-toggle');
            bindMpIssuesPersistedSectionCollapse(MP_ISSUES_WORKFLOW_TEXT_3_KEY, 'dg-mp-issues-workflow-t3-body', 'dg-mp-issues-workflow-t3-toggle');

            var MP_ISSUES_SNAPSHOT_CARD_COLLAPSED_KEY = 'datagon_mp_issues_snapshot_card_collapsed_v1';
            bindMpIssuesPersistedSectionCollapse(
                MP_ISSUES_SNAPSHOT_CARD_COLLAPSED_KEY,
                'dg-mp-issues-snapshot-body',
                'dg-mp-issues-snapshot-toggle',
            );

            // Шестерёнка «Поля фильтров» для карточки «Фильтры и действия» —
            // auto-discovery: достаточно атрибута data-dg-mpu-filter-field на блоке
            // (см. правило datagon-list-page-baseline-moysklad.mdc и FieldFieldsVisibility).
            (function bindFilterFieldsVisibility() {
                var FIELD_GROUPS = [
                    {
                        key: 'scope_block',
                        title: 'Фильтр маркетплейса',
                        items: [
                            { key: 'scope', title: 'Радио-кнопки выбора маркетплейса', hint: 'Все товары / Есть проблемы / Нет на одном из 3 / Нет на Ozon|WB|Я.Маркет / Не совпадает НДС / Разные габариты между МП' },
                        ],
                    },
                    {
                        key: 'extra_filters',
                        title: 'Дополнительные фильтры',
                        items: [
                            { key: 'manager', title: 'Менеджер', hint: 'Селектор менеджера в карточке «Фильтры и действия»' },
                            { key: 'cmgr', title: 'Контент-менеджер', hint: 'Селектор контент-менеджера в карточке «Фильтры и действия»' },
                            { key: 'exclude_bundle_components', title: 'Исключить товары из комплектов', hint: 'Серверный фильтр; дефолт включён' },
                            { key: 'smart_columns', title: 'Умное скрытие столбцов', hint: 'Под выбранный проблемный scope; дефолт включён' },
                            { key: 'stock_positive', title: 'Показывать товары с остатком', hint: 'Клиентский: только Остаток по МС > 0; дефолт выкл' },
                        ],
                    },
                    {
                        key: 'filter_actions_block',
                        title: 'Действия',
                        items: [
                            { key: 'filter_actions', title: 'Кнопки «Применить» / «По умолчанию»', hint: 'Если скрыть — применять можно только Enter в поле «Умный поиск»' },
                        ],
                    },
                ];
                if (window.DatagonFilterFieldsVisibility && window.DatagonFilterFieldsVisibility.init) {
                    window.DatagonFilterFieldsVisibility.init({
                        storageKeyPrefix: 'datagon_mpu_filter_fields_v1',
                        attr: 'data-dg-mpu-filter-field',
                        fieldGroups: FIELD_GROUPS,
                        togglesRootId: 'dg-mpu-filter-blocks-toggles',
                        idPrefix: 'dg-mpu-ff-',
                        exposeAs: 'DatagonMpuFilterBlocks',
                    });
                }
            })();
        })();
    </script>
