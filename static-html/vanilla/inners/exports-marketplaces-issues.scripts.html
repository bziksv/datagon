    <script>
        (function () {
            'use strict';

            // ---- sticky-top для шапки таблицы ----
            // Таблица «Проблемы с товарами» исключена из глобального markBaselineTables
            // (см. правило datagon-table-behavior-lock.mdc). Высоту app-header выставляем сами,
            // чтобы native CSS sticky на <th> прилипал под верхнее меню.
            function syncStickyTopVar() {
                try {
                    var header = document.querySelector('.app-header.fixed-header') || document.querySelector('.app-header');
                    var top = 60;
                    if (header) {
                        var rect = header.getBoundingClientRect();
                        if (rect && rect.height > 0) top = Math.round(rect.height);
                    }
                    document.documentElement.style.setProperty('--dg-table-sticky-top', top + 'px');
                } catch (_) {}
            }
            function bindStickyTopVar() {
                syncStickyTopVar();
                window.addEventListener('resize', syncStickyTopVar, { passive: true });
                if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {
                    document.fonts.ready.then(syncStickyTopVar).catch(function () {});
                }
                window.addEventListener('load', syncStickyTopVar, { passive: true });
                try {
                    var header = document.querySelector('.app-header');
                    if (header && typeof ResizeObserver !== 'undefined') {
                        new ResizeObserver(syncStickyTopVar).observe(header);
                    }
                } catch (_) {}
            }
            bindStickyTopVar();

            var API_URL = '/api/exports/marketplaces/issues';
            var SCOPE_LABELS = {
                all: 'все товары',
                any: 'есть проблемы (хотя бы где-то)',
                all3: 'нет ни на одном маркетплейсе',
                ozon: 'нет на Ozon',
                wb: 'нет на Wildberries',
                ym: 'нет на Я.Маркет',
            };
            // Ключи, по которым работает «умный поиск»: артикул/наименование МС + маркетплейсов
            // + ФИО менеджеров. Если бэкенд вернёт строку без этих ключей — fallback на все
            // строковые поля row (см. applySearchFilter ниже). Так искать по «Иванов» или по
            // подстроке наименования с любого маркетплейса будет всегда, без отдельных полей.
            var SEARCH_KEYS = [
                'code', 'name',
                'ozon_code', 'ozon_name',
                'wb_code', 'wb_name',
                'ym_code', 'ym_name',
                'manager', 'content_manager',
            ];
            // Колонки, которые нужно подсветить красным при пустом значении (и значит товара
            // нет на этом маркетплейсе). Подсветка делается по парам (code + name).
            var MISSING_PAIRS = [
                ['ozon_code', 'ozon_name'],
                ['wb_code', 'wb_name'],
                ['ym_code', 'ym_name'],
            ];
            // ---- Колонки: дефолтные ширины и видимость (сохраняем в localStorage) ----
            var COLS_WIDTH_KEY = 'dg.mpu.colwidths.v1';
            var COLS_VISIBLE_KEY = 'dg.mpu.colvisible.v1';
            // ---- Дополнительные фильтры (Менеджер / Контент-менеджер): сохраняем в localStorage ----
            var FILTER_MANAGER_KEY = 'dg.mpu.flt.manager.v1';
            var FILTER_CONTENT_MGR_KEY = 'dg.mpu.flt.cmgr.v1';
            var COL_MIN_WIDTH = 60;
            var COL_MAX_WIDTH = 800;
            var DEFAULT_COL_WIDTH = 140;
            var COL_WIDTH_DEFAULTS_BY_KEY = {
                code: 110,
                name: 240,
                manager: 130,
                content_manager: 150,
                synced_at_ms: 130,
                ozon_code: 90,
                ozon_name: 220,
                wb_code: 90,
                wb_name: 220,
                ym_code: 90,
                ym_name: 220,
            };
            // Колонки, скрытые ПО УМОЛЧАНИЮ — чтобы таблица из коробки лучше помещалась
            // (пользователь сам включит при необходимости через «🧩 Столбцы»).
            var DEFAULT_HIDDEN_COLS = {
                synced_at_ms: true,
            };

            var elTable = document.getElementById('dg-mp-table-main');
            var elTitle = document.getElementById('dg-mpu-table-title');
            var elMsg = document.getElementById('dg-mpu-msg');
            var elPageHint = document.getElementById('dg-mp-page-hint');
            var elPagePrev = document.getElementById('dg-mp-page-prev');
            var elPageNext = document.getElementById('dg-mp-page-next');
            var elPageLimit = document.getElementById('dg-mp-page-limit');
            var elSearch = document.getElementById('dg-mp-search');
            var elSearchClear = document.getElementById('dg-mp-search-clear');
            var elColsToggle = document.getElementById('dg-mpu-cols-toggle');
            var elColsPanel = document.getElementById('dg-mpu-cols-panel');
            var elColsGrid = document.getElementById('dg-mpu-cols-grid');
            var elColsReset = document.getElementById('dg-mpu-cols-reset');
            var elWidthsToggle = document.getElementById('dg-mpu-widths-toggle');
            var elWidthsPanel = document.getElementById('dg-mpu-widths-panel');
            var elWidthsGrid = document.getElementById('dg-mpu-widths-grid');
            var elWidthsReset = document.getElementById('dg-mpu-widths-reset');
            var elFltManager = document.getElementById('dg-mpu-flt-manager');
            var elFltCmgr = document.getElementById('dg-mpu-flt-cmgr');
            var elFltReset = document.getElementById('dg-mpu-flt-reset');
            var elFltApply = document.getElementById('dg-mpu-flt-apply');
            var elFltDirty = document.getElementById('dg-mpu-flt-dirty');
            var scopeInputs = document.querySelectorAll('input[name="dg-mpu-scope"]');

            function readStr(key) {
                try {
                    var v = window.localStorage.getItem(key);
                    return v == null ? '' : String(v);
                } catch (_) { return ''; }
            }
            function writeStr(key, value) {
                try { window.localStorage.setItem(key, String(value == null ? '' : value)); } catch (_) {}
            }

            function readJsonFromStorage(key) {
                try {
                    var raw = window.localStorage.getItem(key);
                    if (!raw) return null;
                    var v = JSON.parse(raw);
                    return v && typeof v === 'object' ? v : null;
                } catch (_) { return null; }
            }
            function writeJsonToStorage(key, value) {
                try { window.localStorage.setItem(key, JSON.stringify(value || {})); } catch (_) {}
            }
            function defaultWidthForKey(k) {
                var n = COL_WIDTH_DEFAULTS_BY_KEY[k];
                return Number.isFinite(n) && n > 0 ? n : DEFAULT_COL_WIDTH;
            }

            // Двухслойный state: применённые поля используются для рендера/запроса,
            // pending.* — это «черновик» из инпутов до нажатия «Применить» (см. правило
            // .cursor/rules/datagon-table-filter-apply.mdc — фильтры/поиск/scope срабатывают
            // только после явного действия пользователя, чтобы не было моментальной нагрузки).
            var initialFilters = {
                manager: readStr(FILTER_MANAGER_KEY),
                content_manager: readStr(FILTER_CONTENT_MGR_KEY),
            };
            var state = {
                scope: 'all',
                rowsAll: [],   // ответ API (после серверного фильтра по scope)
                rows: [],      // после расширенных фильтров и умного поиска
                headers: [],
                headerLabels: [],
                page: 1,
                pageSize: 100,
                search: '',
                sortKey: null,
                sortDir: 'asc',
                visible: readJsonFromStorage(COLS_VISIBLE_KEY) || {},
                colWidths: readJsonFromStorage(COLS_WIDTH_KEY) || {},
                // Расширенные фильтры (применяются ДО умного поиска и сортировки):
                // точное совпадение строк manager/content_manager (пусто = «все»).
                filters: {
                    manager: initialFilters.manager,
                    content_manager: initialFilters.content_manager,
                },
                pending: {
                    scope: 'all',
                    search: '',
                    filters: {
                        manager: initialFilters.manager,
                        content_manager: initialFilters.content_manager,
                    },
                },
            };

            function pendingDiffersFromApplied() {
                if (state.pending.scope !== state.scope) return true;
                if (String(state.pending.search || '') !== String(state.search || '')) return true;
                var pf = state.pending.filters || {};
                var af = state.filters || {};
                if (String(pf.manager || '') !== String(af.manager || '')) return true;
                if (String(pf.content_manager || '') !== String(af.content_manager || '')) return true;
                return false;
            }
            function refreshDirtyIndicator() {
                var dirty = pendingDiffersFromApplied();
                if (elFltDirty) elFltDirty.classList.toggle('d-none', !dirty);
                if (elFltApply) elFltApply.classList.toggle('btn-primary', dirty);
                if (elFltApply) elFltApply.classList.toggle('btn-outline-primary', !dirty);
            }

            function setMsg(text, kind) {
                if (!elMsg) return;
                if (!text) {
                    elMsg.classList.add('d-none');
                    elMsg.textContent = '';
                    return;
                }
                elMsg.classList.remove('d-none');
                elMsg.classList.remove('alert-danger', 'alert-success', 'alert-secondary', 'alert-info');
                elMsg.classList.add(
                    kind === 'error' ? 'alert-danger'
                        : kind === 'ok' ? 'alert-success'
                        : kind === 'info' ? 'alert-info'
                        : 'alert-secondary',
                );
                elMsg.textContent = text;
            }

            function escapeHtml(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function isEmptyVal(v) {
                return v == null || String(v).trim() === '';
            }

            // ---- Расширенные фильтры (manager / content_manager) + умный поиск ----
            function passesAdvancedFilters(row) {
                var f = state.filters || {};
                if (f.manager) {
                    if (String(row.manager || '').trim() !== String(f.manager).trim()) return false;
                }
                if (f.content_manager) {
                    if (String(row.content_manager || '').trim() !== String(f.content_manager).trim()) return false;
                }
                return true;
            }
            function applySearchFilter() {
                var base = state.rowsAll.filter(passesAdvancedFilters);
                var q = String(state.search || '').trim().toLowerCase();
                if (!q) { state.rows = base; return; }
                var tokens = q.split(/\s+/).filter(Boolean);
                var keys = state.headers.filter(function (k) { return SEARCH_KEYS.indexOf(k) >= 0; });
                state.rows = base.filter(function (row) {
                    var hay = '';
                    for (var i = 0; i < keys.length; i++) {
                        var v = row[keys[i]];
                        if (v == null) continue;
                        hay += ' ' + String(v).toLowerCase();
                    }
                    if (!hay) {
                        // На случай нестандартных payload'ов: если ни одного «осмысленного» ключа
                        // в строке нет — складываем все строковые/числовые значения в стог сена.
                        for (var k in row) {
                            if (!Object.prototype.hasOwnProperty.call(row, k)) continue;
                            var rv = row[k];
                            if (rv == null) continue;
                            if (typeof rv === 'object') continue;
                            hay += ' ' + String(rv).toLowerCase();
                        }
                    }
                    for (var j = 0; j < tokens.length; j++) {
                        if (hay.indexOf(tokens[j]) < 0) return false;
                    }
                    return true;
                });
            }
            // Уникальные значения по полю (источник — необфильтрованный rowsAll).
            function uniqueValuesFor(key) {
                var seen = Object.create(null);
                var out = [];
                for (var i = 0; i < state.rowsAll.length; i++) {
                    var v = state.rowsAll[i] && state.rowsAll[i][key];
                    var s = v == null ? '' : String(v).trim();
                    if (!s || seen[s]) continue;
                    seen[s] = 1;
                    out.push(s);
                }
                if (NAT_COLLATOR) out.sort(function (a, b) { return NAT_COLLATOR.compare(a, b); });
                else out.sort();
                return out;
            }
            function rebuildSelect(el, key, currentValue) {
                if (!el) return;
                var values = uniqueValuesFor(key);
                el.innerHTML = '';
                var optAll = document.createElement('option');
                optAll.value = '';
                optAll.textContent = '— все —';
                el.appendChild(optAll);
                var hasCurrent = false;
                for (var i = 0; i < values.length; i++) {
                    var opt = document.createElement('option');
                    opt.value = values[i];
                    opt.textContent = values[i];
                    if (values[i] === currentValue) { opt.selected = true; hasCurrent = true; }
                    el.appendChild(opt);
                }
                if (!hasCurrent && currentValue) {
                    // Сохранённое значение фильтра отсутствует в текущем наборе — добавляем
                    // отдельной строкой, чтобы пользователь видел выбранное и мог сбросить.
                    var ghost = document.createElement('option');
                    ghost.value = currentValue;
                    ghost.textContent = currentValue + ' (нет в текущем фильтре)';
                    ghost.selected = true;
                    el.appendChild(ghost);
                }
            }
            function rebuildAdvancedFilters() {
                rebuildSelect(elFltManager, 'manager', state.filters.manager || '');
                rebuildSelect(elFltCmgr, 'content_manager', state.filters.content_manager || '');
            }

            // ---- Sort ----
            var NAT_COLLATOR = (function () {
                try { return new Intl.Collator('ru-RU', { numeric: true, sensitivity: 'base' }); }
                catch (e) { return null; }
            })();
            function compareCells(a, b) {
                var aE = isEmptyVal(a), bE = isEmptyVal(b);
                if (aE && bE) return 0;
                if (aE) return 1;
                if (bE) return -1;
                if (NAT_COLLATOR) return NAT_COLLATOR.compare(String(a), String(b));
                return String(a) < String(b) ? -1 : String(a) > String(b) ? 1 : 0;
            }
            function applySort() {
                if (!state.sortKey || state.headers.indexOf(state.sortKey) < 0) return;
                var k = state.sortKey;
                var dir = state.sortDir === 'desc' ? -1 : 1;
                state.rows.sort(function (r1, r2) { return compareCells(r1[k], r2[k]) * dir; });
            }
            function setSort(key) {
                if (!key || state.headers.indexOf(key) < 0) return;
                if (state.sortKey === key) {
                    state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
                } else {
                    state.sortKey = key;
                    state.sortDir = 'asc';
                }
                applySort();
                state.page = 1;
                renderTable();
            }

            // ---- Видимость колонок ----
            function isColVisible(k) {
                if (!k) return false;
                if (Object.prototype.hasOwnProperty.call(state.visible, k)) {
                    return state.visible[k] !== false;
                }
                return !DEFAULT_HIDDEN_COLS[k];
            }
            function setColVisible(k, on) {
                state.visible[k] = !!on;
                writeJsonToStorage(COLS_VISIBLE_KEY, state.visible);
            }
            function visibleHeaders() {
                return state.headers.filter(isColVisible);
            }

            // ---- <colgroup> с дефолтными/сохранёнными ширинами + drag-resize ----
            function widthForKey(k) {
                var w = state.colWidths[k];
                if (Number.isFinite(w) && w >= COL_MIN_WIDTH && w <= COL_MAX_WIDTH) return w;
                return defaultWidthForKey(k);
            }
            function setWidthForKey(k, w) {
                w = Math.max(COL_MIN_WIDTH, Math.min(COL_MAX_WIDTH, Math.round(w)));
                state.colWidths[k] = w;
                writeJsonToStorage(COLS_WIDTH_KEY, state.colWidths);
                var cg = elTable.querySelector(':scope > colgroup');
                if (!cg) return;
                var col = cg.querySelector('col[data-col-key="' + cssEscape(k) + '"]');
                if (col) col.style.width = w + 'px';
            }
            function cssEscape(s) {
                if (window.CSS && CSS.escape) return CSS.escape(String(s || ''));
                return String(s || '').replace(/[^a-zA-Z0-9_\-]/g, '\\$&');
            }
            function applyColgroup(headers) {
                var existing = elTable.querySelector(':scope > colgroup');
                if (existing) existing.remove();
                var cg = document.createElement('colgroup');
                for (var i = 0; i < headers.length; i++) {
                    var k = headers[i];
                    var col = document.createElement('col');
                    col.setAttribute('data-col-key', k);
                    col.style.width = widthForKey(k) + 'px';
                    cg.appendChild(col);
                }
                elTable.insertBefore(cg, elTable.firstChild);
            }
            function attachResizers(thead, headers) {
                var ths = thead.querySelectorAll('th[data-col-key]');
                ths.forEach(function (th) {
                    var k = th.getAttribute('data-col-key');
                    if (!k) return;
                    var grip = document.createElement('span');
                    grip.className = 'dg-mpu-resizer';
                    grip.setAttribute('data-col-key', k);
                    grip.setAttribute('aria-hidden', 'true');
                    grip.addEventListener('mousedown', startResize);
                    grip.addEventListener('touchstart', startResize, { passive: false });
                    grip.addEventListener('click', function (e) { e.stopPropagation(); });
                    th.appendChild(grip);
                });
            }
            function startResize(ev) {
                if (ev.cancelable) ev.preventDefault();
                ev.stopPropagation();
                var grip = ev.currentTarget;
                var k = grip.getAttribute('data-col-key');
                if (!k) return;
                var startX = (ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX);
                var startW = widthForKey(k);
                grip.classList.add('dg-mpu-resizing');
                document.body.style.cursor = 'col-resize';
                function move(e) {
                    var x = (e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX);
                    var dx = x - startX;
                    setWidthForKey(k, startW + dx);
                }
                function up() {
                    grip.classList.remove('dg-mpu-resizing');
                    document.body.style.cursor = '';
                    window.removeEventListener('mousemove', move);
                    window.removeEventListener('mouseup', up);
                    window.removeEventListener('touchmove', move);
                    window.removeEventListener('touchend', up);
                }
                window.addEventListener('mousemove', move);
                window.addEventListener('mouseup', up);
                window.addEventListener('touchmove', move, { passive: false });
                window.addEventListener('touchend', up);
            }

            // ---- Toolbox: панель видимости столбцов ----
            function rebuildColsPanel() {
                if (!elColsGrid) return;
                elColsGrid.innerHTML = '';
                for (var i = 0; i < state.headers.length; i++) {
                    var k = state.headers[i];
                    var label = state.headerLabels[i] || k;
                    var lab = document.createElement('label');
                    var cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.checked = isColVisible(k);
                    cb.setAttribute('data-col-key', k);
                    cb.addEventListener('change', function () {
                        setColVisible(this.getAttribute('data-col-key'), this.checked);
                        renderTable();
                    });
                    lab.appendChild(cb);
                    lab.appendChild(document.createTextNode(' ' + label));
                    elColsGrid.appendChild(lab);
                }
            }
            // Универсальный toggle для одной из dropdown-панелей тулбокса (cols/widths).
            // При открытии одной — другая принудительно закрывается, чтобы не перекрывались.
            function togglePanel(panel, otherPanel, open) {
                if (!panel) return;
                if (open == null) panel.classList.toggle('open');
                else panel.classList.toggle('open', !!open);
                if (panel.classList.contains('open') && otherPanel) {
                    otherPanel.classList.remove('open');
                }
            }
            function closeAllToolboxPanels() {
                if (elColsPanel) elColsPanel.classList.remove('open');
                if (elWidthsPanel) elWidthsPanel.classList.remove('open');
            }
            if (elColsToggle && elColsPanel) {
                elColsToggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    togglePanel(elColsPanel, elWidthsPanel);
                });
            }
            if (elWidthsToggle && elWidthsPanel) {
                elWidthsToggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    togglePanel(elWidthsPanel, elColsPanel);
                    if (elWidthsPanel.classList.contains('open')) rebuildWidthsPanel();
                });
            }
            document.addEventListener('click', function (e) {
                var anyOpen = (elColsPanel && elColsPanel.classList.contains('open')) ||
                              (elWidthsPanel && elWidthsPanel.classList.contains('open'));
                if (!anyOpen) return;
                if (e.target === elColsToggle || (elColsPanel && elColsPanel.contains(e.target))) return;
                if (e.target === elWidthsToggle || (elWidthsPanel && elWidthsPanel.contains(e.target))) return;
                closeAllToolboxPanels();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeAllToolboxPanels();
            });
            if (elColsReset) {
                elColsReset.addEventListener('click', function (e) {
                    e.preventDefault();
                    state.visible = {};
                    writeJsonToStorage(COLS_VISIBLE_KEY, {});
                    rebuildColsPanel();
                    renderTable();
                });
            }

            // ---- Toolbox: панель числовой ширины колонок (px) ----
            // Перерисовываем по запросу при открытии панели или после изменения headers.
            function rebuildWidthsPanel() {
                if (!elWidthsGrid) return;
                elWidthsGrid.innerHTML = '';
                if (!state.headers.length) {
                    elWidthsGrid.innerHTML = '<div class="text-muted small">Нет колонок</div>';
                    return;
                }
                for (var i = 0; i < state.headers.length; i++) {
                    var k = state.headers[i];
                    var label = state.headerLabels[i] || k;
                    var ctl = document.createElement('label');
                    ctl.className = 'dg-mp-width-control';
                    var span = document.createElement('span');
                    span.textContent = label;
                    var inp = document.createElement('input');
                    inp.type = 'number';
                    inp.className = 'form-control form-control-sm';
                    inp.min = String(COL_MIN_WIDTH);
                    inp.max = String(COL_MAX_WIDTH);
                    inp.step = '10';
                    inp.value = String(widthForKey(k));
                    inp.setAttribute('data-col-key', k);
                    inp.addEventListener('change', function () {
                        var key = this.getAttribute('data-col-key');
                        var n = parseInt(this.value, 10);
                        if (!Number.isFinite(n)) { this.value = String(widthForKey(key)); return; }
                        setWidthForKey(key, n);
                        this.value = String(widthForKey(key));
                    });
                    ctl.appendChild(span);
                    ctl.appendChild(inp);
                    elWidthsGrid.appendChild(ctl);
                }
            }
            if (elWidthsReset) {
                elWidthsReset.addEventListener('click', function (e) {
                    e.preventDefault();
                    state.colWidths = {};
                    writeJsonToStorage(COLS_WIDTH_KEY, {});
                    rebuildWidthsPanel();
                    renderTable();
                });
            }

            // ---- Render ----
            function renderTable() {
                if (!elTable) return;
                var thead = elTable.querySelector('thead');
                var tbody = elTable.querySelector('tbody');
                if (!thead || !tbody) return;

                var rows = state.rows;
                var headers = visibleHeaders();
                var allHeaders = state.headers;
                var labels = state.headerLabels;
                var total = rows.length;
                var pageSize = Math.max(1, state.pageSize | 0);
                var pageCount = Math.max(1, Math.ceil(total / pageSize));
                if (state.page > pageCount) state.page = pageCount;
                if (state.page < 1) state.page = 1;
                var startIdx = (state.page - 1) * pageSize;
                var endIdx = Math.min(total, startIdx + pageSize);
                var slice = rows.slice(startIdx, endIdx);

                if (!total) {
                    var existingCg = elTable.querySelector(':scope > colgroup');
                    if (existingCg) existingCg.remove();
                    thead.innerHTML = '<tr><th class="text-muted">' +
                        escapeHtml('Нет данных по фильтру «' + (SCOPE_LABELS[state.scope] || state.scope) + '».') +
                        '</th></tr>';
                    tbody.innerHTML = '<tr><td class="text-muted py-3">Список пуст. Возможные причины: фильтр МС (складская позиция = Да, перестали сотрудничать = Нет) никого не нашёл, либо снапшоты маркетплейсов содержат все коды МС. Обновите снапшоты на вкладках Ozon / Wildberries / Я.Маркет.</td></tr>';
                    if (elPageHint) elPageHint.textContent = 'Найдено: 0; страница 0/0; показано: 0';
                    if (elPagePrev) elPagePrev.disabled = true;
                    if (elPageNext) elPageNext.disabled = true;
                    return;
                }

                applyColgroup(headers);

                // ---- thead с сортировкой ----
                var theadHtml = '<tr>';
                for (var i = 0; i < headers.length; i++) {
                    var k = headers[i];
                    var labelIdx = allHeaders.indexOf(k);
                    var label = (labelIdx >= 0 && labels[labelIdx]) ? labels[labelIdx] : k;
                    var arrow = '';
                    if (state.sortKey === k) arrow = state.sortDir === 'desc' ? ' ▼' : ' ▲';
                    theadHtml +=
                        '<th scope="col" class="dg-mp-sortable" data-col-key="' + escapeHtml(k) + '" ' +
                        'role="button" tabindex="0" aria-sort="' +
                        (state.sortKey === k ? (state.sortDir === 'desc' ? 'descending' : 'ascending') : 'none') +
                        '" title="Сортировать по «' + escapeHtml(label) + '» (потяните за правый край колонки, чтобы изменить ширину)">' +
                        escapeHtml(label) +
                        '<span class="dg-mp-sort-arrow">' + arrow + '</span>' +
                        '</th>';
                }
                theadHtml += '</tr>';
                thead.innerHTML = theadHtml;
                var ths = thead.querySelectorAll('th[data-col-key]');
                ths.forEach(function (th) {
                    th.addEventListener('click', function (ev) {
                        if (ev.target && ev.target.classList && ev.target.classList.contains('dg-mpu-resizer')) return;
                        var k = th.getAttribute('data-col-key');
                        if (k) setSort(k);
                    });
                    th.addEventListener('keydown', function (e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            var k = th.getAttribute('data-col-key');
                            if (k) setSort(k);
                        }
                    });
                });
                attachResizers(thead, headers);

                // ---- tbody с подсветкой пустых пар (маркетплейс не нашёл код) ----
                var html = '';
                for (var r = 0; r < slice.length; r++) {
                    var row = slice[r];
                    // Какие пары подсветить красным.
                    var missingCols = {};
                    for (var p = 0; p < MISSING_PAIRS.length; p++) {
                        var pair = MISSING_PAIRS[p];
                        if (isEmptyVal(row[pair[0]]) && isEmptyVal(row[pair[1]])) {
                            missingCols[pair[0]] = true;
                            missingCols[pair[1]] = true;
                        }
                    }
                    html += '<tr>';
                    for (var c = 0; c < headers.length; c++) {
                        var key = headers[c];
                        var val = row && row[key] != null ? row[key] : '';
                        var cls = missingCols[key] ? ' class="dg-mpu-missing"' : '';
                        html += '<td' + cls + ' data-col-key="' + escapeHtml(key) + '">' + escapeHtml(val) + '</td>';
                    }
                    html += '</tr>';
                }
                tbody.innerHTML = html;

                if (elPageHint) {
                    var hasFilter = !!String(state.search || '').trim();
                    var base = 'Найдено: ' + total + '; страница ' + state.page + '/' + pageCount + '; показано: ' + slice.length;
                    if (hasFilter) base += ' (фильтр из ' + state.rowsAll.length + ')';
                    elPageHint.textContent = base;
                }
                if (elPagePrev) elPagePrev.disabled = state.page <= 1;
                if (elPageNext) elPageNext.disabled = state.page >= pageCount;
            }

            function setTitleByScope() {
                if (!elTitle) return;
                elTitle.textContent = 'Таблица — ' + (SCOPE_LABELS[state.scope] || state.scope);
            }

            function load() {
                setMsg('Загрузка…', 'info');
                var url = API_URL + '?scope=' + encodeURIComponent(state.scope);
                fetch(url, { credentials: 'same-origin' })
                    .then(function (r) {
                        if (!r.ok) {
                            return r.json().catch(function () { return {}; }).then(function (j) {
                                throw new Error((j && (j.error || j.message)) || ('HTTP ' + r.status));
                            });
                        }
                        return r.json();
                    })
                    .then(function (data) {
                        state.rowsAll = Array.isArray(data && data.rows) ? data.rows : [];
                        state.headers = Array.isArray(data && data.headers) ? data.headers : [];
                        state.headerLabels = Array.isArray(data && data.headerLabels) ? data.headerLabels : state.headers;
                        if (!state.sortKey || state.headers.indexOf(state.sortKey) < 0) {
                            state.sortKey = state.headers.indexOf('code') >= 0 ? 'code' : (state.headers[0] || null);
                            state.sortDir = 'asc';
                        }
                        rebuildAdvancedFilters();
                        // После rebuildAdvancedFilters select.value мог быть скорректирован
                        // (значение могло пропасть из набора). Синхронизируем pending с
                        // фактически отображаемыми значениями, чтобы dirty-индикатор не врал.
                        if (elFltManager) state.pending.filters.manager = String(elFltManager.value || '');
                        if (elFltCmgr) state.pending.filters.content_manager = String(elFltCmgr.value || '');
                        applySearchFilter();
                        applySort();
                        state.page = 1;
                        setMsg('');
                        rebuildColsPanel();
                        if (elWidthsPanel && elWidthsPanel.classList.contains('open')) {
                            rebuildWidthsPanel();
                        }
                        refreshDirtyIndicator();
                        renderTable();
                    })
                    .catch(function (err) {
                        state.rowsAll = [];
                        state.rows = [];
                        state.headers = [];
                        state.headerLabels = [];
                        renderTable();
                        setMsg('Ошибка загрузки: ' + (err && err.message ? err.message : err), 'error');
                    });
            }

            // ---- Двухслойные фильтры: pending → applied только по «Применить» ----
            // См. .cursor/rules/datagon-table-filter-apply.mdc:
            //   • scope-радио, поиск, селекты Менеджер/КМ — пишут в state.pending.*;
            //   • commit() копирует в state.* и при необходимости перезапрашивает API;
            //   • Enter в поле поиска и одиночные действия (очистить поиск, сбросить
            //     фильтры) считаются «явным действием» и применяются сразу.
            function commitFilters() {
                var scopeChanged = state.pending.scope !== state.scope;
                state.scope = String(state.pending.scope || 'all');
                state.search = String(state.pending.search || '');
                state.filters.manager = String((state.pending.filters && state.pending.filters.manager) || '');
                state.filters.content_manager = String((state.pending.filters && state.pending.filters.content_manager) || '');
                writeStr(FILTER_MANAGER_KEY, state.filters.manager);
                writeStr(FILTER_CONTENT_MGR_KEY, state.filters.content_manager);
                setTitleByScope();
                refreshDirtyIndicator();
                if (scopeChanged) {
                    load();
                } else {
                    applySearchFilter();
                    applySort();
                    state.page = 1;
                    renderTable();
                }
            }
            function resetAllFiltersAndCommit() {
                state.pending.scope = 'all';
                state.pending.search = '';
                state.pending.filters.manager = '';
                state.pending.filters.content_manager = '';
                if (elSearch) elSearch.value = '';
                if (elFltManager) elFltManager.value = '';
                if (elFltCmgr) elFltCmgr.value = '';
                for (var i = 0; i < scopeInputs.length; i++) {
                    scopeInputs[i].checked = scopeInputs[i].value === 'all';
                }
                commitFilters();
            }

            for (var i = 0; i < scopeInputs.length; i++) {
                scopeInputs[i].addEventListener('change', function (e) {
                    if (!e.target.checked) return;
                    state.pending.scope = String(e.target.value || 'all');
                    refreshDirtyIndicator();
                });
            }

            if (elPageLimit) {
                elPageLimit.addEventListener('change', function () {
                    var n = parseInt(elPageLimit.value, 10);
                    if (!Number.isFinite(n) || n <= 0) return;
                    state.pageSize = n;
                    state.page = 1;
                    renderTable();
                });
            }
            if (elPagePrev) {
                elPagePrev.addEventListener('click', function () {
                    state.page = Math.max(1, state.page - 1);
                    renderTable();
                });
            }
            if (elPageNext) {
                elPageNext.addEventListener('click', function () {
                    state.page = state.page + 1;
                    renderTable();
                });
            }

            if (elSearch) {
                elSearch.addEventListener('input', function () {
                    state.pending.search = elSearch.value;
                    refreshDirtyIndicator();
                });
                elSearch.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        state.pending.search = elSearch.value;
                        commitFilters();
                    } else if (e.key === 'Escape') {
                        elSearch.value = '';
                        state.pending.search = '';
                        commitFilters();
                    }
                });
                elSearch.addEventListener('search', function () {
                    state.pending.search = elSearch.value;
                    commitFilters();
                });
            }
            if (elSearchClear) {
                elSearchClear.addEventListener('click', function () {
                    if (!elSearch) return;
                    elSearch.value = '';
                    state.pending.search = '';
                    commitFilters();
                    elSearch.focus();
                });
            }

            if (elFltManager) {
                elFltManager.addEventListener('change', function () {
                    state.pending.filters.manager = String(elFltManager.value || '');
                    refreshDirtyIndicator();
                });
            }
            if (elFltCmgr) {
                elFltCmgr.addEventListener('change', function () {
                    state.pending.filters.content_manager = String(elFltCmgr.value || '');
                    refreshDirtyIndicator();
                });
            }
            if (elFltApply) {
                elFltApply.addEventListener('click', function (e) {
                    e.preventDefault();
                    commitFilters();
                });
            }
            if (elFltReset) {
                elFltReset.addEventListener('click', function (e) {
                    e.preventDefault();
                    resetAllFiltersAndCommit();
                });
            }

            setTitleByScope();
            refreshDirtyIndicator();
            load();
        })();
    </script>
