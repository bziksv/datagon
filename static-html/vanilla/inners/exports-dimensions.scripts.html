              .map(function (r) { return { code: r.code, name: r.name || '' }; });
            var allTasks = currentTasks.concat(dbTasks);
            if (allTasks.length === 0) {
              setStatusHint('Позиций с правками не найдено — отправлять нечего.', 'error');
              return;
            }
            /**
             * Предупреждение про «несоответствие визуального фильтра и balk-синка».
             * Список активных применённых фильтров строится по `state.applied`
             * (умный поиск, scope «Все/Только с правками», тип «Товары/Комплекты»).
             * Балк-синк по семантике игнорирует фильтры таблицы и работает по
             * **всем** позициям с override в БД (через `/pending-sync?exclude=`),
             * — поэтому пользователь видит на странице, например, 1 строку, а в
             * confirm появляются «13 позиций». Без явного предупреждения это
             * легко принять за «синкаю только то, что вижу», и наоборот, при
             * пустой видимой таблице люди боятся, что синк ничего не отправит
             * (а он отправит всё из БД). История от 11.05.2026: при поиске
             * `5123-komplect-7` на боевом сервере пользователь нажал кнопку
             * и не понял, что произошло — ровно из-за этого зазора.
             */
            var activeFilters = [];
            try {
              var ap = state && state.applied ? state.applied : {};
              var scopeLabels = {
                'without': 'Без замера',
                'with': 'С замером',
              };
              var typeLabels = {
                'товар': 'Товар',
                'комплект': 'Комплект',
              };
              if (ap.search && String(ap.search).trim()) {
                activeFilters.push('умный поиск = «' + String(ap.search).trim() + '»');
              }
              if (ap.type && String(ap.type) !== 'all') {
                activeFilters.push('Тип = ' + (typeLabels[String(ap.type)] || String(ap.type)));
              }
              if (ap.measure_scope && String(ap.measure_scope) !== 'all') {
                activeFilters.push('Замер = ' + (scopeLabels[String(ap.measure_scope)] || String(ap.measure_scope)));
              }
              if (ap.problem_profile === 'stock_missing') {
                activeFilters.push('Проблемные товары: остаток > 0, не заполнены поля замера');
              }
            } catch (_) { /** state может быть не инициализирован — ничего страшного */ }

            var warnLines = '';
            if (activeFilters.length > 0) {
              warnLines = '\n⚠ ВНИМАНИЕ: на странице активны фильтры:\n  • ' +
                activeFilters.join('\n  • ') + '\n' +
                'Балк-синк всё равно отправит ВСЕ позиции с правками из БД, не только видимые в таблице.\n';
            }

            var msg = 'Найдено позиций с правками: ' + allTasks.length + '\n' +
              '  • на этой странице (с DOM-правками): ' + currentTasks.length + '\n' +
              '  • на других страницах (из БД): ' + dbTasks.length + '\n' +
              warnLines + '\n' +
              'Отправить ВСЕ в МойСклад?\n\nДля позиций текущей страницы сервер сначала сохранит inline-значения в БД, для остальных — возьмёт уже сохранённый override.';
            if (!window.confirm(msg)) return;
            runBulkSync(allTasks, btn, { label: 'Балк-синк (все правки)' });
          })
          .catch(function (e) {
            btn.disabled = false;
            btn.textContent = origText;
            setStatusHint('Сетевая ошибка при опросе БД: ' + ((e && e.message) || e), 'error');
          });
      }

      function bindSyncAllButton() {
        var btnDb = document.getElementById('dg-dim-sync-all-db');
        if (btnDb) btnDb.addEventListener('click', function (ev) {
          ev.preventDefault();
          syncAllDbToMs();
        });
      }

      function bindPackingTypesRefresh() {
        var btn = document.getElementById('dg-dim-packing-refresh');
        if (!btn) return;
        btn.addEventListener('click', function (ev) {
          ev.preventDefault();
          btn.disabled = true;
          var orig = btn.textContent;
          btn.textContent = '⏳ Импорт…';
          loadPackingTypes(true)
            .then(function (rows) {
              setStatusHint('Справочник «Тип упаковки» обновлён из МС: ' + (rows && rows.length ? rows.length : 0) + ' значений.', 'success');
              /** Перерендерим только ячейки packing_type, чтобы новые опции попали в <select>. */
              var tbody = document.getElementById('dg-dim-tbody');
              if (tbody) {
                var selects = tbody.querySelectorAll('.dg-dim-input[data-dg-field="packing_type"]');
                for (var i = 0; i < selects.length; i++) {
                  var sel = selects[i];
                  var code = sel.getAttribute('data-dg-code');

                  }
                  if (!col) continue;

                  if (td) td.innerHTML = col.render(row, col);

            .catch(function (e) {
              setStatusHint('Не удалось обновить справочник «Тип упаковки»: ' + ((e && e.message) || e), 'error');
            })
            .then(function () {
              btn.disabled = false;
              btn.textContent = orig;
            });
        });
      }

      function bindLogModal() {
        var tbody = document.getElementById('dg-dim-tbody');
        if (tbody) {
          tbody.addEventListener('click', function (ev) {
            var syncBtn = ev.target && ev.target.closest && ev.target.closest('.dg-dim-sync-btn');
            if (syncBtn) {
              ev.preventDefault();
              ev.stopPropagation();
              syncRowToMs(syncBtn);
              return;
            }
            var btn = ev.target && ev.target.closest && ev.target.closest('.dg-dim-log-btn');
            if (!btn) return;
            ev.preventDefault();
            ev.stopPropagation();
            var code = btn.getAttribute('data-dg-log-code') || '';
            var name = btn.getAttribute('data-dg-log-name') || '';
            openLogFor(code, name);
          });
        }
        var closeBtn = document.getElementById('dg-dim-log-close');
        if (closeBtn) closeBtn.addEventListener('click', closeLog);
        var refreshBtn = document.getElementById('dg-dim-log-refresh');
        if (refreshBtn) refreshBtn.addEventListener('click', function () {
          var overlay = document.getElementById('dg-dim-log-overlay');
          var code = overlay && overlay.dataset ? overlay.dataset.dgCode : '';
          if (code) loadLogFor(code, { offset: logModalState.offset, limit: logModalState.limit });
        });
        var backdrop = document.getElementById('dg-dim-log-backdrop');
        if (backdrop) backdrop.addEventListener('click', closeLog);
        var logBody = document.getElementById('dg-dim-log-body');
        if (logBody) {
          logBody.addEventListener('click', function (ev) {
            var prev = ev.target && ev.target.closest && ev.target.closest('.dg-dim-log-prev');
            if (prev) {
              ev.preventDefault();
              ev.stopPropagation();
              if (prev.disabled) return;
              var newOffset = Math.max(0, (logModalState.offset || 0) - (logModalState.limit || 100));
              loadLogFor(logModalState.code, { offset: newOffset, limit: logModalState.limit });
              return;
            }
            var next = ev.target && ev.target.closest && ev.target.closest('.dg-dim-log-next');
            if (next) {
              ev.preventDefault();
              ev.stopPropagation();
              if (next.disabled) return;
              var newOffsetNext = (logModalState.offset || 0) + (logModalState.limit || 100);
              if (newOffsetNext >= (logModalState.total || 0)) return;
              loadLogFor(logModalState.code, { offset: newOffsetNext, limit: logModalState.limit });
              return;
            }
            var revertBtn = ev.target && ev.target.closest && ev.target.closest('.dg-dim-log-revert-btn');
            if (revertBtn) {
              ev.preventDefault();
              ev.stopPropagation();
              revertLogEntry(revertBtn);
            }
          });
        }
        document.addEventListener('keydown', function (ev) {
          if (ev.key === 'Escape') {
            var overlay = document.getElementById('dg-dim-log-overlay');
            if (overlay && overlay.style.display !== 'none') closeLog();
          }
        });
      }

      function bindSort() {
        var thead = document.querySelector('#dg-dim-table thead');
        if (!thead) return;
        thead.addEventListener('click', function (ev) {
          var sel = window.getSelection ? window.getSelection() : null;
          if (sel && String(sel.toString() || '').trim().length > 0) return;
          var th = ev.target && ev.target.closest('th');
          if (!th) return;
          var key = th.getAttribute('data-dg-sort');
          if (!key) return;
          if (state.sortBy === key) {
            state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
          } else {
            state.sortBy = key;
            state.sortDir = 'asc';

          loadList();
        });
      }

      function bindEvents() {
        var elApply = document.getElementById('dg-dim-apply');
        var elReset = document.getElementById('dg-dim-reset');
        var elRefresh = document.getElementById('dg-dim-refresh');
        var elPrev = document.getElementById('dg-dim-page-prev');
        var elNext = document.getElementById('dg-dim-page-next');
        if (elApply) elApply.addEventListener('click', function (ev) { ev.preventDefault(); commitFilters(); });
        if (elReset) elReset.addEventListener('click', function (ev) { ev.preventDefault(); resetFilters(); });
        if (elRefresh) elRefresh.addEventListener('click', function (ev) { ev.preventDefault(); loadList(); });
        if (elPrev)
          elPrev.addEventListener('click', function () {
            var lim = Math.max(1, Number(state.applied.limit || 100));
            state.offset = Math.max(0, state.offset - lim);
            loadList();
          });
        if (elNext)
          elNext.addEventListener('click', function () {
            var lim = Math.max(1, Number(state.applied.limit || 100));
            state.offset = state.offset + lim;
            loadList();
          });
        var elType = document.getElementById('dg-dim-f-type');
        var elMeasure = document.getElementById('dg-dim-f-measure-scope');
        var elLimit = document.getElementById('dg-dim-f-limit');
        [elType, elMeasure, elLimit].forEach(function (el) {
          if (!el) return;
          el.addEventListener('change', function () {
            readFormToPending();
          });
        });
        var swProb = document.getElementById('dg-dim-problem-stock-switch');
        if (swProb) {
          swProb.addEventListener('change', function () {

      }

      /**
       * Плавающий заголовок таблицы: ветка «Мои товары / Проблемы с товарами»
       * (datagon-table-behavior-lock.mdc). Внешний .dg-dim-table-scroll-outer ловит
       * горизонтальный скролл; вертикальный sticky-th невозможен (это сделало бы
       * thead приклеенным к scrollport контейнера). Поэтому считаем смещение
       * вручную и применяем translate3d к #dg-dim-thead с поправкой на высоту
       * .app-header. Paritet с my-products.scripts.html.
       */
      var FLOATING_HEADER_OFFSET_PX = 2;
      var FLOATING_HEADER_START_EPS_PX = 3;
      var dimFloatingHeaderRaf = 0;
      var dimFloatingLastScrollTs = 0;

      function getDimStickyTopPx() {
        var app = document.querySelector('.app-container');
        var header = document.querySelector('.app-header');
        var fixed = Boolean(app && app.classList && app.classList.contains('fixed-header'));
        if (!fixed) return 0;
        if (!header || !header.getBoundingClientRect) return 60;
        var rect = header.getBoundingClientRect();
        var h = rect && rect.height ? rect.height : 60;
        return h > 0 ? h : 60;
      }

      function captureDimTheadBaseTop() {
        var thead = document.getElementById('dg-dim-thead');
        if (!thead) return;
        thead.style.transform = '';
        thead.style.position = '';
        thead.style.zIndex = '';
        thead.style.willChange = '';
        thead.removeAttribute('data-dg-floating');
        var rect = thead.getBoundingClientRect();
        var absTop = (window.scrollY || window.pageYOffset || 0) + (rect && rect.top ? rect.top : 0);
        thead.setAttribute('data-dg-base-top', String(absTop));
      }

      function updateDimFloatingHeader() {
        var thead = document.getElementById('dg-dim-thead');
        if (!thead) return;
        var table = thead.closest('table');
        if (!table || !table.getBoundingClientRect) return;
        var row = thead.querySelector('tr');
        if (!row) return;

        var y = window.scrollY || window.pageYOffset || 0;
        var headerTop = getDimStickyTopPx();

        var baseTopAbs = Number(thead.getAttribute('data-dg-base-top') || 0);
        if (!Number.isFinite(baseTopAbs) || baseTopAbs <= 0) return;
        var tableRect = table.getBoundingClientRect();
        var tableBottom = tableRect.bottom + y;
        var rowRect = row.getBoundingClientRect();
        var rowHeight = rowRect && rowRect.height ? rowRect.height : 0;

        var headerLine = y + headerTop;
        var start = baseTopAbs + FLOATING_HEADER_START_EPS_PX;
        var end = tableBottom - rowHeight;
        if (headerLine <= start || headerLine >= end) {
          if (thead.style.transform) {
            thead.style.transform = '';
            thead.style.position = '';
            thead.style.zIndex = '';
            thead.style.willChange = '';
            thead.removeAttribute('data-dg-floating');
          }
          return;
        }

        var zoomAwareOffset = FLOATING_HEADER_OFFSET_PX;
        var dpr = window.devicePixelRatio || 1;
        if (Math.abs(dpr - 1) < 0.03) zoomAwareOffset = FLOATING_HEADER_OFFSET_PX - 3;
        var shift = Math.max(0, headerLine - start - zoomAwareOffset);
        var shiftPx = Number(shift.toFixed(3));
        var nextTransform = 'translate3d(0,' + shiftPx + 'px,0)';
        if (thead.style.transform !== nextTransform) {
          thead.style.transform = nextTransform;
          thead.style.position = 'relative';
          thead.style.zIndex = '25';
          thead.style.willChange = 'transform';
          thead.setAttribute('data-dg-floating', '1');
        }
      }

      function dimFloatingHeaderTick(ts) {
        dimFloatingHeaderRaf = 0;
        updateDimFloatingHeader();
        if (ts - dimFloatingLastScrollTs < 140) {
          dimFloatingHeaderRaf = requestAnimationFrame(dimFloatingHeaderTick);
        }
      }

      function scheduleFloatingHeaderUpdate() {
        dimFloatingLastScrollTs = performance.now();
        if (dimFloatingHeaderRaf) return;
        dimFloatingHeaderRaf = requestAnimationFrame(dimFloatingHeaderTick);
      }

      function dimRefreshFloatingAfterLayout() {
        requestAnimationFrame(function () {
          captureDimTheadBaseTop();
          scheduleFloatingHeaderUpdate();
        });
      }

      function bindStickyTopVar() {
        /** CSS-переменная больше не нужна (sticky-th — fallback на top: 0),
            но мы её обновляем для согласованности с темой и на случай других CSS-правок. */
        function syncCssVar() {
          var top = getDimStickyTopPx();
          document.documentElement.style.setProperty('--dg-table-sticky-top', top + 'px');
        }
        syncCssVar();
        window.addEventListener('resize', function () {
          syncCssVar();
          dimRefreshFloatingAfterLayout();
        });
        var hdr = document.querySelector('.app-header');
        if (hdr && window.ResizeObserver) {
          try {
            var ro = new ResizeObserver(function () {
              syncCssVar();
              dimRefreshFloatingAfterLayout();
            });
            ro.observe(hdr);
          } catch (e) {}
        }
        if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {
          document.fonts.ready.then(function () {
            syncCssVar();
            dimRefreshFloatingAfterLayout();
          });
        }
        window.addEventListener('load', function () {
          syncCssVar();
          dimRefreshFloatingAfterLayout();
        });
        /** Слушатели скролла на всех релевантных контейнерах (paritet с my-products). */
        window.addEventListener('scroll', scheduleFloatingHeaderUpdate, { passive: true });
        var appOuter = document.querySelector('.app-main__outer');
        if (appOuter) appOuter.addEventListener('scroll', scheduleFloatingHeaderUpdate, { passive: true });
        var outer = document.getElementById('dg-dim-table-scroll-outer');
        if (outer) outer.addEventListener('scroll', scheduleFloatingHeaderUpdate, { passive: true });
        captureDimTheadBaseTop();
      }

      /* ====================== Tooltip «3 последних правки» ===================== */

      /**
       * Мини-tooltip, который появляется при наведении на ячейку «Кто замерял» или
       * на любой инпут редактируемого поля габаритов. Источник: GET /log с лимитом 3.
       *   - На «Кто замерял»: 3 последних правки **по позиции** (любого поля).
       *   - На инпутах: 3 последних правки **именно этого поля** (field=...).
       *
       * Кэш на 60s в `tipCache`, чтобы не дёргать сервер при быстром hover.
       * Не использует глобальный datagon-tooltip — это локальный custom popup,
       * специфичный для журнала ms_dimensions_log.
       */
      var tipCache = {};
      var TIP_CACHE_TTL_MS = 60000;
      var tipEl = null;
      var tipShowTimer = null;
      var tipHideTimer = null;
      var tipCurrentTarget = null;

      function ensureTipEl() {
        if (tipEl) return tipEl;
        tipEl = document.createElement('div');
        tipEl.className = 'dg-dim-cell-tip';
        tipEl.setAttribute('role', 'tooltip');
        tipEl.style.display = 'none';
        document.body.appendChild(tipEl);
        tipEl.addEventListener('mouseenter', cancelHideTip);
        tipEl.addEventListener('mouseleave', scheduleHideTip);
        return tipEl;
      }

      function positionTip(target) {
        if (!tipEl || !target) return;
        var r = target.getBoundingClientRect();
        tipEl.style.maxWidth = '360px';
        tipEl.style.left = '-9999px';
        tipEl.style.top = '-9999px';
        tipEl.style.display = '';
        var tipRect = tipEl.getBoundingClientRect();
        var top = r.bottom + 6 + window.scrollY;
        var left = r.left + window.scrollX;
        var maxLeft = window.scrollX + document.documentElement.clientWidth - tipRect.width - 8;
        if (left > maxLeft) left = Math.max(window.scrollX + 8, maxLeft);
        tipEl.style.left = left + 'px';
        tipEl.style.top = top + 'px';
      }

      function renderTipContent(rows, field) {
        if (!rows || rows.length === 0) {
          return '<div class="dg-dim-cell-tip-empty">' +
            (field ? 'Это поле ещё не правили.' : 'Журнал по позиции пуст.') +
            '</div>';
        }
        var title = field
          ? 'Последние правки поля «' + escapeHtml(rows[0].field_label || FIELD_LABELS[field] || field) + '»'
          : 'Последние правки по позиции';
        var out = '<div class="dg-dim-cell-tip-title">' + title + '</div><ul class="dg-dim-cell-tip-list">';
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i] || {};
          var fld = field ? '' : '<span class="dg-dim-cell-tip-field">' + escapeHtml(r.field_label || r.field) + ':</span> ';
          var oldV = r.old_value == null ? '∅' : escapeHtml(r.old_value);
          var newV = r.new_value == null ? '∅' : escapeHtml(r.new_value);
          var who = r.changed_by_name || ('user#' + (r.changed_by_user_id || '—'));
          var actRaw = String(r.action || 'set');
          var actCls = 'action-' + actRaw;
          out += '<li>' +
            '<div class="dg-dim-cell-tip-row1"><span class="dg-dim-cell-tip-when">' + escapeHtml(formatDateTimeMsk(r.changed_at)) + '</span>' +
            ' · <span class="dg-dim-cell-tip-who">' + escapeHtml(who) + '</span>' +
            ' · <span class="dg-dim-log-action ' + actCls + '" title="' + escapeHtml(actRaw) + '">' + escapeHtml(actionLabel(actRaw)) + '</span></div>' +
            '<div class="dg-dim-cell-tip-row2">' + fld +
            '<span class="dg-dim-cell-tip-old">' + oldV + '</span> → ' +
            '<span class="dg-dim-cell-tip-new">' + newV + '</span></div>' +
            '</li>';
        }
        out += '</ul>';
        return out;
      }

      function showTipFor(target) {
        if (!target) return;
        var code = target.getAttribute('data-dg-code') || target.getAttribute('data-dg-tip-code') || '';
        var field = target.getAttribute('data-dg-field') || target.getAttribute('data-dg-tip-field') || '';
        if (!code) return;
        ensureTipEl();
        var cacheKey = code + '/' + (field || '*');
        var now = Date.now();
        var cached = tipCache[cacheKey];
        if (cached && now - cached.ts < TIP_CACHE_TTL_MS) {
          tipEl.innerHTML = renderTipContent(cached.rows, field);
          positionTip(target);
          return;
        }
        tipEl.innerHTML = '<div class="dg-dim-cell-tip-loading">Загрузка журнала…</div>';
        positionTip(target);
        var qs = new URLSearchParams({ code: String(code), limit: '3' });
        if (field) qs.set('field', field);
        fetch('/api/exports/dimensions/log?' + qs.toString(), { credentials: 'same-origin' })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            if (!x.ok || !x.j || x.j.success === false) {
              if (tipCurrentTarget === target) {
                tipEl.innerHTML = '<div class="dg-dim-cell-tip-err">' +
                  escapeHtml((x.j && x.j.error) || 'Не удалось загрузить') + '</div>';
              }
              return;
            }
            var rows = (x.j.rows || []).slice(0, 3);
            tipCache[cacheKey] = { ts: Date.now(), rows: rows };
            if (tipCurrentTarget === target) {
              tipEl.innerHTML = renderTipContent(rows, field);
              positionTip(target);
            }
          })
          .catch(function (e) {
            if (tipCurrentTarget === target) {
              tipEl.innerHTML = '<div class="dg-dim-cell-tip-err">Сетевая ошибка</div>';
            }
          });
      }

      function scheduleShowTip(target) {
        cancelShowTip();
        tipCurrentTarget = target;
        tipShowTimer = setTimeout(function () { showTipFor(target); }, 350);
      }

      function scheduleHideTip() {
        cancelHideTip();
        tipHideTimer = setTimeout(function () {
          if (tipEl) tipEl.style.display = 'none';
          tipCurrentTarget = null;
        }, 150);
      }

      function cancelShowTip() {
        if (tipShowTimer) { clearTimeout(tipShowTimer); tipShowTimer = null; }
      }
      function cancelHideTip() {
        if (tipHideTimer) { clearTimeout(tipHideTimer); tipHideTimer = null; }
      }

      function tipTargetFromEvent(target) {
        if (!target || !target.closest) return null;
        var inp = target.closest('.dg-dim-input[data-dg-code][data-dg-field]');
        if (inp) return inp;
        var span = target.closest('.dg-dim-tip-measured-by[data-dg-tip-code]');
        if (span) return span;
        return null;
      }

      /**
       * Сбросить кэш tooltip по конкретной позиции/полю. Вызывается после
       * успешного сохранения значения или отката — чтобы при следующем hover
       * пользователь увидел актуальную тройку.
       */
      function invalidateTipCache(code, field) {
        if (!code) return;
        try {
          if (field) {
            delete tipCache[code + '/' + field];
            delete tipCache[code + '/*'];
          } else {
            for (var k in tipCache) {
              if (Object.prototype.hasOwnProperty.call(tipCache, k) && k.indexOf(code + '/') === 0) {
                delete tipCache[k];
              }
            }
          }
        } catch (e) {}
      }
      window.__dgDimInvalidateTip = invalidateTipCache;

      function bindCellTooltips() {
        var tbody = document.getElementById('dg-dim-tbody');
        if (!tbody) return;
        tbody.addEventListener('mouseover', function (ev) {
          var t = tipTargetFromEvent(ev.target);
          if (!t) return;
          cancelHideTip();
          if (tipCurrentTarget === t) return;
          scheduleShowTip(t);
        });
        tbody.addEventListener('mouseout', function (ev) {
          var t = tipTargetFromEvent(ev.target);
          if (!t) return;
          var related = ev.relatedTarget;
          if (related && tipEl && tipEl.contains(related)) return;
          if (related && tipTargetFromEvent(related) === t) return;
          cancelShowTip();
          scheduleHideTip();
        });
        function dismissOnScroll() {
          cancelShowTip();
          if (tipEl && tipEl.style.display !== 'none') {
            tipEl.style.display = 'none';
            tipCurrentTarget = null;
          }
        }
        window.addEventListener('scroll', dismissOnScroll, { passive: true, capture: true });
        var appOuter = document.querySelector('.app-main__outer');
        if (appOuter) appOuter.addEventListener('scroll', dismissOnScroll, { passive: true });
        var outer = document.getElementById('dg-dim-table-scroll-outer');
        if (outer) outer.addEventListener('scroll', dismissOnScroll, { passive: true });
      }

      /* ====================== Карточка «Журнал изменений габаритов» (ms_dimensions_log) ===================== */

      var HISTORY_COLLAPSED_KEY = 'dg.dim.history-card.collapsed.v1';
      var historyState = {
        offset: 0,
        limit: 100,
        total: 0,
        loaded: false,
        loading: false,
        lastFilters: null,
      };

      function getHistoryFilters() {
        function val(id) {
          var el = document.getElementById(id);
          return el ? String(el.value || '').trim() : '';
        }
        var lim = Number(val('dg-dim-h-limit')) || 100;
        return {
          search: val('dg-dim-h-search'),
          action: val('dg-dim-h-action'),
          field: val('dg-dim-h-field'),
          who: val('dg-dim-h-who'),
          from: val('dg-dim-h-from'),
          to: val('dg-dim-h-to'),
          limit: Math.max(1, Math.min(500, lim)),
        };
      }

      function loadHistory(opts) {
        var tbody = document.getElementById('dg-dim-history-tbody');
        var hint = document.getElementById('dg-dim-history-hint');
        var summary = document.getElementById('dg-dim-history-summary');
        if (!tbody) return Promise.resolve();
        var o = opts && typeof opts === 'object' ? opts : {};
        var filters = getHistoryFilters();
        var offset = Math.max(0, Number.isFinite(Number(o.offset)) ? Number(o.offset) : 0);
        historyState.lastFilters = filters;
        historyState.limit = filters.limit;
        historyState.loading = true;
        tbody.innerHTML = '<tr><td colspan="6" class="text-muted small py-3 text-center">Загрузка ms_dimensions_log…</td></tr>';
        if (hint) hint.textContent = '—';
        var qs = new URLSearchParams();
        if (filters.search) qs.set('search', filters.search);
        if (filters.action) qs.set('action', filters.action);
        if (filters.field) qs.set('field', filters.field);
        if (filters.who) qs.set('who', filters.who);
        if (filters.from) qs.set('from', filters.from);
        if (filters.to) qs.set('to', filters.to);
        qs.set('limit', String(filters.limit));
        qs.set('offset', String(offset));
        return fetch('/api/exports/dimensions/log/global?' + qs.toString(), { credentials: 'same-origin' })
          .then(function (r) {
            return r.json().then(function (j) { return { ok: r.ok, j: j }; });
          })
          .then(function (x) {
            historyState.loading = false;
            if (!x.ok || !x.j || x.j.success === false) {
              tbody.innerHTML = '<tr><td colspan="6" class="text-danger small py-3 text-center">' +
                escapeHtml((x.j && x.j.error) || 'Ошибка загрузки ms_dimensions_log') + '</td></tr>';
              if (hint) hint.textContent = '—';
              if (summary) summary.textContent = '';
              return;
            }
            historyState.total = Number(x.j.total || 0);
            historyState.limit = Number(x.j.limit || filters.limit);
            historyState.offset = Number(x.j.offset || offset);
            historyState.loaded = true;
            renderHistoryRows(x.j.rows || []);
            updateHistoryHint();
            if (summary) {
              var any = !!(filters.search || filters.action || filters.field || filters.who || filters.from || filters.to);
              summary.textContent = '(' + historyState.total + (any ? ' под фильтр' : ' всего') + ')';
            }
          })
          .catch(function (e) {
            historyState.loading = false;
            tbody.innerHTML = '<tr><td colspan="6" class="text-danger small py-3 text-center">Сетевая ошибка: ' +
              escapeHtml((e && e.message) || String(e)) + '</td></tr>';
            if (hint) hint.textContent = '—';
          });
      }

      function renderHistoryRows(rows) {
        var tbody = document.getElementById('dg-dim-history-tbody');
        if (!tbody) return;
        if (!Array.isArray(rows) || rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-muted small py-3 text-center">Нет записей под текущие фильтры.</td></tr>';
          return;
        }
        var out = '';
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i] || {};
          var actionRaw = String(r.action || 'set');
          var actionCls = 'action-' + actionRaw;
          var who = r.changed_by_name || ('user#' + (r.changed_by_user_id || '—'));
          var oldVal = r.old_value == null ? '<span class="text-muted">∅</span>' : '<span class="dg-dim-history-old">' + escapeHtml(r.old_value) + '</span>';
          var newVal = r.new_value == null ? '<span class="text-muted">∅</span>' : '<span class="dg-dim-history-new">' + escapeHtml(r.new_value) + '</span>';
          var noteSuffix = r.note ? '<div class="dg-dim-history-note">' + escapeHtml(r.note) + '</div>' : '';
          var nameTitle = r.name ? escapeHtml(r.name) : '';
          out += '<tr>' +
            '<td>' + escapeHtml(formatDateTimeMsk(r.changed_at)) + '</td>' +
            '<td><div class="dg-dim-history-name" title="' + nameTitle + '">' +
              (r.name ? escapeHtml(r.name) : '<span class="text-muted">—</span>') +
              '</div><div class="dg-dim-history-code">' + escapeHtml(r.code || '') +
              (r.type ? ' · ' + escapeHtml(r.type) : '') + '</div></td>' +
            '<td>' + escapeHtml(who) + '</td>' +
            '<td><span class="dg-dim-log-action ' + actionCls + '" title="' + escapeHtml(actionRaw) + '">' + escapeHtml(actionLabel(actionRaw)) + '</span></td>' +
            '<td>' + escapeHtml(r.field_label || r.field || '') + '</td>' +
            '<td>' + oldVal + '<span class="dg-dim-log-arrow">→</span>' + newVal + noteSuffix + '</td>' +
            '</tr>';
        }
        tbody.innerHTML = out;
      }

      function updateHistoryHint() {
        var hint = document.getElementById('dg-dim-history-hint');
        var prev = document.getElementById('dg-dim-history-prev');
        var next = document.getElementById('dg-dim-history-next');
        if (!hint) return;
        var total = historyState.total || 0;
        var limit = historyState.limit || 100;
        var offset = historyState.offset || 0;
        var pages = total > 0 ? Math.max(1, Math.ceil(total / limit)) : 1;
        var current = Math.floor(offset / limit) + 1;
        var shown = Math.min(limit, Math.max(0, total - offset));
        hint.textContent = 'Найдено: ' + total + '; страница ' + current + '/' + pages + '; показано: ' + shown;
        if (prev) prev.disabled = offset <= 0;
        if (next) next.disabled = (offset + limit) >= total;
      }

      function resetHistoryFilters() {
        ['dg-dim-h-search', 'dg-dim-h-action', 'dg-dim-h-field', 'dg-dim-h-who', 'dg-dim-h-from', 'dg-dim-h-to'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.value = '';
        });
        var lim = document.getElementById('dg-dim-h-limit');
        if (lim) lim.value = '100';
      }

      function bindHistoryCard() {
        var body = document.getElementById('dg-dim-history-body');
        var toggle = document.getElementById('dg-dim-history-toggle');
        if (!body || !toggle) return;

        function applyCollapsed(collapsed) {
          if (collapsed) {
            body.classList.add('d-none');
            toggle.textContent = 'Развернуть';
          } else {
            body.classList.remove('d-none');
            toggle.textContent = 'Свернуть';
          }
        }

        var initialCollapsed = true;
        try {
          var v = localStorage.getItem(HISTORY_COLLAPSED_KEY);
          if (v === '0') initialCollapsed = false;
        } catch (e) {}
        applyCollapsed(initialCollapsed);
        if (!initialCollapsed && !historyState.loaded) {
          loadHistory({ offset: 0 });
        }

        toggle.addEventListener('click', function () {
          var nowCollapsed = !body.classList.contains('d-none');
          applyCollapsed(nowCollapsed);
          try {
            localStorage.setItem(HISTORY_COLLAPSED_KEY, nowCollapsed ? '1' : '0');
          } catch (e) {}
          if (!nowCollapsed && !historyState.loaded) {
            loadHistory({ offset: 0 });
          }
          dimRefreshFloatingAfterLayout();
        });

        var apply = document.getElementById('dg-dim-h-apply');
        if (apply) apply.addEventListener('click', function () { loadHistory({ offset: 0 }); });
        var reset = document.getElementById('dg-dim-h-reset');
        if (reset) reset.addEventListener('click', function () {
          resetHistoryFilters();
          loadHistory({ offset: 0 });
        });
        var refresh = document.getElementById('dg-dim-history-refresh');
        if (refresh) refresh.addEventListener('click', function () {
          if (body.classList.contains('d-none')) {
            applyCollapsed(false);
            try { localStorage.setItem(HISTORY_COLLAPSED_KEY, '0'); } catch (e) {}
          }
          loadHistory({ offset: historyState.offset || 0 });
        });
        var prev = document.getElementById('dg-dim-history-prev');
        if (prev) prev.addEventListener('click', function () {
          if (prev.disabled) return;
          var newOffset = Math.max(0, (historyState.offset || 0) - (historyState.limit || 100));
          loadHistory({ offset: newOffset });
        });
        var next = document.getElementById('dg-dim-history-next');
        if (next) next.addEventListener('click', function () {
          if (next.disabled) return;
          var newOffset = (historyState.offset || 0) + (historyState.limit || 100);
          if (newOffset >= (historyState.total || 0)) return;
          loadHistory({ offset: newOffset });
        });
        var lim = document.getElementById('dg-dim-h-limit');
        if (lim) lim.addEventListener('change', function () { loadHistory({ offset: 0 }); });

        ['dg-dim-h-search', 'dg-dim-h-who'].forEach(function (id) {
          var el = document.getElementById(id);
          if (!el) return;
          el.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter') {
              ev.preventDefault();
              loadHistory({ offset: 0 });
            }
          });
        });
      }

      function init() {
        var saved = loadSavedFilters();
        if (saved) state.applied = cloneFilters(saved);
        state.pending = cloneFilters(state.applied);
        applyFormFromState(state.applied);

        visibleCols = loadVisibleCols();
        columnWidths = loadColumnWidths();
        buildColgroup();
        buildThead();
        renderColumnControls();

        bindEvents();
        bindHeaderSearchMirror();
        bindSort();
        bindCellEditors();
        bindLogModal();
        bindColumnsToolbox();
        bindSyncAllButton();
        bindPackingTypesRefresh();
        bindCardCollapse(FILTERS_COLLAPSED_KEY, 'dg-dim-filters-body', 'dg-dim-filters-toggle');
        bindCardCollapse(TABLE_COLLAPSED_KEY, 'dg-dim-table-body', 'dg-dim-table-toggle');
        bindHistoryCard();
        bindCellTooltips();
        bindStickyTopVar();
        /** Подгружаем справочник «Тип упаковки» параллельно загрузке списка; если он
         *  успеет — packing_type-ячейки сразу будут <select>; иначе перерисуем после. */
        loadPackingTypes(false)
          .then(function () {
            /** Если таблица уже отрендерилась без опций — пересоберём только packing_type. */
            var tbody = document.getElementById('dg-dim-tbody');
            if (!tbody) return;
            var selects = tbody.querySelectorAll('select.dg-dim-input[data-dg-field="packing_type"], input.dg-dim-input[data-dg-field="packing_type"]');
            if (selects.length === 0) return;
            var col = null;
            for (var i = 0; i < DIM_COLS.length; i++) { if (DIM_COLS[i].key === 'packing_type') { col = DIM_COLS[i]; break; } }
            if (!col) return;
            for (var s = 0; s < selects.length; s++) {
              var code = selects[s].getAttribute('data-dg-code');
              var row = findRowByCode(code);
              if (!row) continue;
              var td = selects[s].closest('td');
              if (td) td.innerHTML = col.render(row, col);
            }
          })
          .catch(function () { /** ignore — справочник можно подтянуть кнопкой «🔄 Тип упаковки» позже */ });
        loadList();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
