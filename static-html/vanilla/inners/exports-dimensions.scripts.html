  <script>
    (function () {
      var LIST_URL = '/api/exports/dimensions/list';
      var STORAGE_KEY = 'datagon_dimensions_filters_v1';
      var FILTERS_COLLAPSED_KEY = 'datagon_dimensions_filters_collapsed_v1';
      var TABLE_COLLAPSED_KEY = 'datagon_dimensions_table_collapsed_v1';
      var VISIBLE_COLS_KEY = 'datagon_dimensions_visible_cols_v2';
      var COL_WIDTHS_KEY = 'datagon_dimensions_col_widths_v2';

      var DEFAULT_FILTERS = {
        search: '',
        type: 'all',
        measure_scope: 'all',
        mp_scope: 'all',
        problem_profile: '',
        limit: 100,
      };

      var state = {
        applied: cloneFilters(DEFAULT_FILTERS),
        pending: cloneFilters(DEFAULT_FILTERS),
        lastPostFiltered: false,
        lastPostFilterCap: 0,
        lastPostFilterTruncated: false,
        lastPostFilterMatchCap: 0,
        sortBy: 'code',
        sortDir: 'asc',
        offset: 0,
        total: 0,
        loading: false,
        rows: [],
        lastError: '',
      };

      function cloneFilters(src) {
        var measure = String((src && src.measure_scope) || '');
        if (!measure && src && src.scope) {
          var leg = String(src.scope || '').trim();
          if (leg === 'with' || leg === 'without') measure = leg;
        }
        if (!measure) measure = 'all';
        return {
          search: String((src && src.search) || ''),
          type: String((src && src.type) || 'all'),
          measure_scope: measure,
          mp_scope: 'all',
          problem_profile: String((src && src.problem_profile) || ''),
          limit: Number((src && src.limit) || 100) || 100,
        };
      }

      function loadSavedFilters() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          var v = JSON.parse(raw);
          if (!v || typeof v !== 'object') return null;
          return cloneFilters(v);
        } catch (e) {
          return null;
        }
      }

      function persistFilters() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.applied));
        } catch (e) {}
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function syncProblemSwitchFromFilters(f) {
        f = f || {};
        var prob = String(f.problem_profile || '').trim();
        var sw = document.getElementById('dg-dim-problem-stock-switch');
        if (sw) sw.checked = prob === 'stock_missing';
      }

      function applyFormFromState(s) {
        var elSearch = document.getElementById('dg-dim-f-search');
        var elType = document.getElementById('dg-dim-f-type');
        var elMeasure = document.getElementById('dg-dim-f-measure-scope');
        var elLimit = document.getElementById('dg-dim-f-limit');
        var elMirror = document.getElementById('dg-dim-table-search-mirror');
        if (elSearch) elSearch.value = s.search;
        if (elType) elType.value = s.type;
        if (elMeasure) elMeasure.value = s.measure_scope || 'all';
        if (elLimit) elLimit.value = String(s.limit);
        if (elMirror) elMirror.value = s.search;
        syncProblemSwitchFromFilters(s);
      }

      function readFormToPending() {
        var elSearch = document.getElementById('dg-dim-f-search');
        var elType = document.getElementById('dg-dim-f-type');
        var elMeasure = document.getElementById('dg-dim-f-measure-scope');
        var elLimit = document.getElementById('dg-dim-f-limit');
        state.pending.search = elSearch ? String(elSearch.value || '').trim() : '';
        state.pending.type = elType ? String(elType.value || 'all') : 'all';
        state.pending.measure_scope = elMeasure ? String(elMeasure.value || 'all') : 'all';
        var swProb = document.getElementById('dg-dim-problem-stock-switch');
        state.pending.problem_profile = swProb && swProb.checked ? 'stock_missing' : '';
        state.pending.mp_scope = 'all';
        var limNum = Number((elLimit && elLimit.value) || 100);
        state.pending.limit = Number.isFinite(limNum) && limNum > 0 ? limNum : 100;
        syncProblemSwitchFromFilters(state.pending);
      }

      function setStatusHint(msg, kind) {
        var el = document.getElementById('dg-dim-status-hint');
        if (!el) return;
        el.classList.remove('text-danger', 'text-success', 'text-muted');
        if (kind === 'error') el.classList.add('text-danger');
        else if (kind === 'success') el.classList.add('text-success');
        else el.classList.add('text-muted');
        el.textContent = String(msg || '');
      }

      function formatDateTimeMsk(value) {
        if (!value) return '';
        var d;
        try {
          d = new Date(value);
        } catch (e) {
          return String(value);
        }
        if (!d || isNaN(d.getTime())) return String(value);
        try {
          return d.toLocaleString('ru-RU', { timeZone: 'Europe/Moscow' });
        } catch (e) {
          return d.toISOString();
        }
      }

      function commitFilters() {
        readFormToPending();
        state.applied = cloneFilters(state.pending);
        state.offset = 0;
        persistFilters();
        loadList();
      }

      function resetFilters() {
        state.pending = cloneFilters(DEFAULT_FILTERS);
        state.applied = cloneFilters(DEFAULT_FILTERS);
        state.offset = 0;
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {}
        applyFormFromState(state.applied);
        loadList();
      }

      /**
       * Единый источник правды для колонок таблицы «Габариты» (moysklad baseline:
       * `datagon-list-page-baseline-moysklad.mdc`). Один массив используется в
       * 4 местах одновременно — `<colgroup>`, `<thead>`, `<tbody>`, панели
       * «🧩 Столбцы» / «📏 Ширины». Запрещено держать отдельный массив для
       * видимости столбцов и отдельный — для ширин.
       *   key       — стабильный ключ для localStorage.
       *   label     — подпись в шапке и в обоих toolbox-панелях.
       *   width     — ширина по умолчанию (px). Сейчас же — минимальная.
       *   minW      — нижняя граница в панели «Ширины».
       *   sortable  — клик по `<th>` переключает сортировку (используется `sortKey || key`).
       *   render    — фабрика HTML ячейки для строки данных.
       *   isNumeric — табличная вёрстка чисел (tabular-nums, выравнивание по правому краю).
       */
      /**
       * Источник значения колонки замера для строки. Приоритет:
       *   1. override   — пользовательская правка (`measurement[key]`).
       *   2. ms         — атрибут МС (`dimensions_ms[key]` для числовых).
       *   3. parsed     — выведено из «Тип упаковки» (см. dimensions_parsed).
       *   4. empty      — нет источника.
       *
       * Возвращает `{ value, source }`, где `value` — Number|String|null.
       * Для строки `packing_type` источник всегда либо `override`, либо `ms`.
       */
      function resolveCellSource(row, key) {
        var measurement = row && row.measurement;
        if (measurement && measurement[key] != null && String(measurement[key]).trim() !== '') {
          return { value: measurement[key], source: 'override' };
        }
        var dims = row && row.dimensions_ms;
        if (dims && dims[key] != null && String(dims[key]).trim() !== '') {
          var raw = String(dims[key]).trim();
          /** Для числовых полей пытаемся достать число из МС-строки (там часто «30» или «30,5»). */
          if (key !== 'packing_type') {
            var n = Number(raw.replace(',', '.'));
            if (Number.isFinite(n)) return { value: n, source: 'ms' };
          } else {
            return { value: raw, source: 'ms' };
          }
        }
        var parsed = row && row.dimensions_parsed;
        if (parsed && parsed[key] != null) {
          return { value: parsed[key], source: 'parsed' };
        }
        return { value: null, source: 'empty' };
      }

      /**
       * Для упаковки-«пакета» «Высота — коробка» бессмысленна (и наоборот). Возвращает
       * `true`, если поле логически НЕприменимо для текущего вида упаковки.
       *   bag         → height_box_cm disabled
       *   box         → height_bag_cm disabled
       *   custom_box  → height_bag_cm disabled (своя коробка)
       *   unknown/empty → ничего не блокируем
       */
      function isFieldDisabledForPacking(row, key) {
        var parsed = row && row.dimensions_parsed;
        var kind = parsed && parsed.kind ? String(parsed.kind) : 'unknown';
        if (kind === 'bag' && key === 'height_box_cm') return true;
        if ((kind === 'box' || kind === 'custom_box') && key === 'height_bag_cm') return true;
        return false;
      }

      function formatNumericForInput(v) {
        if (v == null || v === '') return '';
        var n = Number(v);
        if (!Number.isFinite(n)) return String(v);
        /** Без хвостовых нулей: 30 → "30", 30.5 → "30.5". */
        return String(Math.round(n * 1000) / 1000);
      }

      /** Справочник «Тип упаковки» (customentity из МС). Загружается через
       *  GET /api/exports/dimensions/packing-types и попадает в `<select>` ячеек. */
      var packingTypes = [];
      var packingTypesLoadedAt = 0;

      function loadPackingTypes(force) {
        var url = '/api/exports/dimensions/packing-types' + (force ? '?refresh=1' : '');
        return fetch(url, { credentials: 'same-origin' })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            if (x.ok && x.j && x.j.success !== false && Array.isArray(x.j.rows)) {
              packingTypes = x.j.rows;
              packingTypesLoadedAt = Date.now();
              return packingTypes;
            }
            throw new Error((x.j && x.j.error) || 'Ошибка загрузки справочника');
          });
      }

      function renderEditableCell(row, col) {
        var key = col.key;
        var disabled = isFieldDisabledForPacking(row, key);
        var resolved = disabled ? { value: null, source: 'empty' } : resolveCellSource(row, key);
        var isNumber = col.isNumeric === true || key === 'weight_kg';
        var attrs = '';
        attrs += ' data-dg-code="' + escapeHtml(row.code) + '"';
        attrs += ' data-dg-field="' + escapeHtml(key) + '"';
        attrs += ' data-source="' + (disabled ? 'disabled' : resolved.source) + '"';
        if (disabled) attrs += ' disabled title="Это поле не применимо для текущего «Типа упаковки»"';
        var displayVal = '';
        if (!disabled && resolved.value != null) {
          displayVal = isNumber ? formatNumericForInput(resolved.value) : String(resolved.value);
        }
        /** Специальный рендер для packing_type: <select> из справочника МС. */
        if (key === 'packing_type') {
          var sel = '<select class="dg-dim-input"' + attrs + '>';
          sel += '<option value=""></option>';
          var seen = {};
          var current = String(displayVal || '').trim();
          for (var i = 0; i < packingTypes.length; i++) {
            var t = packingTypes[i] || {};
            var name = String(t.name || '').trim();
            if (!name) continue;
            seen[name] = true;
            sel += '<option value="' + escapeHtml(name) + '"' +
              (name === current ? ' selected' : '') + '>' + escapeHtml(name) + '</option>';
          }
          /** Если текущее значение есть, но в справочнике его нет — добавим как
           *  «грязный» вариант (не из справочника), чтобы пользователь видел реальное. */
          if (current && !seen[current]) {
            sel += '<option value="' + escapeHtml(current) + '" selected>' +
              escapeHtml(current) + ' (не из справочника)</option>';
          }
          sel += '</select>';
          return sel;
        }
        var inputType = isNumber ? 'number' : 'text';
        var stepAttr = isNumber ? (key === 'weight_kg' ? ' step="0.001" min="0"' : ' step="0.1" min="0"') : '';
        var placeholder = disabled
          ? '— не применимо —'
          : (resolved.source === 'empty' ? '—' : '');
        return '<input class="dg-dim-input" type="' + inputType + '"' + stepAttr +
          ' value="' + escapeHtml(displayVal) + '" placeholder="' + escapeHtml(placeholder) + '"' + attrs + ' />';
      }

      /** Cell для атрибутов МС у которых нет user-override (старый display-only fallback). */
      function fmtCellMs(row, col) {
        var dims = row && row.dimensions_ms;
        var raw = dims && typeof dims === 'object' ? dims[col.key] : null;
        var has = raw != null && String(raw).trim() !== '';
        return has ? escapeHtml(String(raw).trim()) : '<span class="dg-dim-empty">—</span>';
      }

      var DIM_COLS = [
        {
          key: 'code',
          label: 'Код',
          width: 140,
          minW: 90,
          sortable: true,
          isNumeric: false,
          cellClass: 'dg-dim-code',
          render: function (r) {
            var code = escapeHtml(r.code);
            var typeRaw = String(r.type || '').toLowerCase();
            var typeBadge = '';
            if (typeRaw === 'комплект') {
              typeBadge = '<span class="dg-dim-type-badge dg-dim-type-bundle" title="Комплект">КПЛ</span>';
            } else if (typeRaw && typeRaw !== 'товар') {
              typeBadge = '<span class="dg-dim-type-badge" title="' + escapeHtml(r.type) + '">' + escapeHtml(r.type) + '</span>';
            }
            return code + typeBadge;
          },
        },
        {
          key: 'name',
          label: 'Наименование',
          width: 360,
          minW: 180,
          sortable: true,
          isNumeric: false,
          cellClass: 'dg-dim-cell-name',
          cellAttr: function (r) {
            return r && r.name ? ' title="' + escapeHtml(r.name) + '"' : '';
          },
          render: function (r) {
            var nameHtml = r.name
              ? escapeHtml(r.name)
              : '<span class="dg-dim-empty">— без наименования —</span>';
            /** Кнопка «🕘 Лог» рядом с именем: открывает overlay с журналом изменений габаритов (ms_dimensions_log). */
            var logBtn = '<button type="button" class="dg-dim-log-btn" data-dg-log-code="' +
              escapeHtml(r.code) + '" data-dg-log-name="' + escapeHtml(r.name || r.code || '') +
              '" title="Журнал изменений габаритов по позиции (ms_dimensions_log)">🕘 Лог</button>';
            /** Кнопка «↗ В МС» — отправляет user-override габаритов обратно в МойСклад
             *  (POST /api/exports/dimensions/sync-ms). Отображается только если есть
             *  хоть один override; иначе будет показываться как disabled. */
            var hasOverride = r.measurement && (
              r.measurement.length_cm != null ||
              r.measurement.width_cm != null ||
              r.measurement.height_box_cm != null ||
              r.measurement.height_bag_cm != null ||
              r.measurement.weight_kg != null
            );
            var syncBtn = '<button type="button" class="dg-dim-sync-btn" data-dg-sync-code="' +
              escapeHtml(r.code) + '" data-dg-sync-name="' + escapeHtml(r.name || r.code || '') +
              '"' + (hasOverride ? '' : ' data-dg-empty="1"') +
              ' title="' + (hasOverride
                ? 'Отправить отредактированные габариты обратно в МойСклад для этой позиции'
                : 'Нет правок — отправлять в МойСклад нечего') + '">↗ В МС</button>';
            return nameHtml + logBtn + syncBtn;
          },
        },
        {
          key: 'stock',
          label: 'Остаток МС',
          width: 100,
          minW: 70,
          sortable: true,
          isNumeric: true,
          cellClass: 'dg-dim-cell-stock text-end',
          render: function (r) {
            if (r.stock == null) return '<span class="dg-dim-empty">—</span>';
            var n = Number(r.stock);
            if (!Number.isFinite(n)) return '<span class="dg-dim-empty">—</span>';
            var cls = n > 0 ? 'dg-dim-stock-pos' : n < 0 ? 'dg-dim-stock-neg' : 'dg-dim-stock-zero';
            return '<span class="' + cls + '">' + formatNumericForInput(n) + '</span>';
          },
        },
        {
          key: 'measured_by',
          label: '!! Кто замерял',
          width: 150,
          minW: 100,
          sortable: true,
          sortKey: 'measured_by_name',
          isNumeric: false,
          cellClass: 'dg-dim-cell-wrap',
          render: function (r) {
            var measuredBy = String(r.measured_by_name || '').trim();
            var attrs = ' class="dg-dim-tip-measured-by ' +
              (measuredBy ? 'dg-dim-status-yes' : 'dg-dim-status-no') + '"' +
              ' data-dg-tip-code="' + escapeHtml(r.code || '') + '"';
            return '<span' + attrs + '>' +
              (measuredBy ? escapeHtml(measuredBy) : '— не замерен —') +
              '</span>';
          },
        },
        {
          key: 'measured_at',
          label: 'Дата замера',
          width: 110,
          minW: 80,
          sortable: true,
          isNumeric: false,
          cellClass: 'dg-dim-cell-wrap',
          render: function (r) {
            var measuredAt = String(r.measured_at || '').trim();
            return measuredAt
              ? escapeHtml(formatDateTimeMsk(measuredAt))
              : '<span class="dg-dim-empty">—</span>';
          },
        },
        {
          key: 'packing_type',
          label: 'Тип упаковки',
          width: 200,
          minW: 120,
          isNumeric: false,
          cellClass: 'dg-dim-cell-edit dg-dim-cell-packing',
          msAttr: '!!Тип УПАКОВКИ',
          render: renderEditableCell,
        },
        {
          key: 'length_cm',
          label: 'Длина (см)',
          width: 96,
          minW: 70,
          isNumeric: true,
          cellClass: 'dg-dim-cell-edit dg-dim-cell-num',
          msAttr: '!!Длина (см) КОРОБКА/Пакет станд. уп.',
          render: renderEditableCell,
        },
        {
          key: 'width_cm',
          label: 'Ширина (см)',
          width: 96,
          minW: 70,
          isNumeric: true,
          cellClass: 'dg-dim-cell-edit dg-dim-cell-num',
          msAttr: '!!Ширина (см) КОРОБКА/Пакет станд. уп.',
          render: renderEditableCell,
        },
        {
          key: 'height_box_cm',
          label: 'Высота — коробка (см)',
          width: 130,
          minW: 90,
          isNumeric: true,
          cellClass: 'dg-dim-cell-edit dg-dim-cell-num',
          msAttr: '!!Высота (см) КОРОБКА станд. уп.',
          render: renderEditableCell,
        },
        {
          key: 'height_bag_cm',
          label: 'Высота — пакет (см)',
          width: 130,
          minW: 90,
          isNumeric: true,
          cellClass: 'dg-dim-cell-edit dg-dim-cell-num',
          msAttr: '!!Высота (см) Пакет!',
          render: renderEditableCell,
        },
        {
          key: 'weight_kg',
          label: 'Вес (кг)',
          width: 96,
          minW: 70,
          isNumeric: true,
          cellClass: 'dg-dim-cell-edit dg-dim-cell-num',
          msAttr: '!!Вес (кг)',
          render: renderEditableCell,
        },
      ];

      /** Все ключи в порядке колонок — для удобного дефолта/нормализации. */
      var DIM_COL_KEYS = DIM_COLS.map(function (c) { return c.key; });

      function defaultVisibleCols() {
        return new Set(DIM_COL_KEYS);
      }

      function loadVisibleCols() {
        try {
          var raw = localStorage.getItem(VISIBLE_COLS_KEY);
          if (!raw) return defaultVisibleCols();
          var arr = JSON.parse(raw);
          if (!Array.isArray(arr) || arr.length === 0) return defaultVisibleCols();
          var allowed = arr.filter(function (k) { return DIM_COL_KEYS.indexOf(k) !== -1; });
          if (allowed.length === 0) return defaultVisibleCols();
          return new Set(allowed);
        } catch (e) {
          return defaultVisibleCols();
        }
      }

      function saveVisibleCols() {
        try {
          var arr = DIM_COL_KEYS.filter(function (k) { return visibleCols.has(k); });
          localStorage.setItem(VISIBLE_COLS_KEY, JSON.stringify(arr));
        } catch (e) {}
      }

      function loadColumnWidths() {
        try {
          var raw = localStorage.getItem(COL_WIDTHS_KEY);
          if (!raw) return {};
          var obj = JSON.parse(raw);
          if (!obj || typeof obj !== 'object') return {};
          var out = {};
          DIM_COLS.forEach(function (c) {
            var v = Number(obj[c.key]);
            if (Number.isFinite(v) && v > 0) out[c.key] = v;
          });
          return out;
        } catch (e) {
          return {};
        }
      }

      function saveColumnWidths() {
        try {
          localStorage.setItem(COL_WIDTHS_KEY, JSON.stringify(columnWidths));
        } catch (e) {}
      }

      var visibleCols = defaultVisibleCols();
      var columnWidths = {};

      function getColWidth(col) {
        var override = Number(columnWidths[col.key]);
        if (Number.isFinite(override) && override > 0) return Math.max(override, col.minW || 40);
        return col.width || 120;
      }

      function getVisibleColsList() {
        return DIM_COLS.filter(function (c) { return visibleCols.has(c.key); });
      }

      function visibleColCount() {
        return Math.max(1, getVisibleColsList().length);
      }

      function buildColgroup() {
        var cg = document.getElementById('dg-dim-colgroup');
        if (!cg) return;
        var html = '';
        var cols = getVisibleColsList();
        for (var i = 0; i < cols.length; i++) {
          html += '<col style="width:' + getColWidth(cols[i]) + 'px" />';
        }
        cg.innerHTML = html;
        applyTableMinWidth();
      }

      function applyTableMinWidth() {
        var table = document.getElementById('dg-dim-table');
        if (!table) return;
        var cols = getVisibleColsList();
        var sum = 0;
        for (var i = 0; i < cols.length; i++) sum += getColWidth(cols[i]);
        table.style.minWidth = (sum > 0 ? sum : 1200) + 'px';
      }

      function buildThead() {
        var thead = document.getElementById('dg-dim-thead');
        if (!thead) return;
        var cols = getVisibleColsList();
        var tr = '<tr>';
        for (var i = 0; i < cols.length; i++) {
          var c = cols[i];
          var attrs = ' data-dg-col-key="' + c.key + '"';
          var cls = c.sortable ? ' class="dg-dim-sortable"' : '';
          if (c.sortable) attrs += ' data-dg-sort="' + (c.sortKey || c.key) + '"';
          var titleAttr = c.msAttr ? ' title="Атрибут МойСклад: ' + escapeHtml(c.msAttr) + '"' : '';
          tr += '<th' + cls + attrs + titleAttr + '>' + escapeHtml(c.label) + '</th>';
        }
        tr += '</tr>';
        thead.innerHTML = tr;
      }

      function renderTable() {
        var tbody = document.getElementById('dg-dim-tbody');
        if (!tbody) return;
        var colN = visibleColCount();
        if (state.loading) {
          tbody.innerHTML = '<tr><td colspan="' + colN + '" class="text-muted small py-3 text-center">Загрузка…</td></tr>';
          return;
        }
        if (state.lastError) {
          tbody.innerHTML =
            '<tr><td colspan="' + colN + '" class="text-danger small py-3 text-center">' +
            escapeHtml(state.lastError) +
            '</td></tr>';
          return;
        }
        if (!Array.isArray(state.rows) || state.rows.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="' + colN + '" class="text-muted small py-4 text-center">Пока ничего не найдено. Попробуйте изменить фильтры.</td></tr>';
          return;
        }
        var cols = getVisibleColsList();
        var html = '';
        for (var i = 0; i < state.rows.length; i++) {
          var r = state.rows[i] || {};
          var rowHtml = '<tr data-dg-code="' + escapeHtml(r.code) + '">';
          for (var j = 0; j < cols.length; j++) {
            var c = cols[j];
            var tdClasses = [];
            if (c.cellClass) tdClasses.push(c.cellClass);
            if (r.problem_cells && r.problem_cells[c.key]) tdClasses.push('dg-dim-cell-problem');
            var cls = tdClasses.length ? ' class="' + tdClasses.join(' ') + '"' : '';
            var extra = typeof c.cellAttr === 'function' ? c.cellAttr(r, c) : '';
            var content = '';
            try {
              content = c.render ? c.render(r, c) : escapeHtml(r[c.key] != null ? r[c.key] : '');
            } catch (e) {
              content = '<span class="dg-dim-empty">—</span>';
            }
            rowHtml += '<td' + cls + extra + '>' + content + '</td>';
          }
          rowHtml += '</tr>';
          html += rowHtml;
        }
        tbody.innerHTML = html;
        scheduleFloatingHeaderUpdate();
      }

      function renderColumnControls() {
        var list = document.getElementById('dg-dim-columns-list');
        if (!list) return;
        list.innerHTML = '';
        DIM_COLS.forEach(function (c) {
          var wrap = document.createElement('label');
          wrap.className = 'form-check d-flex align-items-center gap-2 mb-0';
          var cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.className = 'form-check-input m-0';
          cb.checked = visibleCols.has(c.key);
          cb.addEventListener('change', function () {
            if (cb.checked) {
              visibleCols.add(c.key);
            } else {
              if (visibleCols.size <= 1) {
                cb.checked = true;
                return;
              }
              visibleCols.delete(c.key);
            }
            saveVisibleCols();
            buildColgroup();
            buildThead();
            renderTable();
            dimRefreshFloatingAfterLayout();
          });
          var text = document.createElement('span');
          text.textContent = c.label;
          wrap.appendChild(cb);
          wrap.appendChild(text);
          list.appendChild(wrap);
        });
      }

      function renderWidthControls() {
        var list = document.getElementById('dg-dim-widths-list');
        if (!list) return;
        list.innerHTML = '';
        DIM_COLS.forEach(function (c) {
          var wrap = document.createElement('label');
          var span = document.createElement('span');
          span.textContent = c.label;
          span.style.flex = '1 1 auto';
          span.style.overflow = 'hidden';
          span.style.textOverflow = 'ellipsis';
          var input = document.createElement('input');
          input.type = 'number';
          input.min = String(c.minW || 40);
          input.step = '5';
          input.value = String(getColWidth(c));
          input.addEventListener('change', function () {
            var v = Number(input.value);
            if (!Number.isFinite(v) || v <= 0) {
              delete columnWidths[c.key];
            } else {
              columnWidths[c.key] = Math.max(v, c.minW || 40);
              input.value = String(columnWidths[c.key]);
            }
            saveColumnWidths();
            buildColgroup();
            dimRefreshFloatingAfterLayout();
          });
          wrap.appendChild(span);
          wrap.appendChild(input);
          list.appendChild(wrap);
        });
      }

      function bindColumnsToolbox() {
        var toggleCols = document.getElementById('dg-dim-columns-toggle');
        var toggleW = document.getElementById('dg-dim-widths-toggle');
        var panelCols = document.getElementById('dg-dim-columns-panel');
        var panelW = document.getElementById('dg-dim-widths-panel');
        var wrap = document.getElementById('dg-dim-toolbox-panels');
        if (!toggleCols || !panelCols || !wrap) return;
        function syncWrap() {
          var open = panelCols.classList.contains('open') || (panelW && panelW.classList.contains('open'));
          wrap.classList.toggle('d-none', !open);
        }
        toggleCols.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          panelCols.classList.toggle('open');
          if (panelW) panelW.classList.remove('open');
          syncWrap();
        });
        if (toggleW && panelW) {
          toggleW.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            panelW.classList.toggle('open');
            panelCols.classList.remove('open');
            if (panelW.classList.contains('open')) renderWidthControls();
            syncWrap();
          });
        }
        var allBtn = document.getElementById('dg-dim-columns-all');
        var noneBtn = document.getElementById('dg-dim-columns-none');
        var defBtn = document.getElementById('dg-dim-columns-default');
        if (allBtn) allBtn.addEventListener('click', function () {
          visibleCols = new Set(DIM_COL_KEYS);
          saveVisibleCols();
          renderColumnControls();
          buildColgroup();
          buildThead();
          renderTable();
          dimRefreshFloatingAfterLayout();
        });
        if (noneBtn) noneBtn.addEventListener('click', function () {
          visibleCols = new Set([DIM_COL_KEYS[0]]);
          saveVisibleCols();
          renderColumnControls();
          buildColgroup();
          buildThead();
          renderTable();
          dimRefreshFloatingAfterLayout();
        });
        if (defBtn) defBtn.addEventListener('click', function () {
          visibleCols = defaultVisibleCols();
          saveVisibleCols();
          renderColumnControls();
          buildColgroup();
          buildThead();
          renderTable();
          dimRefreshFloatingAfterLayout();
        });
        var defWBtn = document.getElementById('dg-dim-widths-default');
        if (defWBtn) defWBtn.addEventListener('click', function () {
          columnWidths = {};
          saveColumnWidths();
          renderWidthControls();
          buildColgroup();
          dimRefreshFloatingAfterLayout();
        });
        document.addEventListener('click', function (e) {
          if (e.target.closest('#dg-dim-columns-panel')) return;
          if (e.target.closest('#dg-dim-columns-toggle')) return;
          if (e.target.closest('#dg-dim-widths-panel')) return;
          if (e.target.closest('#dg-dim-widths-toggle')) return;
          panelCols.classList.remove('open');
          if (panelW) panelW.classList.remove('open');
          syncWrap();
        });
      }

      function renderPagination() {
        var hint = document.getElementById('dg-dim-page-hint');
        var btnPrev = document.getElementById('dg-dim-page-prev');
        var btnNext = document.getElementById('dg-dim-page-next');
        var lim = Math.max(1, Number(state.applied.limit || 100));
        var page = Math.floor(state.offset / lim) + 1;
        var pages = Math.max(1, Math.ceil((state.total || 0) / lim));
        if (hint) {
          hint.textContent =
            'Найдено: ' +
            (state.total || 0) +
            '; страница ' +
            page +
            '/' +
            pages +
            '; показано: ' +
            (state.rows ? state.rows.length : 0);
        }
        if (btnPrev) btnPrev.disabled = state.offset <= 0;
        if (btnNext) btnNext.disabled = state.offset + lim >= (state.total || 0);
      }

      function loadList() {
        state.loading = true;
        state.lastError = '';
        renderTable();
        var qs = new URLSearchParams();
        qs.set('search', state.applied.search);
        qs.set('type', state.applied.type);
        qs.set('measure_scope', state.applied.measure_scope || 'all');
        qs.set('mp_scope', state.applied.mp_scope || 'all');
        if (state.applied.problem_profile) qs.set('problem_profile', state.applied.problem_profile);
        qs.set('limit', String(state.applied.limit));
        qs.set('offset', String(state.offset));
        qs.set('sort_by', state.sortBy);
        qs.set('sort_dir', state.sortDir);
        fetch(LIST_URL + '?' + qs.toString(), { credentials: 'same-origin' })
          .then(function (r) {
            return r.json().then(function (j) {
              return { ok: r.ok, j: j };
            });
          })
          .then(function (x) {
            state.loading = false;
            if (!x.ok || !x.j || x.j.success === false) {
              state.rows = [];
              state.total = 0;
              state.lastPostFiltered = false;
              state.lastPostFilterCap = 0;
              state.lastPostFilterTruncated = false;
              state.lastPostFilterMatchCap = 0;
              state.lastError = (x.j && x.j.error) || 'Ошибка загрузки списка';
            } else {
              state.rows = Array.isArray(x.j.rows) ? x.j.rows : [];
              state.total = Number(x.j.total || 0) || 0;
              state.lastPostFiltered = !!x.j.post_filtered;
              state.lastPostFilterCap = Number(x.j.post_filter_cap || 0) || 0;
              state.lastPostFilterTruncated = !!x.j.post_filter_truncated;
              state.lastPostFilterMatchCap = Number(x.j.post_filter_match_cap || 0) || 0;
            }
            renderTable();
            renderPagination();
            var capNote = '';
            if (state.lastPostFiltered && state.lastPostFilterCap) {
              capNote =
                ' Фильтр применён к первым ' +
                state.lastPostFilterCap +
                ' строкам каталога (сортировка — по всему отфильтрованному набору).';
            }
            if (state.lastPostFilterTruncated && state.lastPostFilterMatchCap) {
              capNote +=
                ' Показано не более ' +
                state.lastPostFilterMatchCap +
                ' совпадений в памяти — сузьте поиск или тип, чтобы обработать каталог частями.';
            }
            setStatusHint(
              state.lastError
                ? 'Ошибка: ' + state.lastError
                : 'Готово. Записей всего: ' + (state.total || 0) + '.' + capNote,
              state.lastError ? 'error' : 'success',
            );
            dimRefreshFloatingAfterLayout();
          })
          .catch(function (e) {
            state.loading = false;
            state.lastError = (e && e.message) || 'Сеть';
            state.rows = [];
            state.total = 0;
            state.lastPostFiltered = false;
            state.lastPostFilterCap = 0;
            state.lastPostFilterTruncated = false;
            state.lastPostFilterMatchCap = 0;
            renderTable();
            renderPagination();
            setStatusHint('Сетевая ошибка: ' + state.lastError, 'error');
            dimRefreshFloatingAfterLayout();
          });
      }

      function bindHeaderSearchMirror() {
        var elSearch = document.getElementById('dg-dim-f-search');
        var elMirror = document.getElementById('dg-dim-table-search-mirror');
        if (!elSearch || !elMirror) return;
        var syncing = false;
        elSearch.addEventListener('input', function () {
          if (syncing) return;
          syncing = true;
          elMirror.value = elSearch.value;
          syncing = false;
        });
        elMirror.addEventListener('input', function () {
          if (syncing) return;
          syncing = true;
          elSearch.value = elMirror.value;
          syncing = false;
        });
        function handleEnterCommit(ev) {
          if (ev.key !== 'Enter') return;
          ev.preventDefault();
          commitFilters();
        }
        elSearch.addEventListener('keydown', handleEnterCommit);
        elMirror.addEventListener('keydown', handleEnterCommit);
        elMirror.addEventListener('search', function () {
          state.pending.search = elMirror.value;
          state.applied.search = elMirror.value;
          if (elSearch) elSearch.value = elMirror.value;
          state.offset = 0;
          persistFilters();
          loadList();
        });
      }

      function bindCardCollapse(storageKey, bodyId, btnId) {
        var body = document.getElementById(bodyId);
        var btn = document.getElementById(btnId);
        if (!body || !btn) return;
        function apply() {
          var collapsed = false;
          try {
            collapsed = localStorage.getItem(storageKey) === '1';
          } catch (e) {}
          body.style.display = collapsed ? 'none' : '';
          btn.textContent = collapsed ? 'Развернуть' : 'Свернуть';
        }
        apply();
        btn.addEventListener('click', function () {
          var hidden = body.style.display === 'none';
          body.style.display = hidden ? '' : 'none';
          btn.textContent = hidden ? 'Свернуть' : 'Развернуть';
          try {
            localStorage.setItem(storageKey, hidden ? '0' : '1');
          } catch (e) {}
          /** Сворачивание/разворачивание меняет вертикальную раскладку — переснимаем baseTop. */
          dimRefreshFloatingAfterLayout();
        });
      }

      /**
       * Найти строку state.rows по `code` (используется при auto-save из ячейки,
       * чтобы локально обновить state без перезагрузки таблицы).
       */
      function findRowByCode(code) {
        if (!Array.isArray(state.rows)) return null;
        for (var i = 0; i < state.rows.length; i++) {
          if (state.rows[i] && String(state.rows[i].code) === String(code)) return state.rows[i];
        }
        return null;
      }

      /**
       * Сохранить значение одного поля габаритов через POST /api/exports/dimensions/measure.
       * Меняем визуальное состояние input'а (saving / saved / err), обновляем локальный
       * state.rows[*].measurement, чтобы повторное редактирование сразу видело override.
       * Сервер сам пишет строку в `ms_dimensions_log`.
       */
      function saveCell(input) {
        if (!input || input.disabled) return;
        var code = input.getAttribute('data-dg-code') || '';
        var field = input.getAttribute('data-dg-field') || '';
        if (!code || !field) return;
        var raw = input.value;
        var isNumber = input.type === 'number';
        var normalized = raw;
        if (raw == null || String(raw).trim() === '') {
          normalized = null;
        } else if (isNumber) {
          var num = Number(String(raw).replace(',', '.'));
          if (!Number.isFinite(num) || num < 0) {
            flashCellState(input, 'err');
            return;
          }
          normalized = num;
        } else {
          normalized = String(raw).trim();
        }

        /** Не дёргаем сервер, если значение совпадает с уже применённым override. */
        var row = findRowByCode(code);
        var prevVal = row && row.measurement && row.measurement[field] != null
          ? row.measurement[field]
          : null;
        if (isNumber) {
          if ((normalized == null && prevVal == null) ||
              (normalized != null && prevVal != null && Math.abs(Number(normalized) - Number(prevVal)) < 1e-6)) {
            return;
          }
        } else if (String(normalized || '') === String(prevVal || '')) {
          return;
        }

        flashCellState(input, 'saving');
        var body = { code: code, field: field, value: normalized };
        fetch('/api/exports/dimensions/measure', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { ok: r.ok, j: j };
            });
          })
          .then(function (x) {
            if (!x.ok || !x.j || x.j.success === false) {
              flashCellState(input, 'err');
              setStatusHint('Ошибка сохранения: ' + ((x.j && x.j.error) || 'неизвестно'), 'error');
              return;
            }
            /** Обновляем локальное состояние строки, чтобы при повторном редактировании
             *  resolveCellSource() сразу видела override и не подсовывала parsed/ms. */
            if (row) {
              if (!row.measurement) row.measurement = {};
              if (x.j.measurement && typeof x.j.measurement === 'object') {
                row.measurement = x.j.measurement;
              } else {
                row.measurement[field] = normalized;
              }
              if (x.j.measured_by_name) row.measured_by_name = String(x.j.measured_by_name);
              if (x.j.measured_at) row.measured_at = String(x.j.measured_at);
              if (x.j.measured_by_user_id != null) row.measured_by_user_id = Number(x.j.measured_by_user_id);
              /** Перерисовать пару связанных ячеек: «кто/когда замерял» + статус строки.
               *  Полный re-render таблицы не нужен — это «дёргает» позицию каретки фокуса. */
              repaintMeasuredCells(code);
            }
            input.setAttribute('data-source', 'override');
            input.removeAttribute('data-dirty');
            flashCellState(input, 'ok');
            invalidateTipCache(code, field);
            setStatusHint('Сохранено: ' + field + (normalized != null ? ' = ' + normalized : ' (очищено)') +
              (x.j.changed_fields && x.j.changed_fields.length === 0 ? ' (без изменений)' : ''), 'success');
            // При ручной смене типа упаковки — авто-заливка длины/ширины/высоты
            // в соседние ячейки этой же строки (без перетирания override и МС-значений).
            if (field === 'packing_type') {
              refreshParsedAfterPackingChange(code);
            }
          })
          .catch(function (e) {
            flashCellState(input, 'err');
            setStatusHint('Сетевая ошибка при сохранении: ' + ((e && e.message) || e), 'error');
          });
      }

      function flashCellState(input, kind) {
        if (!input) return;
        input.removeAttribute('data-saving');
        input.removeAttribute('data-saved');
        if (kind === 'saving') {
          input.setAttribute('data-saving', '1');
          return;
        }
        if (kind === 'ok') {
          input.setAttribute('data-saved', 'ok');
        } else if (kind === 'err') {
          input.setAttribute('data-saved', 'err');
        }
        setTimeout(function () {
          input.removeAttribute('data-saved');
        }, 1400);
      }

      /**
       * Перерисовать ячейки «Наименование», «Кто замерял» и «Дата замера» для `code`.
       * Имя — чтобы пересчитать состояние кнопки «↗ В МС» (`data-dg-empty`) после
       * первого user-override. Остальные ячейки трогать не нужно — они уже редактируемы
       * и переоформление сбросит фокус.
       */
      function repaintMeasuredCells(code) {
        var row = findRowByCode(code);
        if (!row) return;
        var tbody = document.getElementById('dg-dim-tbody');
        if (!tbody) return;
        var tr = tbody.querySelector('tr[data-dg-code="' + cssEscape(String(row.code)) + '"]');
        if (!tr) return;
        var cols = getVisibleColsList();
        for (var i = 0; i < cols.length; i++) {
          var c = cols[i];
          if (c.key !== 'measured_by' && c.key !== 'measured_at' && c.key !== 'name') continue;
          var td = tr.children[i];
          if (!td) continue;
          try {
            td.innerHTML = c.render ? c.render(row, c) : '';
          } catch (e) {
            /** не критично, просто оставим как есть */
          }
        }
      }

      function cssEscape(s) {
        if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(s);
        return String(s).replace(/[^a-zA-Z0-9_-]/g, function (ch) {
          return '\\' + ch.charCodeAt(0).toString(16) + ' ';
        });
      }

      /**
       * Клиентский парсер «Тип упаковки» — паритет с серверным
       * `parsePackingDims` / `detectPackingKind` / `extractNumbersFromPacking`
       * в `routes/dimensions.js`. Реализован локально, чтобы авто-заливка после
       * смены `<select>` packing_type работала **синхронно**, без сетевого запроса.
       * Это избавляет от race-condition «пользователь сменил упаковку → нажал
       * ↗ В МС: все правки до того, как ответ /parse-packing вернулся → инпуты
       * длина/ширина/высота-коробка ещё пустые → фронт отправил `null` → сервер
       * очистил поля» (именно с этим столкнулся юзер 5123-KOMPLECT-7).
       */
      function clientDetectPackingKind(s) {
        var text = String(s == null ? '' : s).toLowerCase();
        if (!text) return 'empty';
        if (/сво[ея]\s*упаковк/.test(text)) return 'custom_box';
        if (/пакет/.test(text)) return 'bag';
        if (/короб|гофр/.test(text)) return 'box';
        return 'unknown';
      }
      function clientExtractNumbersFromPacking(s) {
        var text = String(s == null ? '' : s);
        if (!text) return [];
        var seq = text.match(/\d+(?:[.,]\d+)?(?:\s*[*xх×\/]\s*\d+(?:[.,]\d+)?){1,4}/i);
        if (!seq) return [];
        var nums = seq[0].split(/[*xх×\/]/);
        var out = [];
        for (var i = 0; i < nums.length; i++) {
          var v = Number(String(nums[i]).replace(',', '.').trim());
          if (Number.isFinite(v) && v > 0) out.push(v);
        }
        return out;
      }
      function clientParsePackingDims(packingType) {
        var kind = clientDetectPackingKind(packingType);
        var list = clientExtractNumbersFromPacking(packingType);
        var out = { kind: kind, length_cm: null, width_cm: null, height_box_cm: null, height_bag_cm: null };
        if (kind === 'bag') {
          if (list.length >= 2) { out.length_cm = list[0]; out.width_cm = list[1]; }
        } else if (kind === 'box') {
          if (list.length >= 3) { out.length_cm = list[0]; out.width_cm = list[1]; out.height_box_cm = list[2]; }
          else if (list.length === 2) { out.length_cm = list[0]; out.width_cm = list[1]; }
        } else if (kind === 'custom_box') {
          /** ничего не парсим */
        } else {
          if (list.length >= 3) { out.length_cm = list[0]; out.width_cm = list[1]; out.height_box_cm = list[2]; }
          else if (list.length === 2) { out.length_cm = list[0]; out.width_cm = list[1]; }
        }
        return out;
      }

      /**
       * После того как у строки изменился `packing_type` — синхронно пересчитать
       * локальный `row.dimensions_parsed` (через клиентский парсер) и перерисовать
       * соседние ячейки длины/ширины/высоты в этой же строке.
       *
       * Поведение целевых ячеек (см. resolveCellSource):
       *   • если у ячейки есть пользовательский override → значение НЕ трогается;
       *   • если override нет, но есть значение из МС → значение НЕ трогается
       *     (МС-замер для конкретного товара важнее «дефолта» из имени упаковки);
       *   • если ни override, ни МС-значения нет → подставляется новое parsed-значение.
       *
       * Также пересчитывается `disabled`-состояние полей (см. isFieldDisabledForPacking):
       *   • bag → height_box_cm заблокирован;
       *   • box / custom_box → height_bag_cm заблокирован;
       *
       * `<select>` packing_type сама не перерисовывается — фокус и значение,
       * которое только что выбрал пользователь, остаются нетронутыми.
       */
      function refreshParsedAfterPackingChange(code) {
        var row = findRowByCode(code);
        if (!row) return;
        var packing = (row.measurement && row.measurement.packing_type)
          || (row.dimensions_ms && row.dimensions_ms.packing_type) || '';
        row.dimensions_parsed = clientParsePackingDims(String(packing));
        var tbody = document.getElementById('dg-dim-tbody');
        if (!tbody) return;
        var tr = tbody.querySelector('tr[data-dg-code="' + cssEscape(String(code)) + '"]');
        if (!tr) return;
        var cols = getVisibleColsList();
        var keys = { length_cm: true, width_cm: true, height_box_cm: true, height_bag_cm: true };
        for (var i = 0; i < cols.length; i++) {
          if (!keys[cols[i].key]) continue;
          var td = tr.children[i];
          if (!td) continue;
          // Не перерисовываем ячейку, если в ней лежит несохранённый ручной ввод
          // (`data-dirty=1`) или сейчас в неё сфокусирован пользователь — иначе
          // re-render через `col.render` стёр бы то, что пользователь только что
          // набрал. Сохранение этого ввода произойдёт обычным путём (blur/Enter
          // → POST /measure), и после успешного сохранения значение уже будет
          // override и `resolveCellSource` корректно его покажет.
          var existingInput = td.querySelector('.dg-dim-input');
          if (existingInput) {
            if (existingInput.getAttribute('data-dirty') === '1') continue;
            if (document.activeElement === existingInput) continue;
          }
          try { td.innerHTML = cols[i].render ? cols[i].render(row, cols[i]) : ''; }
          catch (_) { /** ignore: ячейка останется как есть */ }
        }
      }

      /**
       * Сравнить текущее значение input/select с тем, что лежит в row.measurement[field]
       * (т. е. с тем, что уже подтверждено как override в БД). Если значение отличается —
       * пометить инпут как «грязный» (data-dirty=1), иначе снять метку. Это нужно для:
       *   • визуальной подсветки несохранённых правок,
       *   • сбора всех таких значений при клике «↗ В МС» и «↗ В МС: всё».
       */
      function markDirtyState(input) {
        if (!input || !input.classList || !input.classList.contains('dg-dim-input')) return;
        if (input.disabled) {
          input.removeAttribute('data-dirty');
          return;
        }
        var code = input.getAttribute('data-dg-code') || '';
        var field = input.getAttribute('data-dg-field') || '';
        if (!code || !field) return;
        var row = findRowByCode(code);
        if (!row) return;
        var isNumber = input.type === 'number';
        var raw = input.value;
        var cur;
        if (raw == null || String(raw).trim() === '') cur = null;
        else if (isNumber) {
          var n = Number(String(raw).replace(',', '.'));
          cur = Number.isFinite(n) ? n : null;
        } else {
          cur = String(raw).trim();
        }
        var dbVal = row.measurement && row.measurement[field] != null ? row.measurement[field] : null;
        var equal;
        if (isNumber) {
          equal = (cur == null && dbVal == null) ||
                  (cur != null && dbVal != null && Math.abs(Number(cur) - Number(dbVal)) < 1e-6);
        } else {
          equal = String(cur || '') === String(dbVal == null ? '' : dbVal);
        }
        if (equal) input.removeAttribute('data-dirty');
        else input.setAttribute('data-dirty', '1');
      }

      /**
       * Собрать ТЕКУЩИЕ значения всех инпутов ряда (включая невыбраненные, ещё не
       * сохранённые правки). Возвращает объект measurement пригодный для отправки
       * на /sync-ms или /measure.
       *   • disabled-инпуты пропускаются (поле «не применимо для упаковки»).
       *   • Пустая строка → null (стираем override).
       *   • Невалидные числа → НЕ включаются в результат, чтобы не затереть БД мусором.
       */
      /**
       * Собираем текущие значения видимых инпутов строки для отправки в МС.
       *
       * Важный нюанс семантики (см. `routes/dimensions.js#persistMeasurementFields`):
       * сервер при inline-`measurement` обходит ТОЛЬКО переданные ключи, и для
       * каждого делает UPSERT — то есть `null` означает «очистить override», а
       * отсутствующий ключ — «не трогать». Поэтому пустые инпуты мы НЕ кладём в
       * `out` (раньше клали как `null`, и при «↗ В МС: все правки» сервер очищал
       * длину/ширину/высоту-коробку, если авто-заливка после смены packing_type
       * не успела по сети прибыть к моменту клика).
       *
       * Если пользователь хочет именно ОЧИСТИТЬ поле — он всё ещё может: делает
       * это явным действием через ячейку (стереть значение → blur/Enter → POST
       * /api/exports/dimensions/measure с `null`). Кнопка «↗ В МС» при этом
       * больше не зачищает поля по неосторожности.
       */
      function gatherRowInputValues(code) {
        var out = {};
        if (!code) return out;
        var tbody = document.getElementById('dg-dim-tbody');
        if (!tbody) return out;
        var tr = tbody.querySelector('tr[data-dg-code="' + cssEscape(String(code)) + '"]');
        if (!tr) return out;
        var inputs = tr.querySelectorAll('.dg-dim-input');
        for (var i = 0; i < inputs.length; i++) {
          var input = inputs[i];
          if (input.disabled) continue;
          var field = input.getAttribute('data-dg-field') || '';
          if (!field) continue;
          var raw = input.value;
          if (raw == null || String(raw).trim() === '') continue;
          if (input.type === 'number') {
            var n = Number(String(raw).replace(',', '.'));
            if (Number.isFinite(n) && n >= 0) out[field] = n;
          } else {
            out[field] = String(raw).trim();
          }
        }
        return out;
      }

      /** Проверка: есть ли в ряду хоть один dirty-инпут? */
      function rowHasDirty(code) {
        if (!code) return false;
        var tbody = document.getElementById('dg-dim-tbody');
        if (!tbody) return false;
        var tr = tbody.querySelector('tr[data-dg-code="' + cssEscape(String(code)) + '"]');
        if (!tr) return false;
        return Boolean(tr.querySelector('.dg-dim-input[data-dirty="1"]'));
      }

      function bindCellEditors() {
        var tbody = document.getElementById('dg-dim-tbody');
        if (!tbody) return;
        tbody.addEventListener('change', function (ev) {
          var t = ev.target;
          if (!t || !t.classList || !t.classList.contains('dg-dim-input')) return;
          saveCell(t);
        });
        /** input-event — для немедленной dirty-подсветки в процессе набора. */
        tbody.addEventListener('input', function (ev) {
          var t = ev.target;
          if (!t || !t.classList || !t.classList.contains('dg-dim-input')) return;
          markDirtyState(t);
        });
        tbody.addEventListener('keydown', function (ev) {
          var t = ev.target;
          if (!t || !t.classList || !t.classList.contains('dg-dim-input')) return;
          if (ev.key === 'Enter') {
            ev.preventDefault();
            t.blur();
          } else if (ev.key === 'Escape') {
            ev.preventDefault();
            /** Откатить к текущему отображаемому значению по source. */
            var code = t.getAttribute('data-dg-code') || '';
            var field = t.getAttribute('data-dg-field') || '';
            var row = findRowByCode(code);
            if (row && field) {
              var resolved = resolveCellSource(row, field);
              t.value = resolved.value == null ? '' : formatNumericForInput(resolved.value);
              t.setAttribute('data-source', resolved.source);
              t.removeAttribute('data-dirty');
            }
            t.blur();
          }
        });
      }

      /* ====================== Модалка «Лог замера» ============================== */

      /**
       * Состояние модалки `🕘 Лог`. Используется для пагинации и для того, чтобы
       * после отката (`POST /log/revert`) перезагрузить ту же страницу журнала.
       */
      var logModalState = {
        code: '',
        name: '',
        offset: 0,
        limit: 100,
        total: 0,
      };
      var MEASUREMENT_FIELD_KEYS = ['length_cm', 'width_cm', 'height_box_cm', 'height_bag_cm', 'weight_kg', 'packing_type'];
      var FIELD_LABELS = {
        length_cm: 'Длина (см)',
        width_cm: 'Ширина (см)',
        height_box_cm: 'Высота — коробка (см)',
        height_bag_cm: 'Высота — пакет (см)',
        weight_kg: 'Вес (кг)',
        packing_type: 'Тип упаковки',
      };
      /**
       * Человеко-читаемые подписи для значений `ms_dimensions_log.action`.
       * Технические имена сохраняем как `title` (всплывающая подсказка) — удобно при
       * отладке/сверке с API, но в таблицах журнала пользователь видит понятные слова.
       */
      var ACTION_LABELS = {
        set: 'Правка',
        sync_ms: 'Отправлено в МС',
        sync_ms_skip: 'МС пропустил',
        sync_ms_error: 'Ошибка МС',
        delete: 'Удаление замера',
      };
      function actionLabel(action) {
        var key = String(action || 'set');
        return ACTION_LABELS[key] || key;
      }

      function openLogFor(code, name) {
        var overlay = document.getElementById('dg-dim-log-overlay');
        var titleEl = document.getElementById('dg-dim-log-title');
        var subEl = document.getElementById('dg-dim-log-subtitle');
        var body = document.getElementById('dg-dim-log-body');
        if (!overlay || !body) return;
        logModalState.code = String(code || '');
        logModalState.name = String(name || '');
        logModalState.offset = 0;
        logModalState.limit = 100;
        logModalState.total = 0;
        overlay.dataset.dgCode = logModalState.code;
        if (titleEl) titleEl.textContent = 'Лог замера';
        if (subEl) subEl.textContent = (name ? name + ' · ' : '') + 'код: ' + String(code || '—');
        body.innerHTML = '<div class="text-muted small text-center py-4">Загрузка журнала изменений габаритов…</div>';
        overlay.style.display = '';
        overlay.setAttribute('aria-hidden', 'false');
        loadLogFor(logModalState.code, { offset: 0, limit: logModalState.limit });
      }

      function closeLog() {
        var overlay = document.getElementById('dg-dim-log-overlay');
        if (!overlay) return;
        overlay.style.display = 'none';
        overlay.setAttribute('aria-hidden', 'true');
        delete overlay.dataset.dgCode;
        logModalState.code = '';
        logModalState.name = '';
        logModalState.offset = 0;
        logModalState.total = 0;
      }

      function loadLogFor(code, opts) {
        var body = document.getElementById('dg-dim-log-body');
        if (!body || !code) return;
        var o = opts && typeof opts === 'object' ? opts : {};
        var offset = Math.max(0, Number.isFinite(Number(o.offset)) ? Number(o.offset) : 0);
        var limit = Math.max(1, Number.isFinite(Number(o.limit)) ? Number(o.limit) : 100);
        var qs = new URLSearchParams({ code: String(code), limit: String(limit), offset: String(offset) });
        body.innerHTML = '<div class="text-muted small text-center py-4">Загрузка журнала изменений габаритов…</div>';
        fetch('/api/exports/dimensions/log?' + qs.toString(), { credentials: 'same-origin' })
          .then(function (r) {
            return r.json().then(function (j) { return { ok: r.ok, j: j }; });
          })
          .then(function (x) {
            if (!x.ok || !x.j || x.j.success === false) {
              body.innerHTML = '<div class="text-danger small text-center py-4">' +
                escapeHtml((x.j && x.j.error) || 'Ошибка загрузки ms_dimensions_log') + '</div>';
              return;
            }
            logModalState.code = String(code);
            logModalState.offset = Number(x.j.offset || 0);
            logModalState.limit = Number(x.j.limit || limit);
            logModalState.total = Number(x.j.total || 0);
            renderLogRows(body, x.j.rows || [], {
              total: logModalState.total,
              limit: logModalState.limit,
              offset: logModalState.offset,
            });
          })
          .catch(function (e) {
            body.innerHTML = '<div class="text-danger small text-center py-4">Сетевая ошибка: ' +
              escapeHtml((e && e.message) || String(e)) + '</div>';
          });
      }

      function renderLogRows(container, rows, meta) {
        var total = meta && Number(meta.total) > 0 ? Number(meta.total) : 0;
        var limit = meta && Number(meta.limit) > 0 ? Number(meta.limit) : 100;
        var offset = meta && Number(meta.offset) >= 0 ? Number(meta.offset) : 0;
        if (!Array.isArray(rows) || rows.length === 0) {
          var emptyHtml = '<div class="text-muted small text-center py-4">';
          if (total === 0) {
            emptyHtml += 'Журнал пуст: по этой позиции ещё не было изменений.';
          } else {
            emptyHtml += 'Пустая страница (offset=' + offset + ').';
          }
          emptyHtml += '</div>';
          if (total > 0) emptyHtml += renderLogPager(total, limit, offset);
          container.innerHTML = emptyHtml;
          return;
        }
        var html = '<table><thead><tr>' +
          '<th style="width: 16%">Когда (МСК)</th>' +
          '<th style="width: 20%">Кто</th>' +
          '<th style="width: 11%">Действие</th>' +
          '<th style="width: 18%">Поле</th>' +
          '<th>Было → стало</th>' +
          '<th style="width: 110px">↻</th>' +
          '</tr></thead><tbody>';
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i] || {};
          var actionRaw = String(r.action || 'set');
          var actionCls = 'action-' + actionRaw;
          var who = r.changed_by_name || ('user#' + (r.changed_by_user_id || '—'));
          var oldVal = r.old_value == null ? '<span class="text-muted">∅</span>' : '<span class="dg-dim-log-old">' + escapeHtml(r.old_value) + '</span>';
          var newVal = r.new_value == null ? '<span class="text-muted">∅</span>' : '<span class="dg-dim-log-new">' + escapeHtml(r.new_value) + '</span>';
          var canRevert = r.action === 'set' && MEASUREMENT_FIELD_KEYS.indexOf(String(r.field || '')) !== -1;
          var revertCell = '';
          if (canRevert) {
            var hint = r.old_value == null
              ? 'Очистить поле (вернуть к пусто)'
              : 'Вернуть значение «' + (r.old_value) + '»';
            revertCell = '<button type="button" class="btn btn-sm btn-outline-warning dg-dim-log-revert-btn" ' +
              'data-dg-log-id="' + Number(r.id || 0) + '" ' +
              'data-dg-field="' + escapeHtml(r.field || '') + '" ' +
              'data-dg-old="' + escapeHtml(r.old_value == null ? '' : r.old_value) + '" ' +
              'title="' + escapeHtml(hint) + '">⤴ Откатить</button>';
          }
          var noteSuffix = r.note ? '<div class="text-muted small mt-1">' + escapeHtml(r.note) + '</div>' : '';
          html += '<tr>' +
            '<td>' + escapeHtml(formatDateTimeMsk(r.changed_at)) + '</td>' +
            '<td>' + escapeHtml(who) + '</td>' +
            '<td><span class="dg-dim-log-action ' + actionCls + '" title="' + escapeHtml(actionRaw) + '">' + escapeHtml(actionLabel(actionRaw)) + '</span></td>' +
            '<td>' + escapeHtml(r.field_label || r.field) + '</td>' +
            '<td>' + oldVal + '<span class="dg-dim-log-arrow">→</span>' + newVal + noteSuffix + '</td>' +
            '<td class="text-end">' + revertCell + '</td>' +
            '</tr>';
        }
        html += '</tbody></table>';
        html += renderLogPager(total, limit, offset);
        container.innerHTML = html;
      }

      function renderLogPager(total, limit, offset) {
        var pages = total > 0 ? Math.max(1, Math.ceil(total / limit)) : 1;
        var current = Math.floor(offset / limit) + 1;
        var prevDisabled = offset <= 0 ? ' disabled' : '';
        var nextDisabled = (offset + limit) >= total ? ' disabled' : '';
        var shown = Math.min(limit, Math.max(0, total - offset));
        return '<div class="dg-dim-log-pager d-flex align-items-center justify-content-between gap-2 px-3 py-2 border-top">' +
          '<div class="text-muted small">Найдено: ' + total + '; страница ' + current + '/' + pages + '; показано: ' + shown + '</div>' +
          '<div class="d-flex align-items-center gap-2">' +
          '<button type="button" class="btn btn-sm btn-outline-secondary dg-dim-log-prev"' + prevDisabled + '>Назад</button>' +
          '<button type="button" class="btn btn-sm btn-outline-secondary dg-dim-log-next"' + nextDisabled + '>Вперёд</button>' +
          '</div></div>';
      }

      /**
       * Откат правки по `id` строки журнала. После успешного ответа сервера обновляем
       * локальный `row.measurement[field]` и DOM-инпут, чтобы пользователь сразу
       * увидел эффект без перезагрузки страницы. Затем перечитываем модалку с того же
       * offset, чтобы новая `set`-запись с пометкой «revert from log_id=N» появилась
       * сверху.
       */
      function revertLogEntry(btn) {
        if (!btn || btn.disabled) return;
        var logId = Number(btn.getAttribute('data-dg-log-id') || 0);
        var field = String(btn.getAttribute('data-dg-field') || '');
        var oldRaw = btn.getAttribute('data-dg-old');
        if (!logId || !field) return;
        var oldDisplay = oldRaw == null || oldRaw === '' ? '«пусто»' : '«' + oldRaw + '»';
        if (!window.confirm('Откатить поле «' + (FIELD_LABELS[field] || field) + '» к ' + oldDisplay + '?')) return;
        btn.disabled = true;
        var origText = btn.textContent;
        btn.textContent = '⏳…';
        fetch('/api/exports/dimensions/log/revert', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ log_id: logId }),
        })
          .then(function (r) {
            return r.json().then(function (j) { return { ok: r.ok, j: j }; });
          })
          .then(function (x) {
            if (!x.ok || !x.j || x.j.success === false) {
              setStatusHint('Откат не выполнен: ' + ((x.j && x.j.error) || 'неизвестная ошибка'), 'error');
              btn.disabled = false;
              btn.textContent = origText;
              return;
            }
            var code = String(x.j.code || logModalState.code || '');
            applyRevertResultToUi(code, x.j.field, x.j.reverted_to, x.j.measured_by_name, x.j.measured_at, x.j.measurement);
            setStatusHint('Откат «' + (FIELD_LABELS[field] || field) + '» применён', 'success');
            loadLogFor(logModalState.code, { offset: logModalState.offset, limit: logModalState.limit });
          })
          .catch(function (e) {
            setStatusHint('Сетевая ошибка отката: ' + ((e && e.message) || String(e)), 'error');
            btn.disabled = false;
            btn.textContent = origText;
          });
      }

      /**
       * Применить результат `POST /log/revert` к основной таблице: обновить
       * `row.measurement[field]`, переписать значение DOM-инпута, обновить data-source
       * и перекрасить «кто/когда замерял».
       */
      function applyRevertResultToUi(code, field, value, measuredByName, measuredAt, measurement) {
        if (!code || !field) return;
        var row = findRowByCode(code);
        if (!row) return;
        if (!row.measurement) row.measurement = {};
        if (measurement && typeof measurement === 'object') {
          for (var k in measurement) {
            if (Object.prototype.hasOwnProperty.call(measurement, k)) {
              row.measurement[k] = measurement[k];
            }
          }
        } else {
          row.measurement[field] = value;
        }
        if (measuredByName) row.measured_by_name = String(measuredByName);
        if (measuredAt) row.measured_at = String(measuredAt);
        var tbody = document.getElementById('dg-dim-tbody');
        if (tbody) {
          var tr = tbody.querySelector('tr[data-dg-code="' + cssEscape(String(code)) + '"]');
          if (tr) {
            var input = tr.querySelector('.dg-dim-input[data-dg-field="' + cssEscape(field) + '"]');
            if (input) {
              var newVal = row.measurement[field];
              if (input.tagName === 'SELECT') {
                input.value = newVal == null ? '' : String(newVal);
              } else {
                input.value = newVal == null ? '' : formatNumericForInput(newVal);
              }
              if (newVal == null) {
                var resolved = resolveCellSource(row, field);
                input.setAttribute('data-source', resolved.source);
              } else {
                input.setAttribute('data-source', 'override');
              }
              input.removeAttribute('data-dirty');
            }
          }
        }
        repaintMeasuredCells(code);
        invalidateTipCache(code);
        // Если откатили `packing_type` — пересчитать parsed-дефолты соседних ячеек.
        if (field === 'packing_type') {
          refreshParsedAfterPackingChange(code);
        }
      }

      /* ====================== Sync с МойСклад ================================== */

      /**
       * Отправить ТЕКУЩИЕ значения всех инпутов ряда в МойСклад. Перед отправкой
       * фронт собирает значения каждого input/select напрямую из DOM (включая ещё
       * НЕ сохранённые правки, которые не успели пройти blur/Enter), а сервер
       * сначала persist'ит их в БД (с журналом и автором), а затем PUT'ит в МС.
       * Это устраняет баг «отправилось только одно поле, а остальные остались
       * красными»: теперь шлём всё, что пользователь успел набрать.
       */
      function syncRowToMs(btn) {
        if (!btn || btn.disabled) return;
        var code = btn.getAttribute('data-dg-sync-code') || '';
        var name = btn.getAttribute('data-dg-sync-name') || '';
        if (!code) return;
        var measurement = gatherRowInputValues(code);
        /** Считаем, что отправлять есть что, если в собранных значениях есть хоть
         *  одно не-null поле ИЛИ в БД уже лежит override. */
        var hasAny = false;
        for (var k in measurement) {
          if (Object.prototype.hasOwnProperty.call(measurement, k) && measurement[k] != null && String(measurement[k]).trim() !== '') {
            hasAny = true; break;
          }
        }
        if (!hasAny && btn.getAttribute('data-dg-empty') === '1') {
          setStatusHint('У позиции «' + (name || code) + '» нет значений — синхронизировать с МС нечего.', 'error');
          return;
        }
        btn.disabled = true;
        btn.setAttribute('data-state', 'pending');
        var prevText = btn.textContent;
        btn.textContent = '⏳ В МС…';
        setStatusHint('Отправка габаритов в МойСклад: ' + (name || code) + '…', 'success');
        return fetch('/api/exports/dimensions/sync-ms', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code, measurement: measurement }),
        })
          .then(function (r) {
            return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
          })
          .then(function (x) {
            btn.disabled = false;
            btn.textContent = prevText;
            if (!x.ok || !x.j || x.j.success === false) {
              btn.setAttribute('data-state', 'err');
              setTimeout(function () { btn.removeAttribute('data-state'); }, 2200);
              var detail = (x.j && x.j.error) || ('HTTP ' + x.status);
              var skippedNote = x.j && Array.isArray(x.j.skipped) && x.j.skipped.length
                ? ' Пропущено: ' + x.j.skipped.map(function (s) { return s.field + '(' + s.reason + ')'; }).join(', ') + '.'
                : '';
              setStatusHint('Ошибка отправки в МС: ' + detail + skippedNote, 'error');
              return { ok: false, code: code };
            }
            btn.setAttribute('data-state', 'ok');
            setTimeout(function () { btn.removeAttribute('data-state'); }, 1800);
            var sent = (x.j.sent_fields || []).join(', ') || '—';
            var skipped = Array.isArray(x.j.skipped) && x.j.skipped.length
              ? '; пропущено: ' + x.j.skipped.map(function (s) { return s.field + '(' + s.reason + ')'; }).join(', ')
              : '';
            var entity = x.j.entity_kind === 'bundle' ? 'комплект' : 'товар';
            setStatusHint('✓ Отправлено в МС (' + entity + '): ' + sent + skipped + '.', 'success');
            /** После успешного sync — обновим локальный state и DOM. */
            applySyncResultToUi(code, measurement, (x.j && x.j.persisted_fields) || []);
            return { ok: true, code: code, sent: x.j.sent_fields || [] };
          })
          .catch(function (e) {
            btn.disabled = false;
            btn.textContent = prevText;
            btn.setAttribute('data-state', 'err');
            setTimeout(function () { btn.removeAttribute('data-state'); }, 2200);
            setStatusHint('Сетевая ошибка при отправке в МС: ' + ((e && e.message) || e), 'error');
            return { ok: false, code: code };
          });
      }

      /**
       * После успешного sync применяем persisted_fields к локальному state.rows и DOM:
       *  - обновляем row.measurement[field],
       *  - перекрашиваем инпуты в override, снимаем data-dirty,
       *  - repaint «Кто/Когда замерял» и кнопок «🕘 Лог»/«↗ В МС».
       * Если ряда нет в state.rows (например, он на другой странице) — просто пропускаем.
       */
      function applySyncResultToUi(code, measurement, persistedFields) {
        var row = findRowByCode(code);
        if (!row) return;
        if (!row.measurement) row.measurement = {};
        if (Array.isArray(persistedFields) && measurement) {
          for (var p = 0; p < persistedFields.length; p++) {
            var pf = persistedFields[p];
            if (Object.prototype.hasOwnProperty.call(measurement, pf)) {
              row.measurement[pf] = measurement[pf];
            }
          }
        }
        var tbody = document.getElementById('dg-dim-tbody');
        if (tbody) {
          var tr = tbody.querySelector('tr[data-dg-code="' + cssEscape(String(code)) + '"]');
          if (tr) {
            var inputs = tr.querySelectorAll('.dg-dim-input');
            for (var j2 = 0; j2 < inputs.length; j2++) {
              var inp = inputs[j2];
              var fld = inp.getAttribute('data-dg-field');
              if (fld && row.measurement[fld] != null) inp.setAttribute('data-source', 'override');
              inp.removeAttribute('data-dirty');
            }
          }
        }
        repaintMeasuredCells(code);
        invalidateTipCache(code);
        if (Array.isArray(persistedFields) && persistedFields.indexOf('packing_type') >= 0) {
          refreshParsedAfterPackingChange(code);
        }
      }

      /**
       * Универсальный балк-исполнитель: принимает массив `tasks = [{code, name, measurement?}]`
       * (если `measurement` отсутствует — sync-ms возьмёт значения из БД), последовательно
       * шлёт `POST /sync-ms` с прогрессом в кнопке `progressBtn` и статус-баннер.
       * Возвращает Promise. Используется кнопкой «↗ В МС: все правки».
       */
      function runBulkSync(tasks, progressBtn, opts) {
        opts = opts || {};
        return new Promise(function (resolve) {
          if (!Array.isArray(tasks) || tasks.length === 0) {
            resolve({ ok: 0, err: 0, total: 0 });
            return;
          }
          var origText = progressBtn ? progressBtn.textContent : '';
          if (progressBtn) {
            progressBtn.disabled = true;
            progressBtn.setAttribute('data-state', 'pending');
          }
          var okCount = 0, errCount = 0;
          var modeLabel = opts.label || 'Балк-синк';
          function next(i) {
            if (i >= tasks.length) {
              if (progressBtn) {
                progressBtn.disabled = false;
                progressBtn.textContent = origText;
                progressBtn.setAttribute('data-state', errCount === 0 ? 'ok' : 'err');
                setTimeout(function () { progressBtn.removeAttribute('data-state'); }, 3000);
              }
              setStatusHint(modeLabel + ' завершён: ✓ ' + okCount + (errCount ? ', × ' + errCount : '') +
                ' из ' + tasks.length + '.', errCount ? 'error' : 'success');
              resolve({ ok: okCount, err: errCount, total: tasks.length });
              return;
            }
            var t = tasks[i];
            if (progressBtn) progressBtn.textContent = '⏳ ' + (i + 1) + '/' + tasks.length;
            setStatusHint(modeLabel + ' ' + (i + 1) + '/' + tasks.length + ': ' +
              (t.name || t.code) + '…', 'success');
            var body = { code: t.code };
            if (t.measurement && typeof t.measurement === 'object') body.measurement = t.measurement;
            fetch('/api/exports/dimensions/sync-ms', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            })
              .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
              .then(function (x) {
                if (x.ok && x.j && x.j.success !== false) {
                  okCount++;
                  applySyncResultToUi(t.code, t.measurement || {}, x.j.persisted_fields || []);
                } else {
                  errCount++;
                }
              })
              .catch(function () { errCount++; })
              .then(function () { setTimeout(function () { next(i + 1); }, 60); });
          }
          next(0);
        });
      }

      /** Собирает задачи балка из видимых state.rows (с inline-measurement из инпутов). */
      function collectCurrentPageTasks() {
        var tasks = [];
        var rows = Array.isArray(state.rows) ? state.rows : [];
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i] || {};
          var code = String(r.code || '');
          if (!code) continue;
          var m = gatherRowInputValues(code);
          var hasAny = false;
          for (var k in m) {
            if (Object.prototype.hasOwnProperty.call(m, k) && m[k] != null && String(m[k]).trim() !== '') {
              hasAny = true; break;
            }
          }
          if (hasAny) tasks.push({ code: code, measurement: m, name: String(r.name || '') });
        }
        return tasks;
      }

      /**
       * «↗ В МС: все правки (все страницы)». Алгоритм:
       *  1. Собрать задачи текущей страницы (inline-measurement из DOM).
       *  2. GET /pending-sync?exclude=<коды_текущей_страницы> — получить все остальные
       *     позиции с override в БД.
       *  3. Объединить, спросить confirm у пользователя, прогнать через runBulkSync.
       * Для задач из БД (без inline) сервер возьмёт значения сам.
       */
      function syncAllDbToMs() {
        var btn = document.getElementById('dg-dim-sync-all-db');
        if (!btn || btn.disabled) return;
        var currentTasks = collectCurrentPageTasks();
        var currentCodes = currentTasks.map(function (t) { return t.code; });
        btn.disabled = true;
        var origText = btn.textContent;
        btn.textContent = '⏳ Опрос БД…';
        var url = '/api/exports/dimensions/pending-sync' +
          (currentCodes.length > 0 ? '?exclude=' + encodeURIComponent(currentCodes.join(',')) : '');
        fetch(url, { credentials: 'same-origin' })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            btn.textContent = origText;
            btn.disabled = false;
            if (!x.ok || !x.j || x.j.success === false) {
              setStatusHint('Не удалось получить список позиций с правками: ' +
                ((x.j && x.j.error) || 'неизвестно'), 'error');
              return;
            }
            var dbRows = Array.isArray(x.j.rows) ? x.j.rows : [];
            /** Отбрасываем позиции без uuid — sync-ms по ним всё равно вернёт 503/404. */
            var dbTasks = dbRows
              .filter(function (r) { return r && r.has_uuid && r.code; })
