      // дорисовывают DOM ВЫШЕ позиции пользователя (таблицы пользователей /

      var dgUserScrollAt = 0;
      ["wheel", "touchmove", "keydown", "pointerdown"].forEach(function (ev) {
        window.addEventListener(ev, function () {
          dgUserScrollAt = Date.now();
        }, { passive: true });
      });
      function dgKeepScroll(maybePromise) {
        var prevY = window.scrollY || document.documentElement.scrollTop || 0;
        function tryRestore() {
          if (Date.now() - dgUserScrollAt < 1500) return;
          var cur = window.scrollY || document.documentElement.scrollTop || 0;
          if (Math.abs(cur - prevY) <= 4) return;
          window.scrollTo({ top: prevY, left: 0, behavior: "auto" });
        }
        function schedule() {
          requestAnimationFrame(function () {
            tryRestore();
            requestAnimationFrame(tryRestore);
          });
        }
        if (maybePromise && typeof maybePromise.then === "function") {
          return maybePromise.then(
            function (v) { schedule(); return v; },
            function (e) { schedule(); throw e; }
          );
        }
        schedule();
        return maybePromise;
      }

      function buildUsernameFromFullName(fullName) {
        var map = {
          а: "a", б: "b", в: "v", г: "g", д: "d", е: "e", ё: "e", ж: "zh", з: "z", и: "i", й: "y",
          к: "k", л: "l", м: "m", н: "n", о: "o", п: "p", р: "r", с: "s", т: "t", у: "u", ф: "f",
          х: "h", ц: "ts", ч: "ch", ш: "sh", щ: "sch", ъ: "", ы: "y", ь: "", э: "e", ю: "yu", я: "ya",
        };
        var source = String(fullName || "").trim().toLowerCase();
        var out = "";
        for (var i = 0; i < source.length; i++) {
          var ch = source[i];
          out += map[ch] !== undefined ? map[ch] : ch;
        }
        return out
          .replace(/[^a-z0-9\s_-]/g, "")
          .replace(/\s+/g, "_")
          .replace(/_+/g, "_")
          .replace(/^_+|_+$/g, "");
      }

      function randomPassword(length) {
        var len = length || 18;
        var chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*()-_=+";
        var randomBytes = new Uint32Array(len);
        crypto.getRandomValues(randomBytes);
        var out = "";
        for (var i = 0; i < len; i++) out += chars[randomBytes[i] % chars.length];
        return out;
      }

      function authHeaders(withJson) {

        if (token) headers["x-auth-token"] = token;
        if (withJson) headers["Content-Type"] = "application/json";
        return headers;
      }

      function set(id, val) {
        var el = document.getElementById(id);
        if (!el) return;
        if (el.type === "checkbox") el.checked = !!val;
        else el.value = val != null ? String(val) : "";
      }
      function getNum(id, fallback) {
        var v = Number(document.getElementById(id).value);
        return Number.isFinite(v) ? v : fallback;
      }
      function getFloat(id, fallback) {
        var el = document.getElementById(id);
        var raw = el ? String(el.value || "").trim().replace(",", ".") : "";

        return Number.isFinite(v) ? v : fallback;
      }
      function getStr(id) {

      /** prefix: "dg-set-auto_mssales_wd" → ids …_wd_1 …_wd_7. Пустой csv в БД — все дни (legacy); явное `1,2,3,4,5,6,7` — тоже все дни (после сохранения не схлопывать в пусто). */
      function applyAutoSyncWeekdayChecks(prefix, csv) {
        var set = Object.create(null);
        var s = String(csv == null ? "" : csv).trim();
        if (!s || s === "1,2,3,4,5,6,7") {
          for (var a = 1; a <= 7; a++) set[a] = true;
        } else {
          s.split(/[,;\s]+/).forEach(function (p) {
            var n = parseInt(String(p).trim(), 10);
            if (n >= 1 && n <= 7) set[n] = true;
          });
        }
        for (var d = 1; d <= 7; d++) {
          var el = document.getElementById(prefix + "_" + d);
          if (el) el.checked = !!set[d];
        }
      }

      function collectAutoSyncWeekdayCsv(prefix) {
        var out = [];
        for (var d = 1; d <= 7; d++) {
          var el = document.getElementById(prefix + "_" + d);
          if (el && el.checked) out.push(d);
        }
        if (out.length === 7) return "1,2,3,4,5,6,7";
        if (out.length === 0) return "";
        return out
          .slice()
          .sort(function (a, b) {
            return a - b;
          })
          .join(",");
      }

      /** Сравнение сохранённых дней недели: пусто и `1,2,3,4,5,6,7` — одно и то же («каждый день»). */
      function weekdaysCsvCanonicalForVerify(v) {
        var set = Object.create(null);
        var s = String(v == null ? "" : v).trim();
        if (!s) return "__ALL__";
        s.split(/[,;\s]+/).forEach(function (p) {
          var n = parseInt(String(p).trim(), 10);
          if (n >= 1 && n <= 7) set[n] = true;
        });
        var keys = [];
        for (var d = 1; d <= 7; d++) {
          if (set[d]) keys.push(d);
        }
        if (keys.length === 0 || keys.length === 7) return "__ALL__";
        return keys.join(",");
      }

      function formatUserDateTime(value) {
        if (value == null || value === "") return "—";
        var d = value instanceof Date ? value : new Date(value);
        if (Number.isNaN(d.getTime())) return "—";
        return d.toLocaleString("ru-RU", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function updateUsersHint() {
        var h = document.getElementById("dg-set-users-hint");
        if (!h) return;
        if (!isAdmin()) {
          h.textContent = "Список пользователей доступен только admin";
          return;
        }
        var pm = Number(usersPresenceWindowMinutes || 15);
        h.textContent =
          "Admin может управлять списком пользователей. В таблице: по каждой строке — сколько у этого логина сессий в окне " +
          (Number.isFinite(pm) ? pm : 15) +
          " мин и сколько всего действующих cookie (TTL). Виджет в шапке: для admin — число пользователей онлайн в окне; для остальных — 0 или 1 по вашим сессиям (вкладки не удваивают число людей).";
      }

      function userSessionsOnlineCount(u) {
        if (u && u.active_sessions_recent != null) return Number(u.active_sessions_recent || 0);
        return Number(u.active_sessions || 0);
      }

      function syncUsersSessionsHeader() {
        var th = document.getElementById("dg-set-users-th-sessions");
        if (!th) return;
        var pm = Number(usersPresenceWindowMinutes || 15);
        var label = Number.isFinite(pm) ? pm : 15;
        th.textContent = "Онлайн (" + label + " мин) / действующих";
      }

      function syncSpecAdminVisibility() {
        var card = document.getElementById("dg-set-spec-admin-card");
        if (card) card.style.display = isAdmin() ? "" : "none";
      }

      function fillSpecialtySelects() {
        var ids = ["dg-set-new-specialty", "dg-set-spec-matrix-id", "dg-set-edit-specialty"];
        ids.forEach(function (id) {
          var el = document.getElementById(id);
          if (!el || el.tagName !== "SELECT") return;
          el.replaceChildren();
          specList.forEach(function (sp) {
            var o = document.createElement("option");
            o.value = String(sp.id);
            o.textContent = sp.name + (sp.users_count != null ? " (" + sp.users_count + ")" : "");
            el.appendChild(o);
          });
        });
      }

      function loadSpecPageDefsOnce() {
        if (specPageDefs.length) return Promise.resolve();
        return fetch("/api/specialties/pages", { credentials: "same-origin", headers: authHeaders(false) })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok) return;
            specPageDefs = Array.isArray(x.j.data) ? x.j.data : [];
          })
          .catch(function () {});
      }

      function loadSpecialtiesAdmin() {
        if (!isAdmin()) {
          specList = [];
          fillSpecialtySelects();
          return Promise.resolve();
        }
        return fetch("/api/specialties", { credentials: "same-origin", headers: authHeaders(false) })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            specList = x.r.ok && Array.isArray(x.j.data) ? x.j.data : [];
            fillSpecialtySelects();
            renderSpecList();
            renderUsers();
            var msel = document.getElementById("dg-set-spec-matrix-id");
            var tbody = document.getElementById("dg-set-spec-matrix-tbody");
            if (msel && specList.length && tbody && !tbody.children.length) {
              msel.value = String(specList[0].id);
              return loadSpecMatrix();
            }
          })
          .catch(function () {
            specList = [];
          });
      }

      function renderSpecList() {
        var tbody = document.getElementById("dg-set-spec-list-tbody");
        if (!tbody) return;
        tbody.replaceChildren();
        if (!isAdmin()) return;
        if (!specList.length) {
          var tr0 = document.createElement("tr");
          var td0 = document.createElement("td");
          td0.colSpan = 4;
          td0.className = "text-muted";
          td0.textContent = "Нет данных (загрузите снова после входа admin)";
          tr0.appendChild(td0);
          tbody.appendChild(tr0);
          return;
        }
        specList.forEach(function (sp) {
          var tr = document.createElement("tr");
          var tdId = document.createElement("td");
          tdId.textContent = String(sp.id);
          var tdN = document.createElement("td");
          tdN.textContent = sp.name || "";
          var tdC = document.createElement("td");
          tdC.textContent = String(sp.users_count != null ? sp.users_count : "0");
          var tdA = document.createElement("td");
          tdA.className = "text-nowrap";
          var bRen = document.createElement("button");
          bRen.type = "button";
          bRen.className = "btn btn-sm btn-outline-secondary me-1 mb-1";
          bRen.setAttribute("data-dg-no-activity", "1");
          bRen.textContent = "Переименовать";
          bRen.addEventListener("click", function () {
            var nn = window.prompt("Новое название специальности", sp.name || "");
            if (nn == null) return;
            nn = String(nn).trim();
            if (nn.length < 2) return alert("Слишком короткое название");
            fetch("/api/specialties/" + sp.id, {
              method: "PUT",
              credentials: "same-origin",
              headers: authHeaders(true),
              body: JSON.stringify({ name: nn }),
            })
              .then(function (r) {
                return r.json().then(function (j) {
                  return { r: r, j: j };
                });
              })
              .then(function (x) {
                if (!x.r.ok) throw new Error((x.j && x.j.error) || "Ошибка");
                return loadSpecialtiesAdmin();
              })
              .catch(function (e) {
                alert(e.message || "Ошибка");
              });
          });
          var bDel = document.createElement("button");
          bDel.type = "button";
          bDel.className = "btn btn-sm btn-outline-danger mb-1";
          bDel.setAttribute("data-dg-no-activity", "1");
          bDel.textContent = "Удалить";

      /**
       * Универсальный движок «Сохранить» для страницы Настроек.
       *
       * По правилу `datagon-settings-save-feedback`: каждая кнопка «Сохранить» обязана
       * показывать inline-результат рядом с собой (без alert как единственного источника).
       *
       * Параметры:
       *   sectionId      — id секции (например, "marketplaces"). Под кнопкой ожидается
       *                    `<div id="dg-set-${sectionId}-save-msg" class="alert d-none">`,
       *                    кнопка — `dg-set-btn-save-${sectionId}`.
       *   payload        — объект для POST /api/settings.
       *   okText         — короткое описание успеха (например, "Настройки маркетплейсов сохранены").
       *   verifyKeys     — список ключей, по которым после успеха сверяем фактически
       *                    сохранённое значение в БД через GET /api/settings (чтобы поймать
       *                    ситуации «POST вернул success, но whitelist бэкенда отбросил поле»).
       */
      function setSaveMsg(sectionId, kind, html) {
        var box = document.getElementById("dg-set-" + sectionId + "-save-msg");
        if (!box) return;
        var cls = kind === "success" ? "alert-success" : kind === "warning" ? "alert-warning" : kind === "danger" ? "alert-danger" : "alert-secondary";
        box.className = "alert mt-3 mb-0 " + cls;
        box.innerHTML = html;
      }
      function maskValue(v) {
        var s = String(v == null ? "" : v);
        if (s === "") return "<em>не задан</em>";
        if (s.length <= 8) return "*** (" + s.length + " симв.)";
        return s.slice(0, 4) + "…" + s.slice(-4) + " (" + s.length + " симв.)";
      }
      function fmtVerify(payload, settings, verifyKeys) {
        if (!verifyKeys || !verifyKeys.length) return "";
        var lines = [];
        var anyMismatch = false;
        verifyKeys.forEach(function (k) {
          if (!(k in payload)) return;
          var sent = payload[k];
          var got = settings && settings[k] !== undefined ? settings[k] : "";
          var mask = /api_key|password|secret/i.test(k);
          var sentDisplay = mask ? maskValue(sent) : (sent === "" ? "<em>пусто</em>" : "<code>" + String(sent) + "</code>");
          var gotDisplay = mask ? maskValue(got) : (got === "" || got == null ? "<em>пусто</em>" : "<code>" + String(got) + "</code>");
          var same = String(sent || "") === String(got || "");
          if (!same && /^sales_formula_/.test(String(k || "")) && k !== "sales_formula_economy_enabled") {
            var sn = parseFloat(String(sent).replace(",", "."));
            var gn = parseFloat(String(got).replace(",", "."));
            if (Number.isFinite(sn) && Number.isFinite(gn)) same = Math.abs(sn - gn) < 1e-6;
          }
          if (!same && /_weekdays$/.test(String(k || ""))) {
            same = weekdaysCsvCanonicalForVerify(sent) === weekdaysCsvCanonicalForVerify(got);
          }
          if (!same) anyMismatch = true;
          lines.push("• <strong>" + k + ":</strong> в БД " + gotDisplay + (same ? "" : " (вы отправили " + sentDisplay + ")"));
        });
        return { html: lines.join("<br>"), mismatch: anyMismatch };
      }
      function runSaveWithInlineFeedback(opts) {
        var sectionId = opts.sectionId;
        var btnId = "dg-set-btn-save-" + sectionId;
        var btn = document.getElementById(btnId);
        var payload = opts.payload || {};
        var okText = opts.okText || "Сохранено";
        var verifyKeys = Array.isArray(opts.verifyKeys) ? opts.verifyKeys : [];
        if (btn) btn.disabled = true;
        setSaveMsg(sectionId, "warning", "Сохраняем…");
        return dgKeepScroll(
          fetch("/api/settings", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          })
            .then(function (r) {
              return r.json().then(function (j) { return { r: r, j: j }; });
            })
            .then(function (x) {
              if (!x.r.ok || !x.j.success) {
                throw new Error((x.j && x.j.error) || ("HTTP " + x.r.status));
              }
              return fetch("/api/settings", { credentials: "same-origin" }).then(function (r) { return r.json(); });
            })
            .then(function (settings) {
              applySettingsToForm(settings || {});
              var verify = fmtVerify(payload, settings || {}, verifyKeys);
              var ok = !verify || !verify.mismatch;
              var html = "<strong>" + (ok ? okText + "." : okText + ", но фактическое значение в БД отличается!") + "</strong>";
              if (verify && verify.html) html += "<br>" + verify.html;
              html += "<br><span class=\"small text-muted\">При смене ключей/паролей маркетплейсов, расписаний и параметров API нужен перезапуск Node для применения.</span>";
              setSaveMsg(sectionId, ok ? "success" : "warning", html);
            })
            .catch(function (e) {
              setSaveMsg(sectionId, "danger", "<strong>Ошибка сохранения.</strong> " + (e && e.message ? e.message : String(e)));
            })
            .then(function () {
              if (btn) btn.disabled = false;
            })
        );
      }
      // Совместимость со старым кодом: upsertSettings(payload, okText) теперь использует
      // тот же inline-движок, при условии что у вызывающей кнопки есть message-box.
      // Имя секции — суффикс id кнопки после "dg-set-btn-save-".
      function upsertSettings(payload, okText, sectionId, verifyKeys) {
        return runSaveWithInlineFeedback({
          sectionId: sectionId || "general",
          payload: payload,
          okText: okText || "Сохранено",
          verifyKeys: verifyKeys || Object.keys(payload || {}),
        });
      }

      function saveSessionsAndOnline() {
        var payload = {

      var autoSyncRunRequestInFlight = Object.create(null);
      var AUTO_RUN_TASK_LABELS = {
        myproducts: "Мои товары",
        moysklad: "МойСклад (ms_export)",
        marketplaces: "Маркетплейсы",
        huckster: "Huckster",
        db_size: "Размер БД и диска",
        dimensions: "Габариты МС",
        mssales: "Продажи МС",
        mssales_full: "Продажи МС (полный)",
      };
      function escAutoRunHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }
      function formatAutoSyncQueueForUi(queue) {
        if (!Array.isArray(queue) || !queue.length) return "пусто (ваша задача может начаться сразу, если воркер был свободен).";
        return queue
          .map(function (t) {
            var k = String(t || "").trim();
            return escAutoRunHtml(AUTO_RUN_TASK_LABELS[k] || k);
          })
          .join(" → ");
      }
      function showAutoSyncRunBanner(kind, htmlBody) {
        var el = document.getElementById("dg-set-auto-run-msg");
        if (!el) return;
        el.classList.remove("d-none", "alert-success", "alert-warning", "alert-danger", "alert-info");
        var cls =
          kind === "ok"
            ? "alert-success"
            : kind === "warn"
              ? "alert-warning"
              : kind === "err"
                ? "alert-danger"
                : "alert-info";
        el.classList.add(cls);
        el.innerHTML = htmlBody;
        try {
          el.scrollIntoView({ behavior: "smooth", block: "nearest" });
        } catch (_) {}
      }
      function runAutoSyncNow(task, label, btnId) {
        if (autoSyncRunRequestInFlight[task]) {
          showAutoSyncRunBanner(
            "warn",
            "<strong>Подождите</strong><div class=\"small mt-1\">По этой задаче запрос к серверу уже выполняется — дождитесь ответа, не нажимайте повторно.</div>"
          );
          return;
        }
        autoSyncRunRequestInFlight[task] = true;
        var hint = document.getElementById("dg-set-auto-sync-force-hint");
        var btn = btnId ? document.getElementById(btnId) : null;
        var prevBtnHtml = btn ? btn.innerHTML : "";
        if (btn) {
          btn.disabled = true;
          btn.setAttribute("aria-busy", "true");
          btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Запрос…';
        }
        if (hint) hint.textContent = "Запрос к серверу: " + label + "…";
        showAutoSyncRunBanner(
          "info",
          "<strong>Отправляем на сервер…</strong><div class=\"small mt-1\">" + escAutoRunHtml(label) + "</div>"
        );
        fetch("/api/settings/auto-sync-run", {
          method: "POST",
          credentials: "same-origin",
          headers: authHeaders(true),
          body: JSON.stringify({ task: task }),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok || !x.j.success) {
              throw new Error((x.j && x.j.error) || "Не удалось запустить автосинхронизацию");
            }
            var j = x.j || {};
            var timeStr = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
            var workerLine =
              j.runner_active === true
                ? "Воркер автосинка сейчас <strong>занят</strong> (выполняется какая‑то задача)."
                : "Воркер автосинка сейчас <strong>свободен</strong>.";
            var queueLine = "Очередь после ответа сервера: " + formatAutoSyncQueueForUi(j.queue) + "";
            var procLink =
              ' <a href="/processes.html">Открыть «Логи фоновых процессов»</a> — там статус и прогресс.';
            if (j.queued === false) {
              var why =
                j.skip_reason === "already_running"
                  ? "эта задача <strong>уже выполняется</strong> (новый запуск не поставлен). Смотрите журнал на «Процессы»."
                  : j.skip_reason === "already_queued"
                    ? "такая задача <strong>уже в очереди</strong> — повторно не добавляли."
                    : j.skip_reason
                      ? "не поставлено в очередь: <code>" + escAutoRunHtml(j.skip_reason) + "</code>."
                      : "сервер не поставил задачу в очередь (причина не указана).";
              if (hint) hint.textContent = label + ": " + String(j.skip_reason || "не в очереди");
              showAutoSyncRunBanner(
                "warn",
                "<strong>" +
                  escAutoRunHtml(label) +
                  " — без повторного запуска</strong><div class=\"small mt-1\">" +
                  why +
                  "</div><div class=\"small mt-1\">" +
                  workerLine +
                  " " +
                  queueLine +
                  procLink +
                  "</div><div class=\"small text-muted mt-1\">Ответ сервера: " +
                  escAutoRunHtml(timeStr) +
                  "</div>"
              );
              return;
            }
            if (hint) hint.textContent = label + ": поставлено в очередь (" + timeStr + ").";
            showAutoSyncRunBanner(
              "ok",
              "<strong>" +
                escAutoRunHtml(label) +
                " — принято</strong><div class=\"small mt-1\">Задача добавлена в очередь автосинхронизации. Если очередь была пуста и воркер свободен — выполнение могло начаться сразу после этого ответа.</div><div class=\"small mt-1\">" +
                workerLine +
                " " +
                queueLine +
                procLink +
                "</div><div class=\"small text-muted mt-1\">Ответ сервера: " +
                escAutoRunHtml(timeStr) +
                "</div>"
            );
          })
          .catch(function (e) {
            var msg = e.message || "Ошибка запуска автосинхронизации";
            if (hint) hint.textContent = "Ошибка: " + msg;
            showAutoSyncRunBanner(
              "err",
              "<strong>Ошибка запуска</strong><div class=\"small mt-1\">" + escAutoRunHtml(msg) + "</div>"
            );
          })
          .finally(function () {
            autoSyncRunRequestInFlight[task] = false;
            if (btn) {
              btn.disabled = false;
              btn.removeAttribute("aria-busy");
              btn.innerHTML = prevBtnHtml;
            }
          });
      }

      /**
       * Статистика журнала замеров габаритов `ms_dimensions_log` для блока
       * «Журнал замеров габаритов» в карточке «Логи сервера»: всего строк,
       * самая старая/свежая запись, разбивка по action и сколько будет
       * удалено по текущему retention.
       */
      function loadDimLogStats() {
        var box = document.getElementById("dg-set-dim-log-info");
        if (box) box.textContent = "Статистика журнала: загрузка…";
        return dgKeepScroll(
          fetch("/api/exports/dimensions/log/stats", { credentials: "same-origin" })
            .then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
            .then(function (x) {
              if (!box) return;
              box.replaceChildren();
              if (!x.r.ok || !x.j || x.j.success === false) {
                box.textContent = "Ошибка статистики журнала: " + ((x.j && x.j.error) || "неизвестно");
                return;
              }
              var j = x.j;
              var act = j.by_action || {};
              var actStr = ["set", "sync_ms", "delete"]
                .filter(function (k) { return act[k] != null; })
                .map(function (k) { return k + "=" + (act[k] || 0); })
                .join(", ");
              var oldestStr = j.oldest_at
                ? new Date(j.oldest_at).toLocaleString("ru-RU", { timeZone: "Europe/Moscow" })
                : "—";
              var newestStr = j.newest_at
                ? new Date(j.newest_at).toLocaleString("ru-RU", { timeZone: "Europe/Moscow" })
                : "—";
              var d1 = document.createElement("div");
              d1.textContent = "Всего записей: " + (j.total || 0) + (actStr ? " (" + actStr + ")" : "");
              var d2 = document.createElement("div");
              d2.textContent = "Самая старая: " + oldestStr + " · самая свежая: " + newestStr;
              var d3 = document.createElement("div");
              d3.textContent = "Текущий retention: " + (j.retention_days || 0) +
                " дней · по нему будет удалено сейчас: " + (j.older_than_retention || 0);
              box.appendChild(d1);
              box.appendChild(d2);
              box.appendChild(d3);
            })
            .catch(function (e) {
              if (!box) return;
              box.replaceChildren();
              box.textContent = "Сетевая ошибка статистики журнала: " + ((e && e.message) || e);
            })
        );
      }

      /**
       * Сохранить retention журнала замеров через единую утилиту inline-feedback
       * (`datagon-settings-save-feedback.mdc`). После успешного сохранения сразу
       * обновляем статистику — пользователь видит «по новому retention удалится X».
       */
      function saveDimLogRetention() {
        var days = getNum("dg-set-ms_dimensions_log_retention_days", 180);
        if (!Number.isFinite(days) || days < 1) {
          days = 180;
          var el = document.getElementById("dg-set-ms_dimensions_log_retention_days");
          if (el) el.value = "180";
        }
        runSaveWithInlineFeedback({
          sectionId: "dim-log",
          payload: { ms_dimensions_log_retention_days: days },
          okText: "Retention журнала замеров сохранён",
          verifyKeys: ["ms_dimensions_log_retention_days"],
        }).then(function () { loadDimLogStats(); }).catch(function () { /** баннер уже показан утилитой */ });
      }

      /**
       * Принудительная очистка прямо сейчас (без ожидания cron). Использует ТЕКУЩЕЕ
       * значение поля «Хранить журнал замеров (дней)» — даже если оно ещё не сохранено,
       * чтобы пользователь мог попробовать другое значение и нажать «Очистить сейчас»
       * для предпросмотра.
       */
      function cleanupDimLogNow() {
        var days = getNum("dg-set-ms_dimensions_log_retention_days", 180);
        if (!window.confirm("Удалить из журнала замеров записи старше " + days + " дней?")) return;
        fetch("/api/exports/dimensions/log/cleanup", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ days: days }),
        })
          .then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
          .then(function (x) {
            if (!x.r.ok || !x.j || x.j.success === false) {
              throw new Error((x.j && x.j.error) || "Не удалось очистить журнал");
            }
            alert("Удалено записей: " + (x.j.deleted || 0));
            loadDimLogStats();
          })
          .catch(function (e) {
            alert((e && e.message) || "Ошибка очистки журнала");
          });
      }

      function createUser() {
        if (!canManageUsers()) return alert("Недостаточно прав");
        var full_name = getStr("dg-set-new-fullname").trim();
        var username = getStr("dg-set-new-username").trim();
        var password = getStr("dg-set-new-password");
        if (!full_name) return alert("Введите Имя Фамилия");
        if (!username) return alert("Введите логин");
        if (password.length < 15) return alert("Пароль должен быть не короче 15 символов");
        var specRaw = document.getElementById("dg-set-new-specialty") && document.getElementById("dg-set-new-specialty").value;
        var specId = parseInt(specRaw, 10);
        var payload = { full_name: full_name, username: username, password: password };
        if (Number.isFinite(specId) && specId > 0) payload.specialty_id = specId;
        fetch("/api/auth/users", {
          method: "POST",
          credentials: "same-origin",
          headers: authHeaders(true),
          body: JSON.stringify(payload),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok || !x.j.success) throw new Error(x.j.error || "Не удалось создать пользователя");
            alert("Пользователь добавлен");
            set("dg-set-new-fullname", "");
            set("dg-set-new-username", "");
            set("dg-set-new-password", "");
            loadUsers();
          })
          .catch(function (e) {
            alert(e.message || "Ошибка создания пользователя");
          });
      }

      function updatePermission(user, enabled) {
        fetch("/api/auth/users/" + user.id + "/permissions", {
          method: "PUT",
          credentials: "same-origin",
          headers: authHeaders(true),
          body: JSON.stringify({ can_manage_users: enabled ? 1 : 0 }),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok || !x.j.success) throw new Error(x.j.error || "Не удалось изменить право");
            loadUsers();
          })
          .catch(function (e) {
            alert(e.message || "Ошибка изменения прав");
          });
      }

      function revokeSessions(user) {
        if (!window.confirm('Завершить все активные сессии пользователя "' + user.username + '"?')) return;
        fetch("/api/auth/users/" + user.id + "/revoke-sessions", {
          method: "POST",
          credentials: "same-origin",
          headers: authHeaders(false),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok || !x.j.success) throw new Error(x.j.error || "Не удалось завершить сессии");
            alert("Сессии завершены");
            loadUsers();
          })
          .catch(function (e) {
            alert(e.message || "Ошибка завершения сессий");
          });
      }

      function deleteUser(user) {
        if (!window.confirm('Удалить пользователя "' + user.username + '"?')) return;
        fetch("/api/auth/users/" + user.id, {
          method: "DELETE",
          credentials: "same-origin",
          headers: authHeaders(false),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok || !x.j.success) throw new Error(x.j.error || "Не удалось удалить пользователя");
            alert("Пользователь удален");
            loadUsers();
          })
          .catch(function (e) {
            alert(e.message || "Ошибка удаления");
          });
      }

      function openEditUser(u) {
        editUser = { id: u.id, username: u.username, full_name: u.full_name || "" };
        document.getElementById("dg-set-edit-fullname").value = editUser.full_name;
        document.getElementById("dg-set-edit-username").value = editUser.username;
        document.getElementById("dg-set-edit-username").readOnly = editUser.username === "admin";
        fillSpecialtySelects();
        var spEl = document.getElementById("dg-set-edit-specialty");
        if (spEl) {
          spEl.value = u.specialty_id != null ? String(u.specialty_id) : "";
          spEl.disabled = editUser.username === "admin";
        }
        document.getElementById("dg-set-edit-card").style.display = "";
      }
      function closeEditUser() {
        editUser = null;
        document.getElementById("dg-set-edit-card").style.display = "none";
      }

      function saveEditedUser() {
        if (!editUser) return;
        var full_name = getStr("dg-set-edit-fullname").trim();
        var username = getStr("dg-set-edit-username").trim();
        if (!full_name || full_name.length < 3) return alert("Имя должно быть не короче 3 символов");
        if (!username || username.length < 3) return alert("Логин должен быть не короче 3 символов");
        var body = { username: username, full_name: full_name };
        if (editUser.username !== "admin") {
          var sid = parseInt(document.getElementById("dg-set-edit-specialty").value, 10);
          if (Number.isFinite(sid) && sid > 0) body.specialty_id = sid;
        }
        fetch("/api/auth/users/" + editUser.id, {
          method: "PUT",
          credentials: "same-origin",
          headers: authHeaders(true),
          body: JSON.stringify(body),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok || !x.j.success) throw new Error(x.j.error || "Не удалось сохранить");
            alert("Пользователь обновлен");
            closeEditUser();
            loadUsers();
          })
          .catch(function (e) {
            alert(e.message || "Ошибка сохранения пользователя");
          });
      }

      function loginAsUser(username) {
        if (!isAdmin()) {
          alert("Только admin может переключаться на других пользователей");
          return;
        }
        var password = window.prompt('Введите пароль пользователя "' + username + '" для входа:');
        if (password === null) return;
        if (!password) {
          alert("Пароль не введен");
          return;
        }
        fetch("/api/auth/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password }),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok || !x.j.success) throw new Error(x.j.error || "Не удалось войти");
            var json = x.j;
            window.localStorage.setItem("isLoggedIn", "true");
            window.localStorage.setItem("currentUser", json.username || username);
            window.localStorage.setItem("currentUserDisplayName", json.full_name || json.username || username);
            window.localStorage.setItem("isAdmin", json.isAdmin ? "true" : "false");
            window.localStorage.setItem("canManageUsers", json.canManageUsers ? "true" : "false");
            if (json.auth_token) window.localStorage.setItem("authToken", json.auth_token);
            try {
              if (json.page_modes && typeof json.page_modes === "object") {
                window.localStorage.setItem("datagonPageModesV1", JSON.stringify(json.page_modes));
              } else window.localStorage.removeItem("datagonPageModesV1");
              if (json.specialty_name) window.localStorage.setItem("datagonSpecialtyNameV1", String(json.specialty_name));
              else window.localStorage.removeItem("datagonSpecialtyNameV1");
            } catch (eLs) {}
            alert("Вы вошли как " + (json.username || username));
            window.location.reload();
          })
          .catch(function (e) {
            alert(e.message || "Ошибка входа");
          });
      }

      function changePassword() {
        var un = getStr("dg-set-pw-username").trim();
        var np = getStr("dg-set-pw-new");
        if (!un) return alert("Введите логин");
        if (np.length < 15) return alert("Пароль должен быть не короче 15 символов");
        fetch("/api/auth/change-password", {
          method: "POST",
          credentials: "same-origin",
          headers: authHeaders(true),
          body: JSON.stringify({ username: un, newPassword: np }),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok || !x.j.success) throw new Error(x.j.error || "Не удалось сменить пароль");
            alert("Пароль успешно изменен");
            set("dg-set-pw-new", "");
          })
          .catch(function (e) {
            alert(e.message || "Ошибка смены пароля");
          });
      }

      document.getElementById("dg-set-new-fullname").addEventListener("input", function () {
        set("dg-set-new-username", buildUsernameFromFullName(getStr("dg-set-new-fullname")));
      });
      document.getElementById("dg-set-new-pw-toggle").addEventListener("click", function () {
        showNewUserPassword = !showNewUserPassword;
        document.getElementById("dg-set-new-password").type = showNewUserPassword ? "text" : "password";
      });
      document.getElementById("dg-set-new-pw-copy").addEventListener("click", function () {
        var v = getStr("dg-set-new-password");
        if (!v || !canManageUsers()) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(v).then(
            function () {
              alert("Пароль скопирован");
            },
            function () {}
          );
        }
      });
      document.getElementById("dg-set-btn-random-new-pw").addEventListener("click", function () {
        set("dg-set-new-password", randomPassword(18));
      });

      document.getElementById("dg-set-auto_market_run").addEventListener("click", function () { runAutoSyncNow("marketplaces", "Маркетплейсы", "dg-set-auto_market_run"); });

      var mssalesFullRunBtn = document.getElementById("dg-set-auto_mssales_full_run");

      document.getElementById("dg-set-btn-logs-refresh").addEventListener("click", loadLogsInfo);
      document.getElementById("dg-set-btn-logs-clear").addEventListener("click", clearLogsNow);
      document.getElementById("dg-set-btn-save-dim-log").addEventListener("click", saveDimLogRetention);
      document.getElementById("dg-set-btn-dim-log-refresh").addEventListener("click", loadDimLogStats);
      document.getElementById("dg-set-btn-dim-log-cleanup").addEventListener("click", cleanupDimLogNow);
      document.getElementById("dg-set-pw-toggle").addEventListener("click", function () {
        showPasswordChange = !showPasswordChange;
        document.getElementById("dg-set-pw-new").type = showPasswordChange ? "text" : "password";
      });
      document.getElementById("dg-set-pw-copy").addEventListener("click", function () {
        var v = getStr("dg-set-pw-new");
        if (!v) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(v).then(
            function () {
              alert("Пароль скопирован");
            },
            function () {}
          );
        }
      });
      document.getElementById("dg-set-pw-length").addEventListener("change", function () {
        var n = Math.max(15, Number(this.value || 15));
        this.value = String(n);
      });
      document.getElementById("dg-set-pw-gen").addEventListener("click", function () {
        var len = Math.max(15, Number(document.getElementById("dg-set-pw-length").value || 15));
        set("dg-set-pw-new", randomPassword(len));

      document.getElementById("dg-set-pw-submit").addEventListener("click", changePassword);

      var specAdd = document.getElementById("dg-set-spec-add");
      if (specAdd) specAdd.addEventListener("click", addSpecialty);

      set("dg-set-pw-username", isAdmin() ? "admin" : currentUser() || "");
      document.getElementById("dg-set-pw-username").readOnly = !isAdmin();
      loadSettings();

      loadDimLogStats();

        applyUserFieldDisabled();
        set("dg-set-pw-username", isAdmin() ? "admin" : currentUser() || "");
        document.getElementById("dg-set-pw-username").readOnly = !isAdmin();
        loadUsers();
      });
    })();
  </script>
