      // дорисовывают DOM ВЫШЕ позиции пользователя (таблицы пользователей /
      // специальностей / матрицы доступа) или повторно прогоняют форму

      var dgUserScrollAt = 0;
      ["wheel", "touchmove", "keydown", "pointerdown"].forEach(function (ev) {
        window.addEventListener(ev, function () {
          dgUserScrollAt = Date.now();
        }, { passive: true });
      });
      function dgKeepScroll(maybePromise) {
        var prevY = window.scrollY || document.documentElement.scrollTop || 0;
        function tryRestore() {
          if (Date.now() - dgUserScrollAt < 1500) return;
          var cur = window.scrollY || document.documentElement.scrollTop || 0;
          if (Math.abs(cur - prevY) <= 4) return;
          window.scrollTo({ top: prevY, left: 0, behavior: "auto" });
        }
        function schedule() {
          requestAnimationFrame(function () {
            tryRestore();
            requestAnimationFrame(tryRestore);
          });
        }
        if (maybePromise && typeof maybePromise.then === "function") {
          return maybePromise.then(
            function (v) { schedule(); return v; },
            function (e) { schedule(); throw e; }
          );
        }
        schedule();
        return maybePromise;
      }

      function buildUsernameFromFullName(fullName) {
        var map = {
          а: "a", б: "b", в: "v", г: "g", д: "d", е: "e", ё: "e", ж: "zh", з: "z", и: "i", й: "y",
          к: "k", л: "l", м: "m", н: "n", о: "o", п: "p", р: "r", с: "s", т: "t", у: "u", ф: "f",
          х: "h", ц: "ts", ч: "ch", ш: "sh", щ: "sch", ъ: "", ы: "y", ь: "", э: "e", ю: "yu", я: "ya",
        };
        var source = String(fullName || "").trim().toLowerCase();
        var out = "";
        for (var i = 0; i < source.length; i++) {
          var ch = source[i];
          out += map[ch] !== undefined ? map[ch] : ch;
        }
        return out
          .replace(/[^a-z0-9\s_-]/g, "")
          .replace(/\s+/g, "_")
          .replace(/_+/g, "_")
          .replace(/^_+|_+$/g, "");
      }

      function randomPassword(length) {
        var len = length || 18;
        var chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*()-_=+";
        var randomBytes = new Uint32Array(len);
        crypto.getRandomValues(randomBytes);
        var out = "";
        for (var i = 0; i < len; i++) out += chars[randomBytes[i] % chars.length];
        return out;
      }

      function set(id, val) {

      /** prefix: "dg-set-auto_mssales_wd" → ids …_wd_1 …_wd_7. Пустой csv в БД — все дни (legacy); явное `1,2,3,4,5,6,7` — тоже все дни (после сохранения не схлопывать в пусто). */
      function applyAutoSyncWeekdayChecks(prefix, csv) {
        var set = Object.create(null);
        var s = String(csv == null ? "" : csv).trim();
        if (!s || s === "1,2,3,4,5,6,7") {
          for (var a = 1; a <= 7; a++) set[a] = true;
        } else {
          s.split(/[,;\s]+/).forEach(function (p) {
            var n = parseInt(String(p).trim(), 10);
            if (n >= 1 && n <= 7) set[n] = true;
          });
        }
        for (var d = 1; d <= 7; d++) {
          var el = document.getElementById(prefix + "_" + d);
          if (el) el.checked = !!set[d];
        }
      }

      function collectAutoSyncWeekdayCsv(prefix) {
        var out = [];
        for (var d = 1; d <= 7; d++) {
          var el = document.getElementById(prefix + "_" + d);
          if (el && el.checked) out.push(d);
        }
        if (out.length === 7) return "1,2,3,4,5,6,7";
        if (out.length === 0) return "";
        return out
          .slice()
          .sort(function (a, b) {
            return a - b;
          })
          .join(",");
      }

      /** Сравнение сохранённых дней недели: пусто и `1,2,3,4,5,6,7` — одно и то же («каждый день»). */
      function weekdaysCsvCanonicalForVerify(v) {
        var set = Object.create(null);
        var s = String(v == null ? "" : v).trim();
        if (!s) return "__ALL__";
        s.split(/[,;\s]+/).forEach(function (p) {
          var n = parseInt(String(p).trim(), 10);
          if (n >= 1 && n <= 7) set[n] = true;
        });
        var keys = [];
        for (var d = 1; d <= 7; d++) {
          if (set[d]) keys.push(d);
        }
        if (keys.length === 0 || keys.length === 7) return "__ALL__";
        return keys.join(",");
      }

      function isAutoSyncTimeStrComplete(s) {
        return /^\d{2}:\d{2}$/.test(String(s || "").trim());

      /** Пока в time ещё набирают значение — для сортировки берём последнее сохранённое. */
      function readAutoSyncTaskTimeStr(taskEl, timeEl) {
        var raw = timeEl ? String(timeEl.value || "").trim() : "";
        if (isAutoSyncTimeStrComplete(raw)) return raw.slice(0, 5);
        var saved = String(taskEl.getAttribute("data-as-schedule-time") || "").trim();
        if (isAutoSyncTimeStrComplete(saved)) return saved.slice(0, 5);
        return "00:00";

      function readAutoSyncTaskScheduleMeta(taskEl) {
        var cat = taskEl.getAttribute("data-as-category") || "internal";
        var en = readAutoSyncTaskEnabledFromDom(taskEl);
        var timeId = taskEl.getAttribute("data-as-time-id");
        var timeEl = timeId ? document.getElementById(timeId) : null;
        var timeStr = readAutoSyncTaskTimeStr(taskEl, timeEl);
        var wdPrefix = taskEl.getAttribute("data-as-weekdays-prefix");
        var wdCsv = wdPrefix ? collectAutoSyncWeekdayCsv(wdPrefix) : "";
        var nextMeta = computeAutoSyncNextRunMeta(en, timeStr, wdCsv);
        return {
          el: taskEl,

          category: cat,
          title: getAutoSyncTaskTitle(taskEl),
          enabled: en,
          timeStr: timeStr,
          timeMin: timeStrToMinutes(timeStr),

          nextMeta: nextMeta,

      function weekdaysSetsOverlap(csvA, csvB) {
        var a = parseWeekdaysSetFromCsv(csvA);
        var b = parseWeekdaysSetFromCsv(csvB);
        for (var d = 1; d <= 7; d++) {
          if (a[d] && b[d]) return true;
        }
        return false;
      }

      function findAutoSyncScheduleConflicts(metas) {
        var enabled = metas.filter(function (m) {
          return m.enabled;
        });
        var out = [];
        for (var i = 0; i < enabled.length; i++) {
          for (var j = i + 1; j < enabled.length; j++) {
            var a = enabled[i];
            var b = enabled[j];
            if (!weekdaysSetsOverlap(a.weekdaysCsv, b.weekdaysCsv)) continue;
            var diff = Math.abs(a.timeMin - b.timeMin);
            if (diff > AS_TIME_CLASH_MAX_DIFF_MIN) continue;
            var crossMs =
              (a.category === "import_ms" && b.category === "export_ms") ||
              (a.category === "export_ms" && b.category === "import_ms");
            out.push({
              a: a,
              b: b,
              diffMin: diff,
              exact: diff === 0,
              crossMs: crossMs,
            });
          }
        }
        out.sort(function (x, y) {
          if (x.crossMs !== y.crossMs) return x.crossMs ? -1 : 1;
          return x.diffMin - y.diffMin;
        });
        return out;
      }

      function getAutoSyncScheduleScrollRoot() {
        return document.querySelector(".app-main__outer") || document.scrollingElement || document.documentElement;
      }

      /** Не дёргать страницу при пересортировке / предупреждениях, пока правят время. */
      function withAutoSyncScheduleScrollPreserved(fn) {
        var root = getAutoSyncScheduleScrollRoot();
        var top = root.scrollTop;
        var left = root.scrollLeft;
        var ae = document.activeElement;
        var focusId = ae && ae.id ? ae.id : "";
        fn();
        requestAnimationFrame(function () {
          root.scrollTop = top;
          root.scrollLeft = left;
          if (focusId) {
            var el = document.getElementById(focusId);
            if (el) {
              try {
                el.focus({ preventScroll: true });
              } catch (e) {
                el.focus();
              }
            }
          }
        });
      }

      /** task key → { el, crossMs, partners: [{ task, title, timeStr }] } */
      function buildAutoSyncClashMap(conflicts) {
        var map = Object.create(null);
        function register(m, other, c) {
          var key = m.task;
          if (!key) return;
          if (!map[key]) map[key] = { el: m.el, crossMs: false, partners: [] };
          var entry = map[key];
          if (c.crossMs) entry.crossMs = true;
          var dup = entry.partners.some(function (p) {
            return p.task === other.task;
          });
          if (!dup) {
            entry.partners.push({
              task: other.task,
              title: other.title,
              timeStr: other.timeStr,
            });
          }
        }
        conflicts.forEach(function (c) {
          register(c.a, c.b, c);
          register(c.b, c.a, c);
        });
        return map;
      }

      function formatAutoSyncClashPartnerNames(partners, selfTimeStr) {
        return partners
          .map(function (p) {
            var label = "«" + p.title + "»";
            if (p.timeStr && p.timeStr === selfTimeStr) label += " (" + p.timeStr + ")";
            else if (p.timeStr) label += " (" + p.timeStr + ")";
            return label;
          })
          .join(", ");
      }

      function buildAutoSyncClashCardText(entry, selfTimeStr) {
        var names = formatAutoSyncClashPartnerNames(entry.partners, selfTimeStr);
        if (entry.crossMs) {
          return "Импорт ↔ экспорт в МС: совпадение с " + names;
        }
        return "Совпадение времени с " + names;
      }

      function syncAutoSyncClashOnTaskCard(el, entry, selfMeta) {
        var host = el.classList.contains("dg-as-export-child")
          ? el
          : el.querySelector(".dg-as-task-card") || el;
        host.classList.remove("dg-as-time-clash", "dg-as-time-clash-cross");
        var head = el.querySelector(".dg-as-task-head");
        var badge = head ? head.querySelector(".dg-as-clash-badge") : null;
        var line = el.querySelector(".dg-as-clash-line");
        if (!entry) {
          if (badge) badge.remove();
          if (line) line.remove();
          return;
        }
        host.classList.add(entry.crossMs ? "dg-as-time-clash-cross" : "dg-as-time-clash");
        if (!head) return;
        var text = buildAutoSyncClashCardText(entry, selfMeta ? selfMeta.timeStr : "");
        var short =
          entry.crossMs && entry.partners.length === 1
            ? "импорт ↔ экспорт"
            : entry.partners.length === 1
              ? "совпадение времени"
              : "совпадение (" + entry.partners.length + ")";
        if (badge) {
          badge.className = "dg-as-clash-badge" + (entry.crossMs ? " dg-as-clash-cross" : "");
          badge.textContent = short;
          badge.title = text;
        } else {
          badge = document.createElement("span");
          badge.className = "dg-as-clash-badge" + (entry.crossMs ? " dg-as-clash-cross" : "");
          badge.textContent = short;
          badge.title = text;
          head.appendChild(badge);
        }
        if (line) {
          line.className =
            "dg-as-clash-line small" + (entry.crossMs ? " dg-as-clash-line-cross" : "");
          line.textContent = text;
        } else {
          line = document.createElement("div");
          line.className =
            "dg-as-clash-line small" + (entry.crossMs ? " dg-as-clash-line-cross" : "");
          line.textContent = text;
          head.insertAdjacentElement("afterend", line);
        }
      }

      function syncAutoSyncClashUi(clashMap, metasByTask) {
        document.querySelectorAll(".dg-as-task").forEach(function (el) {
          var key = String(el.getAttribute("data-as-task") || "");
          syncAutoSyncClashOnTaskCard(el, key ? clashMap[key] : null, metasByTask[key]);
        });
      }

      function renderAutoSyncScheduleConflicts(metas) {
        var box = document.getElementById("dg-set-auto-sync-conflicts");
        var conflicts = findAutoSyncScheduleConflicts(metas);
        if (!box) return;
        var metasByTask = Object.create(null);
        metas.forEach(function (m) {
          if (m.task) metasByTask[m.task] = m;
        });
        var clashMap = buildAutoSyncClashMap(conflicts);
        syncAutoSyncClashUi(clashMap, metasByTask);
        if (!conflicts.length) {
          box.classList.add("d-none");
          box.innerHTML = "";
          return;
        }
        var html =
          "<strong>⚠ Совпадение времени запуска (МСК)</strong>" +
          '<p class="small mb-2 mt-1">Очередь автосинка выполняет задачи по одной — при одном слоте они не идут параллельно, но нагрузка на API/БД может наслоиться. Разнесите время, особенно <strong>импорт</strong> и <strong>экспорт</strong> в МойСклад.</p><ul class="small mb-0">';
        conflicts.forEach(function (c) {
          var timeNote = c.exact
            ? "одно и то же время <code>" + escAutoSyncHtml(c.a.timeStr) + "</code>"
            : "разница " + c.diffMin + " мин (<code>" + escAutoSyncHtml(c.a.timeStr) + "</code> и <code>" + escAutoSyncHtml(c.b.timeStr) + "</code>)";
          var crossNote = c.crossMs
            ? ' <span class="text-danger fw-semibold">импорт ↔ экспорт в МС</span>'
            : "";
          html +=
            "<li><strong>" +
            escAutoSyncHtml(c.a.title) +
            "</strong> и <strong>" +
            escAutoSyncHtml(c.b.title) +
            "</strong> — " +
            timeNote +
            crossNote +
            "</li>";
        });
        box.innerHTML = html + "</ul>";
        box.classList.remove("d-none");
      }

      function sortTasksByCategoryAndTime(container) {

        metas.sort(function (a, b) {
          var ca = AS_CATEGORY_SORT_ORDER[a.category] != null ? AS_CATEGORY_SORT_ORDER[a.category] : 99;
          var cb = AS_CATEGORY_SORT_ORDER[b.category] != null ? AS_CATEGORY_SORT_ORDER[b.category] : 99;
          if (ca !== cb) return ca - cb;
          if (a.timeMin !== b.timeMin) return a.timeMin - b.timeMin;
          return a.task.localeCompare(b.task, "ru");
        });
        var frag = document.createDocumentFragment();
        var lastCat = null;
        metas.forEach(function (m) {
          if (m.category !== lastCat) {

            frag.appendChild(createAutoSyncCategoryHeader(m.category));

        clearAutoSyncScheduleContainer(container);
        container.appendChild(frag);

      function getMoscowNowPartsForSchedule() {
        var parts = { date: "", time: "", weekdayMon1Sun7: 1 };
        try {
          var fmt = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Europe/Moscow",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            weekday: "short",
            hour12: false,
          });
          var map = Object.create(null);
          fmt.formatToParts(new Date()).forEach(function (p) {
            if (p.type !== "literal") map[p.type] = p.value;
          });
          parts.date = (map.year || "1970") + "-" + (map.month || "01") + "-" + (map.day || "01");
          parts.time = (map.hour || "00") + ":" + (map.minute || "00");
          var wd = String(map.weekday || "Mon").slice(0, 3).toLowerCase();
          var wdMap = { mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6, sun: 7 };
          parts.weekdayMon1Sun7 = wdMap[wd] || 1;
        } catch (e) {
          var d = new Date();
          parts.time = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
          var js = d.getDay();
          parts.weekdayMon1Sun7 = js === 0 ? 7 : js;
        }
        return parts;
      }

      function parseWeekdaysSetFromCsv(csv) {
        var set = Object.create(null);
        var s = String(csv == null ? "" : csv).trim();
        if (!s || s === "1,2,3,4,5,6,7") {
          for (var a = 1; a <= 7; a++) set[a] = true;
          return set;
        }
        s.split(/[,;\s]+/).forEach(function (p) {
          var n = parseInt(String(p).trim(), 10);
          if (n >= 1 && n <= 7) set[n] = true;
        });
        if (!Object.keys(set).length) {
          for (var b = 1; b <= 7; b++) set[b] = true;
        }
        return set;
      }

      function timeStrToMinutes(t) {
        var p = String(t || "00:00").slice(0, 5).split(":");
        return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
      }

      function computeAutoSyncNextRunMeta(enabled, timeStr, weekdaysCsv) {
        if (!enabled) return { sortKey: Number.MAX_SAFE_INTEGER, label: "выкл." };
        var now = getMoscowNowPartsForSchedule();
        var targetMin = timeStrToMinutes(timeStr);
        var wdSet = parseWeekdaysSetFromCsv(weekdaysCsv);
        var nowMin = timeStrToMinutes(now.time);
        for (var add = 0; add <= 8; add++) {
          var wd = ((now.weekdayMon1Sun7 - 1 + add) % 7) + 1;
          if (!wdSet[wd]) continue;
          var deltaMin = add * 24 * 60 + targetMin - nowMin;
          if (add === 0 && deltaMin <= 0) continue;
          var sortKey = deltaMin;
          var label;
          if (add === 0) {
            if (deltaMin < 60) label = "через " + deltaMin + " мин";
            else label = "сегодня " + String(timeStr || "").slice(0, 5);
          } else if (add === 1) {
            label = "завтра " + String(timeStr || "").slice(0, 5);
          } else {
            label = "через " + add + " дн., " + String(timeStr || "").slice(0, 5);
          }
          return { sortKey: sortKey, label: label };
        }
        return { sortKey: Number.MAX_SAFE_INTEGER, label: "—" };
      }

      function commitAutoSyncTimeInput(timeInput) {
        if (!timeInput || timeInput.type !== "time") return;

        var taskEl = timeInput.closest(".dg-as-task");
        if (taskEl) taskEl.setAttribute("data-as-schedule-time", String(timeInput.value).slice(0, 5));
        var root = getAutoSyncScheduleScrollRoot();
        var top = root.scrollTop;

        refreshAutoSyncScheduleUi({ sort: true, force: true });
        requestAnimationFrame(function () {
          root.scrollTop = top;
          root.scrollLeft = left;

      function scheduleAutoSyncTimeCommitAfterLeave(timeInput) {
        clearTimeout(autoSyncTimeCommitTimer);
        autoSyncTimeCommitTimer = setTimeout(function () {
          if (!timeInput || !document.body.contains(timeInput)) {
            autoSyncScheduleTimeEditing = null;
            return;
          }
          var ae = document.activeElement;
          if (ae === timeInput) return;
          if (ae && ae.type === "time" && isAutoSyncScheduleTimeInput(ae)) {
            autoSyncScheduleTimeEditing = ae;
            return;

          autoSyncScheduleTimeEditing = null;
          commitAutoSyncTimeInput(timeInput);

      function userMatchesSmartQuery(u, query) {
        var q = String(query || "").trim().toLowerCase();
        if (!q) return true;
        var archived = Number(u.is_archived || 0) === 1;
        var fields = {
          id: String(u.id || ""),
          username: String(u.username || "").toLowerCase(),
          name: String(u.full_name || "").toLowerCase(),
          full_name: String(u.full_name || "").toLowerCase(),
          specialty: String(u.specialty_name || "").toLowerCase(),
          status: archived ? "архивный архив" : "активный",
        };
        var re = /([a-z_]+):(?:"([^"]*)"|(\S+))|(\S+)/gi;
        var m;
        var bare = [];
        var keyedOk = true;
        while ((m = re.exec(q)) !== null) {
          if (m[1]) {
            var key = String(m[1] || "").toLowerCase();
            var val = String(m[2] != null ? m[2] : m[3] || "").toLowerCase();
            var map = {
              id: "id",
              username: "username",
              login: "username",
              name: "name",
              full_name: "full_name",
              specialty: "specialty",
              status: "status",
            };
            var fk = map[key];
            if (!fk) {
              bare.push(key + ":" + val);
              continue;
            }
            if (String(fields[fk]).indexOf(val) === -1) keyedOk = false;
          } else if (m[4]) {
            bare.push(String(m[4]).toLowerCase());
          }
        }
        if (!keyedOk) return false;
        if (!bare.length) return true;
        var hay = [fields.id, fields.username, fields.name, fields.specialty, fields.status].join(" ");
        for (var i = 0; i < bare.length; i++) {
          if (hay.indexOf(bare[i]) === -1) return false;
        }
        return true;
      }

      function filteredUsersList() {
        var needle = String(document.getElementById("dg-set-users-search").value || "").trim();
        var statusF = (document.getElementById("dg-set-users-filter-status") || {}).value || "active";
        var canF = (document.getElementById("dg-set-users-filter-can") || {}).value || "all";
        var specF = (document.getElementById("dg-set-users-filter-specialty") || {}).value || "all";
        var smin = (document.getElementById("dg-set-users-sess-min") || {}).value || "";
        var smax = (document.getElementById("dg-set-users-sess-max") || {}).value || "";
        return users.filter(function (u) {
          var archived = Number(u.is_archived || 0) === 1;
          if (statusF === "active" && archived) return false;
          if (statusF === "archived" && !archived) return false;
          if (!userMatchesSmartQuery(u, needle)) return false;
          var canManage = u.username === "admin" || Number(u.can_manage_users || 0) === 1 ? "1" : "0";
          if (canF !== "all" && canManage !== canF) return false;
          if (specF === "none") {
            if (u.specialty_id != null && String(u.specialty_id) !== "" && Number(u.specialty_id) > 0) return false;
          } else if (specF !== "all") {
            if (String(u.specialty_id || "") !== String(specF)) return false;
          }
          var activeSessions = userSessionsOnlineCount(u);
          var min = Number(smin || "");
          var max = Number(smax || "");
          if (Number.isFinite(min) && String(smin).trim() !== "" && activeSessions < min) return false;
          if (Number.isFinite(max) && String(smax).trim() !== "" && activeSessions > max) return false;
          return true;
        });
      }

      /**
       * Универсальный движок «Сохранить» для страницы Настроек.
       *
       * По правилу `datagon-settings-save-feedback`: каждая кнопка «Сохранить» обязана
       * показывать inline-результат рядом с собой (без alert как единственного источника).
       *
       * Параметры:
       *   sectionId      — id секции (например, "marketplaces"). Под кнопкой ожидается
       *                    `<div id="dg-set-${sectionId}-save-msg" class="alert d-none">`,
       *                    кнопка — `dg-set-btn-save-${sectionId}`.
       *   payload        — объект для POST /api/settings.
       *   okText         — короткое описание успеха (например, "Настройки маркетплейсов сохранены").
       *   verifyKeys     — список ключей, по которым после успеха сверяем фактически
       *                    сохранённое значение в БД через GET /api/settings (чтобы поймать
       *                    ситуации «POST вернул success, но whitelist бэкенда отбросил поле»).
       */
      function setSaveMsg(sectionId, kind, html) {
        var box = document.getElementById("dg-set-" + sectionId + "-save-msg");
        if (!box) return;
        var cls = kind === "success" ? "alert-success" : kind === "warning" ? "alert-warning" : kind === "danger" ? "alert-danger" : "alert-secondary";
        box.className = "alert mt-3 mb-0 " + cls;
        box.innerHTML = html;
      }
      function maskValue(v) {
        var s = String(v == null ? "" : v);
        if (s === "") return "<em>не задан</em>";
        if (s.length <= 8) return "*** (" + s.length + " симв.)";
        return s.slice(0, 4) + "…" + s.slice(-4) + " (" + s.length + " симв.)";
      }
      function fmtVerify(payload, settings, verifyKeys) {
        if (!verifyKeys || !verifyKeys.length) return "";
        var lines = [];
        var anyMismatch = false;
        verifyKeys.forEach(function (k) {
          if (!(k in payload)) return;
          var sent = payload[k];
          var got = settings && settings[k] !== undefined ? settings[k] : "";
          var mask = /api_key|password|secret/i.test(k);
          var sentDisplay = mask ? maskValue(sent) : (sent === "" ? "<em>пусто</em>" : "<code>" + String(sent) + "</code>");
          var gotDisplay = mask ? maskValue(got) : (got === "" || got == null ? "<em>пусто</em>" : "<code>" + String(got) + "</code>");
          var same = String(sent || "") === String(got || "");
          if (!same && /^sales_formula_/.test(String(k || ""))) {
            var sn = parseFloat(String(sent).replace(",", "."));
            var gn = parseFloat(String(got).replace(",", "."));
            if (Number.isFinite(sn) && Number.isFinite(gn)) same = Math.abs(sn - gn) < 1e-6;
          }
          if (!same && /_weekdays$/.test(String(k || ""))) {
            same = weekdaysCsvCanonicalForVerify(sent) === weekdaysCsvCanonicalForVerify(got);
          }
          if (!same) anyMismatch = true;
          lines.push("• <strong>" + k + ":</strong> в БД " + gotDisplay + (same ? "" : " (вы отправили " + sentDisplay + ")"));
        });
        return { html: lines.join("<br>"), mismatch: anyMismatch };
      }
      function runSaveWithInlineFeedback(opts) {
        var sectionId = opts.sectionId;
        var btnId = "dg-set-btn-save-" + sectionId;
        var btn = document.getElementById(btnId);
        var payload = opts.payload || {};
        var okText = opts.okText || "Сохранено";
        var verifyKeys = Array.isArray(opts.verifyKeys) ? opts.verifyKeys : [];
        if (btn) btn.disabled = true;
        setSaveMsg(sectionId, "warning", "Сохраняем…");
        return dgKeepScroll(
          fetch("/api/settings", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          })
            .then(function (r) {
              return r.json().then(function (j) { return { r: r, j: j }; });
            })
            .then(function (x) {
              if (!x.r.ok || !x.j.success) {
                throw new Error((x.j && x.j.error) || ("HTTP " + x.r.status));
              }
              return fetch("/api/settings", { credentials: "same-origin" }).then(function (r) { return r.json(); });
            })
            .then(function (settings) {
              applySettingsToForm(settings || {});
              var verify = fmtVerify(payload, settings || {}, verifyKeys);
              var ok = !verify || !verify.mismatch;
              var html = "<strong>" + (ok ? okText + "." : okText + ", но фактическое значение в БД отличается!") + "</strong>";
              if (verify && verify.html) html += "<br>" + verify.html;
              html += "<br><span class=\"small text-muted\">При смене ключей/паролей маркетплейсов, расписаний и параметров API нужен перезапуск Node для применения.</span>";
              setSaveMsg(sectionId, ok ? "success" : "warning", html);
            })
            .catch(function (e) {
              setSaveMsg(sectionId, "danger", "<strong>Ошибка сохранения.</strong> " + (e && e.message ? e.message : String(e)));
            })
            .then(function () {
              if (btn) btn.disabled = false;
            })
        );
      }
      // Совместимость со старым кодом: upsertSettings(payload, okText) теперь использует
      // тот же inline-движок, при условии что у вызывающей кнопки есть message-box.
      // Имя секции — суффикс id кнопки после "dg-set-btn-save-".
      function upsertSettings(payload, okText, sectionId, verifyKeys) {
        return runSaveWithInlineFeedback({
          sectionId: sectionId || "general",
          payload: payload,
          okText: okText || "Сохранено",
          verifyKeys: verifyKeys || Object.keys(payload || {}),
        });
      }

        ms_orders: "Заказы в МС",
        marketplaces: "Маркетплейсы (все)",

      };
      function escAutoRunHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }
      function formatAutoSyncQueueForUi(queue) {
        if (!Array.isArray(queue) || !queue.length) return "пусто (ваша задача может начаться сразу, если воркер был свободен).";
        return queue
          .map(function (t) {
            var k = "";
            if (t && typeof t === "object" && t.type != null) k = String(t.type || "").trim();
            else k = String(t || "").trim();
            return escAutoRunHtml(AUTO_RUN_TASK_LABELS[k] || k);
          })
          .join(" → ");
      }
      function showAutoSyncRunBanner(kind, htmlBody) {
        var el = document.getElementById("dg-set-auto-run-msg");
        if (!el) return;
        el.classList.remove("d-none", "alert-success", "alert-warning", "alert-danger", "alert-info");
        var cls =
          kind === "ok"
            ? "alert-success"
            : kind === "warn"
              ? "alert-warning"
              : kind === "err"
                ? "alert-danger"
                : "alert-info";
        el.classList.add(cls);
        el.innerHTML = htmlBody;
        try {
          el.scrollIntoView({ behavior: "smooth", block: "nearest" });
        } catch (_) {}
      }
      function resolveAutoSyncTaskKey(task, btn) {
        var row = btn && btn.closest ? btn.closest(".dg-as-task") : null;
        var fromDom = row && row.getAttribute("data-as-task");
        return String((fromDom && fromDom.trim()) || task || "").trim();
      }

      var asLogState = { task: "", title: "" };

      function moscowTodayInputValue() {
        try {
          return new Intl.DateTimeFormat("en-CA", {
            timeZone: "Europe/Moscow",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          }).format(new Date());
        } catch (_) {
          var d = new Date();
          return d.toISOString().slice(0, 10);
        }
      }

      function fmtAsLogTime(v) {
        if (!v) return "—";
        try {
          return new Intl.DateTimeFormat("ru-RU", {
            timeZone: "Europe/Moscow",
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          }).format(new Date(v));
        } catch (_) {
          return String(v);
        }
      }

      function asLogStatusBadge(st) {
        var s = String(st || "").toLowerCase();
        var cls = "bg-secondary";
        if (s === "completed" || s === "done") cls = "bg-success";
        else if (s === "failed" || s === "error") cls = "bg-danger";
        else if (s === "running") cls = "bg-info";
        else if (s === "queued") cls = "bg-secondary";
        else if (s === "interrupted" || s === "partial") cls = "bg-warning text-dark";
        return '<span class="badge ' + cls + '">' + escAutoRunHtml(s || "—") + "</span>";
      }

      function renderAsLogRuns(rows) {
        var body = document.getElementById("dg-set-as-log-body");
        if (!body) return;
        body.replaceChildren();
        if (!rows || !rows.length) {
          var empty = document.createElement("p");
          empty.className = "text-muted mb-0";
          empty.textContent = "За выбранный день запусков этой задачи не было.";
          body.appendChild(empty);
          return;
        }
        rows.forEach(function (r) {
          var box = document.createElement("div");
          box.className = "dg-set-as-log-run";
          var top = document.createElement("div");
          top.className = "d-flex flex-wrap align-items-center gap-2";
          top.innerHTML =
            '<span class="text-muted">#' +
            escAutoRunHtml(String(r.id)) +
            "</span>" +
            asLogStatusBadge(r.status) +
            '<span class="badge bg-light text-dark border">' +
            escAutoRunHtml(String(r.trigger_type || "—")) +
            "</span>" +
            '<span class="small">' +
            escAutoRunHtml(fmtAsLogTime(r.started_at)) +
            " → " +
            escAutoRunHtml(r.finished_at ? fmtAsLogTime(r.finished_at) : "ещё идёт") +
            "</span>";
          box.appendChild(top);
          var pre = document.createElement("pre");
          pre.textContent = String(r.message || "").trim() || "(пустое сообщение)";
          box.appendChild(pre);
          body.appendChild(box);
        });
      }

      function loadAsLogForSelectedDate() {
        var dateEl = document.getElementById("dg-set-as-log-date");
        var body = document.getElementById("dg-set-as-log-body");
        var loadBtn = document.getElementById("dg-set-as-log-load");
        if (!asLogState.task || !dateEl || !body) return;
        var day = String(dateEl.value || "").trim() || moscowTodayInputValue();
        dateEl.value = day;
        body.innerHTML = '<p class="text-muted mb-0">Загрузка…</p>';
        if (loadBtn) loadBtn.disabled = true;
        var qs = new URLSearchParams();
        qs.set("task", asLogState.task);
        qs.set("date", day);
        var procLink = document.getElementById("dg-set-as-log-processes-link");
        if (procLink) procLink.href = "/processes.html?forDate=" + encodeURIComponent(day);
        fetch("/api/settings/auto-sync-runs?" + qs.toString(), { credentials: "same-origin" })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok || !x.j || x.j.success === false) {
              throw new Error((x.j && x.j.error) || "HTTP " + x.r.status);
            }
            if (x.j.moscow_today && dateEl.max !== x.j.moscow_today) {
              dateEl.max = x.j.moscow_today;
            }
            renderAsLogRuns(x.j.data || []);
          })
          .catch(function (e) {
            body.innerHTML =
              '<p class="text-danger mb-0">' + escAutoRunHtml((e && e.message) || "Ошибка загрузки") + "</p>";
          })
          .finally(function () {
            if (loadBtn) loadBtn.disabled = false;
          });
      }

      function openAsLogModal(task, title) {

      function runAutoSyncNow(task, label, btnId) {
        var btn = btnId ? document.getElementById(btnId) : null;
        task = resolveAutoSyncTaskKey(task, btn);
        if (!task) {
          showAutoSyncRunBanner(
            "err",
            "<strong>Ошибка</strong><div class=\"small mt-1\">Не удалось определить тип задачи (data-as-task на карточке).</div>"
          );
          return;
        }
        if (autoSyncRunRequestInFlight[task]) {
          showAutoSyncRunBanner(
            "warn",
            "<strong>Подождите</strong><div class=\"small mt-1\">По этой задаче запрос к серверу уже выполняется — дождитесь ответа, не нажимайте повторно.</div>"
          );
          return;
        }
        autoSyncRunRequestInFlight[task] = true;
        var hint = document.getElementById("dg-set-auto-sync-force-hint");
        var prevBtnHtml = btn ? btn.innerHTML : "";
        if (btn) {
          btn.disabled = true;
          btn.setAttribute("aria-busy", "true");
          btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Запрос…';
        }
        if (hint) hint.textContent = "Запрос к серверу: " + label + "…";
        showAutoSyncRunBanner(
          "info",
          "<strong>Отправляем на сервер…</strong><div class=\"small mt-1\">" + escAutoRunHtml(label) + "</div>"
        );
        fetch("/api/settings/auto-sync-run", {
          method: "POST",
          credentials: "same-origin",
          headers: authHeaders(true),
          body: JSON.stringify({ task: task }),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok || !x.j.success) {
              var errMsg = (x.j && x.j.error) || "Не удалось запустить автосинхронизацию";
              if (x.j && x.j.task_received != null && String(x.j.task_received) !== task) {
                errMsg += " (сервер получил: «" + x.j.task_received + "»)";
              }
              if (x.j && x.j.hint) errMsg += ". " + x.j.hint;
              throw new Error(errMsg);
            }
            var j = x.j || {};
            var timeStr = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
            var runningKeys = Array.isArray(j.running_tasks) ? j.running_tasks.filter(Boolean) : [];
            var runningTitles = runningKeys
              .map(function (k) {
                return escAutoRunHtml(AUTO_RUN_TASK_LABELS[String(k)] || String(k));
              })
              .join(", ");
            var workerLine =
              j.runner_active === true
                ? runningTitles
                  ? "Воркер сейчас занят: выполняется — <strong>" + runningTitles + "</strong>."
                  : "Воркер автосинка сейчас <strong>занят</strong> (активная задача не передана в ответе — откройте «Процессы» и обновите страницу)."
                : "Воркер автосинка сейчас <strong>свободен</strong>.";
            var queueLine = "Очередь после ответа сервера: " + formatAutoSyncQueueForUi(j.queue) + "";
            var procLink =
              ' <a href="/processes.html">Открыть «Логи фоновых процессов»</a> — там статус и прогресс.';
            if (j.queued === false) {
              var why =
                j.skip_reason === "already_running"
                  ? "эта задача <strong>уже выполняется</strong> (новый запуск не поставлен). Смотрите журнал на «Процессы»."
                  : j.skip_reason === "already_queued"
                    ? "такая задача <strong>уже в очереди</strong> — повторно не добавляли."
                    : j.skip_reason
                      ? "не поставлено в очередь: <code>" + escAutoRunHtml(j.skip_reason) + "</code>."
                      : "сервер не поставил задачу в очередь (причина не указана).";
              if (hint) hint.textContent = label + ": " + String(j.skip_reason || "не в очереди");
              showAutoSyncRunBanner(
                "warn",
                "<strong>" +
                  escAutoRunHtml(label) +
                  " — без повторного запуска</strong><div class=\"small mt-1\">" +
                  why +
                  "</div><div class=\"small mt-1\">" +
                  workerLine +
                  " " +
                  queueLine +
                  procLink +
                  "</div><div class=\"small text-muted mt-1\">Ответ сервера: " +
                  escAutoRunHtml(timeStr) +
                  "</div>"
              );
              return;
            }
            if (hint) hint.textContent = label + ": поставлено в очередь (" + timeStr + ").";
            showAutoSyncRunBanner(
              "ok",
              "<strong>" +
                escAutoRunHtml(label) +
                " — принято</strong><div class=\"small mt-1\">Задача добавлена в очередь автосинхронизации. Если очередь была пуста и воркер свободен — выполнение могло начаться сразу после этого ответа.</div><div class=\"small mt-1\">" +
                workerLine +
                " " +
                queueLine +
                procLink +
                "</div><div class=\"small text-muted mt-1\">Ответ сервера: " +
                escAutoRunHtml(timeStr) +
                "</div>"
            );
          })
          .catch(function (e) {
            var msg = e.message || "Ошибка запуска автосинхронизации";
            if (hint) hint.textContent = "Ошибка: " + msg;
            showAutoSyncRunBanner(
              "err",
              "<strong>Ошибка запуска</strong><div class=\"small mt-1\">" + escAutoRunHtml(msg) + "</div>"
            );
          })
          .finally(function () {
            autoSyncRunRequestInFlight[task] = false;
            if (btn) {
              btn.disabled = false;
              btn.removeAttribute("aria-busy");
              btn.innerHTML = prevBtnHtml;
            }
          });
      }

      function loadAsrStats() {
        var box = document.getElementById("dg-set-asr-log-info");
        if (box) box.textContent = "Статистика auto_sync_runs: загрузка…";
        return dgKeepScroll(
          fetch("/api/settings/auto-sync-runs/stats", { credentials: "same-origin" })
            .then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
            .then(function (x) {
              if (!box) return;
              box.replaceChildren();
              if (!x.r.ok || !x.j || x.j.success === false) {
                box.textContent = "Ошибка статистики auto_sync_runs: " + ((x.j && x.j.error) || "неизвестно");
                return;
              }
              var j = x.j;
              var bt = j.by_task || {};
              var taskKeys = Object.keys(bt).sort();
              var taskStr = taskKeys.map(function (k) { return k + "=" + (bt[k] || 0); }).join(", ");
              var oldestStr = j.oldest_started_at
                ? new Date(j.oldest_started_at).toLocaleString("ru-RU", { timeZone: "Europe/Moscow" })
                : "—";
              var newestStr = j.newest_started_at
                ? new Date(j.newest_started_at).toLocaleString("ru-RU", { timeZone: "Europe/Moscow" })
                : "—";
              var d1 = document.createElement("div");
              d1.textContent = "Всего записей: " + (j.total || 0) + (taskStr ? " (" + taskStr + ")" : "");
              var d2 = document.createElement("div");
              d2.textContent = "Самый старый старт: " + oldestStr + " · самый свежий старт: " + newestStr;
              var d3 = document.createElement("div");
              d3.textContent = "Сейчас без финиша (running): " + (j.open_running || 0);
              var d4 = document.createElement("div");
              d4.textContent = "Текущий retention: " + (j.retention_days || 0) +
                " дней · по нему будет удалено сейчас: " + (j.older_than_retention || 0);
              box.appendChild(d1);
              box.appendChild(d2);
              box.appendChild(d3);
              box.appendChild(d4);
            })
            .catch(function (e) {
              if (!box) return;
              box.replaceChildren();
              box.textContent = "Сетевая ошибка статистики auto_sync_runs: " + ((e && e.message) || e);
            })
        );
      }

      /**

       * с тем же названием на /settings.html: всего строк,
       * самая старая/свежая запись, разбивка по action и сколько будет
       * удалено по текущему retention.
       */
      function loadDimLogStats() {
        var box = document.getElementById("dg-set-dim-log-info");
        if (box) box.textContent = "Статистика ms_dimensions_log: загрузка…";
        return dgKeepScroll(
          fetch("/api/exports/dimensions/log/stats", { credentials: "same-origin" })
            .then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
            .then(function (x) {
              if (!box) return;
              box.replaceChildren();
              if (!x.r.ok || !x.j || x.j.success === false) {
                box.textContent = "Ошибка статистики ms_dimensions_log: " + ((x.j && x.j.error) || "неизвестно");
                return;
              }
              var j = x.j;
              var act = j.by_action || {};
              var actStr = ["set", "sync_ms", "sync_ms_skip", "sync_ms_error", "delete"]
                .filter(function (k) { return act[k] != null; })
                .map(function (k) { return k + "=" + (act[k] || 0); })
                .join(", ");

          .then(function (r) {

            window.localStorage.setItem("isLoggedIn", "true");
            window.localStorage.setItem("currentUser", json.username || username);
            window.localStorage.setItem("currentUserDisplayName", json.full_name || json.username || username);
            window.localStorage.setItem("isAdmin", json.isAdmin ? "true" : "false");
            window.localStorage.setItem("canManageUsers", json.canManageUsers ? "true" : "false");
            if (json.auth_token) window.localStorage.setItem("authToken", json.auth_token);
            try {
              if (json.page_modes && typeof json.page_modes === "object") {
                window.localStorage.setItem("datagonPageModesV1", JSON.stringify(json.page_modes));
              } else window.localStorage.removeItem("datagonPageModesV1");
              if (json.specialty_name) window.localStorage.setItem("datagonSpecialtyNameV1", String(json.specialty_name));
              else window.localStorage.removeItem("datagonSpecialtyNameV1");
            } catch (eLs) {}
            alert("Вы вошли как " + (json.username || username));
            window.location.reload();
          })
          .catch(function (e) {
            alert(e.message || "Ошибка входа");
          });
      }

            document.getElementById("dg-set-sales_formula_project_mode_selected") &&
            document.getElementById("dg-set-sales_formula_project_mode_selected").checked;
          wrap.classList.toggle("d-none", !modeSelected);
        };

        function renderProjects(projects) {
          var saved = new Set(parseSavedUuids());
          if (!projects.length) {
            listEl.innerHTML = '<p class="text-muted mb-0">Проекты не найдены в отгрузках за период. Сначала выполните синк «Продажи МС».</p>';
            return;
          }
          listEl.innerHTML = projects
            .map(function (p) {
              var u = String(p.uuid || "").trim().toLowerCase();
              var name = String(p.name || u || "—");
              var cnt = Number(p.count || 0);
              var checked = saved.has(u) ? " checked" : "";
              return (
                '<div class="form-check">' +
                '<input class="form-check-input" type="checkbox" id="dg-sf-proj-' +
                u.replace(/[^a-z0-9]/g, "") +
                '" data-dg-sf-project-uuid="' +
                u +
                '"' +
                checked +
                " />" +
                '<label class="form-check-label" for="dg-sf-proj-' +
                u.replace(/[^a-z0-9]/g, "") +
                '">' +
                name +
                ' <span class="text-muted">(' +
                cnt +
                " отгр.)</span></label></div>"
              );
            })
            .join("");
        }

        function loadProjects() {
          var days = getNum("dg-set-sales_formula_sales_window_days", 365);
          if (statusEl) statusEl.textContent = "Загрузка проектов…";
          fetch("/api/settings/ms-demand-projects?days=" + encodeURIComponent(String(days)), { credentials: "same-origin" })
            .then(function (r) {
              return r.json();
            })
            .then(function (j) {
              if (!j || !j.success) throw new Error((j && j.error) || "Ошибка загрузки");
              renderProjects(j.projects || []);
              if (statusEl) {
                statusEl.textContent =
                  "Показаны проекты с отгрузками за " + String(j.days || days) + " дн. Отметьте нужные и нажмите «Сохранить формулу продаж».";
              }
            })
            .catch(function (e) {
              if (statusEl) statusEl.textContent = (e && e.message) || "Не удалось загрузить проекты";
              listEl.innerHTML = "";
            });
        }

        ["dg-set-sales_formula_project_mode_all", "dg-set-sales_formula_project_mode_selected"].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.addEventListener("change", window.dgSyncSalesFormulaProjectsUi);
        });
        var reloadBtn = document.getElementById("dg-set-sales-formula-projects-reload");
        if (reloadBtn) reloadBtn.addEventListener("click", loadProjects);
        var selAllBtn = document.getElementById("dg-set-sales-formula-projects-select-all");
        if (selAllBtn) {
          selAllBtn.addEventListener("click", function () {
            listEl.querySelectorAll('input[type="checkbox"][data-dg-sf-project-uuid]').forEach(function (cb) {
              cb.checked = true;
            });
          });
        }
        var clearBtn = document.getElementById("dg-set-sales-formula-projects-clear");
        if (clearBtn) {
          clearBtn.addEventListener("click", function () {
            listEl.querySelectorAll('input[type="checkbox"][data-dg-sf-project-uuid]').forEach(function (cb) {
              cb.checked = false;
            });
          });
        }
        window.dgSyncSalesFormulaProjectsUi();
        loadProjects();
      })();

      function bindSettingsSectionsCollapse() {
        var STORAGE_PREFIX = "datagon_settings_section_collapsed_v1:";
        var page = document.querySelector(".datagon-settings-page");
        if (!page) return;

        function sectionKey(card, idx) {
          if (card.id) return card.id;
          var span = card.querySelector(".card-header span");
          if (span && span.textContent) {
            return (
              "sec-" +
              span.textContent
                .trim()
                .replace(/[^\w\u0400-\u04FF]+/gi, "_")
                .replace(/^_+|_+$/g, "")
                .slice(0, 56)
            );
          }
          return "sec-" + idx;
        }

        page.querySelectorAll(".main-card.card").forEach(function (card, idx) {
          var header = card.querySelector(":scope > .card-header");
          var body = card.querySelector(":scope > .card-body");
          if (!header || !body || header.querySelector("[data-dg-set-collapse-toggle]")) return;

          var storageKey = STORAGE_PREFIX + sectionKey(card, idx);
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn btn-sm btn-outline-secondary flex-shrink-0 ms-auto";
          btn.setAttribute("data-dg-set-collapse-toggle", "1");
          btn.setAttribute("data-dg-no-activity", "1");
          if (!header.classList.contains("d-flex")) {
            header.classList.add("d-flex", "align-items-center", "gap-2", "flex-wrap");
          } else if (!header.classList.contains("flex-wrap")) {
            header.classList.add("flex-wrap");
          }
          header.appendChild(btn);

          var collapsed = false;
          try {
            collapsed = window.localStorage.getItem(storageKey) === "1";
          } catch (e) {}
          function apply() {
            body.style.display = collapsed ? "none" : "";
            btn.textContent = collapsed ? "Развернуть" : "Свернуть";
          }
          apply();
          btn.addEventListener("click", function () {
            collapsed = !collapsed;
            try {
              window.localStorage.setItem(storageKey, collapsed ? "1" : "0");
            } catch (e2) {}
            apply();
          });
        });
      }
