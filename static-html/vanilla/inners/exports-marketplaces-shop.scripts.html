  <script>
    (function () {
      var API = "/api/exports/marketplaces";
      var shop = String(document.body.getAttribute("data-dg-mp-shop") || "ozon").trim();
      var exportPath =
        shop === "wildberries" ? "/wildberries" : shop === "yandex" ? "/yandex-market" : "/ozon";
      var PAGE_SIZE_KEY = "dg.mp.page.size." + shop;
      var COLS_VISIBLE_KEY = "dg.mp.cols." + shop;
      var COLS_WIDTH_KEY = "dg.mp.colwidths." + shop;
      var FILTER_EXCLUDE_POSTERS_KEY = "dg.mp.flt.excl_posters." + shop;
      var FILTER_MANAGER_KEY = "dg.mp.flt.manager." + shop;
      var FILTER_CONTENT_MGR_KEY = "dg.mp.flt.cmgr." + shop;
      var DEFAULT_PAGE_SIZE = 100;
      var ALLOWED_PAGE_SIZES = [50, 100, 200, 500];

      // Дефолтные ширины (px) по «осмысленному» ключу. Для остальных — DEFAULT_COL_WIDTH.
      var DEFAULT_COL_WIDTH = 140;
      var COL_WIDTH_DEFAULTS_BY_KEY = {
        offer_id: 130,
        vendor_code: 130,
        shop_sku: 130,
        manager: 150,
        content_manager: 160,
        name: 360,
        title: 360,
        price: 110,
        vat: 90,
        status: 130,
        block_reason: 220,
        stock: 90,
        stock_fit: 90,
        length_cm: 100,
        width_cm: 100,
        height_cm: 100,
        weight_kg: 100,
        length: 100,
        width: 100,
        height: 100,
        weight: 100,
        cabinet_url: 110,
        buyer_url: 110,
        updated: 130,
      };
      var COL_MIN_WIDTH = 40;
      var COL_MAX_WIDTH = 800;

      // Колонки, скрытые ПО УМОЛЧАНИЮ (при первом открытии или нажатии «По умолчанию»).
      // Цель — чтобы таблица 14–15 колонок не «выкатывалась» за карточку при стандартном
      // ширине окна. Пользователь включит при необходимости через «🧩 Столбцы».
      var DEFAULT_HIDDEN_COLS = {
        block_reason: true,
        cabinet_url: true,
        buyer_url: true,
        length_cm: true,
        width_cm: true,
        height_cm: true,
        weight_kg: true,
        length: true,
        width: true,
        height: true,
        weight: true,
      };

      // Ключи, по которым работает «умный поиск» (артикул + наименование).
      // Поля приходят с бэкенда: Ozon → offer_id/name, WB → vendor_code/shop_sku/title,
      // Yandex → offer_id/shop_sku/name. Также поддерживаем sku/nm_id, если они в headers.
      var SEARCH_KEYS = ["offer_id", "vendor_code", "shop_sku", "sku", "nm_id", "name", "title"];
      // Приоритет «артикулов» для дефолтной сортировки: WB присылает vendor_code,
      // Ozon — offer_id, Yandex — offer_id/shop_sku. Берём первый, что есть в headers.
      var DEFAULT_SORT_KEY_PRIORITY = ["vendor_code", "offer_id", "shop_sku", "sku", "nm_id"];
      // Колонки, в которых значения сортируются как числа (а не как строки).
      // price хранится с разделителями (' 1 230 ₽'), но извлечём цифры — см. asNumberOrNaN.
      var NUMERIC_COL_HINT = {
        price: true,
        vat: true,
        stock: true,
        stock_fit: true,
        length_cm: true, width_cm: true, height_cm: true, weight_kg: true,
        length: true, width: true, height: true, weight: true,
      };

      var state = {
        headers: [],
        headerLabels: [],
        rowsAll: [],
        rows: [],
        page: 1,
        pageSize: DEFAULT_PAGE_SIZE,
        visible: {},
        colWidths: {},
        search: "",
        sortKey: null,
        sortDir: "asc",
        // Расширенные фильтры (применяются ДО умного поиска и сортировки):
        // exclude_posters — отбросить строки, в name/title которых встречается «плакат»;
        // manager / content_manager — точное совпадение (пусто = «все»).
        filters: {
          exclude_posters: false,
          manager: "",
          content_manager: "",
        },
      };

      function authHeaders(json) {
        var headers = {};
        var username = window.localStorage.getItem("currentUser");
        var token = window.localStorage.getItem("authToken");
        if (username) headers["x-auth-username"] = username;
        if (token) headers["x-auth-token"] = token;
        if (json) headers["Content-Type"] = "application/json";
        return headers;
      }

      function setMsg(text, kind) {
        var el = document.getElementById("dg-mp-msg");
        if (!el) return;
        el.classList.remove("d-none", "alert-danger", "alert-success", "alert-secondary", "alert-warning");
        el.classList.add("alert-" + (kind || "secondary"));
        el.textContent = text || "";
      }

      function fmtMs(ms) {
        var n = Number(ms) || 0;
        if (n < 1000) return n + " мс";
        var s = n / 1000;
        if (s < 60) return s.toFixed(s < 10 ? 2 : 1) + " с";
        var m = Math.floor(s / 60);
        var rest = Math.round(s - m * 60);
        return m + " мин " + rest + " с";
      }

      function renderSummaryLog(summary) {
        var box = document.getElementById("dg-mp-log");
        if (!box) return;
        if (!summary || !Array.isArray(summary.steps) || !summary.steps.length) {
          box.classList.add("d-none");
          box.innerHTML = "";
          return;
        }
        var rows = summary.steps
          .map(function (s) {
            var ctxStr = "";
            if (s.ctx && typeof s.ctx === "object") {
              var keys = Object.keys(s.ctx);
              if (keys.length) {
                ctxStr =
                  " " +
                  keys
                    .map(function (k) {
                      var v = s.ctx[k];
                      var sv = typeof v === "object" && v !== null ? JSON.stringify(v) : String(v == null ? "" : v);
                      return k + "=" + sv;
                    })
                    .join(" ");
              }
            }
            return (
              '<div class="dg-mp-log-row"><span class="dg-mp-log-t">+' +
              fmtMs(s.tMs) +
              '</span><span class="dg-mp-log-msg">' +
              escCell(s.msg + ctxStr) +
              "</span></div>"
            );
          })
          .join("");
        box.classList.remove("d-none");
        box.innerHTML =
          '<div class="dg-mp-log-head">Лог обновления (всего ' +
          fmtMs(summary.durationMs || 0) +
          ", шагов: " +
          summary.steps.length +
          ')</div><div class="dg-mp-log-body">' +
          rows +
          "</div>";
      }

      function escCell(v) {
        var s = v === null || v === undefined ? "" : String(v);
        if (s.length > 500) s = s.slice(0, 497) + "…";
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
      }

      function isHttpUrl(value) {
        var s = value === null || value === undefined ? "" : String(value).trim();
        return /^https?:\/\//i.test(s);
      }

      function renderCellValue(headerKey, rawValue) {
        var val = rawValue === null || rawValue === undefined ? "" : String(rawValue);
        var isLinkColumn = headerKey === "cabinet_url" || headerKey === "buyer_url";
        if ((isLinkColumn || isHttpUrl(val)) && val.trim()) {
          var safeHref = escCell(val.trim());
          return (
            '<a href="' + safeHref + '" target="_blank" rel="noopener noreferrer" class="text-primary">Открыть</a>'
          );
        }
        return escCell(val);
      }

      function fmtNum(n) {
        var x = Math.max(0, Math.floor(Number(n) || 0));
        return x.toLocaleString("ru-RU");
      }

      // ---- Page size storage ----
      function readStoredPageSize() {
        try {
          var stored = parseInt(window.localStorage.getItem(PAGE_SIZE_KEY) || "", 10);
          if (ALLOWED_PAGE_SIZES.indexOf(stored) >= 0) return stored;
        } catch (e) {}
        return DEFAULT_PAGE_SIZE;
      }
      function writeStoredPageSize(size) {
        try { window.localStorage.setItem(PAGE_SIZE_KEY, String(size)); } catch (e) {}
      }

      // ---- Visible columns storage ----
      // Версия схемы хранения visible-набора: при увеличении значения старые
      // настройки пользователя «всё включено» (когда таблица из 14–15 колонок не
      // помещалась в карточку) однократно сбрасываются к компактному дефолту.
      var COLS_VISIBLE_VERSION = 2;
      var COLS_VISIBLE_VERSION_KEY = COLS_VISIBLE_KEY + ".v";
      function readStoredVisible() {
        try {
          var ver = parseInt(window.localStorage.getItem(COLS_VISIBLE_VERSION_KEY) || "0", 10);
          var raw = window.localStorage.getItem(COLS_VISIBLE_KEY);
          if (ver < COLS_VISIBLE_VERSION) {
            // Одноразовая миграция: сносим устаревшие настройки видимости,
            // пишем актуальную версию — applyApiPayload выставит компактный дефолт.
            try { window.localStorage.removeItem(COLS_VISIBLE_KEY); } catch (e1) {}
            try { window.localStorage.setItem(COLS_VISIBLE_VERSION_KEY, String(COLS_VISIBLE_VERSION)); } catch (e2) {}
            return {};
          }
          if (!raw) return {};
          var o = JSON.parse(raw);
          if (o && typeof o === "object" && !Array.isArray(o)) return o;
        } catch (e) {}
        return {};
      }
      function writeStoredVisible(map) {
        try { window.localStorage.setItem(COLS_VISIBLE_KEY, JSON.stringify(map || {})); } catch (e) {}
      }
      function isColVisible(key) {
        return state.visible[key] !== false;
      }

      // ---- Column widths storage ----
      function readStoredWidths() {
        try {
          var raw = window.localStorage.getItem(COLS_WIDTH_KEY);
          if (!raw) return {};
          var o = JSON.parse(raw);
          if (o && typeof o === "object" && !Array.isArray(o)) return o;
        } catch (e) {}
        return {};
      }
      function writeStoredWidths(map) {
        try { window.localStorage.setItem(COLS_WIDTH_KEY, JSON.stringify(map || {})); } catch (e) {}
      }
      function defaultWidthFor(key) {
        var w = COL_WIDTH_DEFAULTS_BY_KEY[key];
        return Number.isFinite(w) ? w : DEFAULT_COL_WIDTH;
      }
      function colWidthOf(key) {
        var w = state.colWidths[key];
        if (Number.isFinite(w) && w >= COL_MIN_WIDTH && w <= COL_MAX_WIDTH) return w;
        return defaultWidthFor(key);
      }
      function setColWidth(key, value) {
        var n = parseInt(value, 10);
        if (!Number.isFinite(n)) return;
        n = Math.max(COL_MIN_WIDTH, Math.min(COL_MAX_WIDTH, n));
        state.colWidths[key] = n;
        writeStoredWidths(state.colWidths);
      }

      // ---- Search (умный поиск по артикулу/наименованию) ----
      function searchableKeys() {
        var keys = state.headers.filter(function (k) { return SEARCH_KEYS.indexOf(k) >= 0; });
        return keys.length ? keys : state.headers.slice();
      }
      function nameOf(row) {
        return String((row && (row.name != null ? row.name : row.title)) || "");
      }
      // Применяет к state.rowsAll последовательно:
      //   1) расширенные фильтры (исключить плакаты, менеджер, контент-менеджер);
      //   2) умный поиск (multi-token, AND, по SEARCH_KEYS).
      // Результат в state.rows. Имя сохранено для совместимости с местами вызова.
      function applySearchFilter() {
        var src = state.rowsAll;
        var f = state.filters || {};

        if (f.exclude_posters) {
          src = src.filter(function (row) {
            return nameOf(row).toLowerCase().indexOf("плакат") < 0;
          });
        }
        if (f.manager) {
          var mv = String(f.manager);
          src = src.filter(function (row) { return String(row.manager || "") === mv; });
        }
        if (f.content_manager) {
          var cmv = String(f.content_manager);
          src = src.filter(function (row) { return String(row.content_manager || "") === cmv; });
        }

        var q = String(state.search || "").trim().toLowerCase();
        if (!q) {
          state.rows = src.slice();
          return;
        }
        var tokens = q.split(/\s+/).filter(Boolean);
        var keys = searchableKeys();
        state.rows = src.filter(function (row) {
          var hay = "";
          for (var i = 0; i < keys.length; i++) {
            var v = row[keys[i]];
            if (v == null) continue;
            hay += " " + String(v).toLowerCase();
          }
          for (var j = 0; j < tokens.length; j++) {
            if (hay.indexOf(tokens[j]) < 0) return false;
          }
          return true;
        });
      }

      // ---- Filters storage ----
      function readBool(key, dflt) {
        try {
          var raw = window.localStorage.getItem(key);
          if (raw == null) return !!dflt;
          return raw === "1" || raw === "true";
        } catch (e) { return !!dflt; }
      }
      function writeBool(key, v) {
        try { window.localStorage.setItem(key, v ? "1" : "0"); } catch (e) {}
      }
      function readStr(key) {
        try { return window.localStorage.getItem(key) || ""; } catch (e) { return ""; }
      }
      function writeStr(key, v) {
        try {
          if (v) window.localStorage.setItem(key, String(v));
          else window.localStorage.removeItem(key);
        } catch (e) {}
      }
      function uniqueValuesFor(key) {
        var seen = Object.create(null);
        var out = [];
        for (var i = 0; i < state.rowsAll.length; i++) {
          var v = state.rowsAll[i][key];
          if (v == null) continue;
          var s = String(v).trim();
          if (!s) continue;
          if (seen[s]) continue;
          seen[s] = true;
          out.push(s);
        }
        out.sort(function (a, b) {
          if (NAT_COLLATOR) return NAT_COLLATOR.compare(a, b);
          return a < b ? -1 : a > b ? 1 : 0;
        });
        return out;
      }

      // ---- Sorting ----
      function pickDefaultSortKey() {
        for (var i = 0; i < DEFAULT_SORT_KEY_PRIORITY.length; i++) {
          var k = DEFAULT_SORT_KEY_PRIORITY[i];
          if (state.headers.indexOf(k) >= 0) return k;
        }
        return state.headers.length ? state.headers[0] : null;
      }
      function asNumberOrNaN(v) {
        if (v == null) return NaN;
        if (typeof v === "number") return v;
        var s = String(v).trim();
        if (!s) return NaN;
        // Достаём первое число с поддержкой пробелов в разрядах и запятой как разделителя.
        // Пример: "1 230 ₽" → 1230, "12,5%" → 12.5, "Без НДС" → NaN.
        var m = s.replace(/\u00A0/g, " ").match(/-?\d[\d \t]*(?:[.,]\d+)?/);
        if (!m) return NaN;
        var raw = m[0].replace(/[ \t]/g, "").replace(",", ".");
        var n = parseFloat(raw);
        return Number.isFinite(n) ? n : NaN;
      }
      // Естественная сортировка строк: "art-2" < "art-10" (ru-RU + numeric option).
      var NAT_COLLATOR = (function () {
        try { return new Intl.Collator("ru-RU", { numeric: true, sensitivity: "base" }); }
        catch (e) { return null; }
      })();
      function compareCells(a, b, isNumericHint) {
        var aNull = a == null || a === "";
        var bNull = b == null || b === "";
        if (aNull && bNull) return 0;
        if (aNull) return 1;  // пустые в конец независимо от направления
        if (bNull) return -1;
        if (isNumericHint) {
          var na = asNumberOrNaN(a), nb = asNumberOrNaN(b);
          var aNaN = !Number.isFinite(na), bNaN = !Number.isFinite(nb);
          if (!aNaN && !bNaN) return na - nb;
          if (!aNaN) return -1;
          if (!bNaN) return 1;
        }
        var sa = String(a), sb = String(b);
        if (NAT_COLLATOR) return NAT_COLLATOR.compare(sa, sb);
        return sa < sb ? -1 : sa > sb ? 1 : 0;
      }
      function applySort() {
        if (!state.sortKey || state.headers.indexOf(state.sortKey) < 0) return;
        var k = state.sortKey;
        var dir = state.sortDir === "desc" ? -1 : 1;
        var hint = !!NUMERIC_COL_HINT[k];
        // Sniff: если 80% непустых значений в фильтрованных строках — числа, считаем колонку числовой.
        if (!hint && state.rows.length) {
          var checked = 0, numeric = 0;
          var lim = Math.min(state.rows.length, 50);
          for (var i = 0; i < lim; i++) {
            var v = state.rows[i][k];
            if (v == null || v === "") continue;
            checked++;
            if (Number.isFinite(asNumberOrNaN(v))) numeric++;
          }
          if (checked >= 5 && numeric / checked >= 0.8) hint = true;
        }
        state.rows.sort(function (r1, r2) {
          var c = compareCells(r1[k], r2[k], hint);
          return c * dir;
        });
      }
      function setSort(key) {
        if (!key || state.headers.indexOf(key) < 0) return;
        if (state.sortKey === key) {
          state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        } else {
          state.sortKey = key;
          state.sortDir = "asc";
        }
        applySort();
        state.page = 1;
        renderAll();
      }

      // ---- Pagination ----
      function totalPages() {
        var size = Math.max(1, Number(state.pageSize) || DEFAULT_PAGE_SIZE);
        return Math.max(1, Math.ceil((state.rows.length || 0) / size));
      }
      function clampPage() {
        var pages = totalPages();
        if (state.page < 1) state.page = 1;
        if (state.page > pages) state.page = pages;
      }
      function renderPaginationControls(pageRowsCount) {
        var hint = document.getElementById("dg-mp-page-hint");
        var prev = document.getElementById("dg-mp-page-prev");
        var next = document.getElementById("dg-mp-page-next");
        var pages = totalPages();
        if (hint) {
          var hasFilter = !!String(state.search || "").trim();
          var base =
            "Найдено: " + fmtNum(state.rows.length) +
            "; страница " + state.page + "/" + pages +
            "; показано: " + fmtNum(pageRowsCount);
          if (hasFilter) base += " (фильтр из " + fmtNum(state.rowsAll.length) + ")";
          hint.textContent = base;
        }
        if (prev) prev.disabled = state.page <= 1;
        if (next) next.disabled = state.page >= pages;
      }

      // ---- Table render ----
      function visibleHeaderKeys() {
        return state.headers.filter(isColVisible);
      }

      function renderColgroup(table) {
        var keys = visibleHeaderKeys();
        var existing = table.querySelector(":scope > colgroup");
        if (existing) existing.parentNode.removeChild(existing);
        var cg = document.createElement("colgroup");
        keys.forEach(function (k) {
          var col = document.createElement("col");
          col.style.width = colWidthOf(k) + "px";
          col.setAttribute("data-col-key", k);
          cg.appendChild(col);
        });
        var firstChild = table.firstElementChild;
        table.insertBefore(cg, firstChild);
      }

      function renderTableHead() {
        var table = document.getElementById("dg-mp-table-main");
        if (!table) return;
        var thead = table.querySelector("thead");
        if (!thead) return;
        if (!state.headers.length) {
          thead.innerHTML = '<tr><th class="text-muted">Нет колонок</th></tr>';
          return;
        }
        var keys = visibleHeaderKeys();
        var labelByKey = {};
        state.headers.forEach(function (k, i) {
          labelByKey[k] = (state.headerLabels && state.headerLabels[i]) || k;
        });
        thead.innerHTML =
          "<tr>" +
          keys
            .map(function (k) {
              var arrow = "";
              if (state.sortKey === k) arrow = state.sortDir === "desc" ? " ▼" : " ▲";
              return (
                '<th scope="col" data-col-key="' + escCell(k) + '" class="dg-mp-sortable" ' +
                'role="button" tabindex="0" aria-sort="' +
                (state.sortKey === k ? (state.sortDir === "desc" ? "descending" : "ascending") : "none") +
                '" title="Сортировать по «' + escCell(labelByKey[k]) + '»">' +
                escCell(labelByKey[k]) +
                '<span class="dg-mp-sort-arrow">' + arrow + "</span>" +
                "</th>"
              );
            })
            .join("") +
          "</tr>";
        // Делегируем клик по th: переключаем сортировку.
        var ths = thead.querySelectorAll("th[data-col-key]");
        ths.forEach(function (th) {
          th.addEventListener("click", function (e) {
            var sel = (window.getSelection && window.getSelection().toString() || "").trim();
            if (sel.length) return;
            var k = th.getAttribute("data-col-key");
            if (k) setSort(k);
          });
          th.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              var k = th.getAttribute("data-col-key");
              if (k) setSort(k);
            }
          });
        });
        renderColgroup(table);
      }

      function renderTableBody() {
        var table = document.getElementById("dg-mp-table-main");
        if (!table) return 0;
        var tbody = table.querySelector("tbody");
        if (!tbody) return 0;
        if (!state.headers.length) {
          tbody.innerHTML = '<tr><td class="text-muted">Пустой ответ API.</td></tr>';
          return 0;
        }
        var keys = visibleHeaderKeys();
        if (!state.rows.length || !keys.length) {
          tbody.innerHTML = '<tr><td class="text-muted" colspan="' + Math.max(1, keys.length) + '">Нет строк в выборке.</td></tr>';
          return 0;
        }
        clampPage();
        var size = Math.max(1, Number(state.pageSize) || DEFAULT_PAGE_SIZE);
        var start = (state.page - 1) * size;
        var slice = state.rows.slice(start, start + size);
        tbody.innerHTML = slice
          .map(function (row) {
            return (
              "<tr>" +
              keys
                .map(function (k) {
                  return '<td data-col-key="' + escCell(k) + '">' + renderCellValue(k, row[k]) + "</td>";
                })
                .join("") +
              "</tr>"
            );
          })
          .join("");
        return slice.length;
      }

      function renderAll() {
        renderTableHead();
        var shown = renderTableBody();
        renderPaginationControls(shown);
      }

      function applyApiPayload(payload) {
        state.headers = (payload && payload.headers) || [];
        state.headerLabels = (payload && payload.headerLabels) || [];
        state.rowsAll = (payload && payload.rows) || [];
        renderSummaryLog((payload && payload.summary) || null);
        // На первой загрузке инициализируем visibility и widths, пропущенные в storage.
        // Колонки из DEFAULT_HIDDEN_COLS изначально скрыты, чтобы таблица не «выкатывалась»
        // за карточку (см. правило datagon-table-behavior-lock: sticky-th требует, чтобы
        // обёртка была без overflow-кадра, поэтому управляем шириной через подбор колонок).
        state.headers.forEach(function (k) {
          if (!Object.prototype.hasOwnProperty.call(state.visible, k)) {
            state.visible[k] = !DEFAULT_HIDDEN_COLS[k];
          }
          if (!Object.prototype.hasOwnProperty.call(state.colWidths, k)) state.colWidths[k] = defaultWidthFor(k);
        });
        // Дефолт: сортировка по «артикулу» по возрастанию. Если пользователь
        // уже выбрал свою колонку — сохраняем выбор; иначе берём первый из
        // приоритета (vendor_code → offer_id → shop_sku ...).
        if (!state.sortKey || state.headers.indexOf(state.sortKey) < 0) {
          state.sortKey = pickDefaultSortKey();
          state.sortDir = "asc";
        }
        applySearchFilter();
        applySort();
        state.page = 1;
        rebuildToolbox();
        renderAll();
      }

      function rebuildToolbox() {

                  return h !== k && state.visible[h] !== false;
                });
                if (!anyOther) { cb.checked = true; return; }

              state.visible[k] = cb.checked;

        // ---- Расширенные фильтры: пересобрать опции под актуальные данные ----

            var opt = document.createElement("option");

            opt.textContent = v;
            if (v === currentValue) preserved = v;
            sel.appendChild(opt);

        var hasContentMgr = state.headers.indexOf("content_manager") >= 0;

        var cbExcl = document.getElementById("dg-mp-flt-exclude-posters");

      // ---- Floating header ----
      // Реализован через CSS `position: sticky; top: var(--dg-table-sticky-top)`
      // на каждом <th> (см. exports-marketplaces.head.html). Это эталон от moysklad.scripts.html
      // строка ~1060: native sticky точнее JS translate3d и не «съезжает» при позднем layout.
      // CSS-переменная --dg-table-sticky-top — высота app-header. На странице маркетплейсов
      // глобальный datagon-vanilla.js#initGlobalTableBaseline её не выставляет (наша таблица
      // в shouldSkipGlobalTableBaseline), поэтому считаем сами и слушаем resize.
      function syncStickyTopVar() {
        var app = document.querySelector(".app-container");
        var header = document.querySelector(".app-header");
        var fixed = Boolean(app && app.classList && app.classList.contains("fixed-header"));
        var top = 0;
        if (fixed && header && header.getBoundingClientRect) {
          var r = header.getBoundingClientRect();
          top = r && r.height ? Math.round(r.height) : 60;
        }
        document.documentElement.style.setProperty("--dg-table-sticky-top", top + "px");
      }
      function bindStickyTopVar() {
        syncStickyTopVar();
        window.addEventListener("resize", syncStickyTopVar);
        // app-header может перерисовываться позже (тема ArchitectUI инициализируется
        // после load); реагируем на изменения DOM в нём.
        var hdr = document.querySelector(".app-header");
        if (hdr && window.ResizeObserver) {
          try {
            var ro = new ResizeObserver(function () { syncStickyTopVar(); });
            ro.observe(hdr);
          } catch (e) {}
        }
        if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
          document.fonts.ready.then(function () { syncStickyTopVar(); });
        }
        window.addEventListener("load", function () { syncStickyTopVar(); });
      }

      var refreshWaitTimerId = null;
      /** Wall-clock начала «Обновить из маркетплейса» — для строки статуса при NDJSON. */
      var refreshWallClockT0 = null;

      function stopRefreshWaitTicker() {
        if (refreshWaitTimerId) {
          clearInterval(refreshWaitTimerId);
          refreshWaitTimerId = null;
        }
      }

      function fmtElapsedSince(t0) {
        var sec = Math.floor((Date.now() - t0) / 1000);
        var m = Math.floor(sec / 60);
        var r = sec % 60;
        if (m <= 0) return r + " сек";
        return m + " мин " + r + " сек";
      }

      function refreshLongRunningHint() {
        if (shop === "wildberries") {
          return "Wildberries: сервер последовательно запрашивает карточки, цены и остатки по складам; при большом каталоге это часто 3–15 минут. Страницу можно не закрывать.";
        }
        if (shop === "yandex") {
          return "Яндекс Маркет: несколько раундов запросов к Partner API; при большом каталоге ответ может идти долго.";
        }
        return "Ozon: список товаров и детали по батчам; при большом каталоге ответ может идти несколько минут.";
      }

      function tickRefreshWaitUi(t0) {
        // Как только пришёл первый кадр NDJSON, лог ведёт только renderSummaryLog.
        // Раньше тикер раз в 1 с затирал #dg-mp-log заглушкой — из‑за этого «моргало»
        // между реальным логом и текстом «Ожидание ответа сервера».
        var streaming =
          liveSummary && Array.isArray(liveSummary.steps) && liveSummary.steps.length > 0;
        if (streaming) return;

        var elapsed = fmtElapsedSince(t0);
        var hint = refreshLongRunningHint();
        setMsg("Обновляем из маркетплейса… прошло " + elapsed + ". " + hint, "warning");
        var box = document.getElementById("dg-mp-log");
        if (box) {
          box.classList.remove("d-none");
          box.innerHTML =
            '<div class="dg-mp-log-head">Подключение к серверу</div>' +
            '<div class="dg-mp-log-body">' +
            '<div class="mb-1">' +
            escCell(
              "Устанавливается поток NDJSON — шаги появятся ниже по мере выполнения на сервере. Уже прошло: " +
                elapsed +
                "."
            ) +
            "</div>" +
            '<div class="small text-muted">' +
            escCell(hint) +
            "</div>" +
            "</div>";
        }
      }

      function startRefreshWaitTicker() {
        stopRefreshWaitTicker();
        var t0 = Date.now();
        tickRefreshWaitUi(t0);
        refreshWaitTimerId = setInterval(function () {
          tickRefreshWaitUi(t0);
        }, 1000);
      }

      // Накапливаем частичный summary в режиме NDJSON, чтобы блок «Лог обновления»
      // обновлялся в реальном времени по мере прихода шагов.
      var liveSummary = null;
      function appendLiveStep(step) {
        if (!liveSummary) liveSummary = { kind: shop, durationMs: 0, steps: [] };
        var wasEmpty = liveSummary.steps.length === 0;
        liveSummary.steps.push(step);
        liveSummary.durationMs = Math.max(liveSummary.durationMs, Number(step.tMs) || 0);
        renderSummaryLog(liveSummary);
        // Первый шаг: выключаем секундный тикер — он больше не нужен и только
        // конфликтовал бы с setMsg ниже.
        if (wasEmpty) stopRefreshWaitTicker();
        var last = liveSummary.steps[liveSummary.steps.length - 1];
        if (last) {
          var wall =
            refreshWallClockT0 != null ? "прошло " + fmtElapsedSince(refreshWallClockT0) + "; " : "";
          setMsg(
            "Обновляем " +
              shop +
              "… " +
              wall +
              fmtMs(liveSummary.durationMs) +
              " с начала запроса · " +
              last.msg,
            "warning"
          );
        }
      }

      function processStreamLine(line, ctx) {
        if (!line) return;
        var evt;
        try {
          evt = JSON.parse(line);
        } catch (e) {
          return;
        }
        if (evt && evt.type === "step" && evt.step) {
          appendLiveStep(evt.step);
        } else if (evt && evt.type === "result" && evt.payload) {
          stopRefreshWaitTicker();
          ctx.payload = evt.payload;
        } else if (evt && evt.type === "error") {
          stopRefreshWaitTicker();
          ctx.error = evt.payload || { error: "Ошибка" };
          if (evt.payload && evt.payload.summary) renderSummaryLog(evt.payload.summary);
        }
      }

      function fetchNdjson(url, ctx) {
        return fetch(url, { headers: authHeaders(false), credentials: "same-origin" }).then(function (r) {
          if (!r.ok && !(r.headers.get("content-type") || "").indexOf("ndjson") >= 0) {
            // ошибка ещё до открытия стрима (404/401/...)
            return r.text().then(function (txt) {
              throw new Error("HTTP " + r.status + (txt ? ": " + txt.slice(0, 200) : ""));
            });
          }
          if (!r.body || !r.body.getReader) {
            // фолбэк для очень старых окружений: читаем весь текст
            return r.text().then(function (txt) {
              String(txt || "")
                .split("\n")
                .forEach(function (ln) { processStreamLine(ln.trim(), ctx); });
            });
          }
          var reader = r.body.getReader();
          var decoder = new TextDecoder("utf-8");
          var buf = "";
          function pump() {
            return reader.read().then(function (chunk) {
              if (chunk.done) {
                var tail = (buf + decoder.decode()).trim();
                if (tail) processStreamLine(tail, ctx);
                return;
              }
              buf += decoder.decode(chunk.value, { stream: true });
              var idx;
              while ((idx = buf.indexOf("\n")) >= 0) {
                var line = buf.slice(0, idx).trim();
                buf = buf.slice(idx + 1);
                processStreamLine(line, ctx);
              }
              return pump();
            });
          }
          return pump();
        });
      }

      // ---- API ----
      function runRefreshFromMarketplace() {
        var refreshBtn = document.getElementById("dg-mp-refresh-market");
        var snapshotBtn = document.getElementById("dg-mp-load-snapshot");
        if (refreshBtn) refreshBtn.disabled = true;
        if (snapshotBtn) snapshotBtn.disabled = true;
        liveSummary = null;
        refreshWallClockT0 = Date.now();
        startRefreshWaitTicker();
        var q = "format=ndjson";
        if (shop === "ozon") {
          var arch = document.getElementById("dg-mp-ozon-archived");
          if (arch && arch.checked) q += "&include_archived=1";
        }
        var url = API + exportPath + "?" + q;
        var ctx = { payload: null, error: null };
        fetchNdjson(url, ctx)
          .then(function () {
            if (ctx.error) {
              throw new Error(ctx.error.error || "Ошибка");
            }
            var p = ctx.payload;
            if (!p) throw new Error("Сервер не вернул результат");
            var dur = p && p.summary && p.summary.durationMs;
            setMsg(
              "Обновлено из маркетплейса. Строк: " +
                (p.count != null ? p.count : "?") +
                ". Сохранено: " +
                (p.persisted_count != null ? p.persisted_count : "?") +
                ". Время: " +
                (dur != null ? fmtMs(dur) : "—") +
                ". Метка: " +
                (p.updatedAt || "—"),
              "success"
            );
            applyApiPayload(p);
          })
          .catch(function (e) {
            setMsg(String(e.message || e), "danger");
          })
          .finally(function () {
            stopRefreshWaitTicker();
            refreshWallClockT0 = null;
            if (refreshBtn) refreshBtn.disabled = false;
            if (snapshotBtn) snapshotBtn.disabled = false;
          });
      }

      function loadSavedSnapshot() {
        setMsg("Загружаем последний сохранённый снапшот…", "warning");
        var url = API + "/snapshot?shop=" + encodeURIComponent(shop);
        fetch(url, { headers: authHeaders(false), credentials: "same-origin" })
          .then(function (r) {
            return r.json().then(function (j) { return { ok: r.ok, j: j }; });
          })
          .then(function (x) {
            if (!x.ok) throw new Error((x.j && x.j.error) || "Ошибка");
            applyApiPayload(x.j);
            if (x.j.count > 0) {
              setMsg(
                "Показан последний сохранённый снапшот. Строк: " +
                  x.j.count +
                  ". Метка: " +
                  (x.j.updatedAt || "—"),
                "secondary"
              );
            } else {
              var fallback = "Сохранённых строк пока нет. Нажмите «Обновить из маркетплейса».";
              setMsg(x.j && x.j.note ? x.j.note : fallback, "secondary");
            }
          })
          .catch(function (e) {
            setMsg(String(e.message || e), "danger");
          });
      }

      function bindControls() {
      var refreshBtn = document.getElementById("dg-mp-refresh-market");
      var snapshotBtn = document.getElementById("dg-mp-load-snapshot");
        var limitSel = document.getElementById("dg-mp-page-limit");
        var prevBtn = document.getElementById("dg-mp-page-prev");
        var nextBtn = document.getElementById("dg-mp-page-next");
        var searchInp = document.getElementById("dg-mp-search");
        var searchClearBtn = document.getElementById("dg-mp-search-clear");

        if (refreshBtn) refreshBtn.addEventListener("click", runRefreshFromMarketplace);
        if (snapshotBtn) snapshotBtn.addEventListener("click", loadSavedSnapshot);

        if (limitSel) {
          state.pageSize = readStoredPageSize();
          limitSel.value = String(state.pageSize);
          limitSel.addEventListener("change", function () {
            var v = parseInt(limitSel.value, 10);
            if (ALLOWED_PAGE_SIZES.indexOf(v) < 0) v = DEFAULT_PAGE_SIZE;
            state.pageSize = v;
            state.page = 1;
            writeStoredPageSize(v);
            renderAll();
          });
        }
        if (prevBtn) prevBtn.addEventListener("click", function () {
          if (state.page > 1) { state.page -= 1; renderAll(); }
        });
        if (nextBtn) nextBtn.addEventListener("click", function () {
          if (state.page < totalPages()) { state.page += 1; renderAll(); }
        });

        // Умный поиск: артикул и наименование, мульти-токен (пробел = AND), без регистра.
        if (searchInp) {
          var searchTimer = null;
          var apply = function () {
            state.search = searchInp.value;
            applySearchFilter();
            applySort();
            state.page = 1;
            renderAll();
          };
          searchInp.addEventListener("input", function () {
            if (searchTimer) clearTimeout(searchTimer);
            searchTimer = setTimeout(apply, 150);
          });
          searchInp.addEventListener("search", apply); // системная очистка крестиком в браузере
          searchInp.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              searchInp.value = "";
              apply();
            }
          });
        }
        if (searchClearBtn) {
          searchClearBtn.addEventListener("click", function () {
            if (!searchInp) return;
            searchInp.value = "";
            state.search = "";
            applySearchFilter();
            applySort();
            state.page = 1;
            renderAll();
            searchInp.focus();
          });
        }
      }

      function loadWbTokenBanner() {
        if (shop !== "wildberries") return;
        var el = document.getElementById("dg-mp-token-banner");
        if (!el) return;
        el.className = "alert alert-info mt-3 mb-0 small";
        el.innerHTML =
          "<strong>Wildberries API:</strong> цены (<code>discounts-prices-api</code>) и остатки (<code>marketplace-api</code>) — " +
          "<strong>разные категории</strong> с разными лимитами. Таблица «150 запросов в минуту, 200 мс» из документации относится к " +
          "<strong>Маркетплейсу</strong> (склады/остатки), не к ценам. При частых 429 увеличьте «WB other delay» в " +
          "<a href=\"/settings.html\">Настройках</a>.";
        el.classList.remove("d-none");
      }

      state.pageSize = readStoredPageSize();
      state.visible = readStoredVisible();
      state.colWidths = readStoredWidths();
      state.filters.exclude_posters = readBool(FILTER_EXCLUDE_POSTERS_KEY, false);
      state.filters.manager = readStr(FILTER_MANAGER_KEY);
      state.filters.content_manager = readStr(FILTER_CONTENT_MGR_KEY);
      bindControls();
      bindStickyTopVar();
      loadWbTokenBanner();
      loadSavedSnapshot();

      (function bindTableCardCollapse() {
        var btn = document.getElementById('dg-mp-table-toggle');
        var body = document.getElementById('dg-mp-table-body');
        if (!btn || !body) return;
        var STORAGE_KEY = 'dg.mp-shop.table-card.collapsed.v1';
        function apply() {
          var c = false;
          try { c = localStorage.getItem(STORAGE_KEY) === '1'; } catch (e) {}
          if (c) {
            body.style.display = 'none';
            btn.textContent = 'Развернуть';
          } else {
            body.style.display = '';
            btn.textContent = 'Свернуть';
          }
        }
        apply();
        btn.addEventListener('click', function () {
          var hidden = body.style.display === 'none';
          body.style.display = hidden ? '' : 'none';
          btn.textContent = hidden ? 'Свернуть' : 'Развернуть';
          try { localStorage.setItem(STORAGE_KEY, hidden ? '0' : '1'); } catch (e) {}
          if (typeof syncStickyTopVar === 'function') syncStickyTopVar();
        });
      })();

      // Прокси-кнопки в card-header «Таблица <Shop>»: клик прокидывается на исходные
      // кнопки toolbox внутри card-body. Toolbox создаётся в ensureToolboxContainer
      // лениво, поэтому ищем оригинал в момент клика, а не на init.
      (function bindHeaderToolboxProxies() {
        function proxy(headerId, originalId) {
          var btn = document.getElementById(headerId);
          if (!btn) return;
          btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            var orig = document.getElementById(originalId);
            if (orig) orig.click();
          });
        }
        proxy('dg-mp-toggle-cols-header', 'dg-mp-toggle-cols');
        proxy('dg-mp-toggle-widths-header', 'dg-mp-toggle-widths');
      })();

      // Карточка «Фильтры и действия» (общий fragment exports-marketplaces-shop-filters):
      // collapse, шестерёнка с auto-discovery, primary-поле умного поиска (#dg-mp-shop-smart),
      // двусторонний sync с #dg-mp-search в шапке таблицы (исходный обработчик search оставлен).
      (function bindFiltersCardCollapse() {
        var btn = document.getElementById('dg-mp-shop-filters-toggle');
        var body = document.getElementById('dg-mp-shop-filters-body');
        if (!btn || !body) return;
        var STORAGE_KEY = 'dg.mp-shop.filters-card.collapsed.' + shop;
        function apply() {
          var c = false;
          try { c = localStorage.getItem(STORAGE_KEY) === '1'; } catch (e) {}
          if (c) {
            body.style.display = 'none';
            btn.textContent = 'Развернуть';
          } else {
            body.style.display = '';
            btn.textContent = 'Свернуть';
          }
        }
        apply();
        btn.addEventListener('click', function () {
          var hidden = body.style.display === 'none';
          body.style.display = hidden ? '' : 'none';
          btn.textContent = hidden ? 'Свернуть' : 'Развернуть';
          try { localStorage.setItem(STORAGE_KEY, hidden ? '0' : '1'); } catch (e) {}
          if (typeof syncStickyTopVar === 'function') syncStickyTopVar();
        });
      })();

      (function bindFiltersFieldsVisibility() {
        var FIELD_GROUPS = [
          {
            key: 'shop_filters_main',
            title: 'Поиск',
            items: [
              { key: 'smart', title: 'Умный поиск', hint: 'Артикул и наименование (мульти-токен через пробел = AND)' },
            ],
          },
          {
            key: 'shop_filters_extra',
            title: 'Расширенные фильтры',
            items: [
              { key: 'manager', title: 'Менеджер', hint: 'Точное совпадение менеджера. Пусто — все.' },
              { key: 'content_manager', title: 'Контент-менеджер', hint: 'Точное совпадение контент-менеджера. Пусто — все.' },
              { key: 'exclude_posters', title: 'Исключить плакаты', hint: 'Скрыть строки, где в наименовании встречается слово «плакат».' },
            ],

          {

        if (window.DatagonFilterFieldsVisibility && window.DatagonFilterFieldsVisibility.init) {
          window.DatagonFilterFieldsVisibility.init({
            storageKeyPrefix: 'datagon_mp_shop_filter_fields_v1.' + shop,
            attr: 'data-dg-mp-shop-filter-field',
            fieldGroups: FIELD_GROUPS,

      (function bindShopSmartMirror() {
        // primary в карточке фильтров, mirror — существующий #dg-mp-search в шапке таблицы.
        var primary = document.getElementById('dg-mp-shop-smart');
        var mirror = document.getElementById('dg-mp-search');
        var applyBtn = document.getElementById('dg-mp-shop-apply');
        var resetBtn = document.getElementById('dg-mp-shop-reset');
        if (!primary || !mirror) return;
        var syncing = false;
        function copy(from, to) {
          if (syncing) return;
          if (to.value === from.value) return;
          syncing = true;
          to.value = from.value;
          to.dispatchEvent(new Event('input', { bubbles: true }));
          syncing = false;
        }
        function applySearch() {
          // Триггерим основное поведение поиска, которое привязано к #dg-mp-search в bindControls().
          mirror.dispatchEvent(new Event('input', { bubbles: true }));
        }
        primary.addEventListener('input', function () { copy(primary, mirror); });
        mirror.addEventListener('input', function () { copy(mirror, primary); });
        primary.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            applySearch();
          } else if (e.key === 'Escape') {
            if (!primary.value) return;
            primary.value = '';
            copy(primary, mirror);
            applySearch();
          }
        });
        primary.addEventListener('search', function () {
          copy(primary, mirror);
          applySearch();
        });
        if (applyBtn) {
          applyBtn.addEventListener('click', function (e) {
            e.preventDefault();
            applySearch();
          });
        }
        if (resetBtn) {
          resetBtn.addEventListener('click', function (e) {
            e.preventDefault();
            primary.value = '';
            mirror.value = '';
            // Сбрасываем и расширенные фильтры из карточки «Фильтры и действия»
            // (Менеджер / Контент-менеджер / Исключить плакаты), как и старая
            // ссылка «сбросить» в toolbox раньше — теперь это единая кнопка «По умолчанию».
            var cbExcl2 = document.getElementById('dg-mp-flt-exclude-posters');
            if (cbExcl2 && cbExcl2.checked) {
              cbExcl2.checked = false;
              cbExcl2.dispatchEvent(new Event('change', { bubbles: true }));
            }
            var selMgr3 = document.getElementById('dg-mp-flt-manager');
            if (selMgr3 && selMgr3.value) {
              selMgr3.value = '';
              selMgr3.dispatchEvent(new Event('change', { bubbles: true }));
            }
            var selCm3 = document.getElementById('dg-mp-flt-content_manager');
            if (selCm3 && selCm3.value) {
              selCm3.value = '';
              selCm3.dispatchEvent(new Event('change', { bubbles: true }));
            }
            applySearch();
          });
        }
        copy(mirror, primary);
      })();
    })();
  </script>
