<script>
(function () {
  "use strict";

  var state = {
    settings: null,
    page: 1,
    limit: 100,
    total: 0,
    rows: [],
    pricePct: null,
    enabled: false,
    fx: null,
  };

  var CONTENT_FIELDS = [
    { key: "add_photo", label: "Добавить фото" },
    { key: "add_parent", label: "Добавить на родительский" },
    { key: "add_satellite", label: "Добавить на сателит" },
    { key: "delete_product", label: "Удалить товар" },
  ];
  var COLSPAN = 14;

  function el(id) {
    return document.getElementById(id);
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /** Пробелы тысяч: 9 → «9», 420425 → «420 425», 4435.51 → «4 435,51». */
  function fmtNum(v, maxFrac) {
    if (v == null || v === "") return "—";
    var n = Number(v);
    if (!Number.isFinite(n)) return esc(String(v));
    var fd = maxFrac != null ? Number(maxFrac) : 2;
    if (!Number.isFinite(fd) || fd < 0) fd = 2;
    var neg = n < 0;
    var abs = Math.abs(n);
    var fixed = abs.toFixed(fd);
    var parts = fixed.split(".");
    var intPart = String(parts[0] || "0").replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    var frac = parts[1] || "";
    if (fd > 0) frac = frac.replace(/0+$/, "");
    var out = intPart + (frac ? "," + frac : "");
    return (neg ? "−" : "") + out;
  }

  function normCur(c) {
    var u = String(c || "RUB").trim().toUpperCase();
    if (u === "RUR" || u === "₽") return "RUB";
    if (u === "$") return "USD";
    if (u === "€") return "EUR";
    return u || "RUB";
  }

  /** Цена + валюта. RUB — целые с пробелами; EUR/USD — 2 знака. */
  function fmtMoney(v, currency, opts) {
    var o = opts || {};
    if (v == null || v === "") return "—";
    var n = Number(v);
    if (!Number.isFinite(n)) return esc(String(v));
    var cur = normCur(currency || "RUB");
    var fd = 2;
    if (cur === "RUB") {
      var asInt = Math.round(n);
      if (Math.abs(n - asInt) < 0.005) {
        n = asInt;
        fd = 0;
      }
    }
    var num = fmtNum(n, fd);
    var html =
      '<span style="white-space:nowrap">' +
      esc(num) +
      '&nbsp;<span class="text-muted" style="font-size:0.75em">' +
      esc(cur) +
      "</span></span>";
    if (o.fxNote) {
      html +=
        '<div class="text-muted" style="font-size:0.68rem;line-height:1.2;white-space:nowrap">' +
        esc(o.fxNote) +
        "</div>";
    }
    return html;
  }

  function fmtPct(v) {
    if (v == null || !Number.isFinite(Number(v))) return "—";
    return Number(v).toFixed(2) + "%";
  }

  function buildSiteUrl(raw) {
    var v = String(raw || "").trim();
    if (!v) return "";
    if (/^https?:\/\//i.test(v)) return v;
    if (!/[a-z0-9-]+\.[a-z]{2,}/i.test(v)) return "";
    return "https://" + v;
  }

  function normalizeWebasystProductUrl(rawUrl, domainRaw, cmsType) {
    var direct = buildSiteUrl(rawUrl);
    var isWebasyst = String(cmsType || "").toLowerCase() === "webasyst";
    if (!direct) return "";
    if (!isWebasyst) return direct;
    try {
      var u = new URL(direct);
      var path = String(u.pathname || "/");
      var pathLower = path.toLowerCase();
      if (pathLower.indexOf("/webasyst/") >= 0) return "";
      if (pathLower.startsWith("/product/")) {
        if (!path.endsWith("/")) u.pathname = path + "/";
        return u.toString();
      }
      var slug = path.replace(/^\/+/, "").replace(/\/+$/, "");
      if (!slug || slug.indexOf("/") >= 0) return direct;
      u.pathname = "/product/" + slug + "/";
      return u.toString();
    } catch (e) {
      return direct;
    }
  }

  function buildProductPageUrlFromSlug(domainRaw, skuRaw) {
    var base = buildSiteUrl(domainRaw);
    var sku = String(skuRaw || "").trim();
    if (!base || !sku || /[/?#]/.test(sku)) return "";
    return base.replace(/\/+$/, "") + "/product/" + encodeURIComponent(sku) + "/";
  }

  function buildProductSearchUrl(domainRaw, sku, name) {
    var base = buildSiteUrl(domainRaw);
    if (!base) return "";
    var query = String(sku || "").trim() || String(name || "").trim();
    if (!query) return base;
    return base.replace(/\/$/, "") + "/search/?q=" + encodeURIComponent(query);
  }

  function selectedTargetMeta() {
    var tid = el("dg-np-target-site") && el("dg-np-target-site").value;
    var list = (state.settings && state.settings.targets) || [];
    for (var i = 0; i < list.length; i++) {
      if (Number(list[i].site_id) === Number(tid)) return list[i];
    }
    return null;
  }

  function selectedSourceMeta() {
    return (state.settings && state.settings.source) || null;
  }

  function resolveProductHref(side, row) {
    var meta = side === "target" ? selectedTargetMeta() : selectedSourceMeta();
    var domain = meta && meta.domain;
    var cms = String((meta && meta.cms_type) || "").toLowerCase();
    var url = side === "target" ? row.target_url : row.source_url;
    var sku = side === "target" ? row.target_sku : row.source_sku;
    var name = side === "target" ? row.target_name : row.source_name;
    var fromStored = normalizeWebasystProductUrl(url || "", domain, cms);
    if (fromStored) return fromStored;
    // Webasyst: /product/{sku}/. Bitrix и прочие — только реальный source_url (иначе 404).
    if (cms === "webasyst") {
      return (
        buildProductPageUrlFromSlug(domain, sku || "") ||
        buildProductSearchUrl(domain, sku || "", name || "")
      );
    }
    var direct = buildSiteUrl(url || "");
    if (direct) return direct;
    return "";
  }

  function nameCellHtml(side, row) {
    var name = side === "target" ? row.target_name : row.source_name;
    if (!name) return "—";
    var href = resolveProductHref(side, row);
    if (!href) return esc(name);
    return (
      '<a href="' +
      esc(href) +
      '" target="_blank" rel="noopener noreferrer" title="Открыть на сайте">' +
      esc(name) +
      "</a>"
    );
  }

  function showLog(type, html) {
    var box = el("dg-np-action-log");
    if (!box) return;
    box.classList.remove("d-none", "alert-info", "alert-success", "alert-warning", "alert-danger", "alert-secondary");
    box.classList.add("alert-" + (type || "secondary"));
    box.innerHTML = html;
  }

  var rowLogState = { targetId: null, sourceId: null, label: "", action: "" };

  function formatJournalWhen(raw) {
    if (!raw) return "—";
    var d = new Date(raw);
    if (isNaN(d.getTime())) return String(raw);
    function pad(n) {
      return n < 10 ? "0" + n : String(n);
    }
    return (
      pad(d.getDate()) +
      "." +
      pad(d.getMonth() + 1) +
      "." +
      d.getFullYear() +
      " " +
      pad(d.getHours()) +
      ":" +
      pad(d.getMinutes())
    );
  }

  function actionLabel(action) {
    var a = String(action || "");
    if (a === "link") return "Связь";
    if (a === "unlink") return "Разрыв";
    if (a === "deactivate") return "Деактивация";
    if (a === "activate") return "Включение";
    if (a === "content_task") return "Задачи";
    if (a === "apply" || a === "apply_prices") return "Цены";
    return a || "—";
  }

  function closeRowLog() {
    var overlay = el("dg-npr-row-log-overlay");
    if (!overlay) return;
    overlay.style.display = "none";
    overlay.setAttribute("aria-hidden", "true");
  }

  function openRowLog(opts) {
    var o = opts || {};
    rowLogState.targetId = o.targetId ? Number(o.targetId) : null;
    rowLogState.sourceId = o.sourceId ? Number(o.sourceId) : null;
    rowLogState.label = o.label || "";
    rowLogState.action = o.action ? String(o.action) : "";
    var overlay = el("dg-npr-row-log-overlay");
    var titleEl = el("dg-npr-row-log-title");
    var subEl = el("dg-npr-row-log-subtitle");
    if (titleEl) {
      titleEl.textContent =
        rowLogState.action === "content_task" ? "Журнал: задачи контенту" : "Журнал изменений";
    }
    if (subEl) subEl.textContent = rowLogState.label || "—";
    if (overlay) {
      overlay.style.display = "flex";
      overlay.setAttribute("aria-hidden", "false");
    }
    return loadRowLog();
  }

  function loadRowLog() {
    var body = el("dg-npr-row-log-body");
    if (body) body.innerHTML = '<div class="text-muted small text-center py-4">Загрузка журнала…</div>';
    var targetSite = el("dg-np-target-site") && el("dg-np-target-site").value;
    var q = "/api/network-prices/action-log?limit=100";
    if (targetSite) q += "&target_site_id=" + encodeURIComponent(targetSite);
    if (rowLogState.targetId) q += "&target_product_id=" + encodeURIComponent(rowLogState.targetId);
    else if (rowLogState.sourceId) q += "&source_product_id=" + encodeURIComponent(rowLogState.sourceId);
    if (rowLogState.action) q += "&action=" + encodeURIComponent(rowLogState.action);
    return fetch(q, { credentials: "same-origin" })
      .then(function (r) {
        return r.json().then(function (j) {
          return { r: r, j: j };
        });
      })
      .then(function (x) {
        if (!x.r.ok || !x.j.success) throw new Error((x.j && x.j.error) || "Ошибка журнала");
        var rows = x.j.data || [];
        if (!body) return;
        if (!rows.length) {
          body.innerHTML =
            rowLogState.action === "content_task"
              ? '<div class="text-muted small text-center py-4">По задачам контенту пока нет записей.</div>'
              : '<div class="text-muted small text-center py-4">По этой строке пока нет записей (связь / разрыв / деактивация / задачичи).</div>';
          return;
        }
        body.innerHTML =
          '<table class="table table-sm table-hover mb-0"><thead><tr>' +
          "<th>Когда</th><th>Кто</th><th>Действие</th><th>Сообщение</th>" +
          "</tr></thead><tbody>" +
          rows
            .map(function (r) {
              return (
                "<tr>" +
                "<td class=\"text-nowrap\">" +
                esc(formatJournalWhen(r.created_at)) +
                "</td>" +
                "<td>" +
                esc(r.actor || "—") +
                "</td>" +
                '<td><span class="badge bg-light text-dark border dg-npr-row-log-action">' +
                esc(actionLabel(r.action)) +
                "</span></td>" +
                "<td style=\"white-space:normal\">" +
                esc(r.message || "—") +
                "</td>" +
                "</tr>"
              );
            })
            .join("") +
          "</tbody></table>";
      })
      .catch(function (e) {
        if (body) {
          body.innerHTML =
            '<div class="text-danger small text-center py-4">' + esc(e.message || e) + "</div>";
        }
      });
  }

  function rowLogBtnHtml(r, opts) {
    var o = opts || {};
    var tid = r.target_product_id ? Number(r.target_product_id) : 0;
    var sid = r.source_product_id ? Number(r.source_product_id) : 0;
    if (!tid && !sid) return "";
    var label =
      o.label ||
      (r.target_sku || r.source_sku || "") +
        (r.target_name || r.source_name ? " · " + String(r.target_name || r.source_name).slice(0, 60) : "");
    if (!String(label).trim()) label = tid ? "#" + tid : "#" + sid;
    var actionAttr = o.action ? ' data-action="' + esc(o.action) + '"' : "";
    var title =
      o.action === "content_task" ? "Журнал задач контенту" : "Журнал изменений строки";
    return (
      '<button type="button" class="dg-npr-row-log-btn" data-dg-no-activity="1"' +
      (tid ? ' data-tgt="' + esc(tid) + '"' : "") +
      (sid ? ' data-src="' + esc(sid) + '"' : "") +
      actionAttr +
      ' data-label="' +
      esc(label) +
      '" data-dg-notify-start="Открываем журнал…" title="' +
      esc(title) +
      '">лог</button>'
    );
  }

  function setSaveMsg(ok, html) {
    var box = el("dg-np-settings-save-msg");
    if (!box) return;
    box.classList.remove("d-none", "alert-success", "alert-warning", "alert-danger", "alert-info");
    box.classList.add(ok === true ? "alert-success" : ok === false ? "alert-danger" : "alert-warning");
    box.innerHTML = html;
  }

  function bindCollapse(btnId, bodyId, storageKey, onToggle) {
    var btn = el(btnId);
    var body = el(bodyId);
    if (!btn || !body) return;
    function apply(collapsed) {
      body.style.display = collapsed ? "none" : "";
      btn.textContent = collapsed ? "Развернуть" : "Свернуть";
      try {
        localStorage.setItem(storageKey, collapsed ? "1" : "0");
      } catch (e) {}
      if (typeof onToggle === "function") onToggle(!collapsed);
    }
    var init = false;
    try {
      init = localStorage.getItem(storageKey) === "1";
    } catch (e2) {}
    apply(init);
    btn.addEventListener("click", function () {
      apply(body.style.display !== "none");
    });
  }

  /** Плавающая шапка матрицы — как my-products / moysklad (translate3d на thead). */
  var FLOATING_HEADER_OFFSET_PX = 2;
  var FLOATING_HEADER_START_EPS_PX = 3;
  var npFloatingHeaderRaf = 0;
  var npFloatingLastScrollTs = 0;

  function updateNpStickyTopVar() {
    var app = document.querySelector(".app-container");
    var header = document.querySelector(".app-header");
    var fixed = Boolean(app && app.classList && app.classList.contains("fixed-header"));
    var top = 0;
    if (fixed && header && header.getBoundingClientRect) {
      var rect = header.getBoundingClientRect();
      top = rect && rect.height ? rect.height : 60;
    }
    document.documentElement.style.setProperty("--dg-table-sticky-top", top + "px");
  }

  function getNpStickyTopPx() {
    var app = document.querySelector(".app-container");
    var header = document.querySelector(".app-header");
    var fixed = Boolean(app && app.classList && app.classList.contains("fixed-header"));
    if (!fixed) return 0;
    if (!header || !header.getBoundingClientRect) return 60;
    var rect = header.getBoundingClientRect();
    var h = rect && rect.height ? rect.height : 60;
    return h > 0 ? h : 60;
  }

  function captureNpTheadBaseTop() {
    var thead = document.getElementById("dg-np-thead");
    if (!thead) return;
    thead.style.transform = "";
    thead.style.position = "";
    thead.style.zIndex = "";
    thead.style.willChange = "";
    thead.removeAttribute("data-dg-floating");
    var rect = thead.getBoundingClientRect();
    var absTop = (window.scrollY || window.pageYOffset || 0) + (rect && rect.top ? rect.top : 0);
    thead.setAttribute("data-dg-base-top", String(absTop));
  }

  function updateNpFloatingHeaderFallback() {
    var thead = document.getElementById("dg-np-thead");
    if (!thead) return;
    var table = thead.closest("table");
    if (!table || !table.getBoundingClientRect) return;

    var y = window.scrollY || window.pageYOffset || 0;
    var headerTop = getNpStickyTopPx();

    var baseTopAbs = Number(thead.getAttribute("data-dg-base-top") || 0);
    if (!Number.isFinite(baseTopAbs) || baseTopAbs <= 0) return;
    var tableRect = table.getBoundingClientRect();
    var tableBottom = tableRect.bottom + y;
    /* Двухрядная шапка — высота всего thead, не одной tr */
    var theadRect = thead.getBoundingClientRect();
    var headHeight = theadRect && theadRect.height ? theadRect.height : 0;

    var headerLine = y + headerTop;
    var start = baseTopAbs + FLOATING_HEADER_START_EPS_PX;
    var end = tableBottom - headHeight;
    if (headerLine <= start || headerLine >= end) {
      if (thead.style.transform) {
        thead.style.transform = "";
        thead.style.position = "";
        thead.style.zIndex = "";
        thead.style.willChange = "";
        thead.removeAttribute("data-dg-floating");
      }
      return;
    }

    var zoomAwareOffset = FLOATING_HEADER_OFFSET_PX;
    var dpr = window.devicePixelRatio || 1;
    if (Math.abs(dpr - 1) < 0.03) zoomAwareOffset = FLOATING_HEADER_OFFSET_PX - 3;
    var shift = Math.max(0, headerLine - start - zoomAwareOffset);
    var shiftPx = Number(shift.toFixed(3));
    var nextTransform = "translate3d(0," + shiftPx + "px,0)";
    if (thead.style.transform !== nextTransform) {
      thead.style.transform = nextTransform;
      thead.style.position = "relative";
      thead.style.zIndex = "25";
      thead.style.willChange = "transform";
      thead.setAttribute("data-dg-floating", "1");
    }
  }

  function npFloatingHeaderTick(ts) {
    npFloatingHeaderRaf = 0;
    updateNpFloatingHeaderFallback();
    if (ts - npFloatingLastScrollTs < 140) {
      npFloatingHeaderRaf = requestAnimationFrame(npFloatingHeaderTick);
    }
  }

  function scheduleNpFloatingHeaderUpdate() {
    npFloatingLastScrollTs = performance.now();
    if (npFloatingHeaderRaf) return;
    npFloatingHeaderRaf = requestAnimationFrame(npFloatingHeaderTick);
  }

  function onScrollNpFloatingHeader() {
    scheduleNpFloatingHeaderUpdate();
  }

  function npRefreshFloatingAfterLayout() {
    requestAnimationFrame(function () {
      captureNpTheadBaseTop();
      scheduleNpFloatingHeaderUpdate();
    });
  }

  function bindNpFloatingHeader() {
    updateNpStickyTopVar();
    window.addEventListener("scroll", onScrollNpFloatingHeader, { passive: true });
    window.addEventListener("resize", function () {
      updateNpStickyTopVar();
      npRefreshFloatingAfterLayout();
    });
    var mainOuter = document.querySelector(".app-main__outer");
    if (mainOuter && mainOuter.addEventListener) {
      mainOuter.addEventListener("scroll", onScrollNpFloatingHeader, { passive: true });
    }
    var horiz = document.getElementById("dg-np-table-scroll-outer");
    if (horiz && horiz.addEventListener) {
      horiz.addEventListener("scroll", onScrollNpFloatingHeader, { passive: true });
    }
    npRefreshFloatingAfterLayout();
  }

  function fillSourceSelect(sites, sourceId) {
    var sel = el("dg-np-source-site");
    if (!sel) return;
    sel.innerHTML = "";
    (sites || []).forEach(function (s) {
      var o = document.createElement("option");
      o.value = String(s.id);
      o.textContent = s.name + (s.domain ? " (" + s.domain + ")" : "");
      if (Number(s.id) === Number(sourceId)) o.selected = true;
      sel.appendChild(o);
    });
  }

  function renderTargetsTable(targets) {
    var tb = el("dg-np-targets-tbody");
    if (!tb) return;
    if (!targets || !targets.length) {
      tb.innerHTML = '<tr><td colspan="4" class="text-muted">Нет других сайтов в «Мои сайты».</td></tr>';
      return;
    }
    tb.innerHTML = targets
      .map(function (t) {
        var pct = t.price_pct == null || t.price_pct === "" ? "" : String(t.price_pct);
        return (
          "<tr data-site-id=\"" +
          esc(t.site_id) +
          "\">" +
          "<td>" +
          esc(t.name) +
          "</td>" +
          "<td><input type=\"checkbox\" class=\"form-check-input dg-np-tgt-en\" " +
          (t.enabled ? "checked" : "") +
          " /></td>" +
          "<td><input type=\"text\" class=\"form-control form-control-sm dg-np-tgt-pct\" value=\"" +
          esc(pct) +
          "\" placeholder=\"пусто = не трогать\" /></td>" +
          "<td class=\"small text-muted\">" +
          esc(t.domain || "") +
          "</td>" +
          "</tr>"
        );
      })
      .join("");
  }

  function fillTargetSelect(targets) {
    var sel = el("dg-np-target-site");
    if (!sel) return;
    var prev = sel.value;
    sel.innerHTML = "";
    (targets || []).forEach(function (t) {
      var o = document.createElement("option");
      o.value = String(t.site_id);
      o.textContent = t.name + (t.enabled && t.price_pct != null ? " · " + t.price_pct + "%" : " · % не задан");
      sel.appendChild(o);
    });
    if (prev && [].some.call(sel.options, function (o) { return o.value === prev; })) sel.value = prev;
  }

  function loadSettings() {
    return fetch("/api/network-prices/settings", { credentials: "same-origin" })
      .then(function (r) {
        return r.json().then(function (j) {
          return { r: r, j: j };
        });
      })
      .then(function (x) {
        if (!x.r.ok || !x.j.success) throw new Error((x.j && x.j.error) || "Ошибка настроек");
        state.settings = x.j;
        var allSites = [];
        if (x.j.source) allSites.push(x.j.source);
        (x.j.targets || []).forEach(function (t) {
          allSites.push({ id: t.site_id, name: t.name, domain: t.domain });
        });
        // reload full site list for source select
        return fetch("/api/my-sites", { credentials: "same-origin" })
          .then(function (r) {
            return r.json();
          })
          .then(function (sites) {
            var list = Array.isArray(sites) ? sites : (sites && Array.isArray(sites.data) ? sites.data : (sites && Array.isArray(sites.rows) ? sites.rows : []));
            fillSourceSelect(list, x.j.source_site_id);
            renderTargetsTable(x.j.targets || []);
            fillTargetSelect(x.j.targets || []);
          });
      });
  }

  function collectTargetsPayload() {
    var rows = document.querySelectorAll("#dg-np-targets-tbody tr[data-site-id]");
    var out = [];
    rows.forEach(function (tr) {
      var id = tr.getAttribute("data-site-id");
      var en = tr.querySelector(".dg-np-tgt-en");
      var pct = tr.querySelector(".dg-np-tgt-pct");
      out.push({
        site_id: Number(id),
        enabled: !!(en && en.checked),
        price_pct: pct && String(pct.value).trim() !== "" ? String(pct.value).trim() : null,
      });
    });
    return out;
  }

  function saveSettings() {
    var btn = el("dg-np-settings-save");
    setSaveMsg(null, "Сохраняем…");
    if (btn) btn.disabled = true;
    var payload = {
      source_site_id: el("dg-np-source-site") ? el("dg-np-source-site").value : "",
      targets: collectTargetsPayload(),
    };
    return fetch("/api/network-prices/settings", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then(function (r) {
        return r.json().then(function (j) {
          return { r: r, j: j };
        });
      })
      .then(function (x) {

  function loadMatrix() {
    var targetId = el("dg-np-target-site") && el("dg-np-target-site").value;
    if (!targetId) {
      el("dg-np-tbody").innerHTML =
        '<tr><td colspan="14" class="text-muted text-center py-4">Нет целевого сайта.</td></tr>';
      return Promise.resolve();
    }
    var q = new URLSearchParams({
      target_site_id: targetId,
      link_status: el("dg-np-link-status").value || "all",
      search: el("dg-np-search").value || "",
      limit: String(state.limit),
      offset: String((state.page - 1) * state.limit),
    });
    el("dg-np-tbody").innerHTML =
      '<tr><td colspan="14" class="text-muted text-center py-4">Загрузка…</td></tr>';
    return fetch("/api/network-prices/matrix?" + q.toString(), { credentials: "same-origin" })
      .then(function (r) {
        return r.json().then(function (j) {
          return { r: r, j: j };
        });
      })
      .then(function (x) {
        if (!x.r.ok || !x.j.success) throw new Error((x.j && x.j.error) || "Ошибка матрицы");
        state.rows = x.j.data || [];
        state.total = Number(x.j.total || 0);
        state.pricePct = x.j.price_pct;
        state.enabled = !!x.j.enabled;
        state.fx = x.j.fx || null;
        renderTable();
        var pages = Math.max(1, Math.ceil(state.total / state.limit) || 1);
        el("dg-np-pager-status").textContent =
          "Найдено: " +
          state.total +
          "; страница " +
          state.page +
          "/" +
          pages +
          "; показано: " +
          state.rows.length;
        var hint = el("dg-np-matrix-hint");
        if (!state.enabled) {
          hint.textContent = "Сайт не участвует или % не задан — запись недоступна";
        } else {
          var fx = state.fx || {};
          var eur = fx.eur_to_rub != null ? Number(fx.eur_to_rub).toFixed(2) : "—";
          var usd = fx.usd_to_rub != null ? Number(fx.usd_to_rub).toFixed(2) : "—";
          hint.textContent =
            "Δ % сайта: " +
            (state.pricePct != null ? state.pricePct : "—") +
            " · курс ЦБ: EUR " +
            eur +
            " / USD " +
            usd +
            " ₽ (предл. всегда в RUB)";
        }
      })
      .catch(function (e) {
        el("dg-np-tbody").innerHTML =
          '<tr><td colspan="14" class="text-danger text-center py-4">' + esc(e.message || e) + "</td></tr>";
      });
  }

  function contentSelectedKeys(c) {
    var content = c || {};
    return CONTENT_FIELDS.filter(function (f) {
      return !!(content[f.key] && String(content[f.key]).trim());
    }).map(function (f) {
      return f.key;
    });
  }

  function renderContentCell(r) {
    var c = r.content || {};
    var tid = r.target_product_id;
    if (!tid) {
      return '<td class="dg-np-content-cell text-muted">—</td>';
    }
    var selected = contentSelectedKeys(c);
    var selectedLabels = CONTENT_FIELDS.filter(function (f) {
      return selected.indexOf(f.key) >= 0;
    }).map(function (f) {
      return f.label;
    });
    var summary = selectedLabels.length === 0 ? "Задачи…" : selectedLabels.join(", ");
    var opts =
      '<option value="">' +
      esc(summary) +
      "</option>" +
      CONTENT_FIELDS.map(function (f) {
        var on = selected.indexOf(f.key) >= 0;
        return (
          '<option value="' +
          esc(f.key) +
          '">' +
          (on ? "✓ " : "") +
          esc(f.label) +
          "</option>"
        );
      }).join("");
    var logLabel =
      (r.target_sku || "") +
      (r.target_name ? " · " + String(r.target_name).slice(0, 60) : "") +
      " · контент";
    return (
      '<td class="dg-np-content-cell">' +
      '<select class="form-select form-select-sm dg-np-content-select" data-tgt="' +
      esc(tid) +
      '" data-dg-no-activity="1" title="' +
      esc(
        selectedLabels.length
          ? selectedLabels.join(", ") + " — повторный выбор снимает"
          : "Выберите задачу — повторный выбор снимает"
      ) +
      '">' +
      opts +
      "</select>" +
      rowLogBtnHtml(r, { action: "content_task", label: logLabel }) +
      "</td>"
    );
  }

  function saveContentTask(sel) {
    var targetId = el("dg-np-target-site") && el("dg-np-target-site").value;
    var tgt = sel.getAttribute("data-tgt");
    var picked = String(sel.value || "").trim();
    if (!picked) return Promise.resolve();
    var row = state.rows.find(function (rr) {
      return Number(rr.target_product_id) === Number(tgt);
    });
    var selected = contentSelectedKeys(row && row.content);
    var idx = selected.indexOf(picked);
    if (idx >= 0) selected.splice(idx, 1);
    else selected.push(picked);
    sel.disabled = true;
    return fetch("/api/network-prices/content-task", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        target_site_id: Number(targetId),
        target_product_id: Number(tgt),
        selected: selected,
      }),
    })
      .then(function (r) {
        return r.json().then(function (j) {
          return { r: r, j: j };
        });
      })
      .then(function (x) {
        if (!x.r.ok || !x.j.success) throw new Error((x.j && x.j.error) || "Ошибка сохранения");
        if (row) row.content = x.j.content || row.content;
        var cell = sel.closest("td");
        if (cell && row) cell.outerHTML = renderContentCell(row);
        if (window.DatagonNotify && window.DatagonNotify.toast) {
          window.DatagonNotify.toast({ type: "success", message: "Задачи контенту сохранены" });
        }
      })
      .catch(function (e) {
        sel.value = "";
        if (window.DatagonNotify && window.DatagonNotify.toast) {
          window.DatagonNotify.toast({ type: "danger", message: e.message || String(e) });
        } else {
          alert(e.message || e);
        }
      })
      .then(function () {
        if (sel.isConnected) sel.disabled = false;
      });
  }

          nameCellHtml("source", r) +

          "<td>" +
          fmtNum(r.source_stock) +

          "<td>" +

          "</td>" +
          "<td>" +

            fxNote: r.fx_applied

  function runApply() {
    var targetId = el("dg-np-target-site") && el("dg-np-target-site").value;
    if (!targetId) {
      showLog("warning", "Выберите целевой сайт.");
      return;
    }
    var start = function () {
      showLog(
        "info",
        "<strong>Запись цен</strong><br>Цель: сайт #" +
          esc(targetId) +
          "; поиск: «" +
          esc(el("dg-np-search").value || "") +
          "»…"
      );
      var body = {
        target_site_id: Number(targetId),
        search: el("dg-np-search").value || "",
        dry_run: 0,
        confirm: 1,
      };
      var btn = el("dg-np-apply-prices");
      var run = function () {
        return fetch("/api/network-prices/apply", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok || x.j.success === false) throw new Error((x.j && x.j.error) || "Ошибка apply");
            var j = x.j;
            var lines =
              "<strong>" +
              esc(j.message || "Готово") +
              "</strong><ul class=\"mb-0 mt-2\">" +
              "<li>просмотрено: " +
              (j.scanned || 0) +
              "</li>" +
              "<li>записано ✓: " +
              (j.written || 0) +
              "</li>" +
              "<li>без изменений: " +
              (j.skipped_unchanged || 0) +
              "</li>" +
              "<li>без цены эталона (пусто, не 0): " +
              (j.skipped_no_source_price || 0) +
              "</li>" +
              "<li>ошибок CMS ×: " +
              (j.cms_failed || 0) +
              "</li>" +
              "<li>длительность: " +
              (j.duration_sec != null ? j.duration_sec + " с" : "—") +
              "</li></ul>";
            if (j.errors && j.errors.length) {
              lines +=
                "<div class=\"small mt-2\">Ошибки:<br>" +
                j.errors
                  .slice(0, 20)
                  .map(function (e) {
                    return esc(e.code) + ": " + esc(e.error);
                  })
                  .join("<br>") +
                "</div>";
            }
            showLog(j.cms_failed ? "warning" : "success", lines);
            loadMatrix();
          })
          .catch(function (e) {
            showLog("danger", "<strong>Ошибка.</strong> " + esc(e.message || e));
          });
      };
      if (window.DatagonNotify && window.DatagonNotify.busyRun && btn) {
        window.DatagonNotify.busyRun(btn, run);
      } else {
        run();
      }
    };
    openNprConfirm({
      title: "Записать цены на целевой сайт?",
      message:
        "Цены связанных товаров будут пересчитаны по формуле эталон × (1 + %) и записаны в CMS. Ноль эталона — это «цена по запросу», он записывается на сайты как 0. Сайты без заданного % не меняются. Действие затрагивает боевой каталог.",
      okLabel: "Записать цены",
      okClass: "btn btn-success",
      notifyStart: "Пишем цены…",
    }).then(function (ok) {
      if (ok) start();
    });
  }

  function patchTargetEnabledInMatrix(tgtId, enabled) {
    var tid = Number(tgtId);
    if (!Number.isFinite(tid) || tid < 1) return;
    var on = !!enabled;
    state.rows.forEach(function (r) {
      if (Number(r.target_product_id) !== tid) return;
      r.target_source_enabled = on ? 1 : 0;
      if (!on) {
        // POST /deactivate снимает manual-link на сервере
        r.link_kind = null;
        r.link_at = null;
        r.source_product_id = null;
        r.source_code = null;
        r.source_sku = null;
        r.source_name = null;
        r.source_url = null;
        r.source_price = null;
        r.source_stock = null;
        r.proposed_price = null;
        r.delta_pct_vs_proposed = null;
        r.link_status = "target_only";
      } else if (!r.source_product_id) {
        r.link_status = "target_only";
      }
    });
    renderTable();
  }

    }
    var resolve = nprConfirmState.resolve;
    nprConfirmState.resolve = null;
    if (typeof resolve === "function") resolve(!!ok);
  }

  function openNprConfirm(opts) {
    var o = opts || {};
    return new Promise(function (resolve) {
      if (nprConfirmState.resolve) closeNprConfirm(false);
      nprConfirmState.resolve = resolve;
      var title = el("dg-npr-confirm-title");
      var text = el("dg-npr-confirm-text");
      var okBtn = el("dg-npr-confirm-ok");
      if (title) title.textContent = o.title || "Подтвердите действие";
      if (text) text.textContent = o.message || "Продолжить?";
      if (okBtn) {
        okBtn.textContent = o.okLabel || "Подтвердить";
        okBtn.className = o.okClass || "btn btn-danger";
        okBtn.setAttribute("data-dg-notify-start", o.notifyStart || "Выполняем…");
      }
      var overlay = el("dg-npr-confirm-overlay");
      if (!overlay) {
        resolve(false);
        if (window.DatagonNotify && window.DatagonNotify.toast) {
          window.DatagonNotify.toast({
            type: "danger",
            message: "Нет модалки подтверждения — обновите страницу (Cmd+Shift+R)",
          });
        }
        return;
      }
      overlay.style.display = "flex";
      overlay.setAttribute("aria-hidden", "false");
      if (okBtn) {
        try {
          okBtn.focus();
        } catch (e) {}
      }
    });
  }

  function bindNprConfirmUi() {
    var cancel = el("dg-npr-confirm-cancel");
    var ok = el("dg-npr-confirm-ok");
    var backdrop = el("dg-npr-confirm-backdrop");
    if (cancel) cancel.addEventListener("click", function () { closeNprConfirm(false); });
    if (ok) ok.addEventListener("click", function () { closeNprConfirm(true); });
    if (backdrop) backdrop.addEventListener("click", function () { closeNprConfirm(false); });
    document.addEventListener("keydown", function (e) {
      var overlay = el("dg-npr-confirm-overlay");
      if (!overlay || overlay.style.display === "none") return;
      if (e.key === "Escape") {
        e.preventDefault();
        closeNprConfirm(false);
      }
    });
  }

  function postLink(body) {
    return fetch("/api/network-prices/link", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
      .then(function (r) {
        return r.json().then(function (j) {
          return { r: r, j: j };
        });
      })
      .then(function (x) {
        if (!x.r.ok || !x.j.success) throw new Error((x.j && x.j.error) || "Ошибка связи");
        showLog(
          "success",
          "<strong>Связь сохранена</strong><br>Эталон #" +
            esc(x.j.source_product_id) +
            " ↔ цель #" +
            esc(x.j.target_product_id) +
            " — записано в журнал."
        );
        if (window.DatagonNotify && window.DatagonNotify.toast) {
          window.DatagonNotify.toast({ type: "success", message: "Связь сохранена" });
        }
        return loadMatrix();
      });
  }

  var linkModalState = {
    mode: null, // to_source | to_target
    source_product_id: null,
    target_product_id: null,
    resolved_id: null,
    findTimer: null,
    findSeq: 0,
  };

  function getLinkModal() {
    return el("dg-npr-link-overlay");
  }

  function showLinkModalErr(msg) {
    var box = el("dg-np-link-modal-err");
    if (!box) return;
    if (!msg) {
      box.classList.add("d-none");
      box.textContent = "";
      return;
    }
    box.classList.remove("d-none");
    box.textContent = String(msg);
  }

  function setLinkPreview(html, kind) {
    var box = el("dg-np-link-preview");
    if (!box) return;
    if (!html) {
      box.className = "small mt-2 mb-0 d-none";
      box.innerHTML = "";
      return;
    }
    var cls = "small mt-2 mb-0 alert mb-0 py-2 px-2 ";
    if (kind === "ok") cls += "alert-success";
    else if (kind === "warn") cls += "alert-warning";
    else if (kind === "err") cls += "alert-danger";
    else cls += "alert-secondary";
    box.className = cls;
    box.innerHTML = html;
  }

  function formatProductPreview(p) {
    if (!p) return "";
    return (
      "<strong>Найден:</strong> #" +
      esc(p.id) +
      " · " +
      esc(p.sku || "—") +
      (p.source_id ? " · код " + esc(p.source_id) : "") +
      "<br><span class=\"text-muted\">" +
      esc(String(p.name || "").slice(0, 120)) +
      "</span>" +
      (p.price != null && p.price !== ""
        ? " · <strong>" + esc(p.price) + " ₽</strong>"
        : "")
    );
  }

  function runLinkFind() {
    var input = el("dg-np-link-query");
    var q = input ? String(input.value || "").trim() : "";
    linkModalState.resolved_id = null;
    if (!q) {
      setLinkPreview("");
      showLinkModalErr("");
      return Promise.resolve();
    }
    var targetId = el("dg-np-target-site") && el("dg-np-target-site").value;
    var side = linkModalState.mode === "to_source" ? "source" : "target";
    var url =
      "/api/network-prices/resolve-product?side=" +
      encodeURIComponent(side) +
      "&q=" +
      encodeURIComponent(q);
    if (side === "target") url += "&target_site_id=" + encodeURIComponent(targetId || "");
    var seq = ++linkModalState.findSeq;
    setLinkPreview("Ищем…", "info");
    showLinkModalErr("");
    return fetch(url, { credentials: "same-origin" })
      .then(function (r) {
        return r.json().then(function (j) {
          return { r: r, j: j };
        });
      })
      .then(function (x) {
        if (seq !== linkModalState.findSeq) return;
        if (x.r.ok && x.j.success && x.j.product) {
          linkModalState.resolved_id = x.j.product.id;
          setLinkPreview(formatProductPreview(x.j.product), "ok");
          return;
        }
        linkModalState.resolved_id = null;
        var cands = (x.j && x.j.candidates) || [];
        if (cands.length) {
          var list = cands
            .slice(0, 8)
            .map(function (p) {
              return (
                '<button type="button" class="btn btn-link btn-sm p-0 d-block text-start dg-np-link-pick-cand" data-id="' +
                esc(p.id) +
                '" data-sku="' +
                esc(p.sku || "") +
                '">#' +
                esc(p.id) +
                " · " +
                esc(p.sku || "—") +
                " · " +
                esc(String(p.name || "").slice(0, 50)) +
                "</button>"
              );
            })
            .join("");
          setLinkPreview(
            "<strong>Несколько совпадений</strong> — выберите:<br>" + list,
            "warn"
          );
          return;
        }
        setLinkPreview(
          "<strong>Не найден</strong>: " + esc((x.j && x.j.error) || "нет совпадений на сайте"),
          "err"
        );
      })
      .catch(function (e) {
        if (seq !== linkModalState.findSeq) return;
        linkModalState.resolved_id = null;
        setLinkPreview("<strong>Ошибка поиска</strong>: " + esc(e.message || e), "err");
      });
  }

  function scheduleLinkFind() {
    if (linkModalState.findTimer) clearTimeout(linkModalState.findTimer);
    linkModalState.findTimer = setTimeout(function () {
      linkModalState.findTimer = null;
      runLinkFind();
    }, 400);
  }

  function openLinkModal(opts) {
    var o = opts || {};
    linkModalState.mode = o.mode;
    linkModalState.source_product_id = o.source_product_id || null;
    linkModalState.target_product_id = o.target_product_id || null;
    linkModalState.resolved_id = null;
    linkModalState.findSeq += 1;
    var title = el("dg-np-link-modal-title");
    var hint = el("dg-np-link-modal-hint");
    var label = el("dg-np-link-query-label");
    var input = el("dg-np-link-query");
    showLinkModalErr("");
    setLinkPreview("");
    if (o.mode === "to_source") {
      if (title) title.textContent = "Связать с эталоном";
      if (hint)
        hint.textContent =
          "Товар цели #" +
          (o.target_product_id || "") +
          (o.target_sku ? " · " + o.target_sku : "") +
          ". Укажите артикул, код или ID на эталоне (Альмамед).";
      if (label) label.textContent = "Артикул / код / ID эталона";
      if (input) input.placeholder = "Например артикул Альмамед";
    } else {
      if (title) title.textContent = "Связать с целевым сайтом";
      if (hint)
        hint.textContent =
          "Эталон #" +
          (o.source_product_id || "") +
          (o.source_sku ? " · " + o.source_sku : "") +
          ". Укажите артикул, код или ID на целевом сайте.";
      if (label) label.textContent = "Артикул / код / ID цели";
      if (input) input.placeholder = "Например артикул на Каве";
    }
    var overlay = getLinkModal();
    if (!overlay) {
      if (window.DatagonNotify && window.DatagonNotify.toast) {
        window.DatagonNotify.toast({
          type: "danger",
          message: "Окно связи не найдено — обновите страницу (Cmd+Shift+R)",
        });
      }
      return;
    }
    overlay.style.display = "flex";
    overlay.setAttribute("aria-hidden", "false");
    if (input) {
      input.value = "";
      setTimeout(function () {
        try {
          input.focus();
        } catch (e) {}
      }, 30);
    }
  }

  function closeLinkModal() {
    var overlay = getLinkModal();
    if (!overlay) return;
    if (linkModalState.findTimer) {
      clearTimeout(linkModalState.findTimer);
      linkModalState.findTimer = null;
    }
    linkModalState.findSeq += 1;
    linkModalState.resolved_id = null;
    overlay.style.display = "none";
    overlay.setAttribute("aria-hidden", "true");
    showLinkModalErr("");
    setLinkPreview("");
  }

  function submitLinkModal() {
    var input = el("dg-np-link-query");
    var q = input ? String(input.value || "").trim() : "";
    if (!q && !linkModalState.resolved_id) {
      showLinkModalErr("Введите артикул, код или ID");
      if (input) input.focus();
      return;
    }
    var targetId = el("dg-np-target-site") && el("dg-np-target-site").value;
    var body;
    if (linkModalState.mode === "to_source") {
      body = {
        target_site_id: Number(targetId),
        target_product_id: Number(linkModalState.target_product_id),
      };
      if (linkModalState.resolved_id) body.source_product_id = Number(linkModalState.resolved_id);
      else body.source_query = q;
    } else {
      body = {
        target_site_id: Number(targetId),
        source_product_id: Number(linkModalState.source_product_id),
      };
      if (linkModalState.resolved_id) body.target_product_id = Number(linkModalState.resolved_id);
      else body.target_query = q;
    }
    var okBtn = el("dg-np-link-modal-ok");
    var run = function () {
      return postLink(body)
        .then(function () {
          closeLinkModal();
        })
        .catch(function (e) {
          showLinkModalErr(e.message || e);
          runLinkFind();
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun && okBtn) {
      window.DatagonNotify.busyRun(okBtn, run);
    } else {
      run();
    }
  }

  function linkToTarget(srcId, srcSku) {
    openLinkModal({
      mode: "to_target",
      source_product_id: srcId,
      source_sku: srcSku || "",
    });
  }

  function linkToSource(tgtId, tgtSku) {
    openLinkModal({
      mode: "to_source",
      target_product_id: tgtId,
      target_sku: tgtSku || "",
    });
  }

  function linkPair(srcId) {
    linkToTarget(srcId, "");
  }

  el("dg-np-settings-save").addEventListener("click", function () {
    if (window.DatagonNotify && window.DatagonNotify.busyRun) {
      window.DatagonNotify.busyRun(el("dg-np-settings-save"), saveSettings);
    } else saveSettings();
  });

  el("dg-np-apply-filters").addEventListener("click", function () {
    state.page = 1;
    state.limit = Number(el("dg-np-limit").value) || 100;
    if (window.DatagonNotify && window.DatagonNotify.busyRun) {
      window.DatagonNotify.busyRun(el("dg-np-apply-filters"), loadMatrix);
    } else loadMatrix();
  });

  el("dg-np-reset-filters").addEventListener("click", function () {
    el("dg-np-search").value = "";
    el("dg-np-link-status").value = "linked";
    el("dg-np-limit").value = "100";
    state.page = 1;
    state.limit = 100;
    loadMatrix();
  });

  el("dg-np-apply-prices").addEventListener("click", function () {
    runApply();
  });

  el("dg-np-prev").addEventListener("click", function () {
    if (state.page <= 1) return;
    state.page -= 1;
    loadMatrix();
  });
  el("dg-np-next").addEventListener("click", function () {
    var pages = Math.max(1, Math.ceil(state.total / state.limit) || 1);
    if (state.page >= pages) return;
    state.page += 1;
    loadMatrix();
  });

  el("dg-np-search").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") {
      ev.preventDefault();
      el("dg-np-apply-filters").click();
    }
  });

  var linkOk = el("dg-np-link-modal-ok");
  if (linkOk) {
    linkOk.addEventListener("click", function () {
      submitLinkModal();
    });
  }
  var linkCancel = el("dg-np-link-modal-cancel");
  if (linkCancel) linkCancel.addEventListener("click", closeLinkModal);
  var linkX = el("dg-np-link-modal-x");
  if (linkX) linkX.addEventListener("click", closeLinkModal);
  var linkBackdrop = el("dg-npr-link-backdrop");
  if (linkBackdrop) linkBackdrop.addEventListener("click", closeLinkModal);
  var linkFind = el("dg-np-link-find");
  if (linkFind) {
    linkFind.addEventListener("click", function () {
      if (window.DatagonNotify && window.DatagonNotify.busyRun) {
        window.DatagonNotify.busyRun(linkFind, runLinkFind);
      } else runLinkFind();
    });
  }
  var linkQuery = el("dg-np-link-query");
  if (linkQuery) {
    linkQuery.addEventListener("input", function () {
      linkModalState.resolved_id = null;
      scheduleLinkFind();
    });
    linkQuery.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") {
        ev.preventDefault();
        if (linkModalState.resolved_id) submitLinkModal();
        else runLinkFind();
      }
      if (ev.key === "Escape") closeLinkModal();
    });
  }
  document.addEventListener("click", function (ev) {
    var cand = ev.target && ev.target.closest && ev.target.closest(".dg-np-link-pick-cand");
    if (!cand) return;
    var input = el("dg-np-link-query");
    var id = cand.getAttribute("data-id");
    var sku = cand.getAttribute("data-sku") || "";
    if (input) input.value = sku || id;
    linkModalState.resolved_id = Number(id) || null;
    setLinkPreview(
      formatProductPreview({
        id: id,
        sku: sku,
        name: String(cand.textContent || "").replace(/^#\d+\s*·\s*/, "").trim(),
        source_id: "",
        price: null,
      }),
      "ok"
    );
  });
  document.addEventListener("keydown", function (e) {
    var overlay = getLinkModal();
    if (!overlay || overlay.style.display === "none") return;
    if (e.key === "Escape") {
      e.preventDefault();
      closeLinkModal();
    }
  });

  document.addEventListener("change", function (ev) {
    var sel = ev.target && ev.target.closest && ev.target.closest("select.dg-np-content-select");
    if (sel) saveContentTask(sel);
  });

  document.addEventListener("click", function (ev) {
    var logBtn = ev.target && ev.target.closest && ev.target.closest(".dg-npr-row-log-btn");
    if (logBtn) {
      ev.preventDefault();
      ev.stopPropagation();
      var tid = parseInt(logBtn.getAttribute("data-tgt") || "", 10);
      var sid = parseInt(logBtn.getAttribute("data-src") || "", 10);
      openRowLog({
        targetId: Number.isFinite(tid) && tid > 0 ? tid : null,
        sourceId: Number.isFinite(sid) && sid > 0 ? sid : null,
        label: logBtn.getAttribute("data-label") || "",
        action: logBtn.getAttribute("data-action") || "",
      });
      return;
    }
    var u = ev.target && ev.target.closest && ev.target.closest(".dg-np-unlink");
    if (u) {
      unlinkPair(u.getAttribute("data-src"), u.getAttribute("data-tgt"));
      return;
    }
    var deact = ev.target && ev.target.closest && ev.target.closest(".dg-np-deactivate");
    if (deact) {
      deactivateTarget(
        deact.getAttribute("data-tgt"),
        deact.getAttribute("data-tgt-sku") || "",
        deact.getAttribute("data-tgt-name") || ""
      );
      return;
    }
    var act = ev.target && ev.target.closest && ev.target.closest(".dg-np-activate");
    if (act) {
      activateTarget(
        act.getAttribute("data-tgt"),
        act.getAttribute("data-tgt-sku") || "",
        act.getAttribute("data-tgt-name") || ""
      );
      return;
    }
    var toTgt = ev.target && ev.target.closest && ev.target.closest(".dg-np-link-to-target");
    if (toTgt) {
      linkToTarget(toTgt.getAttribute("data-src"), toTgt.getAttribute("data-src-sku") || "");
      return;
    }
    var toSrc = ev.target && ev.target.closest && ev.target.closest(".dg-np-link-to-source");
    if (toSrc) {
      linkToSource(toSrc.getAttribute("data-tgt"), toSrc.getAttribute("data-tgt-sku") || "");
      return;
    }
    var l = ev.target && ev.target.closest && ev.target.closest(".dg-np-link-pick");
    if (l) linkPair(l.getAttribute("data-src"));
  });

  var rowLogClose = el("dg-npr-row-log-close");
  if (rowLogClose) rowLogClose.addEventListener("click", closeRowLog);
  var rowLogBackdrop = el("dg-npr-row-log-backdrop");
  if (rowLogBackdrop) rowLogBackdrop.addEventListener("click", closeRowLog);
  var rowLogRefresh = el("dg-npr-row-log-refresh");
  if (rowLogRefresh) {
    rowLogRefresh.addEventListener("click", function () {
      if (window.DatagonNotify && window.DatagonNotify.busyRun) {
        window.DatagonNotify.busyRun(rowLogRefresh, loadRowLog);
      } else loadRowLog();
    });
  }
  document.addEventListener("keydown", function (e) {
    var overlay = el("dg-npr-row-log-overlay");
    if (!overlay || overlay.style.display === "none") return;
    if (e.key === "Escape") {
      e.preventDefault();
      closeRowLog();
    }
  });

  bindCollapse("dg-np-settings-toggle", "dg-np-settings-body", "datagon_np_settings_collapsed_v1", function () {
    npRefreshFloatingAfterLayout();
  });
  bindCollapse("dg-np-filters-toggle", "dg-np-filters-body", "datagon_np_filters_collapsed_v1", function () {
    npRefreshFloatingAfterLayout();
  });
  bindCollapse("dg-np-table-toggle", "dg-np-table-body", "datagon_np_table_collapsed_v1", function (expanded) {
    if (expanded) npRefreshFloatingAfterLayout();
  });
  bindNprConfirmUi();
  bindNpFloatingHeader();

  loadSettings()
    .then(function () {
      return loadMatrix();
    })
    .catch(function (e) {
      showLog("danger", esc(e.message || e));
    });
})();
</script>
