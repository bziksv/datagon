  <script>
    (function () {
      var MP_FILTERS_KEY = "datagon_my_products_filters_collapsed_v1";
      var SORT_STORAGE_VERSION = "v1";
      var initialLimit = 100;

      var offset = 0;
      var apiSearch = "";
      var lastTotal = 0;
      var lastRows = [];
      var lastLoading = false;
      /** Пока идёт load — повторный Apply/Enter не глотаем, а ставим в очередь. */
      var loadQueued = false;

      function setMyProductsListBusy(busy) {
        var applyBtn = document.getElementById("btn-apply");
        var defBtn = document.getElementById("mp-filter-default");
        if (applyBtn) applyBtn.disabled = !!busy;
        if (defBtn) defBtn.disabled = !!busy;
      }

      var myProductsPostBusy = false;
      var myProductsFxBusy = false;
      var myProductsRowActionBusy = false;
      var myProductsBulkPriceBusy = false;
      var mpPriceSyncPollTimer = null;

      function refreshMyProductsHeavyButtons() {
        var busy =
          lastLoading ||
          myProductsPostBusy ||
          myProductsFxBusy ||
          myProductsRowActionBusy ||
          myProductsBulkPriceBusy;
        var fx = document.getElementById("mp-btn-fx");
        var syncAll = document.getElementById("mp-btn-syncall");
        var rebuild = document.getElementById("mp-btn-rebuild");
        var syncSite = document.getElementById("mp-btn-sync-site");
        var syncPriceBulk = document.getElementById("mp-btn-sync-price-bulk");
        var sidEl = document.getElementById("f-site");
        var sid = sidEl ? String(sidEl.value || "") : "";
        if (fx) fx.disabled = !!busy;
        if (syncAll) syncAll.disabled = !!busy;
        if (rebuild) rebuild.disabled = !!busy;
        if (syncSite) syncSite.disabled = !!busy || !sid || sid === "all";
        if (syncPriceBulk) syncPriceBulk.disabled = !!busy;
        var holdBulk = document.getElementById("mp-btn-hold-price-bulk");
        var clearHoldBulk = document.getElementById("mp-btn-clear-hold-bulk");
        if (holdBulk) holdBulk.disabled = !!busy;
        if (clearHoldBulk) clearHoldBulk.disabled = !!busy;
      }

      function setMpPriceSyncStopVisible(visible) {
        var stopBtn = document.getElementById("mp-btn-sync-price-bulk-stop");
        if (!stopBtn) return;
        if (visible) stopBtn.classList.remove("d-none");
        else stopBtn.classList.add("d-none");
      }

      function stopMpPriceSyncPoll() {
        if (mpPriceSyncPollTimer) {
          clearInterval(mpPriceSyncPollTimer);
          mpPriceSyncPollTimer = null;
        }
      }

      function notifyMp(type, message) {
        if (window.DatagonNotify && window.DatagonNotify.toast) {
          window.DatagonNotify.toast({ type: type || "info", message: String(message || "") });
        }
      }

      function showMpActionLog(type, message, asHtml) {
        var box = document.getElementById("mp-action-log");
        if (!box) return;
        var t = type || "info";
        box.className =
          "alert mt-3 mb-0 alert-" +
          (t === "danger" ? "danger" : t === "success" ? "success" : t === "warning" ? "warning" : "info");
        if (asHtml) box.innerHTML = String(message || "");
        else box.textContent = String(message || "");
        box.classList.remove("d-none");
      }

      function hideMpActionLog() {
        var box = document.getElementById("mp-action-log");
        if (!box) return;
        box.classList.add("d-none");
        box.textContent = "";
        box.innerHTML = "";
      }

      function escHtml(s) {
        if (window.DatagonFmt && window.DatagonFmt.escapeHtml) return window.DatagonFmt.escapeHtml(s);
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function describeMpAppliedFilters() {
        var f = collectApiFilters();
        var parts = [];
        if (f.site_id && f.site_id !== "all") {
          var siteLabel = siteNameById[f.site_id] || ("#" + f.site_id);
          parts.push("сайт: " + escHtml(siteLabel));
        } else parts.push("сайт: все");
        if (f.status !== undefined && f.status !== "" && f.status !== "all") {
          parts.push(String(f.status) === "1" ? "статус: активные" : "статус: неактивные");
        }
        if (f.source_enabled !== undefined && f.source_enabled !== "" && f.source_enabled !== "all") {
          parts.push(String(f.source_enabled) === "1" ? "на сайте: вкл" : "на сайте: выкл");
        }
        if (f.ms_linked === "1") parts.push("МС: связаны");
        else if (f.ms_linked === "0") parts.push("МС: без связи");
        if (f.match_audit && f.match_audit !== "all") parts.push("сопоставление: " + escHtml(f.match_audit));
        if (f.price_hold === "1") parts.push("заморозка: да");
        else if (f.price_hold === "0") parts.push("заморозка: нет (активной)");
        else if (f.price_hold === "expired") parts.push("заморозка: срок истёк");
        else if (f.price_hold === "expiring") parts.push("заморозка: истекает ≤7 дн.");
        if (f.search) parts.push("поиск: «" + escHtml(f.search) + "»");
        if (f.stock_min) parts.push("остаток от " + escHtml(f.stock_min));
        if (f.stock_max) parts.push("остаток до " + escHtml(f.stock_max));
        if (String(f.gap_filter_enabled) === "1") {
          parts.push(
            "Δ: " +
              escHtml(f.gap_competitor || "all") +
              " [" +
              escHtml(f.gap_min_pct || "-100") +
              "…" +
              escHtml(f.gap_max_pct || "-2") +
              "%]" +
              (f.gap_min_pct_2 !== "" &&
              f.gap_min_pct_2 != null &&
              f.gap_max_pct_2 !== "" &&
              f.gap_max_pct_2 != null
                ? " или [" + escHtml(f.gap_min_pct_2) + "…" + escHtml(f.gap_max_pct_2) + "%]"
                : "") +
              (String(f.gap_exclude_zero) === "1" ? ", скрыть 0%" : "")
          );
        }
        parts.push(
          "рандом −" +
            escHtml(f.comp_sync_rand_min || "0.1") +
            "…−" +
            escHtml(f.comp_sync_rand_max || "0.99") +
            "%"
        );
        return parts.join("; ");
      }

      function formatBulkSyncPriceSummary(j, prefix) {
        var st = j && j.status ? j.status : j || {};
        var p = prefix ? prefix + " " : "";
        var totalSql = Number(st.total_sql != null ? st.total_sql : st.total || 0);
        var scanned = Number(st.scanned || 0);
        var chunkPart = st.chunk_size ? "чанк " + st.chunk_size : "";
        var concPart = st.cms_concurrency ? "CMS×" + st.cms_concurrency : "";
        var metaParts =
          st.phase === "selecting" || st.phase === "idle"
            ? ""
            : [chunkPart, concPart].filter(Boolean).join(", ");
        var lines = [
          p + "<strong>Синхронизация цен с конкурента</strong> (фон, чанки; мин. Dealmed/Медкомплекс − случайный %)",
          "Фильтры: " + describeMpAppliedFilters(),
          (st.phase === "selecting"
            ? "Отбор по Δ (как в таблице)…"
            : "К обработке: " + totalSql.toLocaleString("ru-RU") + " товаров") +
            (metaParts ? " (" + metaParts + ")" : ""),
        ];
        if (j && j.dry_run) {
          if (String(j.gap_filter_enabled) === "1" || (j.applied_filters && String(j.applied_filters.gap_enabled) === "1")) {
            lines.push(
              "<em>План:</em> SQL ≈ " +
                totalSql.toLocaleString("ru-RU") +
                "; перед записью в фоне отберём по Δ (как в таблице) — писать будем только подходящие."
            );
          } else {
            lines.push(
              "<em>Пробный просмотр:</em> точное «к записи» без фильтра Δ; «без цены ДМ/МК» — по ходу записи."
            );
          }
          lines.push(
            "<small>Фильтр «подтверждено» ≠ цена Dealmed/Медкомплекс: «без цены ДМ/МК» — нет пригодной цены ДМ/МК (>0), своя цена не меняется.</small>"
          );
          if (j.note) lines.push(escHtml(j.note));
          if (totalSql >= 2000) {
            lines.push(
              "<strong>Оценка:</strong> при ~" +
                totalSql.toLocaleString("ru-RU") +
                " SQL-строках отбор/запись могут занять время. Можно остановить «Стоп синх. цен»."
            );
          }
          return lines.join("<br>");
        }
        if (st.message) lines.push(escHtml(st.message));
        if (scanned > 0 || st.active) {
          lines.push(
            "Просмотрено: " +
              scanned.toLocaleString("ru-RU") +
              "/" +
              totalSql.toLocaleString("ru-RU") +
              "; записано ✓ " +
              Number(st.cms_ok || st.synced || 0).toLocaleString("ru-RU") +
              "; ошибок × " +
              Number(st.cms_failed || 0).toLocaleString("ru-RU") +
              "; без цены ДМ/МК: " +
              Number(
                st.no_dm_mk_price != null
                  ? st.no_dm_mk_price
                  : st.no_competitor || st.skipped_no_competitor || 0
              ).toLocaleString("ru-RU") +
              (Number(st.skipped_hold || 0)
                ? "; заморозка: " + Number(st.skipped_hold || 0).toLocaleString("ru-RU")
                : "") +
              (Number(st.skipped_own_stock || 0)
                ? "; свой остаток МС: " +
                  Number(st.skipped_own_stock || 0).toLocaleString("ru-RU")
                : "") +
              (Number(st.skipped_gap || 0)
                ? "; отсеяно по Δ: " + Number(st.skipped_gap || 0).toLocaleString("ru-RU")
                : "")
          );
        }
        if (st.duration_sec != null) {
          lines.push("Время: " + Number(st.duration_sec || 0).toLocaleString("ru-RU") + " с");
        }
        if (Number(st.cms_failed || 0) > 0 && st.errors && st.errors.length) {
          lines.push("<strong>Примеры ошибок:</strong>");
          st.errors.slice(0, 10).forEach(function (er) {
            lines.push(
              "• " +
                escHtml(er.code || "?") +
                (er.site_id != null ? " (сайт #" + escHtml(er.site_id) + ")" : "") +
                " — " +
                escHtml(er.error || "ошибка")
            );
          });
        }
        return lines.join("<br>");
      }

      function buildBulkSyncPriceBody(extra) {
        var f = collectApiFilters();
        var body = {
          site_id: f.site_id,
          status: f.status,
          source_enabled: f.source_enabled,
          ms_linked: f.ms_linked,
          search: f.search,
          match_audit: f.match_audit,
          price_hold: f.price_hold,
          gap_filter_enabled: f.gap_filter_enabled,
          gap_exclude_zero: f.gap_exclude_zero,
          gap_competitor: f.gap_competitor,
          gap_min_pct: f.gap_min_pct,
          gap_max_pct: f.gap_max_pct,
          gap_min_pct_2: f.gap_min_pct_2,
          gap_max_pct_2: f.gap_max_pct_2,
          usd_to_rub: f.usd_to_rub,
          eur_to_rub: f.eur_to_rub,
          stock_min: f.stock_min,
          stock_max: f.stock_max,
          random_min_pct: Number(String(f.comp_sync_rand_min || "0.1").replace(",", ".")),
          random_max_pct: Number(String(f.comp_sync_rand_max || "0.99").replace(",", ".")),
        };
        if (extra) {
          Object.keys(extra).forEach(function (k) {
            body[k] = extra[k];
          });
        }
        return body;
      }

      function fetchBulkSyncPrice(dryRun) {
        var body = buildBulkSyncPriceBody(dryRun ? { dry_run: 1 } : { confirm: 1 });
        return fetch("/api/my-products/sync-price-from-competitor-bulk", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        }).then(function (r) {
          return r.json().then(function (j) {
            return { ok: r.ok, status: r.status, j: j };
          });
        });
      }

      function fetchBulkSyncPriceStatus() {
        return fetch("/api/my-products/sync-price-from-competitor-bulk-status", {
          credentials: "same-origin",
        }).then(function (r) {
          return r.json().then(function (j) {
            return { ok: r.ok, j: j };
          });
        });
      }

      function stopBulkSyncPriceJob() {
        return fetch("/api/my-products/sync-price-from-competitor-bulk-stop", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        }).then(function (r) {
          return r.json().then(function (j) {
            return { ok: r.ok, j: j };
          });
        });
      }

      function onPriceSyncJobFinished(st) {
        stopMpPriceSyncPoll();
        setMpPriceSyncStopVisible(false);
        var phase = String(st.phase || "");
        var logType =
          phase === "error" ? "danger" : phase === "cancelled" || Number(st.cms_failed || 0) > 0 ? "warning" : "success";
        showMpActionLog(logType, formatBulkSyncPriceSummary({ status: st }, "Итог."), true);
        var shortMsg =
          (st.message || "Готово") +
          " · ✓ " +
          Number(st.cms_ok || 0).toLocaleString("ru-RU") +
          " / × " +
          Number(st.cms_failed || 0).toLocaleString("ru-RU");
        notifyMp(logType === "danger" ? "danger" : logType === "warning" ? "warning" : "success", shortMsg);
        return load();
      }

      function pollPriceSyncJobUntilDone() {
        stopMpPriceSyncPoll();
        setMpPriceSyncStopVisible(true);
        return new Promise(function (resolve, reject) {
          var settled = false;
          var tick = function () {
            return fetchBulkSyncPriceStatus()
              .then(function (x) {
                if (!x.ok || !x.j || !x.j.status) return;
                var st = x.j.status;
                if (st.active) {
                  showMpActionLog("info", formatBulkSyncPriceSummary({ status: st }, "Ход."), true);
                  return;
                }
                if (settled) return;
                settled = true;
                stopMpPriceSyncPoll();
                return onPriceSyncJobFinished(st).then(resolve, reject);
              })
              .catch(function (e) {
                showMpActionLog(
                  "warning",
                  "Не удалось получить статус фоновой задачи: " + (e && e.message ? e.message : e),
                  false
                );
              });
          };
          tick();
          mpPriceSyncPollTimer = setInterval(tick, 2000);
        });
      }

      function runBulkSyncPriceFromCompetitor() {
        if (lastLoading) {
          notifyMp("warning", "Дождитесь окончания загрузки таблицы");
          return Promise.resolve();
        }
        if (myProductsBulkPriceBusy) return Promise.resolve();
        var btn = document.getElementById("mp-btn-sync-price-bulk");
        var doFetch = function () {
          myProductsBulkPriceBusy = true;
          refreshMyProductsHeavyButtons();
          showMpActionLog("info", "Считаем выборку по SQL-фильтрам (без записи в CMS)…", false);
          return fetchBulkSyncPrice(true)
            .then(function (pre) {
              if (!pre.ok || !pre.j || pre.j.success === false) {
                throw new Error((pre.j && pre.j.error) || "Не удалось оценить выборку");
              }
              var pj = pre.j;
              showMpActionLog("info", formatBulkSyncPriceSummary(pj, "План."), true);
              var totalSql = Number(pj.total_sql != null ? pj.total_sql : pj.total || 0);
              if (totalSql <= 0) {
                var okMsg = "Нечего синхронизировать: по фильтрам 0 товаров.";
                showMpActionLog("success", formatBulkSyncPriceSummary(pj, "Итог.") + "<br>" + okMsg, true);
                notifyMp("success", okMsg);
                return null;
              }
              var warn =
                totalSql >= 2000
                  ? "<br><strong>Внимание:</strong> " +
                    totalSql.toLocaleString("ru-RU") +
                    " строк — запуск в фоне чанками. Можно остановить кнопкой «Стоп синх. цен»."
                  : "<br>Запуск фоновой записи в CMS…";
              showMpActionLog("info", formatBulkSyncPriceSummary(pj, "План.") + warn, true);
              return fetchBulkSyncPrice(false).then(function (x) {
                if (x.status === 409) {
                  notifyMp("warning", "Уже выполняется — показываем прогресс");
                  return pollPriceSyncJobUntilDone();
                }
                if (!x.ok || !x.j || x.j.success === false) {
                  throw new Error((x.j && x.j.error) || "Не удалось запустить синхронизацию");
                }
                if (x.j.started === false && Number(x.j.total_sql || 0) === 0) {
                  return x.j;
                }
                return pollPriceSyncJobUntilDone();
              });
            })
            .catch(function (e) {
              stopMpPriceSyncPoll();
              setMpPriceSyncStopVisible(false);
              var err = e && e.message ? e.message : "Ошибка";
              showMpActionLog(
                "danger",
                "<strong>Ошибка массовой синхронизации цен</strong><br>" +
                  err +
                  "<br>Фильтры: " +
                  describeMpAppliedFilters(),
                true
              );
              notifyMp("danger", err);
              throw e;
            })
            .finally(function () {
              myProductsBulkPriceBusy = false;
              refreshMyProductsHeavyButtons();
            });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun && btn) {
          return window.DatagonNotify.busyRun(btn, doFetch);
        }
        return doFetch();
      }

      var lastFx = { usd_to_rub: 90, eur_to_rub: 100 };
      var lastFxUpdatedAt = null;

      var siteById = {};

      ];

      var MP_FIELD_LOG_LABELS = {

      function userSortKey() {
        try {
          var u = String(localStorage.getItem("currentUser") || "guest").trim() || "guest";
          return "datagon_my_products_sort_" + SORT_STORAGE_VERSION + ":" + u;
        } catch (e) {
          return "datagon_my_products_sort_" + SORT_STORAGE_VERSION + ":guest";
        }
      }

      function buildQuery(params) {
        var s = new URLSearchParams();
        Object.keys(params).forEach(function (k) {
          var v = params[k];
          if (v === undefined || v === null || v === "" || v === "all") return;
          s.set(k, String(v));
        });
        var q = s.toString();
        return q ? "?" + q : "";
      }

      function parseSmartSearch(raw) {
        var out = { site: "", status: "", search: "" };
        var tokens = (raw || "").trim().match(/"[^"]+"|\S+/g) || [];
        var free = [];
        tokens.forEach(function (token) {
          var idx = token.indexOf(":");
          if (idx > 0) {
            var key = token.slice(0, idx).toLowerCase();
            var value = token.slice(idx + 1).trim();
            if (
              (value.charAt(0) === '"' && value.slice(-1) === '"') ||
              (value.charAt(0) === "'" && value.slice(-1) === "'")
            )
              value = value.slice(1, -1);
            if (key === "site" || key === "site_id") out.site = value;
            else if (key === "status") out.status = value;
            else if (key === "code" || key === "sku" || key === "name" || key === "id") free.push(value);
            else free.push(token);
          } else {
            free.push(token.replace(/^"(.*)"$/, "$1"));
          }
        });
        out.search = free.join(" ").trim();
        return out;
      }

      function syncUrlFromDom() {
        var params = new URLSearchParams();
        var f = collectApiFilters();
        Object.keys(f).forEach(function (k) {
          var v = f[k];
          if (v === undefined || v === null || v === "" || v === "all") return;
          if (k === "limit" && Number(v) === initialLimit) return;
          if (k === "offset" && Number(v) === 0) return;
          params.set(k, String(v));
        });
        var next = params.toString()
          ? window.location.pathname + "?" + params.toString()
          : window.location.pathname;
        try {
          window.history.replaceState(null, "", next);
        } catch (e) {}
      }

      function updateMpStickyTopVar() {
        var app = document.querySelector(".app-container");
        var header = document.querySelector(".app-header");
        var fixed = Boolean(app && app.classList && app.classList.contains("fixed-header"));
        var top = 0;
        if (fixed && header && header.getBoundingClientRect) {
          var rect = header.getBoundingClientRect();
          top = rect && rect.height ? rect.height : 60;
        }
        document.documentElement.style.setProperty("--dg-table-sticky-top", top + "px");
      }

      function getMpStickyTopPx() {
        var app = document.querySelector(".app-container");
        var header = document.querySelector(".app-header");
        var fixed = Boolean(app && app.classList && app.classList.contains("fixed-header"));
        if (!fixed) return 0;
        if (!header || !header.getBoundingClientRect) return 60;
        var rect = header.getBoundingClientRect();
        var h = rect && rect.height ? rect.height : 60;
        return h > 0 ? h : 60;
      }

      function captureMpTheadBaseTop() {
        var thead = document.getElementById("dg-mp-thead");
        if (!thead) return;
        thead.style.transform = "";
        thead.style.position = "";
        thead.style.zIndex = "";
        thead.style.willChange = "";
        thead.removeAttribute("data-dg-floating");
        var rect = thead.getBoundingClientRect();
        var absTop = (window.scrollY || window.pageYOffset || 0) + (rect && rect.top ? rect.top : 0);
        thead.setAttribute("data-dg-base-top", String(absTop));
      }

      function updateMpFloatingHeaderFallback() {
        var thead = document.getElementById("dg-mp-thead");
        if (!thead) return;
        var table = thead.closest("table");
        if (!table || !table.getBoundingClientRect) return;
        var row = thead.querySelector("tr");
        if (!row) return;

        var y = window.scrollY || window.pageYOffset || 0;
        var headerTop = getMpStickyTopPx();

        var baseTopAbs = Number(thead.getAttribute("data-dg-base-top") || 0);
        if (!Number.isFinite(baseTopAbs) || baseTopAbs <= 0) return;
        var tableRect = table.getBoundingClientRect();
        var tableBottom = tableRect.bottom + y;
        var rowRect = row.getBoundingClientRect();
        var rowHeight = rowRect && rowRect.height ? rowRect.height : 0;

        var headerLine = y + headerTop;
        var start = baseTopAbs + FLOATING_HEADER_START_EPS_PX;
        var end = tableBottom - rowHeight;
        if (headerLine <= start || headerLine >= end) {
          if (thead.style.transform) {
            thead.style.transform = "";
            thead.style.position = "";
            thead.style.zIndex = "";
            thead.style.willChange = "";
            thead.removeAttribute("data-dg-floating");
          }
          return;
        }

        var zoomAwareOffset = FLOATING_HEADER_OFFSET_PX;
        var dpr = window.devicePixelRatio || 1;
        if (Math.abs(dpr - 1) < 0.03) zoomAwareOffset = FLOATING_HEADER_OFFSET_PX - 3;
        var shift = Math.max(0, headerLine - start - zoomAwareOffset);
        var shiftPx = Number(shift.toFixed(3));
        var nextTransform = "translate3d(0," + shiftPx + "px,0)";
        if (thead.style.transform !== nextTransform) {
          thead.style.transform = nextTransform;
          thead.style.position = "relative";
          thead.style.zIndex = "25";
          thead.style.willChange = "transform";
          thead.setAttribute("data-dg-floating", "1");
        }
      }

      function mpFloatingHeaderTick(ts) {
        mpFloatingHeaderRaf = 0;
        updateMpFloatingHeaderFallback();
        if (ts - mpFloatingLastScrollTs < 140) {
          mpFloatingHeaderRaf = requestAnimationFrame(mpFloatingHeaderTick);
        }
      }

      function scheduleMpFloatingHeaderUpdate() {
        mpFloatingLastScrollTs = performance.now();

        mpFloatingHeaderRaf = requestAnimationFrame(mpFloatingHeaderTick);
      }

      function onScrollMpFloatingHeader() {

      function buildSiteUrl(raw) {
        var v = String(raw || "").trim();
        if (!v) return "";
        if (/^https?:\/\//i.test(v)) return v;
        if (!/[a-z0-9-]+\.[a-z]{2,}/i.test(v)) return "";
        return "https://" + v;
      }
      function normalizeSiteProductUrl(rawUrl, site) {
        var direct = buildSiteUrl(rawUrl);
        if (!direct) return "";
        var isWebasyst = String(site && site.cms_type || "").toLowerCase() === "webasyst";
        if (!isWebasyst) return direct;
        try {
          var u = new URL(direct);
          var path = String(u.pathname || "/");
          if (!path.startsWith("/product/")) {
            var slug = path.replace(/^\/+/, "").replace(/\/+$/, "");
            if (slug) u.pathname = "/product/" + slug + "/";
          } else if (!path.endsWith("/")) u.pathname = path + "/";
          return u.toString();
        } catch (e) {
          return direct;
        }
      }
      function safeLink(raw) {
        var v = String(raw || "").trim();

        if (/^https?:\/\//i.test(v)) return v;

        var id = String(sourceId || "").trim();

        var cleanDomain = String(site && site.domain || "")
          .trim()
          .replace(/^https?:\/\//i, "")
          .replace(/\/+$/, "");
        if (!cleanDomain) return "";

      function toRubValue(price, currency, usdRub, eurRub) {
        var n = Number(price);
        if (!Number.isFinite(n)) return null;
        var cur = String(currency || "RUB").trim().toUpperCase();
        if (cur === "RUB" || cur === "RUR" || cur === "₽") return n;
        if (cur === "USD" || cur === "$") return n * Number(usdRub || 90);
        if (cur === "EUR" || cur === "€") return n * Number(eurRub || 100);
        return n;
      }
      function formatDeviationPct(myPrice, myCurrency, compPrice, compCurrency, usdRub, eurRub) {
        var myRub = toRubValue(myPrice, myCurrency, usdRub, eurRub);
        var compRub = toRubValue(compPrice, compCurrency, usdRub, eurRub);
        if (!Number.isFinite(myRub) || !Number.isFinite(compRub) || compRub <= 0) return "н/д";
        var pct = ((myRub - compRub) / compRub) * 100;
        var sign = pct > 0 ? "+" : "";
        return sign + pct.toFixed(2) + "%";
      }
      function formatBasePriceWithRub(price, currency, usdRub, eurRub) {
        var cur = String(currency || "RUB").toUpperCase();
        var base = formatMoney(price);
        var rub = toRubValue(price, cur, usdRub, eurRub);
        if (!Number.isFinite(rub)) return { baseText: base + " " + cur, rubText: "" };
        if (cur === "RUB" || cur === "RUR" || cur === "₽") return { baseText: base + " " + cur, rubText: "" };
        return { baseText: base + " " + cur, rubText: "≈ " + formatMoney(rub) + " RUB" };
      }

      }

      function applyColumnWidthByIndex(index, widthPx) {
        var w = Math.max(80, Math.min(900, Math.round(Number(widthPx) || 0)));
        if (!Number.isFinite(w) || w <= 0) return;
        var headers = getHeaderCells();
        var th = headers[index];
        if (!th) return;
        if (th.style.display === "none") {
          clearColumnIndexSizing(index);
          return;
        }
        columnWidths[index] = w;
        th.style.width = w + "px";
        th.style.minWidth = w + "px";
        th.style.maxWidth = w + "px";
        document.querySelectorAll("#dg-tbody tr").forEach(function (tr) {
          if (!tr.cells || !tr.cells[index]) return;
          tr.cells[index].style.width = w + "px";
          tr.cells[index].style.minWidth = w + "px";
          tr.cells[index].style.maxWidth = w + "px";
        });
      }

      function applyStoredColumnWidths() {
        Object.keys(columnWidths || {}).forEach(function (k) {
          var idx = Number(k);
          if (!Number.isFinite(idx)) return;
          applyColumnWidthByIndex(idx, columnWidths[k]);
        });
      }

      // Панель «📏 Ширины»: список «<лейбл колонки> <input number px>» по индексу колонки
      // (my-products работает с шириной по индексу, а не по ключу — см. applyColumnWidthByIndex).
      // Использует ту же связку (columnWidths + applyColumnWidthByIndex + userColWidthKey),
      // что drag-резайзер на правом крае <th>, поэтому изменения мгновенно видны и сохраняются.
      function renderMpWidthControls() {
        var list = document.getElementById("dg-mp-widths-list");
        if (!list) return;
        list.innerHTML = "";
        var headers = getHeaderCells();
        headers.forEach(function (th, index) {
          if (!th) return;
          if (th.style.display === "none") return; // скрытые колонки в списке не показываем
          var label = (th.textContent || "").replace(/\s+/g, " ").trim() || ("Колонка " + (index + 1));
          var current = Number(columnWidths[index] || 0);
          if (!Number.isFinite(current) || current <= 0) {
            var rect = th.getBoundingClientRect();
            current = rect && rect.width ? Math.round(rect.width) : 120;
          }
          var wrap = document.createElement("label");
          var span = document.createElement("span");
          span.textContent = label;
          span.style.flex = "1 1 auto";
          span.style.overflow = "hidden";
          span.style.textOverflow = "ellipsis";
          span.style.whiteSpace = "nowrap";
          var input = document.createElement("input");
          input.type = "number";
          input.className = "form-control form-control-sm";
          input.min = "80";
          input.max = "900";
          input.step = "10";
          input.value = String(current);
          input.setAttribute("data-col-index", String(index));
          input.addEventListener("change", function () {
            var idx = parseInt(this.getAttribute("data-col-index"), 10);
            var n = parseInt(this.value, 10);
            if (!Number.isFinite(idx)) return;
            if (!Number.isFinite(n)) {
              this.value = String(columnWidths[idx] || 120);
              return;
            }
            n = Math.max(80, Math.min(900, n));
            applyColumnWidthByIndex(idx, n);
            try { localStorage.setItem(userColWidthKey(), JSON.stringify(columnWidths || {})); } catch (e) {}
            this.value = String(n);
            scheduleMpFloatingHeaderUpdate();
          });
          wrap.appendChild(span);
          wrap.appendChild(input);
          list.appendChild(wrap);
        });
      }

      function onResizeMove(e) {
        if (!resizeState) return;
        var delta = e.clientX - resizeState.startX;
        applyColumnWidthByIndex(resizeState.index, resizeState.startWidth + delta);
        scheduleMpFloatingHeaderUpdate();
      }

      function onResizeUp() {
        if (!resizeState) return;
        resizeState = null;
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        try {
          localStorage.setItem(userColWidthKey(), JSON.stringify(columnWidths || {}));
        } catch (e) {}
        mpRefreshFloatingAfterLayout();
      }

      function initColumnResizeHandles() {
        getHeaderCells().forEach(function (th, index) {
          if (th.getAttribute("data-mp-resize-ready") === "1") return;
          th.setAttribute("data-mp-resize-ready", "1");
          th.style.position = "relative";
          var handle = document.createElement("span");
          handle.className = "mp-resize-handle";
          handle.setAttribute("role", "separator");
          handle.setAttribute("aria-orientation", "vertical");
          handle.title = "Потяните, чтобы изменить ширину";
          handle.style.cssText =
            "position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;z-index:4;" +
            "background:linear-gradient(to right,transparent 47%,#d9dee5 47%,#d9dee5 53%,transparent 53%);opacity:0.55";
          handle.addEventListener("mousedown", function (ev) {
            ev.preventDefault();
            ev.stopPropagation();
            var rect = th.getBoundingClientRect();
            var w = Number(columnWidths[index] || (rect && rect.width ? rect.width : 0));
            resizeState = { index: index, startX: ev.clientX, startWidth: w > 0 ? w : 120 };
            document.body.style.cursor = "col-resize";
            document.body.style.userSelect = "none";
          });
          handle.addEventListener("click", function (ev) {
            ev.stopPropagation();
          });
          th.appendChild(handle);
        });
      }

        try {
          var u = String(localStorage.getItem("currentUser") || "guest").trim() || "guest";
          return "datagon_my_products_visible_cols_v2:" + u;
        } catch (e) {
          return "datagon_my_products_visible_cols_v2:guest";
        }
      }

      function userColWidthKey() {
        try {
          var u = String(localStorage.getItem("currentUser") || "guest").trim() || "guest";
          return "datagon_my_products_col_widths_v1:" + u;
        } catch (e) {
          return "datagon_my_products_col_widths_v1:guest";
        }

      function getVisibleColumns() {
        return visibleCols.slice();
      }

      function applyVisibleColumns() {
        var cols = getVisibleColumns();
        var all = Array.prototype.slice.call(
          document.querySelectorAll("#mp-thead-row th, #dg-tbody tr td")
        );
        var headCells = Array.prototype.slice.call(
          document.querySelectorAll("#mp-thead-row th")
        );
        all.forEach(function (cell) {
          cell.style.display = "";
        });
        headCells.forEach(function (th, index) {
          var key = th.getAttribute("data-mp-sort");
          if (!key) key = index === headCells.length - 2 ? "competitor" : "actions";
          var show = cols.indexOf(key) >= 0;
          th.style.display = show ? "" : "none";
          document.querySelectorAll("#dg-tbody tr").forEach(function (tr) {
            if (tr.cells && tr.cells[index]) tr.cells[index].style.display = show ? "" : "none";
          });
          if (!show) clearColumnIndexSizing(index);
        });
        mpRefreshFloatingAfterLayout();
      }

      function renderColumnsPanel() {
        var list = document.getElementById("dg-mp-columns-list");
        if (!list) return;
        list.replaceChildren();
        var headers = Array.prototype.slice.call(document.querySelectorAll("#mp-thead-row th"));
        headers.forEach(function (th, index) {
          var key = th.getAttribute("data-mp-sort");
          if (!key) key = index === headers.length - 2 ? "competitor" : "actions";
          var label = String(th.getAttribute("data-mp-label") || th.textContent || "")
            .replace(/\s*[↑↓↕]\s*$/, "")
            .trim();
          var row = document.createElement("label");
          var cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = visibleCols.indexOf(key) >= 0;
          cb.addEventListener("change", function () {
            var next = visibleCols.slice();
            if (cb.checked) {
              if (next.indexOf(key) < 0) next.push(key);
            } else {
              next = next.filter(function (k) {
                return k !== key;
              });
            }
            if (!next.length) {
              cb.checked = true;
              return;
            }
            visibleCols = DEFAULT_VISIBLE_COLS.filter(function (k) {
              return next.indexOf(k) >= 0;
            });
            try {
              localStorage.setItem(userVisibleColsKeyVanilla(), JSON.stringify(visibleCols));
            } catch (e) {}
            applyVisibleColumns();
          });
          row.appendChild(cb);
          row.appendChild(document.createTextNode(label || key));
          list.appendChild(row);
        });
      }

      function setSort(sortBy) {
        if (lastLoading) return;
        var curBy = document.getElementById("mp-f-sort-by").value;
        var curDir = document.getElementById("mp-f-sort-dir").value;
        var nextDir = "asc";
        if (curBy === sortBy) nextDir = curDir === "asc" ? "desc" : "asc";
        document.getElementById("mp-f-sort-by").value = sortBy;
        document.getElementById("mp-f-sort-dir").value = nextDir;
        try {
          localStorage.setItem(
            userSortKey(),
            JSON.stringify({ sort_by: sortBy, sort_dir: nextDir })
          );
        } catch (e) {}
        offset = 0;
        updateSortHeaders();
        load();
      }

      function attachMpFieldLog(td, row, field) {
        if (!td || !row || !row.id || !field) return td;
        td.classList.add("dg-mp-field-cell");
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "dg-mp-field-log-btn";
        btn.textContent = "лог";

        btn.title = "Журнал изменений: " + flabel;

        btn.setAttribute("data-dg-mp-log-field", field);
        btn.setAttribute("data-dg-mp-log-field-label", flabel);

          "data-dg-mp-log-label",
          String(row.name || row.sku || "#" + row.id)
        );

      function stickerChecked(row, key) {
        if (key === "sticker_has_ru") return Number(row.sticker_has_ru) === 1;
        if (key === "sticker_in_stock") return Number(row.sticker_in_stock) === 1;
        if (key === "sticker_sale") return Number(row.sticker_sale_active || row.sticker_sale) === 1;
        return Number(row[key]) === 1;
      }

      function makeStickerCell(row, def) {
        var td = document.createElement("td");
        td.className = "dg-mp-sticker-cell dg-mp-field-cell";
        var chk = document.createElement("input");
        chk.type = "checkbox";
        chk.className = "form-check-input m-0";
        chk.checked = stickerChecked(row, def.key);
        chk.setAttribute("data-dg-no-activity", "1");
        if (!def.manual) {
          chk.disabled = true;
          if (def.key === "sticker_has_ru") {
            chk.title = row.sticker_ru_url
              ? "РУ: " + row.sticker_ru_url
              : Number(row.sticker_no_ru) === 1
                ? "Перекрыто галкой «Нет РУ»"
                : "Нет ссылки РУ в атрибутах МойСклад";
          } else if (def.key === "sticker_in_stock") {
            chk.title =
              Number(row.sticker_ms_linked) === 1
                ? "Остаток МС: " +
                  (row.sticker_ms_stock != null ? row.sticker_ms_stock : "—")
                : "Нет связи с МойСклад — авто-наклейка недоступна";
          }
        } else {
          if (def.key === "sticker_sale") {
            var saleUntil =
              row.sale_until_effective || row.sale_until || (chk.checked ? row.price_hold_until : null);
            var salePrice =
              row.sale_price_effective != null
                ? row.sale_price_effective
                : row.sale_price != null
                  ? Number(row.sale_price)
                  : null;
            chk.title = chk.checked
              ? "Акция до " +
                formatHoldUntilShort(saleUntil) +
                (salePrice != null ? " · " + formatMoney(salePrice) : "") +
                " (клик снять)"
              : def.hint || def.label;
          } else {
            chk.title = def.hint || def.label;
          }
          chk.setAttribute("data-dg-notify-start", "Сохраняем «" + def.label + "»…");
          chk.addEventListener("change", function () {
            var on = chk.checked ? 1 : 0;
            if (def.key === "sticker_sale" && on) {
              chk.checked = false;
              openSaleStickerModal(row);
              return;
            }
            var body = {
              site_id: row.site_id,
              source_id: row.source_id,
              sku: row.sku,
            };
            body[def.key] = on;
            var run = function () {
              return fetch("/api/my-products/set-sticker", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify(body),
              }).then(function (res) {
                return res.json().then(function (j) {
                  if (!res.ok || j.success === false) {
                    throw new Error((j && j.error) || "HTTP " + res.status);
                  }
                  return j;
                });
              });
            };
            var p =
              window.DatagonNotify && window.DatagonNotify.busyRun
                ? window.DatagonNotify.busyRun(chk, run)
                : run();
            p.then(function (j) {
              var d = (j && j.data) || {};
              STICKER_COLS.forEach(function (c) {
                if (d[c.key] != null) row[c.key] = d[c.key];
              });
              if (d.sticker_has_ru != null) row.sticker_has_ru = d.sticker_has_ru;
              if (d.sticker_in_stock != null) row.sticker_in_stock = d.sticker_in_stock;
              if (d.sticker_sale_active != null) row.sticker_sale_active = d.sticker_sale_active;
              if (d.sticker_ru_url != null) row.sticker_ru_url = d.sticker_ru_url;
              if (d.sticker_ms_stock != null) row.sticker_ms_stock = d.sticker_ms_stock;
              if (d.price_hold_until != null) row.price_hold_until = d.price_hold_until;
              if (d.sale_price != null) row.sale_price = d.sale_price;
              if (d.sale_until != null) row.sale_until = d.sale_until;
              if (d.sale_until_effective != null) row.sale_until_effective = d.sale_until_effective;
              if (d.sale_price_effective != null) row.sale_price_effective = d.sale_price_effective;
              renderRows(lastRows || []);
              var sync = j && j.cms_sync;
              if (window.DatagonNotify && window.DatagonNotify.toast) {
                if (sync && sync.skipped) {
                  window.DatagonNotify.toast({
                    type: "warning",
                    message:
                      sync.reason ||
                      "Сохранено в Datagon. На витрину Webasyst уходит только со строки Альмамед.",
                  });
                } else if (sync && sync.queued) {
                  window.DatagonNotify.toast({
                    type: "success",
                    message: "Наклейка сохранена → выгрузка в Webasyst Features",
                  });
                }
              }
            }).catch(function (e) {
              chk.checked = !on;
              if (window.DatagonNotify && window.DatagonNotify.toast) {
                window.DatagonNotify.toast({
                  type: "danger",
                  message: e.message || "Ошибка сохранения наклейки",
                });
              }
            });
          });
        }
        td.appendChild(chk);
        var hint = document.createElement("span");
        hint.className = "dg-mp-sticker-hint";
        hint.textContent = def.hint || "";
        td.appendChild(hint);
        if (def.manual) attachMpFieldLog(td, row, def.key);
        return td;
      }

      function closeMpLogOverlay() {
        var overlay = document.getElementById("dg-mp-log-overlay");
        if (!overlay) return;
        overlay.style.display = "none";
        overlay.setAttribute("aria-hidden", "true");
      }

      function openMpLog(productId, label, field, fieldLabel) {
        mpLogState.productId = productId;
        mpLogState.field = field || "";
        mpLogState.label = label || "";
        mpLogState.offset = 0;
        var overlay = document.getElementById("dg-mp-log-overlay");
        var titleEl = document.getElementById("dg-mp-log-title");
        var subEl = document.getElementById("dg-mp-log-subtitle");
        if (titleEl) titleEl.textContent = "Журнал: " + (label || "#" + productId);
        if (subEl) {
          subEl.textContent = field
            ? "Поле: " + (fieldLabel || MP_FIELD_LOG_LABELS[field] || field)
            : "Все поля";
        }
        if (overlay) {
          overlay.style.display = "flex";
          overlay.setAttribute("aria-hidden", "false");
        }
        loadMpLog();
      }

      function loadMpLog() {
        var body = document.getElementById("dg-mp-log-body");
        if (!body || !mpLogState.productId) return;
        body.innerHTML =
          '<div class="text-muted small text-center py-4">Загрузка журнала…</div>';
        var qs = new URLSearchParams();
        qs.set("limit", String(mpLogState.limit));
        qs.set("offset", String(mpLogState.offset));
        if (mpLogState.field) qs.set("field", mpLogState.field);
        fetch("/api/my-products/" + mpLogState.productId + "/log?" + qs.toString(), {
          credentials: "same-origin",
        })
          .then(function (res) {
            return res.json().then(function (j) {
              if (!res.ok || j.success === false) {
                throw new Error((j && j.error) || "HTTP " + res.status);
              }
              return j;
            });
          })
          .then(function (j) {
            var rows = j.rows || [];
            var labels = j.field_labels || MP_FIELD_LOG_LABELS;
            if (!rows.length) {
              body.innerHTML =
                '<div class="text-muted small text-center py-4">Записей пока нет</div>';
              return;
            }
            var html =
              '<table class="table table-sm table-hover mb-0"><thead><tr>' +
              "<th>Когда</th><th>Поле</th><th>Кто</th><th>Изменение</th><th>Действие</th>" +
              "</tr></thead><tbody>";
            rows.forEach(function (r) {
              var when =
                window.DatagonFmt && window.DatagonFmt.formatDateTime
                  ? window.DatagonFmt.formatDateTime(r.changed_at)
                  : formatRuDateTime(r.changed_at);
              var fl = labels[r.field] || r.field;
              var oldV =
                r.old_value == null || r.old_value === ""
                  ? '<span class="text-muted">—</span>'
                  : '<span class="dg-mp-log-old">' + escHtml(String(r.old_value)) + "</span>";
              var newV =
                r.new_value == null || r.new_value === ""
                  ? '<span class="text-muted">—</span>'
                  : '<span class="dg-mp-log-new">' + escHtml(String(r.new_value)) + "</span>";
              html +=
                "<tr><td>" +
                escHtml(when || "—") +
                "</td><td>" +
                escHtml(fl) +
                "</td><td>" +
                escHtml(r.changed_by_name || r.changed_by_login || "—") +
                "</td><td>" +
                oldV +
                '<span class="dg-mp-log-arrow">→</span>' +
                newV +
                '</td><td><span class="badge bg-light text-dark border">' +
                escHtml(r.action || "update") +
                "</span></td></tr>";
            });
            html += "</tbody></table>";
            var total = Number(j.total || 0);
            var page = Math.floor(mpLogState.offset / mpLogState.limit) + 1;
            var pages = Math.max(1, Math.ceil(total / mpLogState.limit));
            html +=
              '<div class="d-flex align-items-center justify-content-between gap-2 px-3 py-2 border-top flex-wrap">' +
              '<span class="small text-muted">Найдено: ' +
              total +
              "; страница " +
              page +
              "/" +
              pages +
              "</span>" +
              '<div class="btn-group">' +
              '<button type="button" class="btn btn-sm btn-outline-secondary dg-mp-log-prev"' +
              (mpLogState.offset <= 0 ? " disabled" : "") +
              ">Назад</button>" +
              '<button type="button" class="btn btn-sm btn-outline-secondary dg-mp-log-next"' +
              (mpLogState.offset + mpLogState.limit >= total ? " disabled" : "") +
              ">Вперёд</button>" +
              "</div></div>";
            if (mpLogState.field) {
              html =
                '<div class="px-3 py-2 border-bottom small">' +
                '<button type="button" class="btn btn-sm btn-outline-primary dg-mp-log-all-fields">Все поля строки</button>' +
                "</div>" +
                html;
            }
            body.innerHTML = html;
          })
          .catch(function (e) {
            body.innerHTML =
              '<div class="text-danger small text-center py-4">' +
              escHtml(e.message || "Ошибка") +
              "</div>";
          });
      }

      function bindMpLogUi() {
        document.addEventListener("click", function (ev) {
          var fieldBtn =
            ev.target && ev.target.closest && ev.target.closest(".dg-mp-field-log-btn");
          if (fieldBtn) {
            ev.preventDefault();
            var fid = parseInt(fieldBtn.getAttribute("data-dg-mp-log-id") || "", 10);
            var flabel = fieldBtn.getAttribute("data-dg-mp-log-label") || "";
            var fkey = fieldBtn.getAttribute("data-dg-mp-log-field") || "";
            var fflabel = fieldBtn.getAttribute("data-dg-mp-log-field-label") || "";
            if (Number.isFinite(fid) && fid > 0) openMpLog(fid, flabel, fkey, fflabel);
            return;
          }
          if (ev.target && ev.target.closest && ev.target.closest(".dg-mp-log-prev")) {
            ev.preventDefault();
            mpLogState.offset = Math.max(0, mpLogState.offset - mpLogState.limit);
            loadMpLog();
            return;
          }
          if (ev.target && ev.target.closest && ev.target.closest(".dg-mp-log-next")) {
            ev.preventDefault();
            mpLogState.offset += mpLogState.limit;
            loadMpLog();
            return;
          }
          if (ev.target && ev.target.closest && ev.target.closest(".dg-mp-log-all-fields")) {
            ev.preventDefault();
            mpLogState.field = "";
            mpLogState.offset = 0;
            var subEl = document.getElementById("dg-mp-log-subtitle");
            if (subEl) subEl.textContent = "Все поля";
            loadMpLog();
          }
        });
        var closeBtn = document.getElementById("dg-mp-log-close");
        var refreshBtn = document.getElementById("dg-mp-log-refresh");
        var backdrop = document.getElementById("dg-mp-log-backdrop");
        if (closeBtn) closeBtn.addEventListener("click", closeMpLogOverlay);
        if (backdrop) backdrop.addEventListener("click", closeMpLogOverlay);
        if (refreshBtn) refreshBtn.addEventListener("click", loadMpLog);
        document.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape") closeMpLogOverlay();
        });
      }

      function getPageLimit() {
        var lim = Number(document.getElementById("mp-f-limit").value);
        if (!Number.isFinite(lim) || lim < 1) lim = initialLimit;
        return lim;
      }

      function totalPages() {
        var lim = getPageLimit();
        var total = Number(lastTotal || 0);
        if (total <= 0) return 1;
        return Math.max(1, Math.ceil(total / lim));
      }

      function currentPage() {
        var lim = getPageLimit();
        return Math.floor(Number(offset || 0) / lim) + 1;
      }

      function updatePager() {
        var pages = totalPages();
        var page = currentPage();
        var prev = document.getElementById("mp-btn-prev");
        var next = document.getElementById("mp-btn-next");
        if (prev) prev.disabled = page <= 1 || lastLoading;
        if (next) next.disabled = page >= pages || lastLoading;
      }

      function updateHint(filteredLen) {
        var hint = document.getElementById("dg-mp-table-hint");
        if (!hint) return;
        hint.textContent =
          "Найдено: " +
          fmt(lastTotal) +
          "; страница " +
          currentPage() +
          "/" +
          totalPages() +
          "; показано: " +
          fmt(filteredLen);
        updatePager();
      }

      function applyTableFilterAndRender() {
        if (lastLoading) {
          renderRows([]);
          return;
        }
        var filtered = filterRows(lastRows, collectTableFilters());
        updateHint(filtered.length);
        renderRows(filtered);
      }

      function aggregateStats(rows) {
        var acc = { total: 0, linked: 0, disabled: 0, disappeared: 0 };
        (rows || []).forEach(function (s) {
          acc.total += Number(s.total || 0);
          acc.linked += Number(s.linked || 0);
          acc.disabled += Number(s.disabled || 0);
          acc.disappeared += Number(s.disappeared || 0);
        });
        acc.unlinked = Math.max(0, acc.total - acc.linked);
        return acc;
      }

      function buildStatsQuery() {
        var f = collectApiFilters();
        return buildQuery({
          site_id: f.site_id,
          status: f.status,
          source_enabled: f.source_enabled,
          ms_linked: f.ms_linked,
          stock_min: f.stock_min,
          stock_max: f.stock_max,
        });
      }

      function findLastRowIndex(keyRow) {
        var sid = Number(keyRow.site_id);
        var src = String(keyRow.source_id || "").trim();
        var sku = String(keyRow.sku || "").trim();
        for (var i = 0; i < lastRows.length; i++) {
          var r = lastRows[i];
          if (Number(r.site_id) !== sid) continue;
          if (src && String(r.source_id || "").trim() === src) return i;
          if (sku && String(r.sku || "").trim() === sku) return i;
        }
        return -1;
      }

      function applyLocalProductPatch(keyRow, patch) {
        var idx = findLastRowIndex(keyRow);
        if (idx < 0) {
          load();
          return;
        }
        var cur = lastRows[idx];
        var next = Object.assign({}, cur);
        Object.keys(patch).forEach(function (k) {
          if (patch[k] !== undefined) next[k] = patch[k];
        });
        lastRows[idx] = next;
        applyTableFilterAndRender();
        refreshStatsStrip();
      }

      function refreshStatsStrip() {
        var statsQs = buildStatsQuery();
        return fetch("/api/my-products/stats" + statsQs, { credentials: "same-origin" })
          .then(function (r) {
            return r.json();
          })
          .then(function (statsRows) {
            var agg = aggregateStats(Array.isArray(statsRows) ? statsRows : []);
            var a = document.getElementById("mp-st-active");
            var l = document.getElementById("mp-st-linked");
            var u = document.getElementById("mp-st-unlinked");
            var d = document.getElementById("mp-st-disabled");
            var di = document.getElementById("mp-st-disappeared");
            if (a) a.textContent = fmt(agg.total);
            if (l) l.textContent = fmt(agg.linked);
            if (u) u.textContent = fmt(agg.unlinked);
            if (d) d.textContent = fmt(agg.disabled);
            if (di) di.textContent = fmt(agg.disappeared);
          })
          .catch(function () {});
      }

      function parseUrlToForm() {
        var params = new URLSearchParams(window.location.search);
        var keys = [
          "site_id",
          "status",
          "source_enabled",
          "ms_linked",
          "sort_by",
          "sort_dir",
          "search",
          "match_audit",
          "price_hold",
          "gap_competitor",
          "gap_min_pct",
          "gap_max_pct",
          "gap_min_pct_2",
          "gap_max_pct_2",
          "usd_to_rub",
          "eur_to_rub",
          "comp_sync_rand_min",
          "comp_sync_rand_max",
          "stock_min",
          "stock_max",
        ];
        keys.forEach(function (k) {
          var v = params.get(k);
          if (v === null || v === "") return;
          if (k === "site_id") document.getElementById("f-site").value = v;
          if (k === "status") document.getElementById("mp-f-status").value = v;
          if (k === "source_enabled")
            document.getElementById("mp-f-source_enabled").value = v;
          if (k === "ms_linked") document.getElementById("f-ms").value = v;
          if (k === "sort_by") document.getElementById("mp-f-sort-by").value = v;
          if (k === "sort_dir") document.getElementById("mp-f-sort-dir").value = v;
          if (k === "search") {
            apiSearch = v;
            document.getElementById("mp-f-smart").value = v;
          }
          if (k === "match_audit")
            document.getElementById("mp-f-match_audit").value = v;
          if (k === "price_hold")
            document.getElementById("mp-f-price_hold").value = v;
          if (k === "gap_competitor")
            document.getElementById("mp-f-gap_competitor").value = v;
          if (k === "gap_min_pct")
            document.getElementById("mp-f-gap_min_pct").value = v;
          if (k === "gap_max_pct")
            document.getElementById("mp-f-gap_max_pct").value = v;
          if (k === "gap_min_pct_2")

      async function load() {
        if (lastLoading) {
          loadQueued = true;
          return;
        }
        lastLoading = true;
        loadQueued = false;
        setMyProductsListBusy(true);
        refreshMyProductsHeavyButtons();
        var st = document.getElementById("dg-status");
        if (st) {
          st.style.display = "none";
          st.textContent = "";
        }
        applyTableFilterAndRender();
        try {
          var listQs = buildQuery(collectApiFilters());
          var statsQs = buildStatsQuery();
          var fxP = fetch("/api/my-products/fx-rates", { credentials: "same-origin" }).then(
            function (r) {
              return r.json();
            }
          );
          var statsP = fetch("/api/my-products/stats" + statsQs, {
            credentials: "same-origin",
          }).then(function (r) {
            return r.json();
          });
          var prodP = fetch("/api/my-products" + listQs, {
            credentials: "same-origin",
          }).then(function (r) {
            return r.json();
          });

          var settled = await Promise.all([
            fxP.catch(function () {
              return {};
            }),
            statsP.catch(function () {
              return [];
            }),
            prodP,
          ]);
          var fx = settled[0];
          var statsRows = settled[1];
          var json = settled[2];

          if (!json || json.error) throw new Error((json && json.error) || "Ошибка загрузки");

          lastFx = {
            usd_to_rub: Number(fx.usd_to_rub || 0),
            eur_to_rub: Number(fx.eur_to_rub || 0),
          };
          lastFxUpdatedAt = fx.updated_at || fx.updatedAt;
          var fxEl = document.getElementById("dg-fx-hint");
          if (fxEl) {
            fxEl.textContent =
              "FX: USD " +
              lastFx.usd_to_rub.toFixed(2) +
              " | EUR " +
              lastFx.eur_to_rub.toFixed(2) +
              " | Обновлен: " +
              formatFxUpdatedLabel(lastFxUpdatedAt);
          }

          var agg = aggregateStats(Array.isArray(statsRows) ? statsRows : []);
          document.getElementById("mp-st-active").textContent = fmt(agg.total);
          document.getElementById("mp-st-linked").textContent = fmt(agg.linked);
          document.getElementById("mp-st-unlinked").textContent = fmt(agg.unlinked);
          document.getElementById("mp-st-disabled").textContent = fmt(agg.disabled);
          document.getElementById("mp-st-disappeared").textContent = fmt(agg.disappeared);

          lastRows = Array.isArray(json.data) ? json.data : [];
          lastTotal = Number(json.total || 0);
          var limClamp = getPageLimit();
          var maxOff = Math.max(0, (totalPages() - 1) * limClamp);
          if (Number(offset || 0) > maxOff) offset = maxOff;
          syncUrlFromDom();
          updateSortHeaders();
          persistMyProductsFilterForm();
        } catch (e) {
          lastRows = [];
          if (st) {
            st.style.display = "";
            st.textContent = "Ошибка: " + (e && e.message ? e.message : e);
          }
        } finally {
          lastLoading = false;
          setMyProductsListBusy(false);
          refreshMyProductsHeavyButtons();
          applyTableFilterAndRender();
          try {
            loadBuyVsCompSnapshot();
          } catch (eBvc) {}
          if (loadQueued) {
            loadQueued = false;
            load();
          }
        }
      }

      var mpConfirmState = null;

      function closeMpConfirm() {
        var ov = document.getElementById("dg-mp-confirm-overlay");
        if (ov) {
          ov.style.display = "none";
          ov.setAttribute("aria-hidden", "true");
        }
        mpConfirmState = null;
      }

      function mountMpConfirmOverlayToBody() {
        var ov = document.getElementById("dg-mp-confirm-overlay");
        if (!ov) return null;
        if (ov.parentNode !== document.body) {
          document.body.appendChild(ov);
        }
        return ov;
      }

      function openMpConfirm(opts) {
        var o = opts || {};
        mpConfirmState = o;
        var ov = mountMpConfirmOverlayToBody();
        var title = document.getElementById("dg-mp-confirm-title");
        var text = document.getElementById("dg-mp-confirm-text");
        var meta = document.getElementById("dg-mp-confirm-meta");
        var priceWrap = document.getElementById("dg-mp-confirm-price-wrap");
        var priceInp = document.getElementById("dg-mp-confirm-price");
        var okBtn = document.getElementById("dg-mp-confirm-ok");
        var altBtn = document.getElementById("dg-mp-confirm-alt");
        if (!ov || !title || !text || !okBtn) return Promise.reject(new Error("confirm UI missing"));
        title.textContent = o.title || "Подтверждение";
        text.textContent = o.text || "";
        if (meta) meta.textContent = o.meta || "";
        if (priceWrap && priceInp) {
          if (o.showPrice) {
            priceWrap.classList.remove("d-none");
            priceInp.value =
              o.price != null && o.price !== ""
                ? String(o.price)
                : "";
          } else {
            priceWrap.classList.add("d-none");
          }
        }
        okBtn.className = "btn btn-sm " + (o.okClass || "btn-warning");
        okBtn.textContent = o.okText || "Подтвердить";
        if (altBtn) {
          if (o.altText) {
            altBtn.classList.remove("d-none");
            altBtn.textContent = o.altText;
          } else {
            altBtn.classList.add("d-none");
          }
        }
        ov.style.display = "flex";
        ov.setAttribute("aria-hidden", "false");
        return new Promise(function (resolve) {
          mpConfirmState = Object.assign({}, o, {
            _resolve: resolve,
          });
        });
      }

      function bindMpConfirmUi() {
        var ov = document.getElementById("dg-mp-confirm-overlay");
        if (!ov || ov.getAttribute("data-mp-bound") === "1") return;
        ov.setAttribute("data-mp-bound", "1");
        ov.addEventListener("click", function (e) {
          var t = e.target;
          if (t && t.getAttribute && t.getAttribute("data-mp-confirm-dismiss") === "1") {
            var st = mpConfirmState;
            closeMpConfirm();
            if (st && st._resolve) st._resolve({ ok: false });
          }
        });
        document.addEventListener("keydown", function (e) {
          if (e.key !== "Escape") return;
          var overlay = document.getElementById("dg-mp-confirm-overlay");
          if (!overlay || overlay.style.display === "none") return;
          var st = mpConfirmState;
          closeMpConfirm();
          if (st && st._resolve) st._resolve({ ok: false });
        });
        var okBtn = document.getElementById("dg-mp-confirm-ok");
        if (okBtn) {
          okBtn.addEventListener("click", function () {
            var st = mpConfirmState;
            if (!st || !st._resolve) return;
            var priceInp = document.getElementById("dg-mp-confirm-price");
            var priceVal = priceInp ? priceInp.value : null;
            var resolve = st._resolve;
            closeMpConfirm();
            resolve({ ok: true, price: priceVal });
          });
        }
        var altBtn = document.getElementById("dg-mp-confirm-alt");
        if (altBtn) {
          altBtn.addEventListener("click", function () {
            var st = mpConfirmState;
            if (!st || !st._resolve) return;
            var resolve = st._resolve;
            closeMpConfirm();
            resolve({ ok: true, alt: true });
          });
        }
      }

              : "Считаем выборку для заморозки (срок " + days + " дн.)…",
            false
          );
          var bodyDry = buildBulkSyncPriceBody(
            mode === "clear" ? { dry_run: 1 } : { dry_run: 1, hold_days: days }
          );
          var url =
            mode === "clear"
              ? "/api/my-products/clear-price-hold-bulk"
              : "/api/my-products/set-price-hold-bulk";
          return fetch(url, {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(bodyDry),
          })
            .then(function (r) {
              return r.json().then(function (j) {
                return { ok: r.ok, j: j };
              });
            })
            .then(function (pre) {
              if (!pre.ok || !pre.j || pre.j.success === false) {
                throw new Error((pre.j && pre.j.error) || "Не удалось оценить выборку");
              }
              showMpActionLog("info", formatBulkHoldSummary(pre.j, "План.", mode), true);
              var toUp = Number(pre.j.to_update || 0);
              if (toUp <= 0) {
                var okMsg =
                  mode === "clear"
                    ? "Нечего снимать: в выборке нет активной заморозки."
                    : "Нечего замораживать: все уже заморожены или выборка пуста.";
                showMpActionLog(
                  "success",
                  formatBulkHoldSummary(pre.j, "Итог.", mode) + "<br>" + okMsg,
                  true
                );
                notifyMp("success", okMsg);
                return null;
              }
              return openMpConfirm({
                title: mode === "clear" ? "Снять заморозку?" : "Заморозить цены?",
                text:
                  mode === "clear"
                    ? "Снять заморозку у " +
                      toUp.toLocaleString("ru-RU") +
                      " товаров по текущим фильтрам?"
                    : "Заморозить цены у " +
                      toUp.toLocaleString("ru-RU") +
                      " товаров на " +
                      days +
                      " дн.? Цены в CMS не меняются.",
                meta: describeMpAppliedFilters(),
                showPrice: false,
                okText: mode === "clear" ? "Снять" : "Заморозить",
                okClass: mode === "clear" ? "btn-outline-secondary" : "btn-warning",
              }).then(function (res) {
                if (!res || !res.ok) return null;
                var body = buildBulkSyncPriceBody(
                  mode === "clear" ? { confirm: 1 } : { confirm: 1, hold_days: days }
                );
                return fetch(url, {
                  method: "POST",
                  credentials: "same-origin",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(body),
                }).then(function (r) {
                  return r.json().then(function (j) {
                    return { ok: r.ok, j: j };
                  });
                });
              });
            })
            .then(function (fin) {
              if (!fin) return;
              if (!fin.ok || !fin.j || fin.j.success === false) {
                throw new Error((fin.j && fin.j.error) || "Операция не выполнена");
              }
              showMpActionLog("success", formatBulkHoldSummary(fin.j, "Итог.", mode), true);
              notifyMp(
                "success",
                mode === "clear"
                  ? "Снято: " + Number(fin.j.cleared || 0).toLocaleString("ru-RU")
                  : "Заморожено: " + Number(fin.j.held || 0).toLocaleString("ru-RU")
              );
              return load();
            })
            .catch(function (e) {
              var err = e && e.message ? e.message : "Ошибка";
              showMpActionLog(
                "danger",
                "<strong>Ошибка заморозки цен</strong><br>" +
                  err +
                  "<br>Фильтры: " +
                  describeMpAppliedFilters(),
                true
              );
              notifyMp("danger", err);
              throw e;
            })
            .finally(function () {
              myProductsBulkPriceBusy = false;
              refreshMyProductsHeavyButtons();
            });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun && btn) {
          return window.DatagonNotify.busyRun(btn, doFetch);
        }
        return doFetch();
      }

      function onSyncPrice(row) {
        if (myProductsRowActionBusy) return;
        if (isRowPriceHoldActive(row)) {
          notifyMp(
            "warning",
            "Цена заморожена до " +
              formatHoldUntilShort(row.price_hold_until) +
              " — сначала снимите заморозку"
          );
          return;
        }
        var msN = Number(row.sticker_ms_stock);
        if (
          Number(row.site_ms_stock_guard) === 1 &&
          Number(row.sticker_ms_linked) === 1 &&
          Number.isFinite(msN) &&
          msN > 0
        ) {
          notifyMp(
            "warning",
            "Синк с конкурента отключён: свой остаток МС (склады сайта) = " +
              (window.DatagonFmt && window.DatagonFmt.formatNumber
                ? window.DatagonFmt.formatNumber(msN, { maxFractionDigits: 3 })
                : String(msN))
          );
          return;
        }
        myProductsRowActionBusy = true;
        refreshMyProductsHeavyButtons();
        var min =
          document.getElementById("mp-f-comp_min").value.trim() || "0.1";
        var max =
          document.getElementById("mp-f-comp_max").value.trim() || "0.99";
        fetch("/api/my-products/sync-price-from-competitor", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            site_id: Number(row.site_id),
            sku: row.sku,
            source_id: row.source_id || undefined,
            random_min_pct: Number(String(min).replace(",", ".")),
            random_max_pct: Number(String(max).replace(",", ".")),
            confirm: true,
          }),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok || !x.j.success)
              throw new Error(x.j.error || x.j.message || "sync-price failed");
            var d = (x.j && x.j.data) || {};
            if (window.DatagonActivity && window.DatagonActivity.trackNow) {
              window.DatagonActivity.trackNow({
                kind: "ui",
                section: "my-products",
                label:
                  "Цена с конкурента: «" +
                  String(row.name || "").slice(0, 80) +
                  "» (SKU «" +
                  String(row.sku || "") +
                  "», сайт #" +
                  String(row.site_id) +
                  ") → " +
                  String(d.target_price != null ? d.target_price : "") +
                  " " +
                  String(d.target_currency || row.currency || "").trim() +
                  (d.competitor_source ? " (от " + d.competitor_source + ")" : ""),
                detail: JSON.stringify({
                  action: "sync_price_from_competitor",
                  site_id: Number(row.site_id),
                  my_product_id: row.id,
                  sku: String(row.sku || ""),
                  source_id: String(row.source_id || ""),
                  name: String(row.name || "").slice(0, 200),
                  new_price: d.target_price,
                  currency: String(d.target_currency || row.currency || ""),
                  competitor_source: d.competitor_source,
                  competitor_price_rub: d.competitor_price_rub,
                  random_pct: d.random_pct,
                  random_range_pct: String(min) + "–" + String(max),
                }),
              });
            }
            applyLocalProductPatch(row, {
              price: d.price != null ? d.price : d.target_price,
              currency: d.currency != null ? d.currency : d.target_currency,
              comp_sync_at: d.comp_sync_at,
              comp_sync_by: d.comp_sync_by != null ? d.comp_sync_by : d.synced_by,
              comp_sync_note: d.comp_sync_note,

          })
          .catch(function (e) {
            alert(e.message || String(e));
          })
          .finally(function () {
            myProductsRowActionBusy = false;
            refreshMyProductsHeavyButtons();
          });
      }

      function copyBuyVsCompText(raw) {
        var text = String(raw || "");
        if (!text) return;
        var done = function () {
          if (window.DatagonNotify && window.DatagonNotify.toast) {
            window.DatagonNotify.toast({ type: "success", message: "Скопировано" });
          }
        };
        var fail = function () {
          if (window.DatagonNotify && window.DatagonNotify.toast) {
            window.DatagonNotify.toast({ type: "danger", message: "Не удалось скопировать" });
          }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(fail);
          return;
        }
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          done();
        } catch (e) {
          fail();
        }
      }

      function formatBuyVsCompRebuilt(v) {
        if (!v) return "ещё не считали";
        try {
          if (window.DatagonFmt && DatagonFmt.formatDate) {
            var d = new Date(v);
            if (!isNaN(d.getTime())) {
              var dd = DatagonFmt.formatDate(d);
              var tm = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
              return dd + " " + tm;
            }
          }
        } catch (e) {}
        return String(v);
      }


      function formatBuyVsCompPackBadge(packQty, packBasis) {
        var q = Number(packQty);
        if (!Number.isFinite(q) || q < 2) return "";
        if (packBasis === "ours") return "×" + q;
        if (packBasis === "competitor") return "÷" + q;
        return "";
      }

      function formatBuyVsCompConfirmedAt(v) {
        if (!v) return "";
        try {
          if (window.DatagonFmt && DatagonFmt.formatDateTime) {
            return DatagonFmt.formatDateTime(v);
          }
          if (window.DatagonFmt && DatagonFmt.formatDate) {
            var d = new Date(v);
            if (!isNaN(d.getTime())) {
              return DatagonFmt.formatDate(d) + " " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
            }
          }
        } catch (e) {}
        return String(v);
      }

      function formatBuyVsCompConfirmedLine(it) {
        var by = it && it.confirmed_by ? String(it.confirmed_by).trim() : "";
        var when = it && it.confirmed_at ? formatBuyVsCompConfirmedAt(it.confirmed_at) : "";
        if (!by && !when) return "Кто подтвердил: неизвестно";
        return "Подтверждено" + (by ? ": " + by : "") + (when ? ", " + when : "");
      }

      function readBuyVsCompPackFromControls(basisSel, qtyInp) {
        var basis = basisSel ? String(basisSel.value || "").trim() : "";
        if (!basis || basis === "none") return { pack_qty: null, pack_basis: null };
        var qty = qtyInp ? parseInt(String(qtyInp.value || "").trim(), 10) : NaN;
        if (!Number.isFinite(qty) || qty < 2) {
          return { error: "Укажите количество в упаковке (целое ≥ 2) или выберите «Без коэф.»" };
        }
        if (basis !== "ours" && basis !== "competitor") {
          return { error: "Некорректный режим упаковки" };
        }
        return { pack_qty: qty, pack_basis: basis };
      }


      function updateBuyVsCompCard() {
        var card = document.getElementById("mp-buy-vs-comp-card");
        var badge = document.getElementById("mp-buy-vs-comp-badge");
        var meta = document.getElementById("mp-buy-vs-comp-card-meta");
        var refreshCard = document.getElementById("mp-btn-buy-vs-comp-refresh");
        var refreshModal = document.getElementById("dg-mp-buy-vs-comp-refresh");
        var n = Number(buyVsCompState.total || 0);
        if (badge) badge.textContent = buyVsCompState.error ? "!" : String(n);
        if (card) {
          if (!buyVsCompState.error && n > 0) card.classList.remove("d-none");
          else if (buyVsCompState.error || buyVsCompState.stale) card.classList.remove("d-none");
          else card.classList.add("d-none");
          card.classList.toggle("dg-mp-bvc-card-stale", !!buyVsCompState.stale && !buyVsCompState.error);
        }
        if (refreshCard) {
          refreshCard.classList.toggle("btn-warning", !!buyVsCompState.stale);
          refreshCard.classList.toggle("btn-outline-danger", !buyVsCompState.stale);
        }
        if (refreshModal) {
          refreshModal.classList.toggle("btn-warning", !!buyVsCompState.stale);
          refreshModal.classList.toggle("btn-light", !buyVsCompState.stale);
        }
        if (meta) {
          if (buyVsCompState.error) {
            meta.textContent = "Ошибка снапшота: " + buyVsCompState.error;
          } else if (buyVsCompState.stale) {
            meta.textContent =
              "Упаковка изменена, список устарел — нажмите «Обновить», чтобы пересчитать Δ %.";
          } else if (!buyVsCompState.rebuilt_at && n === 0) {
            meta.textContent =
              "Снапшот ещё пуст. Считается после синка «Наклейки → Webasyst» или нажмите «Обновить».";
          } else {
            meta.textContent =
              "Закупка МС > мин. ДМ/МК более чем на " +
              (buyVsCompState.threshold_pct || 1) +
              "%, с остатком. Обновлено: " +
              formatBuyVsCompRebuilt(buyVsCompState.rebuilt_at) +
              (buyVsCompState.source ? " · " + buyVsCompState.source : "") +
              (buyVsCompState.truncated ? " · список усечён" : "");
          }
        }
      }
