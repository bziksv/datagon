        var low = String(href || "").trim().toLowerCase();
        return (
          low.indexOf("javascript:") === 0 ||
          low.indexOf("data:") === 0 ||
          low.indexOf("vbscript:") === 0
        );
      }

      function buyVsCompAppendTextWithAutoLinks(el, raw) {
        var s = String(raw == null ? "" : raw);
        el.textContent = "";
        if (!s) return;
        var re =
          /(https?:\/\/[^\s<>"'`]+)|(www\.[^\s<>"'`]+)|([a-z][a-z0-9+.-]*:\/\/[^\s<>"'`]+)|(mailto:[^\s<>"'`]+)|(tel:\+?[^\s<>"'`]+)/gi;
        var last = 0;
        var m;
        while ((m = re.exec(s)) !== null) {
          if (m.index > last) {
            el.appendChild(document.createTextNode(s.slice(last, m.index)));
          }
          var full = m[0];
          var href = buyVsCompTrimLinkHref(full);
          var display = href;
          if (!href) {
            last = m.index + full.length;
            continue;
          }
          if (/^www\./i.test(href)) href = "https://" + href;
          if (href.length < 4 || buyVsCompIsDangerousAutoLinkHref(href)) {
            el.appendChild(document.createTextNode(full));
            last = m.index + full.length;
            continue;
          }
          var a = document.createElement("a");
          a.href = href;
          a.className = "text-break";
          a.textContent = display;
          var low = href.toLowerCase();
          if (
            low.indexOf("http:") === 0 ||
            low.indexOf("https:") === 0 ||
            low.indexOf("ftp:") === 0
          ) {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }
          el.appendChild(a);
          last = m.index + full.length;
        }
        if (last < s.length) {
          el.appendChild(document.createTextNode(s.slice(last)));
        }
      }

        var openBtn = document.getElementById("mp-btn-buy-vs-comp");
        var refreshCard = document.getElementById("mp-btn-buy-vs-comp-refresh");
        var refreshModal = document.getElementById("dg-mp-buy-vs-comp-refresh");
        var ov = document.getElementById("dg-mp-buy-vs-comp-overlay");
        if (openBtn) {
          openBtn.addEventListener("click", function () {
            openBuyVsCompOverlay();
            if (!buyVsCompState.items.length && !buyVsCompState.loading) {
              loadBuyVsCompSnapshot();
            }
          });
        }
        if (refreshCard) {
          refreshCard.addEventListener("click", function () {
            refreshBuyVsCompSnapshot();
          });
        }
        if (refreshModal) {
          refreshModal.addEventListener("click", function () {
            refreshBuyVsCompSnapshot();
          });
        }
        if (ov) {
          ov.addEventListener("click", function (e) {
            var t = e.target;
            if (!t) return;
            var matchBtn =
              t.closest && t.closest("[data-mp-bvc-open-match]")
                ? t.closest("[data-mp-bvc-open-match]")
                : null;
            if (matchBtn) {
              e.preventDefault();
              e.stopPropagation();
              var midEnc = matchBtn.getAttribute("data-mp-bvc-open-match") || "";
              try {
                openBuyVsCompMatchOverlay(decodeURIComponent(midEnc));
              } catch (errM) {
                openBuyVsCompMatchOverlay(midEnc);
              }
              return;
            }
            var msBtn =
              t.closest && t.closest("[data-mp-bvc-open-ms]")
                ? t.closest("[data-mp-bvc-open-ms]")
                : null;
            if (msBtn) {
              e.preventDefault();
              e.stopPropagation();
              function decAttr(name) {
                var raw = msBtn.getAttribute(name) || "";
                try {
                  return decodeURIComponent(raw);
                } catch (errDec) {
                  return raw;
                }
              }
              openBuyVsCompMsDetailModal(
                decAttr("data-mp-bvc-open-ms"),
                decAttr("data-mp-bvc-ms-code"),
                decAttr("data-mp-bvc-ms-name"),
                decAttr("data-mp-bvc-ms-type")
              );
              return;
            }
            var copyBtn =
              t.closest && t.closest("[data-mp-bvc-copy]")
                ? t.closest("[data-mp-bvc-copy]")
                : t.getAttribute && t.getAttribute("data-mp-bvc-copy") != null
                  ? t
                  : null;
            if (copyBtn) {
              e.preventDefault();
              e.stopPropagation();
              var enc = copyBtn.getAttribute("data-mp-bvc-copy") || "";
              try {
                copyBuyVsCompText(decodeURIComponent(enc));
              } catch (err) {
                copyBuyVsCompText(enc);
              }
              return;
            }
            if (t.getAttribute && t.getAttribute("data-mp-buy-vs-comp-dismiss") === "1") {
              closeBuyVsCompOverlay();
            }
          });
        }
        var matchOv = document.getElementById("dg-mp-bvc-match-overlay");
        if (matchOv) {
          matchOv.addEventListener("click", function (e) {
            var t = e.target;
            if (t && t.getAttribute && t.getAttribute("data-mp-bvc-match-dismiss") === "1") {
              closeBuyVsCompMatchOverlay();
            }
          });
        }
        (function initBuyVsCompMsDetailModal() {
          var msOv = mountBuyVsCompMsDetailOverlayToBody();
          var closeBtn = document.getElementById("dg-mp-bvc-ms-detail-close");
          var panel = msOv ? msOv.querySelector(".dg-ms-detail-panel") : null;
          if (closeBtn) closeBtn.addEventListener("click", closeBuyVsCompMsDetailModal);
          if (msOv) {
            msOv.addEventListener("click", function (e) {
              if (e.target === msOv) closeBuyVsCompMsDetailModal();
            });
          }
          if (panel) {
            panel.addEventListener("click", function (e) {
              e.stopPropagation();
            });
          }
        })();
        document.addEventListener("keydown", function (e) {
          if (e.key !== "Escape") return;
          var confirmOv = document.getElementById("dg-mp-confirm-overlay");
          if (confirmOv && confirmOv.style.display !== "none") {
            /* closeMpConfirm обрабатывается в bindMpConfirmUi — не закрывать слой ниже */
            return;
          }
          var msOverlay = document.getElementById("dg-mp-bvc-ms-detail-overlay");
          if (msOverlay && msOverlay.style.display !== "none") {
            closeBuyVsCompMsDetailModal();
            return;
          }
          var matchOverlay = document.getElementById("dg-mp-bvc-match-overlay");
          if (matchOverlay && matchOverlay.style.display !== "none") {
            closeBuyVsCompMatchOverlay();
            return;
          }
          var overlay = document.getElementById("dg-mp-buy-vs-comp-overlay");
          if (overlay && overlay.style.display !== "none") closeBuyVsCompOverlay();
        });
      })();

      // Зеркало умного поиска в card-header «Таблица товаров» — синхрон с #mp-f-smart.
      (function bindHeaderSearchMirror() {
        var primary = document.getElementById("mp-f-smart");
        var mirror = document.getElementById("dg-mp-table-search-mirror");
        if (!primary || !mirror) return;
        var syncing = false;
        function copy(from, to) {
          if (syncing) return;
          if (to.value === from.value) return;
          syncing = true;
          to.value = from.value;
          to.dispatchEvent(new Event("input", { bubbles: true }));
          syncing = false;
        }
        function applyFromMirror() {
          // Прямой apply: btn-apply при lastLoading disabled, .click() не вызывает handler.
          applySmartSearchFromInput();
        }
        primary.addEventListener("input", function () { copy(primary, mirror); });
        mirror.addEventListener("input", function () { copy(mirror, primary); });
        function bindKeys(el) {
          el.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
              e.preventDefault();
              applyFromMirror();
            } else if (e.key === "Escape") {
              if (!el.value) return;
              el.value = "";
              copy(el, el === primary ? mirror : primary);
              applyFromMirror();
            }
          });
          el.addEventListener("search", function () {
            copy(el, el === primary ? mirror : primary);
            applyFromMirror();
          });
        }
        bindKeys(mirror);
        copy(primary, mirror);
      })();

      (async function init() {
        updateMpStickyTopVar();
        try {
          columnWidths = sanitizeColumnWidths(JSON.parse(localStorage.getItem(userColWidthKey()) || "{}"));
        } catch (e) {
          columnWidths = {};
        }
        initColumnResizeHandles();
        await loadSites();
        parseUrlToForm();
        mergeMyProductsPrefsFromStorage();
        syncHeaderSearchMirrorFromPrimary();
        updateSubtitle();
        updateSyncSiteButton();
        updateSortHeaders();
        loadBuyVsCompSnapshot();
        await load();
        mpRefreshFloatingAfterLayout();
      })();
    })();
  </script>
