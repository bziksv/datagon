<script>
(function () {
  var FIN_COLS = [
    ["booked_date", "Дата"],
    ["direction", "Направление"],
    ["amount", "Сумма"],
    ["founder", "Займ / див."],
    ["org", "Организация"],
    ["bank", "Банк"],
    ["account_number", "Счёт"],
    ["counterparty", "Контрагент"],
    ["counterparty_inn", "ИНН"],
    ["purpose", "Назначение"],
    ["document_number", "Документ"],
    ["tx_id", "ID операции"],
  ];
  var DEFAULT_VISIBLE = FIN_COLS.map(function (c) { return c[0]; });
  var DEFAULT_WIDTHS = {
    booked_date: 110,
    direction: 120,
    amount: 140,
    founder: 132,
    org: 140,
    bank: 110,
    account_number: 150,
    counterparty: 220,
    counterparty_inn: 120,
    purpose: 320,
    document_number: 120,
    tx_id: 160,
  };
  var FILTERS_KEY = "datagon_finance_filters_collapsed_v1";
  var BANK_KEY = "datagon_finance_bank_collapsed_v1";
  var TABLE_KEY = "dg.finance.table-card.collapsed.v1";
  var ANALYTICS_KEY = "dg.finance.analytics-card.collapsed.v1";
  var ANALYTICS_MONTHS_KEY = "dg.finance.analytics.months.v1";
  var ANALYTICS_DEPOSITS_KEY = "dg.finance.analytics.include_deposits.v1";
  var CP_KEY = "dg.finance.counterparties-card.collapsed.v1";
  var CP_LIMIT_KEY = "dg.finance.counterparties.limit.v1";
  var CASH_KEY = "dg.finance.cash-card.collapsed.v1";
  var COLS_KEY = "datagon_finance_visible_cols_v1";
  var WIDTHS_KEY = "datagon_finance_col_widths_v1";
  var FIELD_GROUPS = [
    {
      title: "Основные",
      items: [
        { key: "search", title: "Умный поиск" },
        { key: "org", title: "Организация" },
        { key: "date_from", title: "С даты" },
        { key: "date_to", title: "По дату" },
        { key: "direction", title: "Направление" },
        { key: "source", title: "Источник" },
        { key: "account", title: "Счёт" },
      ],
    },
    {
      title: "Таблица",
      items: [
        { key: "page_size", title: "На странице" },
        { key: "sync_days", title: "Выписка, дн." },
        { key: "include_internal", title: "Внутренние (депозиты / фонды / дивиденды)" },
        { key: "founder_only", title: "Только капитал / займ учредителей" },
        { key: "dividend_only", title: "Только выплата дивидендов" },
        { key: "exclude_chart_inn", title: "Не учитывать расход на ИНН 362903774541 в графике" },
      ],
    },
  ];

  function emptyFilters() {
    return {
      search: "",
      org: [],
      date_from: "",
      date_to: "",
      direction: "",
      source: "all",
      account_id: "",
      page_size: 100,
      sync_days: 30,
      include_internal: false,
      founder_only: false,
      dividend_only: false,
      exclude_chart_inn: true,
    };
  }

  var state = {
    canWrite: false,
    credentials: [],
    raiffeisenCredentials: [],
    tbankCredentials: [],
    accounts: [],
    orgAliases: {},
    page: 1,
    total: 0,
    pages: 1,
    shown: 0,
    rows: [],
    sortKey: "booked_date",
    sortDir: "desc",
    pending: emptyFilters(),
    applied: emptyFilters(),
    analyticsMonths: 12,
    cashTemplates: [],
    cashOnce: [],
    cashSearch: "",
    cashOrgCodes: [],
    cashOnceEditId: null,
    cashTmplEditId: null,
    cashMonthEdit: null,
  };

  var chartJsPromise = null;
  var monthlyChart = null;
  var txLoadSeq = 0;
  var analyticsLoadSeq = 0;
  var cpLoadSeq = 0;

  function loadChartJs() {
    if (window.Chart && typeof window.Chart === "function") return Promise.resolve(window.Chart);
    if (chartJsPromise) return chartJsPromise;
    chartJsPromise = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js";
      s.async = true;
      s.onload = function () { resolve(window.Chart); };
      s.onerror = function () { reject(new Error("Не удалось загрузить Chart.js")); };
      document.head.appendChild(s);
    });
    return chartJsPromise;
  }

  function el(id) { return document.getElementById(id); }
  function normalizeOrgs(list) {
    var out = [];
    if (list == null || list === "") return out;
    var arr = Array.isArray(list) ? list : String(list).split(",");
    arr.forEach(function (x) {
      var t = String(x || "").trim();
      if (t && out.indexOf(t) < 0) out.push(t);
    });
    out.sort();
    return out;
  }
  function orgsKey(list) {
    return normalizeOrgs(list).join("\u0001");
  }
  function appendOrgQuery(q, orgs) {
    normalizeOrgs(orgs).forEach(function (c) {
      q.append("customer_code", c);
    });
  }
  function orgFilterCaption(orgs) {
    var codes = normalizeOrgs(orgs);
    if (!codes.length) return "Все";
    var names = codes.map(function (c) {
      return orgOptionLabel(c) || c;
    });
    if (names.length <= 2) return names.join(", ");
    return names.length + " орг.";
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function normalizeCurrency(code) {
    var s = String(code == null ? "" : code).trim().toUpperCase() || "RUB";
    if (s === "RUR" || s === "810" || s === "643") return "RUB";
    return s;
  }
  function fmtMoney(n, cur) {
    var F = window.DatagonFmt;
    var num = Number(n);
    if (!Number.isFinite(num)) return "—";
    var t = F && F.formatNumber ? F.formatNumber(num, { maxFractionDigits: 2, minFractionDigits: 2 }) : String(num);
    var c = cur ? normalizeCurrency(cur) : "";
    return t + (c ? " " + c : "");
  }
  /** Маска р/с: «номер/БИК» — берём хвост номера, не БИК (иначе у всех …5104). */
  function maskAcc(num) {
    var s = String(num || "").replace(/\s+/g, "");
    if (!s) return "—";
    var acct = s.indexOf("/") >= 0 ? s.split("/")[0] : s;
    if (acct.length <= 6) return acct;
    return "…" + acct.slice(-6);
  }
  function toast(type, message) {
    if (window.DatagonNotify && window.DatagonNotify.toast) {
      window.DatagonNotify.toast({ type: type, message: message });
    }
  }
  function showActionLog(kind, html, asHtml) {
    var box = el("dg-fin-action-log");
    if (!box) return;
    box.classList.remove("d-none", "alert-secondary", "alert-info", "alert-success", "alert-warning", "alert-danger");
    box.classList.add(kind === "success" ? "alert-success" : kind === "danger" ? "alert-danger" : kind === "warning" ? "alert-warning" : "alert-info");
    if (asHtml) box.innerHTML = html;
    else box.textContent = html;
  }
  function hideActionLog() {
    var box = el("dg-fin-action-log");
    if (!box) return;
    box.classList.add("d-none");
    box.textContent = "";
  }
  function setBankMsg(kind, html) {
    var box = el("dg-fin-bank-save-msg");
    if (!box) return;
    box.classList.remove("d-none", "alert-success", "alert-warning", "alert-danger", "alert-secondary");
    box.classList.add(kind === "success" ? "alert-success" : kind === "warning" ? "alert-warning" : kind === "danger" ? "alert-danger" : "alert-secondary");
    box.innerHTML = html;
  }
  function hasTextSelection() {
    try {
      return String(window.getSelection && window.getSelection().toString() || "").trim().length > 0;
    } catch (e) {
      return false;
    }
  }
  function userKey(base) {
    var u = "";
    try { u = String((window.DatagonAuth && window.DatagonAuth.username) || ""); } catch (e) {}
    return base + ":" + (u || "anon");
  }
  function loadVisibleCols() {
    try {
      var raw = localStorage.getItem(userKey(COLS_KEY));
      var arr = raw ? JSON.parse(raw) : null;
      if (Array.isArray(arr) && arr.length) {
        var known = {};
        FIN_COLS.forEach(function (c) { known[c[0]] = 1; });
        var filtered = arr.filter(function (k) { return known[k]; });
        // старые сохранения без колонки «Организация» — вставить перед «Счёт»
        if (filtered.indexOf("org") < 0) {
          var at = filtered.indexOf("account_number");
          if (at >= 0) filtered.splice(at, 0, "org");
          else filtered.push("org");
        }
        if (filtered.indexOf("founder") < 0) {
          var atAmt = filtered.indexOf("amount");
          if (atAmt >= 0) filtered.splice(atAmt + 1, 0, "founder");
          else filtered.splice(0, 0, "founder");
        }
        return filtered.length ? filtered : DEFAULT_VISIBLE.slice();
      }
    } catch (e) {}
    return DEFAULT_VISIBLE.slice();
  }
  function saveVisibleCols(cols) {
    try { localStorage.setItem(userKey(COLS_KEY), JSON.stringify(cols)); } catch (e) {}
  }
  function loadWidths() {
    var out = Object.assign({}, DEFAULT_WIDTHS);
    try {
      var raw = localStorage.getItem(userKey(WIDTHS_KEY));
      var obj = raw ? JSON.parse(raw) : null;
      if (obj && typeof obj === "object") {
        Object.keys(obj).forEach(function (k) {
          var n = parseInt(obj[k], 10);
          if (n >= 60 && n <= 800) out[k] = n;
        });
      }
    } catch (e) {}
    return out;
  }
  function saveWidths(w) {
    try { localStorage.setItem(userKey(WIDTHS_KEY), JSON.stringify(w)); } catch (e) {}
  }

  var visibleCols = loadVisibleCols();
  var colWidths = loadWidths();

  function readPendingFromForm() {
    state.pending.search = String((el("dg-fin-search") && el("dg-fin-search").value) || "").trim();
    var orgBoxes = document.querySelectorAll("#dg-fin-org-menu input.dg-fin-org-cb");
    if (orgBoxes.length) {
      var picked = [];
      orgBoxes.forEach(function (cb) {
        if (cb.checked) picked.push(String(cb.value || "").trim());
      });
      state.pending.org = normalizeOrgs(picked);
    } else {
      state.pending.org = normalizeOrgs(state.pending.org);
    }
    state.pending.date_from = String((el("dg-fin-date-from") && el("dg-fin-date-from").value) || "");
    state.pending.date_to = String((el("dg-fin-date-to") && el("dg-fin-date-to").value) || "");
    state.pending.direction = String((el("dg-fin-direction") && el("dg-fin-direction").value) || "");
    var src = String((el("dg-fin-source") && el("dg-fin-source").value) || "all").toLowerCase();
    state.pending.source = src === "bank" || src === "cash" ? src : "all";
    state.pending.account_id = String((el("dg-fin-account") && el("dg-fin-account").value) || "");
    state.pending.page_size = parseInt(String((el("dg-fin-page-size") && el("dg-fin-page-size").value) || "100"), 10) || 100;
    state.pending.sync_days = parseInt(String((el("dg-fin-sync-days") && el("dg-fin-sync-days").value) || "30"), 10) || 30;
    state.pending.include_internal = !!(el("dg-fin-include-internal") && el("dg-fin-include-internal").checked);
    state.pending.founder_only = !!(el("dg-fin-founder-only") && el("dg-fin-founder-only").checked);
    state.pending.dividend_only = !!(el("dg-fin-dividend-only") && el("dg-fin-dividend-only").checked);
    state.pending.exclude_chart_inn = !!(el("dg-fin-exclude-chart-inn") && el("dg-fin-exclude-chart-inn").checked);
  }
  function writeFormFromPending() {
    if (el("dg-fin-search")) el("dg-fin-search").value = state.pending.search;
    if (el("dg-fin-table-search-mirror")) el("dg-fin-table-search-mirror").value = state.pending.search;
    syncOrgChecksFromPending();
    if (el("dg-fin-date-from")) el("dg-fin-date-from").value = state.pending.date_from;
    if (el("dg-fin-date-to")) el("dg-fin-date-to").value = state.pending.date_to;
    if (el("dg-fin-direction")) el("dg-fin-direction").value = state.pending.direction;
    if (el("dg-fin-source")) el("dg-fin-source").value = state.pending.source === "bank" || state.pending.source === "cash" ? state.pending.source : "all";
    if (el("dg-fin-account")) el("dg-fin-account").value = state.pending.account_id;
    if (el("dg-fin-page-size")) el("dg-fin-page-size").value = String(state.pending.page_size);
    if (el("dg-fin-page-size-foot")) el("dg-fin-page-size-foot").value = String(state.pending.page_size);
    if (el("dg-fin-sync-days")) el("dg-fin-sync-days").value = String(state.pending.sync_days);
    if (el("dg-fin-include-internal")) el("dg-fin-include-internal").checked = !!state.pending.include_internal;
    if (el("dg-fin-founder-only")) el("dg-fin-founder-only").checked = !!state.pending.founder_only;
    if (el("dg-fin-dividend-only")) el("dg-fin-dividend-only").checked = !!state.pending.dividend_only;
    if (el("dg-fin-exclude-chart-inn")) el("dg-fin-exclude-chart-inn").checked = !!state.pending.exclude_chart_inn;
    if (el("dg-fin-analytics-deposits")) el("dg-fin-analytics-deposits").checked = !!state.pending.include_internal;
    markDirty();
  }
  function markDirty() {
    var btn = el("dg-fin-apply");
    if (!btn) return;
    var dirty =
      state.pending.search !== state.applied.search ||
      orgsKey(state.pending.org) !== orgsKey(state.applied.org) ||
      state.pending.date_from !== state.applied.date_from ||
      state.pending.date_to !== state.applied.date_to ||
      state.pending.direction !== state.applied.direction ||
      String(state.pending.source || "all") !== String(state.applied.source || "all") ||
      state.pending.account_id !== state.applied.account_id ||
      Number(state.pending.page_size) !== Number(state.applied.page_size) ||
      !!state.pending.include_internal !== !!state.applied.include_internal ||
      !!state.pending.founder_only !== !!state.applied.founder_only ||
      !!state.pending.dividend_only !== !!state.applied.dividend_only ||
      !!state.pending.exclude_chart_inn !== !!state.applied.exclude_chart_inn;
    btn.classList.toggle("dg-flt-dirty", dirty);
    btn.textContent = dirty ? "Применить •" : "Применить";
  }

  var URL_FILTER_KEYS = [
    "search",
    "q",
    "org",
    "customer_code",
    "customer_codes",
    "date_from",
    "date_to",
    "direction",
    "source",
    "account_id",
    "page_size",
    "limit",
    "page",
    "sync_days",
    "include_internal",
    "include_deposits",
    "founder_capital",
    "founder_only",
    "dividend",
    "dividend_only",
    "exclude_chart_inn",
    "sort",
    "sort_key",
    "sort_dir",
  ];
  var urlSyncTimer = null;

  function truthyUrlFlag(v) {
    return ["1", "true", "yes", "on"].indexOf(String(v == null ? "" : v).trim().toLowerCase()) >= 0;
  }

  function parseUrlIntoPending() {
    var p;
    try {
      p = new URLSearchParams(window.location.search);
    } catch (e) {
      return false;
    }
    var touched = false;
    if (p.has("search") || p.has("q")) {
      state.pending.search = String(p.get("search") || p.get("q") || "").trim();
      touched = true;
    }
    var orgBits = [];
    p.getAll("customer_code").forEach(function (x) {
      orgBits.push(x);
    });
    p.getAll("org").forEach(function (x) {
      orgBits.push(x);
    });
    if (p.has("customer_codes")) orgBits.push(p.get("customer_codes"));
    if (orgBits.length) {
      state.pending.org = normalizeOrgs(orgBits);
      touched = true;
    }
    if (p.has("date_from")) {
      state.pending.date_from = String(p.get("date_from") || "").trim();
      touched = true;
    }
    if (p.has("date_to")) {
      state.pending.date_to = String(p.get("date_to") || "").trim();
      touched = true;
    }
    if (p.has("direction")) {
      var dir = String(p.get("direction") || "").trim().toLowerCase();
      state.pending.direction = dir === "in" || dir === "out" ? dir : "";
      touched = true;
    }
    if (p.has("source")) {
      var srcUrl = String(p.get("source") || "").trim().toLowerCase();
      state.pending.source = srcUrl === "bank" || srcUrl === "cash" ? srcUrl : "all";
      touched = true;
    }
    if (p.has("account_id")) {
      state.pending.account_id = String(p.get("account_id") || "").trim();
      touched = true;
    }
    if (p.has("page_size") || p.has("limit")) {
      var ps = parseInt(String(p.get("page_size") || p.get("limit") || "100"), 10);
      if ([50, 100, 200].indexOf(ps) >= 0) state.pending.page_size = ps;
      touched = true;
    }
    if (p.has("sync_days")) {
      var sd = parseInt(String(p.get("sync_days") || "30"), 10);
      if (Number.isFinite(sd) && sd > 0) state.pending.sync_days = sd;
      touched = true;
    }
    if (p.has("include_internal") || p.has("include_deposits")) {
      state.pending.include_internal = truthyUrlFlag(
        p.get("include_internal") != null ? p.get("include_internal") : p.get("include_deposits")
      );
      touched = true;
    }
    if (p.has("founder_capital") || p.has("founder_only")) {
      state.pending.founder_only = truthyUrlFlag(
        p.get("founder_capital") != null ? p.get("founder_capital") : p.get("founder_only")
      );
      touched = true;
    }
    if (p.has("dividend") || p.has("dividend_only")) {
      state.pending.dividend_only = truthyUrlFlag(
        p.get("dividend") != null ? p.get("dividend") : p.get("dividend_only")
      );
      touched = true;
    }
    if (p.has("exclude_chart_inn")) {
      state.pending.exclude_chart_inn = truthyUrlFlag(p.get("exclude_chart_inn"));
      touched = true;
    }
    if (p.has("page")) {
      var pg = parseInt(String(p.get("page") || "1"), 10);
      if (Number.isFinite(pg) && pg > 0) state.page = pg;
      touched = true;
    }
    if (p.has("sort") || p.has("sort_key")) {
      var sk = String(p.get("sort") || p.get("sort_key") || "").trim();
      if (sk) state.sortKey = sk;
      touched = true;
    }
    if (p.has("sort_dir")) {
      var sdir = String(p.get("sort_dir") || "").trim().toLowerCase();
      if (sdir === "asc" || sdir === "desc") state.sortDir = sdir;
      touched = true;
    }
    return touched;
  }

  function syncUrlFromApplied() {
    var keep = new URLSearchParams();
    try {
      var cur = new URLSearchParams(window.location.search);
      cur.forEach(function (v, k) {
        if (URL_FILTER_KEYS.indexOf(k) >= 0) return;
        keep.append(k, v);
      });
    } catch (e) {}
    var a = state.applied || {};
    if (a.search) keep.set("search", String(a.search));
    normalizeOrgs(a.org).forEach(function (c) {
      keep.append("customer_code", c);
    });
    if (a.date_from) keep.set("date_from", String(a.date_from));
    if (a.date_to) keep.set("date_to", String(a.date_to));
    if (a.direction) keep.set("direction", String(a.direction));
    if (a.source && a.source !== "all") keep.set("source", String(a.source));
    if (a.account_id) keep.set("account_id", String(a.account_id));
    if (Number(a.page_size) && Number(a.page_size) !== 100) keep.set("page_size", String(a.page_size));
    if (Number(a.sync_days) && Number(a.sync_days) !== 30) keep.set("sync_days", String(a.sync_days));
    if (a.include_internal) keep.set("include_internal", "1");
    if (a.founder_only) keep.set("founder_capital", "1");
    if (a.dividend_only) keep.set("dividend", "1");
    // По умолчанию исключение ИНН включено — в URL пишем только выключение.
    if (a.exclude_chart_inn === false) keep.set("exclude_chart_inn", "0");
    if (Number(state.page) > 1) keep.set("page", String(state.page));
    if (state.sortKey && state.sortKey !== "booked_date") keep.set("sort", String(state.sortKey));
    if (state.sortDir && state.sortDir !== "desc") keep.set("sort_dir", String(state.sortDir));
    var qs = keep.toString();
    var next = window.location.pathname + (qs ? "?" + qs : "") + (window.location.hash || "");
    try {
      if (next !== window.location.pathname + window.location.search + window.location.hash) {
        window.history.replaceState(null, "", next);
      }
    } catch (e2) {}
  }

  function scheduleUrlSync() {
    if (urlSyncTimer) clearTimeout(urlSyncTimer);
    urlSyncTimer = setTimeout(function () {
      urlSyncTimer = null;
      syncUrlFromApplied();
    }, 150);
  }

  function commitFilters() {
    readPendingFromForm();
    // если счёт не из выбранной орг — сбросить
    var orgs = normalizeOrgs(state.pending.org);
    if (orgs.length && state.pending.account_id) {
      var ok = (state.accounts || []).some(function (a) {
        return a.account_id === state.pending.account_id && orgs.indexOf(String(a.customer_code || "")) >= 0;
      });
      if (!ok) state.pending.account_id = "";
    }
    state.applied = Object.assign({}, state.pending);
    writeFormFromPending();
    state.page = 1;
    try { localStorage.setItem(ANALYTICS_DEPOSITS_KEY, state.applied.include_internal ? "1" : "0"); } catch (e) {}
    markDirty();
    renderBalances();
    fillAccountSelect();
    loadTx();
    loadMonthlyAnalytics();
    loadCounterparties();
    scheduleUrlSync();
  }

  function fmtMonthLabel(ym) {
    var s = String(ym || "");
    var p = s.split("-");
    if (p.length !== 2) return s;
    var months = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
    var mIdx = Math.max(0, Math.min(11, Number(p[1]) - 1));
    return months[mIdx] + " " + String(p[0]).slice(2);
  }

  function moscowNowParts() {
    try {
      var parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Moscow",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).formatToParts(new Date());
      var y = "";
      var m = "";
      var d = "";
      parts.forEach(function (p) {
        if (p.type === "year") y = p.value;
        if (p.type === "month") m = p.value;
        if (p.type === "day") d = p.value;
      });
      if (y && m && d) return { y: Number(y), m: m, d: d, ymd: y + "-" + m + "-" + d };
    } catch (e) {}
    var now = new Date();
    var yy = now.getFullYear();
    var mm = String(now.getMonth() + 1).padStart(2, "0");
    var dd = String(now.getDate()).padStart(2, "0");
    return { y: yy, m: mm, d: dd, ymd: yy + "-" + mm + "-" + dd };
  }
  function readAnalyticsPeriod() {
    var sel = el("dg-fin-analytics-months");
    var raw = sel ? String(sel.value || "12") : String(state.analyticsMonths || 12);
    if (raw !== "6" && raw !== "12" && raw !== "24" && raw !== "y0" && raw !== "y-1") raw = "12";
    state.analyticsMonths = raw;
    try { localStorage.setItem(ANALYTICS_MONTHS_KEY, raw); } catch (e) {}
    var now = moscowNowParts();
    if (raw === "y0") {
      return { key: raw, date_from: now.y + "-01-01", date_to: now.ymd };
    }
    if (raw === "y-1") {
      var y = now.y - 1;
      return { key: raw, date_from: y + "-01-01", date_to: y + "-12-31" };
    }
    return { key: raw, months: parseInt(raw, 10) };
  }
  function applyAnalyticsPeriodQuery(q, forCounterparties) {
    var per = readAnalyticsPeriod();
    if (forCounterparties && state.applied.date_from && state.applied.date_to) {
      q.set("date_from", state.applied.date_from);
      q.set("date_to", state.applied.date_to);
      return per;
    }
    if (per.date_from && per.date_to) {
      q.set("date_from", per.date_from);
      q.set("date_to", per.date_to);
    } else {
      q.set("months", String(per.months || 12));
    }
    return per;
  }
  function currentAnalyticsYm() {
    var p = moscowNowParts();
    return p.y + "-" + p.m;
  }

  function completedNetSeries(series) {
    var curYm = currentAnalyticsYm();
    return (Array.isArray(series) ? series : []).filter(function (r) {
      var ym = String((r && r.month) || "").slice(0, 7);
      return /^\d{4}-\d{2}$/.test(ym) && ym < curYm;
    });
  }

  function avgNetFromSeries(rows) {
    if (!rows.length) return 0;
    var sum = 0;
    rows.forEach(function (r) { sum += Number(r.net) || 0; });
    return sum / rows.length;
  }

  function netDynamics(rows) {
    if (!rows || rows.length < 2) return null;
    var n = rows.length;
    var last = rows[n - 1];
    var prev = rows[n - 2];
    var recent = Number(last.net) || 0;
    var base = Number(prev.net) || 0;
    var delta = recent - base;
    var usePct = Math.abs(base) >= 100000;
    var pct = usePct ? (delta / Math.abs(base)) * 100 : null;
    var dir = delta > 0.5 ? "up" : delta < -0.5 ? "down" : "flat";
    return {
      recent: recent,
      base: base,
      delta: delta,
      pct: pct,
      dir: dir,
      label: fmtMonthLabel(last.month) + " к " + fmtMonthLabel(prev.month),
    };
  }

  function renderAnalyticsKpis(totals, currency, series) {
    var box = el("dg-fin-analytics-kpis");
    if (!box) return;
    var t = totals || {};
    var cur = currency || "RUB";
    var net = Number(t.net) || 0;
    var done = completedNetSeries(series);
    var avg = avgNetFromSeries(done);
    var dyn = netDynamics(done);
    var avgTxt = done.length
      ? "ср. " + fmtMoney(avg, cur) + " / мес."
      : "вход − исход";
    var dynHtml = "";
    if (dyn) {
      var arrow = dyn.dir === "up" ? "↑" : dyn.dir === "down" ? "↓" : "→";
      var word = dyn.dir === "up" ? "растёт" : dyn.dir === "down" ? "снижается" : "стабильно";
      var mag =
        dyn.pct != null && Number.isFinite(dyn.pct)
          ? (dyn.pct > 0 ? "+" : "") + (Math.round(dyn.pct * 10) / 10) + "%"
          : (dyn.delta >= 0 ? "+" : "") + fmtMoney(dyn.delta, cur);
      dynHtml =
        '<div class="dg-fin-kpi-dyn is-' +
        dyn.dir +
        '" title="' +
        esc(dyn.label) +
        '">' +
        esc(arrow + " " + word + " · " + mag) +
        '<span class="dg-fin-kpi-dyn-hint"> ' +
        esc(dyn.label) +
        "</span></div>";
    }
    box.innerHTML =
      '<div class="dg-fin-kpi is-in"><div class="dg-fin-kpi-label">Входящие</div><div class="dg-fin-kpi-value">' +
      esc(fmtMoney(t.in, cur)) +
      '</div><div class="dg-fin-kpi-sub">поступления</div></div>' +
      '<div class="dg-fin-kpi is-out"><div class="dg-fin-kpi-label">Исходящие</div><div class="dg-fin-kpi-value">' +
      esc(fmtMoney(t.out, cur)) +
      '</div><div class="dg-fin-kpi-sub">списания</div></div>' +
      '<div class="dg-fin-kpi is-net"><div class="dg-fin-kpi-label">Чистый поток</div><div class="dg-fin-kpi-value ' +
      (net >= 0 ? "is-pos" : "is-neg") +
      '">' +
      esc(fmtMoney(net, cur)) +
      '</div><div class="dg-fin-kpi-sub">' +
      esc(avgTxt) +
      (done.length ? " · полные мес." : "") +
      "</div>" +
      dynHtml +
      "</div>" +
      '<div class="dg-fin-kpi"><div class="dg-fin-kpi-label">Операций</div><div class="dg-fin-kpi-value">' +
      esc(String(Number(t.count) || 0)) +
      '</div><div class="dg-fin-kpi-sub">в снимке за период</div></div>';
  }

  function monthBounds(ym) {
    var s = String(ym || "");
    var p = s.split("-");
    if (p.length !== 2) return null;
    var y = parseInt(p[0], 10);
    var m = parseInt(p[1], 10);
    if (!y || !m || m < 1 || m > 12) return null;
    var lastDay = new Date(y, m, 0).getDate();
    var mm = String(m).padStart(2, "0");
    return {
      from: y + "-" + mm + "-01",
      to: y + "-" + mm + "-" + String(lastDay).padStart(2, "0"),
      label: fmtMonthLabel(s),
    };
  }

  function applyChartMonthToFilters(ym, directionHint) {
    var bounds = monthBounds(ym);
    if (!bounds) return;
    readPendingFromForm();
    state.pending.date_from = bounds.from;
    state.pending.date_to = bounds.to;
    if (directionHint === "in" || directionHint === "out") {
      state.pending.direction = directionHint;
    }
    writeFormFromPending();
    markDirty();
    var dirTxt =
      directionHint === "in" ? " · входящие" : directionHint === "out" ? " · исходящие" : "";
    toast(
      "info",
      "Фильтр дат: " + bounds.from + " → " + bounds.to + dirTxt + ". Нажмите «Применить»."
    );
    var filtersBody = el("dg-fin-filters-body");
    if (filtersBody && filtersBody.style.display === "none") {
      var tgl = el("dg-fin-filters-toggle");
      if (tgl) tgl.click();
    }
    var fromEl = el("dg-fin-date-from");
    if (fromEl && fromEl.scrollIntoView) {
      try {
        fromEl.scrollIntoView({ behavior: "smooth", block: "center" });
      } catch (e) {
        fromEl.scrollIntoView(true);
      }
    }
  }

  function renderMonthlyChart(series, currency) {
    var canvas = el("dg-fin-analytics-chart");
    var emptyEl = el("dg-fin-analytics-empty");
    if (!canvas) return;
    var rows = Array.isArray(series) ? series : [];
    var hasAny = rows.some(function (r) {
      return Number(r.in) > 0 || Number(r.out) > 0;
    });
    if (!hasAny) {
      if (monthlyChart) {
        try { monthlyChart.destroy(); } catch (e) {}
        monthlyChart = null;
      }
      canvas.style.display = "none";
      if (emptyEl) emptyEl.classList.remove("d-none");
      return;
    }
    canvas.style.display = "";
    if (emptyEl) emptyEl.classList.add("d-none");

    var labels = rows.map(function (r) { return fmtMonthLabel(r.month); });
    var inVals = rows.map(function (r) { return Number(r.in) || 0; });
    var outVals = rows.map(function (r) { return Number(r.out) || 0; });
    var netVals = rows.map(function (r) { return Number(r.net) || 0; });
    var cur = currency || "RUB";

    loadChartJs()
      .then(function (Chart) {
        if (monthlyChart) {
          try { monthlyChart.destroy(); } catch (e) {}
          monthlyChart = null;
        }
        var ctx = canvas.getContext("2d");
        var gradIn = ctx.createLinearGradient(0, 0, 0, 260);
        gradIn.addColorStop(0, "rgba(34, 197, 94, 0.85)");
        gradIn.addColorStop(1, "rgba(34, 197, 94, 0.35)");
        var gradOut = ctx.createLinearGradient(0, 0, 0, 260);
        gradOut.addColorStop(0, "rgba(239, 68, 68, 0.8)");
        gradOut.addColorStop(1, "rgba(239, 68, 68, 0.32)");

        monthlyChart = new Chart(ctx, {
          type: "bar",
          data: {
            labels: labels,
            datasets: [
              {
                type: "bar",
                label: "Входящие",
                data: inVals,
                backgroundColor: gradIn,
                borderColor: "rgba(22, 163, 74, 1)",
                borderWidth: 1,
                borderRadius: 6,
                maxBarThickness: 22,
                order: 2,
              },
              {
                type: "bar",
                label: "Исходящие",
                data: outVals,
                backgroundColor: gradOut,
                borderColor: "rgba(185, 28, 28, 1)",
                borderWidth: 1,
                borderRadius: 6,
                maxBarThickness: 22,
                order: 2,
              },
              {
                type: "line",
                label: "Чистый поток",
                data: netVals,
                borderColor: "#3f6ad8",
                backgroundColor: "rgba(63, 106, 216, 0.12)",
                borderWidth: 2.5,
                pointRadius: 3.5,
                pointHoverRadius: 5,
                pointBackgroundColor: "#fff",
                pointBorderColor: "#3f6ad8",
                pointBorderWidth: 2,
                tension: 0.35,
                yAxisID: "y",
                order: 1,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            onHover: function (evt, elements) {
              var t = evt && evt.native && evt.native.target;
              if (t && t.style) t.style.cursor = elements && elements.length ? "pointer" : "default";
            },
            onClick: function (evt) {
              var chart = this;
              var pts =
                chart.getElementsAtEventForMode(evt, "nearest", { intersect: true }, true) || [];
              if (!pts.length) {
                pts =
                  chart.getElementsAtEventForMode(evt, "index", { intersect: false }, true) || [];
              }
              if (!pts.length) return;
              var hit = pts[0];
              for (var pi = 0; pi < pts.length; pi++) {
                if (pts[pi].datasetIndex === 0 || pts[pi].datasetIndex === 1) {
                  hit = pts[pi];
                  break;
                }
              }
              var idx = hit.index;
              var src = rows[idx];
              if (!src || !src.month) return;
              var ds = hit.datasetIndex;
              var dirHint = "";
              if (ds === 0) dirHint = "in";
              else if (ds === 1) dirHint = "out";
              applyChartMonthToFilters(src.month, dirHint);
            },
            plugins: {
              legend: {
                position: "top",
                align: "end",
                labels: { boxWidth: 12, boxHeight: 12, usePointStyle: true, font: { size: 12 } },
              },
              tooltip: {
                callbacks: {
                  label: function (ctx2) {
                    var v = Number(ctx2.parsed.y || 0);
                    return ctx2.dataset.label + ": " + fmtMoney(v, cur);
                  },
                  afterBody: function (items) {
                    var idx = items && items[0] ? items[0].dataIndex : -1;
                    var src = rows[idx] || {};
                    return [
                      "Операций в: " + (Number(src.count_in) || 0),
                      "Операций исх.: " + (Number(src.count_out) || 0),
                      "Клик — даты месяца в фильтр",
                    ];
                  },
                },
              },
            },
            scales: {
              x: {
                ticks: { font: { size: 11 }, color: "#64748b" },
                grid: { display: false },
              },
              y: {
                beginAtZero: true,
                ticks: {
                  font: { size: 11 },
                  color: "#64748b",
                  callback: function (v) {
                    var n = Number(v);
                    if (Math.abs(n) >= 1000000) return (n / 1000000).toLocaleString("ru-RU", { maximumFractionDigits: 1 }) + " млн";
                    if (Math.abs(n) >= 1000) return (n / 1000).toLocaleString("ru-RU", { maximumFractionDigits: 0 }) + " тыс";
                    return n.toLocaleString("ru-RU");
                  },
                },
                grid: { color: "rgba(15, 23, 42, 0.06)" },
              },
            },
          },
        });
      })
      .catch(function (e) {
        canvas.style.display = "none";
        if (emptyEl) {
          emptyEl.classList.remove("d-none");
          emptyEl.textContent = "График недоступен: " + (e && e.message ? e.message : e);
        }
      });
  }

  function loadMonthlyAnalytics() {
    var seq = ++analyticsLoadSeq;
    var scope = el("dg-fin-analytics-scope");
    var org = normalizeOrgs(state.applied.org);
    var acc = state.applied.account_id;
    if (scope) {
      var bits = [];
      if (org.length) bits.push(org.map(function (c) { return orgLabelByCode(c) || c; }).join(", "));
      if (acc) {
        var a = (state.accounts || []).find(function (x) { return x.account_id === acc; });
        bits.push(a ? accountDisplayName(a) : maskAcc(acc));
      }
      scope.textContent = bits.length ? bits.join(" · ") : "Все организации";
    }
    var q = new URLSearchParams();
    applyAnalyticsPeriodQuery(q, false);
    appendOrgQuery(q, org);
    if (acc) q.set("account_id", acc);
    if (state.applied.include_internal) q.set("include_internal", "1");
    if (state.applied.source && state.applied.source !== "all") q.set("source", String(state.applied.source));
    q.set("exclude_chart_inn", state.applied.exclude_chart_inn ? "1" : "0");
    return fetch("/api/finance/analytics/monthly?" + q.toString(), { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (seq !== analyticsLoadSeq) return null;
        if (!j || !j.success) throw new Error((j && j.error) || "analytics");
        renderAnalyticsKpis(j.totals, j.currency, j.series || []);
        renderMonthlyChart(j.series || [], j.currency);
        return j;
      })
      .catch(function (e) {
        if (seq !== analyticsLoadSeq) return null;
        var emptyEl = el("dg-fin-analytics-empty");
        var canvas = el("dg-fin-analytics-chart");
        if (canvas) canvas.style.display = "none";
        if (emptyEl) {
          emptyEl.classList.remove("d-none");
          emptyEl.textContent = "Не удалось загрузить аналитику: " + (e.message || String(e));
        }
      });
  }

  function readCpLimit() {
    var sel = el("dg-fin-cp-limit");
    var n = sel ? parseInt(String(sel.value || "8"), 10) : 8;
    if (![5, 8, 12].includes(n)) n = 8;
    try { localStorage.setItem(CP_LIMIT_KEY, String(n)); } catch (e) {}
    return n;
  }

  function cpInitials(name) {
    var parts = String(name || "")
      .replace(/[«»"']/g, "")
      .trim()
      .split(/\s+/)
      .filter(Boolean);
    if (!parts.length) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
  }

  function applyCounterpartyToFilters(name, direction, inn) {
    var n = String(name || "").trim();
    var innStr = String(inn || "").replace(/\s+/g, "").trim();
    // По ИНН ловим все варианты названия одной конторы в выписке.
    var q = innStr || (n && n !== "(без названия)" ? n : "");
    if (!q) return;
    readPendingFromForm();
    state.pending.search = q;
    if (direction === "in" || direction === "out") state.pending.direction = direction;
    writeFormFromPending();
    markDirty();
    toast(
      "info",
      "Фильтр: «" +
        (innStr ? "ИНН " + innStr : n) +
        "»" +
        (direction === "in" ? " · входящие" : direction === "out" ? " · исходящие" : "") +
        ". Нажмите «Применить»."
    );
    var filtersBody = el("dg-fin-filters-body");
    if (filtersBody && filtersBody.style.display === "none") {
      var tgl = el("dg-fin-filters-toggle");
      if (tgl) tgl.click();
    }
  }

  function renderCpList(listEl, rows, direction, currency) {
    if (!listEl) return;
    var items = Array.isArray(rows) ? rows : [];
    if (!items.length) {
      listEl.innerHTML = '<div class="dg-fin-cp-empty">Нет данных за период</div>';
      return;
    }
    var maxAmt = Math.max.apply(
      null,
      items.map(function (r) { return Number(r.amount) || 0; }).concat([1])
    );
    listEl.innerHTML = items
      .map(function (r) {
        var amt = Number(r.amount) || 0;
        var pct = Math.max(4, Math.round((amt / maxAmt) * 100));
        var rank = Number(r.rank) || 0;
        var topCls = rank === 1 ? " is-top1" : rank === 2 ? " is-top2" : rank === 3 ? " is-top3" : "";
        var inn = r.inn ? "ИНН " + r.inn : "без ИНН";
        var cnt = Number(r.count) || 0;
        var share = r.share != null ? String(r.share).replace(".", ",") + "%" : "";
        return (
          '<button type="button" class="dg-fin-cp-row' +
          topCls +
          '" data-dg-cp-name="' +
          esc(r.name) +
          '" data-dg-cp-inn="' +
          esc(r.inn || "") +
          '" data-dg-cp-dir="' +
          esc(direction) +
          '" data-dg-notify-start="Подставляем контрагента в фильтр…">' +
          '<span class="dg-fin-cp-rank">' +
          esc(String(rank)) +
          "</span>" +
          '<span class="dg-fin-cp-avatar" aria-hidden="true">' +
          esc(cpInitials(r.name)) +
          "</span>" +
          '<span class="dg-fin-cp-meta">' +
          '<div class="dg-fin-cp-name" title="' +
          esc(r.name) +
          '">' +
          esc(r.name) +
          "</div>" +
          '<div class="dg-fin-cp-sub">' +
          esc(inn) +
          " · " +
          esc(String(cnt)) +
          " оп.</div>" +
          "</span>" +
          '<span class="dg-fin-cp-right">' +
          '<div class="dg-fin-cp-amount">' +
          esc(fmtMoney(amt, currency)) +
          "</div>" +
          '<div class="dg-fin-cp-bar"><span style="width:' +
          pct +
          '%"></span></div>' +
          (share
            ? '<div class="dg-fin-cp-share">' + esc(share) + " от суммы</div>"
            : "") +
          "</span>" +
          "</button>"
        );
      })
      .join("");
  }

  function loadCounterparties() {
    var seq = ++cpLoadSeq;
    var limit = readCpLimit();
    var org = normalizeOrgs(state.applied.org);
    var acc = state.applied.account_id;
    var scope = el("dg-fin-cp-scope");
    var q = new URLSearchParams();
    q.set("limit", String(limit));
    applyAnalyticsPeriodQuery(q, true);
    appendOrgQuery(q, org);
    if (acc) q.set("account_id", acc);
    if (state.applied.include_internal) q.set("include_internal", "1");
    if (state.applied.source && state.applied.source !== "all") q.set("source", String(state.applied.source));
    q.set("exclude_chart_inn", state.applied.exclude_chart_inn !== false ? "1" : "0");

    return fetch("/api/finance/analytics/counterparties?" + q.toString(), { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (seq !== cpLoadSeq) return null;
        if (!j || !j.success) throw new Error((j && j.error) || "counterparties");
        var cur = j.currency || "RUB";
        if (scope) {
          var bits = [];
          if (j.date_from && j.date_to) bits.push(j.date_from + " → " + j.date_to);
          if (org.length) bits.push(org.map(function (c) { return orgLabelByCode(c) || c; }).join(", "));
          scope.textContent = bits.length ? bits.join(" · ") : "все организации";
        }
        var tot = j.totals || {};
        var inTotal = el("dg-fin-cp-in-total");
        var outTotal = el("dg-fin-cp-out-total");
        if (inTotal) {
          inTotal.innerHTML =
            esc(fmtMoney(tot.in, cur)) +
            '<div class="dg-fin-cp-share">' +
            esc(String(tot.counterparties_in || 0)) +
            " контрагентов</div>";
        }
        if (outTotal) {
          outTotal.innerHTML =
            esc(fmtMoney(tot.out, cur)) +
            '<div class="dg-fin-cp-share">' +
            esc(String(tot.counterparties_out || 0)) +
            " контрагентов</div>";
        }
        renderCpList(el("dg-fin-cp-in-list"), j.top_in || [], "in", cur);
        renderCpList(el("dg-fin-cp-out-list"), j.top_out || [], "out", cur);
        return j;
      })
      .catch(function (e) {
        if (seq !== cpLoadSeq) return null;
        if (scope) scope.textContent = "ошибка загрузки";
        renderCpList(el("dg-fin-cp-in-list"), [], "in", "RUB");
        renderCpList(el("dg-fin-cp-out-list"), [], "out", "RUB");
        var inL = el("dg-fin-cp-in-list");
        if (inL) {
          inL.innerHTML =
            '<div class="dg-fin-cp-empty">Не удалось загрузить: ' +
            esc(e && e.message ? e.message : e) +
            "</div>";
        }
      });
  }

  function bindCollapse(btnId, bodyId, storageKey) {
    var btn = el(btnId);
    var body = el(bodyId);
    if (!btn || !body) return;
    function apply() {
      var c = false;
      try { c = localStorage.getItem(storageKey) === "1"; } catch (e) {}
      body.style.display = c ? "none" : "";
      btn.textContent = c ? "Развернуть" : "Свернуть";
    }
    btn.addEventListener("click", function () {
      var nowHidden = body.style.display === "none";
      try { localStorage.setItem(storageKey, nowHidden ? "0" : "1"); } catch (e) {}
      apply();
    });
    apply();
  }

  function bindHeaderSearchMirror() {
    var a = el("dg-fin-search");
    var b = el("dg-fin-table-search-mirror");
    if (!a || !b) return;
    var syncing = false;
    function sync(from, to) {
      if (syncing) return;
      syncing = true;
      to.value = from.value;
      syncing = false;
      readPendingFromForm();
      markDirty();
    }
    a.addEventListener("input", function () { sync(a, b); });
    b.addEventListener("input", function () { sync(b, a); });
    function onEnter(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        var btn = el("dg-fin-apply");
        if (btn) btn.click();
      }
      if (e.key === "Escape") {
        a.value = "";

  function renderColumnControls() {

  function buildThead() {
    var thead = el("dg-fin-thead");
    var cg = el("dg-fin-colgroup");
    if (!thead) return;
    var cols = FIN_COLS.filter(function (c) { return visibleCols.indexOf(c[0]) >= 0; });
    if (cg) {
      cg.innerHTML = cols.map(function (c) {
        var w = colWidths[c[0]] || DEFAULT_WIDTHS[c[0]] || 140;
        return '<col style="width:' + w + 'px;min-width:' + w + 'px">';
      }).join("");
    }
    thead.innerHTML = "<tr>" + cols.map(function (c) {
      var key = c[0];
      var mark = "";
      var aria = "none";
      if (state.sortKey === key) {
        mark = state.sortDir === "asc" ? " ↑" : " ↓";
        aria = state.sortDir === "asc" ? "ascending" : "descending";
      }
      return (
        '<th class="dg-fin-sortable" data-fin-sort="' +
        esc(key) +
        '" aria-sort="' +
        aria +
        '" title="Сортировка по всей выборке (не только текущая страница)">' +
        esc(c[1]) +
        '<span class="dg-fin-sort-mark text-muted">' +
        mark +
        "</span></th>"
      );
    }).join("") + "</tr>";
    if (!thead.getAttribute("data-fin-sort-bound")) {
      thead.setAttribute("data-fin-sort-bound", "1");
      thead.addEventListener("click", function (ev) {
        var th = ev.target && ev.target.closest ? ev.target.closest("th.dg-fin-sortable") : null;
        if (!th || !thead.contains(th)) return;
        if (hasTextSelection()) return;
        var k = th.getAttribute("data-fin-sort");
        if (!k) return;
        if (state.sortKey === k) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        else {
          state.sortKey = k;
          // Дата по умолчанию от новых к старым; остальные колонки — по возрастанию.
          state.sortDir = k === "booked_date" || k === "amount" ? "desc" : "asc";
        }
        state.page = 1;
        buildThead();
        loadTx();
        scheduleUrlSync();
      });
    }
  }

  function rowOrgLabel(row) {

  function renderCell(row, key) {

      if (isCashRow(row)) {

        }

      if (row.chart_excluded) {

          ? "капитал/займ учредителей"
          : row.chart_tag === "dividend" || row.chart_exclude_reason === "дивиденды"
            ? "выплата дивидендов"
            : row.chart_exclude_reason || "внутр.";
        var extraCls = row.founder_capital
          ? " is-founder"
          : row.chart_tag === "dividend" || row.chart_exclude_reason === "дивиденды"
            ? " is-dividend"
            : "";
        return (
          esc(dirTxt) +
          ' <span class="dg-fin-chart-excl-dot' +

    if (key === "bank") {

    if (key === "booked_date") {

  function renderTable() {

  var BANK_LABELS = { tochka: "Точка", raiffeisen: "Райффайзен", tbank: "Т‑Банк", cash: "Наличные" };

  function accountAvailable(a) {
    var n = a && a.available != null ? Number(a.available) : Number(a && a.balance);
    return Number.isFinite(n) ? n : null;
  }
  function accountBlocked(a) {
    var n = a && a.blocked != null ? Number(a.blocked) : null;
    return Number.isFinite(n) ? n : null;
  }
  function sumByCurrency(list, pick) {
    var map = Object.create(null);
    (list || []).forEach(function (a) {
      var n = pick(a);
      if (n == null) return;
      var cur = normalizeCurrency(a.currency);
      map[cur] = (map[cur] || 0) + n;
    });
    return map;
  }
  function moneyMapLines(map) {
    return Object.keys(map)
      .sort(function (a, b) {
        if (a === "RUB") return -1;
        if (b === "RUB") return 1;
        return a.localeCompare(b);
      })
      .map(function (cur) {
        return { currency: cur, amount: map[cur] };
      });
  }
  function formatMoneyList(lines) {
    if (!lines.length) return "—";
    return lines.map(function (x) { return fmtMoney(x.amount, x.currency); }).join(" · ");
  }
  function latestSyncedAt(list) {
    var best = null;
    (list || []).forEach(function (a) {
      if (!a || !a.synced_at) return;
      var t = String(a.synced_at);
      if (!best || t > best) best = t;
    });
    return best;
  }
  function groupAccountsByBank(list) {
    var order = [];
    var map = Object.create(null);
    (list || []).forEach(function (a) {
      var bankCode = String((a && a.bank) || "tochka").toLowerCase();
      var bankLabel = BANK_LABELS[bankCode] || "Точка";
      var org = String((a && a.org_label) || "").trim();
      var customer = String((a && a.customer_code) || "").trim();
      // Юрлицо (customer_code), а не JWT: один ключ может покрывать Прайм + Вилмед
      var key = bankCode + "|" + (customer || org || String((a && a.credential_id) || "").trim() || "unknown");
      if (!map[key]) {
        map[key] = {
          key: key,
          bank_code: bankCode,
          bank_label: bankLabel,
          org_label: org || "Организация",
          customer_code: customer,
          credential_id: String((a && a.credential_id) || "").trim(),
          accounts: [],
        };
        order.push(key);
      }
      if (org) map[key].org_label = org;
      map[key].accounts.push(a);
    });
    return order.map(function (k) {
      var g = map[k];
      g.display_full = orgFullName(g.customer_code, g.org_label);
      g.display_short = orgShortName(g.customer_code, g.org_label);
      g.display_name = g.display_short;
      g.accounts.sort(sortAccountsForDisplay);
      return g;
    });
  }

  function sortAccountsForDisplay(a, b) {
    var fa = a && a.is_fund ? 1 : 0;
    var fb = b && b.is_fund ? 1 : 0;
    if (fa !== fb) return fa - fb;
    var aa = accountAvailable(a);
    var bb = accountAvailable(b);
    var na = aa == null ? -1 : aa;
    var nb = bb == null ? -1 : bb;
    if (nb !== na) return nb - na;
    return String((a && a.account_number) || "").localeCompare(String((b && b.account_number) || ""), "ru");
  }

  var SUBTYPE_LABELS = {

  function renderBalances() {
    var totalWrap = el("dg-fin-total-wrap");
    var banksWrap = el("dg-fin-banks-wrap");
    if (!totalWrap || !banksWrap) return;

    if (!state.accounts.length) {
      totalWrap.innerHTML = "";

        '<p class="text-muted small mb-0">Счетов пока нет. Сохраните ключ Точки или Райфа и нажмите «Обновить» у организации.</p>';
      return;
    }

    var viewAccounts = filteredAccounts(state.applied.org);
    if (!viewAccounts.length) {
      totalWrap.innerHTML = "";
      banksWrap.innerHTML =
        '<p class="text-muted small mb-0">Нет счетов для выбранной организации. Смените фильтр и нажмите «Применить».</p>';
      return;
    }

    var availLines = moneyMapLines(sumByCurrency(viewAccounts, accountAvailable));
    var blockedLines = moneyMapLines(sumByCurrency(viewAccounts, accountBlocked));
    var main = availLines[0];
    var rest = availLines.slice(1);
    var syn = latestSyncedAt(viewAccounts);
    var synTxt = syn ? String(syn).replace("T", " ").slice(0, 19) : "—";
    var blockedHtml = "";
    if (blockedLines.length) {
      var blockedPositive = blockedLines.some(function (x) { return Number(x.amount) > 0; });
      if (blockedPositive) {
        blockedHtml =
          '<div class="dg-fin-total-extra small text-muted">Заблокировано: <strong class="text-dark">' +
          esc(formatMoneyList(blockedLines)) +
          "</strong></div>";
      }
    }
    var multiCur =
      rest.length > 0
        ? '<div class="dg-fin-total-extra small text-muted">Другие валюты: ' +
          esc(formatMoneyList(rest)) +
          "</div>"
        : "";

    totalWrap.innerHTML =
      '<div class="card dg-fin-total-card">' +
      '<div class="card-body">' +
      '<div class="dg-fin-total-label">Всего доступно' +
      (normalizeOrgs(state.applied.org).length
        ? " · " + esc(normalizeOrgs(state.applied.org).map(function (c) { return orgLabelByCode(c) || c; }).join(", "))
        : "") +
      "</div>" +
      '<p class="dg-fin-total-amount dg-fin-bal-num mb-0">' +
      esc(main ? fmtMoney(main.amount, main.currency) : "—") +
      "</p>" +
      '<div class="dg-fin-total-meta">Счетов: ' +
      viewAccounts.length +
      " · снимок: " +
      esc(synTxt) +
      "</div>" +
      multiCur +
      blockedHtml +
      "</div></div>";

    var groups = groupAccountsByBank(viewAccounts);
    banksWrap.innerHTML = groups
      .map(function (g) {
        var bankAvail = formatMoneyList(moneyMapLines(sumByCurrency(g.accounts, accountAvailable)));
        var checkingN = g.accounts.filter(function (a) { return !a.is_fund; }).length;
        var fundN = g.accounts.length - checkingN;
        var metaBits = [];
        if (checkingN) metaBits.push(checkingN + " расчётн.");
        if (fundN) metaBits.push(fundN + " фонд" + (fundN === 1 ? "" : fundN < 5 ? "а" : "ов"));
        var cards = g.accounts
          .map(function (a) {
            var isFund = !!a.is_fund;
            var dispName = accountDisplayName(a);
            var stLab = subtypeLabel(a);
            var mask = maskAcc(a.account_number || a.account_id);
            var fullNum = String(a.account_number || a.account_id || "").trim();
            var avail = accountAvailable(a);
            var blockedAmt = accountBlocked(a);
            var typeText = isFund ? "Фонд" : stLab || "Счёт";
            var isZero = avail == null || Number(avail) === 0;
            var blockedHtml =
              blockedAmt != null && blockedAmt > 0
                ? '<div class="dg-fin-acc-blocked">Заблок. ' + esc(fmtMoney(blockedAmt, a.currency)) + "</div>"

  function filteredAccounts(orgCodes) {
    var codes = normalizeOrgs(orgCodes);
    if (!codes.length) return (state.accounts || []).slice();
    return (state.accounts || []).filter(function (a) {
      return codes.indexOf(String(a.customer_code || "")) >= 0;
    });
  }
  function getOrgAliasEntry(customerCode) {
    var code = String(customerCode || "").trim();
    var raw = code && state.orgAliases ? state.orgAliases[code] : null;
    if (!raw) return { full: "", short: "" };
    if (typeof raw === "string") {
      var one = String(raw).trim();
      return { full: one, short: one };
    }
    return {
      full: String(raw.full || "").trim(),
      short: String(raw.short || "").trim(),
    };
  }
  /** Полное название — фильтр, таблица, аналитика, тосты. */
  function orgFullName(customerCode, fallback) {
    var e = getOrgAliasEntry(customerCode);
    if (e.full) return e.full;
    if (e.short) return e.short;
    return String(fallback || "").trim() || "Организация";
  }
  /** Короткое — шапка карточек балансов (скрин 3). */
  function orgShortName(customerCode, fallback) {
    var e = getOrgAliasEntry(customerCode);
    if (e.short) return e.short;
    if (e.full) return e.full;
    return String(fallback || "").trim() || "Организация";
  }
  function orgDisplayName(customerCode, fallback) {
    return orgFullName(customerCode, fallback);
  }
  function orgLabelByCode(code) {
    var c = String(code || "").trim();
    if (!c) return "";
    var e = getOrgAliasEntry(c);
    if (e.full) return e.full;
    if (e.short) return e.short;
    var hit = (state.accounts || []).find(function (a) {
      return String(a.customer_code || "") === c;
    });
    return hit ? String(hit.org_label || hit.name || c).trim() : c;
  }
  function collectOrgOptions() {
    var map = Object.create(null);
    var banks = Object.create(null);
    (state.accounts || []).forEach(function (a) {
      var code = String(a.customer_code || "").trim();
      if (!code) return;
      if (!map[code]) map[code] = orgFullName(code, a.org_label || code);
      var bank = String(a.bank || "tochka").toLowerCase();
      var lab = BANK_LABELS[bank] || bank;
      if (!banks[code]) banks[code] = [];
      if (banks[code].indexOf(lab) < 0) banks[code].push(lab);
    });
    var nameCount = Object.create(null);
    Object.keys(map).forEach(function (code) {
      var n = String(map[code] || "").toLowerCase();
      nameCount[n] = (nameCount[n] || 0) + 1;
    });
    var codes = Object.keys(map).sort(function (a, b) {
      return map[a].localeCompare(map[b], "ru");
    });
    return { map: map, banks: banks, nameCount: nameCount, codes: codes };
  }
  function orgOptionLabel(code) {
    var opt = collectOrgOptions();
    var name = opt.map[code] || orgLabelByCode(code) || code;
    var nKey = String(name || "").toLowerCase();
    var banks = opt.banks[code] || [];
    if ((opt.nameCount[nKey] || 0) > 1 && banks.length) {
      return name + " · " + banks.join("/");
    }
    if (banks.length > 1) return name + " · " + banks.join("/");
    return name;
  }

  function fillCashOrgSelects(codes, keepQuery) {
    var list = codes || collectOrgOptions().codes || [];

  function renderCashOrgSelect(prefix, keepQuery) {
    var sel = el("dg-fin-cash-" + prefix + "-org");
    var qEl = el("dg-fin-cash-" + prefix + "-org-q");
    if (!sel) return;
    var cur = sel.value;
    var q = keepQuery && qEl ? String(qEl.value || "").trim().toLowerCase() : "";
    if (!keepQuery && qEl) qEl.value = "";
    var list = state.cashOrgCodes || [];
    var filtered = !q
      ? list
      : list.filter(function (code) {
          var lab = String(orgOptionLabel(code) || code).toLowerCase();
          return lab.indexOf(q) >= 0 || String(code).toLowerCase().indexOf(q) >= 0;
        });
    sel.innerHTML =
      '<option value="">— выберите —</option>' +
      filtered
        .map(function (code) {
          return '<option value="' + esc(code) + '">' + esc(orgOptionLabel(code) || code) + "</option>";
        })
        .join("");
    if (cur && filtered.indexOf(cur) >= 0) sel.value = cur;
    else if (cur && list.indexOf(cur) >= 0 && q) {
      // Выбранная орг вне фильтра — оставляем в списке первой.
      sel.insertAdjacentHTML(
        "afterbegin",
        '<option value="' + esc(cur) + '" selected>' + esc(orgOptionLabel(cur) || cur) + "</option>"
      );

  function saveOrgMeta(customerCode, names, btn) {
    var full = String((names && names.full) || "").trim();
    var short = String((names && names.short) || "").trim();
    var payload = {
      customer_code: customerCode,
      full_name: full,
      short_name: short,
    };
    var run = function () {
      return fetch("/api/finance/org-meta", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then(function (r) {
          return r.json().then(function (j) {
            return { ok: r.ok, j: j };
          });
        })
        .then(function (x) {
          if (!x.ok || !x.j || !x.j.success) {
            throw new Error((x.j && x.j.error) || "Не удалось сохранить название");
          }
          state.orgAliases = x.j.org_aliases && typeof x.j.org_aliases === "object" ? x.j.org_aliases : {};
          fillOrgSelect();
          renderBalances();
          toast(
            "success",
            "Организация: полное «" +
              (x.j.full_name || "—") +
              "», короткое «" +
              (x.j.short_name || "—") +
              "»"
          );
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun && btn) {
      return window.DatagonNotify.busyRun(btn, run);
    }
    return run();
  }

  function saveAccountMeta(accountId, bank, isFund, customName, btn) {
    var payload = {
      account_id: accountId,
      bank: bank || "tochka",
      is_fund: !!isFund,
      custom_name: String(customName || "").trim(),
    };
    var run = function () {
      return fetch("/api/finance/account-meta", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then(function (r) {
          return r.json().then(function (j) {
            return { ok: r.ok, j: j };
          });
        })
        .then(function (x) {
          if (!x.ok || !x.j || !x.j.success) {
            throw new Error((x.j && x.j.error) || "Не удалось сохранить");
          }
          var updated = x.j.account;
          if (updated) {
            state.accounts = state.accounts.map(function (a) {
              return a.account_id === updated.account_id ? Object.assign({}, a, updated) : a;
            });
            fillAccountSelect();
            renderBalances();
          }
          toast(
            "success",
            "Счёт сохранён" +
              (updated && updated.custom_name ? ": " + updated.custom_name : updated && updated.is_fund ? " (фонд)" : "")
          );
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun && btn) {
      return window.DatagonNotify.busyRun(btn, run);
    }
    return run();
  }

  function saveTxChartTag(txId, bank, tag, cbEl) {
    var payload = {
      tx_id: txId,
      bank: bank || "tochka",
      chart_tag: tag || "",
    };
    var run = function () {
      return fetch("/api/finance/tx-meta", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then(function (r) {
          return r.json().then(function (j) {
            return { ok: r.ok, j: j };
          });
        })
        .then(function (x) {
          if (!x.ok || !x.j || !x.j.success) {
            throw new Error((x.j && x.j.error) || "Не удалось сохранить пометку");
          }
          var upd = x.j.tx || {};
          state.rows = (state.rows || []).map(function (row) {
            if (String(row.tx_id) !== String(txId) || String(row.bank || "tochka") !== String(bank || "tochka")) {
              return row;
            }
            return Object.assign({}, row, {
              chart_tag: upd.chart_tag || "",
              exclude_chart: !!upd.exclude_chart,
              founder_capital: !!upd.founder_capital,
              dividend_payout: !!upd.dividend_payout,
              chart_excluded: !!upd.chart_excluded,
              chart_exclude_reason: upd.chart_exclude_reason || null,
            });
          });
          renderTable();
          loadMonthlyAnalytics();
          loadCounterparties();
          if (state.applied.founder_only || state.applied.dividend_only) loadTx();
          var msg =
            tag === "founder"
              ? "Не в графике: капитал/займ"
              : tag === "dividend"
                ? "Не в графике: дивиденды"
                : "Пометка снята";
          toast("success", msg);
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun && cbEl) {
      return window.DatagonNotify.busyRun(cbEl, run);
    }
    return run();
  }

  function beginOrgNamesEdit(viewEl) {

    fullInp.select();

    function close() {
      if (closed) return;
      closed = true;
      renderBalances();
    }
    function commit() {
      if (closed) return;
      var nextFull = String(fullInp.value || "").trim();
      var nextShort = String(shortInp.value || "").trim();
      if (nextFull === fullCur && nextShort === shortCur) {
        close();

      }
      closed = true;

        closed = false;
        renderBalances();
      });

      ev.preventDefault();
      commit();
    });

      ev.preventDefault();
      close();
    });
    [fullInp, shortInp].forEach(function (inp) {
      inp.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") {
          ev.preventDefault();

          close();

  function beginInlineNameEdit(viewEl, opts) {

      if (next === current && fundNow() === fundStart) {

      closed = true;
      Promise.resolve(opts.onSave(next, saveBtn, fundNow()))
        .catch(function (e) {
          toast("danger", e.message || String(e));
          closed = false;
          renderBalances();
        });

    saveBtn.addEventListener("click", function (ev) {
      ev.preventDefault();
      commit();
    });

      ev.preventDefault();
      close();
    });

      if (ev.key === "Enter") {
        ev.preventDefault();
        commit();
      } else if (ev.key === "Escape") {
        ev.preventDefault();
        close();
      }
    });
  }

  function loadAccounts() {

      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.success) throw new Error((j && j.error) || "accounts");
        state.accounts = j.accounts || [];
        state.orgAliases = j.org_aliases && typeof j.org_aliases === "object" ? j.org_aliases : {};
        if (typeof j.can_write === "boolean") state.canWrite = j.can_write;

    q.set("account_id", state.applied.account_id || "");

    if (state.applied.dividend_only) q.set("dividend", "1");
    if (state.applied.source && state.applied.source !== "all") q.set("source", String(state.applied.source));

  function saveJwt() {
    var inp = el("dg-fin-jwt");
    var lab = el("dg-fin-cred-label");
    var jwt = String((inp && inp.value) || "").trim();
    var label = String((lab && lab.value) || "").trim();
    if (!jwt) {
      setBankMsg("danger", "<strong>Вставьте JWT</strong> организации.");
      return Promise.resolve();
    }
    var btn = el("dg-fin-btn-save-bank");
    var run = function () {
      setBankMsg("warning", "Сохраняем…");
      return postConfig({ action: "upsert", label: label || "Точка", jwt: jwt })
        .then(function (x) {
          if (!x.r.ok || !x.j.success) throw new Error((x.j && x.j.error) || ("HTTP " + x.r.status));
          return fetch("/api/finance/config", { credentials: "same-origin" }).then(function (r) {
            return r.json();
          });
        })
        .then(function (cfg) {
          state.credentials = Array.isArray(cfg.credentials) ? cfg.credentials : [];
          renderCredList();
          var added = state.credentials.filter(function (c) {
            return Number(c.jwt_len || 0) === jwt.length;
          });
          var ok = cfg.configured && added.length > 0;
          var html =
            "<strong>" +
            (ok ? "JWT организации сохранён." : "Сохранено, проверьте маску в списке.") +
            "</strong>";
          if (added[0]) html += "<br>" + esc(added[0].label) + ": " + esc(added[0].jwt_mask || "—");
          setBankMsg(ok ? "success" : "warning", html);
          if (inp) inp.value = "";
          if (lab) lab.value = "";
        })
        .catch(function (e) {
          setBankMsg("danger", "<strong>Ошибка сохранения.</strong> " + esc(e.message || String(e)));
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun && btn) return window.DatagonNotify.busyRun(btn, run);
    return run();
  }

  function openFinConfirm(opts) {
    opts = opts || {};
    var overlay = el("dg-fin-confirm-overlay");
    var title = el("dg-fin-confirm-title");
    var text = el("dg-fin-confirm-text");
    var okBtn = el("dg-fin-confirm-ok");
    var cancelBtn = el("dg-fin-confirm-cancel");
    if (!overlay || !okBtn || !cancelBtn) {
      return Promise.resolve(false);
    }
    if (title) title.textContent = opts.title || "Подтверждение";
    if (text) text.textContent = opts.text || "";
    okBtn.textContent = opts.okLabel || "Удалить";
    okBtn.className = "btn btn-sm " + (opts.okClass || "btn-danger");
    overlay.classList.remove("d-none");
    return new Promise(function (resolve) {
      function close(v) {
        overlay.classList.add("d-none");
        okBtn.removeEventListener("click", onOk);
        cancelBtn.removeEventListener("click", onCancel);
        overlay.removeEventListener("click", onBackdrop);
        document.removeEventListener("keydown", onKey);
        resolve(v);
      }
      function onOk() { close(true); }
      function onCancel() { close(false); }
      function onBackdrop(ev) { if (ev.target === overlay) close(false); }
      function onKey(ev) { if (ev.key === "Escape") close(false); }
      okBtn.addEventListener("click", onOk);
      cancelBtn.addEventListener("click", onCancel);
      overlay.addEventListener("click", onBackdrop);
      document.addEventListener("keydown", onKey);
    });
  }

    }
    return String(num);

  function probe(credentialId, bank) {
    var btn =
      bank === "raiffeisen"
        ? el("dg-fin-btn-probe-raiff")
        : bank === "tbank"
          ? el("dg-fin-btn-probe-tbank")
          : el("dg-fin-btn-probe");
    var t0 = Date.now();
    showActionLog(
      "info",
      credentialId
        ? "Проверка ключа…"
        : bank === "raiffeisen"
          ? "Проверка Райфа…"
          : bank === "tbank"
            ? "Проверка Т‑Банка…"
            : bank === "tochka"
              ? "Проверка Точки…"
              : "Проверка банков…"
    );
    var run = function () {
      var url = "/api/finance/probe";
      var qs = [];
      if (credentialId) qs.push("credential_id=" + encodeURIComponent(credentialId));
      if (bank) qs.push("bank=" + encodeURIComponent(bank));
      if (qs.length) url += "?" + qs.join("&");
      return fetch(url, { credentials: "same-origin" })
        .then(function (r) {
          return r.json().then(function (j) {
            return { r: r, j: j };
          });
        })
        .then(function (x) {
          var sec = Math.round((Date.now() - t0) / 1000);
          if (!x.r.ok || !x.j.success) throw new Error((x.j && x.j.error) || ("HTTP " + x.r.status));
          var results = Array.isArray(x.j.results) ? x.j.results : [];
          var html =
            "Связь ок. Всего счетов: " +
            Number(x.j.count || 0) +
            ", ключей: " +
            Number(x.j.credentials_probed || results.length || 0) +
            ". " +
            sec +
            " с.";
          if (results.length) {
            html += "<ul class=\"small mb-0 ps-3 mt-1\">";
            results.forEach(function (r) {
              if (r.error) {
                html += "<li>" + esc(r.label || r.credential_id) + ": ошибка — " + esc(r.error) + "</li>";
              } else {
                html +=
                  "<li>" +
                  esc(r.label || r.credential_id) +
                  ": счетов " +
                  Number(r.count || 0) +
                  "</li>";
              }
            });
            html += "</ul>";
          }
          if (x.j.api_note) html += "<br><span class=\"small text-muted\">" + esc(x.j.api_note) + "</span>";
          showActionLog("success", html, true);
          toast("success", "Банки: счетов " + Number(x.j.count || 0));
        })
        .catch(function (e) {
          showActionLog("danger", "Ошибка проверки: " + (e.message || String(e)));
          toast("danger", e.message || String(e));
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun && btn && !credentialId) {
      return window.DatagonNotify.busyRun(btn, run);
    }
    return run();
  }

  function parseJsonResponse(r) {
    return r.text().then(function (txt) {
      var t = String(txt || "").trim();
      if (!t) return { r: r, j: { success: false, error: "Пустой ответ HTTP " + r.status } };
      try {
        return { r: r, j: JSON.parse(t) };
      } catch (e) {
        var snip = t.replace(/\s+/g, " ").slice(0, 160);
        throw new Error(
          "Сервер вернул не JSON (HTTP " +
            r.status +
            "). Часто это таймаут прокси на длинном синке. Фрагмент: " +
            snip
        );
      }
    });
  }

    toast(j.success === false ? "warning" : "success", j.message || "Готово");
    return loadAccounts().then(function () {
      return Promise.all([loadTx(), loadMonthlyAnalytics(), loadCounterparties()]);
    });

  function pollFinanceSync(opts) {
    opts = opts || {};
    var t0 = opts.t0 || Date.now();
    var filtersTxt = opts.filtersTxt || "";
    var days = opts.days || 30;
    var tick = opts.tick || null;
    var attempts = Number(opts.attempts || 0);
    return fetch("/api/finance/sync-status", { credentials: "same-origin" })
      .then(parseJsonResponse)
      .then(function (x) {
        var sync = (x.j && x.j.sync) || {};
        var sec = Math.round((Date.now() - t0) / 1000);
        if (sync.active) {
          var msg = String(sync.message || "Обновление…");
          showActionLog(
            "info",
            "Обновляем счета и выписку (Точка / Райф / Т‑Банк) за " +
              days +
              " дн.<br><span class=\"small\">Фильтры: " +
              esc(filtersTxt) +
              "</span><br>" +
              esc(msg) +
              " · прошло " +
              sec +
              " с…",
            true
          );
          if (attempts > 600) {
            if (tick) clearInterval(tick);
            throw new Error("Синк не завершился за отведённое время (статус всё ещё active)");
          }
          return new Promise(function (resolve) {
            setTimeout(function () {
              resolve(pollFinanceSync({ t0: t0, filtersTxt: filtersTxt, days: days, tick: tick, attempts: attempts + 1 }));
            }, 1500);
          });
        }
        if (tick) clearInterval(tick);
        var result = sync.last_result || null;
        if (!result) {
          if (sync.last_error) throw new Error(sync.last_error);
          throw new Error("Синк завершился без результата");
        }
        return renderSyncResult(result);
      });
  }

  function syncFromBank(opts) {
    opts = opts || {};
    if (!state.canWrite) {
      toast("warning", "Нужен полный доступ, чтобы обновлять из банка");
      return Promise.resolve();
    }
    readPendingFromForm();
    var days = state.pending.sync_days || 30;
    var credId = String(opts.credentialId || "").trim();
    var orgTxt = String(opts.orgLabel || "").trim();
    if (credId && !orgTxt) {
      var found = (state.credentials || []).find(function (c) { return c.id === credId; });
      if (!found) found = (state.raiffeisenCredentials || []).find(function (c) { return c.id === credId; });
      if (!found) found = (state.tbankCredentials || []).find(function (c) { return c.id === credId; });
      if (found) orgTxt = found.label || "";
    }
    var useFilters = !!opts.useFilters;
    var customerCodes = useFilters ? normalizeOrgs(state.pending.org) : [];
    var accountId = useFilters ? String(state.pending.account_id || "").trim() : "";
    var dateFrom = useFilters ? String(state.pending.date_from || "").trim() : "";
    var dateTo = useFilters ? String(state.pending.date_to || "").trim() : "";
    if (useFilters) {
      // применяем фильтры к таблице сразу, чтобы после синка увидеть нужный срез
      state.applied = Object.assign({}, state.pending);
      writeFormFromPending();
      markDirty();
    }
    var periodTxt =
      dateFrom || dateTo
        ? (dateFrom || "…") + " — " + (dateTo || "…")
        : "последние " + days + " дн.";
    var scopeParts = [];
    if (credId) scopeParts.push("JWT: " + (orgTxt || credId));
    if (customerCodes.length) scopeParts.push("орг: " + customerCodes.map(function (c) { return orgLabelByCode(c) || c; }).join(", "));
    if (accountId) scopeParts.push("счёт: " + maskAcc(accountId));
    if (!scopeParts.length) scopeParts.push(useFilters ? "все орг. по фильтрам" : "все включённые JWT");
    var scopeTxt = scopeParts.join(" · ");
    var filtersTxt = [
      "период: " + periodTxt,
      "организация: " +
        (customerCodes.length
          ? customerCodes.map(function (c) { return orgLabelByCode(c) || c; }).join(", ")
          : useFilters
            ? "все"
            : credId
              ? orgTxt || "JWT"
              : "все"),
      "счёт: " + (accountId ? maskAcc(accountId) : "все"),
    ].join("; ");
    var t0 = Date.now();
    var tick = null;
    showActionLog(
      "info",
      "Загружаем выписки (Точка / Райф / Т‑Банк) (" +
        esc(scopeTxt) +
        ")<br><span class=\"small\">" +
        esc(filtersTxt) +
        "</span><br>идёт, прошло 0 с…",
      true
    );
    tick = setInterval(function () {
      var s = Math.round((Date.now() - t0) / 1000);
      showActionLog(
        "info",
        "Загружаем выписки (Точка / Райф / Т‑Банк) (" +
          esc(scopeTxt) +
          ")<br><span class=\"small\">" +
          esc(filtersTxt) +
          "</span><br>идёт, прошло " +
          s +
          " с…",
        true
      );
    }, 1000);
    var btn = opts.triggerBtn || el("dg-fin-load-tx") || el("dg-fin-sync");
    var body = { days: days };
    if (credId) body.credential_id = credId;
    if (credId && String(credId).indexOf("rf_") === 0) body.bank = "raiffeisen";
    if (credId && String(credId).indexOf("tb_") === 0) body.bank = "tbank";
    if (customerCodes.length) body.customer_codes = customerCodes;
    if (accountId) body.account_id = accountId;
    if (dateFrom) body.date_from = dateFrom;
    if (dateTo) body.date_to = dateTo;
    var run = function () {
      return fetch("/api/finance/sync", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      })
        .then(parseJsonResponse)
        .then(function (x) {
          var j = x.j || {};
          if (!x.r.ok) throw new Error((j && j.error) || ("HTTP " + x.r.status));
          if (j.skip_reason === "already_running") {
            showActionLog("warning", "Уже идёт обновление — подключаемся к статусу…", false);
            return pollFinanceSync({ t0: t0, filtersTxt: filtersTxt, days: days, tick: tick });
          }
          if (j.queued || j.started) {
            return pollFinanceSync({ t0: t0, filtersTxt: filtersTxt, days: days, tick: tick });
          }
          if (tick) clearInterval(tick);
          return renderSyncResult(j);
        })
        .catch(function (e) {
          if (tick) clearInterval(tick);
          showActionLog("danger", "Ошибка обновления: " + (e.message || String(e)));
          toast("danger", e.message || String(e));
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun && btn) return window.DatagonNotify.busyRun(btn, run);
    return run();
  }
