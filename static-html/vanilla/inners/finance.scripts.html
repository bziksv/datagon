  function pollFinanceSync(opts) {
    opts = opts || {};
    var t0 = opts.t0 || Date.now();
    var filtersTxt = opts.filtersTxt || "";
    var days = opts.days || 30;
    var tick = opts.tick || null;
    var attempts = Number(opts.attempts || 0);
    return fetch("/api/finance/sync-status", { credentials: "same-origin" })
      .then(parseJsonResponse)
      .then(function (x) {
        var sync = (x.j && x.j.sync) || {};
        var sec = Math.round((Date.now() - t0) / 1000);
        if (sync.active) {
          var msg = String(sync.message || "Обновление…");
          showActionLog(
            "info",
            "Обновляем счета и выписку (Точка / Райф) за " +
              days +
              " дн.<br><span class=\"small\">Фильтры: " +
              esc(filtersTxt) +
              "</span><br>" +
              esc(msg) +
              " · прошло " +
              sec +
              " с…",
            true
          );
          if (attempts > 600) {
            if (tick) clearInterval(tick);
            throw new Error("Синк не завершился за отведённое время (статус всё ещё active)");
          }
          return new Promise(function (resolve) {
            setTimeout(function () {
              resolve(pollFinanceSync({ t0: t0, filtersTxt: filtersTxt, days: days, tick: tick, attempts: attempts + 1 }));
            }, 1500);
          });
        }
        if (tick) clearInterval(tick);
        var result = sync.last_result || null;
        if (!result) {
          if (sync.last_error) throw new Error(sync.last_error);
          throw new Error("Синк завершился без результата");
        }
        return renderSyncResult(result);
      });
  }

  function syncFromBank(opts) {
    opts = opts || {};
    if (!state.canWrite) {
      toast("warning", "Нужен полный доступ, чтобы обновлять из банка");
      return Promise.resolve();
    }
    readPendingFromForm();
    var days = state.pending.sync_days || 30;
    var credId = String(opts.credentialId || "").trim();
    var orgTxt = String(opts.orgLabel || "").trim();
    if (credId && !orgTxt) {
      var found = (state.credentials || []).find(function (c) { return c.id === credId; });
      if (!found) found = (state.raiffeisenCredentials || []).find(function (c) { return c.id === credId; });
      if (found) orgTxt = found.label || "";
    }
    var useFilters = !!opts.useFilters;
    var customerCodes = useFilters ? normalizeOrgs(state.pending.org) : [];
    var accountId = useFilters ? String(state.pending.account_id || "").trim() : "";
    var dateFrom = useFilters ? String(state.pending.date_from || "").trim() : "";
    var dateTo = useFilters ? String(state.pending.date_to || "").trim() : "";
    if (useFilters) {
      // применяем фильтры к таблице сразу, чтобы после синка увидеть нужный срез
      state.applied = Object.assign({}, state.pending);
      writeFormFromPending();
      markDirty();
    }
    var periodTxt =
      dateFrom || dateTo
        ? (dateFrom || "…") + " — " + (dateTo || "…")
        : "последние " + days + " дн.";
    var scopeParts = [];
    if (credId) scopeParts.push("JWT: " + (orgTxt || credId));
    if (customerCodes.length) scopeParts.push("орг: " + customerCodes.map(function (c) { return orgLabelByCode(c) || c; }).join(", "));
    if (accountId) scopeParts.push("счёт: " + maskAcc(accountId));
    if (!scopeParts.length) scopeParts.push(useFilters ? "все орг. по фильтрам" : "все включённые JWT");
    var scopeTxt = scopeParts.join(" · ");
    var filtersTxt = [
      "период: " + periodTxt,
      "организация: " +
        (customerCodes.length
          ? customerCodes.map(function (c) { return orgLabelByCode(c) || c; }).join(", ")
          : useFilters
            ? "все"
            : credId
              ? orgTxt || "JWT"
              : "все"),
      "счёт: " + (accountId ? maskAcc(accountId) : "все"),
    ].join("; ");
    var t0 = Date.now();
    var tick = null;
    showActionLog(
      "info",
      "Загружаем выписки (Точка / Райф) (" +
        esc(scopeTxt) +
        ")<br><span class=\"small\">" +
        esc(filtersTxt) +
        "</span><br>идёт, прошло 0 с…",
      true
    );
    tick = setInterval(function () {
      var s = Math.round((Date.now() - t0) / 1000);
      showActionLog(
        "info",
        "Загружаем выписки (Точка / Райф) (" +
          esc(scopeTxt) +
          ")<br><span class=\"small\">" +
          esc(filtersTxt) +
          "</span><br>идёт, прошло " +
          s +
          " с…",
        true
      );
    }, 1000);
    var btn = opts.triggerBtn || el("dg-fin-load-tx") || el("dg-fin-sync");
    var body = { days: days };
    if (credId) body.credential_id = credId;
    if (credId && String(credId).indexOf("rf_") === 0) body.bank = "raiffeisen";
    if (customerCodes.length) body.customer_codes = customerCodes;
    if (accountId) body.account_id = accountId;
    if (dateFrom) body.date_from = dateFrom;
    if (dateTo) body.date_to = dateTo;
    var run = function () {
      return fetch("/api/finance/sync", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      })
        .then(parseJsonResponse)
        .then(function (x) {
          var j = x.j || {};
          if (!x.r.ok) throw new Error((j && j.error) || ("HTTP " + x.r.status));
          if (j.skip_reason === "already_running") {
            showActionLog("warning", "Уже идёт обновление — подключаемся к статусу…", false);
            return pollFinanceSync({ t0: t0, filtersTxt: filtersTxt, days: days, tick: tick });
          }
          if (j.queued || j.started) {
            return pollFinanceSync({ t0: t0, filtersTxt: filtersTxt, days: days, tick: tick });
          }
          if (tick) clearInterval(tick);
          return renderSyncResult(j);
        })
        .catch(function (e) {
          if (tick) clearInterval(tick);
          showActionLog("danger", "Ошибка обновления: " + (e.message || String(e)));
          toast("danger", e.message || String(e));
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun && btn) return window.DatagonNotify.busyRun(btn, run);
    return run();
  }

  function loadStatementsFromFilters(btn) {
    return syncFromBank({ useFilters: true, triggerBtn: btn || el("dg-fin-load-tx") });
  }

  el("dg-fin-apply").addEventListener("click", commitFilters);
  el("dg-fin-reset").addEventListener("click", function () {
    hideActionLog();
    state.pending = { search: "", org: [], date_from: "", date_to: "", direction: "", account_id: "", page_size: 100, sync_days: 30, include_internal: false };
    writeFormFromPending();
    commitFilters();
  });
  el("dg-fin-btn-save-bank").addEventListener("click", saveJwt);
  el("dg-fin-btn-probe").addEventListener("click", function () {
    probe("", "tochka");
  });
  var saveRaiffBtn = el("dg-fin-btn-save-raiff");
  if (saveRaiffBtn) saveRaiffBtn.addEventListener("click", saveRaiff);
  var probeRaiffBtn = el("dg-fin-btn-probe-raiff");
  if (probeRaiffBtn) {
    probeRaiffBtn.addEventListener("click", function () {
      probe("", "raiffeisen");
    });
  }
  var credList = el("dg-fin-cred-list");
  if (credList) {
    credList.addEventListener("click", function (ev) {
      var t = ev.target;
      if (!t) return;
      var del = t.closest && t.closest(".dg-fin-cred-del");
      var pr = t.closest && t.closest(".dg-fin-cred-probe");
      var syn = t.closest && t.closest(".dg-fin-cred-sync");
      if (del) {
        var idDel = del.getAttribute("data-cred-id");
        if (!idDel) return;
        deleteCred(idDel).catch(function (e) {
          setBankMsg("danger", esc(e.message || String(e)));
        });
        return;
      }
      if (pr) {
        var idPr = pr.getAttribute("data-cred-id");
        if (!idPr) return;
        probe(idPr);
        return;
      }
      if (syn) {
        var idSyn = syn.getAttribute("data-cred-id");
        var labSyn = syn.getAttribute("data-cred-label") || "";
        if (!idSyn) return;
        syncFromBank({ credentialId: idSyn, triggerBtn: syn, orgLabel: labSyn });
      }
    });
    credList.addEventListener("change", function (ev) {
      var t = ev.target;
      if (!t || !t.classList || !t.classList.contains("dg-fin-cred-en")) return;
      var id = t.getAttribute("data-cred-id");
      if (!id) return;
      toggleCred(id, t.checked).catch(function (e) {
        setBankMsg("danger", esc(e.message || String(e)));
        t.checked = !t.checked;
      });
    });
  }
  var raiffList = el("dg-fin-raiff-list");
  if (raiffList) {
    raiffList.addEventListener("click", function (ev) {
      var t = ev.target;
      if (!t) return;
      var del = t.closest && t.closest(".dg-fin-raiff-del");
      var pr = t.closest && t.closest(".dg-fin-raiff-probe");
      var syn = t.closest && t.closest(".dg-fin-raiff-sync");
      if (del) {
        var idDel = del.getAttribute("data-raiff-id");
        if (!idDel) return;
        deleteRaiff(idDel).catch(function (e) {
          setBankMsg("danger", esc(e.message || String(e)));
        });
        return;
      }
      if (pr) {
        var idPr = pr.getAttribute("data-raiff-id");
        if (!idPr) return;
        probe(idPr, "raiffeisen");
        return;
      }
      if (syn) {
        var idSyn = syn.getAttribute("data-raiff-id");
        var labSyn = syn.getAttribute("data-raiff-label") || "";
        if (!idSyn) return;
        syncFromBank({ credentialId: idSyn, triggerBtn: syn, orgLabel: labSyn });
      }
    });
    raiffList.addEventListener("change", function (ev) {
      var t = ev.target;
      if (!t || !t.classList || !t.classList.contains("dg-fin-raiff-en")) return;
      var id = t.getAttribute("data-raiff-id");
      if (!id) return;
      toggleRaiff(id, t.checked).catch(function (e) {
        setBankMsg("danger", esc(e.message || String(e)));
        t.checked = !t.checked;
      });
    });
  }
  var loadTxBtn = el("dg-fin-load-tx");
  if (loadTxBtn) {
    loadTxBtn.addEventListener("click", function () {
      loadStatementsFromFilters(loadTxBtn);
    });
  }
  el("dg-fin-sync").addEventListener("click", function () {
    syncFromBank({ triggerBtn: el("dg-fin-sync") });
  });
  var banksWrapEl = el("dg-fin-banks-wrap");
  if (banksWrapEl) {
    banksWrapEl.addEventListener("click", function (ev) {
      var t = ev.target;
      if (!t || !t.closest) return;

      var fundBtn = t.closest(".dg-fin-acc-fund-toggle");
      if (fundBtn) {
        ev.preventDefault();
        var fid = fundBtn.getAttribute("data-account-id");
        var fbank = fundBtn.getAttribute("data-bank") || "tochka";
        var nextFund = fundBtn.getAttribute("data-is-fund") !== "1";
        var fname = fundBtn.getAttribute("data-custom-name") || "";
        if (!fid) return;
        saveAccountMeta(fid, fbank, nextFund, fname, fundBtn).catch(function (e) {
          toast("danger", e.message || String(e));
        });
        return;
      }

      var orgHit = t.closest(".dg-fin-org-name-hit, .dg-fin-org-name-edit");
      if (orgHit) {
        ev.preventDefault();
        var orgView = orgHit.closest(".dg-fin-name-view");
        if (!orgView) return;
        beginOrgNamesEdit(orgView);
        return;
      }

      var accHit = t.closest(".dg-fin-acc-name-hit, .dg-fin-acc-name-edit");
      if (accHit) {
        ev.preventDefault();
        var accView = accHit.closest(".dg-fin-name-view");
        if (!accView) return;
        var aid = accView.getAttribute("data-account-id");
        var abank = accView.getAttribute("data-bank") || "tochka";
        var aFund = accView.getAttribute("data-is-fund") === "1";
        if (!aid) return;
        beginInlineNameEdit(accView, {
          value: accView.getAttribute("data-custom-name") || "",
          isFund: aFund,
          placeholder: "Название",
          notifyStart: "Сохраняем счёт…",
          onSave: function (next, btn, isFund) {
            return saveAccountMeta(aid, abank, isFund, next, btn);
          },
        });
      }
    });
  }
  ["dg-fin-search", "dg-fin-date-from", "dg-fin-date-to", "dg-fin-direction", "dg-fin-account", "dg-fin-page-size", "dg-fin-sync-days", "dg-fin-include-internal"].forEach(function (id) {
    var n = el(id);
    if (!n) return;
    n.addEventListener("input", function () { readPendingFromForm(); markDirty(); });
    n.addEventListener("change", function () {
      readPendingFromForm();
      markDirty();
    });
  });
  var orgMenu = el("dg-fin-org-menu");
  if (orgMenu) {
    orgMenu.addEventListener("click", function (ev) {
      var all = ev.target && ev.target.closest && ev.target.closest(".dg-fin-org-all");
      if (all) {
        ev.preventDefault();
        document.querySelectorAll("#dg-fin-org-menu input.dg-fin-org-cb").forEach(function (cb) {
          cb.checked = false;
        });
        readPendingFromForm();
        fillAccountSelect();
        markDirty();
      }
    });
    orgMenu.addEventListener("change", function (ev) {
      if (!ev.target || !ev.target.classList || !ev.target.classList.contains("dg-fin-org-cb")) return;
      readPendingFromForm();
      fillAccountSelect();
      updateOrgBtnLabel();
      markDirty();
    });
  }
  el("dg-fin-page-size-foot").addEventListener("change", function () {
    if (el("dg-fin-page-size")) el("dg-fin-page-size").value = el("dg-fin-page-size-foot").value;
    readPendingFromForm();
    commitFilters();
  });
  el("dg-fin-prev").addEventListener("click", function () {
    if (state.page <= 1) return;
    state.page -= 1;
    loadTx();
  });
  el("dg-fin-next").addEventListener("click", function () {
    if (state.page >= state.pages) return;
    state.page += 1;
    loadTx();
  });

  bindCollapse("dg-fin-bank-toggle", "dg-fin-bank-body", BANK_KEY);
  bindCollapse("dg-fin-filters-toggle", "dg-fin-filters-body", FILTERS_KEY);
  bindCollapse("dg-fin-table-toggle", "dg-fin-table-body", TABLE_KEY);
  bindCollapse("dg-fin-analytics-toggle", "dg-fin-analytics-body", ANALYTICS_KEY);
  bindCollapse("dg-fin-cp-toggle", "dg-fin-cp-body", CP_KEY);
  try {
    var savedMonths = localStorage.getItem(ANALYTICS_MONTHS_KEY);
    if (savedMonths && el("dg-fin-analytics-months")) {
      el("dg-fin-analytics-months").value = savedMonths;
      state.analyticsMonths = parseInt(savedMonths, 10) || 12;
    }
    var savedDep = localStorage.getItem(ANALYTICS_DEPOSITS_KEY);
    if (savedDep === "1") {
      state.pending.include_internal = true;
      state.applied.include_internal = true;
      if (el("dg-fin-include-internal")) el("dg-fin-include-internal").checked = true;
      if (el("dg-fin-analytics-deposits")) el("dg-fin-analytics-deposits").checked = true;
    }
    var savedCpLimit = localStorage.getItem(CP_LIMIT_KEY);
    if (savedCpLimit && el("dg-fin-cp-limit")) el("dg-fin-cp-limit").value = savedCpLimit;
  } catch (e) {}
  var analyticsMonthsSel = el("dg-fin-analytics-months");
  if (analyticsMonthsSel) {
    analyticsMonthsSel.addEventListener("change", function () {
      loadMonthlyAnalytics();
      loadCounterparties();
    });
  }
  function setIncludeInternal(on, reloadNow) {
    state.pending.include_internal = !!on;
    if (el("dg-fin-include-internal")) el("dg-fin-include-internal").checked = !!on;
    if (el("dg-fin-analytics-deposits")) el("dg-fin-analytics-deposits").checked = !!on;
    try { localStorage.setItem(ANALYTICS_DEPOSITS_KEY, on ? "1" : "0"); } catch (e2) {}
    markDirty();
    if (reloadNow) {
      state.applied.include_internal = !!on;
      state.page = 1;
      markDirty();
      return Promise.all([loadTx(), loadMonthlyAnalytics(), loadCounterparties()]);
    }
    return Promise.resolve();
  }
  var includeInternalEl = el("dg-fin-include-internal");
  if (includeInternalEl) {
    includeInternalEl.addEventListener("change", function () {
      setIncludeInternal(includeInternalEl.checked, false);
    });
  }
  var analyticsDep = el("dg-fin-analytics-deposits");
  if (analyticsDep) {
    analyticsDep.addEventListener("change", function () {
      setIncludeInternal(analyticsDep.checked, true);
    });
  }
  var analyticsRefresh = el("dg-fin-analytics-refresh");
  if (analyticsRefresh) {
    analyticsRefresh.addEventListener("click", function () {
      var run = function () { return loadMonthlyAnalytics(); };
      if (window.DatagonNotify && window.DatagonNotify.busyRun) {
        window.DatagonNotify.busyRun(analyticsRefresh, run);
      } else {
        run();
      }
    });
  }
  var cpLimitSel = el("dg-fin-cp-limit");
  if (cpLimitSel) {
    cpLimitSel.addEventListener("change", function () {
      loadCounterparties();
    });
  }
  var cpRefresh = el("dg-fin-cp-refresh");
  if (cpRefresh) {
    cpRefresh.addEventListener("click", function () {
      var run = function () { return loadCounterparties(); };
      if (window.DatagonNotify && window.DatagonNotify.busyRun) {
        window.DatagonNotify.busyRun(cpRefresh, run);
      } else {
        run();
      }
    });
  }
  var cpGrid = el("dg-fin-cp-grid");
  if (cpGrid) {
    cpGrid.addEventListener("click", function (ev) {
      var btn = ev.target && ev.target.closest ? ev.target.closest("[data-dg-cp-name]") : null;
      if (!btn || !cpGrid.contains(btn)) return;
      applyCounterpartyToFilters(
        btn.getAttribute("data-dg-cp-name"),
        btn.getAttribute("data-dg-cp-dir"),
        btn.getAttribute("data-dg-cp-inn")
      );
    });
  }
  bindHeaderSearchMirror();
  columnControls();
  buildThead();
  if (window.DatagonFilterFieldsVisibility && window.DatagonFilterFieldsVisibility.init) {
    window.DatagonFilterFieldsVisibility.init({
      storageKeyPrefix: "datagon_finance_filter_fields_v1",
      attr: "data-dg-fin-filter-field",
      fieldGroups: FIELD_GROUPS,
      togglesRootId: "dg-fin-filter-blocks-toggles",
      idPrefix: "dg-fin-ff-",
    });
  }

  loadConfig()
    .then(loadAccounts)
    .then(function () {
      state.applied = Object.assign({}, state.pending);
      markDirty();
      return Promise.all([loadTx(), loadMonthlyAnalytics(), loadCounterparties()]);
    })
    .catch(function (e) {
      toast("danger", e.message || String(e));
    });
})();
</script>
