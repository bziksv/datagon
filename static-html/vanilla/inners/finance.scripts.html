<script>
(function () {
  var FIN_COLS = [
    ["booked_date", "Дата"],
    ["direction", "Направление"],
    ["amount", "Сумма"],
    ["org", "Организация"],
    ["bank", "Банк"],
    ["account_number", "Счёт"],
    ["counterparty", "Контрагент"],
    ["counterparty_inn", "ИНН"],
    ["purpose", "Назначение"],
    ["document_number", "Документ"],
    ["tx_id", "ID операции"],
  ];
  var DEFAULT_VISIBLE = FIN_COLS.map(function (c) { return c[0]; });
  var DEFAULT_WIDTHS = {
    booked_date: 110,
    direction: 120,
    amount: 130,
    org: 140,
    bank: 110,
    account_number: 150,
    counterparty: 220,
    counterparty_inn: 120,
    purpose: 320,
    document_number: 120,
    tx_id: 160,
  };
  var FILTERS_KEY = "datagon_finance_filters_collapsed_v1";
  var BANK_KEY = "datagon_finance_bank_collapsed_v1";
  var TABLE_KEY = "dg.finance.table-card.collapsed.v1";
  var ANALYTICS_KEY = "dg.finance.analytics-card.collapsed.v1";
  var ANALYTICS_MONTHS_KEY = "dg.finance.analytics.months.v1";
  var ANALYTICS_DEPOSITS_KEY = "dg.finance.analytics.include_deposits.v1";
  var CP_KEY = "dg.finance.counterparties-card.collapsed.v1";
  var CP_LIMIT_KEY = "dg.finance.counterparties.limit.v1";
  var COLS_KEY = "datagon_finance_visible_cols_v1";
  var WIDTHS_KEY = "datagon_finance_col_widths_v1";
  var FIELD_GROUPS = [
    {
      title: "Основные",
      items: [
        { key: "search", title: "Умный поиск" },
        { key: "org", title: "Организация" },
        { key: "date_from", title: "С даты" },
        { key: "date_to", title: "По дату" },
        { key: "direction", title: "Направление" },
        { key: "account", title: "Счёт" },
      ],
    },
    {
      title: "Таблица",
      items: [
        { key: "page_size", title: "На странице" },
        { key: "sync_days", title: "Выписка, дн." },
        { key: "include_internal", title: "Внутренние (депозиты / фонды / дивиденды)" },
      ],
    },
  ];

  var state = {
    canWrite: false,
    credentials: [],
    raiffeisenCredentials: [],
    accounts: [],
    orgAliases: {},
    page: 1,
    total: 0,
    pages: 1,
    shown: 0,
    rows: [],
    sortKey: "booked_date",
    sortDir: "desc",
    pending: { search: "", org: [], date_from: "", date_to: "", direction: "", account_id: "", page_size: 100, sync_days: 30, include_internal: false },
    applied: { search: "", org: [], date_from: "", date_to: "", direction: "", account_id: "", page_size: 100, sync_days: 30, include_internal: false },
    analyticsMonths: 12,
  };

  var chartJsPromise = null;
  var monthlyChart = null;

  function loadChartJs() {
    if (window.Chart && typeof window.Chart === "function") return Promise.resolve(window.Chart);
    if (chartJsPromise) return chartJsPromise;
    chartJsPromise = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js";
      s.async = true;
      s.onload = function () { resolve(window.Chart); };
      s.onerror = function () { reject(new Error("Не удалось загрузить Chart.js")); };
      document.head.appendChild(s);
    });
    return chartJsPromise;
  }

  function el(id) { return document.getElementById(id); }
  function normalizeOrgs(list) {
    var out = [];
    if (list == null || list === "") return out;
    var arr = Array.isArray(list) ? list : String(list).split(",");
    arr.forEach(function (x) {
      var t = String(x || "").trim();
      if (t && out.indexOf(t) < 0) out.push(t);
    });
    out.sort();
    return out;
  }
  function orgsKey(list) {
    return normalizeOrgs(list).join("\u0001");
  }
  function appendOrgQuery(q, orgs) {
    normalizeOrgs(orgs).forEach(function (c) {
      q.append("customer_code", c);
    });
  }
  function orgFilterCaption(orgs) {
    var codes = normalizeOrgs(orgs);
    if (!codes.length) return "Все";
    var names = codes.map(function (c) {
      return orgOptionLabel(c) || c;
    });
    if (names.length <= 2) return names.join(", ");
    return names.length + " орг.";
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function fmtMoney(n, cur) {
    var F = window.DatagonFmt;
    var num = Number(n);
    if (!Number.isFinite(num)) return "—";
    var t = F && F.formatNumber ? F.formatNumber(num, { maxFractionDigits: 2, minFractionDigits: 2 }) : String(num);
    return t + (cur ? " " + cur : "");
  }
  /** Маска р/с: «номер/БИК» — берём хвост номера, не БИК (иначе у всех …5104). */
  function maskAcc(num) {
    var s = String(num || "").replace(/\s+/g, "");
    if (!s) return "—";
    var acct = s.indexOf("/") >= 0 ? s.split("/")[0] : s;
    if (acct.length <= 6) return acct;
    return "…" + acct.slice(-6);
  }
  function toast(type, message) {
    if (window.DatagonNotify && window.DatagonNotify.toast) {
      window.DatagonNotify.toast({ type: type, message: message });
    }
  }
  function showActionLog(kind, html, asHtml) {
    var box = el("dg-fin-action-log");
    if (!box) return;
    box.classList.remove("d-none", "alert-secondary", "alert-info", "alert-success", "alert-warning", "alert-danger");
    box.classList.add(kind === "success" ? "alert-success" : kind === "danger" ? "alert-danger" : kind === "warning" ? "alert-warning" : "alert-info");
    if (asHtml) box.innerHTML = html;
    else box.textContent = html;
  }
  function hideActionLog() {
    var box = el("dg-fin-action-log");
    if (!box) return;
    box.classList.add("d-none");
    box.textContent = "";
  }
  function setBankMsg(kind, html) {
    var box = el("dg-fin-bank-save-msg");
    if (!box) return;
    box.classList.remove("d-none", "alert-success", "alert-warning", "alert-danger", "alert-secondary");
    box.classList.add(kind === "success" ? "alert-success" : kind === "warning" ? "alert-warning" : kind === "danger" ? "alert-danger" : "alert-secondary");
    box.innerHTML = html;
  }
  function hasTextSelection() {
    try {
      return String(window.getSelection && window.getSelection().toString() || "").trim().length > 0;
    } catch (e) {
      return false;
    }
  }
  function userKey(base) {
    var u = "";
    try { u = String((window.DatagonAuth && window.DatagonAuth.username) || ""); } catch (e) {}
    return base + ":" + (u || "anon");
  }
  function loadVisibleCols() {
    try {
      var raw = localStorage.getItem(userKey(COLS_KEY));
      var arr = raw ? JSON.parse(raw) : null;
      if (Array.isArray(arr) && arr.length) {
        var known = {};
        FIN_COLS.forEach(function (c) { known[c[0]] = 1; });
        var filtered = arr.filter(function (k) { return known[k]; });
        // старые сохранения без колонки «Организация» — вставить перед «Счёт»
        if (filtered.indexOf("org") < 0) {
          var at = filtered.indexOf("account_number");
          if (at >= 0) filtered.splice(at, 0, "org");
          else filtered.push("org");
        }
        return filtered.length ? filtered : DEFAULT_VISIBLE.slice();
      }
    } catch (e) {}
    return DEFAULT_VISIBLE.slice();
  }
  function saveVisibleCols(cols) {
    try { localStorage.setItem(userKey(COLS_KEY), JSON.stringify(cols)); } catch (e) {}
  }
  function loadWidths() {
    var out = Object.assign({}, DEFAULT_WIDTHS);
    try {
      var raw = localStorage.getItem(userKey(WIDTHS_KEY));
      var obj = raw ? JSON.parse(raw) : null;
      if (obj && typeof obj === "object") {
        Object.keys(obj).forEach(function (k) {
          var n = parseInt(obj[k], 10);
          if (n >= 60 && n <= 800) out[k] = n;
        });
      }
    } catch (e) {}
    return out;
  }
  function saveWidths(w) {
    try { localStorage.setItem(userKey(WIDTHS_KEY), JSON.stringify(w)); } catch (e) {}
  }

  var visibleCols = loadVisibleCols();
  var colWidths = loadWidths();

  function readPendingFromForm() {
    state.pending.search = String((el("dg-fin-search") && el("dg-fin-search").value) || "").trim();
    var orgBoxes = document.querySelectorAll("#dg-fin-org-menu input.dg-fin-org-cb");
    if (orgBoxes.length) {
      var picked = [];
      orgBoxes.forEach(function (cb) {
        if (cb.checked) picked.push(String(cb.value || "").trim());
      });
      state.pending.org = normalizeOrgs(picked);
    } else {
      state.pending.org = normalizeOrgs(state.pending.org);
    }
    state.pending.date_from = String((el("dg-fin-date-from") && el("dg-fin-date-from").value) || "");
    state.pending.date_to = String((el("dg-fin-date-to") && el("dg-fin-date-to").value) || "");
    state.pending.direction = String((el("dg-fin-direction") && el("dg-fin-direction").value) || "");
    state.pending.account_id = String((el("dg-fin-account") && el("dg-fin-account").value) || "");
    state.pending.page_size = parseInt(String((el("dg-fin-page-size") && el("dg-fin-page-size").value) || "100"), 10) || 100;
    state.pending.sync_days = parseInt(String((el("dg-fin-sync-days") && el("dg-fin-sync-days").value) || "30"), 10) || 30;
    state.pending.include_internal = !!(el("dg-fin-include-internal") && el("dg-fin-include-internal").checked);
  }
  function writeFormFromPending() {
    if (el("dg-fin-search")) el("dg-fin-search").value = state.pending.search;
    if (el("dg-fin-table-search-mirror")) el("dg-fin-table-search-mirror").value = state.pending.search;
    syncOrgChecksFromPending();
    if (el("dg-fin-date-from")) el("dg-fin-date-from").value = state.pending.date_from;
    if (el("dg-fin-date-to")) el("dg-fin-date-to").value = state.pending.date_to;
    if (el("dg-fin-direction")) el("dg-fin-direction").value = state.pending.direction;
    if (el("dg-fin-account")) el("dg-fin-account").value = state.pending.account_id;
    if (el("dg-fin-page-size")) el("dg-fin-page-size").value = String(state.pending.page_size);
    if (el("dg-fin-page-size-foot")) el("dg-fin-page-size-foot").value = String(state.pending.page_size);
    if (el("dg-fin-sync-days")) el("dg-fin-sync-days").value = String(state.pending.sync_days);
    if (el("dg-fin-include-internal")) el("dg-fin-include-internal").checked = !!state.pending.include_internal;
    if (el("dg-fin-analytics-deposits")) el("dg-fin-analytics-deposits").checked = !!state.pending.include_internal;
    markDirty();
  }
  function markDirty() {
    var btn = el("dg-fin-apply");
    if (!btn) return;
    var dirty =
      state.pending.search !== state.applied.search ||
      orgsKey(state.pending.org) !== orgsKey(state.applied.org) ||
      state.pending.date_from !== state.applied.date_from ||
      state.pending.date_to !== state.applied.date_to ||
      state.pending.direction !== state.applied.direction ||
      state.pending.account_id !== state.applied.account_id ||
      Number(state.pending.page_size) !== Number(state.applied.page_size) ||
      !!state.pending.include_internal !== !!state.applied.include_internal;
    btn.classList.toggle("dg-flt-dirty", dirty);
    btn.textContent = dirty ? "Применить •" : "Применить";
  }
  function commitFilters() {
    readPendingFromForm();
    // если счёт не из выбранной орг — сбросить
    var orgs = normalizeOrgs(state.pending.org);
    if (orgs.length && state.pending.account_id) {
      var ok = (state.accounts || []).some(function (a) {
        return a.account_id === state.pending.account_id && orgs.indexOf(String(a.customer_code || "")) >= 0;
      });
      if (!ok) state.pending.account_id = "";
    }
    state.applied = Object.assign({}, state.pending);
    writeFormFromPending();
    state.page = 1;
    try { localStorage.setItem(ANALYTICS_DEPOSITS_KEY, state.applied.include_internal ? "1" : "0"); } catch (e) {}
    markDirty();
    renderBalances();
    fillAccountSelect();
    loadTx();
    loadMonthlyAnalytics();
    loadCounterparties();
  }

  function fmtMonthLabel(ym) {
    var s = String(ym || "");
    var p = s.split("-");
    if (p.length !== 2) return s;
    var months = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
    var mIdx = Math.max(0, Math.min(11, Number(p[1]) - 1));
    return months[mIdx] + " " + String(p[0]).slice(2);
  }

  function readAnalyticsMonths() {
    var sel = el("dg-fin-analytics-months");
    var n = sel ? parseInt(String(sel.value || "12"), 10) : state.analyticsMonths;
    if (![6, 12, 24].includes(n)) n = 12;
    state.analyticsMonths = n;
    try { localStorage.setItem(ANALYTICS_MONTHS_KEY, String(n)); } catch (e) {}
    return n;
  }

  function currentAnalyticsYm() {
    try {
      var parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Moscow",
        year: "numeric",
        month: "2-digit",
      }).formatToParts(new Date());
      var y = "";
      var m = "";
      parts.forEach(function (p) {
        if (p.type === "year") y = p.value;
        if (p.type === "month") m = p.value;
      });
      if (y && m) return y + "-" + m;
    } catch (e) {}
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }

  function completedNetSeries(series) {
    var curYm = currentAnalyticsYm();
    return (Array.isArray(series) ? series : []).filter(function (r) {
      var ym = String((r && r.month) || "").slice(0, 7);
      return /^\d{4}-\d{2}$/.test(ym) && ym < curYm;
    });
  }

  function avgNetFromSeries(rows) {
    if (!rows.length) return 0;
    var sum = 0;
    rows.forEach(function (r) { sum += Number(r.net) || 0; });
    return sum / rows.length;
  }

  function netDynamics(rows) {
    if (!rows || rows.length < 2) return null;
    var n = rows.length;
    var last = rows[n - 1];
    var prev = rows[n - 2];
    var recent = Number(last.net) || 0;
    var base = Number(prev.net) || 0;
    var delta = recent - base;
    var usePct = Math.abs(base) >= 100000;
    var pct = usePct ? (delta / Math.abs(base)) * 100 : null;
    var dir = delta > 0.5 ? "up" : delta < -0.5 ? "down" : "flat";
    return {
      recent: recent,
      base: base,
      delta: delta,
      pct: pct,
      dir: dir,
      label: fmtMonthLabel(last.month) + " к " + fmtMonthLabel(prev.month),
    };
  }

  function renderAnalyticsKpis(totals, currency, series) {
    var box = el("dg-fin-analytics-kpis");
    if (!box) return;
    var t = totals || {};
    var cur = currency || "RUB";
    var net = Number(t.net) || 0;
    var done = completedNetSeries(series);
    var avg = avgNetFromSeries(done);
    var dyn = netDynamics(done);
    var avgTxt = done.length
      ? "ср. " + fmtMoney(avg, cur) + " / мес."
      : "вход − исход";
    var dynHtml = "";
    if (dyn) {
      var arrow = dyn.dir === "up" ? "↑" : dyn.dir === "down" ? "↓" : "→";
      var word = dyn.dir === "up" ? "растёт" : dyn.dir === "down" ? "снижается" : "стабильно";
      var mag =
        dyn.pct != null && Number.isFinite(dyn.pct)
          ? (dyn.pct > 0 ? "+" : "") + (Math.round(dyn.pct * 10) / 10) + "%"
          : (dyn.delta >= 0 ? "+" : "") + fmtMoney(dyn.delta, cur);
      dynHtml =
        '<div class="dg-fin-kpi-dyn is-' +
        dyn.dir +
        '" title="' +
        esc(dyn.label) +
        '">' +
        esc(arrow + " " + word + " · " + mag) +
        '<span class="dg-fin-kpi-dyn-hint"> ' +
        esc(dyn.label) +
        "</span></div>";
    }
    box.innerHTML =
      '<div class="dg-fin-kpi is-in"><div class="dg-fin-kpi-label">Входящие</div><div class="dg-fin-kpi-value">' +
      esc(fmtMoney(t.in, cur)) +
      '</div><div class="dg-fin-kpi-sub">поступления</div></div>' +
      '<div class="dg-fin-kpi is-out"><div class="dg-fin-kpi-label">Исходящие</div><div class="dg-fin-kpi-value">' +
      esc(fmtMoney(t.out, cur)) +
      '</div><div class="dg-fin-kpi-sub">списания</div></div>' +
      '<div class="dg-fin-kpi is-net"><div class="dg-fin-kpi-label">Чистый поток</div><div class="dg-fin-kpi-value ' +
      (net >= 0 ? "is-pos" : "is-neg") +
      '">' +
      esc(fmtMoney(net, cur)) +
      '</div><div class="dg-fin-kpi-sub">' +
      esc(avgTxt) +
      (done.length ? " · полные мес." : "") +
      "</div>" +
      dynHtml +
      "</div>" +
      '<div class="dg-fin-kpi"><div class="dg-fin-kpi-label">Операций</div><div class="dg-fin-kpi-value">' +
      esc(String(Number(t.count) || 0)) +
      '</div><div class="dg-fin-kpi-sub">в снимке за период</div></div>';
  }

  function monthBounds(ym) {
    var s = String(ym || "");
    var p = s.split("-");
    if (p.length !== 2) return null;
    var y = parseInt(p[0], 10);
    var m = parseInt(p[1], 10);
    if (!y || !m || m < 1 || m > 12) return null;
    var lastDay = new Date(y, m, 0).getDate();
    var mm = String(m).padStart(2, "0");
    return {
      from: y + "-" + mm + "-01",
      to: y + "-" + mm + "-" + String(lastDay).padStart(2, "0"),
      label: fmtMonthLabel(s),
    };
  }

  function applyChartMonthToFilters(ym, directionHint) {
    var bounds = monthBounds(ym);
    if (!bounds) return;
    readPendingFromForm();
    state.pending.date_from = bounds.from;
    state.pending.date_to = bounds.to;
    if (directionHint === "in" || directionHint === "out") {
      state.pending.direction = directionHint;
    }
    writeFormFromPending();
    markDirty();
    var dirTxt =
      directionHint === "in" ? " · входящие" : directionHint === "out" ? " · исходящие" : "";
    toast(
      "info",
      "Фильтр дат: " + bounds.from + " → " + bounds.to + dirTxt + ". Нажмите «Применить»."
    );
    var filtersBody = el("dg-fin-filters-body");
    if (filtersBody && filtersBody.style.display === "none") {
      var tgl = el("dg-fin-filters-toggle");
      if (tgl) tgl.click();
    }
    var fromEl = el("dg-fin-date-from");
    if (fromEl && fromEl.scrollIntoView) {
      try {
        fromEl.scrollIntoView({ behavior: "smooth", block: "center" });
      } catch (e) {
        fromEl.scrollIntoView(true);
      }
    }
  }

  function renderMonthlyChart(series, currency) {
    var canvas = el("dg-fin-analytics-chart");
    var emptyEl = el("dg-fin-analytics-empty");
    if (!canvas) return;
    var rows = Array.isArray(series) ? series : [];
    var hasAny = rows.some(function (r) {
      return Number(r.in) > 0 || Number(r.out) > 0;
    });
    if (!hasAny) {
      if (monthlyChart) {
        try { monthlyChart.destroy(); } catch (e) {}
        monthlyChart = null;
      }
      canvas.style.display = "none";
      if (emptyEl) emptyEl.classList.remove("d-none");
      return;
    }
    canvas.style.display = "";
    if (emptyEl) emptyEl.classList.add("d-none");

    var labels = rows.map(function (r) { return fmtMonthLabel(r.month); });
    var inVals = rows.map(function (r) { return Number(r.in) || 0; });
    var outVals = rows.map(function (r) { return Number(r.out) || 0; });
    var netVals = rows.map(function (r) { return Number(r.net) || 0; });
    var cur = currency || "RUB";

    loadChartJs()
      .then(function (Chart) {
        if (monthlyChart) {
          try { monthlyChart.destroy(); } catch (e) {}
          monthlyChart = null;
        }
        var ctx = canvas.getContext("2d");
        var gradIn = ctx.createLinearGradient(0, 0, 0, 260);
        gradIn.addColorStop(0, "rgba(34, 197, 94, 0.85)");
        gradIn.addColorStop(1, "rgba(34, 197, 94, 0.35)");
        var gradOut = ctx.createLinearGradient(0, 0, 0, 260);
        gradOut.addColorStop(0, "rgba(239, 68, 68, 0.8)");
        gradOut.addColorStop(1, "rgba(239, 68, 68, 0.32)");

        monthlyChart = new Chart(ctx, {
          type: "bar",
          data: {
            labels: labels,
            datasets: [
              {
                type: "bar",
                label: "Входящие",
                data: inVals,
                backgroundColor: gradIn,
                borderColor: "rgba(22, 163, 74, 1)",
                borderWidth: 1,
                borderRadius: 6,
                maxBarThickness: 22,
                order: 2,
              },
              {
                type: "bar",
                label: "Исходящие",
                data: outVals,
                backgroundColor: gradOut,
                borderColor: "rgba(185, 28, 28, 1)",
                borderWidth: 1,
                borderRadius: 6,
                maxBarThickness: 22,
                order: 2,
              },
              {
                type: "line",
                label: "Чистый поток",
                data: netVals,
                borderColor: "#3f6ad8",
                backgroundColor: "rgba(63, 106, 216, 0.12)",
                borderWidth: 2.5,
                pointRadius: 3.5,
                pointHoverRadius: 5,
                pointBackgroundColor: "#fff",
                pointBorderColor: "#3f6ad8",
                pointBorderWidth: 2,
                tension: 0.35,
                yAxisID: "y",
                order: 1,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            onHover: function (evt, elements) {
              var t = evt && evt.native && evt.native.target;
              if (t && t.style) t.style.cursor = elements && elements.length ? "pointer" : "default";
            },
            onClick: function (evt) {
              var chart = this;
              var pts =
                chart.getElementsAtEventForMode(evt, "nearest", { intersect: true }, true) || [];
              if (!pts.length) {
                pts =
                  chart.getElementsAtEventForMode(evt, "index", { intersect: false }, true) || [];
              }
              if (!pts.length) return;
              var hit = pts[0];
              for (var pi = 0; pi < pts.length; pi++) {
                if (pts[pi].datasetIndex === 0 || pts[pi].datasetIndex === 1) {
                  hit = pts[pi];
                  break;
                }
              }
              var idx = hit.index;
              var src = rows[idx];
              if (!src || !src.month) return;
              var ds = hit.datasetIndex;
              var dirHint = "";
              if (ds === 0) dirHint = "in";
              else if (ds === 1) dirHint = "out";
              applyChartMonthToFilters(src.month, dirHint);
            },
            plugins: {
              legend: {
                position: "top",
                align: "end",
                labels: { boxWidth: 12, boxHeight: 12, usePointStyle: true, font: { size: 12 } },
              },
              tooltip: {
                callbacks: {
                  label: function (ctx2) {
                    var v = Number(ctx2.parsed.y || 0);
                    return ctx2.dataset.label + ": " + fmtMoney(v, cur);
                  },
                  afterBody: function (items) {
                    var idx = items && items[0] ? items[0].dataIndex : -1;
                    var src = rows[idx] || {};
                    return [
                      "Операций в: " + (Number(src.count_in) || 0),
                      "Операций исх.: " + (Number(src.count_out) || 0),
                      "Клик — даты месяца в фильтр",
                    ];
                  },
                },
              },
            },
            scales: {
              x: {
                ticks: { font: { size: 11 }, color: "#64748b" },
                grid: { display: false },
              },
              y: {
                beginAtZero: true,
                ticks: {
                  font: { size: 11 },
                  color: "#64748b",
                  callback: function (v) {
                    var n = Number(v);
                    if (Math.abs(n) >= 1000000) return (n / 1000000).toLocaleString("ru-RU", { maximumFractionDigits: 1 }) + " млн";
                    if (Math.abs(n) >= 1000) return (n / 1000).toLocaleString("ru-RU", { maximumFractionDigits: 0 }) + " тыс";
                    return n.toLocaleString("ru-RU");
                  },
                },
                grid: { color: "rgba(15, 23, 42, 0.06)" },
              },
            },
          },
        });
      })
      .catch(function (e) {
        canvas.style.display = "none";
        if (emptyEl) {
          emptyEl.classList.remove("d-none");
          emptyEl.textContent = "График недоступен: " + (e && e.message ? e.message : e);
        }
      });
  }

  function loadMonthlyAnalytics() {
    var months = readAnalyticsMonths();
    var scope = el("dg-fin-analytics-scope");
    var org = normalizeOrgs(state.applied.org);
    var acc = state.applied.account_id;
    if (scope) {
      var bits = [];
      if (org.length) bits.push(org.map(function (c) { return orgLabelByCode(c) || c; }).join(", "));
      if (acc) {
        var a = (state.accounts || []).find(function (x) { return x.account_id === acc; });
        bits.push(a ? accountDisplayName(a) : maskAcc(acc));
      }
      scope.textContent = bits.length ? bits.join(" · ") : "Все организации";
    }
    var q = new URLSearchParams();
    q.set("months", String(months));
    appendOrgQuery(q, org);
    if (acc) q.set("account_id", acc);
    if (state.applied.include_internal) q.set("include_internal", "1");
    return fetch("/api/finance/analytics/monthly?" + q.toString(), { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.success) throw new Error((j && j.error) || "analytics");
        renderAnalyticsKpis(j.totals, j.currency, j.series || []);
        renderMonthlyChart(j.series || [], j.currency);
        return j;
      })
      .catch(function (e) {
        var emptyEl = el("dg-fin-analytics-empty");
        var canvas = el("dg-fin-analytics-chart");
        if (canvas) canvas.style.display = "none";
        if (emptyEl) {
          emptyEl.classList.remove("d-none");
          emptyEl.textContent = "Не удалось загрузить аналитику: " + (e.message || String(e));
        }
      });
  }

  function readCpLimit() {
    var sel = el("dg-fin-cp-limit");
    var n = sel ? parseInt(String(sel.value || "8"), 10) : 8;
    if (![5, 8, 12].includes(n)) n = 8;
    try { localStorage.setItem(CP_LIMIT_KEY, String(n)); } catch (e) {}
    return n;
  }

  function cpInitials(name) {
    var parts = String(name || "")
      .replace(/[«»"']/g, "")
      .trim()
      .split(/\s+/)
      .filter(Boolean);
    if (!parts.length) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
  }

  function applyCounterpartyToFilters(name, direction, inn) {
    var n = String(name || "").trim();
    var innStr = String(inn || "").replace(/\s+/g, "").trim();
    // По ИНН ловим все варианты названия одной конторы в выписке.
    var q = innStr || (n && n !== "(без названия)" ? n : "");
    if (!q) return;
    readPendingFromForm();
    state.pending.search = q;
    if (direction === "in" || direction === "out") state.pending.direction = direction;
    writeFormFromPending();
    markDirty();
    toast(
      "info",
      "Фильтр: «" +
        (innStr ? "ИНН " + innStr : n) +
        "»" +
        (direction === "in" ? " · входящие" : direction === "out" ? " · исходящие" : "") +
        ". Нажмите «Применить»."
    );
    var filtersBody = el("dg-fin-filters-body");
    if (filtersBody && filtersBody.style.display === "none") {
      var tgl = el("dg-fin-filters-toggle");
      if (tgl) tgl.click();
    }
  }

  function renderCpList(listEl, rows, direction, currency) {
    if (!listEl) return;
    var items = Array.isArray(rows) ? rows : [];
    if (!items.length) {
      listEl.innerHTML = '<div class="dg-fin-cp-empty">Нет данных за период</div>';
      return;
    }
    var maxAmt = Math.max.apply(
      null,
      items.map(function (r) { return Number(r.amount) || 0; }).concat([1])
    );
    listEl.innerHTML = items
      .map(function (r) {
        var amt = Number(r.amount) || 0;
        var pct = Math.max(4, Math.round((amt / maxAmt) * 100));
        var rank = Number(r.rank) || 0;
        var topCls = rank === 1 ? " is-top1" : rank === 2 ? " is-top2" : rank === 3 ? " is-top3" : "";
        var inn = r.inn ? "ИНН " + r.inn : "без ИНН";
        var cnt = Number(r.count) || 0;
        var share = r.share != null ? String(r.share).replace(".", ",") + "%" : "";
        return (
          '<button type="button" class="dg-fin-cp-row' +
          topCls +
          '" data-dg-cp-name="' +
          esc(r.name) +
          '" data-dg-cp-inn="' +
          esc(r.inn || "") +
          '" data-dg-cp-dir="' +
          esc(direction) +
          '" data-dg-notify-start="Подставляем контрагента в фильтр…">' +
          '<span class="dg-fin-cp-rank">' +
          esc(String(rank)) +
          "</span>" +
          '<span class="dg-fin-cp-avatar" aria-hidden="true">' +
          esc(cpInitials(r.name)) +
          "</span>" +
          '<span class="dg-fin-cp-meta">' +
          '<div class="dg-fin-cp-name" title="' +
          esc(r.name) +
          '">' +
          esc(r.name) +
          "</div>" +
          '<div class="dg-fin-cp-sub">' +
          esc(inn) +
          " · " +
          esc(String(cnt)) +
          " оп.</div>" +
          "</span>" +
          '<span class="dg-fin-cp-right">' +
          '<div class="dg-fin-cp-amount">' +
          esc(fmtMoney(amt, currency)) +
          "</div>" +
          '<div class="dg-fin-cp-bar"><span style="width:' +
          pct +
          '%"></span></div>' +
          (share
            ? '<div class="dg-fin-cp-share">' + esc(share) + " от суммы</div>"
            : "") +
          "</span>" +
          "</button>"
        );
      })
      .join("");
  }

  function loadCounterparties() {

    var scope = el("dg-fin-cp-scope");

    if (state.applied.date_from) q.set("date_from", state.applied.date_from);
    if (state.applied.date_to) q.set("date_to", state.applied.date_to);

    return fetch("/api/finance/analytics/counterparties?" + q.toString(), { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.success) throw new Error((j && j.error) || "counterparties");
        var cur = j.currency || "RUB";
        if (scope) {
          var bits = [];
          if (j.date_from && j.date_to) bits.push(j.date_from + " → " + j.date_to);

        if (inL) {
          inL.innerHTML =
            '<div class="dg-fin-cp-empty">Не удалось загрузить: ' +

  function bindCollapse(btnId, bodyId, storageKey) {
    var btn = el(btnId);
    var body = el(bodyId);
    if (!btn || !body) return;
    function apply() {
      var c = false;
      try { c = localStorage.getItem(storageKey) === "1"; } catch (e) {}
      body.style.display = c ? "none" : "";
      btn.textContent = c ? "Развернуть" : "Свернуть";
    }
    btn.addEventListener("click", function () {
      var nowHidden = body.style.display === "none";
      try { localStorage.setItem(storageKey, nowHidden ? "0" : "1"); } catch (e) {}
      apply();
    });
    apply();
  }

  function bindHeaderSearchMirror() {
    var a = el("dg-fin-search");
    var b = el("dg-fin-table-search-mirror");
    if (!a || !b) return;
    var syncing = false;
    function sync(from, to) {
      if (syncing) return;
      syncing = true;
      to.value = from.value;
      syncing = false;
      readPendingFromForm();
      markDirty();
    }
    a.addEventListener("input", function () { sync(a, b); });
    b.addEventListener("input", function () { sync(b, a); });
    function onEnter(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        var btn = el("dg-fin-apply");
        if (btn) btn.click();
      }
      if (e.key === "Escape") {
        a.value = "";
        b.value = "";
        commitFilters();
      }
    }
    a.addEventListener("keydown", onEnter);
    b.addEventListener("keydown", onEnter);
  }

  function renderColumnControls() {
    var list = el("dg-fin-columns-list");
    if (!list) return;
    list.innerHTML = FIN_COLS.map(function (c) {
      var on = visibleCols.indexOf(c[0]) >= 0;
      return '<label><input type="checkbox" data-fin-col="' + esc(c[0]) + '"' + (on ? " checked" : "") + "> " + esc(c[1]) + "</label>";
    }).join("");
    list.querySelectorAll("input[data-fin-col]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var k = cb.getAttribute("data-fin-col");
        if (cb.checked) {
          if (visibleCols.indexOf(k) < 0) visibleCols.push(k);
        } else {
          visibleCols = visibleCols.filter(function (x) { return x !== k; });
          if (!visibleCols.length) visibleCols = DEFAULT_VISIBLE.slice();
        }
        saveVisibleCols(visibleCols);
        buildThead();
        renderTable();
      });
    });
  }
  function renderWidthControls() {
    var list = el("dg-fin-widths-list");
    if (!list) return;
    list.innerHTML = FIN_COLS.map(function (c) {
      var w = colWidths[c[0]] || DEFAULT_WIDTHS[c[0]] || 140;
      return '<label>' + esc(c[1]) + ' <input type="number" min="60" max="800" value="' + w + '" data-fin-w="' + esc(c[0]) + '"></label>';
    }).join("");
    list.querySelectorAll("input[data-fin-w]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var n = parseInt(inp.value, 10);
        if (n < 60) n = 60;
        if (n > 800) n = 800;
        colWidths[inp.getAttribute("data-fin-w")] = n;
        saveWidths(colWidths);
        buildThead();
        renderTable();
      });
    });
  }
  function columnControls() {
    var wrap = el("dg-fin-toolbox-panels");
    var colsP = el("dg-fin-columns-panel");
    var wP = el("dg-fin-widths-panel");
    function syncWrap() {
      var open = (colsP && colsP.classList.contains("open")) || (wP && wP.classList.contains("open"));
      if (wrap) wrap.classList.toggle("d-none", !open);
    }
    function closeAll() {
      if (colsP) colsP.classList.remove("open");
      if (wP) wP.classList.remove("open");
      syncWrap();
    }
    el("dg-fin-columns-toggle").addEventListener("click", function (e) {
      e.stopPropagation();
      var on = colsP.classList.toggle("open");
      if (on && wP) wP.classList.remove("open");
      syncWrap();
    });
    el("dg-fin-widths-toggle").addEventListener("click", function (e) {
      e.stopPropagation();
      var on = wP.classList.toggle("open");
      if (on && colsP) colsP.classList.remove("open");
      syncWrap();
    });
    document.addEventListener("click", function (e) {
      if (wrap && wrap.contains(e.target)) return;
      if (e.target && (e.target.id === "dg-fin-columns-toggle" || e.target.id === "dg-fin-widths-toggle")) return;
      closeAll();
    });
    el("dg-fin-columns-all").addEventListener("click", function () {
      visibleCols = DEFAULT_VISIBLE.slice();
      saveVisibleCols(visibleCols);
      renderColumnControls();
      buildThead();
      renderTable();
    });
    el("dg-fin-columns-none").addEventListener("click", function () {
      visibleCols = ["booked_date", "amount", "purpose"];
      saveVisibleCols(visibleCols);
      renderColumnControls();
      buildThead();
      renderTable();
    });
    el("dg-fin-columns-default").addEventListener("click", function () {
      visibleCols = DEFAULT_VISIBLE.slice();
      saveVisibleCols(visibleCols);
      renderColumnControls();
      buildThead();
      renderTable();
    });
    el("dg-fin-widths-default").addEventListener("click", function () {
      colWidths = Object.assign({}, DEFAULT_WIDTHS);
      saveWidths(colWidths);
      renderWidthControls();
      buildThead();
      renderTable();
    });
    renderColumnControls();
    renderWidthControls();
  }

  function buildThead() {
    var thead = el("dg-fin-thead");
    var cg = el("dg-fin-colgroup");
    if (!thead) return;
    var cols = FIN_COLS.filter(function (c) { return visibleCols.indexOf(c[0]) >= 0; });
    if (cg) {
      cg.innerHTML = cols.map(function (c) {
        var w = colWidths[c[0]] || DEFAULT_WIDTHS[c[0]] || 140;
        return '<col style="width:' + w + 'px;min-width:' + w + 'px">';
      }).join("");
    }
    thead.innerHTML = "<tr>" + cols.map(function (c) {
      return '<th class="dg-fin-sortable" data-fin-sort="' + esc(c[0]) + '">' + esc(c[1]) + "</th>";
    }).join("") + "</tr>";
    thead.querySelectorAll("th.dg-fin-sortable").forEach(function (th) {
      th.addEventListener("click", function () {
        if (hasTextSelection()) return;
        var k = th.getAttribute("data-fin-sort");
        if (state.sortKey === k) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        else { state.sortKey = k; state.sortDir = "asc"; }
        renderTable();
      });
    });
  }

  function cellValue(row, key) {
    if (key === "amount") return Number(row.amount);
    if (key === "booked_date") return String(row.booked_date || row.booked_at || "");
    if (key === "org") return rowOrgLabel(row);
    if (key === "bank") return BANK_LABELS[String(row.bank || "tochka").toLowerCase()] || String(row.bank || "");
    return String(row[key] == null ? "" : row[key]);
  }
  function rowOrgLabel(row) {
    var code = String((row && row.customer_code) || "").trim();
    if (code) {
      var full = orgFullName(code, "");
      if (full) return full;
    }
    var fromApi = String((row && (row.org || row.org_label)) || "").trim();
    if (fromApi) return fromApi;
    return code ? orgFullName(code, code) : "";
  }
  function renderCell(row, key) {
    if (key === "amount") {
      var cls = row.direction === "out" ? "dg-fin-dir-out" : "dg-fin-dir-in";
      var mark =
        row.chart_excluded
          ? '<span class="dg-fin-chart-excl" title="Не входит в график и аналитику по умолчанию (внутренний оборот: ' +
            esc(row.chart_exclude_reason || "внутр.") +
            ')">не в графике</span>'
          : "";
      return (
        '<span class="' +
        cls +
        '">' +
        esc(fmtMoney(row.amount, row.currency)) +
        "</span>" +
        (mark ? " " + mark : "")
      );
    }
    if (key === "direction") {
      var dirTxt = row.direction === "out" ? "Исходящий" : "Входящий";
      if (row.chart_excluded) {
        return (
          esc(dirTxt) +
          ' <span class="dg-fin-chart-excl-dot" title="Не в графике: ' +
          esc(row.chart_exclude_reason || "внутр.") +
          '" aria-label="Не в графике">●</span>'
        );
      }
      return esc(dirTxt);
    }
    if (key === "org") {
      return esc(rowOrgLabel(row) || "—");
    }
    if (key === "bank") {
      return esc(BANK_LABELS[String(row.bank || "tochka").toLowerCase()] || row.bank || "—");
    }
    if (key === "account_number") {
      return esc(maskAcc(row.account_number || row.account_id));
    }
    if (key === "booked_date") {
      return esc(row.booked_date || String(row.booked_at || "").slice(0, 10));
    }
    return esc(row[key] || "");
  }
  function renderTable() {
    var tb = el("dg-fin-tbody");
    if (!tb) return;
    var cols = FIN_COLS.filter(function (c) { return visibleCols.indexOf(c[0]) >= 0; });
    var rows = state.rows.slice();
    var sk = state.sortKey;
    var dir = state.sortDir === "asc" ? 1 : -1;
    rows.sort(function (a, b) {
      var va = cellValue(a, sk);
      var vb = cellValue(b, sk);
      if (typeof va === "number" && typeof vb === "number") return (va - vb) * dir;
      return String(va).localeCompare(String(vb), "ru") * dir;
    });
    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="' + Math.max(1, cols.length) + '" class="text-muted">Нет проводок по фильтрам. Обновите из банка, если снимок пуст.</td></tr>';
    } else {
      tb.innerHTML = rows.map(function (r) {
        var trCls = r.chart_excluded ? ' class="dg-fin-row-chart-excl"' : "";
        return "<tr" + trCls + ">" + cols.map(function (c) { return "<td>" + renderCell(r, c[0]) + "</td>"; }).join("") + "</tr>";
      }).join("");
    }
    var st = el("dg-fin-pager-status");
    if (st) {
      st.textContent = "Найдено: " + state.total + "; страница " + state.page + "/" + state.pages + "; показано: " + state.shown;
    }
  }

  var BANK_LABELS = { tochka: "Точка", raiffeisen: "Райффайзен" };

  function accountAvailable(a) {
    var n = a && a.available != null ? Number(a.available) : Number(a && a.balance);
    return Number.isFinite(n) ? n : null;
  }
  function accountBlocked(a) {
    var n = a && a.blocked != null ? Number(a.blocked) : null;
    return Number.isFinite(n) ? n : null;
  }
  function sumByCurrency(list, pick) {
    var map = Object.create(null);
    (list || []).forEach(function (a) {
      var n = pick(a);
      if (n == null) return;
      var cur = String(a.currency || "RUB").toUpperCase() || "RUB";
      map[cur] = (map[cur] || 0) + n;
    });
    return map;
  }
  function moneyMapLines(map) {
    return Object.keys(map)
      .sort(function (a, b) {
        if (a === "RUB") return -1;
        if (b === "RUB") return 1;
        return a.localeCompare(b);
      })
      .map(function (cur) {
        return { currency: cur, amount: map[cur] };
      });
  }
  function formatMoneyList(lines) {
    if (!lines.length) return "—";
    return lines.map(function (x) { return fmtMoney(x.amount, x.currency); }).join(" · ");
  }
  function latestSyncedAt(list) {
    var best = null;
    (list || []).forEach(function (a) {
      if (!a || !a.synced_at) return;
      var t = String(a.synced_at);
      if (!best || t > best) best = t;
    });
    return best;
  }
  function groupAccountsByBank(list) {
    var order = [];
    var map = Object.create(null);
    (list || []).forEach(function (a) {
      var bankCode = String((a && a.bank) || "tochka").toLowerCase();
      var bankLabel = BANK_LABELS[bankCode] || "Точка";
      var org = String((a && a.org_label) || "").trim();
      var customer = String((a && a.customer_code) || "").trim();
      // Юрлицо (customer_code), а не JWT: один ключ может покрывать Прайм + Вилмед
      var key = bankCode + "|" + (customer || org || String((a && a.credential_id) || "").trim() || "unknown");
      if (!map[key]) {
        map[key] = {
          key: key,
          bank_code: bankCode,
          bank_label: bankLabel,
          org_label: org || "Организация",
          customer_code: customer,
          credential_id: String((a && a.credential_id) || "").trim(),
          accounts: [],
        };
        order.push(key);
      }
      if (org) map[key].org_label = org;
      map[key].accounts.push(a);
    });
    return order.map(function (k) {
      var g = map[k];
      g.display_full = orgFullName(g.customer_code, g.org_label);
      g.display_short = orgShortName(g.customer_code, g.org_label);
      g.display_name = g.display_short;
      g.accounts.sort(sortAccountsForDisplay);
      return g;
    });
  }

  function sortAccountsForDisplay(a, b) {
    var fa = a && a.is_fund ? 1 : 0;
    var fb = b && b.is_fund ? 1 : 0;
    if (fa !== fb) return fa - fb;
    var aa = accountAvailable(a);
    var bb = accountAvailable(b);
    var na = aa == null ? -1 : aa;
    var nb = bb == null ? -1 : bb;
    if (nb !== na) return nb - na;
    return String((a && a.account_number) || "").localeCompare(String((b && b.account_number) || ""), "ru");
  }

  var SUBTYPE_LABELS = {
    CurrentAccount: "Расчётный",
    Savings: "Сберегательный",
    CreditCard: "Кредитная карта",
    PrePaidCard: "Предоплаченная",
    Loan: "Кредит",
    Mortgage: "Ипотека",
    Special: "Специальный"
  };

  function subtypeLabel(a) {
    var st = String((a && a.account_sub_type) || "").trim();
    if (SUBTYPE_LABELS[st]) return SUBTYPE_LABELS[st];

  }

  function accountDisplayName(a) {
    var custom = String((a && a.custom_name) || "").trim();
    if (custom) return custom;
    if (a && a.is_fund) return "Фонд";

    return "Счёт";

  function renderBalances() {
    var totalWrap = el("dg-fin-total-wrap");

    if (!state.accounts.length) {
      totalWrap.innerHTML = "";
      banksWrap.innerHTML =

    }

    var viewAccounts = filteredAccounts(state.applied.org);
    if (!viewAccounts.length) {
      totalWrap.innerHTML = "";
      banksWrap.innerHTML =
        '<p class="text-muted small mb-0">Нет счетов для выбранной организации. Смените фильтр и нажмите «Применить».</p>';

    var availLines = moneyMapLines(sumByCurrency(viewAccounts, accountAvailable));

    var groups = groupAccountsByBank(viewAccounts);
    banksWrap.innerHTML = groups
      .map(function (g) {

        var checkingN = g.accounts.filter(function (a) { return !a.is_fund; }).length;
        var fundN = g.accounts.length - checkingN;
        var metaBits = [];

        var cards = g.accounts
          .map(function (a) {

            var dispName = accountDisplayName(a);
            var stLab = subtypeLabel(a);
            var mask = maskAcc(a.account_number || a.account_id);
            var fullNum = String(a.account_number || a.account_id || "").trim();
            var avail = accountAvailable(a);
            var blockedAmt = accountBlocked(a);
            var typeText = isFund ? "Фонд" : stLab || "Счёт";
            var isZero = avail == null || Number(avail) === 0;
            var blockedHtml =

                ? '<div class="dg-fin-acc-blocked">Заблок. ' + esc(fmtMoney(blockedAmt, a.currency)) + "</div>"
                : "";
            var typePillCls =

            var typePill = state.canWrite

                '" data-custom-name="' +

                '">' +
                '<span class="dg-fin-acc-title dg-fin-name-text is-editable dg-fin-acc-name-hit" title="Клик — переименовать">' +
                esc(dispName) +

                '<button type="button" class="dg-fin-name-edit-btn dg-fin-acc-name-edit" title="Переименовать" aria-label="Переименовать">' +

              : '<div class="dg-fin-acc-title-row"><span class="dg-fin-acc-title dg-fin-name-text">' +

              '<div class="col-sm-6 col-lg-4 col-xl-3">' +

              '" data-account-id="' +

              '" title="' +
              esc(fullNum || mask) +
              '">' +
              '<div class="card-body">' +
              '<div class="dg-fin-acc-top">' +
              typePill +
              '<span class="dg-fin-acc-mask">' +
              esc(mask) +
              "</span>" +
              "</div>" +
              titleHtml +

          .join("");
        return (
          '<div class="dg-fin-bank-block" data-fin-bank="' +
          esc(g.key) +
          '" data-customer-code="' +
          esc(g.customer_code || "") +
          '">' +
          '<div class="dg-fin-bank-head">' +
          '<div class="dg-fin-bank-head-left">' +
          '<span class="dg-fin-bank-pill dg-fin-bank-pill-lg' +
          (g.bank_code === "raiffeisen" ? " is-raiffeisen" : "") +
          '">' +
          esc(g.bank_label) +
          "</span>" +
          "<div class=\"dg-fin-bank-title-wrap\">" +
          (state.canWrite && g.customer_code
            ? '<div class="dg-fin-name-view" data-customer-code="' +
              esc(g.customer_code) +
              '" data-bank-fallback="' +
              esc(g.org_label || "") +
              '" data-full-name="' +
              esc(getOrgAliasEntry(g.customer_code).full || "") +
              '" data-short-name="' +
              esc(getOrgAliasEntry(g.customer_code).short || "") +
              '">' +
              '<p class="dg-fin-bank-title dg-fin-name-text is-editable dg-fin-org-name-hit" title="Клик — полное и короткое название">' +
              esc(g.display_short || g.org_label || "Организация") +
              "</p>" +
              '<button type="button" class="dg-fin-name-edit-btn dg-fin-org-name-edit" title="Полное и короткое название" aria-label="Переименовать">' +
              '<i class="pe-7s-pen" aria-hidden="true"></i></button>' +
              "</div>"
            : '<p class="dg-fin-bank-title">' + esc(g.display_short || g.org_label || "Организация") + "</p>") +
          '<p class="dg-fin-bank-meta mb-0">' +
          esc(metaBits.join(" · ") || g.accounts.length + " счёт(а)") +
          (g.org_label && g.display_full && g.display_full !== g.org_label
            ? " · в банке: " + esc(g.org_label)
            : g.display_full && g.display_short && g.display_full !== g.display_short
              ? " · полное: " + esc(g.display_full)
              : "") +
          "</p>" +
          "</div></div>" +
          '<p class="dg-fin-bank-sum">' +
          esc(bankAvail) +
          "</p>" +
          "</div>" +
          '<div class="row g-3 dg-fin-balances-row">' +
          cards +
          "</div></div>"
        );
      })
      .join("");
  }

  function filteredAccounts(orgCodes) {
    var codes = normalizeOrgs(orgCodes);
    if (!codes.length) return (state.accounts || []).slice();
    return (state.accounts || []).filter(function (a) {
      return codes.indexOf(String(a.customer_code || "")) >= 0;
    });
  }
  function getOrgAliasEntry(customerCode) {
    var code = String(customerCode || "").trim();
    var raw = code && state.orgAliases ? state.orgAliases[code] : null;
    if (!raw) return { full: "", short: "" };
    if (typeof raw === "string") {
      var one = String(raw).trim();
      return { full: one, short: one };
    }
    return {
      full: String(raw.full || "").trim(),
      short: String(raw.short || "").trim(),
    };
  }
  /** Полное название — фильтр, таблица, аналитика, тосты. */
  function orgFullName(customerCode, fallback) {
    var e = getOrgAliasEntry(customerCode);
    if (e.full) return e.full;
    if (e.short) return e.short;
    return String(fallback || "").trim() || "Организация";
  }
  /** Короткое — шапка карточек балансов (скрин 3). */
  function orgShortName(customerCode, fallback) {
    var e = getOrgAliasEntry(customerCode);
    if (e.short) return e.short;
    if (e.full) return e.full;
    return String(fallback || "").trim() || "Организация";
  }
  function orgDisplayName(customerCode, fallback) {
    return orgFullName(customerCode, fallback);
  }
  function orgLabelByCode(code) {
    var c = String(code || "").trim();
    if (!c) return "";
    var e = getOrgAliasEntry(c);
    if (e.full) return e.full;
    if (e.short) return e.short;
    var hit = (state.accounts || []).find(function (a) {
      return String(a.customer_code || "") === c;
    });
    return hit ? String(hit.org_label || hit.name || c).trim() : c;
  }
  function collectOrgOptions() {
    var map = Object.create(null);
    var banks = Object.create(null);
    (state.accounts || []).forEach(function (a) {
      var code = String(a.customer_code || "").trim();
      if (!code) return;
      if (!map[code]) map[code] = orgFullName(code, a.org_label || code);
      var bank = String(a.bank || "tochka").toLowerCase();
      var lab = BANK_LABELS[bank] || bank;
      if (!banks[code]) banks[code] = [];
      if (banks[code].indexOf(lab) < 0) banks[code].push(lab);
    });
    var nameCount = Object.create(null);
    Object.keys(map).forEach(function (code) {
      var n = String(map[code] || "").toLowerCase();
      nameCount[n] = (nameCount[n] || 0) + 1;
    });
    var codes = Object.keys(map).sort(function (a, b) {
      return map[a].localeCompare(map[b], "ru");
    });
    return { map: map, banks: banks, nameCount: nameCount, codes: codes };
  }
  function orgOptionLabel(code) {
    var opt = collectOrgOptions();
    var name = opt.map[code] || orgLabelByCode(code) || code;
    var nKey = String(name || "").toLowerCase();
    var banks = opt.banks[code] || [];
    if ((opt.nameCount[nKey] || 0) > 1 && banks.length) {
      return name + " · " + banks.join("/");
    }
    if (banks.length > 1) return name + " · " + banks.join("/");
    return name;
  }
  function updateOrgBtnLabel() {
    var btn = el("dg-fin-org-btn");
    if (btn) btn.textContent = orgFilterCaption(state.pending.org);
  }
  function syncOrgChecksFromPending() {
    var picked = normalizeOrgs(state.pending.org);
    document.querySelectorAll("#dg-fin-org-menu input.dg-fin-org-cb").forEach(function (cb) {
      cb.checked = picked.indexOf(String(cb.value || "").trim()) >= 0;
    });
    updateOrgBtnLabel();
  }
  function fillOrgSelect() {
    var menu = el("dg-fin-org-menu");
    if (!menu) return;
    var opt = collectOrgOptions();
    var picked = normalizeOrgs(state.pending.org).filter(function (c) {
      return !!opt.map[c];
    });
    if (picked.length !== normalizeOrgs(state.pending.org).length) state.pending.org = picked;
    if (!opt.codes.length) {
      menu.innerHTML = '<div class="small text-muted px-1 py-1">Нет организаций</div>';
      updateOrgBtnLabel();
      return;
    }
    menu.innerHTML =
      '<button type="button" class="btn btn-link btn-sm p-0 mb-1 dg-fin-org-all">Снять все</button>' +
      opt.codes
        .map(function (code) {
          var banks = (opt.banks[code] || []).join(", ");
          return (
            '<label class="dg-fin-org-item">' +
            '<input type="checkbox" class="form-check-input dg-fin-org-cb" value="' +
            esc(code) +
            '"' +
            (picked.indexOf(code) >= 0 ? " checked" : "") +
            " />" +
            '<span class="dg-fin-org-item-lab">' +
            esc(orgOptionLabel(code)) +
            (banks ? '<span class="dg-fin-org-item-sub">' + esc(banks) + "</span>" : "") +
            "</span></label>"
          );
        })
        .join("");
    updateOrgBtnLabel();
  }
  function fillAccountSelect() {
    var sel = el("dg-fin-account");
    if (!sel) return;
    var cur = state.pending.account_id;
    var org = state.pending.org;
    var sorted = filteredAccounts(org).sort(sortAccountsForDisplay);
    sel.innerHTML =
      '<option value="">Все счета</option>' +
      sorted
        .map(function (a) {
          var lab =
            accountDisplayName(a) +
            " · " +
            maskAcc(a.account_number || a.account_id);
          return '<option value="' + esc(a.account_id) + '">' + esc(lab) + "</option>";
        })
        .join("");
    var stillOk = sorted.some(function (a) { return a.account_id === cur; });
    sel.value = stillOk ? cur : "";
    if (cur && !stillOk) state.pending.account_id = "";
  }

  function saveOrgMeta(customerCode, names, btn) {
    var full = String((names && names.full) || "").trim();
    var short = String((names && names.short) || "").trim();
    var payload = {
      customer_code: customerCode,
      full_name: full,
      short_name: short,
    };
    var run = function () {
      return fetch("/api/finance/org-meta", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then(function (r) {
          return r.json().then(function (j) {
            return { ok: r.ok, j: j };
          });
        })
        .then(function (x) {
          if (!x.ok || !x.j || !x.j.success) {
            throw new Error((x.j && x.j.error) || "Не удалось сохранить название");
          }
          state.orgAliases = x.j.org_aliases && typeof x.j.org_aliases === "object" ? x.j.org_aliases : {};
          fillOrgSelect();
          renderBalances();
          toast(
            "success",
            "Организация: полное «" +
              (x.j.full_name || "—") +
              "», короткое «" +
              (x.j.short_name || "—") +
              "»"
          );
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun && btn) {
      return window.DatagonNotify.busyRun(btn, run);
    }
    return run();
  }

  function saveAccountMeta(accountId, bank, isFund, customName, btn) {
    var payload = {
      account_id: accountId,
      bank: bank || "tochka",
      is_fund: !!isFund,
      custom_name: String(customName || "").trim(),
    };
    var run = function () {
      return fetch("/api/finance/account-meta", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then(function (r) {
          return r.json().then(function (j) {
            return { ok: r.ok, j: j };
          });
        })
        .then(function (x) {
          if (!x.ok || !x.j || !x.j.success) {
            throw new Error((x.j && x.j.error) || "Не удалось сохранить");
          }
          var updated = x.j.account;
          if (updated) {
            state.accounts = state.accounts.map(function (a) {
              return a.account_id === updated.account_id ? Object.assign({}, a, updated) : a;
            });
            fillAccountSelect();
            renderBalances();
          }
          toast(
            "success",
            "Счёт сохранён" +
              (updated && updated.custom_name ? ": " + updated.custom_name : updated && updated.is_fund ? " (фонд)" : "")
          );
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun && btn) {
      return window.DatagonNotify.busyRun(btn, run);
    }
    return run();
  }

  function beginOrgNamesEdit(viewEl) {
    if (!viewEl || viewEl.querySelector(".dg-fin-name-editor")) return;
    var code = viewEl.getAttribute("data-customer-code");
    if (!code) return;
    var entry = getOrgAliasEntry(code);
    var fullCur = entry.full || "";
    var shortCur = entry.short || "";
    var editor = document.createElement("div");
    editor.className = "dg-fin-name-editor dg-fin-org-names-editor";
    editor.innerHTML =
      '<div class="dg-fin-org-names-fields">' +
      '<label class="dg-fin-org-names-label">Полное название' +
      '<input type="text" class="form-control form-control-sm dg-fin-inline-full" maxlength="160" placeholder="для фильтра и таблицы" /></label>' +
      '<label class="dg-fin-org-names-label">Короткое название' +
      '<input type="text" class="form-control form-control-sm dg-fin-inline-short" maxlength="80" placeholder="для карточек балансов" /></label>' +
      "</div>" +
      '<div class="dg-fin-org-names-actions">' +
      '<button type="button" class="btn btn-sm btn-primary dg-fin-inline-save" data-dg-notify-start="Сохраняем названия организации…">OK</button>' +
      '<button type="button" class="btn btn-sm btn-outline-secondary dg-fin-inline-cancel">✕</button>' +
      "</div>";
    var fullInp = editor.querySelector(".dg-fin-inline-full");
    var shortInp = editor.querySelector(".dg-fin-inline-short");
    var saveBtn = editor.querySelector(".dg-fin-inline-save");
    var cancelBtn = editor.querySelector(".dg-fin-inline-cancel");
    fullInp.value = fullCur;
    shortInp.value = shortCur;
    viewEl.replaceChildren(editor);
    fullInp.focus();
    fullInp.select();
    var closed = false;
    function close() {
      if (closed) return;
      closed = true;
      renderBalances();
    }
    function commit() {
      if (closed) return;
      var nextFull = String(fullInp.value || "").trim();
      var nextShort = String(shortInp.value || "").trim();
      if (nextFull === fullCur && nextShort === shortCur) {
        close();
        return;
      }
      closed = true;
      Promise.resolve(saveOrgMeta(code, { full: nextFull, short: nextShort }, saveBtn)).catch(function (e) {
        toast("danger", e.message || String(e));
        closed = false;
        renderBalances();
      });
    }
    saveBtn.addEventListener("click", function (ev) {
      ev.preventDefault();
      commit();
    });
    cancelBtn.addEventListener("click", function (ev) {
      ev.preventDefault();
      close();
    });
    [fullInp, shortInp].forEach(function (inp) {
      inp.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") {
          ev.preventDefault();
          commit();
        } else if (ev.key === "Escape") {
          ev.preventDefault();
          close();
        }
      });
    });
  }

  function beginInlineNameEdit(viewEl, opts) {
    if (!viewEl || viewEl.querySelector(".dg-fin-name-editor")) return;
    var current = String(opts.value || "").trim();
    var fundStart = !!opts.isFund;
    var editor = document.createElement("div");
    editor.className = "dg-fin-name-editor dg-fin-acc-name-editor";
    editor.innerHTML =
      '<input type="text" class="form-control form-control-sm dg-fin-inline-cname" maxlength="120" placeholder="' +
      esc(opts.placeholder || "Название") +
      '" />' +
      '<button type="button" class="btn btn-sm btn-primary dg-fin-inline-save" data-dg-notify-start="' +
      esc(opts.notifyStart || "Сохраняем…") +
      '">OK</button>' +
      '<button type="button" class="btn btn-sm btn-outline-secondary dg-fin-inline-cancel">✕</button>' +
      '<label class="dg-fin-inline-fund-lab">' +
      '<input type="checkbox" class="form-check-input dg-fin-inline-fund" />' +
      "<span>Фонд</span></label>";
    var input = editor.querySelector(".dg-fin-inline-cname");
    var fundInp = editor.querySelector(".dg-fin-inline-fund");
    var saveBtn = editor.querySelector(".dg-fin-inline-save");
    var cancelBtn = editor.querySelector(".dg-fin-inline-cancel");
    input.value = current;
    if (fundInp) fundInp.checked = fundStart;
    viewEl.replaceChildren(editor);
    input.focus();
    input.select();
    var closed = false;
    function close() {
      if (closed) return;
      closed = true;
      renderBalances();
    }
    function fundNow() {
      return !!(fundInp && fundInp.checked);
    }
    function commit() {
      if (closed) return;
      var next = String(input.value || "").trim();
      if (next === current && fundNow() === fundStart) {
        close();
        return;
      }
      closed = true;
      Promise.resolve(opts.onSave(next, saveBtn, fundNow()))
        .catch(function (e) {
          toast("danger", e.message || String(e));
          closed = false;
          renderBalances();
        });
    }
    saveBtn.addEventListener("click", function (ev) {
      ev.preventDefault();
      commit();
    });
    cancelBtn.addEventListener("click", function (ev) {
      ev.preventDefault();
      close();
    });
    input.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") {
        ev.preventDefault();
        commit();
      } else if (ev.key === "Escape") {
        ev.preventDefault();
        close();
      }
    });
  }

  function openFinConfirm(opts) {
    opts = opts || {};

    var text = el("dg-fin-confirm-text");
    var okBtn = el("dg-fin-confirm-ok");
    var cancelBtn = el("dg-fin-confirm-cancel");
    if (!overlay || !okBtn || !cancelBtn) {
      return Promise.resolve(false);
    }
    if (title) title.textContent = opts.title || "Подтверждение";
    if (text) text.textContent = opts.text || "";
    okBtn.textContent = opts.okLabel || "Удалить";
    overlay.classList.remove("d-none");
    return new Promise(function (resolve) {
      function close(v) {
        overlay.classList.add("d-none");
        okBtn.removeEventListener("click", onOk);
        cancelBtn.removeEventListener("click", onCancel);
        overlay.removeEventListener("click", onBackdrop);
        document.removeEventListener("keydown", onKey);
        resolve(v);
      }
      function onOk() { close(true); }
      function onCancel() { close(false); }
      function onBackdrop(ev) { if (ev.target === overlay) close(false); }
      function onKey(ev) { if (ev.key === "Escape") close(false); }
      okBtn.addEventListener("click", onOk);
      cancelBtn.addEventListener("click", onCancel);
      overlay.addEventListener("click", onBackdrop);
      document.addEventListener("keydown", onKey);
    });
  }

  function probe(credentialId, bank) {
    var btn = bank === "raiffeisen" ? el("dg-fin-btn-probe-raiff") : el("dg-fin-btn-probe");
    var t0 = Date.now();
    showActionLog("info", credentialId ? "Проверка ключа…" : bank === "raiffeisen" ? "Проверка Райфа…" : bank === "tochka" ? "Проверка Точки…" : "Проверка банков…");
    var run = function () {
      var url = "/api/finance/probe";
      var qs = [];
      if (credentialId) qs.push("credential_id=" + encodeURIComponent(credentialId));
      if (bank) qs.push("bank=" + encodeURIComponent(bank));
      if (qs.length) url += "?" + qs.join("&");
      return fetch(url, { credentials: "same-origin" })
        .then(function (r) {
          return r.json().then(function (j) {
            return { r: r, j: j };
          });
        })
        .then(function (x) {
          var sec = Math.round((Date.now() - t0) / 1000);
          if (!x.r.ok || !x.j.success) throw new Error((x.j && x.j.error) || ("HTTP " + x.r.status));
          var results = Array.isArray(x.j.results) ? x.j.results : [];
          var html =
            "Связь ок. Всего счетов: " +
            Number(x.j.count || 0) +
            ", ключей: " +
            Number(x.j.credentials_probed || results.length || 0) +
            ". " +
            sec +
            " с.";
          if (results.length) {
            html += "<ul class=\"small mb-0 ps-3 mt-1\">";
            results.forEach(function (r) {
              if (r.error) {
                html += "<li>" + esc(r.label || r.credential_id) + ": ошибка — " + esc(r.error) + "</li>";
              } else {
                html +=
                  "<li>" +
                  esc(r.label || r.credential_id) +
                  ": счетов " +
                  Number(r.count || 0) +
                  "</li>";
              }
            });
            html += "</ul>";
          }
          if (x.j.api_note) html += "<br><span class=\"small text-muted\">" + esc(x.j.api_note) + "</span>";
          showActionLog("success", html, true);
          toast("success", "Банки: счетов " + Number(x.j.count || 0));
        })
        .catch(function (e) {
          showActionLog("danger", "Ошибка проверки: " + (e.message || String(e)));
          toast("danger", e.message || String(e));
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun && btn && !credentialId) {
      return window.DatagonNotify.busyRun(btn, run);
    }
    return run();
  }

  function parseJsonResponse(r) {
    return r.text().then(function (txt) {
      var t = String(txt || "").trim();
      if (!t) return { r: r, j: { success: false, error: "Пустой ответ HTTP " + r.status } };
      try {
        return { r: r, j: JSON.parse(t) };
      } catch (e) {
        var snip = t.replace(/\s+/g, " ").slice(0, 160);
        throw new Error(
          "Сервер вернул не JSON (HTTP " +
            r.status +
            "). Часто это таймаут прокси на длинном синке. Фрагмент: " +
            snip
        );
      }
    });
  }
