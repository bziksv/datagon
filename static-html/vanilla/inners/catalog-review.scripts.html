<script>
(function () {
  var state = { lane: "out", page: 1, pages: 1, total: 0, limit: 100, rows: [], people: null, pending: null, decisions: [], site: "all", categoryIds: [], categoryOptions: [] };
  var STATUS = {
    unassigned: "Не распределено",
    with_sales: "У менеджера",
    content_new: "Новая",
    content_working: "В работе",
    content_done: "Готово"
  };
  var CONTENT_STATUS = {
    new: "Новая",
    working: "В работе",
    done: "Готово"
  };
  var DECISION = {
    keep: "Оставить",
    discontinued: "Снят / аналог",
    not_supplied: "Не поставляется",
    deactivate: "Деактивировать"
  };
  var DECISION_FILTER = {
    none: "Не выбрано",
    keep: "Оставить",
    discontinued: "Снят / аналог",
    not_supplied: "Не поставляется",
    deactivate: "Деактивировать"
  };

  var logTimer = null;
  function toast(type, message) {
    if (window.DatagonNotify && window.DatagonNotify.toast) {
      window.DatagonNotify.toast({ type: type, message: message });
    }
  }
  function escHtml(s) {
    if (window.DatagonFmt && window.DatagonFmt.escapeHtml) return window.DatagonFmt.escapeHtml(s);
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function showActionLog(type, html) {
    var box = document.getElementById("dg-cr-action-log");
    if (!box) return;
    var t = type || "info";
    box.className = "alert mt-0 mb-3 alert-" + (t === "danger" ? "danger" : t === "success" ? "success" : t === "warning" ? "warning" : "info");
    box.innerHTML = html;
    box.classList.remove("d-none");
  }
  function filterLine() {
    var mine = document.getElementById("dg-cr-mine");
    var search = document.getElementById("dg-cr-search").value.trim();
    var parts = [];
    parts.push("решение: " + decisionButtonText(state.decisions));
    parts.push("чьи: " + (mine && mine.selectedOptions[0] ? mine.selectedOptions[0].textContent : "Все"));
    parts.push("на Альмамеде: " + (state.site === "on" ? "Включён" : state.site === "off" ? "Выключен" : "Все"));
    parts.push("категории: " + categoryButtonText(state.categoryIds));
    if (search) parts.push("поиск: «" + escHtml(search) + "»");
    return parts.join("; ");
  }
  function beginLog(title) {
    if (logTimer) clearInterval(logTimer);
    var started = Date.now();
    function paint(extra) {
      showActionLog("info", "<strong>" + escHtml(title) + "</strong><br>Фильтры: " + filterLine() + "<br>" + extra);
    }
    paint("Идёт, прошло 0 с…");
    logTimer = setInterval(function () {
      paint("Идёт, прошло " + Math.round((Date.now() - started) / 1000) + " с…");
    }, 1000);
    return function finish(type, lines) {
      if (logTimer) clearInterval(logTimer);
      logTimer = null;
      var sec = ((Date.now() - started) / 1000).toFixed(1).replace(".", ",");
      showActionLog(type, "<strong>" + escHtml(title) + "</strong><br>Фильтры: " + filterLine() + "<br>" + lines + "<br>Время: " + sec + " с");
    };
  }
  function fmtNum(v) {
    if (v == null || v === "") return "—";
    if (window.DatagonFmt && window.DatagonFmt.formatNumber) return window.DatagonFmt.formatNumber(v);
    return String(v);
  }
  function fmtInt(v) {
    if (v == null || v === "") return "—";
    if (window.DatagonFmt && window.DatagonFmt.formatInteger) return window.DatagonFmt.formatInteger(v);
    return String(v);
  }
  function selectedIds() {
    return Array.prototype.map.call(
      document.querySelectorAll("#dg-cr-tbody input[data-dg-cr-id]:checked"),
      function (el) { return Number(el.getAttribute("data-dg-cr-id")); }
    ).filter(function (n) { return n > 0; });
  }
  function openOverlay(opts) {
    state.pending = opts;
    document.getElementById("dg-cr-overlay-title").textContent = opts.title || "Подтверждение";
    document.getElementById("dg-cr-overlay-text").textContent = opts.text || "";
    var note = document.getElementById("dg-cr-overlay-note");
    note.classList.toggle("d-none", !opts.note);
    note.value = "";
    note.placeholder = opts.notePlaceholder || "Комментарий";
    document.getElementById("dg-cr-overlay-ok").textContent = opts.okText || "Подтвердить";
    document.getElementById("dg-cr-overlay-cats").classList.toggle("d-none", !opts.categories);
    var box = document.getElementById("dg-cr-overlay");
    box.classList.remove("d-none");
    box.style.display = "flex";
  }
  function closeOverlay(cancelled) {
    var pending = state.pending;
    state.pending = null;
    var box = document.getElementById("dg-cr-overlay");
    box.classList.add("d-none");
    if (cancelled && pending && pending.onCancel) pending.onCancel();
  }

  function loadPeople() {
    return fetch("/api/catalog-review/people", { credentials: "same-origin" })
      .then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
      .then(function (x) {
        if (!x.r.ok) throw new Error(x.j.error || "Ошибка списка людей");
        state.people = x.j;
      })
      .catch(function (e) { toast("warning", e.message || "Не удалось загрузить людей"); });
  }

  function personSelect(list, selected, row, field) {
    var select = document.createElement("select");
    select.className = "form-select form-select-sm dg-cr-person";
    select.disabled = row.status === "done";
    var blank = document.createElement("option");
    blank.value = "";
    blank.textContent = "Не назначен";
    select.appendChild(blank);
    (list || []).forEach(function (p) {
      var opt = document.createElement("option");
      opt.value = String(p.id);
      opt.textContent = p.label || p.username;
      select.appendChild(opt);
    });
    select.value = selected ? String(selected) : "";
    if (select.value !== String(selected || "") && selected) {
      var extra = document.createElement("option");
      extra.value = String(selected);
      extra.textContent = field === "sales" ? (row.sales_name || ("#" + selected)) : (row.content_name || ("#" + selected));
      select.appendChild(extra);
      select.value = String(selected);
    }
    select.setAttribute("data-dg-cr-prev", select.value);
    select.addEventListener("change", function () {
      var body = { ids: [row.id] };
      var next = select.value ? Number(select.value) : null;
      if (field === "sales") body.sales_user_id = next;
      else body.content_user_id = next;
      var who = select.selectedOptions[0] ? select.selectedOptions[0].textContent : "Не назначен";
      var title = (field === "sales" ? "Менеджер" : "Контент") + ": " + (row.sku || ("#" + row.id)) + " → " + who;
      var finish = beginLog(title);
      select.disabled = true;
      post("/api/catalog-review/assign", body).then(function (x) {
        select.disabled = row.status === "done";
        if (!x.r.ok) throw new Error(x.j.error || "Ошибка назначения");
        select.setAttribute("data-dg-cr-prev", select.value);
        finish("success", "Записано: " + fmtInt(x.j.updated));
        toast("success", "Назначено: " + who);
        load();
      }).catch(function (e) {
        select.value = select.getAttribute("data-dg-cr-prev") || "";
        select.disabled = row.status === "done";
        finish("danger", "Ошибка: " + escHtml(e.message || "не записалось"));
        toast("danger", e.message);
      });
    });
    return select;
  }

  function applyDecision(row, decision, note, confirmStock, select) {
    var finish = beginLog((decision ? "Решение «" + (DECISION[decision] || decision) + "»" : "Решение снято") + ": " + (row.sku || ("#" + row.id)));
    if (select) select.disabled = true;
    var body = { ids: [row.id], decision: decision, confirm_stock: confirmStock ? 1 : 0 };
    if (note) body.note = note;
    post("/api/catalog-review/decide", body).then(function (x) {
      if (x.r.status === 409 && x.j.code === "STOCK_CONFIRM") {
        if (select) select.disabled = row.status === "done";
        finish("warning", escHtml(x.j.error || "Есть остаток"));
        openOverlay({
          title: "На складе есть остаток",
          text: x.j.error,
          okText: "Всё равно выводить",
          onCancel: function () { if (select) select.value = select.getAttribute("data-dg-cr-prev") || ""; },
          run: function () { closeOverlay(); applyDecision(row, decision, note, true, select); }
        });
        return;
      }
      if (!x.r.ok) throw new Error(x.j.error || "Ошибка решения");
      if (!Number(x.j.updated)) {
        var why = (x.j.skip_reasons && x.j.skip_reasons[0] && x.j.skip_reasons[0].reason) || "строка не изменилась";
        throw new Error(why);
      }
      if (select) select.setAttribute("data-dg-cr-prev", decision);
      var lines = "Записано: " + fmtInt(x.j.updated);
      if (note) lines += "<br>Комментарий: " + escHtml(note);
      finish("success", lines);
      toast("success", decision ? "Решение: " + (DECISION[decision] || decision) : "Решение снято");
      load();
    }).catch(function (e) {
      if (select) {
        select.disabled = row.status === "done";
        select.value = select.getAttribute("data-dg-cr-prev") || "";
      }
      finish("danger", "Ошибка: " + escHtml(e.message));
      toast("danger", e.message);
    });
  }

  function isSales(row) {
    var me = state.me || {};
    return !!me.isAdmin || Number(me.id) === Number(row.sales_user_id);
  }
  function isContent(row) {
    var me = state.me || {};
    return !!me.isAdmin || Number(me.id) === Number(row.content_user_id);
  }
  function rowStatusText(row) {
    if (row.status === "with_content") return CONTENT_STATUS[row.content_status] || "Новая";
    if (row.status === "done") return "Готово";
    if (row.status === "with_sales") return "У менеджера";
    if (row.status === "unassigned") return "Не распределено";
    return row.status || "—";
  }
  function contentStatusControl(row) {
    if (row.status !== "with_content") {
      var span = document.createElement("span");
      span.textContent = rowStatusText(row);
      return span;
    }
    var select = document.createElement("select");
    select.className = "form-select form-select-sm dg-cr-content-status";
    select.disabled = !isContent(row);
    Object.keys(CONTENT_STATUS).forEach(function (key) {
      var opt = document.createElement("option");
      opt.value = key;
      opt.textContent = CONTENT_STATUS[key];
      select.appendChild(opt);
    });
    select.value = CONTENT_STATUS[row.content_status] ? row.content_status : "new";
    select.setAttribute("data-dg-cr-prev", select.value);
    select.addEventListener("change", function () {
      var next = select.value;
      var prev = select.getAttribute("data-dg-cr-prev") || "new";
      if (next === prev) return;
      var finish = beginLog("Статус контента «" + (CONTENT_STATUS[next] || next) + "»: " + (row.sku || ("#" + row.id)));
      select.disabled = true;
      post("/api/catalog-review/content-status", { ids: [row.id], content_status: next }).then(function (x) {
        select.disabled = !isContent(row);
        if (!x.r.ok) throw new Error(x.j.error || "Статус не записался");
        if (!Number(x.j.updated)) {
          var why = (x.j.skip_reasons && x.j.skip_reasons[0] && x.j.skip_reasons[0].reason) || "статус не изменился";
          throw new Error(why);
        }
        select.setAttribute("data-dg-cr-prev", next);
        finish("success", "Записано: " + fmtInt(x.j.updated));
        toast("success", "Статус контента: " + (CONTENT_STATUS[next] || next));
        load();
      }).catch(function (e) {
        select.disabled = !isContent(row);
        select.value = prev;
        finish("danger", "Ошибка: " + escHtml(e.message));
        toast("danger", e.message);
      });
    });
    return select;
  }

  function decisionSelect(row) {
    var select = document.createElement("select");
    select.className = "form-select form-select-sm dg-cr-decision";
    select.disabled = !isSales(row);
    if (select.disabled) {
      select.title = "Решение ставит менеджер по продажам этой строки";
    } else {
      select.title = "Можно сменить решение: галка/включение на Альмамеде обновятся сразу. Отмена «Деактивировать» снова включает карточку";
    }
    var blank = document.createElement("option");
    blank.value = "";
    blank.textContent = "Не выбрано";
    select.appendChild(blank);
    Object.keys(DECISION).forEach(function (key) {
      var opt = document.createElement("option");
      opt.value = key;
      opt.textContent = DECISION[key];
      select.appendChild(opt);
    });
    select.value = row.decision && DECISION[row.decision] ? row.decision : "";
    select.setAttribute("data-dg-cr-prev", select.value);
    select.addEventListener("change", function () {
      var next = select.value;
      var prev = select.getAttribute("data-dg-cr-prev") || "";
      if (next === prev) return;
      if (!next) {
        applyDecision(row, "", "", false, select);
        return;
      }
      if (next === "discontinued") {
        var existing = String(row.decision_note || "").trim();
        if (existing && row.decision === "discontinued") {
          applyDecision(row, next, existing, false, select);
          return;
        }
        openOverlay({
          title: "Снят / аналог",
          text: "Напишите, какой аналог поставить или что взять в работу. Комментарий останется у решения.",
          okText: "Записать",
          note: true,
          notePlaceholder: "Какой аналог разместить или что взять в работу",
          onCancel: function () { select.value = prev; },
          run: function () {
            var note = String(document.getElementById("dg-cr-overlay-note").value || "").trim();
            if (!note) { toast("warning", "Напишите комментарий по аналогу"); return; }
            closeOverlay();
            applyDecision(row, next, note, false, select);
          }
        });
        return;
      }
      applyDecision(row, next, "", false, select);
    });
    return select;
  }

  function productHref(row) {
    var raw = String(row.source_url || "").trim();
    if (!raw) return "";
    if (!/^https?:\/\//i.test(raw)) {
      var domain = String(row.site_domain || "almamed.su").trim().replace(/^https?:\/\//i, "").replace(/\/+$/, "");
      if (!domain) return "";
      raw = "https://" + domain + (raw.charAt(0) === "/" ? raw : "/" + raw);
    }
    try {
      var u = new URL(raw);
      var cms = String(row.cms_type || "").toLowerCase();
      if (cms === "webasyst") {
        var path = String(u.pathname || "/");
        if (path.toLowerCase().indexOf("/webasyst/") >= 0) return "";
        if (path.toLowerCase().indexOf("/product/") !== 0) {
          var slug = path.replace(/^\/+|\/+$/g, "").split("/").filter(Boolean).pop();
          if (!slug) return "";
          u.pathname = "/product/" + slug + "/";
        } else if (!path.endsWith("/")) {
          u.pathname = path + "/";
        }
      }
      return u.toString();
    } catch (e) {
      return "";
    }
  }
  function render(rows) {
    var tb = document.getElementById("dg-cr-tbody");
    tb.replaceChildren();
    if (!rows.length) {
      var tr = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = 6;
      td.className = "text-muted";
      td.textContent = "В очереди нет строк по этому фильтру.";
      tr.appendChild(td);
      tb.appendChild(tr);
      return;
    }
    rows.forEach(function (row) {
      var tr = document.createElement("tr");
      var tdCat = document.createElement("td");
      tdCat.textContent = row.parent_category_name || "—";
      var tdP = document.createElement("td");
      var sku = document.createElement("div");
      sku.className = "fw-semibold";
      sku.textContent = row.sku || "—";
      var name = document.createElement("div");
      var href = productHref(row);
      if (href) {
        var link = document.createElement("a");
        link.href = href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = row.product_name || href;
        name.appendChild(link);
      } else {
        name.textContent = row.product_name || "";
      }
      var code = document.createElement("div");
      code.className = "small text-muted";
      code.textContent = row.cms_product_id ? "Код " + row.cms_product_id : "";
      tdP.appendChild(sku);
      tdP.appendChild(name);
      if (code.textContent) tdP.appendChild(code);
      if (Number(row.source_enabled) === 0) {
        var off = document.createElement("div");
        off.className = "mt-1";
        var badge = document.createElement("span");
        badge.className = "badge bg-secondary";
        badge.textContent = "Выключен на Альмамеде";
        var note = document.createElement("div");
        note.className = "small text-muted";
        note.textContent = "Снят только на этом сайте. На других сайтах такой отметки может не быть.";
        off.appendChild(badge);
        off.appendChild(note);
        tdP.appendChild(off);
      }
      attachFieldLog(tdP, row, "");
      var tdPrice = document.createElement("td");
      tdPrice.textContent = row.price != null ? fmtNum(row.price) + (row.currency ? " " + row.currency : "") : "—";
      var tdStock = document.createElement("td");
      tdStock.textContent = row.stock_qty_live == null ? "—" : fmtInt(row.stock_qty_live);
      if (Number(row.stock_qty_live) > 0) tdStock.className = "text-danger";
      var tdDec = document.createElement("td");
      tdDec.appendChild(decisionSelect(row));
      attachFieldLog(tdDec, row, "decision");
      if (row.decision === "discontinued" && row.status !== "done") {
        var analog = document.createElement("input");
        analog.type = "text";
        analog.className = "form-control form-control-sm mt-1";
        analog.placeholder = "Куда разместить аналог или что взять в работу";
        analog.value = row.decision_note || "";
        analog.readOnly = !isSales(row);
        analog.setAttribute("data-dg-cr-prev", analog.value);
        analog.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter") { ev.preventDefault(); analog.blur(); }
        });
        analog.addEventListener("blur", function () {
          if (analog.readOnly) return;
          var next = String(analog.value || "").trim();
          var prev = analog.getAttribute("data-dg-cr-prev") || "";
          if (next === prev) return;
          if (!next) {
            analog.value = prev;
            toast("warning", "Комментарий по аналогу нужен: куда разместить или что взять в работу");
            return;
          }
          var finish = beginLog("Комментарий к аналогу " + (row.sku || ("#" + row.id)));
          analog.disabled = true;
          post("/api/catalog-review/decide", { ids: [row.id], decision: "discontinued", note: next }).then(function (x) {
            analog.disabled = false;
            if (!x.r.ok) throw new Error(x.j.error || "Комментарий не записался");
            if (!x.j.updated) throw new Error("Комментарий не записался: строка уже закрыта или не ваша");
            analog.value = next;
            analog.setAttribute("data-dg-cr-prev", next);
            finish("success", "Записано: " + fmtInt(x.j.updated) + "<br>Комментарий: " + escHtml(next));
            toast("success", "Комментарий записан");
          }).catch(function (e) {
            analog.disabled = false;
            analog.value = prev;
            finish("danger", "Ошибка: " + escHtml(e.message));
            toast("danger", e.message);
          });
        });
        tdDec.appendChild(analog);
      } else if (row.decision === "discontinued" && row.decision_note) {
        var n1 = document.createElement("div");
        n1.className = "small text-muted";
        n1.textContent = "Аналог: " + row.decision_note;
        tdDec.appendChild(n1);
      } else if (row.decision_note) {
        var n0 = document.createElement("div");
        n0.className = "small text-muted";
        n0.textContent = row.decision_note;
        tdDec.appendChild(n0);
      }
      if (row.content_note) {
        var n2 = document.createElement("div");
        n2.className = "small";
        n2.textContent = "Контент: " + row.content_note;
        tdDec.appendChild(n2);
      }
      var people = state.people || { sales: [], content: [] };
      var tdS = document.createElement("td");
      tdS.appendChild(personSelect(people.sales, row.sales_user_id, row, "sales"));
      attachFieldLog(tdS, row, "sales_user_id");
      [tdCat, tdP, tdPrice, tdStock, tdDec, tdS].forEach(function (td) { tr.appendChild(td); });
      tb.appendChild(tr);
    });
  }

  function load() {
    if (state.lane !== "out") return;
    var params = new URLSearchParams();
    params.set("lane", "out");
    params.set("page", String(state.page));
    params.set("limit", String(state.limit));
    var mine = document.getElementById("dg-cr-mine").value;
    var search = document.getElementById("dg-cr-search").value.trim();
    var picked = (state.decisions || []).filter(function (id) { return DECISION_FILTER[id]; });
    if (picked.length && picked.length < Object.keys(DECISION_FILTER).length) params.set("decision", picked.join(","));
    if (mine) params.set("mine", mine);
    if (search) params.set("search", search);
    if (state.site === "on") params.set("site", "1");
    if (state.site === "off") params.set("site", "0");
    if (state.categoryIds && state.categoryIds.length && state.categoryOptions.length && state.categoryIds.length < state.categoryOptions.length) {
      params.set("category", state.categoryIds.join(","));
    }
    fetch("/api/catalog-review?" + params.toString(), { credentials: "same-origin" })
      .then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
      .then(function (x) {
        if (!x.r.ok) throw new Error(x.j.error || "Ошибка очереди");
        state.me = x.j.me || state.me || {};
        state.rows = x.j.data || [];
        state.total = Number(x.j.total || 0);
        state.pages = Math.max(1, Math.ceil(state.total / state.limit));
        if (state.page > state.pages) {
          state.page = state.pages;
          load();
          return;
        }
        document.getElementById("dg-cr-count").textContent = "Найдено: " + fmtInt(state.total);
        document.getElementById("dg-cr-page").textContent = "Страница " + state.page + "/" + state.pages;
        render(state.rows);
      })
      .catch(function (e) { toast("danger", e.message || "Ошибка очереди"); });
  }

  function post(url, body) {
    return fetch(url, {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); });
  }

  function runDecide(decision, confirmStock, note) {
    var ids = selectedIds();
    if (!ids.length) { toast("warning", "Отметьте строки"); return; }
    var title = "Решение «" + (DECISION[decision] || decision) + "»";
    var finish = beginLog(title);
    var body = { ids: ids, decision: decision, confirm_stock: confirmStock ? 1 : 0 };
    if (note) body.note = note;
    post("/api/catalog-review/decide", body)
      .then(function (x) {
        if (x.r.status === 409 && x.j.code === "STOCK_CONFIRM") {
          finish("warning", escHtml(x.j.error || "Есть остаток"));
          openOverlay({
            title: "На складе есть остаток",
            text: x.j.error,
            okText: "Всё равно выводить",
            run: function () { closeOverlay(); runDecide(decision, true, note); }
          });
          return;
        }
        if (!x.r.ok) throw new Error(x.j.error || "Ошибка решения");
        var lines = "Отмечено: " + fmtInt(ids.length) + "<br>Записано: " + fmtInt(x.j.updated) + ", пропущено: " + fmtInt(x.j.skipped);
        if (note) lines += "<br>Комментарий: " + escHtml(note);
        (x.j.skip_reasons || []).forEach(function (item) {
          lines += "<br>• " + escHtml(item.sku || item.id || "?") + " — " + escHtml(item.reason || "пропущено");
        });
        var ok = Number(x.j.updated) > 0;
        finish(ok && !x.j.skipped ? "success" : "warning", lines);
        toast(ok ? "success" : "warning", ok ? "Решение записано: " + fmtInt(x.j.updated) : "Решение не записано");
        load();
      })
      .catch(function (e) {
        finish("danger", "Ошибка: " + escHtml(e.message));
        toast("danger", e.message);
      });
  }

  function tallyOwners(rows, field, people) {
    var map = {};
    (people || []).forEach(function (p) {
      map[String(p.id)] = { label: p.label || p.username || ("#" + p.id), cats: 0, cards: 0 };
    });
    var free = { cats: 0, cards: 0 };
    rows.forEach(function (row) {
      var id = String(row[field] || "");
      if (!id || !map[id]) {
        free.cats += 1;
        free.cards += row.cards;
        return;
      }
      map[id].cats += 1;
      map[id].cards += row.cards;
    });
    var list = Object.keys(map).map(function (key) { return map[key]; });
    list.sort(function (a, b) {
      if (b.cats !== a.cats) return b.cats - a.cats;
      return String(a.label).localeCompare(String(b.label), "ru");
    });
    return { list: list, free: free };
  }
  function balanceCard(title, tone, tally, totalCats) {
    var col = document.createElement("div");
    col.className = "col-12 col-lg-6";
    var card = document.createElement("div");
    card.className = "border rounded p-3 h-100";
    var head = document.createElement("div");
    head.className = "d-flex justify-content-between align-items-baseline gap-2 mb-2";
    var h = document.createElement("div");
    h.className = "fw-semibold";
    h.textContent = title;
    var meta = document.createElement("div");
    meta.className = "small text-muted";
    var assigned = totalCats - tally.free.cats;
    var withLoad = tally.list.filter(function (p) { return p.cats > 0; }).length;
    var avg = withLoad ? Math.round(assigned / withLoad) : 0;
    meta.textContent = "Закреплено " + fmtInt(assigned) + " из " + fmtInt(totalCats) +
      (withLoad ? " · в среднем " + fmtInt(avg) : "");
    head.appendChild(h);
    head.appendChild(meta);
    card.appendChild(head);
    var max = tally.list.reduce(function (n, p) { return Math.max(n, p.cats); }, 0);
    tally.list.forEach(function (p) {
      var line = document.createElement("div");
      line.className = "mb-2";
      var top = document.createElement("div");
      top.className = "d-flex justify-content-between gap-2 small";
      var name = document.createElement("span");
      name.textContent = p.label;
      var nums = document.createElement("span");
      nums.className = "text-muted text-nowrap";
      nums.textContent = fmtInt(p.cats) + " кат. · " + fmtInt(p.cards) + " карт.";
      top.appendChild(name);
      top.appendChild(nums);
      var track = document.createElement("div");
      track.className = "dg-cr-balance-track mt-1";
      var bar = document.createElement("div");
      bar.className = "dg-cr-balance-bar " + (p.cats ? tone : "is-zero");
      bar.style.width = max ? Math.round((p.cats / max) * 100) + "%" : "0";
      track.appendChild(bar);
      line.appendChild(top);
      line.appendChild(track);
      card.appendChild(line);
    });
    if (tally.free.cats) {
      var free = document.createElement("div");
      free.className = "small text-muted mt-1";
      free.textContent = "Без закрепления: " + fmtInt(tally.free.cats) + " кат. · " + fmtInt(tally.free.cards) + " карт.";
      card.appendChild(free);
    }
    col.appendChild(card);
    return col;
  }

  function formatLogWhen(value) {
    var d = new Date(value);

    function p(n) { return n < 10 ? "0" + n : String(n); }
    return p(d.getDate()) + "-" + p(d.getMonth() + 1) + "-" + d.getFullYear() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

    var note = logState.field
      ? '<div class="alert alert-info py-2 px-3 mb-0 rounded-0 small">Фильтр: <b>' + escHtml(LOG_FIELDS[logState.field] || logState.field) + "</b></div>"
      : "";
    if (!rows.length) {
      body.innerHTML = note + '<div class="text-muted small text-center py-4">' +
        (logState.field ? "По этому полю изменений пока нет." : "По этой строке изменений пока нет.") +
        "</div>";
      return;
    }
    var html = note + '<div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>Когда</th><th>Кто</th>' +
      (logState.field ? "" : "<th>Поле</th>") +
      "<th>Было → Стало</th></tr></thead><tbody>";
    rows.forEach(function (row) {
      var oldVal = row.old_value == null ? '<span class="text-muted">∅</span>' : escHtml(row.old_value);

      html += "<tr><td class=\"text-nowrap small\">" + escHtml(formatLogWhen(row.changed_at)) + "</td><td>" +
        escHtml(row.changed_by_name || "—") + "</td>" +
        (logState.field ? "" : "<td>" + escHtml(row.field_label || row.field || "—") + "</td>") +
        "<td>" + oldVal + " → " + newVal + "</td></tr>";
    });
    var page = Math.floor(logState.offset / logState.limit) + 1;
    var pages = Math.max(1, Math.ceil(logState.total / logState.limit));
    html += "</tbody></table></div>" +
      '<div class="d-flex justify-content-between align-items-center px-3 py-2 border-top">' +
      '<span class="small text-muted">Найдено: ' + fmtInt(logState.total) + "; страница " + page + "/" + pages + "</span>" +

      '<button type="button" class="btn btn-sm btn-outline-secondary" id="dg-cr-log-next"' + (logState.offset + logState.limit >= logState.total ? " disabled" : "") + ">Вперёд</button>" +

    var chosen = {};
    (selected || []).forEach(function (id) { if (DECISION_FILTER[id]) chosen[id] = true; });
    list.replaceChildren();
    Object.keys(DECISION_FILTER).forEach(function (key) {
      var label = document.createElement("label");
      label.className = "d-flex align-items-center gap-2 mb-1";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.className = "form-check-input m-0";
      cb.value = key;
      cb.checked = !!chosen[key];
      cb.addEventListener("change", paintDecisionButton);
      var text = document.createElement("span");
      text.textContent = DECISION_FILTER[key];
      label.appendChild(cb);
      label.appendChild(text);
      list.appendChild(label);
    });
    paintDecisionButton();
  }
  function categoryButtonText(ids) {
    var list = ids || [];
    var opts = state.categoryOptions || [];
    if (!list.length || (opts.length && list.length >= opts.length)) return "Все";
    var nameById = {};
    opts.forEach(function (cat) { nameById[String(cat.id)] = cat.name || ("#" + cat.id); });
    var first = nameById[String(list[0])] || ("#" + list[0]);
    if (list.length === 1) return first;
    return first + " и ещё " + (list.length - 1);
  }
  function readDraftCategories() {
    return Array.prototype.map.call(
      document.querySelectorAll("#dg-cr-queue-cat-list input:checked"),
      function (el) { return Number(el.value); }
    ).filter(function (id) { return id > 0; });
  }
  function paintCategoryButton() {
    var label = document.getElementById("dg-cr-queue-cat-label");
    if (!label) return;
    var draft = document.querySelector("#dg-cr-queue-cat-list input") ? readDraftCategories() : (state.categoryIds || []);
    label.textContent = categoryButtonText(draft);
  }
  function buildCategoryFilter() {
    var list = document.getElementById("dg-cr-queue-cat-list");
    if (!list) return;
    var chosen = {};
    (state.categoryIds || []).forEach(function (id) { chosen[String(id)] = true; });
    var rows = (state.categoryOptions || []).slice().sort(function (a, b) {
      return String(a.name || "").localeCompare(String(b.name || ""), "ru");
    });
    list.replaceChildren();
    rows.forEach(function (cat) {
      var label = document.createElement("label");
      label.className = "d-flex align-items-start gap-2 mb-1";
      label.setAttribute("data-dg-cr-queue-cat-name", String(cat.name || "").toLowerCase());
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.className = "form-check-input mt-1";
      cb.value = String(cat.id);
      cb.checked = !!chosen[String(cat.id)];
      cb.addEventListener("change", paintCategoryButton);
      var text = document.createElement("span");
      text.textContent = cat.name || "—";
      label.appendChild(cb);
      label.appendChild(text);
      list.appendChild(label);
    });
    paintCategoryButton();
  }
  function commitStatuses() {
    state.decisions = readDraftDecisions();
    var site = document.getElementById("dg-cr-site");
    state.site = site && (site.value === "on" || site.value === "off") ? site.value : "all";
    if (document.querySelector("#dg-cr-queue-cat-list input")) state.categoryIds = readDraftCategories();
    if (window.DatagonFilters) {
      var prev = window.DatagonFilters.load("catalog-review") || {};
      prev.decisions = state.decisions;
      prev.site = state.site;
      prev.categoryIds = state.categoryIds;
      window.DatagonFilters.save("catalog-review", prev);
    }
  }
  (function restoreStatuses() {
    var saved = window.DatagonFilters ? window.DatagonFilters.load("catalog-review") : null;
    var initial = saved && Array.isArray(saved.decisions) ? saved.decisions : [];
    state.decisions = initial.filter(function (id) { return DECISION_FILTER[id]; });
    state.site = saved && (saved.site === "on" || saved.site === "off") ? saved.site : "all";
    state.categoryIds = saved && Array.isArray(saved.categoryIds)
      ? saved.categoryIds.map(function (id) { return Number(id); }).filter(function (id) { return id > 0; })
      : [];
    buildDecisionFilter(state.decisions);
    var site = document.getElementById("dg-cr-site");
    if (site) site.value = state.site;
  })();
  (function bindCategorySearch() {
    var catQ = document.getElementById("dg-cr-queue-cat-q");
    if (!catQ) return;
    catQ.addEventListener("click", function (ev) { ev.stopPropagation(); });
    catQ.addEventListener("keydown", function (ev) {
      ev.stopPropagation();
      if (ev.key === "Enter") ev.preventDefault();
    });
    catQ.addEventListener("input", function () {
      var needle = String(this.value || "").trim().toLowerCase();
      document.querySelectorAll("#dg-cr-queue-cat-list label").forEach(function (row) {
        var name = row.getAttribute("data-dg-cr-queue-cat-name") || "";
        row.classList.toggle("d-none", !!(needle && name.indexOf(needle) === -1));
      });
    });
  })();

  document.getElementById("dg-cr-log-close").addEventListener("click", closeCrLog);
  document.getElementById("dg-cr-log-backdrop").addEventListener("click", closeCrLog);
  document.getElementById("dg-cr-log-body").addEventListener("click", function (ev) {
    var prev = ev.target.closest && ev.target.closest("#dg-cr-log-prev");
    var next = ev.target.closest && ev.target.closest("#dg-cr-log-next");
    if (prev && logState.offset > 0) {
      logState.offset = Math.max(0, logState.offset - logState.limit);
      loadCrLog();
    }
    if (next && logState.offset + logState.limit < logState.total) {
      logState.offset += logState.limit;
      loadCrLog();
    }
  });
  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest && ev.target.closest("[data-dg-cr-log-id]");
    if (!btn) return;
    ev.preventDefault();
    ev.stopPropagation();
    var id = Number(btn.getAttribute("data-dg-cr-log-id"));
    if (!id) return;
    openCrLog(id, btn.getAttribute("data-dg-cr-log-label") || "", btn.getAttribute("data-dg-cr-log-field") || "");
  });

  loadPeople().then(function () { return loadOwners(); }).then(load);
})();
</script>
