  <script>
    (function () {
      var pollTimer;
      var lastData = null;

      function num(v) {
        return Number(v || 0).toLocaleString("ru-RU");
      }
      function fmtDate(v) {
        if (!v) return "-";
        var d = new Date(v);
        if (isNaN(d.getTime())) return "-";
        return d.toLocaleString("ru-RU");
      }
      function pct(part, total) {
        var p = Number(part || 0);
        var t = Number(total || 0);
        if (t <= 0) return 0;
        return Math.max(0, Math.min(100, Math.round((p / t) * 100)));
      }
      function fmtMb(bytes) {
        return (Number(bytes || 0) / (1024 * 1024)).toFixed(1) + " MB";
      }
      function parseJsonResponse(r, fallbackMessage) {
        var ct = String((r.headers && r.headers.get("content-type")) || "").toLowerCase();
        if (ct.indexOf("application/json") !== -1) {
          return r.json().then(function (j) {
            return { ok: r.ok, j: j };
          });
        }
        return r.text().then(function (text) {
          var msg = fallbackMessage || "Сервер вернул не JSON";
          if (r.redirected || (text && text.indexOf("<!DOCTYPE") !== -1)) {
            msg = "Сессия истекла или сервер вернул HTML вместо JSON. Обновите страницу и войдите заново.";
          }
          return { ok: false, j: { error: msg } };
        });
      }
      function fmtBytes(bytes) {
        var n = Number(bytes || 0);
        if (!Number.isFinite(n) || n <= 0) return "0 Б";
        var units = ["Б", "КБ", "МБ", "ГБ", "ТБ"];
        var idx = 0;
        while (n >= 1024 && idx < units.length - 1) {
          n = n / 1024;
          idx += 1;
        }
        return (idx === 0 ? Math.round(n) : n.toFixed(n >= 10 ? 1 : 2)) + " " + units[idx];
      }

      function computeHealth(queue, globalSync, moysklad, discoveryActive) {
        var hasQueueErrors = Number(queue.error || 0) > 0;
        var hasRunning =
          Boolean(globalSync.active) ||
          Boolean(moysklad.active) ||
          discoveryActive;
        if (hasQueueErrors) return { label: "Есть проблемы", tone: "danger" };
        if (hasRunning) return { label: "Рабочая активность", tone: "warning" };
        return { label: "Стабильно", tone: "success" };
      }

      function computeLoadState(globalSync, moysklad, discoveryLen, queueProcessing, runtime) {
        var memory = (runtime && runtime.memory) || {};
        var activeWorkers =
          (globalSync.active ? 1 : 0) +
          (moysklad.active ? 1 : 0) +
          discoveryLen +
          (Number(queueProcessing || 0) > 0 ? 1 : 0);
        var cpu = Number(runtime.cpuPercent || 0);
        var rssPercent = Number(memory.rssPercentOfSystem || 0);
        var score =
          (cpu >= 75 ? 2 : cpu >= 40 ? 1 : 0) +
          (rssPercent >= 40 ? 2 : rssPercent >= 20 ? 1 : 0) +
          (activeWorkers >= 3 ? 1 : 0);
        if (score >= 4) return { label: "Высокая", tone: "danger", score: score };
        if (score >= 2) return { label: "Средняя", tone: "warning", score: score };
        return { label: "Низкая", tone: "success", score: score };
      }

      function render(data, showLoadingHint) {
        var queue = data.queue || {};
        var globalSync = data.globalSync || {};
        var moysklad = data.moysklad || {};
        var matches = data.matches || {};
        var runtime = data.runtime || {};
        var memory = runtime.memory || {};
        var discovery = Array.isArray(data.discovery)
          ? data.discovery.filter(function (x) {
              return x.active;
            })
          : [];
        var refreshedAt = data.refreshedAt || new Date().toISOString();
        renderDatabaseSize(data.databaseSize);

        var health = computeHealth(queue, globalSync, moysklad, discovery.length > 0);
        var hb = document.getElementById("dg-health-badge");
        if (hb) {
          hb.className = "badge bg-" + health.tone + " dg-health-badge";
          hb.textContent = health.label;
        }

        document.getElementById("dg-q-total").textContent = num(queue.total);
        document.getElementById("dg-q-done").textContent =
          num(queue.done) + " (" + pct(queue.done, queue.total) + "%)";
        document.getElementById("dg-q-err").textContent = num(queue.error);

        var sumHint = document.getElementById("dg-summary-hint");
        if (sumHint) {
          sumHint.textContent =
            "Обновлено: " +
            fmtDate(refreshedAt) +
            (showLoadingHint ? " (загрузка...)" : "");
        }

        document.getElementById("dg-gs-prog").textContent =
          num(globalSync.processed) + "/" + num(globalSync.total);
        document.getElementById("dg-gs-pct").textContent = String(
          pct(globalSync.processed, globalSync.total)
        );
        document.getElementById("dg-gs-msg").textContent = globalSync.message || "-";
        var gsh = document.getElementById("dg-gs-hint");
        if (gsh) gsh.textContent = globalSync.active ? "Выполняется" : "Ожидание";

        document.getElementById("dg-ms-prog").textContent =
          num(moysklad.processed) + "/" + num(moysklad.total);
        document.getElementById("dg-ms-pct").textContent = String(
          pct(moysklad.processed, moysklad.total)
        );
        document.getElementById("dg-ms-upd").textContent = fmtDate(moysklad.updatedAt);
        document.getElementById("dg-ms-msg").textContent = moysklad.message || "-";
        var msh = document.getElementById("dg-ms-hint");
        if (msh) msh.textContent = moysklad.active ? "Синхронизация идет" : "Ожидание";

        document.getElementById("dg-mat-site").textContent = num(matches.mySiteId);
        document.getElementById("dg-mat-prog").textContent =
          num(matches.processed) + "/" + num(matches.total);
        document.getElementById("dg-mat-found").textContent =
          num(matches.foundSku) + "/" + num(matches.foundName);
        var mh = document.getElementById("dg-mat-hint");
        if (mh) mh.textContent = matches.status || "idle";

        var loadState = computeLoadState(
          globalSync,
          moysklad,
          discovery.length,
          queue.processing,
          runtime
        );
        document.getElementById("dg-rt-cpu").textContent =
          Number(runtime.cpuPercent || 0).toFixed(1) + "%";
        document.getElementById("dg-rt-ram").textContent =
          fmtMb(memory.rssBytes) +
          " (" +
          Number(memory.rssPercentOfSystem || 0).toFixed(1) +
          "%)";
        document.getElementById("dg-rt-up").textContent = num(runtime.uptimeSec) + " сек";
        document.getElementById("dg-rt-score").textContent = String(loadState.score);
        var rb = document.getElementById("dg-rt-badge");
        if (rb) {
          rb.className = "badge bg-" + loadState.tone;
          rb.textContent = loadState.label;
        }

        var autoRuns = Array.isArray(data.autoSyncRuns)
          ? data.autoSyncRuns.slice(0, 8)
          : [];
        var mount = document.getElementById("dg-auto-runs-mount");
        var ah = document.getElementById("dg-auto-hint");
        if (ah) ah.textContent = "Записей: " + autoRuns.length;
        if (mount) {
          mount.replaceChildren();
          if (autoRuns.length === 0) {
            var empty = document.createElement("div");
            empty.className = "text-muted";
            empty.textContent = "История пока пустая";
            mount.appendChild(empty);
          } else {
            var ul = document.createElement("ul");
            ul.className = "mb-0";
            autoRuns.forEach(function (r) {
              var li = document.createElement("li");
              var b = document.createElement("b");
              b.textContent = r.task_type || "-";
              li.appendChild(b);
              li.appendChild(
                document.createTextNode(
                  " · " +
                    (r.status || "-") +
                    " · старт: " +
                    fmtDate(r.started_at) +
                    " · финиш: " +
                    fmtDate(r.finished_at)
                )
              );
              ul.appendChild(li);
            });
            mount.appendChild(ul);
          }
        }
      }

      function renderDatabaseSize(databaseSize) {
        var sizeEl = document.getElementById("dg-db-size");
        var metaEl = document.getElementById("dg-db-size-meta");
        if (!sizeEl || !metaEl) return;
        if (!databaseSize) {
          sizeEl.textContent = "—";
          metaEl.textContent = "Кэш: —";
          return;
        }
        if (databaseSize.error) {
          sizeEl.textContent = "Ошибка";
          metaEl.textContent = databaseSize.error;
          return;
        }
        sizeEl.textContent = fmtBytes(databaseSize.sizeBytes);
        var parts = [
          "таблиц: " + num(databaseSize.tableCount),
          "данные: " + fmtBytes(databaseSize.dataBytes),
          "индексы: " + fmtBytes(databaseSize.indexBytes),
          "обновлено: " + fmtDate(databaseSize.cachedAt),
        ];
        if (databaseSize.cached) parts.push("из кэша");
        else parts.push("свежий расчёт");
        metaEl.textContent = parts.join(" · ");
      }

      function loadDashboard() {
        if (lastData) render(lastData, true);
        else {
          var sh = document.getElementById("dg-summary-hint");
          if (sh) sh.textContent = "Обновлено: — (загрузка...)";
        }
        fetch("/api/processes/overview", { credentials: "same-origin" })
          .then(function (r) {
            return parseJsonResponse(r, "Ошибка загрузки дашборда");
          })
          .then(function (x) {
            if (!x.ok) throw new Error(x.j.error || "Ошибка загрузки дашборда");
            lastData = x.j;
            render(x.j, false);
          })
          .catch(function (e) {
            alert(e.message || "Не удалось загрузить dashboard");
          });
      }

      function refreshDatabaseSize() {
        var metaEl = document.getElementById("dg-db-size-meta");
        if (metaEl) metaEl.textContent = "Пересчитываем размер базы...";
        fetch("/api/processes/db-size?refresh=1", { credentials: "same-origin" })
          .then(function (r) {
            return parseJsonResponse(r, "Не удалось обновить размер базы");
          })
          .then(function (x) {
            if (!x.ok || !x.j.success) throw new Error(x.j.error || "Не удалось обновить размер базы");
            if (lastData) lastData.databaseSize = x.j.databaseSize;
            renderDatabaseSize(x.j.databaseSize);
          })
          .catch(function (e) {
            if (metaEl) metaEl.textContent = "Ошибка: " + (e.message || String(e));
            alert(e.message || "Ошибка обновления размера базы");
          });
      }

      var DISK_FOLDER_PALETTE = [
        "bg-primary",
        "bg-info",
        "bg-success",
        "bg-warning",
        "bg-danger",
        "bg-secondary",
        "bg-dark",
        "bg-arielle-smile",
        "bg-plum-plate",
        "bg-night-fade",
        "bg-malibu-beach",
        "bg-ripe-malin"
      ];
      var DISK_COLLAPSE_KEY = "datagon_dashboard_disk_collapsed_v1";

      function setDiskError(message) {
        var el = document.getElementById("dg-disk-error");
        if (!el) return;
        if (!message) {
          el.style.display = "none";
          el.textContent = "";
          return;
        }
        el.style.display = "";
        el.textContent = "Ошибка: " + message;
      }

      function clearDiskUsageUI() {
        var ids = [
          "dg-disk-project-size",
          "dg-disk-project-files",
          "dg-disk-fs-used",
          "dg-disk-fs-used-pct",
          "dg-disk-fs-free",
          "dg-disk-fs-free-pct",
          "dg-disk-folder-count",
          "dg-disk-scan-meta",
          "dg-disk-project-path",
          "dg-disk-meta",
          "dg-disk-legend-project",
          "dg-disk-legend-other",
          "dg-disk-legend-free",
          "dg-disk-folders-hint"
        ];
        ids.forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.textContent = "—";
        });
      }

      function renderDiskUsage(diskUsage) {
        if (!diskUsage) {
          clearDiskUsageUI();
          setDiskError("Нет данных");
          return;
        }
        if (diskUsage.error) {
          clearDiskUsageUI();
          setDiskError(diskUsage.error);
          return;
        }
        setDiskError(null);

        var projectBytes = Number(diskUsage.projectSizeBytes || 0);
        var projectFiles = Number(diskUsage.projectFileCount || 0);
        var folders = Array.isArray(diskUsage.folders) ? diskUsage.folders.slice() : [];
        var fs = diskUsage.fileSystem || {};

        var projSizeEl = document.getElementById("dg-disk-project-size");
        if (projSizeEl) projSizeEl.textContent = fmtBytes(projectBytes);
        var projFilesEl = document.getElementById("dg-disk-project-files");
        if (projFilesEl) projFilesEl.textContent = num(projectFiles) + " файлов · " + num(folders.length) + " папок";

        var pathEl = document.getElementById("dg-disk-project-path");
        if (pathEl) pathEl.textContent = diskUsage.projectPath || "—";

        var metaEl = document.getElementById("dg-disk-meta");
        if (metaEl) {
          var parts = [
            "обновлено: " + fmtDate(diskUsage.scannedAt),
            (diskUsage.cached ? "из кэша" : "свежий расчёт")
          ];
          if (Number(diskUsage.scanDurationMs || 0) > 0) {
            parts.push("скан: " + Math.round(Number(diskUsage.scanDurationMs)) + " мс");
          }
          metaEl.textContent = parts.join(" · ");
        }

        var scanMetaEl = document.getElementById("dg-disk-scan-meta");
        if (scanMetaEl) {
          scanMetaEl.textContent = "скан: " + (Number(diskUsage.scanDurationMs || 0) > 0
            ? Math.round(Number(diskUsage.scanDurationMs)) + " мс"
            : "—");
        }
        var folderCountEl = document.getElementById("dg-disk-folder-count");
        if (folderCountEl) folderCountEl.textContent = num(folders.length);

        var fsUsedEl = document.getElementById("dg-disk-fs-used");
        var fsUsedPctEl = document.getElementById("dg-disk-fs-used-pct");
        var fsFreeEl = document.getElementById("dg-disk-fs-free");
        var fsFreePctEl = document.getElementById("dg-disk-fs-free-pct");
        var bar = document.getElementById("dg-disk-fs-bar");
        var legendProj = document.getElementById("dg-disk-legend-project");
        var legendOther = document.getElementById("dg-disk-legend-other");
        var legendFree = document.getElementById("dg-disk-legend-free");

        if (fs && !fs.error && Number(fs.sizeBytes || 0) > 0) {
          var total = Number(fs.sizeBytes || 0);
          var used = Number(fs.usedBytes || 0);
          var free = Number(fs.freeBytes || 0);
          var projShare = Math.min(used, projectBytes);
          var otherShare = Math.max(0, used - projShare);
          var pProj = total > 0 ? (projShare / total) * 100 : 0;
          var pOther = total > 0 ? (otherShare / total) * 100 : 0;
          var pFree = total > 0 ? (free / total) * 100 : 0;

          if (fsUsedEl) fsUsedEl.textContent = fmtBytes(used);
          if (fsUsedPctEl)
            fsUsedPctEl.textContent =
              "из " + fmtBytes(total) + " (" + Number(fs.usedPercent || (total ? (used / total) * 100 : 0)).toFixed(1) + "%)";
          if (fsFreeEl) fsFreeEl.textContent = fmtBytes(free);
          if (fsFreePctEl)
            fsFreePctEl.textContent = total > 0 ? (100 - Number(fs.usedPercent || 0)).toFixed(1) + " %" : "— %";

          if (bar) {
            var segs = bar.querySelectorAll(".dg-disk-fs-seg");
            if (segs[0]) segs[0].style.width = pProj.toFixed(2) + "%";
            if (segs[1]) segs[1].style.width = pOther.toFixed(2) + "%";
            if (segs[2]) segs[2].style.width = pFree.toFixed(2) + "%";
          }
          if (legendProj) legendProj.textContent = fmtBytes(projShare) + " (" + pProj.toFixed(1) + "%)";
          if (legendOther) legendOther.textContent = fmtBytes(otherShare) + " (" + pOther.toFixed(1) + "%)";
          if (legendFree) legendFree.textContent = fmtBytes(free) + " (" + pFree.toFixed(1) + "%)";
        } else {
          if (fsUsedEl) fsUsedEl.textContent = "—";
          if (fsUsedPctEl) fsUsedPctEl.textContent = fs && fs.error ? fs.error : "недоступно";
          if (fsFreeEl) fsFreeEl.textContent = "—";
          if (fsFreePctEl) fsFreePctEl.textContent = "—";
          if (bar) {
            var segs2 = bar.querySelectorAll(".dg-disk-fs-seg");
            if (segs2[0]) segs2[0].style.width = "0%";
            if (segs2[1]) segs2[1].style.width = "0%";
            if (segs2[2]) segs2[2].style.width = "100%";
          }
          if (legendProj) legendProj.textContent = fmtBytes(projectBytes);
          if (legendOther) legendOther.textContent = "—";
          if (legendFree) legendFree.textContent = "—";
        }

        var maxFolderBytes = folders.reduce(function (acc, f) {
          return Math.max(acc, Number(f.sizeBytes || 0));
        }, 0);
        var mount = document.getElementById("dg-disk-folders-mount");
        var hint = document.getElementById("dg-disk-folders-hint");
        if (hint) {
          hint.textContent = num(folders.length) + " папок · сумма: " + fmtBytes(projectBytes);
        }
        if (mount) {
          mount.replaceChildren();
          if (folders.length === 0) {
            var empty = document.createElement("div");
            empty.className = "text-muted";
            empty.textContent = "Папок не найдено";
            mount.appendChild(empty);
          } else {
            folders.forEach(function (f, idx) {
              var sizeBytes = Number(f.sizeBytes || 0);
              var pctOfProject = projectBytes > 0 ? (sizeBytes / projectBytes) * 100 : 0;
              var pctOfMax = maxFolderBytes > 0 ? (sizeBytes / maxFolderBytes) * 100 : 0;
              var color = DISK_FOLDER_PALETTE[idx % DISK_FOLDER_PALETTE.length];

              var row = document.createElement("div");
              row.className = "dg-disk-folder-row";

              var nameCell = document.createElement("div");
              nameCell.className = "dg-disk-folder-name";
              var nameSpan = document.createElement("span");
              nameSpan.className = "name-text";
              nameSpan.textContent = f.name || "—";
              nameSpan.title = f.name || "";
              nameCell.appendChild(nameSpan);
              if (f.isHidden) {
                var hiddenBadge = document.createElement("span");
                hiddenBadge.className = "badge bg-light text-muted border";
                hiddenBadge.textContent = "скрытая";
                nameCell.appendChild(hiddenBadge);
              }
              if (Number(f.errorCount || 0) > 0) {
                var errBadge = document.createElement("span");
                errBadge.className = "badge bg-warning text-dark";
                errBadge.title = "Часть файлов не удалось прочитать (нет доступа)";
                errBadge.textContent = "нет доступа: " + num(f.errorCount);
                nameCell.appendChild(errBadge);
              }

              var sizeCell = document.createElement("div");
              sizeCell.className = "dg-disk-folder-size";
              var sizeStrong = document.createElement("strong");
              sizeStrong.textContent = fmtBytes(sizeBytes);
              sizeCell.appendChild(sizeStrong);
              var filesSpan = document.createElement("div");
              filesSpan.className = "dg-disk-folder-files";
              filesSpan.textContent = num(f.fileCount || 0) + " файлов";
              sizeCell.appendChild(filesSpan);

              var pctCell = document.createElement("div");
              pctCell.className = "dg-disk-folder-percent";
              pctCell.textContent = pctOfProject.toFixed(1) + " %";

              var barCell = document.createElement("div");
              barCell.className = "dg-disk-folder-bar";
              var barFill = document.createElement("span");
              barFill.className = color;
              barFill.style.width = Math.max(0.5, pctOfMax).toFixed(2) + "%";
              barFill.title = fmtBytes(sizeBytes) + " — " + pctOfProject.toFixed(1) + " % проекта";
              barCell.appendChild(barFill);

              row.appendChild(nameCell);
              row.appendChild(sizeCell);
              row.appendChild(pctCell);
              row.appendChild(barCell);
              mount.appendChild(row);
            });
          }
        }
      }

      function loadDiskUsage(forceRefresh) {
        var metaEl = document.getElementById("dg-disk-meta");
        var hint = document.getElementById("dg-disk-folders-hint");
        var btn = document.getElementById("dg-disk-refresh");
        var url = "/api/processes/disk-usage" + (forceRefresh ? "?refresh=1" : "");
        if (btn) btn.disabled = true;
        if (metaEl) metaEl.textContent = forceRefresh ? "Пересчитываем разбивку..." : (metaEl.textContent || "загрузка...");
        if (hint) hint.textContent = "загрузка...";
        return fetch(url, { credentials: "same-origin" })
          .then(function (r) {
            return parseJsonResponse(r, "Не удалось получить разбивку диска");
          })
          .then(function (x) {
            if (!x.ok || !x.j.success) throw new Error(x.j.error || "Не удалось получить разбивку диска");
            renderDiskUsage(x.j.diskUsage);
          })
          .catch(function (e) {
            setDiskError(e.message || String(e));
            if (hint) hint.textContent = "—";
          })
          .finally(function () {
            if (btn) btn.disabled = false;
          });
      }

      function initDiskCollapse() {
        var card = document.getElementById("dg-disk-card");
        var body = document.getElementById("dg-disk-body");
        var btn = document.getElementById("dg-disk-toggle");
        if (!card || !body || !btn) return;
        var apply = function (collapsed) {
          body.style.display = collapsed ? "none" : "";
          btn.textContent = collapsed ? "Развернуть" : "Свернуть";
        };
        var initial = false;
        try {
          initial = window.localStorage && window.localStorage.getItem(DISK_COLLAPSE_KEY) === "1";
        } catch (_) {}
        apply(initial);
        btn.addEventListener("click", function () {
          var nextCollapsed = body.style.display !== "none" ? true : false;
          apply(nextCollapsed);
          try {
            if (window.localStorage) window.localStorage.setItem(DISK_COLLAPSE_KEY, nextCollapsed ? "1" : "0");
          } catch (_) {}
        });
      }

      document.getElementById("dashboard-sync-all").addEventListener("click", function () {
        fetch("/api/sync-all-start", { method: "POST", credentials: "same-origin" })
          .then(function (r) {
            return r.json().then(function (j) {
              return { ok: r.ok, j: j };
            });
          })
          .then(function (x) {
            if (!x.ok || !x.j.success) throw new Error(x.j.error || x.j.message || "Не удалось запустить синхронизацию");
            loadDashboard();
          })
          .catch(function (e) {
            alert(e.message || "Ошибка запуска синхронизации");
          });
      });

      document.getElementById("dashboard-refresh").addEventListener("click", function () {
        loadDashboard();
        loadDiskUsage(false);
      });
      document.getElementById("dashboard-db-size-refresh").addEventListener("click", refreshDatabaseSize);

      var diskRefreshBtn = document.getElementById("dg-disk-refresh");
      if (diskRefreshBtn) {
        diskRefreshBtn.addEventListener("click", function () {
          loadDiskUsage(true);
        });
      }
      initDiskCollapse();

      loadDashboard();
      loadDiskUsage(false);
      pollTimer = setInterval(loadDashboard, 15000);
    })();
  </script>
