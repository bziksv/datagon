<script>
(function () {
  "use strict";

  var MSALES_COLS = [
    ["row_no", "№"],
    ["manager_name", "Менеджер"],
    ["payment_terms", "Условия\nоплаты"],
    ["paid_at", "Дата\nоплаты"],
    ["invoice_org", "Счет от ИП\nили ООО"],
    ["order_url", "Ссылка\nна заказ"],
    ["amount_ex_delivery", "Сумма оплаты\nбез доставки"],
    ["vat", "Ндс"],
    ["our_invoice_no", "№ нашего\nсчета"],
    ["has_contract", "Наличие\nдоговора"],
    ["supplier_invoice_url", "Ссылка на счет\nпоставщика"],
    ["amount_incl_stock", "Сумма оплаты\n(вкл. запасы)"],
    ["delivery_to_us", "Доставка\nдо нас"],
    ["supplier_name", "Поставщик"],
    ["supplier_invoice_no", "№ счета\nпоставщика"],
    ["diff", "Разница"],
    ["pct_r", "% Р."],
    ["status", "Статус"],
    ["pct_mp", "% МП."],
    ["bonus", "Премия"],
    ["_hand", "Передан"],
    ["_del", ""],
  ];

  var CALC_KEYS = { diff: 1, pct_r: 1, bonus: 1, pct_mp: 1 };
  var MONEY_KEYS = { amount_ex_delivery: 1, amount_incl_stock: 1, delivery_to_us: 1, diff: 1, bonus: 1 };
  var PCT_KEYS = { vat: 1, pct_r: 1, pct_mp: 1 };
  var SUPP_STACK_KEYS = {
    amount_incl_stock: 1,
    delivery_to_us: 1,
    supplier_name: 1,
    supplier_invoice_no: 1,
    supplier_invoice_url: 1,
  };

  var FILTERS_KEY = "datagon_manager_sales_filters_collapsed_v1";
  var TABLE_COLLAPSE_KEY = "dg.manager-sales.table-card.collapsed.v1";
  var COLS_KEY = "dg.msl.colvisible.v2";
  var WIDTHS_KEY = "dg.msl.colwidths.v1";
  var PAGE_SLUG = "manager-sales";

  var FIELD_GROUPS = [
    { title: "Основные", keys: ["search", "year", "month", "status", "limit"] },
    { title: "Сделка", keys: ["supplier", "has_contract", "invoice_org", "archived"] },
  ];

  var CONTRACT_OPTS = ["Обычный договор", "Нет", "Договор-Счет"];
  var STATUS_OPTS = ["Заказан у поставщика", "Отгружен", "Частично отгружен", "Возврат средств"];
  var INVOICE_MARKS = [
    { key: "black", title: "Чёрный", label: "Создан платёж поставщика, который можно оплачивать" },
    { key: "blue", title: "Синий", label: "Платёж оплачен, можно заносить в МойСклад" },
    {
      key: "orange",
      title: "Оранжевый",
      label: "Создан Заказ поставщику — Счёт поставщику — Исходящий платёж/ордер",
    },
    { key: "green", title: "Зелёный", label: "Товар принят" },
  ];
  var INV_HINT =
    "Клик по ссылке на счёт поставщика — выбрать цвет.\nЧёрный — создан платёж поставщика, который можно оплачивать.\nСиний — платёж оплачен, можно заносить в МойСклад.\nОранжевый — создан Заказ поставщику — Счёт поставщику — Исходящий платёж/ордер.\nЗелёный — товар принят.";
  var OUR_INV_HINT =
    "Зелёный — создан заказ покупателя + счёт + входящий платёж.\nКлик по номеру — включить или снять отметку.";
  var MONTH_NAMES = ["", "январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
  var MONTH_SHORT = ["", "янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
  var cy = new Date().getFullYear();
  var cm = String(new Date().getMonth() + 1);
  var state = {
    year: cy,
    month: cm,
    manager_user_id: "all",
    search: "",
    status: "",
    supplier: "",
    has_contract: "",
    invoice_org: "",
    archived: "0",
    limit: 100,
    offset: 0,
    sort_by: "row_no",
    sort_dir: "asc",
    total: 0,
    rows: [],
    totals: null,
    plan: null,
    can_write: false,
    can_pick_manager: false,
    can_edit_plans: false,
    actor_user_id: null,
    actor_full_name: "",
    managers: [],
    years: [cy],
    loading: false,
    pending: {
      year: cy,
      month: cm,
      manager_user_id: "all",
      search: "",
      status: "",
      supplier: "",
      has_contract: "",
      invoice_org: "",
      archived: "0",
      limit: 100,
    },
    csvText: "",
    csvDry: null,
    deleteId: null,
    handId: null,
    visible: MSALES_COLS.map(function (c) { return c[0]; }),
    widths: {},
  };

  function el(id) {
    return document.getElementById(id);
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function safeHref(raw) {
    var s = String(raw || "").trim();
    if (!s) return "";
    if (/^(javascript|data|vbscript):/i.test(s)) return "";
    if (/^https?:\/\//i.test(s)) return s;
    if (s.indexOf("://") >= 0) return "";
    if (/^www\./i.test(s)) return "https://" + s;
    if (/^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}([/:?#]|$)/i.test(s) && !/\s/.test(s)) return "https://" + s;
    return "";
  }

  function urlInputHtml(key, val) {
    return (
      '<input type="url" class="form-control form-control-sm dg-msl-cell-input" data-msl-field="' +
      esc(key) +
      '" value="' +
      esc(val || "") +
      '" placeholder="https://…" />'
    );
  }

  function urlViewHtml(key, val, canEdit, extraAttrs, row) {
    var href = safeHref(val);
    var raw = String(val || "").trim();
    var label = esc(raw);
    var extra = extraAttrs || "";
    var penTitle = key === "supplier_invoice_url" ? "Ссылка или склад" : "Изменить ссылку";
    var pen = canEdit
      ? '<button type="button" class="dg-msl-url-edit" data-msl-url-edit="' +
        esc(key) +
        '"' +
        extra +
        ' title="' +
        esc(penTitle) +
        '" aria-label="' +
        esc(penTitle) +
        '" data-dg-no-activity="1"><i class="pe-7s-pen" aria-hidden="true"></i></button>'
      : "";
    if (key === "supplier_invoice_url" && row) {
      var mark = String(row.invoice_mark || "");
      var meta = invoiceMarkMeta(mark);
      var text = raw || "—";
      var tip = meta ? meta.title + " — " + meta.label : "Выбрать подсветку счёта поставщика";
      var chip =
        '<button type="button" class="dg-msl-inv-chip' +
        (mark ? " dg-msl-inv-" + esc(mark) : "") +
        '" data-msl-inv-mark="' +
        row.id +
        '" title="' +
        esc(tip) +
        '" data-dg-tooltip="' +
        esc(tip) +
        '"' +
        (canEdit ? ' data-dg-notify-start="Выбор подсветки…"' : ' data-dg-no-activity="1"') +
        ">" +
        esc(text) +
        "</button>";
      var open =
        href
          ? '<a class="dg-msl-url-open" href="' +
            esc(href) +
            '" target="_blank" rel="noopener noreferrer" title="Открыть ссылку" data-dg-no-activity="1">↗</a>'
          : "";
      return '<div class="dg-msl-url-cell dg-msl-inv-cell">' + chip + open + pen + "</div>";
    }
    var link;
    if (href) {
      link =
        '<a class="dg-msl-url-link" href="' +
        esc(href) +
        '" target="_blank" rel="noopener noreferrer" title="' +
        label +
        '">' +
        label +
        "</a>";
    } else if (raw) {
      link = '<span class="dg-msl-url-plain" title="' + label + '">' + label + "</span>";
    } else {
      link = '<span class="text-muted">—</span>';
    }
    return '<div class="dg-msl-url-cell">' + link + pen + "</div>";
  }

  function invoiceMarkMeta(key) {
    var k = String(key || "");
    for (var i = 0; i < INVOICE_MARKS.length; i += 1) {
      if (INVOICE_MARKS[i].key === k) return INVOICE_MARKS[i];
    }
    return null;
  }

  function ourInvoiceChipHtml(row) {
    var mark = String(row.our_invoice_mark || "");
    var raw = String(row.our_invoice_no || "").trim();
    var text = raw || "—";
    var on = mark === "green";
    var tip = on
      ? "Зелёный — создан заказ покупателя + счёт + входящий платёж"
      : "Пометить зелёным: заказ покупателя + счёт + входящий платёж";
    var canEdit = state.can_write && !row.is_archived;
    var chip =
      '<button type="button" class="dg-msl-inv-chip' +
      (on ? " dg-msl-inv-green" : "") +
      '" data-msl-our-mark="' +
      row.id +
      '" title="' +
      esc(tip) +
      '" data-dg-tooltip="' +
      esc(tip) +
      '"' +
      (canEdit ? ' data-dg-notify-start="Отметка нашего счёта…"' : ' data-dg-no-activity="1"') +
      ">" +
      esc(text) +
      "</button>";
    var pen = canEdit
      ? '<button type="button" class="dg-msl-url-edit" data-msl-our-edit="1" title="Изменить номер счёта" aria-label="Изменить номер счёта" data-dg-no-activity="1"><i class="pe-7s-pen" aria-hidden="true"></i></button>'
      : "";
    return '<div class="dg-msl-inv-cell">' + chip + pen + "</div>";
  }

  function colTitle(c) {
    return String((c && c[1]) || "").replace(/\n/g, " ");
  }

  function thLabelHtml(label) {
    return String(label || "")
      .split("\n")
      .map(esc)
      .join("<br>");
  }

  function labelMonthOptions() {
    var sel = el("dg-msl-f-month");
    if (!sel) return;
    [].slice.call(sel.options).forEach(function (opt) {
      if (!opt.value) return;
      var base = opt.getAttribute("data-msl-base") || String(opt.textContent || "").replace(/\s*\(текущий\)\s*$/, "");
      opt.setAttribute("data-msl-base", base);
      opt.textContent = opt.value === cm ? base + " (текущий)" : base;
    });
  }

  function toast(type, message) {
    if (window.DatagonNotify && window.DatagonNotify.toast) {
      window.DatagonNotify.toast({ type: type || "info", message: message });
    }
  }

  function fmt() {
    return window.DatagonFmt || null;
  }

  function money(v) {
    if (v == null || v === "") return "—";
    var f = fmt();
    return f && f.formatMoney ? f.formatMoney(v) : String(v);
  }

  function moneyInt(v) {
    if (v == null || v === "") return "—";
    var n = Number(v);
    if (!Number.isFinite(n)) return "—";
    var f = fmt();
    if (f && f.formatMoney) return f.formatMoney(Math.round(n), { maxFractionDigits: 0 });
    return String(Math.round(n));
  }

  function num(v, digits) {
    if (v == null || v === "") return "—";
    var f = fmt();
    if (f && f.formatNumber) return f.formatNumber(v, { maxFractionDigits: digits == null ? 2 : digits });
    return String(v);
  }

  function parseNum(raw) {
    var f = fmt();
    if (f && f.parseNumberInput) return f.parseNumberInput(raw);
    var s = String(raw || "").replace(/\s/g, "").replace(",", ".");
    if (!s) return "";
    var n = Number(s);
    return Number.isFinite(n) ? n : raw;
  }

  function userColsKey() {
    var u = "guest";
    try { u = String(localStorage.getItem("currentUser") || "guest"); } catch (e) {}
    return COLS_KEY + ":" + u;
  }
  function userWidthKey() {
    var u = "guest";
    try { u = String(localStorage.getItem("currentUser") || "guest"); } catch (e) {}
    return WIDTHS_KEY + ":" + u;
  }

  function loadVisible() {
    try {
      var raw = localStorage.getItem(userColsKey());
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length) {
        var allowed = {};
        MSALES_COLS.forEach(function (c) { allowed[c[0]] = 1; });
        state.visible = arr.filter(function (k) { return allowed[k]; });
        if (!state.visible.length) state.visible = MSALES_COLS.map(function (c) { return c[0]; });
        if (state.visible.indexOf("manager_name") < 0) {
          var at = state.visible.indexOf("row_no");
          state.visible.splice(at >= 0 ? at + 1 : 0, 0, "manager_name");
        }
      }
    } catch (e) {}
  }

  function saveVisible() {
    try { localStorage.setItem(userColsKey(), JSON.stringify(state.visible)); } catch (e) {}
  }

  function loadWidths() {
    try {
      var raw = localStorage.getItem(userWidthKey());
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o && typeof o === "object") state.widths = o;
    } catch (e) {}
  }

  function saveWidths() {
    try { localStorage.setItem(userWidthKey(), JSON.stringify(state.widths || {})); } catch (e) {}
  }

  function visibleCols() {
    var set = {};
    (state.visible || []).forEach(function (k) { set[k] = 1; });
    set._del = 1;
    set._hand = 1;
    return MSALES_COLS.filter(function (c) { return set[c[0]]; });
  }

  function colWidthStyle(key) {
    var w = Number(state.widths[key]);
    if (!Number.isFinite(w) || w < 40) return "";
    return "width:" + w + "px;min-width:" + w + "px;max-width:" + w + "px";
  }

  function pageCount() {
    var lim = Math.max(1, Number(state.limit) || 100);
    return Math.max(1, Math.ceil((Number(state.total) || 0) / lim));
  }
  function currentPage() {
    var lim = Math.max(1, Number(state.limit) || 100);
    return Math.floor((Number(state.offset) || 0) / lim) + 1;
  }

  function syncDirty() {
    var btn = el("dg-msl-apply");
    if (!btn) return;
    var p = state.pending;
    var dirty =
      String(p.search) !== String(state.search) ||
      String(p.year) !== String(state.year) ||
      String(p.month || "") !== String(state.month || "") ||
      String(p.manager_user_id) !== String(state.manager_user_id) ||
      String(p.status) !== String(state.status) ||
      String(p.supplier) !== String(state.supplier) ||
      String(p.has_contract) !== String(state.has_contract) ||
      String(p.invoice_org) !== String(state.invoice_org) ||
      String(p.archived || "0") !== String(state.archived || "0") ||
      Number(p.limit) !== Number(state.limit);
    btn.classList.toggle("dg-flt-dirty", dirty);
  }

  function readPendingFromForm() {
    state.pending.search = (el("dg-msl-search") && el("dg-msl-search").value) || "";
    state.pending.year = Number((el("dg-msl-f-year") && el("dg-msl-f-year").value) || cy) || cy;
    state.pending.month = (el("dg-msl-f-month") && el("dg-msl-f-month").value) || "";
    state.pending.manager_user_id = (el("dg-msl-f-manager") && el("dg-msl-f-manager").value) || "";
    state.pending.status = (el("dg-msl-f-status") && el("dg-msl-f-status").value) || "";
    state.pending.supplier = (el("dg-msl-f-supplier") && el("dg-msl-f-supplier").value) || "";
    state.pending.has_contract = (el("dg-msl-f-contract") && el("dg-msl-f-contract").value) || "";
    state.pending.invoice_org = (el("dg-msl-f-org") && el("dg-msl-f-org").value) || "";
    state.pending.archived = (el("dg-msl-f-archived") && el("dg-msl-f-archived").value) || "0";
    var lim = Number(el("dg-msl-f-limit") && el("dg-msl-f-limit").value);
    state.pending.limit = Number.isFinite(lim) && lim > 0 ? lim : 100;
    syncDirty();
  }

  function writeFormFromPending() {
    var p = state.pending;
    if (el("dg-msl-search")) el("dg-msl-search").value = p.search || "";
    if (el("dg-msl-table-search-mirror")) el("dg-msl-table-search-mirror").value = p.search || "";
    if (el("dg-msl-f-year")) el("dg-msl-f-year").value = String(p.year || cy);
    if (el("dg-msl-f-month")) el("dg-msl-f-month").value = p.month || "";
    if (el("dg-msl-f-manager")) el("dg-msl-f-manager").value = p.manager_user_id || "";
    if (el("dg-msl-f-status")) {
      var stSel = el("dg-msl-f-status");
      var stVal = p.status || "";
      if (stVal) {
        var has = false;
        [].slice.call(stSel.options).forEach(function (o) {
          if (o.value === stVal) has = true;
        });
        if (!has) {
          var extra = document.createElement("option");
          extra.value = stVal;
          extra.textContent = stVal;
          stSel.appendChild(extra);
        }
      }
      stSel.value = stVal;
    }
    if (el("dg-msl-f-supplier")) el("dg-msl-f-supplier").value = p.supplier || "";
    if (el("dg-msl-f-contract")) {
      var hc = p.has_contract || "";
      if (hc === "0") hc = "Нет";
      if (hc === "1") hc = "";
      el("dg-msl-f-contract").value = hc;
    }
    if (el("dg-msl-f-org")) el("dg-msl-f-org").value = p.invoice_org || "";
    if (el("dg-msl-f-archived")) el("dg-msl-f-archived").value = p.archived == null || p.archived === "" ? "0" : String(p.archived);
    if (el("dg-msl-f-limit")) el("dg-msl-f-limit").value = String(p.limit || 100);
    if (el("dg-msl-page-limit")) el("dg-msl-page-limit").value = String(p.limit || 100);
    syncDirty();
  }

  function persistFilters() {
    if (window.DatagonFilters && window.DatagonFilters.save) {
      window.DatagonFilters.save(PAGE_SLUG, state.pending);
    }
  }

  function commitFilters() {
    readPendingFromForm();
    state.year = state.pending.year;
    state.month = state.pending.month || "";
    state.manager_user_id = state.pending.manager_user_id;
    state.search = state.pending.search;
    state.status = state.pending.status;
    state.supplier = state.pending.supplier;
    state.has_contract = state.pending.has_contract;
    state.invoice_org = state.pending.invoice_org;
    state.archived = state.pending.archived || "0";
    state.limit = state.pending.limit;
    state.offset = 0;
    syncTableOwnerTitle();
    persistFilters();
    syncDirty();
    syncArchiveViewBtn();
    return load();
  }

  function hideActionLog() {
    var box = el("dg-msl-action-log");
    if (!box) return;
    box.classList.add("d-none");
    box.classList.remove("alert-info", "alert-success", "alert-danger", "alert-warning");
    box.innerHTML = "";
  }

  function showActionLog(type, html) {
    var box = el("dg-msl-action-log");
    if (!box) return;
    box.classList.remove("d-none", "alert-info", "alert-success", "alert-danger", "alert-warning");
    box.classList.add("alert-" + (type || "info"));
    box.innerHTML = html;
  }

  function appliedFilterSummary() {
    var bits = ["год " + state.year];
    if (state.month) bits.push(MONTH_NAMES[Number(state.month)] || ("месяц " + state.month));
    if (state.can_pick_manager) {
      if (!state.manager_user_id || state.manager_user_id === "all") bits.push("все менеджеры");
      else bits.push("менеджер «" + managerLabelById(state.manager_user_id) + "»");
    } else bits.push("своя таблица");
    if (state.search) bits.push("поиск «" + esc(state.search) + "»");
    if (state.status) bits.push("статус «" + esc(state.status) + "»");
    if (state.supplier) bits.push("поставщик «" + esc(state.supplier) + "»");
    if (state.has_contract) bits.push("договор «" + state.has_contract + "»");
    if (state.invoice_org === "ip") bits.push("ИП");
    if (state.invoice_org === "ooo") bits.push("ООО");
    if (state.archived === "1") bits.push("архив");
    else if (state.archived === "all") bits.push("включая архив");
    return bits.join(", ");
  }

  function buildQuery() {
    var p = new URLSearchParams();
    p.set("year", String(state.year));
    if (state.month) p.set("month", String(state.month));
    p.set("limit", String(state.limit || 100));
    p.set("offset", String(state.offset || 0));
    p.set("sort_by", state.sort_by || "row_no");
    p.set("sort_dir", state.sort_dir || "asc");
    if (state.search) p.set("search", state.search);
    if (state.status) p.set("status", state.status);
    if (state.supplier) p.set("supplier", state.supplier);
    if (state.has_contract !== "") p.set("has_contract", state.has_contract);
    if (state.invoice_org) p.set("invoice_org", state.invoice_org);
    p.set("archived", state.archived || "0");
    if (state.can_pick_manager) {
      p.set("manager_user_id", state.manager_user_id || "all");
    }
    return "?" + p.toString();
  }

  var urlSyncTimer = null;
  var SHARE_KEYS = [
    "year",
    "month",
    "search",
    "status",
    "supplier",
    "has_contract",
    "invoice_org",
    "archived",
    "manager_user_id",
    "limit",
    "page",
    "offset",
    "sort_by",
    "sort_dir",
  ];

  function hasShareQuery() {
    try {
      var p = new URLSearchParams(window.location.search || "");
      return SHARE_KEYS.some(function (k) {
        return p.get(k) != null && String(p.get(k)) !== "";
      });
    } catch (e) {
      return false;
    }
  }

  function applyShareQueryToPending() {
    if (!hasShareQuery()) return false;
    var p = new URLSearchParams(window.location.search || "");
    var y = Number(p.get("year"));
    if (Number.isFinite(y) && y >= 2019 && y <= 2100) state.pending.year = y;
    if (p.has("month")) {
      var m = String(p.get("month") || "").trim();
      if (m === "all" || m === "0" || m === "") state.pending.month = "";
      else {
        var mn = Number(m);
        state.pending.month = Number.isFinite(mn) && mn >= 1 && mn <= 12 ? String(mn) : "";
      }
    }
    if (p.has("search")) state.pending.search = p.get("search") || "";
    if (p.has("status")) state.pending.status = p.get("status") || "";
    if (p.has("supplier")) state.pending.supplier = p.get("supplier") || "";
    if (p.has("has_contract")) state.pending.has_contract = p.get("has_contract") || "";
    if (p.has("invoice_org")) state.pending.invoice_org = p.get("invoice_org") || "";
    if (p.has("archived")) state.pending.archived = p.get("archived") || "0";
    if (p.has("manager_user_id")) state.pending.manager_user_id = p.get("manager_user_id") || "all";
    var lim = Number(p.get("limit"));
    if (Number.isFinite(lim) && lim > 0) state.pending.limit = lim;
    var sb = p.get("sort_by");
    if (sb && sb !== "_del" && sb !== "_hand") state.sort_by = sb;
    var sd = p.get("sort_dir");
    if (sd === "asc" || sd === "desc") state.sort_dir = sd;
    var page = Number(p.get("page"));
    var off = Number(p.get("offset"));
    if (Number.isFinite(page) && page > 1) {
      state.offset = (page - 1) * (state.pending.limit || 100);
    } else if (Number.isFinite(off) && off > 0) {
      state.offset = off;
    } else {
      state.offset = 0;
    }
    return true;
  }

  function syncUrlFromState() {
    var params = new URLSearchParams();
    params.set("year", String(state.year || cy));
    params.set("month", state.month ? String(state.month) : "all");
    if (state.search) params.set("search", state.search);
    if (state.status) params.set("status", state.status);
    if (state.supplier) params.set("supplier", state.supplier);
    if (state.has_contract) params.set("has_contract", state.has_contract);
    if (state.invoice_org) params.set("invoice_org", state.invoice_org);
    if (state.archived && state.archived !== "0") params.set("archived", state.archived);
    if (state.manager_user_id) params.set("manager_user_id", String(state.manager_user_id));
    if (Number(state.limit) && Number(state.limit) !== 100) params.set("limit", String(state.limit));
    var page = currentPage();
    if (page > 1) params.set("page", String(page));
    if (state.sort_by && state.sort_by !== "row_no") params.set("sort_by", state.sort_by);
    if (state.sort_dir && state.sort_dir !== "asc") params.set("sort_dir", state.sort_dir);
    var next = window.location.pathname + "?" + params.toString();
    try {
      window.history.replaceState(null, "", next);
    } catch (e) {}
  }

  function scheduleUrlSync() {
    if (urlSyncTimer) clearTimeout(urlSyncTimer);
    urlSyncTimer = setTimeout(function () {
      urlSyncTimer = null;
      syncUrlFromState();
    }, 50);
  }

  function json(res) {
    return res.text().then(function (t) {
      var data = {};
      try { data = t ? JSON.parse(t) : {}; } catch (e) { data = { error: t.slice(0, 400) }; }
      if (!res.ok) {
        var err = new Error(data.error || data.message || ("HTTP " + res.status));
        err.body = t;
        throw err;
      }
      return data;
    });
  }

  function fillYears() {
    var sel = el("dg-msl-f-year");
    if (!sel) return;
    var cur = String(state.pending.year || cy);
    var years = state.years.slice();
    if (years.indexOf(cy) < 0) years.unshift(cy);
    var py = Number(state.pending.year);
    if (Number.isFinite(py) && years.indexOf(py) < 0) years.push(py);
    years.sort(function (a, b) { return b - a; });
    sel.innerHTML = years
      .map(function (y) {
        return '<option value="' + y + '"' + (String(y) === cur ? " selected" : "") + ">" + y + "</option>";
      })
      .join("");
  }

  function cellInput(row, key, type, extraClass, extraAttrs) {
    var val = row[key] == null ? "" : row[key];
    if (type === "date" && val) val = String(val).slice(0, 10);
    var extra = extraAttrs || "";
    if (!state.can_write || row.is_archived) {
      if (key === "order_url" || key === "supplier_invoice_url") {
        if (!val) return '<span class="text-muted">—</span>';
        return urlViewHtml(key, val, false, extra, row);
      }
      if (key === "bonus") return '<span class="dg-msl-cell-ro">' + esc(moneyInt(val === "" ? null : val)) + "</span>";
      if (MONEY_KEYS[key]) return '<span class="dg-msl-cell-ro">' + esc(money(val === "" ? null : val)) + "</span>";
      if (PCT_KEYS[key]) return '<span class="dg-msl-cell-ro">' + esc(val === "" ? "—" : num(val) + "%") + "</span>";
      if (key === "has_contract") return esc(val || "—");
      if (key === "status") return esc(val || "—");
      if (key === "invoice_org") return esc(row.invoice_org_label || val || "—");
      return esc(val || "—");
    }
    if (CALC_KEYS[key]) {
      if (key === "bonus") return '<span class="dg-msl-cell-ro">' + esc(moneyInt(val)) + "</span>";
      if (MONEY_KEYS[key]) return '<span class="dg-msl-cell-ro">' + esc(money(val)) + "</span>";
      return '<span class="dg-msl-cell-ro">' + esc(val == null || val === "" ? "—" : num(val) + "%") + "</span>";
    }
    var cls = "form-control form-control-sm dg-msl-cell-input" + (extraClass ? " " + extraClass : "");
    if (key === "invoice_org") {
      return (
        '<input class="' +
        cls +
        '" data-msl-field="invoice_org" list="dg-msl-org-list" value="' +
        esc(row.invoice_org_label || val) +
        '" />'
      );
    }
    if (key === "has_contract") {
      return selectFieldHtml("has_contract", CONTRACT_OPTS, val);
    }
    if (key === "status") {
      return selectFieldHtml("status", STATUS_OPTS, val);
    }
    if (type === "date") {
      return '<input type="date" class="' + cls + '" data-msl-field="' + esc(key) + '" value="' + esc(val) + '" />';
    }
    if (type === "url") {
      if (key === "supplier_invoice_url") return urlViewHtml(key, val, true, extra, row);
      if (!String(val || "").trim()) return urlInputHtml(key, "");
      return urlViewHtml(key, val, true, extra, row);
    }
    if (type === "money" || type === "pct") {
      var shown = val === "" || val == null ? "" : num(val);
      return (
        '<input type="text" inputmode="decimal" class="' +
        cls +
        ' dg-msl-narrow" data-msl-field="' +
        esc(key) +
        '" data-msl-num="' +
        type +
        '"' +
        extra +
        ' value="' +
        esc(shown) +
        '" />'
      );
    }
    return (
      '<input type="text" class="' +
      cls +
      '" data-msl-field="' +
      esc(key) +
      '"' +
      (key === "supplier_name" ? ' list="dg-msl-supplier-list"' : "") +
      extra +
      ' value="' +
      esc(val) +
      '" />'
    );
  }

  function viewingManagerId() {
    if (state.manager_user_id && state.manager_user_id !== "all") return Number(state.manager_user_id);
    if (state.can_pick_manager) return 0;
    return Number(state.actor_user_id) || 0;
  }

  function rowIsHanded(row) {
    var h = Number(row && row.handed_to_user_id);
    return Number.isFinite(h) && h > 0;
  }

  function rowHandedAway(row) {
    if (!rowIsHanded(row)) return false;
    var view = viewingManagerId();
    if (!view) return false;
    return Number(row.manager_user_id) === view && Number(row.handed_to_user_id) !== view;
  }

  function invoiceMatchKey(row) {
    return String((row && row.our_invoice_no) || "")
      .trim()
      .toLowerCase();
  }

  function incomingSource(row) {
    if (!row || rowIsHanded(row) || row.is_archived) return null;
    var key = invoiceMatchKey(row);
    if (!key) return null;
    var owner = Number(row.manager_user_id);
    var found = null;
    (state.rows || []).forEach(function (r) {
      if (!r || r.id === row.id || r.is_archived) return;
      if (!rowIsHanded(r)) return;
      if (invoiceMatchKey(r) !== key) return;
      if (Number(r.handed_to_user_id) !== owner) return;
      found = r;
    });
    return found;
  }

  function dativeFirst(word) {
    var s = String(word || "");
    if (s.length < 2) return s;
    var last = s.charAt(s.length - 1);
    var low = last.toLowerCase();
    function ch(c) {
      return last === last.toUpperCase() ? c.toUpperCase() : c;
    }
    if (low === "а") return s.slice(0, -1) + ch("е");
    if (low === "я") return s.slice(0, -1) + ch("и");
    if (low === "й" || low === "ь") return s.slice(0, -1) + ch("ю");
    if ("бвгджзклмнпрстфхцчшщ".indexOf(low) >= 0) return s + ch("у");
    return s;
  }

  function dativePerson(full) {
    var parts = String(full || "").trim().split(/\s+/);
    if (!parts[0]) return String(full || "").trim();
    parts[0] = dativeFirst(parts[0]);
    return parts.join(" ");
  }

  function handedName(row) {
    return String(row.handed_to_full_name || row.handed_to_username || "").trim();
  }

  function ownerName(row) {
    return String(row.manager_full_name || row.manager_username || "").trim();
  }

  function handLabel(row) {
    var view = viewingManagerId();
    if (rowIsHanded(row)) {
      if (view && Number(row.handed_to_user_id) === view && Number(row.manager_user_id) !== view) {
        var from = ownerName(row);
        return from ? "от " + from : "получен";
      }
      var to = handedName(row);
      return to ? "к " + dativePerson(to) : "";
    }
    var src = incomingSource(row);
    if (src) {
      var giver = ownerName(src);
      return giver ? "от " + giver : "получен";
    }
    return "";
  }

  function canHandRow(row) {
    if (!state.can_write || !row || row.is_archived) return false;
    if (state.can_pick_manager) return true;
    return Number(row.manager_user_id) === Number(state.actor_user_id);
  }

  function statusToneClass(status) {

    if (s === "Заказан у поставщика" || s === "Частично отгружен") return "dg-msl-st-wait";
    if (s === "Отгружен") return "dg-msl-st-ok";
    if (s === "Возврат средств") return "dg-msl-st-back";

  function applyStatusTone(td, status) {
    if (!td) return;

    var cls = statusToneClass(status);

  function supplierStackHtml(row, key) {
    var list = rowSuppliers(row);
    var canEdit = state.can_write && !row.is_archived;
    var lines = list
      .map(function (s, i) {
        var fake = Object.assign({}, row, s);
        var extra = ' data-msl-supp-i="' + i + '"';
        var inner;
        if (key === "amount_incl_stock" && rowHandedAway(row)) {
          inner = '<span class="dg-msl-handed-zero">' + esc(money(0)) + "</span>";
        } else if (key === "delivery_to_us" && rowHandedAway(row)) {
          inner = '<span class="dg-msl-handed-zero">' + esc(money(0)) + "</span>";
        } else if (key === "amount_incl_stock" || key === "delivery_to_us") {
          inner = cellInput(fake, key, "money", "dg-msl-narrow", extra);
        } else if (key === "supplier_invoice_url") {
          inner = cellInput(fake, key, "url", "", extra);
        } else {
          inner = cellInput(fake, key, "text", "", extra);
        }
        var miss =
          !row.is_archived &&
          !rowNeedsHighlight(row) &&
          !(key === "amount_incl_stock" && rowHandedAway(row)) &&
          !(key === "delivery_to_us" && rowHandedAway(row)) &&
          suppFieldMissing(s, key);
        var rm =
          canEdit && list.length > 1 && key === "supplier_name"
            ? '<button type="button" class="dg-msl-supp-del" data-msl-supp-del="' +
              i +
              '" title="Убрать поставщика" aria-label="Убрать поставщика" data-dg-no-activity="1">×</button>'
            : "";
        return (
          '<div class="dg-msl-supp-line' +
          (miss ? " dg-msl-missing" : "") +
          '"' +
          (miss && key === "amount_incl_stock" ? ' title="Заполните сумму закупки"' : "") +
          (miss && key === "delivery_to_us" ? ' title="Доставка до нас: сумма в ₽. Если доставки не было — поставьте 0"' : "") +
          ">" +
          inner +
          rm +
          "</div>"
        );

      .join("");
    var add =
      canEdit && key === "supplier_name"
        ? '<button type="button" class="btn btn-link btn-sm p-0 dg-msl-supp-add" data-msl-supp-add="' +
          row.id +
          '" data-dg-notify-start="Добавляем поставщика…">+поставщик</button>'
        : "";
    return '<div class="dg-msl-supp-stack">' + lines + add + "</div>";
  }

  function renderCell(row, key) {
    if (key === "_del") {
      if (!state.can_write) return "";
      if (row.is_archived) return restoreBtnHtml(row);
      return (
        '<button type="button" class="btn btn-sm btn-outline-danger dg-msl-archive-btn" data-msl-del="' +
        row.id +
        '" title="В архив" aria-label="В архив" data-dg-no-activity="1">×</button>'
      );
    }
    if (key === "_hand") {
      var name = handLabel(row);
      var btn =
        canHandRow(row)
          ? '<button type="button" class="btn btn-sm btn-outline-secondary dg-msl-hand-btn" data-msl-hand="' +
            row.id +
            '" title="Передать заказ другому менеджеру" aria-label="Передать заказ" data-dg-notify-start="Выбор менеджера…">⇄</button>'
          : '<span class="dg-msl-hand-ico" title="Передан" aria-hidden="true">⇄</span>';
      var label = name
        ? '<span class="dg-msl-hand-name" title="' + esc(name) + '">' + esc(name) + "</span>"
        : '<span class="text-muted dg-msl-hand-name">—</span>';
      return '<div class="dg-msl-hand-cell">' + btn + label + "</div>";
    }
    var show = row;
    var html = "";
    if (rowHandedAway(row) && (MONEY_KEYS[key] || key === "pct_mp" || key === "vat") && key !== "amount_incl_stock" && key !== "delivery_to_us") {
      html = PCT_KEYS[key]
        ? '<span class="dg-msl-handed-zero">' + esc(num(0) + "%") + "</span>"
        : '<span class="dg-msl-handed-zero">' + esc(key === "bonus" ? moneyInt(0) : money(0)) + "</span>";
    } else if (key === "manager_name") {
      html = '<span class="dg-msl-mgr-name">' + esc(ownerName(row) || "—") + "</span>";
    } else if (key === "row_no") {
      html =
        '<div class="dg-msl-id-row">' +
        '<button type="button" class="dg-msl-log-btn" data-msl-log-id="' +
        row.id +
        '" data-msl-log-label="№ ' +
        esc(row.row_no) +
        '" title="Журнал изменений" aria-label="Журнал изменений" data-dg-notify-start="Открываем журнал…"><i class="pe-7s-note2" aria-hidden="true"></i></button>' +
        '<span class="dg-msl-row-no" title="Номер строки выдаёт система">' +
        esc(row.row_no != null ? row.row_no : "") +
        "</span>" +
        (row.is_archived && state.can_write ? restoreBtnHtml(row) : "") +
        "</div>";
    } else if (key === "paid_at") html = cellInput(show, key, "date");
    else if (key === "our_invoice_no") html = ourInvoiceChipHtml(show);
    else if (key === "order_url") html = cellInput(show, key, "url");
    else if (SUPP_STACK_KEYS[key]) html = supplierStackHtml(row, key);
    else if (MONEY_KEYS[key] || key === "pct_mp" || key === "vat") {
      html = cellInput(show, key, PCT_KEYS[key] ? "pct" : "money");
    } else html = cellInput(show, key, "text");
    if (key !== "_del" && key !== "_hand" && key !== "manager_name" && key !== "row_no") {
      html +=
        '<button type="button" class="dg-msl-field-log-btn" data-msl-log-id="' +
        row.id +
        '" data-msl-log-field="' +
        esc(key) +
        '" data-msl-log-field-label="' +
        esc(colTitle(MSALES_COLS.filter(function (c) { return c[0] === key; })[0] || [key, key])) +
        '" data-msl-log-label="№ ' +
        esc(row.row_no) +
        '" data-dg-no-activity="1">лог</button>';
    }
    return html;
  }

  function rowNeedsHighlight(row) {
    if (!row || row.is_archived) return false;
    if (String(row.payment_terms || "").trim()) return false;
    var paid = row.paid_at != null && String(row.paid_at).trim() !== "";
    var amt = row.amount_ex_delivery != null && row.amount_ex_delivery !== "";
    var url = String(row.order_url || "").trim();
    var inv = String(row.our_invoice_no || "").trim();
    var supp = String(row.supplier_name || "").trim();
    return !paid && !amt && !url && !inv && !supp;
  }

  function isBlankText(v) {
    return v == null || String(v).trim() === "";
  }

  function isBlankNum(v) {
    return v == null || v === "";
  }

  function isStockUrl(v) {
    var s = String(v || "")
      .trim()
      .toLowerCase()
      .replace(/ё/g, "е");
    return s === "склад" || s === "склад.";
  }

  var REQUIRED_KEYS = {
    paid_at: 1,
    invoice_org: 1,
    order_url: 1,
    amount_ex_delivery: 1,
    vat: 1,
    our_invoice_no: 1,
    has_contract: 1,
    status: 1,
  };

  function suppFieldMissing(s, key) {
    if (key === "amount_incl_stock" || key === "delivery_to_us") return isBlankNum(s && s[key]);
    if (key === "supplier_invoice_url") {
      var u = s && s.supplier_invoice_url;
      return isBlankText(u) && !isStockUrl(u);
    }
    return isBlankText(s && s[key]);
  }

  function cellIsMissing(row, key) {
    if (!row || row.is_archived || rowNeedsHighlight(row)) return false;
    if (rowHandedAway(row) && (MONEY_KEYS[key] || key === "vat" || key === "pct_mp")) return false;
    if (REQUIRED_KEYS[key]) {
      if (key === "amount_ex_delivery" || key === "vat") return isBlankNum(row[key]);
      if (key === "order_url") return isBlankText(row.order_url);
      return isBlankText(row[key]);
    }
    if (SUPP_STACK_KEYS[key]) return false;
    return false;
  }

  function handedToneMap() {
    var map = {};
    var n = 0;
    (state.rows || []).forEach(function (r) {
      var x = Number(r && r.handed_to_user_id);
      if (!Number.isFinite(x) || x < 1 || map[x] != null) return;
      map[x] = n % 6;
      n += 1;
    });
    return map;
  }

  function renderTable() {
    buildThead();
    var tbody = el("dg-msl-tbody");
    if (!tbody) return;
    var cols = visibleCols();
    if (!state.rows.length) {
      tbody.innerHTML =
        '<tr><td class="text-muted p-3" colspan="' +
        cols.length +
        '">Нет строк. Нажмите «Добавить строку» или импортируйте CSV.</td></tr>';
      return;
    }
    var tones = handedToneMap();
    tbody.innerHTML = state.rows
      .map(function (row) {
        var trCls = [];
        if (row.is_archived) trCls.push("table-secondary");
        else if (rowIsHanded(row)) {
          trCls.push("dg-msl-handed");
          var tone = tones[Number(row.handed_to_user_id)];
          if (tone > 0) trCls.push("dg-msl-handed-t" + tone);
        } else {
          var srcIn = incomingSource(row);
          if (srcIn) {
            trCls.push("dg-msl-handed");
            var toneIn = tones[Number(srcIn.handed_to_user_id)];
            if (toneIn > 0) trCls.push("dg-msl-handed-t" + toneIn);
          }
        }
        if (rowNeedsHighlight(row)) trCls.push("dg-msl-need-terms");
        return (
          '<tr data-msl-id="' +
          row.id +
          '"' +
          (trCls.length ? ' class="' + trCls.join(" ") + '"' : "") +
          ">" +
          cols
            .map(function (c) {
              var fieldCell = c[0] !== "_del" && c[0] !== "_hand" ? " dg-msl-field-cell" : "";
              var colAttr = c[0] !== "_del" && c[0] !== "_hand" ? ' data-msl-col="' + esc(c[0]) + '"' : "";
              var tone = c[0] === "status" ? statusToneClass(row.status) : "";
              var miss = cellIsMissing(row, c[0]) ? " dg-msl-missing" : "";
              var cls = (fieldCell + (tone ? " " + tone : "") + miss).trim();
              var missTip = "";
              return (
                '<td class="' +
                cls +
                '"' +
                colAttr +
                missTip +
                ' style="' +
                colWidthStyle(c[0]) +
                '">' +
                renderCell(row, c[0]) +
                "</td>"
              );
            })
            .join("") +
          "</tr>"
        );
      })
      .join("");
  }

  function renderPager() {
    var st = el("dg-msl-page-status");
    var shown = state.rows.length;
    var pages = pageCount();
    var page = currentPage();
    if (st) {
      st.textContent =
        "Найдено: " + (state.total || 0) + "; страница " + page + "/" + pages + "; показано: " + shown;
    }
    var prev = el("dg-msl-prev");
    var next = el("dg-msl-next");
    if (prev) prev.disabled = page <= 1;
    if (next) next.disabled = page >= pages;
  }

  function load() {
    state.loading = true;
    return fetch("/api/manager-sales" + buildQuery(), { credentials: "same-origin" })
      .then(json)
      .then(function (data) {
        state.rows = data.rows || [];
        state.total = data.total || 0;
        state.totals = data.totals || null;
        state.plan = data.plan || null;
        state.can_write = !!data.can_write;
        state.can_pick_manager = !!data.can_pick_manager;
        state.can_edit_plans = !!data.can_edit_plans;
        if (el("dg-msl-add")) el("dg-msl-add").classList.toggle("d-none", !state.can_write);
        if (el("dg-msl-import")) el("dg-msl-import").classList.toggle("d-none", !state.can_write);
        if (el("dg-msl-plans")) {
          el("dg-msl-plans").classList.toggle("d-none", !(state.can_pick_manager || state.can_write));
        }
        syncTableOwnerTitle();
        renderTotals();
        renderTable();
        renderPager();
        syncArchiveViewBtn();
        syncTableOwnerTitle();
        scheduleUrlSync();
      })
      .catch(function (e) {
        var tbody = el("dg-msl-tbody");
        if (tbody) {
          tbody.innerHTML = '<tr><td class="text-danger p-3">' + esc(e.message || "Ошибка") + "</td></tr>";
        }
        toast("danger", e.message || "Ошибка загрузки");
      })
      .finally(function () {
        state.loading = false;
      });
  }

  function patchRow(id, payload) {
    return fetch("/api/manager-sales/" + id, {
      method: "PATCH",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).then(json);
  }

  function bindNumericFocus(inp) {
    if (!inp || inp.getAttribute("data-msl-bound") === "1") return;
    inp.setAttribute("data-msl-bound", "1");
    inp.addEventListener("focus", function () {
      var tr = inp.closest("tr");
      var id = tr && tr.getAttribute("data-msl-id");
      var field = inp.getAttribute("data-msl-field");
      var row = state.rows.filter(function (r) { return String(r.id) === String(id); })[0];
      if (!row || !field) return;
      var si = inp.getAttribute("data-msl-supp-i");
      var v = row[field];
      if (si != null && si !== "" && row.suppliers && row.suppliers[Number(si)]) {
        v = row.suppliers[Number(si)][field];
      }
      inp.value = v == null || v === "" ? "" : String(v).replace(".", ",");
    });
    inp.addEventListener("blur", function () {
      var kind = inp.getAttribute("data-msl-num");
      var parsed = parseNum(inp.value);
      if (parsed === "" || parsed == null) {
        inp.value = "";
        return;
      }
      inp.value = kind === "pct" ? num(parsed) : num(parsed);
    });
  }

  function patchMissingClass(tr, row) {
    if (!tr) return;
    visibleCols().forEach(function (c, idx) {
      var td = tr.children[idx];
      if (!td || c[0] === "_del" || c[0] === "_hand") return;
      var miss = cellIsMissing(row, c[0]);
      td.classList.toggle("dg-msl-missing", !!miss);
    });
  }

  function patchCalcCells(row) {
    var tbodyEl = el("dg-msl-tbody");
    if (!tbodyEl) return;
    var tr = tbodyEl.querySelector('tr[data-msl-id="' + row.id + '"]');
    if (!tr) return;
    var cols = visibleCols();
    cols.forEach(function (c, idx) {
      if (!CALC_KEYS[c[0]]) return;
      var td = tr.children[idx];
      if (!td) return;
      td.innerHTML = renderCell(row, c[0]);
    });
  }

  function saveField(tr, field, value, extra) {
    var id = tr && tr.getAttribute("data-msl-id");
    if (!id) return Promise.resolve();
    var payload = extra ? Object.assign({}, extra) : {};
    if (field) payload[field] = value;
    return patchRow(id, payload).then(function (data) {
      if (field === "amount_ex_delivery" || field === "paid_at") {
        return load();
      }
      if (data.row) {
        state.rows = state.rows.map(function (r) {
          return String(r.id) === String(data.row.id) ? data.row : r;
        });
        if (field === "invoice_mark" || field === "our_invoice_mark" || SUPP_STACK_KEYS[field] || (extra && (extra.supplier_add || extra.supplier_remove != null))) {
          renderTable();
          return;
        }
        var active = document.activeElement;
        var editing = active && active.closest && active.closest("#dg-msl-tbody");
        if (editing) {
          patchCalcCells(data.row);
          var trLive = document.querySelector('#dg-msl-tbody tr[data-msl-id="' + data.row.id + '"]');
          if (trLive) {
            trLive.classList.toggle("dg-msl-need-terms", rowNeedsHighlight(data.row));
            patchMissingClass(trLive, data.row);
          }
          if (field === "status") {
            applyStatusTone(tr.querySelector('[data-msl-col="status"]'), data.row.status);
          }
        } else renderTable();
      }
    });
  }

  function loadMeta() {
    return fetch("/api/manager-sales/meta", { credentials: "same-origin" })
      .then(json)
      .then(function (data) {
        state.years = data.years || [cy];
        state.managers = data.managers || [];
        state.can_write = !!data.can_write;
        state.can_pick_manager = !!data.can_pick_manager;
        state.actor_user_id = data.actor_user_id;
        state.actor_full_name = data.actor_full_name || "";
        if (Array.isArray(data.invoice_marks) && data.invoice_marks.length) {
          INVOICE_MARKS = data.invoice_marks;
        }
        if (!state.can_pick_manager) {
          state.pending.manager_user_id = data.actor_user_id ? String(data.actor_user_id) : "";
        } else if (!state.pending.manager_user_id) {
          state.pending.manager_user_id = "all";
        }
        fillYears();
        fillManagers();
        writeFormFromPending();
        if (el("dg-msl-add")) el("dg-msl-add").classList.toggle("d-none", !state.can_write);
        if (el("dg-msl-import")) el("dg-msl-import").classList.toggle("d-none", !state.can_write);
        if (el("dg-msl-plans")) {
          el("dg-msl-plans").classList.toggle("d-none", !(state.can_pick_manager || state.can_write));
        }
      });
  }

    var hq = "/api/manager-sales/supplier-hints";
    if (state.can_pick_manager && state.manager_user_id && state.manager_user_id !== "all") {
      hq += "?manager_user_id=" + encodeURIComponent(state.manager_user_id);

          .map(function (n) {

    ov.style.display = "none";
    ov.setAttribute("aria-hidden", "true");

  function openHandOver(id) {
    state.handId = id;
    var row = state.rows.filter(function (r) { return String(r.id) === String(id); })[0];
    var ownerId = row ? Number(row.manager_user_id) : 0;
    var cur = row && row.handed_to_user_id ? String(row.handed_to_user_id) : "";
    var no = row && row.row_no != null ? String(row.row_no) : "";
    if (el("dg-msl-hand-title")) el("dg-msl-hand-title").textContent = no ? "Передать заказ № " + no : "Передать заказ";
    var sel = el("dg-msl-hand-manager");
    if (sel) {
      var opts = '<option value="">Не передан (вернуть владельцу)</option>';
      (state.managers || []).forEach(function (m) {
        if (Number(m.id) === ownerId) return;
        var label = (m.full_name || m.username || ("#" + m.id)) + (m.username ? " (" + m.username + ")" : "");
        opts +=
          '<option value="' +
          esc(String(m.id)) +
          '"' +
          (String(m.id) === cur ? " selected" : "") +
          ">" +
          esc(label) +
          "</option>";
      });
      sel.innerHTML = opts;
      if (cur) sel.value = cur;

    var ov = el("dg-msl-hand-overlay");
    if (!ov) return;
    ov.style.display = "flex";
    ov.setAttribute("aria-hidden", "false");

  function orderMonthKey(row) {
    if (!row || !row.paid_at) return "";
    var mm = Number(String(row.paid_at).slice(5, 7));
    if (!Number.isFinite(mm) || mm < 1 || mm > 12) return "";
    return String(mm);
  }

  function postHandOver() {
    var id = Number(state.handId);
    if (!Number.isFinite(id) || id < 1) return Promise.resolve();
    var sel = el("dg-msl-hand-manager");
    var target = sel && sel.value ? Number(sel.value) : 0;
    var row = state.rows.filter(function (r) { return String(r.id) === String(id); })[0];
    return fetch("/api/manager-sales/" + id + "/hand-over", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ manager_user_id: target || 0 }),
    })
      .then(json)
      .then(function () {
        closeHandOver();
        var monthKey = orderMonthKey(row);
        if (target) {
          if (state.can_pick_manager) {

  function openMslLog(rowId, label, field, fieldLabel) {
    logState.rowId = rowId;

    var subEl = el("dg-msl-log-subtitle");
    if (titleEl) {

        ? "Журнал: " + (logState.fieldLabel || logState.field)
        : "Журнал изменений";
    }
    if (subEl) subEl.textContent = logState.label;
    if (overlay) {
      overlay.style.display = "flex";
      overlay.setAttribute("aria-hidden", "false");
    }
    loadMslLog();
  }

  function loadMslLog() {
    var body = el("dg-msl-log-body");
    if (!body || !logState.rowId) return;
    body.innerHTML = '<div class="text-muted small text-center py-4">Загрузка журнала…</div>';
    var qs = new URLSearchParams();
    qs.set("limit", String(logState.limit));
    qs.set("offset", String(logState.offset));
    if (logState.field) qs.set("field", logState.field);
    fetch("/api/manager-sales/" + logState.rowId + "/log?" + qs.toString(), { credentials: "same-origin" })
      .then(json)
      .then(function (j) {
        logState.total = Number(j.total || 0);
        var rows = j.rows || [];
        var pages = Math.max(1, Math.ceil((logState.total || 0) / logState.limit) || 1);
        var page = Math.floor(logState.offset / logState.limit) + 1;
        var noteHtml = logState.field
          ? '<div class="alert alert-info py-2 px-3 mb-0 rounded-0 small">Только поле: <b>' +
            esc(logState.fieldLabel || logState.field) +
            "</b></div>"
          : "";
        if (!rows.length) {
          body.innerHTML =
            noteHtml +
            '<div class="text-muted small text-center py-4">' +
            (logState.field
              ? "По этому полю изменений нет."
              : "Журнал пуст.") +
            "</div>";
          return;
        }
        var trs = rows
          .map(function (r) {
            var when = r.changed_at ? new Date(r.changed_at) : null;
            var whenTxt = when && !isNaN(when.getTime()) ? when.toLocaleString("ru-RU") : "—";
            var oldV = r.old_value == null || r.old_value === "" ? "—" : esc(r.old_value);
            var newV = r.new_value == null || r.new_value === "" ? "—" : esc(r.new_value);
            return (
              "<tr><td class='text-nowrap'>" +
              esc(whenTxt) +
              "</td><td>" +
              esc(r.changed_by_name || "—") +
              "</td><td><span class='badge bg-light text-dark border'>" +
              esc(mslLogActionLabel(r.action)) +
              "</span></td><td>" +
              esc(r.field_label || r.field) +
              "</td><td><span class='dg-msl-log-old'>" +
              oldV +
              "</span><span class='dg-msl-log-arrow'>→</span><span class='dg-msl-log-new'>" +
              newV +
              "</span></td></tr>"
            );
          })
          .join("");
        body.innerHTML =
          noteHtml +
          '<div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>Когда</th><th>Кто</th><th>Действие</th><th>Поле</th><th>Было → стало</th></tr></thead><tbody>' +
          trs +
          "</tbody></table></div>" +
          '<div class="d-flex align-items-center justify-content-between gap-2 px-3 py-2 border-top"><span class="small text-muted">Найдено: ' +
          logState.total +
          "; страница " +
          page +
          "/" +
          pages +
          '</span><div class="btn-group"><button type="button" class="btn btn-sm btn-outline-secondary" id="dg-msl-log-prev"' +
          (logState.offset <= 0 ? " disabled" : "") +
          ">Назад</button><button type='button' class='btn btn-sm btn-outline-secondary' id='dg-msl-log-next'" +
          (logState.offset + logState.limit >= logState.total ? " disabled" : "") +
          ">Вперёд</button></div></div>";
        var prev = el("dg-msl-log-prev");
        var next = el("dg-msl-log-next");
        if (prev) {
          prev.addEventListener("click", function () {
            logState.offset = Math.max(0, logState.offset - logState.limit);
            loadMslLog();
          });
        }
        if (next) {
          next.addEventListener("click", function () {
            logState.offset += logState.limit;
            loadMslLog();
          });
        }
      })
      .catch(function (e) {
        body.innerHTML = '<div class="text-danger small text-center py-4">' + esc(e.message || "Ошибка журнала") + "</div>";
      });
  }

  function importCsv(dry) {
    var text = state.csvText;
    if (!text) return Promise.resolve();
    if (state.can_pick_manager && (!state.manager_user_id || state.manager_user_id === "all")) {
      toast("warning", "Сначала выберите менеджера в переключателе — CSV пишется в его таблицу");
      return Promise.resolve();
    }
    var body = {
      csv: text,
      dry_run: dry ? 1 : 0,
      year: state.year,
    };
    if (state.can_pick_manager) body.manager_user_id = Number(state.manager_user_id);
    var started = Date.now();
    if (dry) {
      showActionLog(
        "warning",
        "Импорт CSV: пробный прогон.<br>Фильтры: " +
          appliedFilterSummary() +
          "<br>Идёт, прошло 0 с…"
      );
    }
    return fetch("/api/manager-sales/import-csv", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
      .then(json)
      .then(function (data) {
        var sec = data.duration_sec != null ? data.duration_sec : Math.round((Date.now() - started) / 100) / 10;
        if (dry) {
          state.csvDry = data;
          var n = data.would_update != null ? data.would_update : data.to_update;
          showActionLog(
            "info",
            "<div>Пробный импорт CSV</div><ul class='mb-2'>" +
              "<li>фильтры: " +
              appliedFilterSummary() +
              "</li>" +
              "<li>всего строк файла: " +
              (data.total || 0) +
              "</li>" +
              "<li>к записи: " +
              n +
              "</li>" +
              "<li>пустых пропущено: " +
              (data.skipped || 0) +
              "</li>" +
              "<li>длительность: " +
              sec +
              " с</li></ul>" +
              (n
                ? '<button type="button" class="btn btn-sm btn-primary" id="dg-msl-import-go" data-dg-notify-start="Записываем CSV…">Импортировать ' +
                  n +
                  " строк</button>"
                : "<div class='text-muted'>Нечего импортировать.</div>")
          );
          return data;
        }
        var errs = (data.errors || [])
          .slice(0, 20)
          .map(function (e) {
            return "<li>" + esc(e.code) + ": " + esc(e.error) + "</li>";
          })
          .join("");
        showActionLog(
          "success",
          "<div>Импорт CSV завершён</div><ul class='mb-2'>" +
            "<li>записано: " +
            (data.filled || 0) +
            "</li>" +
            "<li>пропущено: " +
            (data.skipped || 0) +
            "</li>" +
            "<li>длительность: " +
            sec +
            " с</li></ul>" +
            (errs ? "<ul>" + errs + "</ul>" : "")
        );
        toast("success", "Импортировано: " + (data.filled || 0));
        state.csvText = "";
        state.csvDry = null;
        return load();
      })
      .catch(function (e) {
        showActionLog(
          "danger",
          "Ошибка импорта: " +
            esc(e.message || "") +
            (e.body ? "<pre class='small mb-0 mt-2'>" + esc(String(e.body).slice(0, 800)) + "</pre>" : "")
        );
        throw e;
      });
  }

  function columnControls() {
    var wrap = el("dg-msl-toolbox-panels");
    var colPanel = el("dg-msl-columns-panel");
    var wPanel = el("dg-msl-widths-panel");
    function syncWrap() {
      var open =
        (colPanel && colPanel.classList.contains("open")) ||
        (wPanel && wPanel.classList.contains("open"));
      if (wrap) wrap.classList.toggle("d-none", !open);
    }
    function closeAll() {
      if (colPanel) colPanel.classList.remove("open");
      if (wPanel) wPanel.classList.remove("open");
      syncWrap();
    }
    if (el("dg-msl-columns-toggle")) {
      el("dg-msl-columns-toggle").addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (wPanel) wPanel.classList.remove("open");
        if (colPanel) colPanel.classList.toggle("open");
        syncWrap();
      });
    }
    if (el("dg-msl-widths-toggle")) {
      el("dg-msl-widths-toggle").addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (colPanel) colPanel.classList.remove("open");
        if (wPanel) wPanel.classList.toggle("open");
        syncWrap();
      });
    }
    document.addEventListener("click", function (ev) {
      if (wrap && wrap.contains(ev.target)) return;
      if (ev.target && ev.target.closest && ev.target.closest("#dg-msl-columns-toggle, #dg-msl-widths-toggle")) return;
      closeAll();
    });
    if (el("dg-msl-columns-all")) {
      el("dg-msl-columns-all").addEventListener("click", function () {
        state.visible = MSALES_COLS.map(function (c) { return c[0]; });
        saveVisible();

      });
    }
    if (el("dg-msl-columns-none")) {
      el("dg-msl-columns-none").addEventListener("click", function () {
        state.visible = ["row_no", "manager_name", "paid_at", "amount_ex_delivery", "diff", "_hand", "_del"];
        saveVisible();
        renderColumnControls();
        renderTable();
      });
    }
    if (el("dg-msl-columns-default")) {
      el("dg-msl-columns-default").addEventListener("click", function () {
        state.visible = MSALES_COLS.map(function (c) { return c[0]; });
        saveVisible();
        renderColumnControls();
        renderTable();
      });
    }
    if (el("dg-msl-columns-list")) {
      el("dg-msl-columns-list").addEventListener("change", function (ev) {
        var t = ev.target;
        if (!t || !t.getAttribute("data-msl-col")) return;
        var key = t.getAttribute("data-msl-col");
        var on = !!t.checked;
        if (on && state.visible.indexOf(key) < 0) state.visible.push(key);
        if (!on) state.visible = state.visible.filter(function (k) { return k !== key; });
        if (state.visible.indexOf("_hand") < 0) state.visible.push("_hand");
        if (state.visible.indexOf("_del") < 0) state.visible.push("_del");
        saveVisible();
        renderTable();
      });
    }
    if (el("dg-msl-widths-default")) {
      el("dg-msl-widths-default").addEventListener("click", function () {
        state.widths = {};
        saveWidths();
        renderWidthControls();
        renderTable();
      });
    }
    if (el("dg-msl-widths-list")) {
      el("dg-msl-widths-list").addEventListener("change", function (ev) {
        var t = ev.target;
        if (!t || !t.getAttribute("data-msl-width")) return;
        var key = t.getAttribute("data-msl-width");
        var n = Number(t.value);
        if (Number.isFinite(n) && n >= 40) state.widths[key] = Math.round(n);
        else delete state.widths[key];
        saveWidths();
        renderTable();
      });
    }
    renderColumnControls();
    renderWidthControls();
  }

    function sync(from, to) {
      if (syncing) return;
      syncing = true;
      to.value = from.value;
      syncing = false;
      readPendingFromForm();
    }
    a.addEventListener("input", function () { sync(a, b); });
    b.addEventListener("input", function () { sync(b, a); });
    function onEnter(ev) {
      if (ev.key === "Enter") {
        ev.preventDefault();
        if (el("dg-msl-apply")) el("dg-msl-apply").click();
      }
      if (ev.key === "Escape") {
        a.value = "";

        commitFilters();
      }

    a.addEventListener("keydown", onEnter);
    b.addEventListener("keydown", onEnter);

  var DEFAULT_PLAN_STEPS = [
    [500000, 0],
    [1000000, 2],
    [1500000, 4],
    [2000000, 6],
    [2500000, 8],
    [3300000, 10],
  ];
  var DEFAULT_PLAN_PCT_MAX = 12;

  function defaultPlanStepsSpec() {
    return {
      steps: DEFAULT_PLAN_STEPS.map(function (p) { return [p[0], p[1]]; }),
      pct_max: DEFAULT_PLAN_PCT_MAX,
    };
  }

  function planStepsSpecFrom(raw) {
    if (!raw) return defaultPlanStepsSpec();
    if (Array.isArray(raw) && raw.length) return { steps: raw, pct_max: DEFAULT_PLAN_PCT_MAX };
    if (raw.steps && raw.steps.length) {
      return {
        steps: raw.steps,
        pct_max: raw.pct_max != null ? raw.pct_max : DEFAULT_PLAN_PCT_MAX,
      };
    }
    return defaultPlanStepsSpec();
  }

  function renderPlanStepRow(max, pct, canEdit) {
    return (
      "<tr>" +
      "<td><input type=\"text\" inputmode=\"decimal\" class=\"form-control form-control-sm dg-msl-plan-amt\" data-msl-step-max " +
      (canEdit ? "" : "readonly ") +
      "value=\"" +
      esc(max == null ? "" : num(max)) +
      "\"></td>" +
      "<td><input type=\"text\" inputmode=\"decimal\" class=\"form-control form-control-sm\" style=\"width:4.5rem\" data-msl-step-pct " +
      (canEdit ? "" : "readonly ") +
      "value=\"" +
      esc(pct == null ? "" : String(pct)) +
      "\"></td>" +
      "<td>" +
      (canEdit
        ? "<button type=\"button\" class=\"btn btn-sm btn-outline-danger\" data-msl-step-del data-dg-no-activity=\"1\">×</button>"
        : "") +
      "</td></tr>"
    );
  }

  function renderPlanSteps(spec, canEdit) {
    var n = planStepsSpecFrom(spec);
    var body = el("dg-msl-plan-steps-body");
    if (body) {
      body.innerHTML = n.steps
        .map(function (s) {
          return renderPlanStepRow(s[0], s[1], canEdit);
        })
        .join("");
    }
    var pctMax = el("dg-msl-plan-pct-max");
    if (pctMax) {
      pctMax.value = n.pct_max != null ? String(n.pct_max) : String(DEFAULT_PLAN_PCT_MAX);
      pctMax.readOnly = !canEdit;
    }
    ["dg-msl-plan-step-add", "dg-msl-plan-step-reset"].forEach(function (id) {
      if (el(id)) el(id).classList.toggle("d-none", !canEdit);
    });
  }

  function readPlanSteps() {
    var steps = [];
    [].slice.call(document.querySelectorAll("#dg-msl-plan-steps-body tr")).forEach(function (tr) {
      var maxInp = tr.querySelector("[data-msl-step-max]");
      var pctInp = tr.querySelector("[data-msl-step-pct]");
      var max = parseNum(maxInp && maxInp.value);
      var pct = parseNum(pctInp && pctInp.value);
      if (max == null || max === "" || max <= 0 || pct == null || pct === "" || pct < 0) return;
      steps.push([max, pct]);
    });
    var pctMax = parseNum(el("dg-msl-plan-pct-max") && el("dg-msl-plan-pct-max").value);
    if (pctMax == null || pctMax === "" || pctMax < 0) pctMax = DEFAULT_PLAN_PCT_MAX;
    if (!steps.length) {
      var d = defaultPlanStepsSpec();
      return { steps: d.steps, pct_max: pctMax };
    }
    steps.sort(function (a, b) {
      return a[0] - b[0];
    });
    return { steps: steps, pct_max: pctMax };
  }

  function addPlanStepRow() {
    var body = el("dg-msl-plan-steps-body");
    if (!body) return;
    var rows = body.querySelectorAll("tr");
    var lastMax = 3300000;
    var lastPct = 10;
    if (rows.length) {
      var last = rows[rows.length - 1];
      var m = parseNum(last.querySelector("[data-msl-step-max]") && last.querySelector("[data-msl-step-max]").value);
      var p = parseNum(last.querySelector("[data-msl-step-pct]") && last.querySelector("[data-msl-step-pct]").value);
      if (m != null && m !== "") lastMax = m;
      if (p != null && p !== "") lastPct = p;
    }
    body.insertAdjacentHTML("beforeend", renderPlanStepRow(lastMax + 500000, lastPct, true));
  }

    var year = el("dg-msl-plan-year") && el("dg-msl-plan-year").value;
    var q = new URLSearchParams();
    if (year) q.set("year", year);
    return fetch("/api/manager-sales/plans?" + q.toString(), { credentials: "same-origin" })
      .then(json)
      .then(function (data) {
        plansCache = data;
        var baseInp = el("dg-msl-plan-base");
        var yb = data.year_base || {};
        if (baseInp) {
          baseInp.value = yb.plan_amount != null ? num(yb.plan_amount) : "";
          baseInp.placeholder = yb.inherited != null ? num(yb.inherited) : "";
          baseInp.readOnly = !data.can_edit;
        }
        var hint = el("dg-msl-plan-steps-hint");
        if (hint) {
          hint.textContent = yb.steps_custom
            ? "Пороги сохранены для этого года. Если план менеджера меньше последнего порога, ступени сжимаются пропорционально."
            : "Пока шкала как в Google (500 тыс. → 0% … 3,3 млн → 10%, иначе 12%). Сохраните, чтобы закрепить пороги за годом.";
        }
        renderPlanSteps(yb.steps || (data.fallback && data.fallback.steps), data.can_edit);

  function savePlanMatrix() {
    var year = Number(el("dg-msl-plan-year") && el("dg-msl-plan-year").value);
    var baseRaw = el("dg-msl-plan-base") ? String(el("dg-msl-plan-base").value || "").trim() : "";
    var managers = [];
    [].slice.call(document.querySelectorAll("#dg-msl-plan-grid-body tr[data-msl-plan-mgr]")).forEach(function (tr) {
      var id = Number(tr.getAttribute("data-msl-plan-mgr"));
      var yearInp = tr.querySelector("[data-msl-plan-year-amt]");
      var yearRaw = yearInp ? String(yearInp.value || "").trim() : "";
      var months = [];
      [].slice.call(tr.querySelectorAll("[data-msl-plan-month]")).forEach(function (inp) {
        var raw = String(inp.value || "").trim();
        months.push({
          month: Number(inp.getAttribute("data-msl-plan-month")),
          plan_amount: raw === "" ? "" : parseNum(raw),
        });
      });
      managers.push({
        manager_user_id: id,
        year_plan: yearRaw === "" ? "" : parseNum(yearRaw),
        months: months,
      });
    });
    return fetch("/api/manager-sales/plans/matrix", {
      method: "PUT",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        year: year,
        year_base: baseRaw === "" ? "" : parseNum(baseRaw),
        steps: readPlanSteps(),
        managers: managers,
      }),
    })
      .then(json)
      .then(function () {
        return loadPlansOverlay().then(function () {
          setPlanMsg("success", "Планы " + year + " сохранены. % МП. пересчитан.");
          load();
        });
      })
      .catch(function (err) {
        setPlanMsg("danger", (err && err.message) || "Не удалось сохранить планы");
        if (window.DatagonNotify && window.DatagonNotify.toast) {
          window.DatagonNotify.toast({ type: "danger", message: (err && err.message) || "Ошибка сохранения планов" });
        }
        throw err;
      });
  }

  if (el("dg-msl-inv-mark-cancel")) el("dg-msl-inv-mark-cancel").addEventListener("click", closeInvoiceMark);
  if (el("dg-msl-inv-mark-backdrop")) el("dg-msl-inv-mark-backdrop").addEventListener("click", closeInvoiceMark);
  if (el("dg-msl-inv-mark-list")) {
    el("dg-msl-inv-mark-list").addEventListener("click", function (ev) {
      var btn = ev.target && ev.target.closest ? ev.target.closest("[data-msl-inv-set]") : null;
      if (!btn) return;
      var val = btn.getAttribute("data-msl-inv-set");
      var run = function () { return saveInvoiceMark(val == null ? "" : val); };
      if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(btn, run);
      else run();
    });
  }
  if (el("dg-msl-our-mark-cancel")) el("dg-msl-our-mark-cancel").addEventListener("click", closeOurInvoiceMark);
  if (el("dg-msl-our-mark-backdrop")) el("dg-msl-our-mark-backdrop").addEventListener("click", closeOurInvoiceMark);
  if (el("dg-msl-our-mark-list")) {
    el("dg-msl-our-mark-list").addEventListener("click", function (ev) {
      var btn = ev.target && ev.target.closest ? ev.target.closest("[data-msl-our-set]") : null;
      if (!btn) return;
      var val = btn.getAttribute("data-msl-our-set");
      var run = function () { return saveOurInvoiceMark(val == null ? "" : val); };
      if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(btn, run);
      else run();
    });
  }
  if (el("dg-msl-plans")) {
    el("dg-msl-plans").addEventListener("click", function () {
      var btn = el("dg-msl-plans");
      var run = function () { return openPlans(); };
      if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(btn, run);
      else run();
    });
  }
  if (el("dg-msl-plans-close")) el("dg-msl-plans-close").addEventListener("click", closePlans);
  if (el("dg-msl-plans-cancel")) el("dg-msl-plans-cancel").addEventListener("click", closePlans);
  if (el("dg-msl-plans-backdrop")) el("dg-msl-plans-backdrop").addEventListener("click", closePlans);
  if (el("dg-msl-plan-year")) el("dg-msl-plan-year").addEventListener("change", function () { loadPlansOverlay(); });
  if (el("dg-msl-plan-matrix-save")) {
    el("dg-msl-plan-matrix-save").addEventListener("click", function () {
      var btn = el("dg-msl-plan-matrix-save");
      var run = function () { return savePlanMatrix(); };
      if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(btn, run);
      else run();
    });
  }
  if (el("dg-msl-plan-step-add")) {
    el("dg-msl-plan-step-add").addEventListener("click", function () {
      addPlanStepRow();
    });
  }
  if (el("dg-msl-plan-step-reset")) {
    el("dg-msl-plan-step-reset").addEventListener("click", function () {
      renderPlanSteps(defaultPlanStepsSpec(), true);
      var hint = el("dg-msl-plan-steps-hint");
      if (hint) hint.textContent = "Вернули шкалу Google. Нажмите «Сохранить планы», чтобы записать её на этот год.";
    });
  }
  var stepsBody = el("dg-msl-plan-steps-body");
  if (stepsBody) {
    stepsBody.addEventListener("click", function (ev) {
      var btn = ev.target && ev.target.closest ? ev.target.closest("[data-msl-step-del]") : null;
      if (!btn) return;
      var tr = btn.closest("tr");
      var rows = stepsBody.querySelectorAll("tr");
      if (rows.length <= 1) return;
      if (tr) tr.remove();
    });
  }
  if (el("dg-msl-log-close")) el("dg-msl-log-close").addEventListener("click", closeMslLog);
  if (el("dg-msl-log-backdrop")) el("dg-msl-log-backdrop").addEventListener("click", closeMslLog);
  if (el("dg-msl-log-refresh")) {
    el("dg-msl-log-refresh").addEventListener("click", function () {
      loadMslLog();
    });
  }
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") {
      closePickManager();
      closeHandOver();
      closeSuppUrl();
      closeInvoiceMark();
      closeOurInvoiceMark();
      closeConfirm();
      closeMslLog();
      closePlans();
    }
  });

  loadMeta()
    .then(function () {
      state.year = state.pending.year;
      state.month = state.pending.month || "";
      state.manager_user_id = state.pending.manager_user_id;
      state.search = state.pending.search;
      state.status = state.pending.status;
      state.supplier = state.pending.supplier;
      state.has_contract = state.pending.has_contract;
      state.invoice_org = state.pending.invoice_org;
      state.archived = state.pending.archived || "0";
      state.limit = state.pending.limit;
      syncArchiveViewBtn();
      syncTableOwnerTitle();
      return Promise.all([load(), loadHints()]);
    })
    .catch(function (e) {
      toast("danger", e.message || "Не удалось открыть раздел");
    });
})();
</script>
