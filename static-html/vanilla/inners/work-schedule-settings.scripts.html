<script>
(function () {
  "use strict";

  var API = "/api/work-schedule";
  var ORG_PICK_KEY = "datagon_ws_settings_org_id_v1";
  var EMP_FILTER_KEY = "datagon_ws_settings_emp_filter_org_v1";
  var state = {
    orgs: [],
    org: null,
    empFilterOrgId: 0,
    departments: [],
    departmentsAll: [],
    employees: [],
    usersAvailable: [],
    bitcopPeople: [],
    empSort: { key: "name", dir: "asc" },
    empSearch: "",
    pendingEmpSearch: "",
  };

  var EMP_SEARCH_KEYS = [
    "full_name",
    "username",
    "organization_name",
    "department_name",
    "position",
    "grade",
    "personal_schedule_type",
  ];

  function toast(type, message) {
    if (window.DatagonNotify && window.DatagonNotify.toast) {
      window.DatagonNotify.toast({ type: type, message: message });
    }
  }

  function money(n) {
    if (window.DatagonFmt && window.DatagonFmt.formatMoney) return window.DatagonFmt.formatMoney(n);
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽";
  }

  function api(path, opts) {
    return fetch(API + path, Object.assign({ credentials: "same-origin" }, opts || {})).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || (j && j.success === false)) {
          throw new Error((j && j.error) || "HTTP " + r.status);
        }
        return j;
      });
    });
  }

  /** API / input: YYYY-MM-DD. UI: никогда не отдавать сырой YYYY-MM-DD. */
  function dateOnlyYmd(v) {
    if (window.DatagonFmt && window.DatagonFmt.dateOnlyYmd) {
      var fromFmt = window.DatagonFmt.dateOnlyYmd(v);
      if (fromFmt) return fromFmt;
    }
    if (v == null || v === "") return "";
    if (typeof v === "string") {
      var s = v.trim();
      if (/T/.test(s)) {
        try {
          var dIso = new Date(s);
          if (Number.isFinite(dIso.getTime())) {
            var uy = dIso.getUTCFullYear();
            var um = dIso.getUTCMonth() + 1;
            var ud = dIso.getUTCDate();
            return (
              uy +
              "-" +
              (um < 10 ? "0" + um : um) +
              "-" +
              (ud < 10 ? "0" + ud : ud)
            );
          }
        } catch (e1) {}
      }
      var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return m[1] + "-" + m[2] + "-" + m[3];
      var rm = s.match(/^(\d{2})[.\-/](\d{2})[.\-/](\d{4})$/);
      if (rm) return rm[3] + "-" + rm[2] + "-" + rm[1];
    }
    return "";
  }

  /** Вывод пользователю: дд-мм-гггг */
  function fmtDate(v) {
    if (!v) return "—";
    if (window.DatagonFmt && window.DatagonFmt.formatDate) {
      var fd = window.DatagonFmt.formatDate(v);
      if (fd && fd !== "—" && !/^\d{4}-\d{2}-\d{2}$/.test(fd)) return fd;
    }
    var ymd = dateOnlyYmd(v);
    if (!ymd) return "—";
    var p = ymd.split("-");
    return p.length === 3 ? p[2] + "-" + p[1] + "-" + p[0] : "—";
  }

  /** Полные месяцы стажа от hire_date до сегодня (МСК) — как seniorityMonths на бэке. */
  function seniorityMonthsFromHire(hireDate) {
    var ymd = dateOnlyYmd(hireDate);
    if (!ymd) return null;
    var parts = ymd.split("-");
    var hy = Number(parts[0]);
    var hm = Number(parts[1]);
    var hd = Number(parts[2]);
    if (!hy || !hm || !hd) return null;
    var nowYmd =
      typeof Intl !== "undefined"
        ? new Date().toLocaleDateString("en-CA", { timeZone: "Europe/Moscow" })
        : "";
    if (!/^\d{4}-\d{2}-\d{2}$/.test(nowYmd)) {
      var n = new Date();
      nowYmd =
        n.getFullYear() +
        "-" +
        String(n.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(n.getDate()).padStart(2, "0");
    }
    var np = nowYmd.split("-");
    var ay = Number(np[0]);
    var am = Number(np[1]);
    var ad = Number(np[2]);
    if (ay < hy || (ay === hy && am < hm) || (ay === hy && am === hm && ad < hd)) return 0;
    var months = (ay - hy) * 12 + (am - hm);
    if (ad < hd) months -= 1;
    return Math.max(0, months);
  }

  /** «4 г. 9 мес.» / «0 мес.» / «—» */
  function fmtSeniority(hireDate) {
    var m = seniorityMonthsFromHire(hireDate);
    if (m == null) return "—";
    var years = Math.floor(m / 12);
    var months = m % 12;
    if (years <= 0 && months <= 0) return "0 мес.";
    if (years <= 0) return months + " мес.";
    if (months <= 0) return years + " г.";
    return years + " г. " + months + " мес.";
  }

  /** Доплата за стаж по параметрам организации (как seniorityBonus на бэке). */
  function seniorityBonusAmount(emp) {
    if (!emp || !emp.hire_date) return null;
    if (Number(emp.seniority_pay_disabled) === 1) return 0;
    var m = seniorityMonthsFromHire(emp.hire_date);
    if (m == null) return null;
    if (m < 12) return 0;
    var org =
      state.orgs.find(function (o) {
        return Number(o.id) === Number(emp.organization_id);
      }) || {};
    var base =
      emp.personal_seniority_base != null
        ? Number(emp.personal_seniority_base)
        : Number(org.seniority_base);
    var step =
      emp.personal_seniority_step != null
        ? Number(emp.personal_seniority_step)
        : Number(org.seniority_step);
    var period =
      emp.personal_seniority_period_months != null
        ? Number(emp.personal_seniority_period_months)
        : Number(org.seniority_period_months);
    if (!Number.isFinite(base)) base = 1000;
    if (!Number.isFinite(step)) step = 500;
    if (!Number.isFinite(period) || period < 1) period = 6;
    var steps = Math.floor((m - 12) / period);
    return base + step * steps;
  }

  function fmtSeniorityBonus(emp) {
    if (Number(emp.seniority_pay_disabled) === 1) {
      return '<span class="text-muted" title="Не выплачиваем за стаж">выкл</span>';
    }
    var n = seniorityBonusAmount(emp);
    if (n == null) return "—";
    return money(n);
  }

  function setBitcopMsg(cls, text) {
    var msg = document.getElementById("dg-ws-set-bitcop-msg");
    if (!msg) return;
    msg.className = "alert " + cls + " mt-3 mb-0";
    msg.classList.remove("d-none");
    msg.textContent = text;
  }

  function applyBitcopConfig(j) {
    var acc = document.getElementById("dg-ws-set-bitcop-account");
    var met = document.getElementById("dg-ws-set-bitcop-metric");
    var hint = document.getElementById("dg-ws-set-bitcop-key-hint");
    var key = document.getElementById("dg-ws-set-bitcop-key");
    if (acc) acc.value = j.account || "";
    if (met) met.value = j.metric || "productiveTime";
    if (key) key.value = "";
    if (hint) {
      hint.textContent = j.api_key_set
        ? "сохранён: " + (j.api_key_masked || "••••")
        : "не задан";
    }
  }

  function loadBitcopConfig() {
    return api("/bitcop/config")
      .then(applyBitcopConfig)
      .catch(function (e) {
        setBitcopMsg("alert-warning", e.message || "Не удалось загрузить Bitcop");
      });
  }

  function saveBitcopConfig(opts) {
    opts = opts || {};
    var btn = document.getElementById("dg-ws-set-bitcop-save");
    var body = {
      account: (document.getElementById("dg-ws-set-bitcop-account") || {}).value || "",
      metric: (document.getElementById("dg-ws-set-bitcop-metric") || {}).value || "productiveTime",
    };
    if (opts.clear_api_key) body.clear_api_key = true;
    else {
      var keyEl = document.getElementById("dg-ws-set-bitcop-key");
      var raw = keyEl ? String(keyEl.value || "").trim() : "";
      if (raw) body.api_key = raw;
    }
    setBitcopMsg("alert-warning", "Сохраняем…");
    var run = function () {
      return api("/bitcop/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }).then(function (j) {
        applyBitcopConfig(j);
        setBitcopMsg(
          "alert-success",
          "Сохранено · аккаунт «" +
            (j.account || "") +
            "» · метрика " +
            (j.metric || "") +
            (j.api_key_set ? " · ключ " + (j.api_key_masked || "есть") : " · ключ не задан")
        );
        toast("success", "Bitcop сохранён");
        return loadBitcopPeople().catch(function () {
          return null;
        });
      });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun && btn && !opts.clear_api_key) {
      window.DatagonNotify.busyRun(btn, run);
    } else {
      run().catch(function (e) {
        setBitcopMsg("alert-danger", e.message || "Ошибка");
        toast("danger", e.message);
      });
    }
  }

  function testBitcop() {
    var btn = document.getElementById("dg-ws-set-bitcop-test");
    setBitcopMsg("alert-warning", "Проверяем…");
    var run = function () {
      return api("/bitcop/test", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
        .then(function (j) {
          setBitcopMsg("alert-success", j.message || "OK");
          toast("success", j.message || "Bitcop OK");
          return loadBitcopPeople();
        })
        .catch(function (e) {
          var msg = (e && e.message) || "Ошибка связи с Bitcop";
          setBitcopMsg("alert-danger", msg);
          toast("danger", msg);
          throw e;
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(btn, run);
    else run().catch(function () {});
  }

  function loadBitcopPeople() {
    return api("/bitcop/employees")
      .then(function (j) {
        state.bitcopPeople = j.rows || [];
        return state.bitcopPeople;
      })
      .catch(function () {
        state.bitcopPeople = [];
        return [];
      });
  }

  function fillBitcopSelect(selectedId) {
    var sel = document.getElementById("dg-ws-set-emp-bitcop");
    if (!sel) return;
    var cur = selectedId != null && selectedId !== "" ? Number(selectedId) : 0;
    var opts = ['<option value="">— не привязан —</option>'];
    (state.bitcopPeople || []).forEach(function (p) {
      opts.push(
        '<option value="' +
          p.id +
          '"' +
          (Number(p.id) === cur ? " selected" : "") +
          ">" +
          (p.full_name || p.id) +
          (p.email ? " · " + p.email : "") +
          "</option>"
      );
    });
    if (cur && !(state.bitcopPeople || []).some(function (p) { return Number(p.id) === cur; })) {
      opts.push('<option value="' + cur + '" selected>Bitcop #' + cur + " (нет в списке)</option>");
    }
    sel.innerHTML = opts.join("");
  }

  function toDateInput(v) {
    return dateOnlyYmd(v);
  }

  function deptName(id) {
    var d = state.departmentsAll.find(function (x) {
      return Number(x.id) === Number(id);
    });
    return d ? d.name : "—";
  }

  function orgName(id) {
    var o = state.orgs.find(function (x) {
      return Number(x.id) === Number(id);
    });
    return o ? o.name : "—";
  }

  function hasOverrides(e) {
    return !!(
      e.personal_schedule_type ||
      e.personal_work_hours_per_day != null ||
      e.personal_sick_leave_rate != null ||
      e.personal_rate_full_hours != null ||
      e.personal_rate_half_hours != null ||
      e.personal_premium_rule_json != null
    );
  }

  function parsePremRule(raw) {
    if (raw == null || raw === "") return { kind: "stub", amount: 0 };
    try {
      var p = typeof raw === "string" ? JSON.parse(raw) : raw;
      if (!p || typeof p !== "object") return { kind: "stub", amount: 0 };
      return { kind: String(p.kind || "stub"), amount: Number(p.amount) || 0 };
    } catch (e) {
      return { kind: "stub", amount: 0 };
    }
  }

  function formatPremLabel(rule) {
    if (!rule || rule.kind === "stub" || rule.kind === "none") return "нет";
    if (rule.kind === "fixed") return "по дням " + money(rule.amount);
    if (rule.kind === "fixed_full") return "целиком " + money(rule.amount);
    return String(rule.kind);
  }

  function isFixedPremKind(kind) {
    return kind === "fixed" || kind === "fixed_full";
  }

  function syncPremAmountWrap(kindSelId, wrapId) {
    var kindEl = document.getElementById(kindSelId);
    var wrap = document.getElementById(wrapId);
    if (!kindEl || !wrap) return;
    wrap.style.display = isFixedPremKind(kindEl.value) ? "" : "none";
  }

  function readPremFromForm(kindId, amountId, inheritEmpty) {
    var kind = (document.getElementById(kindId) || {}).value;
    if (inheritEmpty && !kind) return { inherit: true };
    if (isFixedPremKind(kind)) {
      var raw = String((document.getElementById(amountId) || {}).value || "").replace(/\s/g, "").replace(",", ".");
      return { kind: kind, amount: Number(raw) || 0 };
    }
    return { kind: "stub" };
  }

  function fillPremForm(kindId, amountId, wrapId, rule, inheritEmpty) {
    var kindEl = document.getElementById(kindId);
    var amountEl = document.getElementById(amountId);
    if (!kindEl) return;
    if (inheritEmpty && (rule == null || rule === "")) {
      kindEl.value = "";
      if (amountEl) amountEl.value = "";
    } else {
      var p = parsePremRule(rule);
      kindEl.value = isFixedPremKind(p.kind) ? p.kind : "stub";
      if (amountEl) amountEl.value = isFixedPremKind(p.kind) ? String(p.amount) : "";
    }
    syncPremAmountWrap(kindId, wrapId);
  }

  function effectiveEmpPrem(e) {
    if (e.personal_premium_rule_json != null && e.personal_premium_rule_json !== "") {
      return parsePremRule(e.personal_premium_rule_json);
    }
    var d = state.departmentsAll.find(function (x) {
      return Number(x.id) === Number(e.department_id);
    });
    return parsePremRule(d && d.premium_rule_json);
  }

  /** Отделы — общий справочник, стыкуются с любой организацией через карточку сотрудника. */
  function allDepartments() {
    return state.departmentsAll || [];
  }

  function fillOrgPick() {
    var sel = document.getElementById("dg-ws-set-org-pick");
    if (!sel) return;
    sel.innerHTML = state.orgs
      .map(function (o) {
        return '<option value="' + o.id + '">' + (o.name || "—" + o.id) + "</option>";
      })
      .join("");
    if (state.org) sel.value = String(state.org.id);
  }

  function fillEmpFilterOrg() {
    var sel = document.getElementById("dg-ws-set-emp-filter-org");
    if (!sel) return;
    var cur = Number(state.empFilterOrgId) || 0;
    sel.innerHTML =
      '<option value="0">Все организации</option>' +
      state.orgs
        .map(function (o) {
          return '<option value="' + o.id + '">' + (o.name || "#" + o.id) + "</option>";
        })
        .join("");
    sel.value = String(cur);
    if (sel.value !== String(cur)) {
      state.empFilterOrgId = 0;
      sel.value = "0";
    }
  }

  function fillOrg() {
    var o = state.org;
    var deptLbl = document.getElementById("dg-ws-set-dept-org-label");
    if (deptLbl) deptLbl.textContent = "· общие, для любой орг.";
    if (!o) return;
    var idEl = document.getElementById("dg-ws-set-org-id");
    if (idEl) idEl.value = String(o.id);
    var map = {
      "dg-ws-set-org-name": o.name || "",
      "dg-ws-set-org-inn": o.inn || "",
      "dg-ws-set-org-tz": o.timezone || "Europe/Moscow",
      "dg-ws-set-org-sick": String(o.sick_unofficial_rate != null ? o.sick_unofficial_rate : ""),
      "dg-ws-set-sen-base": String(o.seniority_base != null ? o.seniority_base : ""),
      "dg-ws-set-sen-step": String(o.seniority_step != null ? o.seniority_step : ""),
      "dg-ws-set-sen-period": String(o.seniority_period_months != null ? o.seniority_period_months : ""),
    };
    Object.keys(map).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = map[id];
    });
  }

  function renderDepts() {
    var tb = document.getElementById("dg-ws-set-dept-tbody");
    if (!tb) return;
    var list = state.departments || [];
    if (!list.length) {
      tb.innerHTML =
        '<tr><td colspan="8" class="text-muted p-3">Нет отделов — «Подтянуть группы» или «Добавить»</td></tr>';
      return;
    }
    tb.innerHTML = list
      .map(function (d) {
        var prem = formatPremLabel(parsePremRule(d.premium_rule_json));
        return (
          '<tr data-dept-id="' +
          d.id +
          '"><td><strong>' +
          (d.name || "") +
          "</strong></td><td>" +
          (d.schedule_type || "") +
          "</td><td>" +
          d.norm_hours +
          "</td><td>" +
          d.rate_full_hours +
          "</td><td>" +
          d.rate_half_hours +
          "</td><td>" +
          d.vacation_overlap_limit +
          '</td><td><span class="text-muted">' +
          prem +
          '</span></td><td class="text-end">' +
          '<button type="button" class="btn btn-sm btn-outline-primary" data-dg-ws-set-edit-dept="' +
          d.id +
          '">Изменить</button></td></tr>'
        );
      })
      .join("");
  }

  function empSortValue(e, key) {
    switch (key) {
      case "name":
        return String(e.full_name || e.username || "").toLowerCase();
      case "org":
        return String(e.organization_name || orgName(e.organization_id) || "").toLowerCase();
      case "dept":
        return String(e.department_name || deptName(e.department_id) || "").toLowerCase();
      case "hire":
        return dateOnlyYmd(e.hire_date) || "";
      case "seniority": {
        var sm = seniorityMonthsFromHire(e.hire_date);
        return sm == null ? -1 : sm;
      }
      case "seniority_bonus": {
        var sb = seniorityBonusAmount(e);
        return sb == null ? -1 : sb;
      }
      case "salary":
        return Number(e.salary) || 0;
      case "schedule":
        return String(e.personal_schedule_type || "").toLowerCase();
      case "norm":
        return e.personal_work_hours_per_day != null ? Number(e.personal_work_hours_per_day) : -1;
      case "sick":
        return e.personal_sick_leave_rate != null ? Number(e.personal_sick_leave_rate) : -1;
      case "premium":
        return formatPremLabel(effectiveEmpPrem(e)).toLowerCase();
      case "overrides":
        return hasOverrides(e) ? 1 : 0;
      default:
        return "";
    }
  }

  function sortEmpList(list) {
    var key = (state.empSort && state.empSort.key) || "name";
    var dir = (state.empSort && state.empSort.dir) === "desc" ? -1 : 1;
    return list.slice().sort(function (a, b) {
      var va = empSortValue(a, key);
      var vb = empSortValue(b, key);
      var cmp = 0;
      if (typeof va === "number" && typeof vb === "number") {
        cmp = va - vb;
      } else {
        cmp = String(va).localeCompare(String(vb), "ru", { sensitivity: "base", numeric: true });
      }
      if (cmp !== 0) return cmp * dir;
      return String(a.full_name || a.username || "").localeCompare(
        String(b.full_name || b.username || ""),
        "ru",
        { sensitivity: "base" }
      );
    });
  }

  function paintEmpSortHeaders() {
    var row = document.getElementById("dg-ws-set-emp-thead");
    if (!row) return;
    var key = (state.empSort && state.empSort.key) || "";
    var dir = (state.empSort && state.empSort.dir) === "desc" ? "desc" : "asc";
    row.querySelectorAll("[data-dg-ws-set-emp-sort]").forEach(function (th) {
      var k = th.getAttribute("data-dg-ws-set-emp-sort");
      if (k === key) {
        th.setAttribute("data-dg-sort-active", "1");
        th.setAttribute("data-dg-sort-mark", dir === "desc" ? "▼" : "▲");
        th.setAttribute("aria-sort", dir === "desc" ? "descending" : "ascending");
      } else {
        th.removeAttribute("data-dg-sort-active");
        th.removeAttribute("data-dg-sort-mark");
        th.removeAttribute("aria-sort");
      }
    });
  }

  function setEmpSort(key) {
    if (!key) return;
    if (state.empSort && state.empSort.key === key) {
      state.empSort.dir = state.empSort.dir === "asc" ? "desc" : "asc";
    } else {
      state.empSort = { key: key, dir: "asc" };
    }
    renderEmps();
  }

  function empSearchHaystack(e) {
    var parts = [];
    EMP_SEARCH_KEYS.forEach(function (k) {
      if (e[k] != null && e[k] !== "") parts.push(String(e[k]));
    });
    parts.push(orgName(e.organization_id));
    parts.push(deptName(e.department_id));
    parts.push(fmtDate(e.hire_date));
    parts.push(fmtSeniority(e.hire_date));
    parts.push(fmtSeniorityBonus(e));
    parts.push(money(e.salary));
    parts.push(String(e.salary != null ? e.salary : ""));
    if (e.personal_work_hours_per_day != null) parts.push(String(e.personal_work_hours_per_day));
    if (e.personal_sick_leave_rate != null) parts.push(String(e.personal_sick_leave_rate));
    parts.push(formatPremLabel(effectiveEmpPrem(e)));
    if (hasOverrides(e)) parts.push("есть переопределения override");
    return parts.join(" ").toLowerCase().replace(/\s+/g, " ");
  }

  function empMatchesSearch(e, q) {
    var s = String(q || "")
      .trim()
      .toLowerCase()
      .replace(/\s+/g, " ");
    if (!s) return true;
    var hay = empSearchHaystack(e);
    return s.split(" ").every(function (tok) {
      return tok && hay.indexOf(tok) !== -1;
    });
  }

  function syncEmpSearchDirty() {
    var btn = document.getElementById("dg-ws-set-emp-apply");
    if (!btn) return;
    var dirty = String(state.pendingEmpSearch || "") !== String(state.empSearch || "");
    btn.classList.toggle("dg-flt-dirty", dirty);
    btn.textContent = dirty ? "Применить •" : "Применить";
  }

  function commitEmpSearch() {
    var inp = document.getElementById("dg-ws-set-emp-search");
    if (inp) state.pendingEmpSearch = inp.value || "";
    state.empSearch = state.pendingEmpSearch;
    syncEmpSearchDirty();
    renderEmps();
  }

  function resetEmpSearch() {
    state.pendingEmpSearch = "";
    state.empSearch = "";
    var inp = document.getElementById("dg-ws-set-emp-search");
    if (inp) inp.value = "";

  function fmtAuditWhen(v) {
    if (!v) return "—";
    if (window.DatagonFmt && window.DatagonFmt.formatDateTime) {
      var ft = window.DatagonFmt.formatDateTime(v);
      if (ft && ft !== "—") return ft;
    }
    try {
      var d = new Date(v);
      if (!Number.isFinite(d.getTime())) return String(v);
      var dd = d.getDate();
      var mm = d.getMonth() + 1;
      var yyyy = d.getFullYear();
      var hh = d.getHours();
      var mi = d.getMinutes();
      return (
        (dd < 10 ? "0" : "") +
        dd +
        "-" +
        (mm < 10 ? "0" : "") +
        mm +
        "-" +
        yyyy +
        " " +
        (hh < 10 ? "0" : "") +
        hh +
        ":" +
        (mi < 10 ? "0" : "") +
        mi
      );
    } catch (e) {
      return String(v);
    }
  }

  function renderDeptManageScopes(currentDeptId, scopes) {
    var host = document.getElementById("dg-ws-set-dept-manage-list");
    if (!host) return;
    var selected = {};
    (scopes || []).forEach(function (s) {
      var tid = Number(s.department_id != null ? s.department_id : s.target_department_id);
      if (!tid) return;
      selected[tid] = s.can_edit !== false && s.can_edit !== 0 && s.can_edit !== "0";
    });
    var others = (state.departmentsAll || []).filter(function (d) {
      return !currentDeptId || Number(d.id) !== Number(currentDeptId);
    });
    if (!others.length) {
      host.innerHTML = '<div class="small text-muted">Нет других отделов — сначала создайте или «Подтянуть группы».</div>';
      return;
    }
    host.innerHTML = others
      .map(function (d) {
        var tid = Number(d.id);
        var on = Object.prototype.hasOwnProperty.call(selected, tid);
        var editOn = on ? selected[tid] : true;
        return (
          '<div class="dg-ws-set-dept-manage-row d-flex align-items-center flex-wrap gap-2 py-1">' +
          '<div class="form-check mb-0 flex-grow-1">' +
          '<input class="form-check-input" type="checkbox" id="dg-ws-set-manage-' +
          tid +
          '" data-dg-ws-manage-dept="' +
          tid +
          '"' +
          (on ? " checked" : "") +
          " />" +
          '<label class="form-check-label" for="dg-ws-set-manage-' +
          tid +
          '">' +
          (d.name || "Отдел #" + tid) +
          "</label>" +
          "</div>" +
          '<div class="form-check mb-0">' +
          '<input class="form-check-input" type="checkbox" id="dg-ws-set-manage-edit-' +
          tid +
          '" data-dg-ws-manage-edit="' +
          tid +
          '"' +
          (editOn ? " checked" : "") +
          (on ? "" : " disabled") +
          " />" +
          '<label class="form-check-label small text-muted" for="dg-ws-set-manage-edit-' +
          tid +
          '">правки</label>' +
          "</div>" +
          "</div>"
        );
      })
      .join("");
    host.querySelectorAll("[data-dg-ws-manage-dept]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var tid = cb.getAttribute("data-dg-ws-manage-dept");
        var edit = host.querySelector('[data-dg-ws-manage-edit="' + tid + '"]');
        if (!edit) return;
        edit.disabled = !cb.checked;
        if (cb.checked && !edit.checked) edit.checked = true;
      });
    });
  }

  function readDeptManageScopes() {
    var host = document.getElementById("dg-ws-set-dept-manage-list");
    if (!host) return [];
    var out = [];
    host.querySelectorAll("[data-dg-ws-manage-dept]").forEach(function (cb) {

      var tid = Number(cb.getAttribute("data-dg-ws-manage-dept"));
      if (!tid) return;
      var edit = host.querySelector('[data-dg-ws-manage-edit="' + tid + '"]');
      out.push({ department_id: tid, can_edit: !!(edit && edit.checked) });
    });
    return out;
  }

      inn: document.getElementById("dg-ws-set-org-inn").value,
      timezone: document.getElementById("dg-ws-set-org-tz").value,
      sick_unofficial_rate: Number(document.getElementById("dg-ws-set-org-sick").value) || 0,
      seniority_base: Number(document.getElementById("dg-ws-set-sen-base").value) || 0,
      seniority_step: Number(document.getElementById("dg-ws-set-sen-step").value) || 0,
      seniority_period_months: Number(document.getElementById("dg-ws-set-sen-period").value) || 6,
    };
    setOrgMsg("alert-warning", "Сохраняем…");
    var run = function () {
      return api("/organizations/" + state.org.id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then(function () {
          return api("/organizations");
        })
        .then(function (j) {
          state.orgs = j.rows || [];
          var row = state.orgs.find(function (r) {
            return Number(r.id) === Number(state.org.id);
          });
          if (!row) throw new Error("не найдена организация после сохранения");
          state.org = row;
          fillOrgPick();
          fillOrg();
          var ok =
            String(row.name) === String(payload.name) &&
            Number(row.sick_unofficial_rate) === Number(payload.sick_unofficial_rate);
          if (ok) {
            setOrgMsg(
              "alert-success",
              "Сохранено: " + row.name + ", больничный " + row.sick_unofficial_rate + " ₽/день, TZ " + row.timezone
            );
            toast("success", "Организация сохранена");
          } else {
            setOrgMsg(
              "alert-warning",
              "Отправлено «" + payload.name + "», в БД «" + row.name + "» — проверьте whitelist"
            );
          }
        })
        .catch(function (e) {
          setOrgMsg("alert-danger", e.message || "Ошибка сохранения");
          toast("danger", e.message);
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(btn, run);
    else run();
  }

  function addOrg() {
    var name = window.prompt("Название организации", "ООО «»");
    if (name == null) return;
    name = String(name).trim();
    if (!name) {
      toast("warning", "Пустое название");
      return;
    }
    var btn = document.getElementById("dg-ws-set-org-add");
    var run = function () {
      return api("/organizations", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: name,
          timezone: "Europe/Moscow",
          sick_unofficial_rate: 2500,
          seniority_base: 1000,
          seniority_step: 500,
          seniority_period_months: 6,
        }),
      }).then(function (j) {
        toast("success", "Организация создана");
        return loadAll().then(function () {
          if (j.id) selectOrg(j.id);
        });
      });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(btn, run);
    else
      run().catch(function (e) {
        toast("danger", e.message);
      });
  }

  function openDeleteOrg() {
    if (!state.org) {
      toast("warning", "Нет выбранной организации");
      return;
    }
    var txt = document.getElementById("dg-ws-set-org-del-text");
    if (txt) {
      txt.textContent =
        "Удалить организацию «" +
        (state.org.name || "#" + state.org.id) +
        "»? Отделы (общий справочник) останутся. Действие необратимо.";
    }
    showOverlay("org-del", true);
  }

  function confirmDeleteOrg() {
    if (!state.org) return;
    var id = Number(state.org.id);
    var btn = document.getElementById("dg-ws-set-org-del-ok");
    var run = function () {
      return api("/organizations/" + id, { method: "DELETE" })
        .then(function (j) {
          showOverlay("org-del", false);
          try {
            localStorage.removeItem(ORG_PICK_KEY);
          } catch (e) {}
          toast("success", "Удалено: " + (j.name || id));
          return loadAll();
        })
        .catch(function (e) {
          toast("danger", e.message || "Не удалось удалить");
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(btn, run);
    else run();
  }

  function applyLoaded(arr) {
    state.orgs = arr[0].rows || [];
    state.departmentsAll = arr[1].rows || [];
    state.employees = arr[2].rows || [];
    var saved = null;
    var savedFilter = 0;
    try {
      saved = Number(localStorage.getItem(ORG_PICK_KEY));
      savedFilter = Number(localStorage.getItem(EMP_FILTER_KEY)) || 0;
    } catch (e) {}
    var pick =
      state.orgs.find(function (o) {
        return Number(o.id) === saved;
      }) ||
      state.orgs[0] ||
      null;
    state.org = pick;
    if (
      savedFilter &&
      !state.orgs.some(function (o) {
        return Number(o.id) === savedFilter;
      })
    ) {
      savedFilter = 0;
    }
    state.empFilterOrgId = savedFilter;
    state.departments = allDepartments();
    fillOrgPick();
    fillOrg();
    fillEmpFilterOrg();
    renderDepts();
    renderEmps();
    if (!state.orgs.length) {
      toast("info", "Организаций нет — нажмите «Добавить»");
    }
  }

  /** При открытии — дотянуть группы (специальности) в общий справочник отделов. */
  function ensureGroupsAsDepartments() {
    if (state._didGroupImport) return Promise.resolve();
    state._didGroupImport = true;
    return api("/departments/import-specialties", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({}),
    })
      .then(function (j) {
        if (!(Number(j.created) > 0)) return null;
        toast("success", "Отделы = группы пользователей: добавлено " + j.created);
        return Promise.all([api("/organizations"), api("/departments"), api("/employees")]).then(
          applyLoaded
        );
      })
      .catch(function () {
        /* тихо: кнопка «Подтянуть группы» остаётся */
      });
  }

  function setCalMsg(cls, text) {
    var el = document.getElementById("dg-ws-set-cal-msg");
    if (!el) return;
    el.className = "alert mt-3 mb-0 " + (cls || "alert-light");
    el.classList.remove("d-none");
    el.textContent = text || "";
  }

  function loadCalendarStatus() {
    var y = new Date().getFullYear();
    var st = document.getElementById("dg-ws-set-cal-status");
    return Promise.all([
      api("/calendar?year=" + y).catch(function () {
        return null;
      }),
      api("/calendar?year=" + (y + 1)).catch(function () {
        return null;
      }),
    ]).then(function (arr) {
      if (!st) return;
      var parts = (arr || [])
        .filter(Boolean)
        .map(function (j) {
          var c = j.coverage || {};
          return (
            j.year +
            ": " +
            (c.days || 0) +
            " дн. / " +
            (c.workdays || 0) +
            " раб."
          );
        });
      st.textContent = parts.length ? "В БД · " + parts.join(" · ") : "В БД пусто — нажмите «Подтянуть»";
    });
  }

  function syncRfCalendar() {
    var btn = document.getElementById("dg-ws-set-cal-sync");
    setCalMsg("alert-warning", "Загружаем производственный календарь…");
    var run = function () {
      return api("/calendar/sync-rf", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ years: [2025, 2026, 2027, 2028] }),
      }).then(function (j) {
        var lines = (j.results || [])
          .map(function (r) {
            return (
              r.year +
              ": " +
              (r.error || r.imported + " дн., раб. " + (r.workdays || "—") + " (" + (r.source || "?") + ")")
            );
          })
          .join("; ");
        setCalMsg(
          j.success ? "alert-success" : "alert-warning",
          (j.success ? "Готово. " : "Частично. ") + lines
        );
        toast(j.success ? "success" : "warning", "Календарь РФ: " + (j.imported || 0) + " дн.");
        return loadCalendarStatus();
      });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(btn, run);
    else
      run().catch(function (e) {
        setCalMsg("alert-danger", e.message || "Ошибка");
        toast("danger", e.message);
      });
  }

  function loadAll() {
    return Promise.all([api("/organizations"), api("/departments"), api("/employees")])
      .then(function (arr) {
        applyLoaded(arr);
        loadBitcopConfig();
        loadCalendarStatus();
        return ensureGroupsAsDepartments();
      })
      .catch(function (e) {
        toast("danger", e.message || "Нет доступа к настройкам");
      });
  }

  function bind() {
    var bitcopSave = document.getElementById("dg-ws-set-bitcop-save");
    if (bitcopSave) bitcopSave.addEventListener("click", function () { saveBitcopConfig(); });
    var bitcopTest = document.getElementById("dg-ws-set-bitcop-test");
    if (bitcopTest) bitcopTest.addEventListener("click", testBitcop);
    var bitcopClear = document.getElementById("dg-ws-set-bitcop-clear-key");
    if (bitcopClear) {
      bitcopClear.addEventListener("click", function () {
        saveBitcopConfig({ clear_api_key: true });
      });
    }
    var calSync = document.getElementById("dg-ws-set-cal-sync");
    if (calSync) calSync.addEventListener("click", syncRfCalendar);
    var orgSave = document.getElementById("dg-ws-set-org-save");
    if (orgSave) orgSave.addEventListener("click", saveOrg);
    var orgAdd = document.getElementById("dg-ws-set-org-add");
    if (orgAdd) orgAdd.addEventListener("click", addOrg);
    var orgDel = document.getElementById("dg-ws-set-org-del");
    if (orgDel) orgDel.addEventListener("click", openDeleteOrg);
    var orgDelOk = document.getElementById("dg-ws-set-org-del-ok");
    if (orgDelOk) orgDelOk.addEventListener("click", confirmDeleteOrg);
    var orgPick = document.getElementById("dg-ws-set-org-pick");
    if (orgPick) {
      orgPick.addEventListener("change", function () {
        selectOrg(orgPick.value);
      });
    }
    var empFilter = document.getElementById("dg-ws-set-emp-filter-org");
    if (empFilter) {
      empFilter.addEventListener("change", function () {
        setEmpFilterOrg(empFilter.value);
      });
    }
    var deptSave = document.getElementById("dg-ws-set-dept-save");
    if (deptSave) deptSave.addEventListener("click", saveDept);
    var empSave = document.getElementById("dg-ws-set-emp-save");
    if (empSave) empSave.addEventListener("click", saveEmp);
    var deptAdd = document.getElementById("dg-ws-set-dept-add");
    if (deptAdd)
      deptAdd.addEventListener("click", function () {
        openDept(null);
      });
    var deptImport = document.getElementById("dg-ws-set-dept-import");
    if (deptImport) deptImport.addEventListener("click", importDeptsFromSpecialties);
    var empAdd = document.getElementById("dg-ws-set-emp-add");
    if (empAdd) empAdd.addEventListener("click", openEmpAdd);
    var empCreate = document.getElementById("dg-ws-set-emp-create");
    if (empCreate) empCreate.addEventListener("click", createEmp);

    var empOrg = document.getElementById("dg-ws-set-emp-org");
    if (empOrg) {
      empOrg.addEventListener("change", function () {
        fillDeptSelect(document.getElementById("dg-ws-set-emp-dept"), empOrg.value, null);
      });
    }
    var empEditOrg = document.getElementById("dg-ws-set-emp-edit-org");
    if (empEditOrg) {
      empEditOrg.addEventListener("change", function () {
        fillDeptSelect(document.getElementById("dg-ws-set-emp-edit-dept"), empEditOrg.value, null);
      });
    }
    var deptPremKind = document.getElementById("dg-ws-set-dept-prem-kind");
    if (deptPremKind) {
      deptPremKind.addEventListener("change", function () {
        syncPremAmountWrap("dg-ws-set-dept-prem-kind", "dg-ws-set-dept-prem-amount-wrap");
      });
    }
    var empPremKind = document.getElementById("dg-ws-set-emp-prem-kind");
    if (empPremKind) {
      empPremKind.addEventListener("change", function () {
        syncPremAmountWrap("dg-ws-set-emp-prem-kind", "dg-ws-set-emp-prem-amount-wrap");
      });
    }

    var deptTb = document.getElementById("dg-ws-set-dept-tbody");
    if (deptTb) {
      deptTb.addEventListener("click", function (ev) {
        var btn = ev.target.closest("[data-dg-ws-set-edit-dept]");
        if (!btn) return;
        openDept(Number(btn.getAttribute("data-dg-ws-set-edit-dept")));
      });
    }
    var empSearch = document.getElementById("dg-ws-set-emp-search");
    if (empSearch) {
      empSearch.addEventListener("input", function () {
        state.pendingEmpSearch = empSearch.value || "";
        syncEmpSearchDirty();
      });
      empSearch.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") {
          ev.preventDefault();
          commitEmpSearch();
        } else if (ev.key === "Escape") {
          ev.preventDefault();
          resetEmpSearch();
        }
      });
      empSearch.addEventListener("search", function () {
        if (!empSearch.value) resetEmpSearch();
      });
    }
    var empApply = document.getElementById("dg-ws-set-emp-apply");
    if (empApply) empApply.addEventListener("click", commitEmpSearch);
    var empReset = document.getElementById("dg-ws-set-emp-reset");
    if (empReset) empReset.addEventListener("click", resetEmpSearch);

    var empThead = document.getElementById("dg-ws-set-emp-thead");
    if (empThead) {
      empThead.addEventListener("click", function (ev) {
        if (window.getSelection && String(window.getSelection()).trim()) return;
        var th = ev.target.closest("[data-dg-ws-set-emp-sort]");
        if (!th || !empThead.contains(th)) return;
        setEmpSort(th.getAttribute("data-dg-ws-set-emp-sort"));
      });
    }
    var empTb = document.getElementById("dg-ws-set-emp-tbody");
    if (empTb) {
      empTb.addEventListener("click", function (ev) {
        var hist = ev.target.closest("[data-dg-ws-set-salary-hist]");
        if (hist) {
          openSalaryHistory(Number(hist.getAttribute("data-dg-ws-set-salary-hist")));
          return;
        }
        var btn = ev.target.closest("[data-dg-ws-set-edit-emp]");
        if (!btn) return;
        openEmp(Number(btn.getAttribute("data-dg-ws-set-edit-emp")));
      });
    }
    var salaryHistBtn = document.getElementById("dg-ws-set-emp-salary-hist");
    if (salaryHistBtn) {
      salaryHistBtn.addEventListener("click", function () {
        var id = Number(document.getElementById("dg-ws-set-emp-id").value);
        if (id) openSalaryHistory(id);
      });
    }

    var ft = document.getElementById("dg-ws-set-org-toggle");
    var fb = document.getElementById("dg-ws-set-org-body");
    if (ft && fb) {
      var collapsed = false;
      ft.addEventListener("click", function () {
        collapsed = !collapsed;
        fb.classList.toggle("d-none", collapsed);
        ft.textContent = collapsed ? "Развернуть" : "Свернуть";
      });
    }

    document.querySelectorAll("[data-dg-ws-set-close]").forEach(function (el) {
      el.addEventListener("click", function () {
        showOverlay(el.getAttribute("data-dg-ws-set-close"), false);
      });
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.key !== "Escape") return;
      showOverlay("dept", false);
      showOverlay("emp", false);
      showOverlay("emp-add", false);
      showOverlay("org-del", false);
      showOverlay("salary-hist", false);
    });
  }

  function init() {
    bind();
    loadAll();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
