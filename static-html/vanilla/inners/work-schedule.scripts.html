<script>
(function () {
  "use strict";

  var TAB_KEY = "datagon_ws_tab_v1";
  var API = "/api/work-schedule";

  var TAB_HINTS = {
    me: "Личный табель, заработок и заявки на отпуск",
    dept: "Графики доступных отделов, правки руководителем, согласование отпусков",
    sheet: "Табель бухгалтерии: сотрудники × дни",
  };

  var state = {
    access: null,
    tab: "me",
    calMode: "mine",
    earnPeriod: "month",
    filters: { orgId: 0, deptId: 0, month: "", search: "" },
    pending: { orgId: 0, deptId: 0, month: "", search: "" },
    orgs: [],
    departments: [],
    meMonth: null,
    deptMonth: null,
    /** Производственный календарь текущего месяца (из me/dept/sheet) */
    workCalendar: null,
    /** Ответы /dept/month по всем доступным отделам (отдельные блоки) */
    deptBundles: [],
    sheet: null,
    auditRows: [],
    /** Применённый фильтр журнала по ФИО сотрудника (subject) */
    auditEmpQ: "",
    pendingVacations: [],
    stuck: [],
    editCell: null,
    editPremium: null,
    /** Режим массовой правки дней табеля */
    bulkMode: false,
    /** Ключи "empId:day" */
    bulkSelected: {},
    bulkLast: null,
  };

  function money(n) {
    if (window.DatagonFmt && window.DatagonFmt.formatMoney) return window.DatagonFmt.formatMoney(n);
    return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽";
  }

  /** Вывод пользователю: дд-мм-гггг (не сырой YYYY-MM-DD). */
  function fmtDate(v) {
    if (!v) return "—";
    if (window.DatagonFmt && window.DatagonFmt.formatDate) {
      var fd = window.DatagonFmt.formatDate(v);
      if (fd && fd !== "—" && !/^\d{4}-\d{2}-\d{2}$/.test(fd)) return fd;
    }
    var s = String(v).trim();
    if (/T/.test(s)) {
      try {
        var dIso = new Date(s);
        if (Number.isFinite(dIso.getTime())) {
          var uy = dIso.getUTCFullYear();
          var um = dIso.getUTCMonth() + 1;
          var ud = dIso.getUTCDate();
          return (
            (ud < 10 ? "0" + ud : ud) +
            "-" +
            (um < 10 ? "0" + um : um) +
            "-" +
            uy
          );
        }
      } catch (e1) {}
    }
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[3] + "-" + m[2] + "-" + m[1];
    var rm = s.match(/^(\d{2})[.\-/](\d{2})[.\-/](\d{4})$/);
    if (rm) return rm[1] + "-" + rm[2] + "-" + rm[3];
    return "—";
  }

  function toast(type, message) {
    if (window.DatagonNotify && window.DatagonNotify.toast) {
      window.DatagonNotify.toast({ type: type, message: message });
    }
  }

  function api(path, opts) {
    return fetch(API + path, Object.assign({ credentials: "same-origin" }, opts || {})).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || (j && j.success === false)) {
          throw new Error((j && j.error) || "HTTP " + r.status);
        }
        return j;
      });
    });
  }

  function daysInMonth(y, m) {
    return new Date(y, m, 0).getDate();
  }

  var WD_SHORT = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];

  function calendarNonWorkSet(cal) {
    var set = {};
    if (!cal) return set;
    (cal.non_working_days || []).forEach(function (d) {
      set[Number(d)] = true;
    });
    return set;
  }

  function calendarShortSet(cal) {
    var set = {};
    if (!cal) return set;
    (cal.short_days || []).forEach(function (d) {
      set[Number(d)] = true;
    });
    return set;
  }

  function activeMonthCalendar() {
    if (state.tab === "sheet" && state.sheet && state.sheet.calendar) return state.sheet.calendar;
    if (state.tab === "dept") {
      var b = (state.deptBundles || [])[0] || state.deptMonth;
      if (b && b.calendar) return b.calendar;
    }
    if (state.meMonth && state.meMonth.calendar) return state.meMonth.calendar;
    return state.workCalendar || null;
  }

  /** Шапка колонки дня: «9» + «пт»; нерабочие по производственному календарю / сб–вс. */
  function dayColHeaderHtml(y, m, day, cal) {
    var wd = new Date(y, m - 1, day).getDay();
    var weekend = wd === 0 || wd === 6;
    var map = cal || activeMonthCalendar();
    var nonWork = calendarNonWorkSet(map);
    var short = calendarShortSet(map);
    var isNonWork = nonWork[day] || (!map && weekend);
    var isShort = !!short[day];
    var tip = day + " · " + WD_SHORT[wd];
    if (map && map.days && map.days[day] && map.days[day].holiday_name) {
      tip += " · " + map.days[day].holiday_name;
    } else if (isNonWork) tip += " · выходной";
    if (isShort) tip += " · сокращённый";
    return (
      '<th class="dg-ws-day-h' +
      (isNonWork ? " nonwork weekend" : "") +
      (isShort ? " short-day" : "") +
      '" title="' +
      tip.replace(/"/g, "&quot;") +
      '"><span class="dg-ws-day-n">' +
      day +
      '</span><span class="dg-ws-day-wd">' +
      WD_SHORT[wd] +
      "</span></th>"
    );
  }

  function parseMonthValue(v) {
    var p = String(v || "").split("-");
    return {
      y: Number(p[0]) || new Date().getFullYear(),
      m: Number(p[1]) || new Date().getMonth() + 1,
    };
  }

  function defaultMonthStr() {
    var d = new Date();
    var m = d.getMonth() + 1;
    return d.getFullYear() + "-" + (m < 10 ? "0" + m : m);
  }

  var MONTH_RU = [
    "январь",
    "февраль",
    "март",
    "апрель",
    "май",
    "июнь",
    "июль",
    "август",
    "сентябрь",
    "октябрь",
    "ноябрь",
    "декабрь",
  ];

  function formatMonthRu(ym) {
    var pm = parseMonthValue(ym);
    var name = MONTH_RU[pm.m - 1] || "";
    return name + " " + pm.y;
  }

  function monthStrFromParts(y, m) {
    return y + "-" + (m < 10 ? "0" + m : m);
  }

  function shiftMonthStr(ym, delta) {
    var pm = parseMonthValue(ym);
    var d = new Date(pm.y, pm.m - 1 + delta, 1);
    return monthStrFromParts(d.getFullYear(), d.getMonth() + 1);
  }

  function syncMonthUi() {
    var ym = state.filters.month || defaultMonthStr();
    var label = formatMonthRu(ym);
    ["dg-ws-cal-month-title", "dg-ws-dept-month-title", "dg-ws-sheet-month-title", "dg-ws-earn-period"].forEach(
      function (id) {
        var el = document.getElementById(id);
        if (el) el.textContent = label;
      }
    );
    var pick = document.getElementById("dg-ws-month-pick");
    if (pick && pick.value !== ym) pick.value = ym;
    var sheetMonth = document.getElementById("dg-ws-f-month");
    if (sheetMonth && sheetMonth.value !== ym) sheetMonth.value = ym;
    state.pending.month = ym;
  }

  function setMonth(ym, opts) {
    var next = String(ym || "").trim() || defaultMonthStr();
    if (!/^\d{4}-\d{2}$/.test(next)) next = defaultMonthStr();
    state.filters.month = next;
    state.pending.month = next;
    syncMonthUi();
    if (opts && opts.reload === false) return;
    if (state.tab === "me") loadMe();
    else if (state.tab === "dept") loadDept();
    else if (state.tab === "sheet") loadSheet();
  }

  function shiftMonth(delta) {
    setMonth(shiftMonthStr(state.filters.month || defaultMonthStr(), delta));
  }

  function vacStatusBadge(st) {
    if (st === "approved") return '<span class="badge bg-success">согласовано</span>';
    if (st === "rejected") return '<span class="badge bg-danger">отклонено</span>';
    return '<span class="badge bg-warning text-dark">заявка</span>';
  }

  function setTab(tab) {
    if (!TAB_HINTS[tab]) tab = "me";
    var acc = state.access || {};
    if (tab === "sheet" && !acc.is_accounting) tab = acc.is_employee ? "me" : "dept";
    state.tab = tab;
    try {
      sessionStorage.setItem(TAB_KEY, tab);
    } catch (e) {}
    try {
      var url = new URL(window.location.href);
      if (url.searchParams.get("tab") !== tab) {
        url.searchParams.set("tab", tab);
        window.history.replaceState({}, "", url.pathname + url.search + url.hash);
      }
    } catch (e2) {}
    ["me", "dept", "sheet"].forEach(function (t) {
      var btn = document.getElementById("dg-ws-tab-" + t);
      if (btn) {
        btn.classList.toggle("active", t === tab);
        btn.setAttribute("aria-selected", t === tab ? "true" : "false");
        if (t === "sheet" && !acc.is_accounting) btn.classList.add("d-none");
        else if (t === "sheet") btn.classList.remove("d-none");
      }
      var view = document.getElementById("dg-ws-view-" + t);
      if (view) view.classList.toggle("d-none", t !== tab);
    });
    var hint = document.getElementById("dg-ws-tab-hint");
    if (hint) hint.textContent = TAB_HINTS[tab];
    if (tab === "me") loadMe();
    if (tab === "dept") loadDept();
    if (tab === "sheet") loadSheet();
  }

  function renderLegend(el, withBusy) {
    if (!el) return;
    el.innerHTML =
      '<span><i class="swatch" style="background:#28a745"></i> полный</span>' +
      '<span><i class="swatch" style="background:#ffc107"></i> 0,5</span>' +
      '<span><i class="swatch" style="background:#e3f2fd"></i> отпуск</span>' +
      '<span><i class="swatch" style="background:#fce4ec"></i> больничный</span>' +
      '<span><i class="swatch" style="background:#fff0f0;border:1px solid #e0a0a0"></i> выходной (календарь РФ)</span>' +
      '<span><i class="swatch dg-ws-swatch-open"></i> на работе (таймер)</span>' +
      (withBusy
        ? '<span><i class="swatch" style="background:#ffebee"></i> занято в отделе</span>'
        : "");
  }

  /** Длительность из дробных часов → ЧЧ:ММ (час = 60 мин). */
  function fmtHours(h) {
    var n = Number(h);
    if (!Number.isFinite(n) || n <= 0) return "00:00";
    var totalMin = Math.round(n * 60);
    if (totalMin < 1) return "<1 мин";
    var hh = Math.floor(totalMin / 60);
    var mm = totalMin % 60;
    return (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
  }

  function renderEarnings() {
    var p = state.meMonth && state.meMonth.payroll;
    syncMonthUi();
    var grid = document.getElementById("dg-ws-earn-grid");
    if (!grid) return;
    if (!(state.access && state.access.is_employee)) {
      grid.innerHTML = '<div class="text-muted small">Нет карточки сотрудника — попросите бухгалтерию привязать вас в настройках графика</div>';
      return;
    }
    if (!state.meMonth) {
      grid.innerHTML = '<div class="text-muted small">Не удалось загрузить данные за месяц</div>';
      return;
    }
    if (!p) {
      grid.innerHTML = '<div class="text-muted small">Нет расчёта за этот месяц</div>';
      return;
    }
    var hoursM = state.meMonth.hours_month != null ? state.meMonth.hours_month : 0;
    var salaryRate = p.salary_rate != null ? p.salary_rate : null;
    var senFull = p.seniority_full != null ? p.seniority_full : null;
    var okladVal =
      money(p.base_salary) +
      (salaryRate != null
        ? '<span class="dg-ws-earn-sub">ставка ' + money(salaryRate) + "</span>"
        : "");
    var senVal =
      money(p.seniority_bonus) +
      (senFull != null && Number(senFull) > 0
        ? '<span class="dg-ws-earn-sub">полная ' + money(senFull) + "</span>"
        : "");
    var rows = [
      ["Часы за месяц", fmtHours(hoursM), false, true, false],
      [
        "Смены (ставки)",
        (p.worked_days != null ? p.worked_days : "—") + " / " + (p.norm_days != null ? p.norm_days : "—"),
        false,
        true,
        false,
      ],
      ["Оклад", okladVal, false, true, true],
      ["Премия (доплата)", p.premium, false, false, false],
      ["Доплата за стаж", senVal, false, true, false],
      ["Отпускные", p.vacation_pay, false, false, false],
      ["Больничные", p.sick_pay, false, false, false],
      ["Итого к выплате", p.total, true, false, false],
    ];
    grid.innerHTML = rows
      .map(function (r) {
        var tag = r[4] ? "button" : "div";
        var extra = r[4]
          ? ' type="button" class="dg-ws-earn-chip dg-ws-earn-salary" data-dg-ws-salary-hist="1" data-dg-notify-start="Загружаем историю оклада…" title="История изменений оклада"'
          : ' class="dg-ws-earn-chip' + (r[2] ? " total" : "") + '"';
        var valHtml = r[3] ? String(r[1]) : money(r[1]);
        return (
          "<" +
          tag +
          extra +
          '><span class="lbl">' +
          r[0] +
          '</span><span class="val">' +
          valHtml +
          "</span></" +
          tag +
          ">"
        );
      })
      .join("");
  }

  function fmtAuditWhen(v) {
    if (!v) return "—";
    try {
      var d = new Date(v);
      if (!Number.isFinite(d.getTime())) return String(v);
      var dd = d.getDate();
      var mm = d.getMonth() + 1;
      var yyyy = d.getFullYear();
      var hh = d.getHours();
      var mi = d.getMinutes();
      return (
        (dd < 10 ? "0" : "") +
        dd +
        "-" +
        (mm < 10 ? "0" : "") +
        mm +
        "-" +
        yyyy +
        " " +
        (hh < 10 ? "0" : "") +
        hh +
        ":" +
        (mi < 10 ? "0" : "") +
        mi
      );
    } catch (e) {
      return String(v);
    }
  }

  function closeSalaryHistModal() {
    var ov = document.getElementById("dg-ws-salary-hist-overlay");
    if (!ov) return;
    ov.style.display = "none";
    ov.setAttribute("aria-hidden", "true");
  }

  function openSalaryHistModal() {
    var empId =
      (state.meMonth && state.meMonth.employee && state.meMonth.employee.id) ||
      (state.access && state.access.employee && state.access.employee.id);
    if (!empId) {
      toast("warning", "Нет карточки сотрудника");
      return;
    }
    var ov = document.getElementById("dg-ws-salary-hist-overlay");
    var title = document.getElementById("dg-ws-salary-hist-title");
    var meta = document.getElementById("dg-ws-salary-hist-meta");
    var tb = document.getElementById("dg-ws-salary-hist-tbody");
    if (!ov) return;
    if (title) title.textContent = "История оклада";
    if (meta) meta.textContent = "Загрузка…";
    if (tb) tb.innerHTML = '<tr><td colspan="4" class="text-muted">Загрузка…</td></tr>';
    ov.style.display = "flex";
    ov.setAttribute("aria-hidden", "false");
    api("/employees/" + empId + "/salary-history")
      .then(function (j) {
        var emp = j.employee || {};
        if (title) title.textContent = "История оклада · " + (emp.full_name || "");
        if (meta) meta.textContent = "Текущий оклад: " + money(emp.salary) + " · кто менял и когда";
        var rows = j.rows || [];
        if (!tb) return;
        if (!rows.length) {
          tb.innerHTML =
            '<tr><td colspan="4" class="text-muted">Пока нет записей об изменении оклада</td></tr>';
          return;
        }
        tb.innerHTML = rows
          .map(function (r) {
            var who = r.full_name || r.username || (r.user_id ? "#" + r.user_id : "—");
            var was = r.old_value != null && r.old_value !== "" ? money(Number(r.old_value) || 0) : "—";
            var became = r.new_value != null && r.new_value !== "" ? money(Number(r.new_value) || 0) : "—";
            return (
              "<tr><td>" +
              fmtAuditWhen(r.created_at) +
              "</td><td>" +
              who +
              "</td><td>" +
              was +
              "</td><td>" +
              became +
              "</td></tr>"
            );
          })
          .join("");
      })
      .catch(function (e) {
        if (meta) meta.textContent = e.message || "Ошибка";
        if (tb) tb.innerHTML = '<tr><td colspan="4" class="text-danger">' + (e.message || "Ошибка") + "</td></tr>";
        toast("danger", e.message || "Не удалось загрузить историю оклада");
      });
  }

  function renderMyVacations() {
    var tb = document.getElementById("dg-ws-my-vacations");
    if (!tb) return;
    var list = (state.meMonth && state.meMonth.vacations) || [];
    if (!list.length) {
      tb.innerHTML = '<tr><td colspan="3" class="text-muted">Заявок нет</td></tr>';
      return;
    }
    tb.innerHTML = list
      .map(function (v) {
        return (
          "<tr><td>" +
          fmtDate(v.date_from) +
          " — " +
          fmtDate(v.date_to) +
          "</td><td>" +
          v.days_count +
          "</td><td>" +
          vacStatusBadge(v.status) +
          "</td></tr>"
        );
      })
      .join("");
  }

  function busyDaysFromVacations(vacations, monthStr) {
    var pm = parseMonthValue(monthStr);
    var dim = daysInMonth(pm.y, pm.m);
    var set = {};
    (vacations || []).forEach(function (v) {
      if (v.status !== "approved" && v.status !== "pending") return;
      var cur = new Date(v.date_from);
      var end = new Date(v.date_to);
      while (cur <= end) {
        if (cur.getFullYear() === pm.y && cur.getMonth() + 1 === pm.m) {
          set[cur.getDate()] = true;
        }
        cur.setDate(cur.getDate() + 1);
      }
    });
    var out = [];
    for (var d = 1; d <= dim; d++) if (set[d]) out.push(d);
    return out;
  }

  function renderCalendar() {
    var host = document.getElementById("dg-ws-cal-host");
    if (!host) return;
    syncMonthUi();
    renderLegend(document.getElementById("dg-ws-cal-legend"), state.calMode === "free");
    var monthStr = state.filters.month || defaultMonthStr();
    var hint = document.getElementById("dg-ws-cal-hint");
    var cal = (state.meMonth && state.meMonth.calendar) || state.workCalendar || null;
    var nonWork = calendarNonWorkSet(cal);
    var shortDays = calendarShortSet(cal);
    if (hint) {
      var calNote =
        cal && cal.source === "rf"
          ? " Нерабочие дни (розовый) — по производственному календарю РФ."
          : cal && cal.source === "fallback_mon_fri"
            ? " Календарь РФ не загружен — показаны сб/вс."
            : "";
      hint.textContent =
        formatMonthRu(monthStr) +
        ". " +
        (state.calMode === "free"
          ? "Красная подсветка — в отделе уже кто-то в отпуске (пересечения ограничены)."
          : "Стрелки ‹ › — сменить месяц. Отпуск — в блоке ниже.") +
        calNote;
    }
    var pm = parseMonthValue(monthStr);
    var dim = daysInMonth(pm.y, pm.m);
    var firstWd = new Date(pm.y, pm.m - 1, 1).getDay();
    var startPad = (firstWd + 6) % 7;
    var cells = (state.meMonth && state.meMonth.cells) || {};
    var busy = busyDaysFromVacations(
      (state.deptMonth && state.deptMonth.vacations) || [],
      monthStr
    );
    var hoursMonth = 0;
    var daysWorked = 0;
    Object.keys(cells).forEach(function (k) {
      var c = cells[k];
      if (!c) return;
      var h = Number(c.hours) || 0;
      if (h > 0 || c.logged || c.closed || c.open) {
        hoursMonth += h;
        daysWorked += 1;
      }
    });
    hoursMonth = Math.round(hoursMonth * 100) / 100;

    var html = "";
    if (state.calMode === "mine") {
      html +=
        '<div class="dg-ws-cal-summary mb-2">' +
        "<strong>Отработано за месяц:</strong> " +
        fmtHours(hoursMonth) +
        (daysWorked ? " · дней с отметкой: " + daysWorked : "") +
        "</div>";
    }
    html += '<div class="dg-ws-cal-grid">';
    ["пн", "вт", "ср", "чт", "пт", "сб", "вс"].forEach(function (h) {
      html += '<div class="dg-ws-cal-head">' + h + "</div>";
    });
    for (var i = 0; i < startPad; i++) html += '<div class="dg-ws-cal-cell muted"></div>';
    var today = new Date();
    for (var d = 1; d <= dim; d++) {
      var cell = cells[d] || { rate: 0, type: "work", hours: 0 };
      var wd = new Date(pm.y, pm.m - 1, d).getDay();
      var weekend = wd === 0 || wd === 6;
      var isNonWork = nonWork[d] || (!cal && weekend);
      var cls = ["dg-ws-cal-cell"];
      if (isNonWork) cls.push("nonwork");
      else if (weekend) cls.push("muted");
      if (shortDays[d]) cls.push("short-day");
      var hasHours = Number(cell.hours) > 0 || cell.open || cell.closed || cell.logged;
      if (cell.type === "vacation") cls.push("type-vacation");
      else if (cell.type === "sick") cls.push("type-sick");
      else if (Number(cell.rate) === 1) cls.push("rate-1");
      else if (Number(cell.rate) === 0.5) cls.push("rate-05");
      else if (hasHours) cls.push("has-hours");
      else cls.push("rate-0");
      if (state.calMode === "free" && busy.indexOf(d) >= 0) cls.push("type-busy");
      if (pm.y === today.getFullYear() && pm.m === today.getMonth() + 1 && d === today.getDate()) cls.push("today");
      var ymd =
        pm.y +
        "-" +
        (pm.m < 10 ? "0" + pm.m : pm.m) +
        "-" +
        (d < 10 ? "0" + d : d);
      if (state.calMode === "mine") cls.push("clickable");
      var dayTip = "";
      if (cal && cal.days && cal.days[d]) {
        var meta = cal.days[d];
        if (meta.holiday_name) dayTip = meta.holiday_name;
        if (meta.transfer_note) dayTip += (dayTip ? " · " : "") + meta.transfer_note;
      }
      var body = "";
      if (state.calMode === "mine") {
        var hoursLabel = "";
        if (cell.type === "vacation") hoursLabel = '<span class="dg-ws-cal-hours">отпуск</span>';
        else if (cell.type === "sick") hoursLabel = '<span class="dg-ws-cal-hours">больн.</span>';
        else if (hasHours) {
          if (cell.open) {
            hoursLabel =
              '<span class="dg-ws-cal-hours open">' +
              (Number(cell.hours) > 0 ? fmtHours(cell.hours) + " · идёт" : "идёт…") +
              "</span>";
          } else if (Number(cell.hours) > 0) {
            hoursLabel =
              '<span class="dg-ws-cal-hours">' +
              fmtHours(cell.hours) +
              "</span>" +
              '<span class="dg-ws-cal-rate">ставка ' +
              cell.rate +
              "</span>";
          } else {
            hoursLabel = '<span class="dg-ws-cal-hours muted-hrs">&lt;5 мин</span>';
          }
        } else {
          hoursLabel = '<span class="dg-ws-cal-empty">—</span>';
        }
        body = '<div class="day-num">' + d + "</div>" + hoursLabel;
      } else {
        body = '<div class="day-num">' + d + "</div>" + (busy.indexOf(d) >= 0 ? "занято" : "свободно");
      }
      var titleAttr = dayTip || (state.calMode === "mine" ? "Открыть детали дня" : "");
      html +=
        '<div class="' +
        cls.join(" ") +
        '"' +
        (state.calMode === "mine" ? ' data-dg-ws-day="' + ymd + '"' : "") +
        (titleAttr ? ' title="' + String(titleAttr).replace(/"/g, "&quot;") + '"' : "") +
        ">" +
        body +
        "</div>";
    }
    html += "</div>";
    host.innerHTML = html;
  }

  function fmtDateTimeRu(sql) {
    if (!sql) return "—";
    var s = String(sql).replace("T", " ").slice(0, 19);
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})[ ](\d{2}):(\d{2})(?::(\d{2}))?/);
    if (!m) return s;
    return m[3] + "-" + m[2] + "-" + m[1] + " " + m[4] + ":" + m[5] + (m[6] ? ":" + m[6] : "");
  }

  function cleanIp(ip) {
    if (!ip) return "—";
    return String(ip).replace(/^::ffff:/i, "");
  }

  function closeDayModal() {
    var ov = document.getElementById("dg-ws-day-overlay");
    if (!ov) return;
    ov.style.display = "none";
    ov.setAttribute("aria-hidden", "true");
  }

  function openDayModal(ymd) {
    var ov = document.getElementById("dg-ws-day-overlay");
    var title = document.getElementById("dg-ws-day-title");
    var summary = document.getElementById("dg-ws-day-summary");
    var tb = document.getElementById("dg-ws-day-segments");
    if (!ov || !tb) return;
    if (title) title.textContent = "День " + fmtDate(ymd);
    if (summary) summary.textContent = "Загрузка…";
    tb.innerHTML = '<tr><td colspan="7" class="text-muted">Загрузка…</td></tr>';
    ov.style.display = "flex";
    ov.setAttribute("aria-hidden", "false");
    api("/me/day?date=" + encodeURIComponent(ymd))
      .then(function (j) {
        var segs = (j.segments || []).slice();
        if (j.open) segs.push(j.open);
        var n = segs.length;
        if (summary) {
          summary.textContent =
            (j.found
              ? "Сегментов: " + n + " · всего " + fmtHours(j.hours_worked) + " · ставка " + (j.rate != null ? j.rate : "—")
              : "Отметок за этот день нет") +
            (j.status ? " · статус: " + j.status : "");
        }
        if (!n) {
          tb.innerHTML = '<tr><td colspan="7" class="text-muted">Нет запусков / остановок</td></tr>';
          return;
        }
        tb.innerHTML = segs
          .map(function (s, i) {
            var open = !!s.open;
            return (
              "<tr>" +
              "<td>" +
              (i + 1) +
              "</td>" +
              "<td>" +
              fmtDateTimeRu(s.in) +
              "</td>" +
              "<td>" +
              (open ? '<span class="text-primary fw-semibold">идёт…</span>' : fmtDateTimeRu(s.out)) +
              "</td>" +
              "<td>" +
              fmtHours(s.hours) +
              "</td>" +
              '<td class="ip">' +
              cleanIp(s.ip_in) +
              "</td>" +
              '<td class="ip">' +
              (open ? "—" : cleanIp(s.ip_out)) +
              "</td>" +
              "<td>" +
              (s.device_in || s.device_out
                ? [s.device_in, open ? "" : s.device_out].filter(Boolean).join(" → ")
                : "—") +
              "</td>" +
              "</tr>"
            );
          })
          .join("");
      })
      .catch(function (e) {
        if (summary) summary.textContent = e.message || "Ошибка загрузки";
        tb.innerHTML = '<tr><td colspan="7" class="text-danger">Не удалось загрузить</td></tr>';
      });
  }

  function cellLabel(c) {
    if (!c) return { cls: "c-0", label: "" };
    var cls;
    var label;
    if (c.type === "vacation") {
      cls = "c-v";
      label = "О";
    } else if (c.type === "sick") {
      cls = "c-s";
      label = "Б";
    } else if (Number(c.rate) === 1) {
      cls = "c-1";
      label = "1";
    } else if (Number(c.rate) === 0.5) {
      cls = "c-05";
      label = "½";
    } else {
      cls = "c-0";
      label = c.open ? "▶" : "0";
    }
    if (c.open) cls += " c-open";
    return { cls: cls, label: label };
  }

  function visibleDeptList() {
    if (state.access && state.access.visible_departments && state.access.visible_departments.length) {
      return state.access.visible_departments;
    }
    return state.departments || [];
  }

  /** Свой отдел первым, остальные по имени. */
  function visibleDeptIdsOrdered() {
    var list = visibleDeptList().slice();
    var own =
      state.access && state.access.employee && state.access.employee.department_id
        ? Number(state.access.employee.department_id)
        : 0;
    list.sort(function (a, b) {
      var aid = Number(a.id);
      var bid = Number(b.id);
      if (own && aid === own) return -1;
      if (own && bid === own) return 1;
      return String(a.name || "").localeCompare(String(b.name || ""), "ru");
    });
    return list.map(function (d) {
      return Number(d.id);
    }).filter(Boolean);
  }

      html +=
        '<div class="dg-ws-dept-section-title"><span>' +

    if (st === "finished") return '<span class="badge bg-secondary">закончил</span>';

    if (st === "sick") return '<span class="badge bg-warning text-dark">больничный</span>';

          .join("") || '<tr><td colspan="4" class="text-muted">Очередь пуста</td></tr>';

  function sheetEmpMatchesSearch(e, q) {
    var s = String(q || "")
      .trim()
      .toLowerCase()
      .replace(/ё/g, "е")
      .replace(/\s+/g, " ");
    if (!s) return true;
    var hay = [e.full_name, e.department_name, e.salary, e.salary_accrued, e.premium_accrued]
      .map(function (x) {
        return x == null ? "" : String(x);
      })
      .join(" ")
      .toLowerCase()
      .replace(/ё/g, "е")
      .replace(/\s+/g, " ");
    return s.split(" ").every(function (tok) {
      return tok && hay.indexOf(tok) !== -1;
    });
  }

  function syncSheetFilterDirty() {
    var btn = document.getElementById("dg-ws-f-apply");
    if (!btn) return;
    var dirty =
      Number(state.pending.orgId || 0) !== Number(state.filters.orgId || 0) ||
      Number(state.pending.deptId || 0) !== Number(state.filters.deptId || 0) ||
      String(state.pending.month || "") !== String(state.filters.month || "") ||
      String(state.pending.search || "") !== String(state.filters.search || "");
    btn.classList.toggle("dg-flt-dirty", dirty);
    btn.textContent = dirty ? "Применить •" : "Применить";
  }

  function renderSheet() {
    renderLegend(document.getElementById("dg-ws-sheet-legend"), false);
    var sh = state.sheet;
    var month = state.filters.month || defaultMonthStr();
    var pm = parseMonthValue(month);
    var dim = daysInMonth(pm.y, pm.m);
    var q = state.filters.search || "";
    var emps = (sh && sh.employees) || [];
    var filtered = emps.filter(function (e) {
      return sheetEmpMatchesSearch(e, q);
    });
    var elMd = document.getElementById("dg-ws-kpi-mandays");
    var elFot = document.getElementById("dg-ws-kpi-fot");
    var elEm = document.getElementById("dg-ws-kpi-emps");
    if (sh && sh.kpi) {
      if (elMd) elMd.textContent = String(sh.kpi.mandays);
      if (elFot) elFot.textContent = money(sh.kpi.fot);
      if (elEm) {
        elEm.textContent = q
          ? String(filtered.length) + " / " + String(sh.kpi.count)
          : String(sh.kpi.count);
      }
    }
    var host = document.getElementById("dg-ws-sheet-host");
    if (!host) return;
    if (!sh) {
      host.innerHTML = '<div class="text-muted p-3">Загрузка…</div>';
      return;
    }
    if (!filtered.length) {
      host.innerHTML =
        '<div class="text-muted p-3">' +
        (q ? "Никого не найдено по запросу «" + q + "»" : "Нет сотрудников") +
        "</div>";
      return;
    }
    var html =
      '<table class="dg-ws-sheet"><thead><tr><th class="emp">Сотрудник</th>' +
      '<th class="dg-ws-pay-h" title="Накапало / ставка">Оклад</th>' +
      '<th class="dg-ws-pay-h" title="Клик — ручная премия за месяц">Премия</th>' +
      '<th class="dg-ws-pay-h" title="Накапало / полная за месяц">За стаж</th>' +
      '<th class="dg-ws-pay-h dg-ws-pay-total-h" title="Накапало по графику / плановый итог за полный месяц">Итого</th>';
    for (var d = 1; d <= dim; d++) html += dayColHeaderHtml(pm.y, pm.m, d, sh.calendar || activeMonthCalendar());
    html += "<th>Σ</th></tr></thead><tbody>";
    filtered.forEach(function (e) {
      var salAcc = e.salary_accrued != null ? e.salary_accrued : 0;
      var salRate = e.salary != null ? e.salary : 0;
      var premAcc = e.premium_accrued != null ? e.premium_accrued : 0;
      var premFull = e.premium_full != null ? e.premium_full : 0;
      var premManual = e.premium_manual != null && e.premium_manual !== "";
      var premSrc = e.premium_source || "";
      var senAcc = e.seniority_accrued != null ? e.seniority_accrued : 0;
      var senFull = e.seniority_full != null ? e.seniority_full : 0;
      var totAcc =
        e.total_accrued != null ? e.total_accrued : Number(salAcc) + Number(premAcc) + Number(senAcc);
      var totPlan =
        e.total_planned != null
          ? e.total_planned
          : Number(salRate) +
            (e.premium_planned != null
              ? Number(e.premium_planned)
              : premManual
                ? Number(e.premium_manual) || 0
                : Number(premFull) || 0) +
            Number(senFull);
      var premSub = premSrc === "sales"
        ? "из продаж"
        : premSrc === "manual" || premManual
          ? "ручная" + (premFull > 0 ? " · правило " + money(premFull) : "")
          : premFull > 0
            ? "полная " + money(premFull)
            : "клик — ввести";
      html +=
        '<tr><td class="emp">' +
        (e.full_name || "") +
        '</td><td class="dg-ws-pay">' +
        '<span class="dg-ws-pay-main">' +
        money(salAcc) +
        '</span><span class="dg-ws-pay-sub">ставка ' +
        money(salRate) +
        "</span></td>" +
        '<td class="dg-ws-pay cell-click dg-ws-pay-prem' +
        (premSrc === "sales" ? " dg-ws-pay-sales" : premManual ? " dg-ws-pay-manual" : "") +
        '" data-emp-prem="' +
        e.id +
        '" title="Ручная премия за месяц">' +
        '<span class="dg-ws-pay-main">' +
        money(premAcc) +
        '</span><span class="dg-ws-pay-sub">' +
        premSub +
        "</span></td>" +
        '<td class="dg-ws-pay" title="Доплата за стаж">' +
        '<span class="dg-ws-pay-main">' +
        (e.seniority_pay_disabled ? "—" : money(senAcc)) +
        '</span><span class="dg-ws-pay-sub">' +
        (e.seniority_pay_disabled
          ? "выкл"
          : senFull > 0
            ? "полная " + money(senFull)
            : "нет стажа") +
        "</span></td>" +
        '<td class="dg-ws-pay dg-ws-pay-total" title="Накапало / плановый итог">' +
        '<span class="dg-ws-pay-main">' +
        money(totAcc) +
        '</span><span class="dg-ws-pay-sub">план ' +
        money(totPlan) +
        "</span></td>";
      var sum = 0;
      for (var day = 1; day <= dim; day++) {
        var c = (sh.cells[e.id] && sh.cells[e.id][day]) || null;
        var L = cellLabel(c);
        if (c) {
          if (c.type === "vacation" || c.type === "sick") sum += 1;
          else sum += Number(c.rate) || 0;
        }
        var selKey = e.id + ":" + day;
        var selCls = state.bulkSelected[selKey] ? " dg-ws-bulk-sel" : "";
        html +=
          '<td class="cell-click ' +
          L.cls +
          selCls +
          '" data-emp="' +
          e.id +
          '" data-day="' +
          day +
          '">' +
          L.label +
          "</td>";
      }
      html += "<td>" + Math.round(sum * 10) / 10 + "</td></tr>";
    });
    html += "</tbody></table>";
    host.innerHTML = html;
    host.classList.toggle("dg-ws-bulk-on", !!state.bulkMode);
    syncBulkUi();
  }

  function bulkSelectedCount() {
    return Object.keys(state.bulkSelected || {}).length;
  }

  function bulkSelectedList() {
    return Object.keys(state.bulkSelected || {}).map(function (k) {
      var p = k.split(":");
      return { empId: Number(p[0]), day: Number(p[1]) };
    });
  }

  function clearBulkSelection() {
    state.bulkSelected = {};
    state.bulkLast = null;
  }

  function setBulkMode(on) {
    state.bulkMode = !!on;
    if (!state.bulkMode) clearBulkSelection();
    var host = document.getElementById("dg-ws-sheet-host");
    if (host) host.classList.toggle("dg-ws-bulk-on", !!state.bulkMode);
    if (host && host.querySelectorAll) {
      host.querySelectorAll("td.dg-ws-bulk-sel").forEach(function (td) {
        if (!state.bulkMode) td.classList.remove("dg-ws-bulk-sel");
      });
    }
    syncBulkUi();
  }

  function syncBulkUi() {
    var n = bulkSelectedCount();
    var btn = document.getElementById("dg-ws-bulk-toggle");
    var cancel = document.getElementById("dg-ws-bulk-cancel");
    var banner = document.getElementById("dg-ws-bulk-banner");
    var hint = document.getElementById("dg-ws-sheet-hint");
    if (banner) banner.classList.toggle("d-none", !state.bulkMode);
    if (cancel) cancel.classList.toggle("d-none", !state.bulkMode);
    if (hint) {
      hint.textContent = state.bulkMode
        ? "Выбор дней · Shift+клик — диапазон"
        : "Клик по ячейке — правка";
    }
    if (!btn) return;
    btn.classList.toggle("btn-outline-primary", !state.bulkMode);
    btn.classList.toggle("btn-primary", !!state.bulkMode);
    if (!state.bulkMode) {
      btn.textContent = "Массовая смена";
      btn.setAttribute("data-dg-notify-start", "Режим массовой смены…");
    } else if (n === 0) {
      btn.textContent = "Массовая смена · выберите дни";
      btn.setAttribute("data-dg-notify-start", "Сначала выберите дни…");
    } else {
      btn.textContent = "Править выбранные (" + n + ")";
      btn.setAttribute("data-dg-notify-start", "Открываем правку " + n + " дн.…");
    }

  function saveCellModal() {
    if (!state.editCell) return;

      Number(String((document.getElementById("dg-ws-cell-hours") || {}).value).replace(",", ".")) || 0;
    var typeVal = (document.getElementById("dg-ws-cell-type") || {}).value || "work";

        var d = Number(x.day);
        return {

        };
      });

        "Массовая правка: " +

          rateVal +

      );

                    ": " +

                    "</li>"

              "</ul>";

          showActionLog(
            "Массовая правка · тип «" +
              typeVal +
              "» · ставка " +
              rateVal +
              "<br>Всего: " +
              (j.total || cells.length) +
              " · создано " +
              (j.created || 0) +
              " · обновлено " +
              (j.updated || 0) +

              : "Сохранено дней: " + (j.total || cells.length)

          setBulkMode(false);

  function loadDept() {
    var month = state.filters.month || defaultMonthStr();
    var ids = visibleDeptIdsOrdered();
    if (!ids.length) {
      state.deptBundles = [];
      state.deptMonth = null;
      state.stuck = [];
      state.pendingVacations = [];
      renderDept();
      return Promise.resolve();
    }

    var monthLoads = ids.map(function (id) {
      return api(
        "/dept/month?month=" + encodeURIComponent(month) + "&department_id=" + encodeURIComponent(id)
      ).catch(function (e) {
        return {
          department_id: id,
          department_name: String(id),
          can_edit: false,
          employees: [],
          cells: {},
          today: [],
          vacations: [],
          _error: e.message,
        };
      });
    });
    var stuckLoads = ids.map(function (id) {
      return api("/stuck-shifts?department_id=" + encodeURIComponent(id)).catch(function () {
        return { rows: [] };
      });
    });

    return Promise.all([
      Promise.all(monthLoads),
      Promise.all(stuckLoads),
      api("/vacations/pending").catch(function () {
        return { rows: [] };
      }),
    ]).then(function (arr) {
      state.deptBundles = arr[0] || [];
      state.deptMonth = state.deptBundles[0] || null;
      if (state.deptMonth && state.deptMonth.calendar) state.workCalendar = state.deptMonth.calendar;
      var stuck = [];
      (arr[1] || []).forEach(function (j) {
        (j.rows || []).forEach(function (r) {
          stuck.push(r);
        });
      });
      state.stuck = stuck;
      var pending = arr[2].rows || [];
      var idSet = {};
      ids.forEach(function (x) {
        idSet[Number(x)] = true;
      });
      var hasDept = pending.some(function (v) {
        return v.department_id != null;
      });
      if (hasDept) {
        pending = pending.filter(function (v) {
          return idSet[Number(v.department_id)];
        });
      }
      state.pendingVacations = pending;
      syncMonthUi();
      renderDept();
    });
  }

  function loadSheet() {

  function auditDotClass(a) {

  function parseAuditJson(v) {
    if (v == null || v === "") return null;
    if (typeof v === "object") return v;
    try {
      return JSON.parse(String(v));
    } catch (e) {
      return null;
    }
  }

  function fmtAuditMoney(n) {
    if (n == null || n === "") return null;
    var x = Number(n);
    if (!Number.isFinite(x)) return String(n);
    return money(x);
  }

  /** Старые строки «автопремия · 0» без смысла — не показываем. */
  function isAuditNoiseRow(a) {
    var act = String(a.action || "");
    if (act !== "premium_from_sales_auto" && act !== "premium_from_sales") return false;
    var nv = a.new_value;
    if (nv == null || nv === "" || nv === "0" || nv === "0.0" || nv === "0.00") return true;
    var j = parseAuditJson(nv);
    if (j && typeof j === "object" && j.amount != null && Number(j.amount) === 0 && j.updated == null) {
      return true;
    }
    return false;
  }

  function fmtAuditWhen(v) {
    if (!v) return "—";
    var s = String(v);
    try {
      var d = new Date(s);
      if (Number.isFinite(d.getTime())) {
        var dd = d.getDate();
        var mm = d.getMonth() + 1;
        var yyyy = d.getFullYear();
        var hh = d.getHours();
        var mi = d.getMinutes();
        return (
          (dd < 10 ? "0" + dd : dd) +
          "-" +
          (mm < 10 ? "0" + mm : mm) +
          "-" +
          yyyy +
          " " +
          (hh < 10 ? "0" + hh : hh) +
          ":" +
          (mi < 10 ? "0" + mi : mi)
        );
      }
    } catch (e) {}
    return s.slice(0, 16).replace("T", " ");
  }

  function auditDetailText(a) {
    var parts = [];
    var act = String(a.action || "");
    var j = parseAuditJson(a.new_value);

    if (act === "premium_from_sales_auto" || act === "premium_from_sales_batch") {
      if (j && typeof j === "object") {
        parts.push("обновлено " + (j.updated != null ? j.updated : "—"));
        if (j.skipped != null) parts.push("без изменений " + j.skipped);
        if (j.period_ym) parts.push("период " + j.period_ym);
        if (j.people && j.people.length) {
          var names = j.people
            .slice(0, 8)
            .map(function (p) {
              var amt = fmtAuditMoney(p.amount);
              return (p.name || "?") + (amt ? " " + amt : "");
            })
            .join("; ");
          parts.push(names + (j.people.length > 8 ? "…" : ""));
        }
        return parts.join(" · ");
      }
    }

    if (act === "premium_from_sales" || act === "premium_manual_set" || act === "premium_manual_clear") {
      var emp = (j && j.employee) || a.subject_name;
      if (emp) parts.push(emp);
      if (j && j.department) parts.push("отд. «" + j.department + "»");
      else if (a.subject_department_name) parts.push("отд. «" + a.subject_department_name + "»");
      var amt = j && j.amount != null ? j.amount : a.new_value;
      var was = a.old_value;
      if (act === "premium_manual_clear") {
        parts.push("сброс" + (was != null && was !== "" ? " (было " + fmtAuditMoney(was) + ")" : ""));
      } else {
        var m = fmtAuditMoney(amt);
        if (m) {
          if (was != null && was !== "" && String(was) !== String(amt)) {
            parts.push(fmtAuditMoney(was) + " → " + m);
          } else parts.push(m);
        }
      }
      if (j && j.period_ym) parts.push(j.period_ym);
      return parts.join(" · ");
    }

    if (a.subject_name) parts.push(a.subject_name);
    if (a.subject_department_name) parts.push("отд. «" + a.subject_department_name + "»");
    if (a.subject_work_date) parts.push(fmtDate(a.subject_work_date));

    if (j && typeof j === "object") {
      if (j.type) parts.push("тип: " + j.type);
      if (j.rate != null) parts.push("ставка " + j.rate);
      if (j.hours != null && Number(j.hours) > 0) parts.push("часы " + j.hours);
      if (j.total != null && j.type) {
        parts.push(
          "ячеек " +
            j.total +
            (j.created != null ? ", +" + j.created : "") +
            (j.updated != null ? ", ~" + j.updated : "")
        );
      } else if (j.total != null && !j.type && j.updated == null) {
        /* skip bare total */
      }
    } else if (a.new_value != null && a.new_value !== "" && a.field_name !== "salary") {
      var raw = String(a.new_value);
      if (/^\d+(\.\d+)?$/.test(raw) && (a.field_name === "premium_manual" || /premium|salary/.test(act))) {
        parts.push(fmtAuditMoney(raw));
      } else if (raw.length < 80 && raw !== "0") {
        parts.push(raw);
      }
    }

    if (a.old_value && a.action === "manual_edit") {
      var o = parseAuditJson(a.old_value);
      if (o && o.type != null) parts.push("было: " + o.type + "/" + o.rate);
    }
    if (a.field_name === "salary" && (a.old_value || a.new_value)) {
      parts.push(
        (fmtAuditMoney(a.old_value) || a.old_value || "—") +
          " → " +
          (fmtAuditMoney(a.new_value) || a.new_value || "—")
      );
    }
    return parts.join(" · ");
  }

  function renderAuditJournal() {
    var host = document.getElementById("dg-ws-audit-host");
    var meta = document.getElementById("dg-ws-audit-meta");
    if (!host) return;
    var empQ = String(state.auditEmpQ || "").trim();
    var rows = (state.auditRows || []).filter(function (a) {
      return !isAuditNoiseRow(a);
    });
    if (meta) {
      var bits = [];
      bits.push(rows.length ? "показано " + rows.length : "пусто");
      bits.push("месяц " + (state.filters.month || defaultMonthStr()));
      if (empQ) bits.push("сотрудник «" + empQ + "»");
      meta.textContent = bits.join(" · ");
    }
    if (!rows.length) {
      host.innerHTML = empQ
        ? '<div class="text-muted small">По сотруднику «' + empQ + "» за месяц записей нет</div>"
        : '<div class="text-muted small">За выбранный месяц значимых правок нет</div>';
      return;
    }
    host.innerHTML = rows
      .map(function (a) {
        var who = a.full_name || a.username || ("user #" + (a.user_id || "?"));
        var what = auditActionLabel(a);
        var detail = auditDetailText(a);
        var role =
          a.user_role === "accounting"
            ? "бухгалтерия"
            : a.user_role === "employee"
              ? "сотрудник"
              : a.user_role || "";
        return (
          '<div class="dg-ws-audit-item">' +
          '<span class="dg-ws-audit-dot ' +
          auditDotClass(a) +
          '"></span>' +
          '<div class="dg-ws-audit-body">' +
          '<div class="dg-ws-audit-who">' +
          who +
          ' <span class="fw-normal text-muted">· ' +
          what +
          "</span></div>" +
          (detail ? '<div class="dg-ws-audit-what">' + detail + "</div>" : "") +
          '<div class="dg-ws-audit-when">' +
          fmtAuditWhen(a.created_at) +
          (role ? " · " + role : "") +
          "</div>" +
          "</div></div>"
        );
      })
      .join("");
  }

  function loadAuditJournal() {
    var card = document.getElementById("dg-ws-audit-card");
    if (!(state.access && state.access.is_accounting)) {
      if (card) card.classList.add("d-none");
      return Promise.resolve();
    }
    if (card) card.classList.remove("d-none");
    var month = state.filters.month || defaultMonthStr();
    var host = document.getElementById("dg-ws-audit-host");
    var empEl = document.getElementById("dg-ws-audit-emp");
    if (empEl && empEl.value !== state.auditEmpQ) {
      // не затираем черновик ввода — только синхронизируем, если пустой applied
      if (!String(empEl.value || "").trim() && state.auditEmpQ) empEl.value = state.auditEmpQ;
    }
    if (host) host.innerHTML = '<div class="text-muted small">Загрузка…</div>';
    var q =
      "/audit?scope=edits&limit=100&month=" + encodeURIComponent(month);
    if (state.auditEmpQ) q += "&employee_q=" + encodeURIComponent(state.auditEmpQ);
    return api(q)
      .then(function (j) {
        state.auditRows = j.rows || [];
        renderAuditJournal();
      })
      .catch(function (e) {
        if (host) host.innerHTML = '<div class="text-danger small">' + (e.message || "Ошибка журнала") + "</div>";
      });
  }

        "; пропуск: " +
        (j.skipped != null ? j.skipped : "—") +
        (j.failed ? "; ошибок: " + j.failed : "") +
        (j.duration_sec != null ? "; " + j.duration_sec + " с" : "") +
        (j.errors && j.errors.length
          ? "<ul class=\"mb-0 mt-1\">" +
            j.errors
              .slice(0, 10)
              .map(function (e) {
                return (
                  "<li>" +
                  (e.work_date || "") +
                  (e.employee_id ? " emp " + e.employee_id : "") +
                  ": " +
                  (e.error || "") +
                  "</li>"
                );
              })
              .join("") +
            "</ul>"
          : "")
      );
    }

    var bitcopBtn = document.getElementById("dg-ws-btn-bitcop");
    if (bitcopBtn) {
      bitcopBtn.addEventListener("click", function () {
        var month = state.filters.month || defaultMonthStr();
        var body = { period_ym: month, dry_run: 1 };
        if (state.filters.orgId) body.organization_id = state.filters.orgId;
        if (state.filters.deptId) body.department_id = state.filters.deptId;
        showActionLog("Bitcop: пробный прогон за " + formatMonthRu(month) + "…");
        var run = function () {
          return api("/bitcop/sync-hours", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          }).then(function (j) {
            state._bitcopPreview = j;
            showActionLog(formatBitcopLog(j, "Пробный прогон Bitcop"));
            var tx = document.getElementById("dg-ws-bitcop-confirm-text");
            if (tx) {
              tx.textContent =
                "Записать часы из Bitcop за " +
                formatMonthRu(month) +
                " (метрика «" +
                (j.metric || "productiveTime") +
                "»). К записи: " +
                ((j.created || 0) + (j.updated || 0)) +
                " яч., пропуск " +
                (j.skipped || 0) +
                ". Отпуск/больничный не затираются.";
            }
            var prev = document.getElementById("dg-ws-bitcop-preview");
            if (prev) {
              prev.textContent = j.message || "";
            }
            showBitcopOverlay(true);
            toast("success", "Пробный прогон Bitcop готов");
          });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun) {
          window.DatagonNotify.busyRun(bitcopBtn, run);
        } else {
          run().catch(function (e) {
            toast("danger", e.message);
            showActionLog("Bitcop ошибка: " + e.message);
          });
        }
      });
    }
    var bitcopOk = document.getElementById("dg-ws-bitcop-ok");
    if (bitcopOk) {
      bitcopOk.addEventListener("click", function () {
        var month = state.filters.month || defaultMonthStr();
        var body = { period_ym: month, dry_run: 0 };
        if (state.filters.orgId) body.organization_id = state.filters.orgId;
        if (state.filters.deptId) body.department_id = state.filters.deptId;
        var run = function () {
          return api("/bitcop/sync-hours", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          }).then(function (j) {
            showBitcopOverlay(false);
            showActionLog(formatBitcopLog(j, "Записано из Bitcop"));
            toast(j.failed ? "warning" : "success", j.message || "Часы записаны");
            return loadSheet();
          });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun) {
          window.DatagonNotify.busyRun(bitcopOk, run);
        } else {
          run().catch(function (e) {
            toast("danger", e.message);
          });
        }
      });
    }
    document.querySelectorAll("[data-dg-ws-bitcop-close]").forEach(function (el) {
      el.addEventListener("click", function () {
        showBitcopOverlay(false);
      });
    });

    var exportBtn = document.getElementById("dg-ws-btn-export");
    if (exportBtn) {
      exportBtn.addEventListener("click", function () {
        var month = state.filters.month || defaultMonthStr();
        window.location.href = API + "/export/1c?format=csv&month=" + encodeURIComponent(month);
        showActionLog("Экспорт 1С CSV за " + month);
      });
    }
    var dry = document.getElementById("dg-ws-btn-dryrun");
    if (dry) {
      dry.addEventListener("click", function () {
        var month = state.filters.month || defaultMonthStr();
        var run = function () {
          return api("/payroll/dry-run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ month: month }),
          }).then(function (j) {
            var n = (j.rows || []).length;
            var sum = (j.rows || []).reduce(function (a, r) {
              return a + (Number(r.total) || 0);
            }, 0);
            showActionLog(
              "<strong>Dry-run " +
                month +
                "</strong><br>Сотрудников: " +
                n +
                "; сумма: " +
                money(sum) +
                '<br><button type="button" class="btn btn-sm btn-primary mt-2" id="dg-ws-btn-apply-payroll" data-dg-notify-start="Подтверждение…">Применить начисления</button>'
            );
            toast("success", "Предпросмотр готов");
            var ap = document.getElementById("dg-ws-btn-apply-payroll");
            if (ap) {
              ap.addEventListener("click", function () {
                var ov = document.getElementById("dg-ws-payroll-overlay");
                var tx = document.getElementById("dg-ws-payroll-confirm-text");
                if (tx) tx.textContent = "Записать начисления за " + month + " в БД (" + n + " сотр., " + money(sum) + ")?";
                if (ov) {
                  ov.style.display = "flex";
                  ov.setAttribute("aria-hidden", "false");
                }
                state._payrollMonth = month;
              });
            }
          });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(dry, run);
        else
          run().catch(function (e) {
            toast("danger", e.message);
          });
      });
    }
    var auditApply = document.getElementById("dg-ws-btn-audit-apply");
    if (auditApply) {
      auditApply.addEventListener("click", function () {
        var run = function () {
          return commitAuditEmpFilter();
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun) {
          window.DatagonNotify.busyRun(auditApply, run);
        } else {
          run().catch(function (e) {
            toast("danger", e.message);
          });
        }
      });
    }
    var auditEmp = document.getElementById("dg-ws-audit-emp");
    if (auditEmp) {
      auditEmp.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") {
          ev.preventDefault();
          if (auditApply) auditApply.click();
          else commitAuditEmpFilter();
        }
        if (ev.key === "Escape") {
          ev.preventDefault();
          auditEmp.value = "";
          state.auditEmpQ = "";
          loadAuditJournal();
        }
      });
      auditEmp.addEventListener("search", function () {
        if (!auditEmp.value) {
          state.auditEmpQ = "";
          loadAuditJournal();
        }
      });
    }
    var auditRefresh = document.getElementById("dg-ws-btn-audit-refresh");
    if (auditRefresh) {
      auditRefresh.addEventListener("click", function () {
        var run = function () {
          return commitAuditEmpFilter();
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun) {
          window.DatagonNotify.busyRun(auditRefresh, run);
        } else {
          run().catch(function (e) {
            toast("danger", e.message);
          });
        }
      });
    }

    document.querySelectorAll("[data-dg-ws-payroll-close]").forEach(function (el) {
      el.addEventListener("click", function () {
        var ov = document.getElementById("dg-ws-payroll-overlay");
        if (ov) {
          ov.style.display = "none";
          ov.setAttribute("aria-hidden", "true");
        }
      });
    });
    var payOk = document.getElementById("dg-ws-payroll-apply-ok");
    if (payOk) {
      payOk.addEventListener("click", function () {
        var month = state._payrollMonth || state.filters.month || defaultMonthStr();
        var ov = document.getElementById("dg-ws-payroll-overlay");
        var run = function () {
          return api("/payroll/apply", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ month: month }),
          }).then(function (r) {
            if (ov) {
              ov.style.display = "none";
              ov.setAttribute("aria-hidden", "true");
            }
            toast("success", "Начисления применены: " + (r.rows || []).length);
            showActionLog("Apply " + month + ": " + (r.rows || []).length + " записей");
          });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(payOk, run);
        else
          run().catch(function (e) {
            toast("danger", e.message);
          });
      });
    }

    if (window.DatagonWorkClock && window.DatagonWorkClock.subscribe) {
      window.DatagonWorkClock.subscribe(syncClockMirror);
      window.DatagonWorkClock.refresh();
    }
  }

  function init() {
    state.filters.month = defaultMonthStr();
    state.pending.month = state.filters.month;
    syncMonthUi();
    bind();
    api("/access")
      .then(function (acc) {
        state.access = acc;
        var loads = [];
        if (acc.visible_departments && acc.visible_departments.length) {
          state.departments = acc.visible_departments;
        }
        if (acc.is_accounting) {
          loads.push(
            api("/organizations").then(function (j) {
              state.orgs = j.rows || [];
            })
          );
          loads.push(
            api("/departments").then(function (j) {
              state.departments = j.rows || [];
            })
          );
        } else if (!state.departments.length && acc.employee) {
          state.departments = [
            {
              id: acc.employee.department_id,
              name: acc.employee.department_name,
              schedule_type: "",
              can_edit: !!acc.is_dept_head,
              is_own: true,
            },
          ];
          loads.push(
            api("/departments")
              .then(function (j) {
                if (j.rows && j.rows.length) state.departments = j.rows;
              })
              .catch(function () {})
          );
        }
        return Promise.all(loads);
      })
      .then(function () {
        fillFilterSelects();
        var tab = "me";
        try {
          var qTab = new URLSearchParams(window.location.search).get("tab");
          if (TAB_HINTS[qTab]) tab = qTab;
          else {
            var saved = sessionStorage.getItem(TAB_KEY);
            if (TAB_HINTS[saved]) tab = saved;
          }
        } catch (e) {}
        if (
          tab !== "dept" &&
          tab !== "me" &&
          state.access &&
          state.access.is_accounting &&
          !state.access.is_employee
        ) {
          tab = "sheet";
        }
        setTab(tab);
      })
      .catch(function (e) {
        toast("danger", e.message || "Ошибка доступа");
        setTab("me");
      });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
