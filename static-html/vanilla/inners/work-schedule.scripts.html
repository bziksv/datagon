<script>
(function () {
  "use strict";

  var TAB_KEY = "datagon_ws_tab_v1";
  var API = "/api/work-schedule";

  var TAB_HINTS = {
    me: "Личный табель, заработок и заявки на отпуск",
    dept: "График отдела, зависшие смены и согласование отпусков",
    sheet: "Табель бухгалтерии: сотрудники × дни",
  };

  var state = {
    access: null,
    tab: "me",
    calMode: "mine",
    earnPeriod: "month",
    filters: { orgId: 0, deptId: 0, month: "", search: "" },
    pending: { orgId: 0, deptId: 0, month: "", search: "" },
    orgs: [],
    departments: [],
    meMonth: null,
    deptMonth: null,
    sheet: null,
    pendingVacations: [],
    stuck: [],
    editCell: null,
    editPremium: null,
  };

  function money(n) {
    if (window.DatagonFmt && window.DatagonFmt.formatMoney) return window.DatagonFmt.formatMoney(n);
    return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽";
  }

  /** Вывод пользователю: дд-мм-гггг (не сырой YYYY-MM-DD). */
  function fmtDate(v) {
    if (!v) return "—";
    if (window.DatagonFmt && window.DatagonFmt.formatDate) {
      var fd = window.DatagonFmt.formatDate(v);
      if (fd && fd !== "—" && !/^\d{4}-\d{2}-\d{2}$/.test(fd)) return fd;
    }
    var s = String(v).trim();
    if (/T/.test(s)) {
      try {
        var dIso = new Date(s);
        if (Number.isFinite(dIso.getTime())) {
          var uy = dIso.getUTCFullYear();
          var um = dIso.getUTCMonth() + 1;
          var ud = dIso.getUTCDate();
          return (
            (ud < 10 ? "0" + ud : ud) +
            "-" +
            (um < 10 ? "0" + um : um) +
            "-" +
            uy
          );
        }
      } catch (e1) {}
    }
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[3] + "-" + m[2] + "-" + m[1];
    var rm = s.match(/^(\d{2})[.\-/](\d{2})[.\-/](\d{4})$/);
    if (rm) return rm[1] + "-" + rm[2] + "-" + rm[3];
    return "—";
  }

  function toast(type, message) {
    if (window.DatagonNotify && window.DatagonNotify.toast) {
      window.DatagonNotify.toast({ type: type, message: message });
    }
  }

  function api(path, opts) {
    return fetch(API + path, Object.assign({ credentials: "same-origin" }, opts || {})).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || (j && j.success === false)) {
          throw new Error((j && j.error) || "HTTP " + r.status);
        }
        return j;
      });
    });
  }

  function daysInMonth(y, m) {
    return new Date(y, m, 0).getDate();
  }

  var WD_SHORT = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];

  /** Шапка колонки дня: «9» + «пт»; выходные — класс weekend. */
  function dayColHeaderHtml(y, m, day) {
    var wd = new Date(y, m - 1, day).getDay();
    var weekend = wd === 0 || wd === 6;
    return (
      '<th class="dg-ws-day-h' +
      (weekend ? " weekend" : "") +
      '" title="' +
      day +
      " · " +
      WD_SHORT[wd] +
      '"><span class="dg-ws-day-n">' +
      day +
      '</span><span class="dg-ws-day-wd">' +
      WD_SHORT[wd] +
      "</span></th>"
    );
  }

  function parseMonthValue(v) {
    var p = String(v || "").split("-");
    return {
      y: Number(p[0]) || new Date().getFullYear(),
      m: Number(p[1]) || new Date().getMonth() + 1,
    };
  }

  function defaultMonthStr() {
    var d = new Date();
    var m = d.getMonth() + 1;
    return d.getFullYear() + "-" + (m < 10 ? "0" + m : m);
  }

  var MONTH_RU = [
    "январь",
    "февраль",
    "март",
    "апрель",
    "май",
    "июнь",
    "июль",
    "август",
    "сентябрь",
    "октябрь",
    "ноябрь",
    "декабрь",
  ];

  function formatMonthRu(ym) {
    var pm = parseMonthValue(ym);
    var name = MONTH_RU[pm.m - 1] || "";
    return name + " " + pm.y;
  }

  function monthStrFromParts(y, m) {
    return y + "-" + (m < 10 ? "0" + m : m);
  }

  function shiftMonthStr(ym, delta) {
    var pm = parseMonthValue(ym);
    var d = new Date(pm.y, pm.m - 1 + delta, 1);
    return monthStrFromParts(d.getFullYear(), d.getMonth() + 1);
  }

  function syncMonthUi() {
    var ym = state.filters.month || defaultMonthStr();
    var label = formatMonthRu(ym);
    ["dg-ws-cal-month-title", "dg-ws-dept-month-title", "dg-ws-earn-period"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.textContent = label;
    });
    var pick = document.getElementById("dg-ws-month-pick");
    if (pick && pick.value !== ym) pick.value = ym;
    var sheetMonth = document.getElementById("dg-ws-f-month");
    if (sheetMonth && sheetMonth.value !== ym) sheetMonth.value = ym;
    state.pending.month = ym;
  }

  function setMonth(ym, opts) {
    var next = String(ym || "").trim() || defaultMonthStr();
    if (!/^\d{4}-\d{2}$/.test(next)) next = defaultMonthStr();
    state.filters.month = next;
    state.pending.month = next;
    syncMonthUi();
    if (opts && opts.reload === false) return;
    if (state.tab === "me") loadMe();
    else if (state.tab === "dept") loadDept();
    else if (state.tab === "sheet") loadSheet();
  }

  function shiftMonth(delta) {
    setMonth(shiftMonthStr(state.filters.month || defaultMonthStr(), delta));
  }

  function vacStatusBadge(st) {
    if (st === "approved") return '<span class="badge bg-success">согласовано</span>';
    if (st === "rejected") return '<span class="badge bg-danger">отклонено</span>';
    return '<span class="badge bg-warning text-dark">заявка</span>';
  }

  function setTab(tab) {
    if (!TAB_HINTS[tab]) tab = "me";
    var acc = state.access || {};
    if (tab === "sheet" && !acc.is_accounting) tab = acc.is_employee ? "me" : "dept";
    state.tab = tab;
    try {
      sessionStorage.setItem(TAB_KEY, tab);
    } catch (e) {}
    ["me", "dept", "sheet"].forEach(function (t) {
      var btn = document.getElementById("dg-ws-tab-" + t);
      if (btn) {
        btn.classList.toggle("active", t === tab);
        btn.setAttribute("aria-selected", t === tab ? "true" : "false");
        if (t === "sheet" && !acc.is_accounting) btn.classList.add("d-none");
        else if (t === "sheet") btn.classList.remove("d-none");
      }
      var view = document.getElementById("dg-ws-view-" + t);
      if (view) view.classList.toggle("d-none", t !== tab);
    });
    var hint = document.getElementById("dg-ws-tab-hint");
    if (hint) hint.textContent = TAB_HINTS[tab];
    if (tab === "me") loadMe();
    if (tab === "dept") loadDept();
    if (tab === "sheet") loadSheet();
  }

  function renderLegend(el, withBusy) {
    if (!el) return;
    el.innerHTML =
      '<span><i class="swatch" style="background:#28a745"></i> полный</span>' +
      '<span><i class="swatch" style="background:#ffc107"></i> 0,5</span>' +
      '<span><i class="swatch" style="background:#e3f2fd"></i> отпуск</span>' +
      '<span><i class="swatch" style="background:#fce4ec"></i> больничный</span>' +
      '<span><i class="swatch dg-ws-swatch-open"></i> на работе (таймер)</span>' +
      (withBusy
        ? '<span><i class="swatch" style="background:#ffebee"></i> занято в отделе</span>'
        : "");
  }

  /** Длительность из дробных часов → ЧЧ:ММ (час = 60 мин). */
  function fmtHours(h) {
    var n = Number(h);
    if (!Number.isFinite(n) || n <= 0) return "00:00";
    var totalMin = Math.round(n * 60);
    if (totalMin < 1) return "<1 мин";
    var hh = Math.floor(totalMin / 60);
    var mm = totalMin % 60;
    return (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
  }

  function renderEarnings() {
    var p = state.meMonth && state.meMonth.payroll;
    syncMonthUi();
    var grid = document.getElementById("dg-ws-earn-grid");
    if (!grid) return;
    if (!(state.access && state.access.is_employee)) {
      grid.innerHTML = '<div class="text-muted small">Нет карточки сотрудника — попросите бухгалтерию привязать вас в настройках графика</div>';
      return;
    }
    if (!state.meMonth) {
      grid.innerHTML = '<div class="text-muted small">Не удалось загрузить данные за месяц</div>';
      return;
    }
    if (!p) {
      grid.innerHTML = '<div class="text-muted small">Нет расчёта за этот месяц</div>';
      return;
    }
    var hoursM = state.meMonth.hours_month != null ? state.meMonth.hours_month : 0;
    var salaryRate = p.salary_rate != null ? p.salary_rate : null;
    var senFull = p.seniority_full != null ? p.seniority_full : null;
    var okladVal =
      money(p.base_salary) +
      (salaryRate != null
        ? '<span class="dg-ws-earn-sub">ставка ' + money(salaryRate) + "</span>"
        : "");
    var senVal =
      money(p.seniority_bonus) +
      (senFull != null && Number(senFull) > 0
        ? '<span class="dg-ws-earn-sub">полная ' + money(senFull) + "</span>"
        : "");
    var rows = [
      ["Часы за месяц", fmtHours(hoursM), false, true, false],
      [
        "Смены (ставки)",
        (p.worked_days != null ? p.worked_days : "—") + " / " + (p.norm_days != null ? p.norm_days : "—"),
        false,
        true,
        false,
      ],
      ["Оклад", okladVal, false, true, true],
      ["Премия (доплата)", p.premium, false, false, false],
      ["Доплата за стаж", senVal, false, true, false],
      ["Отпускные", p.vacation_pay, false, false, false],
      ["Больничные", p.sick_pay, false, false, false],
      ["Итого к выплате", p.total, true, false, false],
    ];
    grid.innerHTML = rows
      .map(function (r) {
        var tag = r[4] ? "button" : "div";
        var extra = r[4]
          ? ' type="button" class="dg-ws-earn-chip dg-ws-earn-salary" data-dg-ws-salary-hist="1" data-dg-notify-start="Загружаем историю оклада…" title="История изменений оклада"'
          : ' class="dg-ws-earn-chip' + (r[2] ? " total" : "") + '"';
        var valHtml = r[3] ? String(r[1]) : money(r[1]);
        return (
          "<" +
          tag +
          extra +
          '><span class="lbl">' +
          r[0] +
          '</span><span class="val">' +
          valHtml +
          "</span></" +
          tag +
          ">"
        );
      })
      .join("");
  }

  function fmtAuditWhen(v) {
    if (!v) return "—";
    try {
      var d = new Date(v);
      if (!Number.isFinite(d.getTime())) return String(v);
      var dd = d.getDate();
      var mm = d.getMonth() + 1;
      var yyyy = d.getFullYear();
      var hh = d.getHours();
      var mi = d.getMinutes();
      return (
        (dd < 10 ? "0" : "") +
        dd +
        "-" +
        (mm < 10 ? "0" : "") +
        mm +
        "-" +
        yyyy +
        " " +
        (hh < 10 ? "0" : "") +
        hh +
        ":" +
        (mi < 10 ? "0" : "") +
        mi
      );
    } catch (e) {
      return String(v);
    }
  }

  function closeSalaryHistModal() {
    var ov = document.getElementById("dg-ws-salary-hist-overlay");
    if (!ov) return;
    ov.style.display = "none";
    ov.setAttribute("aria-hidden", "true");
  }

  function openSalaryHistModal() {
    var empId =
      (state.meMonth && state.meMonth.employee && state.meMonth.employee.id) ||
      (state.access && state.access.employee && state.access.employee.id);
    if (!empId) {
      toast("warning", "Нет карточки сотрудника");
      return;
    }
    var ov = document.getElementById("dg-ws-salary-hist-overlay");
    var title = document.getElementById("dg-ws-salary-hist-title");
    var meta = document.getElementById("dg-ws-salary-hist-meta");
    var tb = document.getElementById("dg-ws-salary-hist-tbody");
    if (!ov) return;
    if (title) title.textContent = "История оклада";
    if (meta) meta.textContent = "Загрузка…";
    if (tb) tb.innerHTML = '<tr><td colspan="4" class="text-muted">Загрузка…</td></tr>';
    ov.style.display = "flex";
    ov.setAttribute("aria-hidden", "false");
    api("/employees/" + empId + "/salary-history")
      .then(function (j) {
        var emp = j.employee || {};
        if (title) title.textContent = "История оклада · " + (emp.full_name || "");
        if (meta) meta.textContent = "Текущий оклад: " + money(emp.salary) + " · кто менял и когда";
        var rows = j.rows || [];
        if (!tb) return;
        if (!rows.length) {
          tb.innerHTML =
            '<tr><td colspan="4" class="text-muted">Пока нет записей об изменении оклада</td></tr>';
          return;
        }
        tb.innerHTML = rows
          .map(function (r) {
            var who = r.full_name || r.username || (r.user_id ? "#" + r.user_id : "—");
            var was = r.old_value != null && r.old_value !== "" ? money(Number(r.old_value) || 0) : "—";
            var became = r.new_value != null && r.new_value !== "" ? money(Number(r.new_value) || 0) : "—";
            return (
              "<tr><td>" +
              fmtAuditWhen(r.created_at) +
              "</td><td>" +
              who +
              "</td><td>" +
              was +
              "</td><td>" +
              became +
              "</td></tr>"
            );
          })
          .join("");
      })
      .catch(function (e) {
        if (meta) meta.textContent = e.message || "Ошибка";
        if (tb) tb.innerHTML = '<tr><td colspan="4" class="text-danger">' + (e.message || "Ошибка") + "</td></tr>";
        toast("danger", e.message || "Не удалось загрузить историю оклада");
      });
  }

  function renderMyVacations() {
    var tb = document.getElementById("dg-ws-my-vacations");
    if (!tb) return;
    var list = (state.meMonth && state.meMonth.vacations) || [];
    if (!list.length) {
      tb.innerHTML = '<tr><td colspan="3" class="text-muted">Заявок нет</td></tr>';
      return;
    }
    tb.innerHTML = list
      .map(function (v) {
        return (
          "<tr><td>" +
          fmtDate(v.date_from) +
          " — " +
          fmtDate(v.date_to) +
          "</td><td>" +
          v.days_count +
          "</td><td>" +
          vacStatusBadge(v.status) +
          "</td></tr>"
        );
      })
      .join("");
  }

  function busyDaysFromVacations(vacations, monthStr) {
    var pm = parseMonthValue(monthStr);
    var dim = daysInMonth(pm.y, pm.m);
    var set = {};
    (vacations || []).forEach(function (v) {
      if (v.status !== "approved" && v.status !== "pending") return;
      var cur = new Date(v.date_from);
      var end = new Date(v.date_to);
      while (cur <= end) {
        if (cur.getFullYear() === pm.y && cur.getMonth() + 1 === pm.m) {
          set[cur.getDate()] = true;
        }
        cur.setDate(cur.getDate() + 1);
      }
    });
    var out = [];
    for (var d = 1; d <= dim; d++) if (set[d]) out.push(d);
    return out;
  }

  function renderCalendar() {
    var host = document.getElementById("dg-ws-cal-host");
    if (!host) return;
    syncMonthUi();
    renderLegend(document.getElementById("dg-ws-cal-legend"), state.calMode === "free");
    var monthStr = state.filters.month || defaultMonthStr();
    var hint = document.getElementById("dg-ws-cal-hint");
    if (hint) {
      hint.textContent =
        formatMonthRu(monthStr) +
        ". " +
        (state.calMode === "free"
          ? "Красная подсветка — в отделе уже кто-то в отпуске (пересечения ограничены)."
          : "Стрелки ‹ › или поле месяца сверху — сменить месяц. Отпуск — даты в блоке ниже (любой месяц).");
    }
    var pm = parseMonthValue(monthStr);
    var dim = daysInMonth(pm.y, pm.m);
    var firstWd = new Date(pm.y, pm.m - 1, 1).getDay();
    var startPad = (firstWd + 6) % 7;
    var cells = (state.meMonth && state.meMonth.cells) || {};
    var busy = busyDaysFromVacations(
      (state.deptMonth && state.deptMonth.vacations) || [],
      monthStr
    );
    var hoursMonth = 0;
    var daysWorked = 0;
    Object.keys(cells).forEach(function (k) {
      var c = cells[k];
      if (!c) return;
      var h = Number(c.hours) || 0;
      if (h > 0 || c.logged || c.closed || c.open) {
        hoursMonth += h;
        daysWorked += 1;
      }
    });
    hoursMonth = Math.round(hoursMonth * 100) / 100;

    var html = "";
    if (state.calMode === "mine") {
      html +=
        '<div class="dg-ws-cal-summary mb-2">' +
        "<strong>Отработано за месяц:</strong> " +
        fmtHours(hoursMonth) +
        (daysWorked ? " · дней с отметкой: " + daysWorked : "") +
        "</div>";
    }
    html += '<div class="dg-ws-cal-grid">';
    ["пн", "вт", "ср", "чт", "пт", "сб", "вс"].forEach(function (h) {
      html += '<div class="dg-ws-cal-head">' + h + "</div>";
    });
    for (var i = 0; i < startPad; i++) html += '<div class="dg-ws-cal-cell muted"></div>';
    var today = new Date();
    for (var d = 1; d <= dim; d++) {
      var cell = cells[d] || { rate: 0, type: "work", hours: 0 };
      var wd = new Date(pm.y, pm.m - 1, d).getDay();
      var weekend = wd === 0 || wd === 6;
      var cls = ["dg-ws-cal-cell"];
      if (weekend) cls.push("muted");
      var hasHours = Number(cell.hours) > 0 || cell.open || cell.closed || cell.logged;
      if (cell.type === "vacation") cls.push("type-vacation");
      else if (cell.type === "sick") cls.push("type-sick");
      else if (Number(cell.rate) === 1) cls.push("rate-1");
      else if (Number(cell.rate) === 0.5) cls.push("rate-05");
      else if (hasHours) cls.push("has-hours");
      else cls.push("rate-0");
      if (state.calMode === "free" && busy.indexOf(d) >= 0) cls.push("type-busy");
      if (pm.y === today.getFullYear() && pm.m === today.getMonth() + 1 && d === today.getDate()) cls.push("today");
      var ymd =
        pm.y +
        "-" +
        (pm.m < 10 ? "0" + pm.m : pm.m) +
        "-" +
        (d < 10 ? "0" + d : d);
      if (state.calMode === "mine") cls.push("clickable");
      var body = "";
      if (state.calMode === "mine") {
        var hoursLabel = "";
        if (cell.type === "vacation") hoursLabel = '<span class="dg-ws-cal-hours">отпуск</span>';
        else if (cell.type === "sick") hoursLabel = '<span class="dg-ws-cal-hours">больн.</span>';
        else if (hasHours) {
          if (cell.open) {
            hoursLabel =
              '<span class="dg-ws-cal-hours open">' +
              (Number(cell.hours) > 0 ? fmtHours(cell.hours) + " · идёт" : "идёт…") +
              "</span>";
          } else if (Number(cell.hours) > 0) {
            hoursLabel =
              '<span class="dg-ws-cal-hours">' +
              fmtHours(cell.hours) +
              "</span>" +
              '<span class="dg-ws-cal-rate">ставка ' +
              cell.rate +
              "</span>";
          } else {
            hoursLabel = '<span class="dg-ws-cal-hours muted-hrs">&lt;5 мин</span>';
          }
        } else {
          hoursLabel = '<span class="dg-ws-cal-empty">—</span>';
        }
        body = '<div class="day-num">' + d + "</div>" + hoursLabel;
      } else {
        body = '<div class="day-num">' + d + "</div>" + (busy.indexOf(d) >= 0 ? "занято" : "свободно");
      }
      html +=
        '<div class="' +
        cls.join(" ") +
        '"' +
        (state.calMode === "mine" ? ' data-dg-ws-day="' + ymd + '" title="Открыть детали дня"' : "") +
        ">" +
        body +
        "</div>";
    }
    html += "</div>";
    host.innerHTML = html;
  }

  function fmtDateTimeRu(sql) {
    if (!sql) return "—";
    var s = String(sql).replace("T", " ").slice(0, 19);
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})[ ](\d{2}):(\d{2})(?::(\d{2}))?/);
    if (!m) return s;
    return m[3] + "-" + m[2] + "-" + m[1] + " " + m[4] + ":" + m[5] + (m[6] ? ":" + m[6] : "");
  }

  function cleanIp(ip) {
    if (!ip) return "—";
    return String(ip).replace(/^::ffff:/i, "");
  }

  function closeDayModal() {
    var ov = document.getElementById("dg-ws-day-overlay");
    if (!ov) return;
    ov.style.display = "none";
    ov.setAttribute("aria-hidden", "true");
  }

  function openDayModal(ymd) {
    var ov = document.getElementById("dg-ws-day-overlay");
    var title = document.getElementById("dg-ws-day-title");
    var summary = document.getElementById("dg-ws-day-summary");
    var tb = document.getElementById("dg-ws-day-segments");
    if (!ov || !tb) return;
    if (title) title.textContent = "День " + fmtDate(ymd);
    if (summary) summary.textContent = "Загрузка…";
    tb.innerHTML = '<tr><td colspan="7" class="text-muted">Загрузка…</td></tr>';
    ov.style.display = "flex";
    ov.setAttribute("aria-hidden", "false");
    api("/me/day?date=" + encodeURIComponent(ymd))
      .then(function (j) {
        var segs = (j.segments || []).slice();
        if (j.open) segs.push(j.open);
        var n = segs.length;
        if (summary) {
          summary.textContent =
            (j.found
              ? "Сегментов: " + n + " · всего " + fmtHours(j.hours_worked) + " · ставка " + (j.rate != null ? j.rate : "—")
              : "Отметок за этот день нет") +
            (j.status ? " · статус: " + j.status : "");
        }
        if (!n) {
          tb.innerHTML = '<tr><td colspan="7" class="text-muted">Нет запусков / остановок</td></tr>';
          return;
        }
        tb.innerHTML = segs
          .map(function (s, i) {
            var open = !!s.open;
            return (
              "<tr>" +
              "<td>" +
              (i + 1) +
              "</td>" +
              "<td>" +
              fmtDateTimeRu(s.in) +
              "</td>" +
              "<td>" +
              (open ? '<span class="text-primary fw-semibold">идёт…</span>' : fmtDateTimeRu(s.out)) +
              "</td>" +
              "<td>" +
              fmtHours(s.hours) +
              "</td>" +
              '<td class="ip">' +
              cleanIp(s.ip_in) +
              "</td>" +
              '<td class="ip">' +
              (open ? "—" : cleanIp(s.ip_out)) +
              "</td>" +
              "<td>" +
              (s.device_in || s.device_out
                ? [s.device_in, open ? "" : s.device_out].filter(Boolean).join(" → ")
                : "—") +
              "</td>" +
              "</tr>"
            );
          })
          .join("");
      })
      .catch(function (e) {
        if (summary) summary.textContent = e.message || "Ошибка загрузки";
        tb.innerHTML = '<tr><td colspan="7" class="text-danger">Не удалось загрузить</td></tr>';
      });
  }

  function cellLabel(c) {
    if (!c) return { cls: "c-0", label: "" };
    var cls;
    var label;
    if (c.type === "vacation") {
      cls = "c-v";
      label = "О";
    } else if (c.type === "sick") {
      cls = "c-s";
      label = "Б";
    } else if (Number(c.rate) === 1) {
      cls = "c-1";
      label = "1";
    } else if (Number(c.rate) === 0.5) {
      cls = "c-05";
      label = "½";
    } else {
      cls = "c-0";
      label = c.open ? "▶" : "0";
    }
    if (c.open) cls += " c-open";
    return { cls: cls, label: label };
  }

  function renderDeptMatrix() {
    var host = document.getElementById("dg-ws-dept-sheet-host");
    if (!host) return;
    renderLegend(document.getElementById("dg-ws-dept-legend"), false);

    html += "</tr></thead><tbody>";
    (dm.employees || []).forEach(function (e) {
      html += '<tr><td class="emp">' + (e.full_name || "") + "</td>";

    if (st === "finished") return '<span class="badge bg-secondary">закончил</span>';
    if (st === "vacation") return '<span class="badge bg-info text-dark">отпуск</span>';
    if (st === "sick") return '<span class="badge bg-warning text-dark">больничный</span>';
    return '<span class="text-muted">не начинал</span>';

  function sheetEmpMatchesSearch(e, q) {
    var s = String(q || "")
      .trim()
      .toLowerCase()
      .replace(/ё/g, "е")
      .replace(/\s+/g, " ");
    if (!s) return true;
    var hay = [e.full_name, e.department_name, e.salary, e.salary_accrued, e.premium_accrued]
      .map(function (x) {
        return x == null ? "" : String(x);
      })
      .join(" ")
      .toLowerCase()
      .replace(/ё/g, "е")
      .replace(/\s+/g, " ");
    return s.split(" ").every(function (tok) {
      return tok && hay.indexOf(tok) !== -1;
    });
  }

  function syncSheetFilterDirty() {
    var btn = document.getElementById("dg-ws-f-apply");
    if (!btn) return;
    var dirty =
      Number(state.pending.orgId || 0) !== Number(state.filters.orgId || 0) ||
      Number(state.pending.deptId || 0) !== Number(state.filters.deptId || 0) ||
      String(state.pending.month || "") !== String(state.filters.month || "") ||
      String(state.pending.search || "") !== String(state.filters.search || "");
    btn.classList.toggle("dg-flt-dirty", dirty);
    btn.textContent = dirty ? "Применить •" : "Применить";
  }

  function renderSheet() {
    renderLegend(document.getElementById("dg-ws-sheet-legend"), false);
    var sh = state.sheet;
    var month = state.filters.month || defaultMonthStr();
    var pm = parseMonthValue(month);
    var dim = daysInMonth(pm.y, pm.m);
    var q = state.filters.search || "";
    var emps = (sh && sh.employees) || [];
    var filtered = emps.filter(function (e) {
      return sheetEmpMatchesSearch(e, q);
    });
    var elMd = document.getElementById("dg-ws-kpi-mandays");
    var elFot = document.getElementById("dg-ws-kpi-fot");
    var elEm = document.getElementById("dg-ws-kpi-emps");
    if (sh && sh.kpi) {
      if (elMd) elMd.textContent = String(sh.kpi.mandays);
      if (elFot) elFot.textContent = money(sh.kpi.fot);
      if (elEm) {
        elEm.textContent = q
          ? String(filtered.length) + " / " + String(sh.kpi.count)
          : String(sh.kpi.count);
      }
    }
    var host = document.getElementById("dg-ws-sheet-host");
    if (!host) return;
    if (!sh) {
      host.innerHTML = '<div class="text-muted p-3">Загрузка…</div>';
      return;
    }
    if (!filtered.length) {
      host.innerHTML =
        '<div class="text-muted p-3">' +
        (q ? "Никого не найдено по запросу «" + q + "»" : "Нет сотрудников") +
        "</div>";
      return;
    }
    var html =
      '<table class="dg-ws-sheet"><thead><tr><th class="emp">Сотрудник</th>' +
      '<th class="dg-ws-pay-h" title="Накапало / ставка">Оклад</th>' +
      '<th class="dg-ws-pay-h" title="Клик — ручная премия за месяц">Премия</th>';
    for (var d = 1; d <= dim; d++) html += dayColHeaderHtml(pm.y, pm.m, d);
    html += "<th>Σ</th></tr></thead><tbody>";
    filtered.forEach(function (e) {
      var salAcc = e.salary_accrued != null ? e.salary_accrued : 0;
      var salRate = e.salary != null ? e.salary : 0;
      var premAcc = e.premium_accrued != null ? e.premium_accrued : 0;
      var premFull = e.premium_full != null ? e.premium_full : 0;
      var premManual = e.premium_manual != null && e.premium_manual !== "";
      var premSrc = e.premium_source || "";
      var premSub = premSrc === "sales"
        ? "из продаж"
        : premSrc === "manual" || premManual
          ? "ручная" + (premFull > 0 ? " · правило " + money(premFull) : "")
          : premFull > 0
            ? "полная " + money(premFull)
            : "клик — ввести";
      html +=
        '<tr><td class="emp">' +
        (e.full_name || "") +
        '</td><td class="dg-ws-pay">' +
        '<span class="dg-ws-pay-main">' +
        money(salAcc) +
        '</span><span class="dg-ws-pay-sub">ставка ' +
        money(salRate) +
        "</span></td>" +
        '<td class="dg-ws-pay cell-click dg-ws-pay-prem' +
        (premSrc === "sales" ? " dg-ws-pay-sales" : premManual ? " dg-ws-pay-manual" : "") +
        '" data-emp-prem="' +
        e.id +
        '" title="Ручная премия за месяц">' +
        '<span class="dg-ws-pay-main">' +
        money(premAcc) +
        '</span><span class="dg-ws-pay-sub">' +
        premSub +
        "</span></td>";
      var sum = 0;
      for (var day = 1; day <= dim; day++) {
        var c = (sh.cells[e.id] && sh.cells[e.id][day]) || null;
        var L = cellLabel(c);
        if (c) {
          if (c.type === "vacation" || c.type === "sick") sum += 1;
          else sum += Number(c.rate) || 0;
        }
        html +=
          '<td class="cell-click ' +
          L.cls +
          '" data-emp="' +
          e.id +
          '" data-day="' +
          day +
          '">' +
          L.label +
          "</td>";
      }
      html += "<td>" + Math.round(sum * 10) / 10 + "</td></tr>";
    });
    html += "</tbody></table>";
    host.innerHTML = html;
  }

  function openPremModal(empId) {
    var month = state.filters.month || defaultMonthStr();
    var emp = (state.sheet && state.sheet.employees || []).find(function (e) {
      return Number(e.id) === Number(empId);
    });
    if (!emp) return;
    state.editPremium = { empId: empId, month: month };
    var meta = document.getElementById("dg-ws-prem-meta");
    if (meta) meta.textContent = (emp.full_name || "") + " · " + formatMonthRu(month);
    var hint = document.getElementById("dg-ws-prem-hint");
    if (hint) {
      var ruleAmt = emp.premium_full != null ? Number(emp.premium_full) : 0;
      var fromRule = emp.premium_from_rule != null ? Number(emp.premium_from_rule) : 0;
      hint.textContent =
        "Правило в настройках: " +
        (ruleAmt > 0 ? money(ruleAmt) : "нет") +
        (fromRule > 0 ? " → за месяц по дням " + money(fromRule) : "") +
        ". Ручной ввод действует только на этот месяц.";
    }
    var inp = document.getElementById("dg-ws-prem-amount");
    if (inp) {
      inp.value =
        emp.premium_manual != null && emp.premium_manual !== ""
          ? String(emp.premium_manual)
          : emp.premium_accrued != null
            ? String(emp.premium_accrued)
            : "";
      setTimeout(function () {
        inp.focus();
        inp.select();
      }, 50);
    }
    showPremOverlay(true);

    var body = {
      employee_id: state.editPremium.empId,

          "Премия: emp=" +

  function loadDept() {
    var month = state.filters.month || defaultMonthStr();
    var q = "/dept/month?month=" + encodeURIComponent(month);
    var deptId =
      state.filters.deptId ||
      (state.access && state.access.employee && state.access.employee.department_id) ||
      "";
    if (deptId) q += "&department_id=" + deptId;
    var stuckQ = "/stuck-shifts";
    if (deptId) stuckQ += "?department_id=" + deptId;
    return Promise.all([
      api(q).catch(function () {
        return { employees: [], cells: {}, today: [], vacations: [] };
      }),
      api(stuckQ).catch(function () {
        return { rows: [] };
      }),
      api("/vacations/pending").catch(function () {
        return { rows: [] };
      }),
    ]).then(function (arr) {
      state.deptMonth = arr[0];
      state.stuck = arr[1].rows || [];
      state.pendingVacations = arr[2].rows || [];
      var title = document.getElementById("dg-ws-dept-title");
      if (title && state.access && state.access.employee) {
        title.textContent = "Отдел «" + (state.access.employee.department_name || "") + "» · график";
      }
      syncMonthUi();
      renderDept();
    });
  }

  function loadSheet() {
    if (!(state.access && state.access.is_accounting)) {
      state.sheet = null;
      renderSheet();
      return Promise.resolve();
    }
    var month = state.filters.month || defaultMonthStr();
    var q = "/sheet?month=" + encodeURIComponent(month);
    if (state.filters.orgId) q += "&organization_id=" + state.filters.orgId;
    if (state.filters.deptId) q += "&department_id=" + state.filters.deptId;
    return api(q)
      .then(function (j) {
        state.sheet = j;
        renderSheet();
      })
      .catch(function (e) {
        toast("danger", e.message);
      });
  }

  function submitVacation() {
    var fromEl = document.getElementById("dg-ws-vac-from");
    var toEl = document.getElementById("dg-ws-vac-to");
    if (!fromEl || !toEl) return;
    var body = { date_from: fromEl.value, date_to: toEl.value, type: "annual" };
    var btn = document.getElementById("dg-ws-vac-submit");
    var run = function () {
      return api("/vacations", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }).then(function () {
        toast("success", "Заявка отправлена");
        fromEl.value = "";
        toEl.value = "";
        return loadMe();
      });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(btn, run);
    else
      run().catch(function (e) {
        toast("danger", e.message);
      });
  }

  function bind() {
    document.querySelectorAll("[data-dg-ws-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setTab(btn.getAttribute("data-dg-ws-tab"));
      });
    });
    document.querySelectorAll("[data-dg-ws-cal-mode]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.calMode = btn.getAttribute("data-dg-ws-cal-mode");
        document.querySelectorAll("[data-dg-ws-cal-mode]").forEach(function (b) {
          b.classList.toggle("active", b === btn);
        });
        if (state.calMode === "free" && !state.deptMonth) {
          loadDept().then(renderCalendar);
        } else renderCalendar();
      });
    });
    document.querySelectorAll("[data-dg-ws-earn-period]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.earnPeriod = btn.getAttribute("data-dg-ws-earn-period");
        document.querySelectorAll("[data-dg-ws-earn-period]").forEach(function (b) {
          b.classList.toggle("active", b === btn);
        });
        renderEarnings();
      });
    });
    function bindMonthNav(prevId, nextId) {
      var prev = document.getElementById(prevId);
      var next = document.getElementById(nextId);
      if (prev)
        prev.addEventListener("click", function () {
          shiftMonth(-1);
        });
      if (next)
        next.addEventListener("click", function () {
          shiftMonth(1);
        });
    }
    bindMonthNav("dg-ws-month-prev", "dg-ws-month-next");
    bindMonthNav("dg-ws-cal-month-prev", "dg-ws-cal-month-next");
    bindMonthNav("dg-ws-dept-month-prev", "dg-ws-dept-month-next");
    var calHost = document.getElementById("dg-ws-cal-host");
    if (calHost) {
      calHost.addEventListener("click", function (ev) {
        var cell = ev.target.closest("[data-dg-ws-day]");
        if (!cell || state.calMode !== "mine") return;
        if (window.getSelection && String(window.getSelection()).trim()) return;
        openDayModal(cell.getAttribute("data-dg-ws-day"));
      });
    }
    ["dg-ws-day-close", "dg-ws-day-cancel", "dg-ws-day-backdrop"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el)
        el.addEventListener("click", function () {
          closeDayModal();
        });
    });
    var earnGrid = document.getElementById("dg-ws-earn-grid");
    if (earnGrid) {
      earnGrid.addEventListener("click", function (ev) {
        var btn = ev.target.closest("[data-dg-ws-salary-hist]");
        if (!btn) return;
        openSalaryHistModal();
      });
    }
    ["dg-ws-salary-hist-close", "dg-ws-salary-hist-cancel", "dg-ws-salary-hist-backdrop"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el)
        el.addEventListener("click", function () {
          closeSalaryHistModal();
        });
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.key !== "Escape") return;
      var salOv = document.getElementById("dg-ws-salary-hist-overlay");
      if (salOv && salOv.style.display !== "none" && salOv.getAttribute("aria-hidden") !== "true") {
        closeSalaryHistModal();
        return;
      }
      var dayOv = document.getElementById("dg-ws-day-overlay");
      if (dayOv && dayOv.style.display !== "none" && dayOv.getAttribute("aria-hidden") !== "true") {
        closeDayModal();
      }
    });
    var monthPick = document.getElementById("dg-ws-month-pick");
    if (monthPick) {
      monthPick.addEventListener("change", function () {
        if (monthPick.value) setMonth(monthPick.value);
      });
    }
    var apply = document.getElementById("dg-ws-f-apply");
    if (apply) apply.addEventListener("click", commitFilters);
    var reset = document.getElementById("dg-ws-f-reset");
    if (reset) {
      reset.addEventListener("click", function () {
        state.pending = { orgId: 0, deptId: 0, month: defaultMonthStr(), search: "" };
        fillFilterSelects();
        commitFilters();
      });
    }
    (function bindSheetSearchMirror() {
      var a = document.getElementById("dg-ws-f-search");
      var b = document.getElementById("dg-ws-sheet-search-mirror");
      if (!a || !b) return;
      var syncing = false;
      function sync(from, to) {
        if (syncing) return;
        syncing = true;
        to.value = from.value;
        state.pending.search = from.value || "";
        syncSheetFilterDirty();
        syncing = false;
      }
      a.addEventListener("input", function () {
        sync(a, b);
      });
      b.addEventListener("input", function () {
        sync(b, a);
      });
      function onEnter(ev) {
        if (ev.key !== "Enter") return;
        ev.preventDefault();
        if (apply) apply.click();
      }
      function onEsc(ev) {
        if (ev.key !== "Escape") return;
        a.value = "";
        b.value = "";
        state.pending.search = "";
        syncSheetFilterDirty();
        commitFilters();
      }
      a.addEventListener("keydown", onEnter);
      b.addEventListener("keydown", onEnter);
      a.addEventListener("keydown", onEsc);
      b.addEventListener("keydown", onEsc);
      a.addEventListener("search", function () {
        if (!a.value) {
          b.value = "";
          state.pending.search = "";
          syncSheetFilterDirty();
          commitFilters();
        }
      });
      b.addEventListener("search", function () {
        if (!b.value) {
          a.value = "";
          state.pending.search = "";
          syncSheetFilterDirty();
          commitFilters();
        }
      });
      ["dg-ws-f-org", "dg-ws-f-dept", "dg-ws-f-month"].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("change", function () {
          if (id === "dg-ws-f-org") state.pending.orgId = Number(el.value) || 0;
          if (id === "dg-ws-f-dept") state.pending.deptId = Number(el.value) || 0;
          if (id === "dg-ws-f-month") state.pending.month = el.value || defaultMonthStr();
          syncSheetFilterDirty();
        });
      });
    })();
    var sheetHost = document.getElementById("dg-ws-sheet-host");
    if (sheetHost) {
      sheetHost.addEventListener("click", function (ev) {
        var premTd = ev.target.closest("td[data-emp-prem]");
        if (premTd) {
          openPremModal(Number(premTd.getAttribute("data-emp-prem")));
          return;
        }
        var td = ev.target.closest("td.cell-click[data-emp][data-day]");
        if (!td) return;
        openCellModal(Number(td.getAttribute("data-emp")), Number(td.getAttribute("data-day")));
      });
    }
    var saveBtn = document.getElementById("dg-ws-cell-save");
    if (saveBtn) saveBtn.addEventListener("click", saveCellModal);
    ["dg-ws-cell-cancel", "dg-ws-cell-close", "dg-ws-cell-backdrop"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el)
        el.addEventListener("click", function () {
          showCellOverlay(false);
        });
    });
    var premSave = document.getElementById("dg-ws-prem-save");
    if (premSave) premSave.addEventListener("click", function () { savePremModal(false); });
    var premClear = document.getElementById("dg-ws-prem-clear");
    if (premClear) premClear.addEventListener("click", function () { savePremModal(true); });
    ["dg-ws-prem-cancel", "dg-ws-prem-close", "dg-ws-prem-backdrop"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el)
        el.addEventListener("click", function () {
          showPremOverlay(false);
          state.editPremium = null;
        });
    });
    var premAmt = document.getElementById("dg-ws-prem-amount");
    if (premAmt) {
      premAmt.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") {
          ev.preventDefault();
          savePremModal(false);
        }
      });
    }
    document.addEventListener("keydown", function (ev) {
      if (ev.key !== "Escape") return;
      var premOv = document.getElementById("dg-ws-prem-overlay");
      if (premOv && premOv.style.display === "flex") {
        showPremOverlay(false);
        state.editPremium = null;
        return;
      }
      var ov = document.getElementById("dg-ws-cell-overlay");
      if (ov && ov.style.display === "flex") showCellOverlay(false);
    });

    var vacBtn = document.getElementById("dg-ws-vac-submit");
    if (vacBtn) vacBtn.addEventListener("click", submitVacation);

    var approveHost = document.getElementById("dg-ws-approve-vacations");
    if (approveHost) {
      approveHost.addEventListener("click", function (ev) {
        var btn = ev.target.closest("[data-dg-ws-approve]");
        if (!btn) return;
        var tr = btn.closest("tr");
        var id = tr && tr.getAttribute("data-vac-id");
        if (!id) return;
        var ok = btn.getAttribute("data-dg-ws-approve") === "ok";
        var run = function () {
          return api("/vacations/" + id + "/approve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(ok ? {} : { reject: true, reason: "отклонено" }),
          }).then(function () {
            toast(ok ? "success" : "warning", ok ? "Отпуск согласован" : "Отпуск отклонён");
            return loadDept();
          });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(btn, run);
        else
          run().catch(function (e) {
            toast("danger", e.message);
          });
      });
    }

    function showPremSalesOverlay(show) {
      var ov = document.getElementById("dg-ws-prem-sales-overlay");
      if (!ov) return;
      ov.style.display = show ? "flex" : "none";
      ov.setAttribute("aria-hidden", show ? "false" : "true");
    }

    function formatPremSalesLog(j, phase) {
      var rows = j.rows || [];
      var lines = rows
        .filter(function (r) {
          return r.changed || Number(r.bonus) > 0;
        })
        .slice(0, 20)
        .map(function (r) {
          return (
            "<li>" +
            (r.full_name || "") +
            " · " +
            money(r.bonus) +
            (r.pct_mp != null ? " (" + r.pct_mp + "% МП)" : "") +
            (r.changed ? "" : " — без изменений") +
            "</li>"
          );
        });
      return (
        "<strong>" +
        (phase || "Премии из продаж") +
        " · " +
        (j.period_ym || "") +
        "</strong><br>" +
        "Отделы «…продаж…»: " +
        (j.total != null ? j.total : "—") +
        "; к записи: " +
        (j.updated != null ? j.updated : "—") +
        "; без изменений: " +
        (j.skipped != null ? j.skipped : "—") +
        "; без строк в журнале: " +
        (j.no_sales != null ? j.no_sales : "—") +
        (j.duration_sec != null ? "; " + j.duration_sec + " с" : "") +
        (lines.length ? '<ul class="mb-0 mt-2">' + lines.join("") + "</ul>" : "")
      );
    }

    var premSalesBtn = document.getElementById("dg-ws-btn-prem-sales");
    if (premSalesBtn) {
      premSalesBtn.addEventListener("click", function () {
        var month = state.filters.month || defaultMonthStr();
        var body = { period_ym: month, dry_run: 1 };
        if (state.filters.orgId) body.organization_id = state.filters.orgId;
        if (state.filters.deptId) body.department_id = state.filters.deptId;
        var run = function () {
          return api("/sheet/premium-from-sales", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          }).then(function (j) {
            state._premSalesPreview = j;
            showActionLog(formatPremSalesLog(j, "Пробный прогон"));
            var tx = document.getElementById("dg-ws-prem-sales-confirm-text");
            if (tx) {
              tx.textContent =
                "Принудительно перезаписать премии из журнала менеджеров за " +
                formatMonthRu(month) +
                " (в т.ч. поверх ручных). К записи: " +
                (j.updated != null ? j.updated : 0) +
                " из " +
                (j.total != null ? j.total : 0) +
                ". Обычно премии подтягиваются сами при открытии табеля.";
            }
            var prev = document.getElementById("dg-ws-prem-sales-preview");
            if (prev) {
              prev.innerHTML = (j.rows || [])
                .filter(function (r) {
                  return r.changed;
                })
                .slice(0, 12)
                .map(function (r) {
                  return (
                    "<div>" +
                    (r.full_name || "") +
                    ": " +
                    money(r.bonus) +
                    (r.previous_manual != null ? " (было " + money(r.previous_manual) + ")" : "") +
                    "</div>"
                  );
                })
                .join("") || "<div class=\"text-muted\">Нет изменений — все уже совпадают</div>";
            }
            showPremSalesOverlay(true);
            toast("success", "Пробный прогон готов");
          });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun) {
          window.DatagonNotify.busyRun(premSalesBtn, run);
        } else {
          run().catch(function (e) {
            toast("danger", e.message);
          });
        }
      });
    }
    var premSalesOk = document.getElementById("dg-ws-prem-sales-ok");
    if (premSalesOk) {
      premSalesOk.addEventListener("click", function () {
        var month = state.filters.month || defaultMonthStr();
        var body = { period_ym: month, dry_run: 0 };
        if (state.filters.orgId) body.organization_id = state.filters.orgId;
        if (state.filters.deptId) body.department_id = state.filters.deptId;
        var run = function () {
          return api("/sheet/premium-from-sales", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          }).then(function (j) {
            showPremSalesOverlay(false);
            showActionLog(formatPremSalesLog(j, "Записано"));
            toast("success", j.message || "Премии записаны");
            return loadSheet();
          });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun) {
          window.DatagonNotify.busyRun(premSalesOk, run);
        } else {
          run().catch(function (e) {
            toast("danger", e.message);
          });
        }
      });
    }
    document.querySelectorAll("[data-dg-ws-prem-sales-close]").forEach(function (el) {
      el.addEventListener("click", function () {
        showPremSalesOverlay(false);
      });
    });

    var exportBtn = document.getElementById("dg-ws-btn-export");
    if (exportBtn) {
      exportBtn.addEventListener("click", function () {
        var month = state.filters.month || defaultMonthStr();
        window.location.href = API + "/export/1c?format=csv&month=" + encodeURIComponent(month);
        showActionLog("Экспорт 1С CSV за " + month);
      });
    }
    var dry = document.getElementById("dg-ws-btn-dryrun");
    if (dry) {
      dry.addEventListener("click", function () {
        var month = state.filters.month || defaultMonthStr();
        var run = function () {
          return api("/payroll/dry-run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ month: month }),
          }).then(function (j) {
            var n = (j.rows || []).length;
            var sum = (j.rows || []).reduce(function (a, r) {
              return a + (Number(r.total) || 0);
            }, 0);
            showActionLog(
              "<strong>Dry-run " +
                month +
                "</strong><br>Сотрудников: " +
                n +
                "; сумма: " +
                money(sum) +
                '<br><button type="button" class="btn btn-sm btn-primary mt-2" id="dg-ws-btn-apply-payroll" data-dg-notify-start="Подтверждение…">Применить начисления</button>'
            );
            toast("success", "Предпросмотр готов");
            var ap = document.getElementById("dg-ws-btn-apply-payroll");
            if (ap) {
              ap.addEventListener("click", function () {
                var ov = document.getElementById("dg-ws-payroll-overlay");
                var tx = document.getElementById("dg-ws-payroll-confirm-text");
                if (tx) tx.textContent = "Записать начисления за " + month + " в БД (" + n + " сотр., " + money(sum) + ")?";
                if (ov) {
                  ov.style.display = "flex";
                  ov.setAttribute("aria-hidden", "false");
                }
                state._payrollMonth = month;
              });
            }
          });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(dry, run);
        else
          run().catch(function (e) {
            toast("danger", e.message);
          });
      });
    }
    var audit = document.getElementById("dg-ws-btn-audit");
    if (audit) {
      audit.addEventListener("click", function () {
        var run = function () {
          return api("/audit?limit=50").then(function (j) {
            var rows = j.rows || [];
            var html =
              "<strong>Журнал (последние " +
              rows.length +
              ")</strong><ul class=\"mb-0 mt-2\">" +
              rows
                .slice(0, 20)
                .map(function (a) {
                  return (
                    "<li>" +
                    String(a.created_at || "").slice(0, 19) +
                    " · " +
                    (a.username || a.user_id || "") +
                    " · " +
                    a.entity_type +
                    "/" +
                    a.entity_id +
                    " · " +
                    a.action +
                    "</li>"
                  );
                })
                .join("") +
              "</ul>";
            showActionLog(html);
          });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(audit, run);
        else
          run().catch(function (e) {
            toast("danger", e.message);
          });
      });
    }

    document.querySelectorAll("[data-dg-ws-payroll-close]").forEach(function (el) {
      el.addEventListener("click", function () {
        var ov = document.getElementById("dg-ws-payroll-overlay");
        if (ov) {
          ov.style.display = "none";
          ov.setAttribute("aria-hidden", "true");
        }
      });
    });
    var payOk = document.getElementById("dg-ws-payroll-apply-ok");
    if (payOk) {
      payOk.addEventListener("click", function () {
        var month = state._payrollMonth || state.filters.month || defaultMonthStr();
        var ov = document.getElementById("dg-ws-payroll-overlay");
        var run = function () {
          return api("/payroll/apply", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ month: month }),
          }).then(function (r) {
            if (ov) {
              ov.style.display = "none";
              ov.setAttribute("aria-hidden", "true");
            }
            toast("success", "Начисления применены: " + (r.rows || []).length);
            showActionLog("Apply " + month + ": " + (r.rows || []).length + " записей");
          });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun) window.DatagonNotify.busyRun(payOk, run);
        else
          run().catch(function (e) {
            toast("danger", e.message);
          });
      });
    }

    if (window.DatagonWorkClock && window.DatagonWorkClock.subscribe) {
      window.DatagonWorkClock.subscribe(syncClockMirror);
      window.DatagonWorkClock.refresh();
    }
  }

  function init() {
    state.filters.month = defaultMonthStr();
    state.pending.month = state.filters.month;
    syncMonthUi();
    bind();
    api("/access")
      .then(function (acc) {
        state.access = acc;
        var loads = [];
        if (acc.is_accounting) {
          loads.push(
            api("/organizations").then(function (j) {
              state.orgs = j.rows || [];
            })
          );
          loads.push(
            api("/departments").then(function (j) {
              state.departments = j.rows || [];
            })
          );
        } else if (acc.employee) {
          state.departments = [
            { id: acc.employee.department_id, name: acc.employee.department_name, schedule_type: "" },
          ];
        }
        return Promise.all(loads);
      })
      .then(function () {
        fillFilterSelects();
        var tab = "me";
        try {
          var saved = sessionStorage.getItem(TAB_KEY);
          if (TAB_HINTS[saved]) tab = saved;
        } catch (e) {}
        if (state.access && state.access.is_accounting && !state.access.is_employee) tab = "sheet";
        setTab(tab);
      })
      .catch(function (e) {
        toast("danger", e.message || "Ошибка доступа");
        setTab("me");
      });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
