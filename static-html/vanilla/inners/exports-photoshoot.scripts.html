<script>
(function () {
  "use strict";

  var PS_COLS = [
    { key: "product_code", label: "SKU", sort: true },
    { key: "article", label: "Артикул", sort: true },
    { key: "title", label: "Название", sort: true },
    { key: "photoshoot_at", label: "Дата съёмки", sort: true },
    { key: "photoshoot_status", label: "Статус", sort: true },
    { key: "photoshoot_comment", label: "Комментарий", sort: false },
    { key: "markets_codes", label: "Код с маркетов", sort: false },
    { key: "almamed_article", label: "Артикул альмамед", sort: false },
    { key: "markets_title", label: "Название товара с маркетов", sort: false },
  ];

  var STATUS_OPTS = [
    { key: "not_shot", label: "Не отснят" },
    { key: "out_of_stock", label: "Нет в наличии" },
    { key: "in_package", label: "товар в упаковке" },
    { key: "shot", label: "Отснят" },
    { key: "boxed", label: "Собран в коробку" },
  ];

  var FILTERS_KEY = "datagon_photoshoot_filters_collapsed_v1";
  var TABLE_COLLAPSE_KEY = "dg.photoshoot.table-card.collapsed.v1";

  var state = {
    search: "",
    photoshoot_status: "",
    has_stock: "1",
    limit: 100,
    offset: 0,
    sort_by: "stock",
    sort_dir: "desc",
    total: 0,
    rows: [],
    loading: false,
    pending: { search: "", photoshoot_status: "", has_stock: "1", limit: 100 },
  };

  function el(id) {
    return document.getElementById(id);
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function toast(type, message) {
    if (window.DatagonNotify && window.DatagonNotify.toast) {
      window.DatagonNotify.toast({ type: type || "info", message: message });
    }
  }

  function formatDt(v) {
    if (!v) return "—";
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleString("ru-RU");
  }

  function pageCount() {
    var lim = Math.max(1, Number(state.limit) || 100);
    return Math.max(1, Math.ceil((Number(state.total) || 0) / lim));
  }

  function currentPage() {
    var lim = Math.max(1, Number(state.limit) || 100);
    return Math.floor((Number(state.offset) || 0) / lim) + 1;
  }

  function syncDirty() {
    var btn = el("dg-ps-apply");
    if (!btn) return;
    var dirty =
      String(state.pending.search) !== String(state.search) ||
      String(state.pending.photoshoot_status) !== String(state.photoshoot_status) ||
      String(state.pending.has_stock) !== String(state.has_stock) ||
      Number(state.pending.limit) !== Number(state.limit);
    btn.classList.toggle("dg-flt-dirty", dirty);
    btn.textContent = dirty ? "Применить •" : "Применить";
  }

  function readPendingFromDom() {
    state.pending.search = (el("dg-ps-search") && el("dg-ps-search").value) || "";
    state.pending.photoshoot_status = (el("dg-ps-f-status") && el("dg-ps-f-status").value) || "";
    state.pending.has_stock = (el("dg-ps-f-has-stock") && el("dg-ps-f-has-stock").value) || "1";
    var lim = parseInt(el("dg-ps-f-limit") && el("dg-ps-f-limit").value, 10);
    state.pending.limit = Number.isFinite(lim) && lim > 0 ? lim : 100;
    syncDirty();
  }

  function commitFilters() {
    readPendingFromDom();
    state.search = state.pending.search;
    state.photoshoot_status = state.pending.photoshoot_status;
    state.has_stock = state.pending.has_stock;
    state.limit = state.pending.limit;
    state.offset = 0;
    var pl = el("dg-ps-page-limit");
    if (pl) pl.value = String(state.limit);
    syncDirty();
    return load();
  }

  function resetFilters() {
    el("dg-ps-search").value = "";
    el("dg-ps-table-search-mirror").value = "";
    el("dg-ps-f-status").value = "";
    el("dg-ps-f-has-stock").value = "1";
    el("dg-ps-f-limit").value = "100";
    state.sort_by = "stock";
    state.sort_dir = "desc";
    return commitFilters();
  }

  function buildQuery() {
    var p = new URLSearchParams();
    if (state.search) p.set("search", state.search);
    if (state.photoshoot_status) p.set("photoshoot_status", state.photoshoot_status);
    if (state.has_stock === "1" || state.has_stock === "0") p.set("has_stock", state.has_stock);
    else p.set("has_stock", "all");
    p.set("limit", String(state.limit));
    p.set("offset", String(state.offset));
    p.set("sort_by", state.sort_by || "stock");
    p.set("sort_dir", state.sort_dir || "desc");
    return "?" + p.toString();
  }

  function syncUrl() {
    try {
      var p = new URLSearchParams();
      if (state.search) p.set("search", state.search);
      if (state.photoshoot_status) p.set("photoshoot_status", state.photoshoot_status);
      if (state.has_stock !== "1") p.set("has_stock", state.has_stock === "all" ? "all" : state.has_stock);
      if (Number(state.limit) !== 100) p.set("limit", String(state.limit));
      if (Number(state.offset) > 0) p.set("offset", String(state.offset));
      if (state.sort_by && state.sort_by !== "stock") p.set("sort_by", state.sort_by);
      if (state.sort_dir && state.sort_dir !== "desc") p.set("sort_dir", state.sort_dir);
      var next = p.toString() ? location.pathname + "?" + p.toString() : location.pathname;
      history.replaceState(null, "", next);
    } catch (_) {}
  }

  function parseUrlToForm() {
    var params = new URLSearchParams(location.search);
    if (params.has("search")) {
      el("dg-ps-search").value = params.get("search") || "";
      el("dg-ps-table-search-mirror").value = el("dg-ps-search").value;
    }
    if (params.has("photoshoot_status")) el("dg-ps-f-status").value = params.get("photoshoot_status") || "";
    if (params.has("has_stock")) {
      var hs = params.get("has_stock");
      el("dg-ps-f-has-stock").value = hs === "all" || hs === "" ? "all" : hs === "0" ? "0" : "1";
    }
    if (params.has("limit")) {
      el("dg-ps-f-limit").value = params.get("limit") || "100";
      el("dg-ps-page-limit").value = el("dg-ps-f-limit").value;
    }
    if (params.has("offset")) state.offset = Number(params.get("offset")) || 0;
    if (params.has("sort_by")) state.sort_by = params.get("sort_by") || "stock";
    if (params.has("sort_dir")) state.sort_dir = params.get("sort_dir") === "asc" ? "asc" : "desc";
    readPendingFromDom();
    state.search = state.pending.search;
    state.photoshoot_status = state.pending.photoshoot_status;
    state.has_stock = state.pending.has_stock;
    state.limit = state.pending.limit;
  }

  function buildThead() {
    var thead = el("dg-ps-thead");
    if (!thead) return;
    var tr = document.createElement("tr");
    PS_COLS.forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c.label;
      th.dataset.key = c.key;
      if (c.sort) {
        th.className = "dg-ps-sortable";
        if (state.sort_by === c.key) {
          th.textContent = c.label + (state.sort_dir === "asc" ? " ↑" : " ↓");
        }
        th.addEventListener("click", function () {
          var sel = window.getSelection && window.getSelection();
          if (sel && String(sel.toString() || "").trim()) return;
          if (state.sort_by === c.key) state.sort_dir = state.sort_dir === "asc" ? "desc" : "asc";
          else {
            state.sort_by = c.key;
            state.sort_dir = "asc";
          }
          state.offset = 0;
          load();
        });
      }
      tr.appendChild(th);
    });
    thead.innerHTML = "";
    thead.appendChild(tr);
  }

  function statusSelect(row) {
    var sel = document.createElement("select");
    sel.className = "form-select form-select-sm dg-ps-status-select";
    sel.setAttribute("data-dg-ps-id", String(row.id));
    STATUS_OPTS.forEach(function (o) {
      var opt = document.createElement("option");
      opt.value = o.key;
      opt.textContent = o.label;
      if (o.key === row.photoshoot_status) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener("change", function () {
      patchRow(row.id, { photoshoot_status: sel.value }, sel);
    });
    return sel;
  }

  function commentInput(row) {
    var inp = document.createElement("input");
    inp.type = "text";
    inp.className = "form-control form-control-sm dg-ps-comment-input";
    inp.value = row.photoshoot_comment || "";
    inp.setAttribute("data-dg-ps-id", String(row.id));
    var timer = null;
    function save() {
      patchRow(row.id, { photoshoot_comment: inp.value }, inp);
    }
    inp.addEventListener("change", save);
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        save();
      }
    });
    inp.addEventListener("blur", function () {
      if (timer) clearTimeout(timer);
    });
    return inp;
  }

  function applyRowClass(tr, status) {
    STATUS_OPTS.forEach(function (o) {
      tr.classList.remove("dg-ps-row-" + o.key);
    });
    if (status) tr.classList.add("dg-ps-row-" + status);
  }

  function renderTable() {
    buildThead();
    var tbody = el("dg-ps-tbody");
    if (!tbody) return;
    tbody.innerHTML = "";
    if (!state.rows.length) {
      var empty = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = PS_COLS.length;
      td.className = "text-muted p-3";
      td.textContent = "Нет строк по текущим фильтрам";
      empty.appendChild(td);
      tbody.appendChild(empty);
    } else {
      state.rows.forEach(function (row) {
        var tr = document.createElement("tr");
        applyRowClass(tr, row.photoshoot_status);
        PS_COLS.forEach(function (c) {
          var td = document.createElement("td");
          if (c.key === "photoshoot_status") {
            td.appendChild(statusSelect(row));
          } else if (c.key === "photoshoot_comment") {
            td.appendChild(commentInput(row));
          } else if (c.key === "photoshoot_at") {
            td.textContent = formatDt(row.photoshoot_at);
          } else {
            td.textContent = row[c.key] != null && row[c.key] !== "" ? String(row[c.key]) : "—";
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    var shown = state.rows.length;
    var st = el("dg-ps-page-status");
    if (st) {
      st.textContent =
        "Найдено: " +
        Number(state.total || 0).toLocaleString("ru-RU") +
        "; страница " +
        currentPage() +
        "/" +
        pageCount() +
        "; показано: " +
        shown;
    }
    var prev = el("dg-ps-prev");
    var next = el("dg-ps-next");
    if (prev) prev.disabled = currentPage() <= 1 || state.loading;
    if (next) next.disabled = currentPage() >= pageCount() || state.loading;
    scheduleFloatRebase();
  }

  function patchRow(id, body, ctrl) {
    var run = function () {
      return fetch("/api/exports/photoshoot/" + id, {
        method: "PATCH",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      })
        .then(function (r) {
          return r.json().then(function (j) {
            return { ok: r.ok, j: j };
          });
        })
        .then(function (res) {
          if (!res.ok || !res.j || res.j.success === false) {
            throw new Error((res.j && res.j.error) || "Ошибка сохранения");
          }
          var updated = res.j.data;
          if (updated) {
            for (var i = 0; i < state.rows.length; i++) {
              if (Number(state.rows[i].id) === Number(id)) {
                state.rows[i] = updated;
                break;
              }
            }
            renderTable();
            toast("success", "Сохранено");
          }
        })
        .catch(function (e) {
          toast("danger", e.message || "Ошибка");
          return load();
        });
    };
    if (window.DatagonNotify && window.DatagonNotify.busyRun && ctrl) {
      return window.DatagonNotify.busyRun(ctrl, run);
    }
    return run();
  }

  function load() {
    if (state.loading) return Promise.resolve();
    state.loading = true;
    var tbody = el("dg-ps-tbody");
    if (tbody) {
      tbody.innerHTML =
        '<tr><td class="text-muted p-3" colspan="' + PS_COLS.length + '">Загрузка…</td></tr>';
    }
    return fetch("/api/exports/photoshoot" + buildQuery(), { credentials: "same-origin" })
      .then(function (r) {
        return r.json().then(function (j) {
          return { ok: r.ok, j: j };
        });
      })
      .then(function (res) {
        if (!res.ok || !res.j || res.j.error) {
          throw new Error((res.j && res.j.error) || "Ошибка загрузки");
        }
        state.rows = Array.isArray(res.j.data) ? res.j.data : [];
        state.total = Number(res.j.total || 0);
        state.limit = Number(res.j.limit || state.limit);
        state.offset = Number(res.j.offset || 0);
        syncUrl();
        renderTable();
      })
      .catch(function (e) {
        if (tbody) {
          tbody.innerHTML =
            '<tr><td class="text-danger p-3" colspan="' +
            PS_COLS.length +
            '">' +
            esc(e.message || "Ошибка") +
            "</td></tr>";
        }
        toast("danger", e.message || "Ошибка загрузки");
      })
      .finally(function () {
        state.loading = false;
        var prev = el("dg-ps-prev");
        var next = el("dg-ps-next");
        if (prev) prev.disabled = currentPage() <= 1;
        if (next) next.disabled = currentPage() >= pageCount();
      });
  }

  /* —— floating header (new-products style: fixed clone) —— */
  var floatMetrics = { baseTopAbs: 0, tableBottomAbs: 0, boxLeft: 0, boxWidth: 0 };
  var floatRaf = 0;

  function appHeaderH() {
    var header = document.querySelector(".app-header");
    if (!header || !header.getBoundingClientRect) return 60;
    var r = header.getBoundingClientRect();
    return r && r.height ? r.height : 60;
  }

  function rebaseFloat() {
    var thead = el("dg-ps-thead");
    var host = el("dg-ps-float-host");
    var scrollOuter = el("dg-ps-table-scroll-outer");
    var table = el("dg-ps-table");
    if (!thead || !host || !scrollOuter || !table) return;
    thead.removeAttribute("data-dg-floating");
    host.removeAttribute("data-active");
    host.style.display = "none";
    var thRect = thead.getBoundingClientRect();
    var box = scrollOuter.getBoundingClientRect();
    var tableRect = table.getBoundingClientRect();
    var scrollY = window.scrollY || window.pageYOffset || 0;
    floatMetrics.baseTopAbs = thRect.top + scrollY;
    floatMetrics.tableBottomAbs = tableRect.bottom + scrollY;
    floatMetrics.boxLeft = box.left;
    floatMetrics.boxWidth = box.width;
    var inner = el("dg-ps-float-inner");
    if (inner) {
      inner.innerHTML = "";
      var cloneTable = document.createElement("table");
      cloneTable.className = table.className;
      cloneTable.style.width = table.offsetWidth + "px";
      cloneTable.style.margin = "0";
      var cg = table.querySelector("colgroup");
      if (cg) cloneTable.appendChild(cg.cloneNode(true));
      cloneTable.appendChild(thead.cloneNode(true));
      cloneTable.querySelectorAll("th").forEach(function (th, idx) {
        th.style.visibility = "visible";
        th.addEventListener("click", function (e) {
          e.preventDefault();
          var orig = thead.querySelectorAll("th")[idx];
          if (orig) orig.click();
        });
      });
      inner.appendChild(cloneTable);
    }
    updateFloat();
  }

  function updateFloat() {
    var thead = el("dg-ps-thead");
    var host = el("dg-ps-float-host");
    var scrollOuter = el("dg-ps-table-scroll-outer");
    var inner = el("dg-ps-float-inner");
    if (!thead || !host || !scrollOuter) return;
    var scrollY = window.scrollY || window.pageYOffset || 0;
    var stickyTop = appHeaderH();
    var stick =
      scrollY + stickyTop > floatMetrics.baseTopAbs + 2 &&
      scrollY + stickyTop < floatMetrics.tableBottomAbs - 40;
    if (!stick) {
      host.removeAttribute("data-active");
      host.style.display = "none";
      thead.removeAttribute("data-dg-floating");
      return;
    }
    thead.setAttribute("data-dg-floating", "1");
    host.setAttribute("data-active", "1");
    host.style.display = "block";
    host.style.top = stickyTop + "px";
    host.style.left = floatMetrics.boxLeft + "px";
    host.style.width = floatMetrics.boxWidth + "px";
    if (inner) {
      inner.style.transform = "translate3d(" + -scrollOuter.scrollLeft + "px,0,0)";
    }
  }

  function scheduleFloatRebase() {
    if (floatRaf) cancelAnimationFrame(floatRaf);
    floatRaf = requestAnimationFrame(function () {
      floatRaf = 0;
      rebaseFloat();
    });
  }

  function bindCollapse() {
    var fBtn = el("dg-ps-filters-toggle");
    var fBody = el("dg-ps-filters-body");
    if (fBtn && fBody) {
      var collapsed = localStorage.getItem(FILTERS_KEY) === "1";
      function applyF() {
        fBody.style.display = collapsed ? "none" : "";
        fBtn.textContent = collapsed ? "Развернуть" : "Свернуть";
      }
      applyF();
      fBtn.addEventListener("click", function () {
        collapsed = !collapsed;
        localStorage.setItem(FILTERS_KEY, collapsed ? "1" : "0");
        applyF();
        scheduleFloatRebase();
      });
    }
    var tBtn = el("dg-ps-table-toggle");
    var tBody = el("dg-ps-table-body");
    if (tBtn && tBody) {
      var tCollapsed = localStorage.getItem(TABLE_COLLAPSE_KEY) === "1";
      function applyT() {
        tBody.style.display = tCollapsed ? "none" : "";
        tBtn.textContent = tCollapsed ? "Развернуть" : "Свернуть";
      }
      applyT();
      tBtn.addEventListener("click", function () {
        tCollapsed = !tCollapsed;
        localStorage.setItem(TABLE_COLLAPSE_KEY, tCollapsed ? "1" : "0");
        applyT();
        scheduleFloatRebase();
      });
    }
  }

  function bindSearchMirror() {
    var primary = el("dg-ps-search");
    var mirror = el("dg-ps-table-search-mirror");
    if (!primary || !mirror) return;
    var syncing = false;
    function copy(from, to) {
      if (syncing) return;
      syncing = true;
      to.value = from.value;
      syncing = false;
      readPendingFromDom();
    }
    primary.addEventListener("input", function () {
      copy(primary, mirror);
    });
    mirror.addEventListener("input", function () {
      copy(mirror, primary);
    });
    function onKey(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        el("dg-ps-apply").click();
      } else if (e.key === "Escape") {
        primary.value = "";
        mirror.value = "";
        commitFilters();
      }
    }
    primary.addEventListener("keydown", onKey);
    mirror.addEventListener("keydown", onKey);
  }

  function bind() {
    bindCollapse();
    bindSearchMirror();
    ["dg-ps-search", "dg-ps-f-status", "dg-ps-f-has-stock", "dg-ps-f-limit"].forEach(function (id) {
      var node = el(id);
      if (!node) return;
      node.addEventListener("input", readPendingFromDom);
      node.addEventListener("change", readPendingFromDom);
    });
    el("dg-ps-apply").addEventListener("click", function () {
      var btn = el("dg-ps-apply");
      if (window.DatagonNotify && window.DatagonNotify.busyRun) {
        window.DatagonNotify.busyRun(btn, commitFilters);
      } else commitFilters();
    });
    el("dg-ps-reset").addEventListener("click", function () {
      var btn = el("dg-ps-reset");
      if (window.DatagonNotify && window.DatagonNotify.busyRun) {
        window.DatagonNotify.busyRun(btn, resetFilters);
      } else resetFilters();
    });
    el("dg-ps-prev").addEventListener("click", function () {
      if (currentPage() <= 1) return;
      state.offset = Math.max(0, state.offset - state.limit);
      load();
    });
    el("dg-ps-next").addEventListener("click", function () {
      if (currentPage() >= pageCount()) return;
      state.offset = state.offset + state.limit;
      load();
    });
    el("dg-ps-page-limit").addEventListener("change", function () {
      var lim = parseInt(el("dg-ps-page-limit").value, 10);
      if (!Number.isFinite(lim) || lim < 1) return;
      el("dg-ps-f-limit").value = String(lim);
      state.pending.limit = lim;
      commitFilters();
    });
    window.addEventListener("scroll", updateFloat, { passive: true });
    var outer = document.querySelector(".app-main__outer");
    if (outer) outer.addEventListener("scroll", updateFloat, { passive: true });
    var so = el("dg-ps-table-scroll-outer");
    if (so) so.addEventListener("scroll", updateFloat, { passive: true });
    window.addEventListener("resize", scheduleFloatRebase);
  }

  (async function init() {
    bind();
    parseUrlToForm();
    syncDirty();
    await load();
  })();
})();
</script>
