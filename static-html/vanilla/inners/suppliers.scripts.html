  <script>
    (function () {
      var SP_COLS = [
        ["row_num", "№", { center: true }],
        ["supplier_name", "Поставщик"],
        ["assigned_user", "Привязан сотрудник", { editable: true }],
        ["comment", "Комментарий", { editable: true, headerLines: ["Комментар", "ий"] }],
        ["min_purchase_sum", "Мин. сумма закупки", { center: true, editable: true }],
        ["warehouse_fill_pct", "Наполняемость склада", { center: true, editable: true }],
        ["stock_fill_pct", "Наполняемость % (Кол-во Несн/Несниж сумм./Ост.факт/%)", { center: true }],
        ["products_total", "Кол-во товаров всего", { center: true }],
        ["products_to_purchase", "Кол-во товаров К закупке", { center: true }],
        ["total_purchase_sum", "Общая сумма закупки", { center: true }],
        ["export_stub", "Экспорт", { center: true, stub: true }],
        ["send_ms_stub", "Отправить заказ в МС", { center: true }],
        ["auto_mailing_stub", "Авто рассылка", { center: true, stub: true }],
        ["mailing_text_stub", "Текст для рассылки", { center: true, stub: true }],
      ];

      var COL_OPTS = {};
      SP_COLS.forEach(function (p) { COL_OPTS[p[0]] = p[2] || {}; });

      var SORTABLE = new Set([
        "supplier_name", "products_total", "products_to_purchase",
        "total_purchase_sum", "min_purchase_sum", "warehouse_fill_pct", "stock_fill_pct",
        "assigned_user_name",
      ]);
      var SORT_KEY_REMAP = { assigned_user: "assigned_user_name" };

      var DEFAULT_VISIBLE = SP_COLS.map(function (p) { return p[0]; });

      var COL_MIN = {
        row_num: 44,
        supplier_name: 160,
        assigned_user: 150,
        comment: 160,
        min_purchase_sum: 110,
        warehouse_fill_pct: 120,
        stock_fill_pct: 260,
        products_total: 100,
        products_to_purchase: 120,
        total_purchase_sum: 130,
        export_stub: 90,
        send_ms_stub: 118,
        auto_mailing_stub: 90,
        mailing_text_stub: 120,
      };

      var state = {
        search: "",
        limit: 100,
        offset: 0,
        sort_by: "supplier_name",
        sort_dir: "asc",
        pending: { search: "" },
        total: 0,
        rows: [],
        assignees: [],
        loading: false,
      };

      var sortBy = "supplier_name";
      var sortDir = "asc";

      function spAuthHeaders(withJson) {
        var headers = {};
        try {
          var username = window.localStorage.getItem("currentUser");
          var token = window.localStorage.getItem("authToken");
          if (username) headers["x-auth-username"] = username;
          if (token) headers["x-auth-token"] = token;
        } catch (e) {}
        if (withJson) headers["Content-Type"] = "application/json";
        return headers;
      }

      function fmtNum(n) {
        if (n == null || n === "") return "—";
        var x = Number(n);
        if (!Number.isFinite(x)) return String(n);
        if (Math.abs(x - Math.round(x)) < 1e-9) {
          return Math.round(x).toLocaleString("ru-RU", { maximumFractionDigits: 0 });
        }
        return x.toLocaleString("ru-RU", { maximumFractionDigits: 2 });
      }

      /** Число для ячейки: 0 показываем как «0», не «—». */
      function fmtQty(n) {
        if (n == null || n === "" || !Number.isFinite(Number(n))) return "—";
        return fmtNum(n);
      }

      function fmtMoney(n) {
        if (n == null || !Number.isFinite(Number(n))) return "—";
        return Number(n).toLocaleString("ru-RU", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + " ₽";
      }

      function fmtPct(n) {
        if (n == null || !Number.isFinite(Number(n))) return "—";
        return Number(n).toLocaleString("ru-RU", { maximumFractionDigits: 2 }) + "%";
      }

      var SP_CHART_PALETTE = [
        "#5b6eea", "#22c55e", "#f59e0b", "#ef4444", "#8b5cf6", "#06b6d4",
        "#ec4899", "#14b8a6", "#f97316", "#64748b", "#0ea5e9", "#a855f7",
      ];

      function spChartBarHeight(rowCount) {
        var n = Math.max(1, rowCount || 1);
        return Math.min(168, Math.max(88, n * 28 + 24));
      }

      function spChartBarHeightSuppliers(rowCount) {
        var n = Math.max(1, rowCount || 1);
        return Math.min(200, Math.max(96, n * 22 + 20));
      }

      function syncAnalyticsChartLayout(assigneeCount, supplierCount) {
        var barH = spChartBarHeight(assigneeCount);
        var wrap = document.querySelector("#dg-sp-chart-bars");
        if (wrap && wrap.parentElement) wrap.parentElement.style.height = barH + "px";
        var supWrap = document.querySelector("#dg-sp-chart-suppliers-bars");
        if (supWrap && supWrap.parentElement) {
          supWrap.parentElement.style.height = spChartBarHeightSuppliers(supplierCount) + "px";
        }
        var doughnutWrap = document.querySelector(".dg-sp-doughnut-wrap");
        if (doughnutWrap) {
          doughnutWrap.style.height = "100px";
          doughnutWrap.style.minHeight = "100px";
          doughnutWrap.style.maxHeight = "100px";
        }
      }

      var analyticsState = {
        metric: "total_purchase_sum",
        payload: null,
        loading: false,
        barChart: null,
        supplierBarChart: null,
        doughnutChart: null,
      };

      var chartJsPromise = null;
      function loadChartJs() {
        if (window.Chart && typeof window.Chart === "function") return Promise.resolve(window.Chart);
        if (chartJsPromise) return chartJsPromise;
        chartJsPromise = new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js";
          s.async = true;
          s.onload = function () { resolve(window.Chart); };
          s.onerror = function () { reject(new Error("Не удалось загрузить Chart.js")); };
          document.head.appendChild(s);
        });
        return chartJsPromise;
      }

      function metricMeta(key) {
        switch (key) {
          case "products_to_purchase":
            return { label: "SKU к закупке", fmt: function (v) { return fmtNum(v); } };
          case "stock_total":
            return { label: "Σ остаток (шт)", fmt: function (v) { return fmtNum(v); } };
          case "suppliers_count":
            return { label: "Поставщиков", fmt: function (v) { return fmtNum(v); } };
          default:
            return { label: "Σ к закупке", fmt: function (v) { return fmtMoney(v); } };
        }
      }

      function metricValue(row, key) {
        var n = Number(row && row[key] != null ? row[key] : 0);
        return Number.isFinite(n) ? n : 0;
      }

      function shortenLabel(name, maxLen) {
        var s = String(name || "").trim();
        if (s.length <= (maxLen || 28)) return s || "—";
        return s.slice(0, (maxLen || 28) - 1) + "…";
      }

      function setAnalyticsLoading(on) {
        var el = document.getElementById("dg-sp-analytics-loading");
        if (el) el.classList.toggle("d-none", !on);
      }

      function renderAnalyticsKpis(totals) {
        var t = totals || {};
        var map = {
          "dg-sp-kpi-suppliers": t.suppliers_count,
          "dg-sp-kpi-products": t.products_total,
          "dg-sp-kpi-to-buy": t.products_to_purchase,
          "dg-sp-kpi-stock": t.stock_total,
          "dg-sp-kpi-sum": t.total_purchase_sum,
        };
        Object.keys(map).forEach(function (id) {
          var el = document.getElementById(id);
          if (!el) return;
          if (id === "dg-sp-kpi-sum") el.textContent = fmtMoney(map[id]);
          else el.textContent = fmtNum(map[id]);
        });
      }

      function renderAnalyticsHint(totals, assigneeRows, supplierRows) {
        var hint = document.getElementById("dg-sp-analytics-hint");
        if (!hint) return;
        var parts = [];
        var meta = metricMeta(analyticsState.metric);
        if (totals && totals.assignees_count != null) {
          parts.push("Сотрудников в сводке: " + fmtNum(totals.assignees_count));
        }
        if (totals && Number(totals.unassigned_suppliers) > 0) {
          parts.push("Без привязки: " + fmtNum(totals.unassigned_suppliers) + " поставщ.");
        }
        if (totals && totals.avg_fill_pct != null) {
          parts.push("Средняя наполняемость: " + fmtPct(totals.avg_fill_pct));
        }
        if (assigneeRows && assigneeRows.length) {
          var topA = assigneeRows.slice().sort(function (a, b) {
            return metricValue(b, analyticsState.metric) - metricValue(a, analyticsState.metric);
          })[0];
          parts.push(
            "Лидер (сотрудники): " +
              (topA.assignee_label || "—") +
              " (" +
              meta.fmt(metricValue(topA, analyticsState.metric)) +
              ")"
          );
        }
        if (supplierRows && supplierRows.length) {
          var topS = supplierRows.slice().sort(function (a, b) {
            return metricValue(b, analyticsState.metric) - metricValue(a, analyticsState.metric);
          })[0];
          parts.push(
            "Лидер (поставщик): " +
              (topS.supplier_label || "—") +
              " (" +
              meta.fmt(metricValue(topS, analyticsState.metric)) +
              ")"
          );
        }
        hint.textContent = parts.join(" · ");
      }

      function renderAssigneeLegend(rows) {
        var root = document.getElementById("dg-sp-assignee-legend");
        if (!root) return;
        root.textContent = "";
        var sumAll = 0;
        (rows || []).forEach(function (r) {
          sumAll += metricValue(r, "total_purchase_sum");
        });
        (rows || []).slice(0, 5).forEach(function (r, i) {
          var row = document.createElement("div");
          row.className = "dg-sp-legend-row";
          var left = document.createElement("span");
          left.style.display = "inline-flex";
          left.style.alignItems = "center";
          left.style.gap = "6px";
          left.style.minWidth = "0";
          left.style.flex = "1";
          var sw = document.createElement("span");
          sw.className = "dg-sp-legend-swatch";
          sw.style.background = SP_CHART_PALETTE[i % SP_CHART_PALETTE.length];
          var nm = document.createElement("span");
          nm.className = "dg-sp-legend-name";
          nm.textContent = r.assignee_label || "—";
          nm.title = r.assignee_label || "";
          left.appendChild(sw);
          left.appendChild(nm);
          var val = document.createElement("span");
          val.className = "dg-sp-legend-val";
          var v = metricValue(r, "total_purchase_sum");
          var pct = sumAll > 0 ? Math.round((100 * v) / sumAll) : 0;
          val.textContent = fmtMoney(v) + " · " + pct + "%";
          row.appendChild(left);
          row.appendChild(val);
          root.appendChild(row);
        });
      }

      function destroySpChart(ch) {
        if (ch && typeof ch.destroy === "function") ch.destroy();
      }

      function sortAnalyticsRows(rows, metric) {
        return (rows || []).slice().sort(function (a, b) {
          return metricValue(b, metric) - metricValue(a, metric);
        });
      }

      function spChartTickCallback(v) {
        var n = Number(v);
        if (!Number.isFinite(n)) return v;
        if (analyticsState.metric === "total_purchase_sum") {
          if (n >= 1e6) {
            return (n / 1e6).toLocaleString("ru-RU", { maximumFractionDigits: 1 }) + " M";
          }
          if (n >= 1e3) {
            return (n / 1e3).toLocaleString("ru-RU", { maximumFractionDigits: 0 }) + " k";
          }
        }
        return n.toLocaleString("ru-RU");
      }

      function createSpHorizontalBarChart(Chart, canvas, sorted, labelKey, meta, isAssignee) {
        var labels = sorted.map(function (r) {
          return shortenLabel(r[labelKey], isAssignee ? 32 : 26);
        });
        var values = sorted.map(function (r) {
          return metricValue(r, analyticsState.metric);
        });
        var colors = sorted.map(function (_r, i) {
          return SP_CHART_PALETTE[i % SP_CHART_PALETTE.length];
        });
        return new Chart(canvas.getContext("2d"), {
          type: "bar",
          data: {
            labels: labels,
            datasets: [{
              label: meta.label,
              data: values,
              backgroundColor: function (ctx) {
                var c = colors[ctx.dataIndex % colors.length];
                var chart = ctx.chart;
                var g = chart.ctx.createLinearGradient(0, 0, chart.width || 320, 0);
                g.addColorStop(0, c);
                g.addColorStop(1, c + "66");
                return g;
              },
              borderColor: colors,
              borderWidth: 0,
              borderRadius: 8,
              borderSkipped: false,
              maxBarThickness: 18,
            }],
          },
          options: {
            indexAxis: "y",
            responsive: true,
            maintainAspectRatio: false,
            layout: { padding: { top: 0, bottom: 0, right: 6 } },
            animation: { duration: 520, easing: "easeOutQuart" },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: "rgba(15, 23, 42, 0.92)",
                padding: 10,
                cornerRadius: 8,
                callbacks: {
                  label: function (ctx) {
                    var row = sorted[ctx.dataIndex];
                    var lines = [
                      meta.label + ": " + meta.fmt(ctx.raw),
                      "SKU всего: " + fmtNum(row.products_total),
                      "SKU к закупке: " + fmtNum(row.products_to_purchase),
                      "Σ остаток: " + fmtNum(row.stock_total),
                    ];
                    if (isAssignee) {
                      lines.splice(1, 0, "Поставщиков: " + fmtNum(row.suppliers_count));
                    }
                    if (row.avg_fill_pct != null) lines.push("Наполняемость: " + fmtPct(row.avg_fill_pct));
                    return lines;
                  },
                },
              },
            },
            scales: {
              x: {
                beginAtZero: true,
                grid: { color: "rgba(148, 163, 184, 0.2)", drawBorder: false },
                ticks: {
                  color: "#64748b",
                  font: { size: 10 },
                  callback: spChartTickCallback,
                },
              },
              y: {
                grid: { display: false },
                ticks: { color: "#334155", font: { size: 10, weight: "500" } },
              },
            },
          },
        });
      }

      function renderAnalyticsCharts(assigneeRows, supplierRows) {
        var canvasBar = document.getElementById("dg-sp-chart-bars");
        var canvasSuppliers = document.getElementById("dg-sp-chart-suppliers-bars");
        var canvasDoughnut = document.getElementById("dg-sp-chart-doughnut");
        if (!canvasBar || !canvasDoughnut) return;
        var assigneeSorted = sortAnalyticsRows(assigneeRows, analyticsState.metric);
        var supplierSorted = sortAnalyticsRows(supplierRows, analyticsState.metric);
        var meta = metricMeta(analyticsState.metric);

        syncAnalyticsChartLayout(assigneeSorted.length, supplierSorted.length);

        loadChartJs()
          .then(function (Chart) {
            destroySpChart(analyticsState.barChart);
            destroySpChart(analyticsState.supplierBarChart);
            destroySpChart(analyticsState.doughnutChart);

            analyticsState.barChart = createSpHorizontalBarChart(
              Chart,
              canvasBar,
              assigneeSorted,
              "assignee_label",
              meta,
              true
            );

            if (canvasSuppliers) {
              if (supplierSorted.length) {
                analyticsState.supplierBarChart = createSpHorizontalBarChart(
                  Chart,
                  canvasSuppliers,
                  supplierSorted,
                  "supplier_label",
                  meta,
                  false
                );
              } else {
                var sctx = canvasSuppliers.getContext("2d");
                if (sctx) sctx.clearRect(0, 0, canvasSuppliers.width, canvasSuppliers.height);
              }
            }

            var doughnutSorted = sortAnalyticsRows(assigneeRows, "total_purchase_sum");
            var doughnutLabels = doughnutSorted.map(function (r) {
              return shortenLabel(r.assignee_label, 32);
            });
            var doughnutValues = doughnutSorted.map(function (r) {
              return metricValue(r, "total_purchase_sum");
            });
            var doughnutColors = doughnutSorted.map(function (_r, i) {
              return SP_CHART_PALETTE[i % SP_CHART_PALETTE.length];
            });
            analyticsState.doughnutChart = new Chart(canvasDoughnut.getContext("2d"), {
              type: "doughnut",
              data: {
                labels: doughnutLabels,
                datasets: [{
                  data: doughnutValues,
                  backgroundColor: doughnutColors.map(function (c) { return c + "e8"; }),
                  borderColor: "#ffffff",
                  borderWidth: 3,
                  hoverOffset: 10,
                  hoverBorderColor: "#f8fafc",
                }],
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: "58%",
                animation: { animateRotate: true, duration: 620 },
                plugins: {
                  legend: { display: false },
                  tooltip: {
                    backgroundColor: "rgba(15, 23, 42, 0.92)",
                    padding: 10,
                    cornerRadius: 8,
                    callbacks: {
                      label: function (ctx) {
                        var row = doughnutSorted[ctx.dataIndex];
                        var v = metricValue(row, "total_purchase_sum");
                        var total = doughnutValues.reduce(function (a, b) { return a + b; }, 0);
                        var pct = total > 0 ? Math.round((100 * v) / total) : 0;
                        return (row.assignee_label || "—") + ": " + fmtMoney(v) + " (" + pct + "%)";
                      },
                    },
                  },
                },
              },
            });
          })
          .catch(function (e) {
            var hint = document.getElementById("dg-sp-analytics-hint");
            if (hint) hint.textContent = (e && e.message) || "Графики недоступны";
          });
      }

      function renderAnalytics(payload) {
        analyticsState.payload = payload || null;
        var totals = payload && payload.totals ? payload.totals : {};
        var assigneeRows = payload && payload.by_assignee ? payload.by_assignee : [];
        var supplierRows = payload && payload.by_supplier ? payload.by_supplier : [];
        renderAnalyticsKpis(totals);
        renderAnalyticsHint(totals, assigneeRows, supplierRows);
        renderAssigneeLegend(assigneeRows);
        renderAnalyticsCharts(assigneeRows, supplierRows);
      }

      function loadAnalytics() {
        if (analyticsState.loading) return Promise.resolve();
        analyticsState.loading = true;
        setAnalyticsLoading(true);
        var p = new URLSearchParams();
        if (state.search) p.set("search", state.search);
        return fetch("/api/suppliers/analytics?" + p.toString(), {
          credentials: "same-origin",
          headers: spAuthHeaders(false),
        })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (j) {
            if (!j || j.success === false) throw new Error((j && j.error) || "Ошибка аналитики");
            renderAnalytics(j);
          })
          .catch(function (e) {
            renderAnalyticsKpis({});
            var hint = document.getElementById("dg-sp-analytics-hint");
            if (hint) hint.textContent = "Сводка: " + (e.message || e);
          })
          .finally(function () {
            analyticsState.loading = false;
            setAnalyticsLoading(false);
          });
      }

      function bindAnalyticsUi() {
        document.querySelectorAll("[data-dg-sp-metric]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var key = btn.getAttribute("data-dg-sp-metric");
            if (!key || key === analyticsState.metric) return;
            analyticsState.metric = key;
            document.querySelectorAll("[data-dg-sp-metric]").forEach(function (b) {
              b.classList.toggle("active", b.getAttribute("data-dg-sp-metric") === key);
            });
            if (analyticsState.payload) {
              renderAnalyticsCharts(
                analyticsState.payload.by_assignee || [],
                analyticsState.payload.by_supplier || []
              );
            }
          });
        });
        var ref = document.getElementById("dg-sp-analytics-refresh");
        if (ref) ref.addEventListener("click", function () { loadAnalytics(); });
        window.addEventListener("resize", function () {
          if (analyticsState.barChart) analyticsState.barChart.resize();
          if (analyticsState.supplierBarChart) analyticsState.supplierBarChart.resize();
          if (analyticsState.doughnutChart) analyticsState.doughnutChart.resize();
        });
      }

      /** Тон подсветки: чем выше наполняемость (остаток к неснижаемому), тем зеленее. */
      function stockFillTone(fillPct) {
        if (fillPct == null || !Number.isFinite(Number(fillPct))) return "neutral";
        var p = Number(fillPct);
        if (p >= 90) return "good";
        if (p >= 70) return "mid";
        return "bad";
      }

      function buildPurchaseToBuyUrl(row) {
        var name = String(row.supplier_key || row.supplier_name || "").trim();
        var p = new URLSearchParams();
        if (name) p.set("supplier", name);
        p.set("to_buy", "1");
        return "/purchase.html?" + p.toString();
      }

      var msOrderLogState = { supplierKey: "", selectedLogId: null };

      function spEscHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function spFmtLogDt(raw) {
        if (!raw) return "—";
        try {
          var d = new Date(raw);
          if (!Number.isFinite(d.getTime())) return String(raw);
          return d.toLocaleString("ru-RU", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch (e) {
          return String(raw);
        }
      }

      function spMsLogStatusBadge(status) {
        var s = String(status || "").toLowerCase();
        if (s === "success") return '<span class="badge bg-success">OK</span>';
        if (s === "failed") return '<span class="badge bg-danger">Ошибка</span>';
        return '<span class="badge bg-secondary">' + spEscHtml(status || "?") + "</span>";
      }

      function setMsOrderLogLoading(on) {
        var el = document.getElementById("dg-sp-ms-log-loading");
        if (el) el.classList.toggle("d-none", !on);
      }

      function closeSupplierMsOrderLogModal() {
        var ov = document.getElementById("dg-sp-ms-order-log-overlay");
        if (!ov) return;
        ov.style.display = "none";
        ov.setAttribute("aria-hidden", "true");
      }

      function renderMsOrderLogDetailPlaceholder(text) {
        var el = document.getElementById("dg-sp-ms-log-detail");
        if (!el) return;
        el.className = "dg-sp-ms-log-detail small text-muted border-start-lg ps-lg-3";
        el.textContent = text || "Выберите запись слева, чтобы увидеть шаги.";
      }

      function buildMsOrderLogStepsHtml(detail) {
        if (!detail || !detail.steps || !detail.steps.length) {
          return '<p class="text-muted mb-0">Нет пошагового журнала.</p>';
        }
        var html = "";
        detail.steps.forEach(function (st) {
          var fail = st.ok === false;
          html +=
            '<div class="dg-sp-ms-log-step' +
            (fail ? " dg-sp-ms-log-step-fail" : "") +
            '"><div><strong>' +
            spEscHtml(st.step || "?") +
            "</strong> " +
            (st.ok === true
              ? '<span class="text-success">✓</span>'
              : st.ok === false
                ? '<span class="text-danger">✗</span>'
                : '<span class="text-muted">…</span>') +
            ' <span class="text-muted">' +
            spEscHtml(st.at || "") +
            "</span></div>";
          var copy = Object.assign({}, st);
          delete copy.step;
          delete copy.at;
          delete copy.ok;
          if (Object.keys(copy).length) {
            html += "<pre>" + spEscHtml(JSON.stringify(copy, null, 2)) + "</pre>";
          }
          html += "</div>";
        });
        return html;
      }

      function downloadSupplierExport(row, kind, btn) {
        var supplierKey = String(row.supplier_key || row.supplier_name || "").trim();
        if (!supplierKey) return;
        var url =
          "/api/suppliers/export/" +
          encodeURIComponent(kind) +
          "?supplier_key=" +
          encodeURIComponent(supplierKey) +
          "&to_purchase=1";
        var label = kind === "purchaser" ? "Экспорт для закупщиков" : "Экспорт для поставщика";
        var run = function () {
          return fetch(url, { credentials: "same-origin", headers: spAuthHeaders(false) })
            .then(function (r) {
              if (!r.ok) {
                return r
                  .json()
                  .catch(function () {
                    return {};
                  })
                  .then(function (j) {
                    throw new Error((j && j.error) || "HTTP " + r.status);
                  });
              }
              var dispo = r.headers.get("Content-Disposition") || "";
              var fname = null;
              var mStar = /filename\*=UTF-8''([^;\s]+)/i.exec(dispo);
              if (mStar && mStar[1]) {
                try { fname = decodeURIComponent(mStar[1]); } catch (eDec) { fname = mStar[1]; }
              }
              if (!fname) {
                var m = /filename="([^"]+)"/i.exec(dispo);
                fname = m && m[1] ? m[1] : (kind === "purchaser" ? "zakupki.xls" : "postavshik.xls");
              }
              return r.blob().then(function (blob) {
                var a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = fname;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(function () {
                  URL.revokeObjectURL(a.href);
                }, 2000);
              });
            })
            .then(function () {
              if (window.DatagonNotify && window.DatagonNotify.toast) {
                window.DatagonNotify.toast({ type: "success", message: label + ": файл скачан" });
              }
            })
            .catch(function (e) {
              if (window.DatagonNotify && window.DatagonNotify.toast) {
                window.DatagonNotify.toast({ type: "danger", message: e.message || "Ошибка выгрузки" });
              }
            });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun && btn) {
          window.DatagonNotify.busyRun(btn, run);
        } else {
          run();
        }
      }

      function renderStockFillTriplet(row) {
        var positionsCount =
          row.min_stock_positions_count != null ? row.min_stock_positions_count : null;
        var minSumTotal = row.min_stock_total != null ? row.min_stock_total : null;
        var stockSum = row.stock_total != null ? row.stock_total : null;
        var fillPct =
          row.stock_fill_pct != null
            ? row.stock_fill_pct
            : row.stock_fill_pct_computed != null
              ? row.stock_fill_pct_computed
              : null;
        if (
          fillPct == null &&
          minSumTotal != null &&
          stockSum != null &&
          Number(minSumTotal) > 0
        ) {
          fillPct = Math.round((100 * Number(stockSum)) / Number(minSumTotal) * 100) / 100;
        }
        var wrap = document.createElement("span");
        var tone = stockFillTone(fillPct);
        wrap.className = "dg-sp-fill-triplet dg-sp-fill-" + tone;
        wrap.title =
          "Кол-во SKU с неснижаемым > 0 / Σ неснижаемый (шт) / Σ остаток факт (шт) / %\n" +
          "Процент = 100 × Σ остаток ÷ Σ неснижаемый" +
          (row.stock_fill_pct_stored != null
            ? "\nСохранённый вручную %: " + fmtPct(row.stock_fill_pct_stored)
            : "") +
          (row.stock_fill_gap_pct != null ? "\nРазрыв к 100%: " + fmtPct(row.stock_fill_gap_pct) : "");
        if (
          (positionsCount == null || positionsCount === "") &&
          (minSumTotal == null || minSumTotal === "") &&
          (stockSum == null || stockSum === "") &&
          fillPct == null
        ) {
          wrap.textContent = "—";
          return wrap;
        }
        function appendPart(text) {
          var sp = document.createElement("span");
          sp.textContent = text;
          wrap.appendChild(sp);
        }
        appendPart(fmtQty(positionsCount));
        wrap.appendChild(document.createTextNode(" / "));
        appendPart(fmtQty(minSumTotal));
        wrap.appendChild(document.createTextNode(" / "));
        appendPart(fmtQty(stockSum));
        wrap.appendChild(document.createTextNode(" / "));
        var pctTxt = document.createElement("span");
        pctTxt.className = "dg-sp-fill-pct";
        pctTxt.textContent = fmtPct(fillPct);
        wrap.appendChild(pctTxt);
        return wrap;
      }

      function updateFooter() {
        var total = state.total || 0;
        var shown = (state.rows || []).length;
        var pages = Math.max(1, Math.ceil(total / state.limit) || 1);
        var page = Math.floor(state.offset / state.limit) + 1;
        var stats = document.getElementById("dg-sp-footer-stats");
        if (stats) {
          stats.textContent =
            "Найдено: " + fmtNum(total) + "; страница " + page + "/" + pages + "; показано: " + fmtNum(shown);
        }
        var prev = document.getElementById("sp-btn-prev");
        var next = document.getElementById("sp-btn-next");
        if (prev) prev.disabled = state.offset <= 0 || state.loading;
        if (next) next.disabled = state.offset + state.limit >= total || state.loading;
      }

        p.set("offset", String(state.offset));

        if (state.search) p.set("search", state.search);
        fetch("/api/suppliers?" + p.toString(), { credentials: "same-origin", headers: spAuthHeaders(false) })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();

            state.rows = (j && j.data) || [];

      function renderCell(key, row, rowIndex) {
        if (key === "row_num") return document.createTextNode(String(state.offset + rowIndex + 1));
        if (key === "supplier_name") {
          return makePurchaseOpenLink(
            row,
            row.supplier_name || row.supplier_key || "—",
            true,
          );
        }
        if (key === "assigned_user") return buildAssigneeSelect(row, row.assigned_user_id);
        if (key === "comment") return bindEditableComment(row);
        if (key === "min_purchase_sum") {
          return bindEditableInput(row, "min_purchase_sum", "number", function (r) {
            return r.min_purchase_sum;
          });
        }
        if (key === "warehouse_fill_pct") {
          return bindEditableInput(row, "warehouse_fill_pct", "number", function (r) {
            return r.warehouse_fill_pct;
          });
        }
        if (key === "stock_fill_pct") {
          return renderStockFillTriplet(row);
        }
        if (key === "products_total") return document.createTextNode(fmtNum(row.products_total));
        if (key === "products_to_purchase") {
          var label = fmtNum(row.products_to_purchase) + " / " + fmtNum(row.purchase_pieces_total);
          return makePurchaseOpenLink(row, label, false);
        }
        if (key === "total_purchase_sum") return document.createTextNode(fmtMoney(row.total_purchase_sum));
        if (key === "export_stub") {
          var g = document.createElement("div");
          g.className = "d-flex gap-1 justify-content-center flex-nowrap";
          var canExport = Number(row.products_to_purchase || 0) > 0;
          var b1 = document.createElement("button");
          b1.type = "button";
          b1.className = "btn btn-sm btn-outline-secondary dg-sp-export-btn";
          b1.textContent = "📊";
          b1.title = "Экспорт для поставщика (позиции к закупке)";
          b1.setAttribute("data-dg-notify-start", "Формируем выгрузку для поставщика…");
          b1.disabled = !canExport;
          if (canExport) {
            b1.addEventListener("click", function (e) {
              e.preventDefault();
              e.stopPropagation();
              downloadSupplierExport(row, "supplier", b1);
            });
          }
          var b2 = document.createElement("button");
          b2.type = "button";
          b2.className = "btn btn-sm btn-outline-secondary dg-sp-export-btn";
          b2.textContent = "📥";
          b2.title = "Экспорт для закупщиков";
          b2.setAttribute("data-dg-notify-start", "Формируем выгрузку для закупщиков…");
          b2.disabled = !canExport;
          if (canExport) {
            b2.addEventListener("click", function (e) {
              e.preventDefault();
              e.stopPropagation();
              downloadSupplierExport(row, "purchaser", b2);
            });
          }
          g.appendChild(b1);
          g.appendChild(b2);
          return g;
        }
        if (key === "send_ms_stub") {
          var canSend = Number(row.products_to_purchase || 0) > 0;
          var gMs = document.createElement("div");
          gMs.className = "dg-sp-ms-actions";
          var bMs = document.createElement("button");
          bMs.type = "button";
          bMs.className = "btn btn-sm btn-outline-primary";
          bMs.textContent = "МС";
          bMs.title = "Создать заказ поставщику в МойСклад";
          bMs.setAttribute("data-dg-notify-start", "Создаём заказ в МойСклад…");
          bMs.disabled = !canSend;
          if (canSend) {
            bMs.addEventListener("click", function (e) {
              e.preventDefault();
              e.stopPropagation();
              sendPurchaseOrderToMs(row, bMs);
            });
          }
          var bLog = document.createElement("button");
          bLog.type = "button";
          bLog.className = "btn btn-sm btn-outline-secondary dg-sp-ms-log-btn";
          bLog.textContent = "📋";
          bLog.title = "Журнал заказов в МойСклад";
          bLog.setAttribute("data-dg-notify-start", "Открываем журнал МС…");
          bLog.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            openSupplierMsOrderLogModal(row);
          });
          gMs.appendChild(bMs);
          gMs.appendChild(bLog);
          return gMs;
        }
        if (key === "auto_mailing_stub") {
          var b2 = document.createElement("button");
          b2.type = "button";
          b2.className = "btn btn-sm btn-outline-secondary dg-sp-stub-btn";
          b2.title = "Скоро";
          b2.textContent = "—";
          b2.disabled = true;
          return b2;
        }
        if (key === "mailing_text_stub") {
          var t = document.createElement("span");
          t.className = "text-muted small";
          t.textContent = "—";
          return t;
        }
        return document.createTextNode("");
      }

      function buildThead() {
        var thead = document.getElementById("dg-sp-thead");
        if (!thead) return;
        thead.innerHTML = "";
        var tr = document.createElement("tr");
        var cols = SP_COLS.filter(function (p) { return visibleCols.indexOf(p[0]) >= 0; });
        cols.forEach(function (p) {
          var key = p[0];
          var label = p[1];
          var opts = COL_OPTS[key] || {};
          var th = document.createElement("th");
          th.scope = "col";
          var w = colWidths[key] || COL_MIN[key] || 90;
          th.style.width = w + "px";
          th.style.minWidth = w + "px";
          if (opts.headerLines && opts.headerLines.length) {
            th.className = (th.className ? th.className + " " : "") + "dg-sp-th-multiline";
            th.innerHTML = opts.headerLines.map(function (line) {
              return String(line)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            }).join("<br>");
          }
          if (SORTABLE.has(key) || SORTABLE.has(SORT_KEY_REMAP[key])) {
            th.className = (th.className ? th.className + " " : "") + "dg-sp-sortable";
            var sk = SORT_KEY_REMAP[key] || key;
            if (!opts.headerLines || !opts.headerLines.length) {
              if (sk === sortBy) th.textContent = label + (sortDir === "desc" ? " ▼" : " ▲");
              else th.textContent = label;
            }
            th.addEventListener("click", function (ev) {
              if (window.getSelection && window.getSelection().toString().trim()) return;
              if (sk === sortBy) sortDir = sortDir === "asc" ? "desc" : "asc";
              else { sortBy = sk; sortDir = "asc"; }
              state.offset = 0;
              load();
            });
          } else if (!opts.headerLines || !opts.headerLines.length) {
            th.textContent = label;
          }
          tr.appendChild(th);
        });
        thead.appendChild(tr);
      }

      function renderTable() {
        buildThead();
        var tbody = document.getElementById("dg-sp-tbody");
        if (!tbody) return;
        tbody.innerHTML = "";
        var cols = SP_COLS.filter(function (p) { return visibleCols.indexOf(p[0]) >= 0; });
        if (!state.rows.length) {
          var tr0 = document.createElement("tr");
          var td0 = document.createElement("td");
          td0.colSpan = Math.max(cols.length, 1);
          td0.className = "text-muted py-3";
          td0.textContent = "Нет поставщиков по текущим условиям.";
          tr0.appendChild(td0);
          tbody.appendChild(tr0);
          return;
        }
        state.rows.forEach(function (row, idx) {
          var tr = document.createElement("tr");
          tr.setAttribute("data-supplier-key", row.supplier_key);
          cols.forEach(function (p) {
            var td = document.createElement("td");
            var opts = COL_OPTS[p[0]] || {};
            if (p[0] === "comment") td.className = "dg-sp-td-comment";
            else if (opts.center) td.className = "text-center";
            var cell = renderCell(p[0], row, idx);
            if (cell) td.appendChild(cell);
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
      }

      function columnControls() {
        var wrap = document.getElementById("dg-sp-toolbox-panels");
        var colPanel = document.getElementById("dg-sp-columns-panel");
        var widthPanel = document.getElementById("dg-sp-widths-panel");
        var colList = document.getElementById("dg-sp-columns-list");
        var widthList = document.getElementById("dg-sp-widths-list");

        function syncWrap() {
          var open = (colPanel && colPanel.classList.contains("open")) ||
            (widthPanel && widthPanel.classList.contains("open"));
          if (wrap) wrap.classList.toggle("d-none", !open);
        }

        function renderColumnControls() {
          if (!colList) return;
          colList.innerHTML = "";
          SP_COLS.forEach(function (p) {
            var key = p[0];
            var label = document.createElement("label");
            var cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = visibleCols.indexOf(key) >= 0;
            cb.addEventListener("change", function () {
              if (cb.checked) {
                if (visibleCols.indexOf(key) < 0) visibleCols.push(key);
              } else {
                visibleCols = visibleCols.filter(function (k) { return k !== key; });
              }
              if (!visibleCols.length) visibleCols = [key];
              saveVisibleCols(visibleCols);
              renderTable();
            });
            label.appendChild(cb);
            label.appendChild(document.createTextNode(" " + p[1]));
            colList.appendChild(label);
          });
        }

        function renderWidthControls() {
          if (!widthList) return;
          widthList.innerHTML = "";
          SP_COLS.forEach(function (p) {
            var key = p[0];
            var label = document.createElement("label");
            label.textContent = p[1];
            var inp = document.createElement("input");
            inp.type = "number";
            inp.min = "40";
            inp.max = "800";
            inp.value = String(colWidths[key] || COL_MIN[key] || 90);
            inp.addEventListener("change", function () {
              colWidths[key] = parseInt(inp.value, 10) || COL_MIN[key] || 90;
              saveColWidths(colWidths);
              renderTable();
            });
            label.appendChild(inp);
            widthList.appendChild(label);
          });
        }

        renderColumnControls();
        renderWidthControls();

        var colToggle = document.getElementById("dg-sp-columns-toggle");
        var widthToggle = document.getElementById("dg-sp-widths-toggle");
        if (colToggle) {
          colToggle.addEventListener("click", function (e) {
            e.stopPropagation();
            if (widthPanel) widthPanel.classList.remove("open");
            if (colPanel) colPanel.classList.toggle("open");
            syncWrap();
          });
        }
        if (widthToggle) {
          widthToggle.addEventListener("click", function (e) {
            e.stopPropagation();
            if (colPanel) colPanel.classList.remove("open");
            if (widthPanel) widthPanel.classList.toggle("open");
            syncWrap();
          });
        }
        document.addEventListener("click", function () {
          if (colPanel) colPanel.classList.remove("open");
          if (widthPanel) widthPanel.classList.remove("open");
          syncWrap();
        });
        if (wrap) wrap.addEventListener("click", function (e) { e.stopPropagation(); });

        var colAll = document.getElementById("dg-sp-columns-all");
        var colNone = document.getElementById("dg-sp-columns-none");
        var colDef = document.getElementById("dg-sp-columns-default");
        if (colAll) colAll.addEventListener("click", function () {
          visibleCols = DEFAULT_VISIBLE.slice();
          saveVisibleCols(visibleCols);
          renderColumnControls();
          renderTable();
        });
        if (colNone) colNone.addEventListener("click", function () {
          visibleCols = ["supplier_name"];
          saveVisibleCols(visibleCols);
          renderColumnControls();
          renderTable();
        });
        if (colDef) colDef.addEventListener("click", function () {
          visibleCols = DEFAULT_VISIBLE.slice();
          saveVisibleCols(visibleCols);
          renderColumnControls();
          renderTable();
        });
        var widthDef = document.getElementById("dg-sp-widths-default");
        if (widthDef) widthDef.addEventListener("click", function () {
          colWidths = {};
          saveColWidths(colWidths);
          renderWidthControls();
          renderTable();
        });
      }

      function bindHeaderSearchMirror() {
        var main = document.getElementById("sp-f-search");
        var mirror = document.getElementById("dg-sp-table-search-mirror");
        if (!main || !mirror) return;
        var syncing = false;
        function sync(a, b) {
          if (syncing) return;
          syncing = true;
          b.value = a.value;
          state.pending.search = String(a.value || "").trim();
          syncDirtyApply();
          syncing = false;
        }
        main.addEventListener("input", function () { sync(main, mirror); });
        mirror.addEventListener("input", function () { sync(mirror, main); });
        function applyFrom(el) {
          sync(el, el === main ? mirror : main);
          commitFilters();
        }
        main.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); applyFrom(main); }
          if (e.key === "Escape") {
            main.value = "";
            mirror.value = "";
            state.pending.search = "";
            commitFilters();
          }
        });
        mirror.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); applyFrom(mirror); }
          if (e.key === "Escape") {
            main.value = "";
            mirror.value = "";
            state.pending.search = "";
            commitFilters();
          }
        });
      }

      function bindAnalyticsCollapse() {
        var key = "datagon_suppliers_analytics_collapsed_v1";
        var body = document.getElementById("dg-sp-analytics-body");
        var btn = document.getElementById("dg-sp-analytics-toggle");
        if (!body || !btn) return;
        var collapsed = false;
        try { collapsed = window.localStorage.getItem(key) === "1"; } catch (e) {}
        function apply() {
          body.style.display = collapsed ? "none" : "";
          btn.textContent = collapsed ? "Развернуть" : "Свернуть";
        }
        apply();
        btn.addEventListener("click", function () {
          collapsed = !collapsed;
          try { window.localStorage.setItem(key, collapsed ? "1" : "0"); } catch (e) {}
          apply();
        });
      }

      function bindFiltersCollapse() {
        var key = "datagon_suppliers_filters_collapsed_v1";
        var body = document.getElementById("dg-sp-filters-body");
        var btn = document.getElementById("dg-sp-filters-toggle");
        if (!body || !btn) return;
        var collapsed = false;
        try { collapsed = window.localStorage.getItem(key) === "1"; } catch (e) {}
        function apply() {
          body.style.display = collapsed ? "none" : "";
          btn.textContent = collapsed ? "Развернуть" : "Свернуть";
        }
        apply();
        btn.addEventListener("click", function () {
          collapsed = !collapsed;
          try { window.localStorage.setItem(key, collapsed ? "1" : "0"); } catch (e) {}
          apply();
        });
      }

      function bindTableCardCollapse() {
        var key = "dg.suppliers.table-card.collapsed.v1";
        var body = document.getElementById("dg-sp-table-body");
        var btn = document.getElementById("dg-sp-table-toggle");
        if (!body || !btn) return;
        var collapsed = false;
        try { collapsed = window.localStorage.getItem(key) === "1"; } catch (e) {}
        function apply() {
          body.style.display = collapsed ? "none" : "";
          btn.textContent = collapsed ? "Развернуть" : "Свернуть";
        }
        apply();
        btn.addEventListener("click", function () {
          collapsed = !collapsed;
          try { window.localStorage.setItem(key, collapsed ? "1" : "0"); } catch (e) {}
          apply();
        });
      }

      function bindPagination() {
        function syncLimit(v) {
          state.limit = v;
          state.offset = 0;
          var a = document.getElementById("sp-f-limit");
          var b = document.getElementById("sp-footer-limit");
          if (a) a.value = String(v);
          if (b) b.value = String(v);
        }
        var limA = document.getElementById("sp-f-limit");
        var limB = document.getElementById("sp-footer-limit");
        if (limA) limA.addEventListener("change", function () {
          syncLimit(parseInt(limA.value, 10) || 100);
          load();
        });
        if (limB) limB.addEventListener("change", function () {
          syncLimit(parseInt(limB.value, 10) || 100);
          load();
        });
        var prev = document.getElementById("sp-btn-prev");
        var next = document.getElementById("sp-btn-next");
        if (prev) prev.addEventListener("click", function () {
          state.offset = Math.max(0, state.offset - state.limit);
          load();
        });
        if (next) next.addEventListener("click", function () {
          if (state.offset + state.limit < state.total) {
            state.offset += state.limit;
            load();
          }
        });
      }

      function bindActions() {
        var apply = document.getElementById("sp-apply");
        var reset = document.getElementById("sp-reset");
        var refresh = document.getElementById("sp-refresh");
        if (apply) apply.addEventListener("click", commitFilters);
        if (refresh) refresh.addEventListener("click", load);
        if (reset) reset.addEventListener("click", function () {
          var main = document.getElementById("sp-f-search");
          var mirror = document.getElementById("dg-sp-table-search-mirror");
          if (main) main.value = "";
          if (mirror) mirror.value = "";
          state.pending.search = "";
          state.search = "";
          state.offset = 0;
          syncLimitUi(100);
          syncDirtyApply();
          load();
        });
        var search = document.getElementById("sp-f-search");
        if (search) search.addEventListener("input", function () {
          state.pending.search = String(search.value || "").trim();
          syncDirtyApply();
        });
      }

      function syncLimitUi(v) {
        state.limit = v;
        var a = document.getElementById("sp-f-limit");
        var b = document.getElementById("sp-footer-limit");
        if (a) a.value = String(v);
        if (b) b.value = String(v);
      }

      document.addEventListener("DOMContentLoaded", function () {
        bindActions();
        bindAnalyticsUi();
        bindAnalyticsCollapse();
        bindHeaderSearchMirror();
        bindFiltersCollapse();
        bindTableCardCollapse();
        bindPagination();
        bindSupplierMsOrderLogModal();
        columnControls();
        state.pending.search = "";
        loadAssignees().then(function () { load(); });
      });
    })();
  </script>
