  <script>
    (function () {
      var SP_COLS = [
        ["row_num", "№", { center: true }],
        ["supplier_name", "Поставщик"],
        ["sales_rank", "Рейтинг продаж", { center: true, headerLines: ["Рейтинг", "продаж (90д)"] }],
        ["assigned_user", "Привязан сотрудник", { editable: true }],
        ["comment", "Комментарий", { editable: true, headerLines: ["Комментар", "ий"] }],
        ["min_purchase_sum", "Мин. сумма закупки", { center: true, editable: true }],
        ["warehouse_fill_pct", "Наполняемость склада", { center: true, editable: true }],
        ["stock_fill_pct", "Наполняемость % (Кол-во Несн/Несниж сумм./Ост.факт/%)", { center: true }],
        ["products_total", "Кол-во товаров всего", { center: true }],
        ["products_to_purchase", "Кол-во товаров К закупке", { center: true }],
        ["total_purchase_sum", "Общая сумма закупки", { center: true }],
        ["procurement_attention", "Внимание", { center: true, headerLines: ["Вни", "мание"] }],
        ["last_ms_order_at", "Последний заказ в МС", { center: true, headerLines: ["Последний", "заказ в МС"] }],
        ["export_stub", "Экспорт", { center: true, stub: true }],
        ["send_ms_stub", "Отправить заказ в МС", { center: true }],
        ["auto_mailing_stub", "Авто рассылка", { center: true, stub: true }],
        ["mailing_text_stub", "Текст для рассылки", { center: true, stub: true }],
      ];

      var COL_OPTS = {};
      SP_COLS.forEach(function (p) { COL_OPTS[p[0]] = p[2] || {}; });

      var SORTABLE = new Set([
        "supplier_name", "sales_rank", "products_total", "products_to_purchase",
        "total_purchase_sum", "min_purchase_sum", "warehouse_fill_pct", "stock_fill_pct",
        "assigned_user_name", "last_ms_order_at",
      ]);
      var SORT_KEY_REMAP = { assigned_user: "assigned_user_name" };

      var DEFAULT_VISIBLE = SP_COLS.map(function (p) { return p[0]; });

      var COL_MIN = {
        row_num: 44,
        supplier_name: 160,
        sales_rank: 118,
        assigned_user: 150,
        comment: 160,
        min_purchase_sum: 110,
        warehouse_fill_pct: 120,
        stock_fill_pct: 260,
        products_total: 100,
        products_to_purchase: 120,
        total_purchase_sum: 130,
        procurement_attention: 150,
        last_ms_order_at: 168,
        export_stub: 90,
        send_ms_stub: 118,
        auto_mailing_stub: 90,
        mailing_text_stub: 120,
      };

      var state = {
        search: "",
        assigned_user: "",
        attention_only: false,
        limit: 100,
        offset: 0,
        sort_by: "supplier_name",
        sort_dir: "asc",
        pending: { search: "", assigned_user: "", attention_only: false },
        attentionThresholds: { warn_days: 30, danger_days: 60 },
        salesRankTotal: null,
        total: 0,
        rows: [],
        assignees: [],
        filterAssignees: [],
        loading: false,
      };

      var sortBy = "supplier_name";
      var sortDir = "asc";

      var FLOATING_HEADER_OFFSET_PX = 2;
      var FLOATING_HEADER_START_EPS_PX = 3;
      var spFloatingHeaderRaf = 0;
      var spFloatingLastScrollTs = 0;

      function updateSpStickyTopVar() {
        var app = document.querySelector(".app-container");
        var header = document.querySelector(".app-header");
        var fixed = Boolean(app && app.classList && app.classList.contains("fixed-header"));
        var top = 0;
        if (fixed && header && header.getBoundingClientRect) {
          var rect = header.getBoundingClientRect();
          top = rect && rect.height ? rect.height : 60;
        }
        document.documentElement.style.setProperty("--dg-table-sticky-top", top + "px");
      }

      function getSpStickyTopPx() {
        var app = document.querySelector(".app-container");
        var header = document.querySelector(".app-header");
        var fixed = Boolean(app && app.classList && app.classList.contains("fixed-header"));
        if (!fixed) return 0;
        if (!header || !header.getBoundingClientRect) return 60;
        var rect = header.getBoundingClientRect();
        var h = rect && rect.height ? rect.height : 60;
        return h > 0 ? h : 60;
      }

      function clearSpHeaderFloatStyles(thead, row) {
        if (!thead) return;
        thead.style.transform = "";
        thead.style.position = "";
        thead.style.zIndex = "";
        thead.style.willChange = "";
        thead.removeAttribute("data-dg-floating");
        if (!row) return;
        row.style.transform = "";
        row.style.position = "";
        row.style.zIndex = "";
        row.style.willChange = "";
      }

      function captureSpTheadBaseTop() {
        var thead = document.getElementById("dg-sp-thead");
        if (!thead) return;
        var row = thead.querySelector("tr");
        if (!row) return;
        clearSpHeaderFloatStyles(thead, row);
        var rect = row.getBoundingClientRect();
        var absTop =
          (window.scrollY || window.pageYOffset || 0) + (rect && rect.top ? rect.top : 0);
        thead.setAttribute("data-dg-base-top", String(absTop));
      }

      function updateSpFloatingHeaderFallback() {
        var thead = document.getElementById("dg-sp-thead");
        if (!thead) return;
        var table = thead.closest("table");
        if (!table || !table.getBoundingClientRect) return;
        var row = thead.querySelector("tr");
        if (!row) return;

        var y = window.scrollY || window.pageYOffset || 0;
        var headerTop = getSpStickyTopPx();
        var tableRect = table.getBoundingClientRect();
        var tableBottom = tableRect.bottom + y;
        var rowRect = row.getBoundingClientRect();
        var rowHeight = rowRect && rowRect.height ? rowRect.height : 0;
        var isFloating = thead.getAttribute("data-dg-floating") === "1" || !!row.style.transform;

        /* Пока шапка не «плывёт», держим base-top в актуальном месте (графики аналитики
           подгружаются позже renderTable и сдвигают таблицу — иначе shift завышен). */
        if (!isFloating) {
          var liveBase = y + (rowRect && rowRect.top ? rowRect.top : 0);
          if (Number.isFinite(liveBase) && liveBase > 0) {
            thead.setAttribute("data-dg-base-top", String(liveBase));
          }
        }

        var baseTopAbs = Number(thead.getAttribute("data-dg-base-top") || 0);
        if (!Number.isFinite(baseTopAbs) || baseTopAbs <= 0) return;

        var headerLine = y + headerTop;
        var start = baseTopAbs + FLOATING_HEADER_START_EPS_PX;
        var end = tableBottom - rowHeight;
        if (headerLine <= start || headerLine >= end) {
          if (row.style.transform || thead.getAttribute("data-dg-floating")) {
            clearSpHeaderFloatStyles(thead, row);
          }
          return;
        }

        var zoomAwareOffset = FLOATING_HEADER_OFFSET_PX;
        var dpr = window.devicePixelRatio || 1;
        if (Math.abs(dpr - 1) < 0.03) zoomAwareOffset = FLOATING_HEADER_OFFSET_PX - 3;
        var shift = Math.max(0, headerLine - start - zoomAwareOffset);
        var shiftPx = Number(shift.toFixed(3));
        var nextTransform = "translate3d(0," + shiftPx + "px,0)";
        if (row.style.transform !== nextTransform) {
          thead.style.transform = "";
          thead.style.position = "";
          thead.style.zIndex = "";
          thead.style.willChange = "";
          row.style.transform = nextTransform;
          row.style.position = "relative";
          row.style.zIndex = "25";
          row.style.willChange = "transform";
          thead.setAttribute("data-dg-floating", "1");
        }
      }

      function spFloatingHeaderTick(ts) {
        spFloatingHeaderRaf = 0;
        updateSpFloatingHeaderFallback();
        if (ts - spFloatingLastScrollTs < 140) {
          spFloatingHeaderRaf = requestAnimationFrame(spFloatingHeaderTick);
        }
      }

      function scheduleSpFloatingHeaderUpdate() {
        spFloatingLastScrollTs = performance.now();
        if (spFloatingHeaderRaf) return;
        spFloatingHeaderRaf = requestAnimationFrame(spFloatingHeaderTick);
      }

      function onScrollSpFloatingHeader() {
        scheduleSpFloatingHeaderUpdate();
      }

      function spRefreshFloatingAfterLayout() {
        requestAnimationFrame(function () {
          captureSpTheadBaseTop();
          scheduleSpFloatingHeaderUpdate();
        });
      }

      function spAuthHeaders(withJson) {
        var headers = {};
        try {
          var username = window.localStorage.getItem("currentUser");
          var token = window.localStorage.getItem("authToken");
          if (username) headers["x-auth-username"] = username;
          if (token) headers["x-auth-token"] = token;
        } catch (e) {}
        if (withJson) headers["Content-Type"] = "application/json";
        return headers;
      }

      function fmtNum(n, opts) {
        if (window.DatagonFmt && window.DatagonFmt.formatNumber) {
          return window.DatagonFmt.formatNumber(n, opts);
        }
        if (n == null || n === "") return "—";
        var x = Number(n);
        if (!Number.isFinite(x)) return String(n);
        return x.toLocaleString("ru-RU", { maximumFractionDigits: (opts && opts.maxFractionDigits) || 2 });
      }

      /** Число для ячейки: 0 показываем как «0», не «—». */
      function fmtQty(n) {
        if (n == null || n === "" || !Number.isFinite(Number(n))) return "—";
        return fmtNum(n);
      }

      function fmtMoney(n) {
        if (window.DatagonFmt && window.DatagonFmt.formatMoney) return window.DatagonFmt.formatMoney(n);
        if (n == null || !Number.isFinite(Number(n))) return "—";
        return fmtNum(n) + " ₽";
      }

      function fmtPct(n) {
        if (n == null || !Number.isFinite(Number(n))) return "—";
        return fmtNum(n, { maxFractionDigits: 2 }) + "%";
      }

      function parseRuNumberInput(raw) {
        if (window.DatagonFmt && window.DatagonFmt.parseNumberInput) {
          return window.DatagonFmt.parseNumberInput(raw);
        }
        if (raw == null || String(raw).trim() === "") return null;
        var s = String(raw).replace(/\s/g, "").replace(",", ".");
        var x = Number(s);
        return Number.isFinite(x) ? x : null;
      }

      var SP_CHART_PALETTE = [
        "#5b6eea", "#22c55e", "#f59e0b", "#ef4444", "#8b5cf6", "#06b6d4",
        "#ec4899", "#14b8a6", "#f97316", "#64748b", "#0ea5e9", "#a855f7",
      ];

      function spChartBarHeight(rowCount) {
        var n = Math.max(1, rowCount || 1);
        return Math.min(168, Math.max(88, n * 28 + 24));
      }

      function spChartBarHeightSuppliers(rowCount) {
        var n = Math.max(1, rowCount || 1);
        return Math.min(200, Math.max(96, n * 22 + 20));
      }

      function syncAnalyticsChartLayout(assigneeCount, supplierCount) {
        var barH = spChartBarHeight(assigneeCount);
        var wrap = document.querySelector("#dg-sp-chart-bars");
        if (wrap && wrap.parentElement) wrap.parentElement.style.height = barH + "px";
        var supWrap = document.querySelector("#dg-sp-chart-suppliers-bars");
        if (supWrap && supWrap.parentElement) {
          supWrap.parentElement.style.height = spChartBarHeightSuppliers(supplierCount) + "px";
        }
        var doughnutWrap = document.querySelector(".dg-sp-doughnut-wrap");
        if (doughnutWrap) {
          doughnutWrap.style.height = "100px";
          doughnutWrap.style.minHeight = "100px";
          doughnutWrap.style.maxHeight = "100px";
        }
      }

      var analyticsState = {
        metric: "total_purchase_sum",
        payload: null,
        loading: false,
        barChart: null,
        supplierBarChart: null,
        doughnutChart: null,
        msOrderChart: null,
      };

      function fmtDateTimeSp(v) {
        if (!v) return "—";
        try {
          var d = new Date(v);
          if (isNaN(d.getTime())) return String(v);
          return d.toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" });
        } catch (e) {
          return String(v);
        }
      }

      function renderSalesRankCell(row) {
        var wrap = document.createElement("div");
        wrap.className = "dg-sp-sales-rank text-center small";
        var rank = row.sales_rank != null ? Number(row.sales_rank) : null;
        var total =
          row.sales_rank_total != null
            ? Number(row.sales_rank_total)
            : state.salesRankTotal != null
              ? Number(state.salesRankTotal)
              : null;
        if (
          rank == null ||
          total == null ||
          !Number.isFinite(rank) ||
          !Number.isFinite(total) ||
          rank < 1 ||
          total < 1
        ) {
          wrap.innerHTML = '<span class="text-muted">—</span>';
          wrap.title =
            state.salesRankError ||
            "Место в рейтинге по выручке отгрузок МС за 90 дней. Если прочерк — обновите страницу или перезапустите сервер после обновления.";
          return wrap;
        }
        var main = document.createElement("span");
        main.className = "fw-semibold";
        main.textContent = rank + " из " + total;
        var rev = row.sales_revenue_90d != null ? Number(row.sales_revenue_90d) : null;
        var tip =
          "Место в рейтинге по выручке отгрузок МС за последние 90 дней (как на странице «Анализ поставщиков»).";
        if (rev != null && Number.isFinite(rev)) {
          tip += " Выручка: " + fmtMoney(rev) + ".";
        }
        wrap.title = tip;
        main.title = tip;
        wrap.appendChild(main);
        return wrap;
      }

      function renderProcurementAttentionBadge(row) {
        var att = row.procurement_attention || {};
        var wrap = document.createElement("div");
        wrap.className = "dg-sp-attention-cell";
        var level = String(att.level || "none");
        if (level === "none" || !att.label) {
          wrap.innerHTML = '<span class="text-muted small">—</span>';
          return wrap;
        }
        var badge = document.createElement("span");
        badge.className =
          "badge dg-sp-attention-badge " +
          (level === "danger" ? "bg-danger" : level === "warning" ? "bg-warning text-dark" : "bg-secondary");
        badge.textContent = att.label;
        badge.title = att.label;
        wrap.appendChild(badge);
        return wrap;
      }

      var chartJsPromise = null;
      function loadChartJs() {
        if (window.Chart && typeof window.Chart === "function") return Promise.resolve(window.Chart);
        if (chartJsPromise) return chartJsPromise;
        chartJsPromise = new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js";
          s.async = true;
          s.onload = function () { resolve(window.Chart); };
          s.onerror = function () { reject(new Error("Не удалось загрузить Chart.js")); };
          document.head.appendChild(s);
        });
        return chartJsPromise;
      }

      function metricMeta(key) {
        switch (key) {
          case "products_to_purchase":
            return { label: "SKU к закупке", fmt: function (v) { return fmtNum(v); } };
          case "stock_total":
            return { label: "Σ остаток (шт)", fmt: function (v) { return fmtNum(v); } };
          case "suppliers_count":
            return { label: "Поставщиков", fmt: function (v) { return fmtNum(v); } };
          case "ms_orders_count":
            return { label: "Заказов в МС", fmt: function (v) { return fmtNum(v); } };
          default:
            return { label: "Σ к закупке", fmt: function (v) { return fmtMoney(v); } };
        }
      }

      function metricValue(row, key) {
        if (key === "ms_orders_count") {
          var n0 = Number(row && row.orders_count != null ? row.orders_count : 0);
          return Number.isFinite(n0) ? n0 : 0;
        }
        var n = Number(row && row[key] != null ? row[key] : 0);
        return Number.isFinite(n) ? n : 0;
      }

      function shortenLabel(name, maxLen) {
        var s = String(name || "").trim();
        if (s.length <= (maxLen || 28)) return s || "—";
        return s.slice(0, (maxLen || 28) - 1) + "…";
      }

      function setAnalyticsLoading(on) {
        var el = document.getElementById("dg-sp-analytics-loading");
        if (el) el.classList.toggle("d-none", !on);
      }

      function renderAnalyticsKpis(totals, msOrders) {
        var t = totals || {};
        var map = {
          "dg-sp-kpi-suppliers": t.suppliers_count,
          "dg-sp-kpi-products": t.products_total,
          "dg-sp-kpi-to-buy": t.products_to_purchase,
          "dg-sp-kpi-stock": t.stock_total,
          "dg-sp-kpi-sum": t.total_purchase_sum,
        };
        Object.keys(map).forEach(function (id) {
          var el = document.getElementById(id);
          if (!el) return;
          if (id === "dg-sp-kpi-sum") el.textContent = fmtMoney(map[id]);
          else el.textContent = fmtNum(map[id]);
        });
        var msEl = document.getElementById("dg-sp-kpi-ms-orders");
        if (msEl) {
          msEl.textContent = fmtNum(
            msOrders && msOrders.success_orders_total != null
              ? msOrders.success_orders_total
              : 0
          );
        }
        var periodEl = document.getElementById("dg-sp-kpi-ms-period");
        var chartPeriodEl = document.getElementById("dg-sp-ms-chart-period");
        var days = msOrders && msOrders.period_days ? msOrders.period_days : 90;
        if (periodEl) periodEl.textContent = days + " дн.";
        if (chartPeriodEl) chartPeriodEl.textContent = "(" + days + " дн.)";
        var attEl = document.getElementById("dg-sp-kpi-attention");
        if (attEl) {
          attEl.textContent = fmtNum(t.procurement_attention_total != null ? t.procurement_attention_total : 0);
        }
        var attSub = document.getElementById("dg-sp-kpi-attention-sub");
        if (attSub) {
          var w = state.attentionThresholds.warn_days || 30;
          var d = state.attentionThresholds.danger_days || 60;
          attSub.textContent =
            "нет заказа ≥" + w + " дн. при Σ к закупке > 0 и сумме ≥ мин. порога";
        }
      }

      function renderAnalyticsHint(totals, assigneeRows, supplierRows) {
        var hint = document.getElementById("dg-sp-analytics-hint");
        if (!hint) return;
        var parts = [];
        var meta = metricMeta(analyticsState.metric);
        if (totals && totals.assignees_count != null) {
          parts.push("Сотрудников в сводке: " + fmtNum(totals.assignees_count));
        }
        if (totals && Number(totals.unassigned_suppliers) > 0) {
          parts.push("Без привязки: " + fmtNum(totals.unassigned_suppliers) + " поставщ.");
        }
        if (totals && totals.avg_fill_pct != null) {
          parts.push("Средняя наполняемость: " + fmtPct(totals.avg_fill_pct));
        }
        if (totals && Number(totals.procurement_attention_total) > 0) {
          parts.push(
            "Требуют внимания: " +
              fmtNum(totals.procurement_attention_total) +
              " (никогда: " +
              fmtNum(totals.procurement_attention_never) +
              ", ≥" +
              (state.attentionThresholds.danger_days || 60) +
              " дн.: " +
              fmtNum(totals.procurement_attention_stale_danger) +
              ")"
          );
        }
        if (assigneeRows && assigneeRows.length) {
          var topA = assigneeRows.slice().sort(function (a, b) {
            return metricValue(b, analyticsState.metric) - metricValue(a, analyticsState.metric);
          })[0];
          parts.push(
            "Лидер (сотрудники): " +
              (topA.assignee_label || "—") +
              " (" +
              meta.fmt(metricValue(topA, analyticsState.metric)) +
              ")"
          );
        }
        if (supplierRows && supplierRows.length) {
          var topS = supplierRows.slice().sort(function (a, b) {
            return metricValue(b, analyticsState.metric) - metricValue(a, analyticsState.metric);
          })[0];
          parts.push(
            "Лидер (поставщик): " +
              (topS.supplier_label || "—") +
              " (" +
              meta.fmt(metricValue(topS, analyticsState.metric)) +
              ")"
          );
        }
        hint.textContent = parts.join(" · ");
      }

      function renderAssigneeLegend(rows) {
        var root = document.getElementById("dg-sp-assignee-legend");
        if (!root) return;
        root.textContent = "";
        var sumAll = 0;
        (rows || []).forEach(function (r) {
          sumAll += metricValue(r, "total_purchase_sum");
        });
        (rows || []).slice(0, 5).forEach(function (r, i) {
          var row = document.createElement("div");
          row.className = "dg-sp-legend-row";
          var left = document.createElement("span");
          left.style.display = "inline-flex";
          left.style.alignItems = "center";
          left.style.gap = "6px";
          left.style.minWidth = "0";
          left.style.flex = "1";
          var sw = document.createElement("span");
          sw.className = "dg-sp-legend-swatch";
          sw.style.background = SP_CHART_PALETTE[i % SP_CHART_PALETTE.length];
          var nm = document.createElement("span");
          nm.className = "dg-sp-legend-name";
          nm.textContent = r.assignee_label || "—";
          nm.title = r.assignee_label || "";
          left.appendChild(sw);
          left.appendChild(nm);
          var val = document.createElement("span");
          val.className = "dg-sp-legend-val";
          var v = metricValue(r, "total_purchase_sum");
          var pct = sumAll > 0 ? Math.round((100 * v) / sumAll) : 0;
          val.textContent = fmtMoney(v) + " · " + pct + "%";
          row.appendChild(left);
          row.appendChild(val);
          root.appendChild(row);
        });
      }

      function destroySpChart(ch) {
        if (ch && typeof ch.destroy === "function") ch.destroy();
      }

      function sortAnalyticsRows(rows, metric) {
        return (rows || []).slice().sort(function (a, b) {
          return metricValue(b, metric) - metricValue(a, metric);
        });
      }

      function spChartTickCallback(v) {
        var n = Number(v);
        if (!Number.isFinite(n)) return v;
        if (analyticsState.metric === "total_purchase_sum") {
          if (n >= 1e6) {
            return (n / 1e6).toLocaleString("ru-RU", { maximumFractionDigits: 1 }) + " M";
          }
          if (n >= 1e3) {
            return (n / 1e3).toLocaleString("ru-RU", { maximumFractionDigits: 0 }) + " k";
          }
        }
        return n.toLocaleString("ru-RU");
      }

      function createSpHorizontalBarChart(Chart, canvas, sorted, labelKey, meta, isAssignee) {
        var labels = sorted.map(function (r) {
          return shortenLabel(r[labelKey], isAssignee ? 32 : 26);
        });
        var values = sorted.map(function (r) {
          return metricValue(r, analyticsState.metric);
        });
        var colors = sorted.map(function (_r, i) {
          return SP_CHART_PALETTE[i % SP_CHART_PALETTE.length];
        });
        return new Chart(canvas.getContext("2d"), {
          type: "bar",
          data: {
            labels: labels,
            datasets: [{
              label: meta.label,
              data: values,
              backgroundColor: function (ctx) {
                var c = colors[ctx.dataIndex % colors.length];
                var chart = ctx.chart;
                var g = chart.ctx.createLinearGradient(0, 0, chart.width || 320, 0);
                g.addColorStop(0, c);
                g.addColorStop(1, c + "66");
                return g;
              },
              borderColor: colors,
              borderWidth: 0,
              borderRadius: 8,
              borderSkipped: false,
              maxBarThickness: 18,
            }],
          },
          options: {
            indexAxis: "y",
            responsive: true,
            maintainAspectRatio: false,
            layout: { padding: { top: 0, bottom: 0, right: 6 } },
            animation: { duration: 520, easing: "easeOutQuart" },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: "rgba(15, 23, 42, 0.92)",
                padding: 10,
                cornerRadius: 8,
                callbacks: {
                  label: function (ctx) {
                    var row = sorted[ctx.dataIndex];
                    var lines = [
                      meta.label + ": " + meta.fmt(ctx.raw),
                      "SKU всего: " + fmtNum(row.products_total),
                      "SKU к закупке: " + fmtNum(row.products_to_purchase),
                      "Σ остаток: " + fmtNum(row.stock_total),
                    ];
                    if (isAssignee) {
                      if (row.orders_count != null) {
                        lines.splice(1, 0, "Поставщиков: " + fmtNum(row.suppliers_count));
                        lines.push("Позиций в заказах: " + fmtNum(row.positions_total));
                      } else {
                        lines.splice(1, 0, "Поставщиков: " + fmtNum(row.suppliers_count));
                      }
                    }
                    if (row.avg_fill_pct != null) lines.push("Наполняемость: " + fmtPct(row.avg_fill_pct));
                    return lines;
                  },
                },
              },
            },
            scales: {
              x: {
                beginAtZero: true,
                grid: { color: "rgba(148, 163, 184, 0.2)", drawBorder: false },
                ticks: {
                  color: "#64748b",
                  font: { size: 10 },
                  callback: spChartTickCallback,
                },
              },
              y: {
                grid: { display: false },
                ticks: { color: "#334155", font: { size: 10, weight: "500" } },
              },
            },
          },
        });
      }

      function renderAnalyticsCharts(assigneeRows, supplierRows, msOrders) {
        var canvasBar = document.getElementById("dg-sp-chart-bars");
        var canvasSuppliers = document.getElementById("dg-sp-chart-suppliers-bars");
        var canvasDoughnut = document.getElementById("dg-sp-chart-doughnut");
        if (!canvasBar || !canvasDoughnut) return;
        var metric = analyticsState.metric;
        var barRows = assigneeRows;
        var barLabelKey = "assignee_label";
        if (metric === "ms_orders_count") {
          barRows = (msOrders && msOrders.by_creator) || [];
          barLabelKey = "creator_label";
        }
        var assigneeSorted = sortAnalyticsRows(barRows, metric);
        var supplierSorted = sortAnalyticsRows(supplierRows, metric);
        var meta = metricMeta(metric);
        var barTitle = document.querySelector(
          "#dg-sp-chart-bars"
        );
        if (barTitle && barTitle.closest(".dg-sp-chart-panel")) {
          var tEl = barTitle.closest(".dg-sp-chart-panel").querySelector(".dg-sp-chart-title");
          if (tEl) {
            tEl.textContent =
              metric === "ms_orders_count"
                ? "Заказы в МС по сотрудникам (те же фильтры)"
                : "Распределение по сотрудникам";
          }
        }

        syncAnalyticsChartLayout(assigneeSorted.length, supplierSorted.length);

        loadChartJs()
          .then(function (Chart) {
            destroySpChart(analyticsState.barChart);
            destroySpChart(analyticsState.supplierBarChart);
            destroySpChart(analyticsState.doughnutChart);

            analyticsState.barChart = createSpHorizontalBarChart(
              Chart,
              canvasBar,
              assigneeSorted,
              barLabelKey,
              meta,
              true
            );

            if (canvasSuppliers) {
              if (supplierSorted.length) {
                analyticsState.supplierBarChart = createSpHorizontalBarChart(
                  Chart,
                  canvasSuppliers,
                  supplierSorted,
                  "supplier_label",
                  meta,
                  false
                );
              } else {
                var sctx = canvasSuppliers.getContext("2d");
                if (sctx) sctx.clearRect(0, 0, canvasSuppliers.width, canvasSuppliers.height);
              }
            }

            var doughnutSorted = sortAnalyticsRows(assigneeRows, "total_purchase_sum");
            var doughnutLabels = doughnutSorted.map(function (r) {
              return shortenLabel(r.assignee_label, 32);
            });
            var doughnutValues = doughnutSorted.map(function (r) {
              return metricValue(r, "total_purchase_sum");
            });
            var doughnutColors = doughnutSorted.map(function (_r, i) {
              return SP_CHART_PALETTE[i % SP_CHART_PALETTE.length];
            });
            analyticsState.doughnutChart = new Chart(canvasDoughnut.getContext("2d"), {
              type: "doughnut",
              data: {
                labels: doughnutLabels,
                datasets: [{
                  data: doughnutValues,
                  backgroundColor: doughnutColors.map(function (c) { return c + "e8"; }),
                  borderColor: "#ffffff",
                  borderWidth: 3,
                  hoverOffset: 10,
                  hoverBorderColor: "#f8fafc",
                }],
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: "58%",
                animation: { animateRotate: true, duration: 620 },
                plugins: {
                  legend: { display: false },
                  tooltip: {
                    backgroundColor: "rgba(15, 23, 42, 0.92)",
                    padding: 10,
                    cornerRadius: 8,
                    callbacks: {
                      label: function (ctx) {
                        var row = doughnutSorted[ctx.dataIndex];
                        var v = metricValue(row, "total_purchase_sum");
                        var total = doughnutValues.reduce(function (a, b) { return a + b; }, 0);
                        var pct = total > 0 ? Math.round((100 * v) / total) : 0;
                        return (row.assignee_label || "—") + ": " + fmtMoney(v) + " (" + pct + "%)";
                      },
                    },
                  },
                },
              },
            });
            requestAnimationFrame(function () {
              spRefreshFloatingAfterLayout();
            });
          })
          .catch(function (e) {
            var hint = document.getElementById("dg-sp-analytics-hint");
            if (hint) hint.textContent = (e && e.message) || "Графики недоступны";
          });
      }

      function renderMsOrdersChart(msOrders) {
        var canvas = document.getElementById("dg-sp-chart-ms-orders");
        if (!canvas) return;
        var rows = (msOrders && msOrders.by_creator) || [];
        var sorted = rows.slice().sort(function (a, b) {
          return Number(b.orders_count || 0) - Number(a.orders_count || 0);
        });
        var wrap = canvas.parentElement;
        if (wrap) wrap.style.height = spChartBarHeight(sorted.length) + "px";
        loadChartJs()
          .then(function (Chart) {
            destroySpChart(analyticsState.msOrderChart);
            if (!sorted.length) {
              var ctx = canvas.getContext("2d");
              if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
              return;
            }
            var meta = metricMeta("ms_orders_count");
            analyticsState.msOrderChart = createSpHorizontalBarChart(
              Chart,
              canvas,
              sorted,
              "creator_label",
              meta,
              true
            );
          })
          .catch(function () {});
      }

      function renderAnalytics(payload) {
        analyticsState.payload = payload || null;
        if (payload && payload.procurement_attention_thresholds) {
          state.attentionThresholds = payload.procurement_attention_thresholds;
        }
        var totals = payload && payload.totals ? payload.totals : {};
        var assigneeRows = payload && payload.by_assignee ? payload.by_assignee : [];
        var supplierRows = payload && payload.by_supplier ? payload.by_supplier : [];
        var msOrders = payload && payload.ms_orders ? payload.ms_orders : null;
        renderAnalyticsKpis(totals, msOrders);
        renderAnalyticsHint(totals, assigneeRows, supplierRows);
        renderAssigneeLegend(assigneeRows);
        renderMsOrdersChart(msOrders);
        renderAnalyticsCharts(assigneeRows, supplierRows, msOrders);
      }

      function freshStatusClass(status) {
        var s = String(status || "unknown");
        if (s === "ok" || s === "stale" || s === "running" || s === "failed") return "dg-sp-fresh-" + s;
        return "dg-sp-fresh-unknown";
      }

      function freshStatusIcon(status) {
        if (status === "ok") return "✓";
        if (status === "stale") return "!";
        if (status === "running") return "↻";
        if (status === "failed") return "✕";
        return "?";
      }

      function freshStatusBadge(status) {
        if (status === "ok") return '<span class="badge bg-success dg-sp-fresh-badge">Сегодня</span>';
        if (status === "stale") return '<span class="badge bg-warning text-dark dg-sp-fresh-badge">Внимание</span>';
        if (status === "running") return '<span class="badge bg-primary dg-sp-fresh-badge">Идёт</span>';
        if (status === "failed") return '<span class="badge bg-danger dg-sp-fresh-badge">Ошибка</span>';
        return '<span class="badge bg-secondary dg-sp-fresh-badge">Нет данных</span>';
      }

      function renderDataFreshness(payload) {
        var row = document.getElementById("dg-sp-data-freshness-row");
        var loading = document.getElementById("dg-sp-data-freshness-loading");
        if (!row) return;
        if (loading) loading.remove();
        var sources = (payload && payload.sources) || [];
        if (!sources.length) {
          row.innerHTML =
            '<div class="col-12"><p class="text-muted small mb-0">Не удалось получить сведения об обновлении данных.</p></div>';
          return;
        }
        row.innerHTML = sources
          .map(function (src) {
            var st = src.status || "unknown";
            var cls = freshStatusClass(st);
            var when = src.finished_at_msk
              ? "Обновлено: " + src.finished_at_msk + " (МСК)"
              : "Дата последнего обновления неизвестна";
            var meta = [];
            if (src.trigger_label) meta.push("Запуск: " + src.trigger_label);
            if (st === "running") meta.push("Синхронизация выполняется…");
            if (src.key === "moysklad" && src.detail && src.detail.zero_stock_log_batch_at_msk) {
              meta.push("Журнал нулевых остатков: " + src.detail.zero_stock_log_batch_at_msk + " (МСК)");
            }
            if (src.key !== "moysklad" && src.detail && src.detail.ms_demand_max_updated_at) {
              var d = src.detail.ms_demand_max_updated_at;
              try {
                d = new Date(d).toLocaleString("ru-RU", {
                  timeZone: "Europe/Moscow",
                  day: "2-digit",
                  month: "2-digit",
                  year: "numeric",
                  hour: "2-digit",
                  minute: "2-digit",
                });
              } catch (e) {}
              meta.push("Последняя отгрузка в данных: до " + d + " (МСК)");
            }
            if (src.message_short && st !== "ok") meta.push(src.message_short);
            var title = String(src.title || "").replace(/</g, "&lt;");
            return (
              '<div class="col-lg-6">' +
              '<article class="dg-sp-fresh-card ' +
              cls +
              '" data-dg-sp-fresh-key="' +
              String(src.key || "").replace(/"/g, "") +
              '">' +
              '<div class="dg-sp-fresh-icon" aria-hidden="true">' +
              freshStatusIcon(st) +
              "</div>" +
              '<div class="flex-grow-1 min-width-0">' +
              '<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-1">' +
              '<div class="dg-sp-fresh-title">' +
              title +
              "</div>" +
              freshStatusBadge(st) +
              "</div>" +
              '<div class="dg-sp-fresh-when">' +
              when.replace(/</g, "&lt;") +
              "</div>" +
              (meta.length
                ? '<div class="dg-sp-fresh-meta">' + meta.map(function (m) { return m.replace(/</g, "&lt;"); }).join(" · ") + "</div>"
                : "") +
              "</div>" +
              "</article></div>"
            );
          })
          .join("");
        requestAnimationFrame(function () {
          spRefreshFloatingAfterLayout();
        });
      }

      function loadDataFreshness() {
        return fetch("/api/suppliers/data-freshness", {
          credentials: "same-origin",
          headers: spAuthHeaders(false),
        })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (j) {
            if (!j || j.success === false) throw new Error((j && j.error) || "Ошибка");
            renderDataFreshness(j);
          })
          .catch(function (e) {
            var row = document.getElementById("dg-sp-data-freshness-row");
            if (row) {
              row.innerHTML =
                '<div class="col-12"><p class="text-danger small mb-0">Актуальность данных: ' +
                String(e.message || e).replace(/</g, "&lt;") +
                "</p></div>";
            }
          });
      }

      function loadAnalytics() {
        if (analyticsState.loading) return Promise.resolve();
        analyticsState.loading = true;
        setAnalyticsLoading(true);
        var p = new URLSearchParams();
        if (state.search) p.set("search", state.search);
        if (state.assigned_user) p.set("assigned_user", state.assigned_user);
        return fetch("/api/suppliers/analytics?" + p.toString(), {
          credentials: "same-origin",
          headers: spAuthHeaders(false),
        })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (j) {
            if (!j || j.success === false) throw new Error((j && j.error) || "Ошибка аналитики");
            renderAnalytics(j);
          })
          .catch(function (e) {
            renderAnalyticsKpis({});
            var hint = document.getElementById("dg-sp-analytics-hint");
            if (hint) hint.textContent = "Сводка: " + (e.message || e);
          })
          .finally(function () {
            analyticsState.loading = false;
            setAnalyticsLoading(false);
            spRefreshFloatingAfterLayout();
          });
      }

      function bindAnalyticsUi() {
        document.querySelectorAll("[data-dg-sp-metric]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var key = btn.getAttribute("data-dg-sp-metric");
            if (!key || key === analyticsState.metric) return;
            analyticsState.metric = key;
            document.querySelectorAll("[data-dg-sp-metric]").forEach(function (b) {
              b.classList.toggle("active", b.getAttribute("data-dg-sp-metric") === key);
            });
            if (analyticsState.payload) {
              renderAnalyticsCharts(
                analyticsState.payload.by_assignee || [],
                analyticsState.payload.by_supplier || [],
                analyticsState.payload.ms_orders || null
              );
            }
          });
        });
        var ref = document.getElementById("dg-sp-analytics-refresh");
        if (ref) ref.addEventListener("click", function () { loadAnalytics(); });
        window.addEventListener("resize", function () {
          if (analyticsState.barChart) analyticsState.barChart.resize();
          if (analyticsState.supplierBarChart) analyticsState.supplierBarChart.resize();
          if (analyticsState.doughnutChart) analyticsState.doughnutChart.resize();
          if (analyticsState.msOrderChart) analyticsState.msOrderChart.resize();
        });
      }

      /** Тон подсветки: чем выше наполняемость (остаток к неснижаемому), тем зеленее. */
      function stockFillTone(fillPct) {
        if (fillPct == null || !Number.isFinite(Number(fillPct))) return "neutral";
        var p = Number(fillPct);
        if (p >= 90) return "good";
        if (p >= 70) return "mid";
        return "bad";
      }

      function buildPurchaseToBuyUrl(row) {
        var name = String(row.supplier_key || row.supplier_name || "").trim();
        var p = new URLSearchParams();
        if (name) p.set("supplier", name);
        p.set("to_buy", "1");
        return "/purchase.html?" + p.toString();
      }

      var msOrderLogState = { supplierKey: "", selectedLogId: null };

      function spEscHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function spFmtLogDt(raw) {
        if (!raw) return "—";
        try {
          var d = new Date(raw);
          if (!Number.isFinite(d.getTime())) return String(raw);
          return d.toLocaleString("ru-RU", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch (e) {
          return String(raw);
        }
      }

      function spMsLogStatusBadge(status) {
        var s = String(status || "").toLowerCase();
        if (s === "success") return '<span class="badge bg-success">OK</span>';
        if (s === "failed") return '<span class="badge bg-danger">Ошибка</span>';
        return '<span class="badge bg-secondary">' + spEscHtml(status || "?") + "</span>";
      }

      function setMsOrderLogLoading(on) {
        var el = document.getElementById("dg-sp-ms-log-loading");
        if (el) el.classList.toggle("d-none", !on);
      }

      function closeSupplierMsOrderLogModal() {
        var ov = document.getElementById("dg-sp-ms-order-log-overlay");
        if (!ov) return;
        ov.style.display = "none";
        ov.setAttribute("aria-hidden", "true");
      }

      function renderMsOrderLogDetailPlaceholder(text) {
        var el = document.getElementById("dg-sp-ms-log-detail");
        if (!el) return;
        el.className = "dg-sp-ms-log-detail small text-muted border-start-lg ps-lg-3";
        el.textContent = text || "Выберите запись слева, чтобы увидеть шаги.";
      }

      function buildMsOrderLogStepsHtml(detail) {
        if (!detail || !detail.steps || !detail.steps.length) {
          return '<p class="text-muted mb-0">Нет пошагового журнала.</p>';
        }
        var html = "";
        detail.steps.forEach(function (st) {
          var fail = st.ok === false;
          html +=
            '<div class="dg-sp-ms-log-step' +
            (fail ? " dg-sp-ms-log-step-fail" : "") +
            '"><div><strong>' +
            spEscHtml(st.step || "?") +
            "</strong> " +
            (st.ok === true
              ? '<span class="text-success">✓</span>'
              : st.ok === false
                ? '<span class="text-danger">✗</span>'
                : '<span class="text-muted">…</span>') +
            ' <span class="text-muted">' +
            spEscHtml(st.at || "") +
            "</span></div>";
          var copy = Object.assign({}, st);
          delete copy.step;
          delete copy.at;
          delete copy.ok;
          if (Object.keys(copy).length) {
            html += "<pre>" + spEscHtml(JSON.stringify(copy, null, 2)) + "</pre>";
          }
          html += "</div>";
        });
        return html;
      }

      function renderMsOrderLogDetail(log) {
        var el = document.getElementById("dg-sp-ms-log-detail");
        if (!el) return;
        if (!log) {
          renderMsOrderLogDetailPlaceholder("Запись не найдена.");
          return;
        }
        el.className = "dg-sp-ms-log-detail small border-start-lg ps-lg-3";
        var html =
          '<div class="mb-2">' +
          spMsLogStatusBadge(log.status) +
          " <strong>#" +
          spEscHtml(log.id) +
          "</strong>";
        if (log.created_by_name) html += " · " + spEscHtml(log.created_by_name);
        html += "</div>";
        if (log.order_name) {
          html += "<p class=\"mb-1\"><strong>Заказ:</strong> " + spEscHtml(log.order_name) + "</p>";
        }
        if (log.message) {
          html += "<p class=\"mb-2\">" + spEscHtml(log.message) + "</p>";
        }
        if (log.ms_web_href) {
          html +=
            '<p class="mb-2"><a href="' +
            spEscHtml(log.ms_web_href) +
            '" target="_blank" rel="noopener noreferrer">Открыть в МойСклад</a></p>';
        }
        html += buildMsOrderLogStepsHtml(log.detail);
        el.innerHTML = html;
      }

      function loadSupplierMsOrderLogDetail(logId) {
        msOrderLogState.selectedLogId = logId;
        var list = document.getElementById("dg-sp-ms-log-list");
        if (list) {
          list.querySelectorAll("tr.dg-sp-ms-log-row").forEach(function (tr) {
            tr.classList.toggle("active", Number(tr.getAttribute("data-log-id")) === Number(logId));
          });
        }
        renderMsOrderLogDetailPlaceholder("Загружаем шаги…");
        return fetch("/api/suppliers/ms-order-log/" + encodeURIComponent(String(logId)), {
          credentials: "same-origin",
          headers: spAuthHeaders(false),
        })
          .then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (j) {
              if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
              return j;
            });
          })
          .then(function (j) {
            renderMsOrderLogDetail(j && j.log);
          })
          .catch(function (err) {
            renderMsOrderLogDetailPlaceholder(err.message || "Ошибка загрузки деталей");
          });
      }

      function renderMsOrderLogList(rows) {
        var el = document.getElementById("dg-sp-ms-log-list");
        if (!el) return;
        if (!rows || !rows.length) {
          el.innerHTML = '<p class="text-muted mb-0">Попыток отправки в МС пока нет.</p>';
          renderMsOrderLogDetailPlaceholder();
          return;
        }
        var html =
          '<table class="table table-sm table-hover mb-0"><thead><tr>' +
          "<th>#</th><th>Дата</th><th>Статус</th><th>Поз.</th><th>Сообщение</th>" +
          "</tr></thead><tbody>";
        rows.forEach(function (r) {
          html +=
            '<tr class="dg-sp-ms-log-row" data-log-id="' +
            spEscHtml(r.id) +
            '" title="Показать шаги">' +
            "<td>" +
            spEscHtml(r.id) +
            "</td><td>" +
            spEscHtml(spFmtLogDt(r.created_at)) +
            "</td><td>" +
            spMsLogStatusBadge(r.status) +
            "</td><td>" +
            spEscHtml(r.positions_count != null ? r.positions_count : "—") +
            "</td><td class=\"text-truncate\" style=\"max-width:140px\">" +
            spEscHtml(r.message || r.code_error || "") +
            "</td></tr>";
        });
        html += "</tbody></table>";
        el.innerHTML = html;
        el.querySelectorAll("tr.dg-sp-ms-log-row").forEach(function (tr) {
          tr.addEventListener("click", function () {
            loadSupplierMsOrderLogDetail(tr.getAttribute("data-log-id"));
          });
        });
        if (msOrderLogState.selectedLogId) {
          loadSupplierMsOrderLogDetail(msOrderLogState.selectedLogId);
        } else if (rows[0]) {
          loadSupplierMsOrderLogDetail(rows[0].id);
        }
      }

      function loadSupplierMsOrderLogList() {
        var key = String(msOrderLogState.supplierKey || "").trim();
        if (!key) return Promise.resolve();
        setMsOrderLogLoading(true);
        var url =
          "/api/suppliers/ms-order-log?supplier_key=" +
          encodeURIComponent(key) +
          "&limit=30";
        return fetch(url, { credentials: "same-origin", headers: spAuthHeaders(false) })
          .then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (j) {
              if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
              return j;
            });
          })
          .then(function (j) {
            renderMsOrderLogList(j.rows || []);
          })
          .catch(function (err) {
            var el = document.getElementById("dg-sp-ms-log-list");
            if (el) el.innerHTML = '<p class="text-danger mb-0">' + spEscHtml(err.message) + "</p>";
            renderMsOrderLogDetailPlaceholder();
          })
          .finally(function () {
            setMsOrderLogLoading(false);
          });
      }

      function openSupplierMsOrderLogModal(row) {
        var supplierKey = String(row.supplier_key || row.supplier_name || "").trim();
        if (!supplierKey) return;
        msOrderLogState.supplierKey = supplierKey;
        msOrderLogState.selectedLogId = null;
        var ov = document.getElementById("dg-sp-ms-order-log-overlay");
        var title = document.getElementById("dg-sp-ms-log-title");
        if (title) title.textContent = "Журнал МС · " + supplierKey;
        if (!ov) return;
        ov.style.display = "flex";
        ov.setAttribute("aria-hidden", "false");
        renderMsOrderLogList([]);

      function downloadSupplierExport(row, kind, btn) {
        var supplierKey = String(row.supplier_key || row.supplier_name || "").trim();
        if (!supplierKey) return;
        var url =
          "/api/suppliers/export/" +
          encodeURIComponent(kind) +
          "?supplier_key=" +
          encodeURIComponent(supplierKey) +
          "&to_purchase=1";
        var label = kind === "purchaser" ? "Экспорт для закупщиков" : "Экспорт для поставщика";
        var run = function () {
          return fetch(url, { credentials: "same-origin", headers: spAuthHeaders(false) })
            .then(function (r) {
              if (!r.ok) {
                return r
                  .json()
                  .catch(function () {
                    return {};
                  })
                  .then(function (j) {
                    throw new Error((j && j.error) || "HTTP " + r.status);
                  });
              }
              var dispo = r.headers.get("Content-Disposition") || "";
              var fname = null;
              var mStar = /filename\*=UTF-8''([^;\s]+)/i.exec(dispo);
              if (mStar && mStar[1]) {
                try { fname = decodeURIComponent(mStar[1]); } catch (eDec) { fname = mStar[1]; }
              }
              if (!fname) {
                var m = /filename="([^"]+)"/i.exec(dispo);
                fname = m && m[1] ? m[1] : (kind === "purchaser" ? "zakupki.xls" : "postavshik.xls");
              }
              return r.blob().then(function (blob) {
                var a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = fname;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(function () {
                  URL.revokeObjectURL(a.href);
                }, 2000);
              });
            })
            .then(function () {
              if (window.DatagonNotify && window.DatagonNotify.toast) {
                window.DatagonNotify.toast({ type: "success", message: label + ": файл скачан" });
              }
            })
            .catch(function (e) {
              if (window.DatagonNotify && window.DatagonNotify.toast) {
                window.DatagonNotify.toast({ type: "danger", message: e.message || "Ошибка выгрузки" });
              }
            });
        };
        if (window.DatagonNotify && window.DatagonNotify.busyRun && btn) {
          window.DatagonNotify.busyRun(btn, run);
        } else {
          run();
        }
      }

      function renderStockFillTriplet(row) {
        var positionsCount =
          row.min_stock_positions_count != null ? row.min_stock_positions_count : null;
        var minSumTotal = row.min_stock_total != null ? row.min_stock_total : null;
        var stockSum = row.stock_total != null ? row.stock_total : null;

          row.stock_fill_pct != null
            ? row.stock_fill_pct
            : row.stock_fill_pct_computed != null
              ? row.stock_fill_pct_computed
              : null;
        if (
          fillPct == null &&
          minSumTotal != null &&
          stockSum != null &&
          Number(minSumTotal) > 0
        ) {
          fillPct = Math.round((100 * Number(stockSum)) / Number(minSumTotal) * 100) / 100;
        }
        var wrap = document.createElement("span");
        var tone = stockFillTone(fillPct);
        wrap.className = "dg-sp-fill-triplet dg-sp-fill-" + tone;

          (row.stock_fill_pct_stored != null

          (positionsCount == null || positionsCount === "") &&
          (minSumTotal == null || minSumTotal === "") &&
          (stockSum == null || stockSum === "") &&

          else inp.value = fmtNum(v, { maxFractionDigits: o.maxFractionDigits != null ? o.maxFractionDigits : 2 });

        syncDisplay();
        inp.addEventListener("focus", function () {
          var v = parseRuNumberInput(inp.value);
          inp.value = v != null ? String(v) : "";
        });
        inp.addEventListener("blur", syncDisplay);
        inp.addEventListener("change", function () {
          var n = parseRuNumberInput(inp.value);
          var payload = {};
          payload[field] = n == null ? null : n;
          patchSupplier(row.supplier_key, payload)
            .then(function () {

        if (key === "procurement_attention") return renderProcurementAttentionBadge(row);
        if (key === "last_ms_order_at") {
          var box = document.createElement("div");
          box.className = "dg-sp-last-ms-order small text-start";
          if (!row.last_ms_order_at) {
            box.innerHTML = '<span class="text-muted">—</span>';
            return box;
          }
          var when = document.createElement("div");
          when.className = "dg-sp-last-ms-when";
          when.textContent = fmtDateTimeSp(row.last_ms_order_at);
          box.appendChild(when);
          if (row.last_ms_order_name) {
            var nm = document.createElement("div");
            nm.className = "text-muted dg-sp-last-ms-name";
            nm.textContent = String(row.last_ms_order_name);
            nm.title = String(row.last_ms_order_name);
            box.appendChild(nm);
          }
          if (row.last_ms_order_by) {
            var who = document.createElement("div");
            who.className = "text-muted";
            who.textContent = row.last_ms_order_by;
            box.appendChild(who);
          }
          return box;
        }
        if (key === "export_stub") {
          var g = document.createElement("div");
          g.className = "d-flex gap-1 justify-content-center flex-nowrap";
          var canExport = Number(row.products_to_purchase || 0) > 0;
          var b1 = document.createElement("button");
          b1.type = "button";
          b1.className = "btn btn-sm btn-outline-secondary dg-sp-export-btn";
          b1.textContent = "📊";
          b1.title = "Экспорт для поставщика (позиции к закупке)";
          b1.setAttribute("data-dg-notify-start", "Формируем выгрузку для поставщика…");
          b1.disabled = !canExport;
          if (canExport) {
            b1.addEventListener("click", function (e) {
              e.preventDefault();
              e.stopPropagation();
              downloadSupplierExport(row, "supplier", b1);
            });
          }
          var b2 = document.createElement("button");
          b2.type = "button";
          b2.className = "btn btn-sm btn-outline-secondary dg-sp-export-btn";
          b2.textContent = "📥";
          b2.title = "Экспорт для закупщиков";
          b2.setAttribute("data-dg-notify-start", "Формируем выгрузку для закупщиков…");
          b2.disabled = !canExport;
          if (canExport) {
            b2.addEventListener("click", function (e) {
              e.preventDefault();
              e.stopPropagation();
              downloadSupplierExport(row, "purchaser", b2);
            });
          }
          g.appendChild(b1);
          g.appendChild(b2);
          return g;
        }
        if (key === "send_ms_stub") {
          var canSend = Number(row.products_to_purchase || 0) > 0;
          var gMs = document.createElement("div");
          gMs.className = "dg-sp-ms-actions";
          var bMs = document.createElement("button");
          bMs.type = "button";
          bMs.className = "btn btn-sm btn-outline-primary";
          bMs.textContent = "МС";
          bMs.title = "Создать заказ поставщику в МойСклад";
          bMs.setAttribute("data-dg-notify-start", "Создаём заказ в МойСклад…");
          bMs.disabled = !canSend;
          if (canSend) {
            bMs.addEventListener("click", function (e) {
              e.preventDefault();
              e.stopPropagation();
              sendPurchaseOrderToMs(row, bMs);
            });
          }
          var bLog = document.createElement("button");
          bLog.type = "button";
          bLog.className = "btn btn-sm btn-outline-secondary dg-sp-ms-log-btn";
          bLog.textContent = "📋";
          bLog.title = "Журнал заказов в МойСклад";
          bLog.setAttribute("data-dg-notify-start", "Открываем журнал МС…");
          bLog.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            openSupplierMsOrderLogModal(row);
          });
          gMs.appendChild(bMs);
          gMs.appendChild(bLog);
          return gMs;
        }
        if (key === "auto_mailing_stub") {
          var b2 = document.createElement("button");
          b2.type = "button";
          b2.className = "btn btn-sm btn-outline-secondary dg-sp-stub-btn";
          b2.title = "Скоро";
          b2.textContent = "—";
          b2.disabled = true;
          return b2;
        }
        if (key === "mailing_text_stub") {
          var t = document.createElement("span");
          t.className = "text-muted small";
          t.textContent = "—";
          return t;
        }
        return document.createTextNode("");
      }

      function buildThead() {
        var thead = document.getElementById("dg-sp-thead");
        if (!thead) return;
        thead.innerHTML = "";
        var tr = document.createElement("tr");
        var cols = SP_COLS.filter(function (p) { return visibleCols.indexOf(p[0]) >= 0; });
        cols.forEach(function (p) {
          var key = p[0];
          var label = p[1];
          var opts = COL_OPTS[key] || {};
          var th = document.createElement("th");
          th.scope = "col";
          var w = colWidths[key] || COL_MIN[key] || 90;
          th.style.width = w + "px";
          th.style.minWidth = w + "px";
          var sk = SORT_KEY_REMAP[key] || key;
          var sortMark = sk === sortBy ? (sortDir === "desc" ? " ▼" : " ▲") : "";
          if (opts.headerLines && opts.headerLines.length) {
            th.className = (th.className ? th.className + " " : "") + "dg-sp-th-multiline";
            var lines = opts.headerLines.map(function (line) {
              return String(line)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            });
            if (sortMark) lines[lines.length - 1] += sortMark;
            th.innerHTML = lines.join("<br>");
          }
          if (SORTABLE.has(key) || SORTABLE.has(SORT_KEY_REMAP[key])) {
            th.className = (th.className ? th.className + " " : "") + "dg-sp-sortable";
            if (!opts.headerLines || !opts.headerLines.length) {
              if (sk === sortBy) th.textContent = label + sortMark;
              else th.textContent = label;
            }
            th.addEventListener("click", function (ev) {
              if (window.getSelection && window.getSelection().toString().trim()) return;
              if (sk === sortBy) sortDir = sortDir === "asc" ? "desc" : "asc";
              else {
                sortBy = sk;
                sortDir = "asc";
              }
              state.offset = 0;
              load();
            });
          } else if (!opts.headerLines || !opts.headerLines.length) {
            th.textContent = label;
          }
          tr.appendChild(th);
        });
        thead.appendChild(tr);
      }

      function renderTable() {
        var theadEl = document.getElementById("dg-sp-thead");
        var rowEl = theadEl && theadEl.querySelector("tr");
        if (theadEl && rowEl) clearSpHeaderFloatStyles(theadEl, rowEl);
        buildThead();
        var tbody = document.getElementById("dg-sp-tbody");
        if (!tbody) return;
        tbody.innerHTML = "";
        var cols = SP_COLS.filter(function (p) { return visibleCols.indexOf(p[0]) >= 0; });
        if (!state.rows.length) {
          var tr0 = document.createElement("tr");
          var td0 = document.createElement("td");
          td0.colSpan = Math.max(cols.length, 1);
          td0.className = "text-muted py-3";
          td0.textContent = "Нет поставщиков по текущим условиям.";
          tr0.appendChild(td0);
          tbody.appendChild(tr0);
          spRefreshFloatingAfterLayout();
          return;
        }
        state.rows.forEach(function (row, idx) {
          var tr = document.createElement("tr");
          tr.setAttribute("data-supplier-key", row.supplier_key);
          var att = row.procurement_attention || {};
          var attLevel = String(att.level || "none");
          if (attLevel === "danger") tr.classList.add("dg-sp-row-attention-danger");
          else if (attLevel === "warning") tr.classList.add("dg-sp-row-attention-warning");
          cols.forEach(function (p) {
            var td = document.createElement("td");
            var opts = COL_OPTS[p[0]] || {};
            if (p[0] === "comment") td.className = "dg-sp-td-comment";
            else if (opts.center) td.className = "text-center";
            var cell = renderCell(p[0], row, idx);
            if (cell) td.appendChild(cell);
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        spRefreshFloatingAfterLayout();
      }

      function columnControls() {
        var wrap = document.getElementById("dg-sp-toolbox-panels");
        var colPanel = document.getElementById("dg-sp-columns-panel");
        var widthPanel = document.getElementById("dg-sp-widths-panel");
        var colList = document.getElementById("dg-sp-columns-list");
        var widthList = document.getElementById("dg-sp-widths-list");

        function syncWrap() {
          var open = (colPanel && colPanel.classList.contains("open")) ||
            (widthPanel && widthPanel.classList.contains("open"));
          if (wrap) wrap.classList.toggle("d-none", !open);
        }

        function renderColumnControls() {
          if (!colList) return;
          colList.innerHTML = "";
          SP_COLS.forEach(function (p) {
            var key = p[0];
            var label = document.createElement("label");
            var cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = visibleCols.indexOf(key) >= 0;
            cb.addEventListener("change", function () {
              if (cb.checked) {
                if (visibleCols.indexOf(key) < 0) visibleCols.push(key);
              } else {
                visibleCols = visibleCols.filter(function (k) { return k !== key; });
              }
              if (!visibleCols.length) visibleCols = [key];
              saveVisibleCols(visibleCols);
              renderTable();
            });
            label.appendChild(cb);
            label.appendChild(document.createTextNode(" " + p[1]));
            colList.appendChild(label);
          });
        }

        function renderWidthControls() {
          if (!widthList) return;
          widthList.innerHTML = "";
          SP_COLS.forEach(function (p) {
            var key = p[0];
            var label = document.createElement("label");
            label.textContent = p[1];
            var inp = document.createElement("input");
            inp.type = "number";
            inp.min = "40";
            inp.max = "800";
            inp.value = String(colWidths[key] || COL_MIN[key] || 90);
            inp.addEventListener("change", function () {
              colWidths[key] = parseInt(inp.value, 10) || COL_MIN[key] || 90;
              saveColWidths(colWidths);
              renderTable();
            });
            label.appendChild(inp);
            widthList.appendChild(label);
          });
        }

        renderColumnControls();
        renderWidthControls();

        var colToggle = document.getElementById("dg-sp-columns-toggle");
        var widthToggle = document.getElementById("dg-sp-widths-toggle");
        if (colToggle) {
          colToggle.addEventListener("click", function (e) {
            e.stopPropagation();
            if (widthPanel) widthPanel.classList.remove("open");
            if (colPanel) colPanel.classList.toggle("open");
            syncWrap();
          });
        }
        if (widthToggle) {
          widthToggle.addEventListener("click", function (e) {
            e.stopPropagation();
            if (colPanel) colPanel.classList.remove("open");
            if (widthPanel) widthPanel.classList.toggle("open");
            syncWrap();
          });
        }
        document.addEventListener("click", function () {
          if (colPanel) colPanel.classList.remove("open");
          if (widthPanel) widthPanel.classList.remove("open");
          syncWrap();
        });
        if (wrap) wrap.addEventListener("click", function (e) { e.stopPropagation(); });

        var colAll = document.getElementById("dg-sp-columns-all");
        var colNone = document.getElementById("dg-sp-columns-none");
        var colDef = document.getElementById("dg-sp-columns-default");
        if (colAll) colAll.addEventListener("click", function () {
          visibleCols = DEFAULT_VISIBLE.slice();
          saveVisibleCols(visibleCols);
          renderColumnControls();
          renderTable();
        });
        if (colNone) colNone.addEventListener("click", function () {
          visibleCols = ["supplier_name"];
          saveVisibleCols(visibleCols);
          renderColumnControls();
          renderTable();
        });
        if (colDef) colDef.addEventListener("click", function () {
          visibleCols = DEFAULT_VISIBLE.slice();
          saveVisibleCols(visibleCols);
          renderColumnControls();
          renderTable();
        });
        var widthDef = document.getElementById("dg-sp-widths-default");
        if (widthDef) widthDef.addEventListener("click", function () {
          colWidths = {};
          saveColWidths(colWidths);
          renderWidthControls();
          renderTable();
        });
      }

      function bindHeaderSearchMirror() {
        var main = document.getElementById("sp-f-search");
        var mirror = document.getElementById("dg-sp-table-search-mirror");
        if (!main || !mirror) return;
        var syncing = false;
        function sync(a, b) {
          if (syncing) return;
          syncing = true;
          b.value = a.value;
          state.pending.search = String(a.value || "").trim();
          syncDirtyApply();
          syncing = false;
        }
        main.addEventListener("input", function () { sync(main, mirror); });
        mirror.addEventListener("input", function () { sync(mirror, main); });
        function applyFrom(el) {
          sync(el, el === main ? mirror : main);
          commitFilters();
        }
        main.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); applyFrom(main); }
          if (e.key === "Escape") {
            main.value = "";
            mirror.value = "";
            state.pending.search = "";
            commitFilters();
          }
        });
        mirror.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); applyFrom(mirror); }
          if (e.key === "Escape") {
            main.value = "";
            mirror.value = "";
            state.pending.search = "";
            commitFilters();
          }
        });
      }

      function bindAnalyticsCollapse() {
        var key = "datagon_suppliers_analytics_collapsed_v1";
        var body = document.getElementById("dg-sp-analytics-body");
        var btn = document.getElementById("dg-sp-analytics-toggle");
        if (!body || !btn) return;
        var collapsed = false;
        try { collapsed = window.localStorage.getItem(key) === "1"; } catch (e) {}
        function apply() {
          body.style.display = collapsed ? "none" : "";
          btn.textContent = collapsed ? "Развернуть" : "Свернуть";
          var thead = document.getElementById("dg-sp-thead");
          var row = thead && thead.querySelector("tr");
          if (thead && row) clearSpHeaderFloatStyles(thead, row);
          requestAnimationFrame(function () {
            spRefreshFloatingAfterLayout();
          });
        }
        apply();
        btn.addEventListener("click", function () {
          collapsed = !collapsed;
          try { window.localStorage.setItem(key, collapsed ? "1" : "0"); } catch (e) {}
          apply();
        });
      }

      function bindSpLayoutRefreshObservers() {
        if (typeof ResizeObserver === "undefined") return;
        var debounce = 0;
        function onLayoutAboveTable() {
          if (debounce) clearTimeout(debounce);
          debounce = setTimeout(function () {
            debounce = 0;
            spRefreshFloatingAfterLayout();
          }, 80);
        }
        var ro = new ResizeObserver(onLayoutAboveTable);
        [
          document.getElementById("dg-sp-analytics"),
          document.getElementById("dg-sp-data-freshness"),
          document.getElementById("dg-sp-filters-body"),
        ].forEach(function (el) {
          if (el) ro.observe(el);
        });
      }

      function bindFiltersCollapse() {
        var key = "datagon_suppliers_filters_collapsed_v1";
        var body = document.getElementById("dg-sp-filters-body");
        var btn = document.getElementById("dg-sp-filters-toggle");
        if (!body || !btn) return;
        var collapsed = false;
        try { collapsed = window.localStorage.getItem(key) === "1"; } catch (e) {}
        function apply() {
          body.style.display = collapsed ? "none" : "";
          btn.textContent = collapsed ? "Развернуть" : "Свернуть";
        }
        apply();
        btn.addEventListener("click", function () {
          collapsed = !collapsed;
          try { window.localStorage.setItem(key, collapsed ? "1" : "0"); } catch (e) {}
          apply();
        });
      }

      function bindTableCardCollapse() {
        var key = "dg.suppliers.table-card.collapsed.v1";
        var body = document.getElementById("dg-sp-table-body");
        var btn = document.getElementById("dg-sp-table-toggle");
        if (!body || !btn) return;
        var collapsed = false;
        try { collapsed = window.localStorage.getItem(key) === "1"; } catch (e) {}
        function apply() {
          body.style.display = collapsed ? "none" : "";
          btn.textContent = collapsed ? "Развернуть" : "Свернуть";
        }
        apply();
        btn.addEventListener("click", function () {
          collapsed = !collapsed;
          try { window.localStorage.setItem(key, collapsed ? "1" : "0"); } catch (e) {}
          apply();
          if (!collapsed) spRefreshFloatingAfterLayout();
        });
      }

      function bindPagination() {
        function syncLimit(v) {
          state.limit = v;
          state.offset = 0;
          var a = document.getElementById("sp-f-limit");
          var b = document.getElementById("sp-footer-limit");
          if (a) a.value = String(v);
          if (b) b.value = String(v);
        }
        var limA = document.getElementById("sp-f-limit");
        var limB = document.getElementById("sp-footer-limit");
        if (limA) limA.addEventListener("change", function () {
          syncLimit(parseInt(limA.value, 10) || 100);
          load();
        });
        if (limB) limB.addEventListener("change", function () {
          syncLimit(parseInt(limB.value, 10) || 100);
          load();
        });
        var prev = document.getElementById("sp-btn-prev");
        var next = document.getElementById("sp-btn-next");
        if (prev) prev.addEventListener("click", function () {
          state.offset = Math.max(0, state.offset - state.limit);
          load();
        });
        if (next) next.addEventListener("click", function () {
          if (state.offset + state.limit < state.total) {
            state.offset += state.limit;
            load();
          }
        });
      }

      function bindActions() {
        var apply = document.getElementById("sp-apply");
        var reset = document.getElementById("sp-reset");
        var refresh = document.getElementById("sp-refresh");
        if (apply) apply.addEventListener("click", commitFilters);
        if (refresh) refresh.addEventListener("click", function () {
          loadDataFreshness();
          load();
        });
        if (reset) reset.addEventListener("click", function () {
          var main = document.getElementById("sp-f-search");
          var mirror = document.getElementById("dg-sp-table-search-mirror");
          if (main) main.value = "";
          if (mirror) mirror.value = "";
          state.pending.search = "";
          state.pending.assigned_user = "";
          state.pending.attention_only = false;
          state.search = "";
          state.assigned_user = "";
          state.attention_only = false;
          var asg = document.getElementById("sp-f-assignee");
          if (asg) asg.value = "";
          var attOnly = document.getElementById("sp-f-attention-only");
          if (attOnly) attOnly.checked = false;
          state.offset = 0;
          syncLimitUi(100);
          syncDirtyApply();
          load();
        });
        var search = document.getElementById("sp-f-search");
        if (search) search.addEventListener("input", function () {
          state.pending.search = String(search.value || "").trim();
          syncDirtyApply();
        });
        var assignee = document.getElementById("sp-f-assignee");
        if (assignee) assignee.addEventListener("change", function () {
          state.pending.assigned_user = String(assignee.value || "");
          syncDirtyApply();
        });
        var attOnly = document.getElementById("sp-f-attention-only");
        if (attOnly) attOnly.addEventListener("change", function () {
          state.pending.attention_only = !!attOnly.checked;
          syncDirtyApply();
        });
      }

      function syncLimitUi(v) {
        state.limit = v;
        var a = document.getElementById("sp-f-limit");
        var b = document.getElementById("sp-footer-limit");
        if (a) a.value = String(v);
        if (b) b.value = String(v);
      }

      function searchFromUrl() {
        try {
          var q = new URLSearchParams(window.location.search || "");
          return String(q.get("search") || "").trim();
        } catch (e) {
          return "";
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        bindActions();
        bindAnalyticsUi();
        bindAnalyticsCollapse();
        bindSpLayoutRefreshObservers();
        bindHeaderSearchMirror();
        bindFiltersCollapse();
        bindTableCardCollapse();
        bindPagination();
        bindSupplierMsOrderLogModal();
        columnControls();
        updateSpStickyTopVar();
        window.addEventListener("scroll", onScrollSpFloatingHeader, { passive: true });
        window.addEventListener("resize", function () {
          updateSpStickyTopVar();
          spRefreshFloatingAfterLayout();
        });
        (function bindSpScrollContainers() {
          var mainOuter = document.querySelector(".app-main__outer");
          if (mainOuter && mainOuter.addEventListener) {
            mainOuter.addEventListener("scroll", onScrollSpFloatingHeader, { passive: true });
          }
          var horiz = document.querySelector(".dg-sp-table-scroll-outer");
          if (horiz && horiz.addEventListener) {
            horiz.addEventListener("scroll", onScrollSpFloatingHeader, { passive: true });
          }
        })();
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(spRefreshFloatingAfterLayout).catch(function () {});
        }
        window.addEventListener("load", spRefreshFloatingAfterLayout);
        var urlSearch = searchFromUrl();
        state.pending.search = urlSearch;
        state.search = urlSearch;
        var spSearchEl = document.getElementById("sp-f-search");
        if (spSearchEl && urlSearch) spSearchEl.value = urlSearch;
        syncDirtyApply();
        loadDataFreshness();
        loadAssignees().then(function () { load(); });
      });
    })();
  </script>
