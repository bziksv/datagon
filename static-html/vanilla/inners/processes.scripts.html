  <script>
    (function () {
      var FILTERS_KEY = "datagon_processes_filters_collapsed_v1";
      var overview = null;
      var dgProcAsRunLogById = Object.create(null);
      var loading = false;
      /** Счётчик параллельных fetch overview (поллинг + ручное «Обновить»): кнопку включаем только когда все завершились. */
      var overviewFetchDepth = 0;
      var pollTimer = null;
      var processesPrefsMerged = false;
      /** Пока пользователь тянет выделение — не дергать DOM (поллинг каждые 3 с иначе срывает selection). */
      var procPollHoldForSelection = false;
      var procSelectionGraceUntil = 0;

      function processesMainRoot() {
        return document.querySelector("body.datagon-vanilla-body[data-dg-active-nav='processes'] .app-main__inner");
      }

      function processesSelectionTouchesMain() {
        var sel = window.getSelection && window.getSelection();
        if (!sel || sel.isCollapsed) return false;
        var text = String(sel.toString() || "").trim();
        if (!text) return false;
        var root = processesMainRoot();
        if (!root) return false;
        var anchor = sel.anchorNode;
        if (!anchor) return false;
        var el = anchor.nodeType === 3 ? anchor.parentElement : anchor;
        return !!(el && root.contains(el));
      }

      function processesPollShouldDefer() {
        if (procPollHoldForSelection) return true;
        if (Date.now() < procSelectionGraceUntil) return true;
        return processesSelectionTouchesMain();
      }

      function bindProcessesSelectionPollGuard() {
        var root = processesMainRoot();
        if (!root || root.getAttribute("data-dg-proc-sel-guard") === "1") return;
        root.setAttribute("data-dg-proc-sel-guard", "1");
        root.addEventListener(
          "mousedown",
          function () {
            procPollHoldForSelection = true;
          },
          true
        );
        root.addEventListener(
          "mouseup",
          function () {
            procPollHoldForSelection = false;
            procSelectionGraceUntil = Date.now() + 900;
          },
          true
        );
        document.addEventListener("selectionchange", function () {
          if (processesSelectionTouchesMain()) {
            procSelectionGraceUntil = Date.now() + 900;
          }
        });
      }

      /**
       * Дата «За день» (МСК, формат YYYY-MM-DD). По умолчанию — сегодня по МСК.
       * Не персистится: каждое открытие страницы — сегодня.
       */
      var FOR_DATE_WINDOW_DAYS = 14;
      var forDate = moscowTodayDate();
      var forDateOptions = computeForDateOptions();

      function moscowTodayDate() {
        try {
          return new Date().toLocaleDateString("en-CA", { timeZone: "Europe/Moscow" });
        } catch (_) {
          return new Date().toISOString().slice(0, 10);
        }
      }

      function computeForDateOptions() {
        var out = [];
        var today = moscowTodayDate();
        var anchor = new Date(today + "T12:00:00+03:00").getTime();
        for (var i = 0; i < FOR_DATE_WINDOW_DAYS; i += 1) {
          out.push(
            new Date(anchor - i * 86400000).toLocaleDateString("en-CA", { timeZone: "Europe/Moscow" })
          );
        }
        return out;
      }

      function moscowDayLabel(date) {
        if (!date) return "—";
        var today = moscowTodayDate();
        var anchor = new Date(today + "T12:00:00+03:00").getTime();
        var target = new Date(date + "T12:00:00+03:00").getTime();
        var diff = Math.round((anchor - target) / 86400000);
        if (diff === 0) return "сегодня";
        if (diff === 1) return "вчера";
        if (diff === 2) return "позавчера";
        if (diff > 0 && diff < 7) return diff + " дн. назад";
        try {
          return new Date(date + "T12:00:00+03:00").toLocaleDateString("ru-RU", {
            timeZone: "Europe/Moscow",
            day: "2-digit",
            month: "short",
            weekday: "short",
          });
        } catch (_) {
          return date;
        }
      }

      function fmtNum(v) {
        return Number(v || 0).toLocaleString("ru-RU");
      }
      function fmtDateTime(v) {
        if (!v) return "-";
        var d = new Date(v);
        if (isNaN(d.getTime())) return String(v);
        return d.toLocaleDateString("ru-RU") + " " + d.toLocaleTimeString("ru-RU");
      }
      function fmtTimeMsk(v) {
        if (!v) return "—";
        var d = new Date(v);
        if (isNaN(d.getTime())) return String(v);
        try {
          return d.toLocaleTimeString("ru-RU", { timeZone: "Europe/Moscow", hour: "2-digit", minute: "2-digit", second: "2-digit" });
        } catch (_) {
          return d.toLocaleTimeString("ru-RU");
        }
      }

      function fmtDurationMs(ms) {
        if (ms == null || ms === "") return "—";
        var n = Number(ms);
        if (!isFinite(n) || n < 0) return "—";
        if (n < 1000) return Math.round(n) + " мс";
        var sec = Math.round(n / 1000);
        if (sec < 120) return sec + " с";
        var min = Math.floor(sec / 60);
        var s2 = sec % 60;
        return min + " мин " + s2 + " с";
      }

      function summarizeMatchPhaseResult(r) {
        if (!r || typeof r !== "object") return "";
        var bits = [];
        if (r.clearedPending === true) bits.push("очищен pending");
        if (r.clearedPending === false) bits.push("pending не очищали (продолжение)");
        if (r.count != null) bits.push("загружено товаров " + fmtNum(r.count));
        if (r.source) bits.push("источник: " + r.source);
        if (r.durationSec != null) bits.push("за " + r.durationSec + " с");
        if (r.skipped != null) bits.push("отфильтровано " + fmtNum(r.skipped));
        if (r.remaining != null) bits.push("осталось " + fmtNum(r.remaining));
        if (r.priceRows != null) bits.push("строк прайса " + fmtNum(r.priceRows));
        if (r.normNameRows != null) bits.push("нормализаций имён " + fmtNum(r.normNameRows));
        if (r.skuMap && r.skuMap !== "none") bits.push("индекс SKU: " + r.skuMap);
        if (r.productsScanned != null) bits.push("обработано позиций " + fmtNum(r.productsScanned));
        if (r.newMatchesSku != null) bits.push("+совп. SKU " + fmtNum(r.newMatchesSku));
        if (r.newMatchesName != null) bits.push("+совп. по имени " + fmtNum(r.newMatchesName));
        if (r.totalMatchesSaved != null) bits.push("вставлено строк " + fmtNum(r.totalMatchesSaved));
        if (r.userCancelled) bits.push("остановка пользователя");
        if (r.error) bits.push("ошибка: " + r.error);
        if (!bits.length) {
          try {
            return JSON.stringify(r);
          } catch (e2) {
            return "";
          }
        }
        return bits.join(", ");
      }

      function authHeaders() {
        var h = {};
        try {
          var u = localStorage.getItem("currentUser");
          var t = localStorage.getItem("authToken");
          if (u) h["x-auth-username"] = u;
          if (t) h["x-auth-token"] = t;
        } catch (e0) {}
        return h;
      }

      var actOffset = 0;
      var actLimit = 35;
      var actTotal = 0;
      var actPageLabelMap = {};
      var ACT_JOURNAL_COLLAPSE_KEY = "datagon_processes_activity_journal_collapsed_v1";
      /** Длинные карточки: свёрнуто по умолчанию, кнопка «Развернуть запись». */
      var ACT_ROW_EXPAND_THRESHOLD = 300;

      function kindClass(k) {
        if (k === "login") return "dg-act-login";
        if (k === "logout") return "dg-act-logout";
        if (k === "page_view") return "dg-act-page";
        if (k === "click") return "dg-act-click";
        if (k === "ui") return "dg-act-ui";
        return "";
      }

      function kindTitle(k) {
        if (k === "login") return "Вход";
        if (k === "logout") return "Выход";
        if (k === "page_view") return "Раздел";
        if (k === "click") return "Действие";
        if (k === "ui") return "Запись";
        return k || "Событие";
      }

      function fillActUserSelect(users) {
        var sel = document.getElementById("dg-act-user");
        if (!sel) return;
        var prev = sel.value;
        sel.innerHTML = '<option value="">Все пользователи</option>';
        (users || []).forEach(function (u) {
          var o = document.createElement("option");
          o.value = String(u.id);
          o.textContent = (u.full_name || u.username || "#" + u.id).trim();
          sel.appendChild(o);
        });
        if (prev && [].some.call(sel.options, function (x) { return x.value === prev; })) sel.value = prev;
      }

      function fillActPageOptions(pageOptions) {
        var sel = document.getElementById("dg-act-section");
        if (!sel) return;
        actPageLabelMap = {};
        var prev = sel.value;
        sel.innerHTML = '<option value="">Все разделы</option>';
        (pageOptions || []).forEach(function (p) {
          var val = String((p && p.value) != null ? p.value : "").trim();
          var lab = String((p && p.label) != null ? p.label : val).trim();
          if (!val) return;
          actPageLabelMap[val] = lab;
          var o = document.createElement("option");
          o.value = val;
          o.textContent = lab.length > 64 ? lab.slice(0, 62) + "…" : lab;
          sel.appendChild(o);
        });
        if (prev && [].some.call(sel.options, function (x) { return x.value === prev; })) sel.value = prev;
      }

      function renderActivityRows(rows) {
        var mount = document.getElementById("dg-act-list");
        if (!mount) return;
        mount.replaceChildren();
        if (!rows || !rows.length) {
          document.getElementById("dg-act-empty").style.display = "";
          return;
        }
        document.getElementById("dg-act-empty").style.display = "none";
        rows.forEach(function (r) {
          var wrap = document.createElement("div");
          wrap.className = "dg-act-item " + kindClass(r.kind);
          var head = document.createElement("div");
          head.className = "d-flex flex-wrap align-items-center gap-2 mb-1";
          var badge = document.createElement("span");
          badge.className = "badge bg-light text-dark border dg-act-badge";
          badge.textContent = kindTitle(r.kind);
          var who = document.createElement("strong");
          who.textContent = (r.full_name || r.username || "Пользователь #" + r.user_id).trim();
          var when = document.createElement("span");
          when.className = "text-muted small ms-auto";
          when.textContent = fmtDateTime(r.created_at);
          head.appendChild(badge);
          head.appendChild(who);
          head.appendChild(when);
          var title = document.createElement("div");
          title.className = "fw-semibold text-break";
          var bits = [];
          if (r.section) bits.push("раздел: " + (actPageLabelMap[r.section] || r.section));
          if (r.detail) {
            try {
              var o = JSON.parse(r.detail);
              if (o && typeof o === "object") {
                if (o.action === "user_create") {
                  if (o.username) bits.push("логин: «" + String(o.username) + "»");
                  if (o.full_name) bits.push(String(o.full_name));
                } else if (o.action === "user_delete") {
                  if (o.username) bits.push("удалён логин: «" + String(o.username) + "»");
                  if (o.full_name) bits.push(String(o.full_name));
                } else if (o.action === "matching_start" || o.action === "matching_retry") {
                  if (o.job_id != null) bits.push("задача #" + String(o.job_id));
                  if (o.site_label) bits.push(String(o.site_label));
                  if (o.product_search) bits.push("фильтр: «" + String(o.product_search).slice(0, 80) + "»");
                  if (o.product_ids_count) bits.push("в задаче товаров: " + String(o.product_ids_count));
                  if (o.products_preview && o.products_preview.length) {
                    bits.push(
                      "пример: " +
                        o.products_preview
                          .slice(0, 4)
                          .map(function (p) {
                            return "#" + p.id + " " + String(p.sku || "").slice(0, 28);
                          })
                          .join(", ")
                    );
                  }
                } else if (o.action === "sync_price_from_competitor") {
                  var nm0 = o.name ? String(o.name).slice(0, 100) : "";
                  var sk0 = o.sku ? String(o.sku).slice(0, 64) : "";
                  if (nm0) bits.push(nm0);
                  if (sk0) bits.push("SKU «" + sk0 + "»");
                  if (o.new_price != null && o.new_price !== "")
                    bits.push("новая цена: " + String(o.new_price) + " " + String(o.currency || "").trim());
                  if (o.competitor_source) bits.push("конкурент: " + String(o.competitor_source));
                  if (o.random_range_pct) bits.push("диапазон %: " + String(o.random_range_pct));
                } else if (o.action === "my_product_refresh_cms") {
                  if (o.name) bits.push(String(o.name).slice(0, 100));
                  if (o.sku) bits.push("SKU «" + String(o.sku).slice(0, 64) + "»");
                  if (o.site_id != null) bits.push("сайт #" + String(o.site_id));
                  if (o.source_id) bits.push("source_id: " + String(o.source_id).slice(0, 48));
                } else if (
                  o.ui_action === "matches_reject" ||
                  o.ui_action === "matches_confirm" ||
                  o.ui_action === "matches_unlink"
                ) {
                  if (o.my_product_name_full)
                    bits.push("наш товар: «" + String(o.my_product_name_full) + "»");
                  if (o.my_sku) bits.push("наш SKU: " + String(o.my_sku));
                  if (o.competitor_name_full)
                    bits.push("конкурент: «" + String(o.competitor_name_full) + "»");
                  if (o.competitor_sku) bits.push("SKU конкурента: " + String(o.competitor_sku));
                  if (o.my_site_name) bits.push("сайт: " + String(o.my_site_name));
                  if (o.competitor_project_label) bits.push("прайс: " + String(o.competitor_project_label));
                  if (o.product_match_id != null) bits.push("запись #" + String(o.product_match_id));
                } else {
                  if (r.kind === "page_view" && o.path) bits.push("адрес: " + String(o.path));
                  if (o.text) bits.push("«" + String(o.text).slice(0, 120) + "»");
                  if (o.tag) bits.push(String(o.tag).toLowerCase());
                }
              }
            } catch (eJ) {
              bits.push(String(r.detail).slice(0, 160));
            }
          }
          var labelFull = String(r.label || "—");
          var subLine = bits.length ? bits.join(" · ") : "";
          title.textContent = labelFull;
          var sub = null;
          if (bits.length) {
            sub = document.createElement("div");
            sub.className = "small text-muted";
            sub.textContent = subLine;
          }
          var needsRowExpand =
            labelFull.length > 160 ||
            subLine.length > 220 ||
            labelFull.length + subLine.length > ACT_ROW_EXPAND_THRESHOLD;
          wrap.appendChild(head);
          wrap.appendChild(title);
          if (sub) wrap.appendChild(sub);
          if (needsRowExpand) {
            title.classList.add("dg-act-row-detail", "dg-act-row-detail-collapsed");
            if (sub) sub.classList.add("dg-act-row-detail", "dg-act-row-detail-collapsed");
            var rowTgl = document.createElement("button");
            rowTgl.type = "button";
            rowTgl.className = "btn btn-link btn-sm p-0 align-self-start mt-1 text-decoration-none";
            rowTgl.setAttribute("aria-expanded", "false");
            rowTgl.textContent = "Развернуть запись";
            rowTgl.addEventListener("click", function () {
              var open = rowTgl.getAttribute("aria-expanded") === "true";
              var next = !open;
              rowTgl.setAttribute("aria-expanded", next ? "true" : "false");
              rowTgl.textContent = next ? "Свернуть запись" : "Развернуть запись";
              title.classList.toggle("dg-act-row-detail-collapsed", !next);
              if (sub) sub.classList.toggle("dg-act-row-detail-collapsed", !next);
            });
            wrap.appendChild(rowTgl);
          }
          mount.appendChild(wrap);
        });
      }

      function syncActPager() {
        var pg = document.getElementById("dg-act-pager");
        var hint = document.getElementById("dg-act-page-hint");
        if (!pg || !hint) return;
        if (actTotal <= actLimit) {
          pg.style.display = "none";
          return;
        }
        pg.style.display = "flex";
        var from = actOffset + 1;
        var to = Math.min(actOffset + actLimit, actTotal);
        hint.textContent = from + "–" + to + " из " + actTotal;
        document.getElementById("dg-act-prev").disabled = actOffset <= 0;
        document.getElementById("dg-act-next").disabled = actOffset + actLimit >= actTotal;
      }

      function resetActivityJournalFilters() {
        var kind = document.getElementById("dg-act-kind");
        var uid = document.getElementById("dg-act-user");
        var s = document.getElementById("dg-act-section");
        var f = document.getElementById("dg-act-from");
        var t = document.getElementById("dg-act-to");
        if (kind) kind.value = "";
        if (uid) uid.value = "";
        if (s) s.value = "";
        if (f) f.value = "";
        if (t) t.value = "";
        actOffset = 0;
      }

      function loadActivityJournal() {
        var deny = document.getElementById("dg-act-deny");
        var hero = document.getElementById("dg-activity-hero");
        if (!deny || !hero) return;
        var uid = String(document.getElementById("dg-act-user").value || "").trim();
        var kind = String(document.getElementById("dg-act-kind").value || "").trim();
        var sectionEl = document.getElementById("dg-act-section");
        var fromEl = document.getElementById("dg-act-from");
        var toEl = document.getElementById("dg-act-to");
        var section = sectionEl ? String(sectionEl.value || "").trim() : "";
        var fromTs = fromEl ? String(fromEl.value || "").trim() : "";
        var toTs = toEl ? String(toEl.value || "").trim() : "";
        var qs = new URLSearchParams({ limit: String(actLimit), offset: String(actOffset) });
        if (uid) qs.set("user_id", uid);
        if (kind) qs.set("kind", kind);
        if (section) qs.set("section", section);
        if (fromTs) qs.set("from_ts", fromTs);
        if (toTs) qs.set("to_ts", toTs);
        fetch("/api/activity/events?" + qs.toString(), { credentials: "same-origin", headers: authHeaders() })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (x.r.status === 403) {
              deny.style.display = "";
              var listEl = document.getElementById("dg-act-list");
              if (listEl) listEl.replaceChildren();
              document.getElementById("dg-act-empty").style.display = "none";
              document.getElementById("dg-act-pager").style.display = "none";
              return;
            }
            if (!x.r.ok) throw new Error((x.j && x.j.error) || "Журнал недоступен");
            deny.style.display = "none";
            actTotal = Number(x.j.total || 0);
            var hintRet = document.getElementById("dg-act-retention-hint");
            if (hintRet) {
              var rd = Number(x.j.retentionDays);
              if (!Number.isFinite(rd) || rd < 1) rd = 120;
              hintRet.textContent =
                "Хранение: события не старше " +
                rd +
                " дней (автоочистка при открытии журнала). Более старые записи удаляются.";
            }
            fillActUserSelect(x.j.users || []);
            fillActPageOptions(x.j.pageOptions || []);
            renderActivityRows(x.j.rows || []);
            syncActPager();
          })
          .catch(function () {
            deny.style.display = "none";
          });
      }

      function getSelectedSiteId() {
        return String(document.getElementById("dg-proc-site").value || "");
      }

      function showErr(msg) {
        var el = document.getElementById("dg-proc-err");
        if (!el) return;
        if (!msg) {
          el.style.display = "none";
          el.textContent = "";
          return;
        }
        el.style.display = "";
        el.textContent = msg;
      }

      function setBootLoad(vis) {
        var el = document.getElementById("dg-proc-boot-load");
        if (el) el.style.display = vis ? "" : "none";
      }

      function logNeedle() {
        return String(document.getElementById("dg-proc-smart-search").value || "")
          .trim()
          .toLowerCase();
      }

      function collectProcessesFilterForm() {
        return {
          smart: document.getElementById("dg-proc-smart-search").value,
          site_id: getSelectedSiteId(),
        };
      }

      function persistProcessesFilterForm() {
        try {
          if (window.DatagonFilters) window.DatagonFilters.save("processes", collectProcessesFilterForm());
        } catch (e) {}
      }

      function mergeProcessesPrefsFromStorage() {
        var DF = window.DatagonFilters;
        if (!DF || !DF.load) return;
        var prefs = DF.load("processes");
        if (!prefs) return;
        if (prefs.smart != null) document.getElementById("dg-proc-smart-search").value = String(prefs.smart);
        var sel = document.getElementById("dg-proc-site");
        if (prefs.site_id != null && [].some.call(sel.options, function (o) {
          return o.value === String(prefs.site_id);
        }))
          sel.value = String(prefs.site_id);
      }

      /**
       * Fallback-метаданные разделов автосинхронизации (порядок и подписи) на случай,
       * если бэкенд не вернул `autoSync.sections` (старый сервер без
       * `lib/datagonAutoSyncRegistry.js`). Основной источник истины — единый реестр
       * на бэкенде; см. `datagon-auto-sync-registry.mdc`.
       */
      var AS_TASK_SECTIONS = [
        { key: "myproducts", title: "Мои товары", subtitle: "Импорт из CMS магазинов", cfgEnabled: "myproducts_enabled", cfgTime: "myproducts_time" },
        { key: "moysklad", title: "МойСклад: ms_export (МСК)", subtitle: "Номенклатура, остатки, неснижаемый из МС; после сохранения ms_export — журнал нулевых остатков за сегодня (склад.поз. «Да», не архив). Не импорт отгрузок.", cfgEnabled: "moysklad_enabled", cfgTime: "moysklad_time" },
        { key: "ms_orders", title: "Заказы в МС", subtitle: "Импорт customerorder → ms_customer_order", cfgEnabled: "ms_orders_enabled", cfgTime: "ms_orders_time" },
        { key: "marketplaces", title: "Маркетплейсы", subtitle: "Ozon · WB · Я.Маркет", cfgEnabled: "marketplaces_enabled", cfgTime: "marketplaces_time" },
        { key: "huckster", title: "Калькуляция Huckster", subtitle: "Расчёт цен по правилам", cfgEnabled: "huckster_enabled", cfgTime: "huckster_time" },
        { key: "db_size", title: "Размер БД и диска", subtitle: "Снимок размеров таблиц БД и разбивка диска по папкам проекта", cfgEnabled: "db_size_enabled", cfgTime: "db_size_time" },
        { key: "dimensions", title: "Габариты МС", subtitle: "Выгрузка пользовательских замеров в МойСклад", cfgEnabled: "dimensions_enabled", cfgTime: "dimensions_time" },
        { key: "min_stock_export", title: "Неснижаемый остаток МС", subtitle: "Выгрузка ms_export.min_stock → minimumBalance; склад.поз. «Да», не архив", cfgEnabled: "min_stock_export_enabled", cfgTime: "min_stock_export_time" },
        { key: "mssales", title: "Продажи МС", subtitle: "Импорт entity/demand → ms_demand / ms_demand_position", cfgEnabled: "mssales_enabled", cfgTime: "mssales_time" },
        { key: "mssales_full", title: "Продажи МС (полный)", subtitle: "Импорт demand с fresh=true", cfgEnabled: "mssales_full_enabled", cfgTime: "mssales_full_time" },
      ];

      /**
       * Привести `autoSync.sections` (новый бэкенд) к виду секции для рендера.
       * Если бэкенд не вернул `sections`, собираем секции из старого `cfg`
       * по hardcoded `AS_TASK_SECTIONS` (back-compat).
       */
      var AS_PROC_CATEGORY_LABELS = {
        import_ms: "Импорт из МойСклад",
        export_ms: "Экспорт в МойСклад",
        cms: "Импорт из CMS",
        marketplace: "Маркетплейсы",
        external: "Внешние сервисы",
        internal: "Система",
      };

      function getMoscowNowPartsProc() {
        var parts = { time: "00:00", weekdayMon1Sun7: 1 };
        try {
          var fmt = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Europe/Moscow",
            hour: "2-digit",
            minute: "2-digit",
            weekday: "short",
            hour12: false,
          });
          var map = Object.create(null);
          fmt.formatToParts(new Date()).forEach(function (p) {
            if (p.type !== "literal") map[p.type] = p.value;
          });
          parts.time = (map.hour || "00") + ":" + (map.minute || "00");
          var wd = String(map.weekday || "Mon").slice(0, 3).toLowerCase();
          var wdMap = { mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6, sun: 7 };
          parts.weekdayMon1Sun7 = wdMap[wd] || 1;
        } catch (e) {}
        return parts;
      }

      function procWeekdaysSetFromExtras(extras) {
        var set = Object.create(null);
        var csv = "";
        if (Array.isArray(extras)) {
          extras.forEach(function (e) {
            var k = String((e && e.key) || "");
            if (k.endsWith("_weekdays")) csv = String((e && e.value) != null ? e.value : "");
          });
        }
        var s = String(csv).trim();
        if (!s || s === "ежедневно" || s === "1,2,3,4,5,6,7") {
          for (var a = 1; a <= 7; a++) set[a] = true;
          return set;
        }
        var ru = { пн: 1, вт: 2, ср: 3, чт: 4, пт: 5, сб: 6, вс: 7 };
        s.split(/[,;\s]+/).forEach(function (p) {
          var t = String(p).trim().toLowerCase();
          if (ru[t]) set[ru[t]] = true;
          else {
            var n = parseInt(t, 10);
            if (n >= 1 && n <= 7) set[n] = true;
          }
        });
        if (!Object.keys(set).length) for (var b = 1; b <= 7; b++) set[b] = true;
        return set;
      }

      function procTimeToMin(t) {
        var p = String(t || "00:00").slice(0, 5).split(":");
        return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
      }

      function procNextRunSortKey(sec) {
        if (!sec.enabled) return 999999999;
        var now = getMoscowNowPartsProc();
        var targetMin = procTimeToMin(sec.time);
        var wdSet = procWeekdaysSetFromExtras(sec.extras);
        var nowMin = procTimeToMin(now.time);
        for (var add = 0; add <= 8; add++) {
          var wd = ((now.weekdayMon1Sun7 - 1 + add) % 7) + 1;
          if (!wdSet[wd]) continue;
          var deltaMin = add * 24 * 60 + targetMin - nowMin;
          if (add === 0 && deltaMin <= 0) continue;
          return deltaMin;
        }
        return 999999998;
      }

      function sortAutoSyncSectionsByNextRun(sections) {
        return (Array.isArray(sections) ? sections : [])
          .slice()
          .sort(function (a, b) {
            var sa = procNextRunSortKey(a);
            var sb = procNextRunSortKey(b);
            if (sa !== sb) return sa - sb;
            return String(a.key || "").localeCompare(String(b.key || ""));
          });
      }

      function resolveAutoSyncSections(autoSync) {
        var as = autoSync || {};
        var sections = Array.isArray(as.sections) ? as.sections : null;
        if (sections && sections.length) {
          return sortAutoSyncSectionsByNextRun(
            sections.map(function (s) {
              return {
                key: String(s.key || ""),
                title: String(s.title || s.key || ""),
                subtitle: s.subtitle ? String(s.subtitle) : "",
                category: String(s.category || "internal"),
                enabled: Boolean(s.enabled),
                time: s.time != null ? String(s.time) : "—",
                extras: Array.isArray(s.extras) ? s.extras : [],
              };
            })
          );
        }
        var cfg = as.config || {};
        return AS_TASK_SECTIONS.map(function (sec) {
          return {
            key: sec.key,
            title: sec.title,
            subtitle: sec.subtitle || "",
            enabled: Boolean(cfg[sec.cfgEnabled]),
            time: cfg[sec.cfgTime] ? String(cfg[sec.cfgTime]) : "—",
            extras: []
          };
        });
      }

      /** Элементы `autoSync.queue` с бэка — `{ type, triggerType }` или строка; для UI только типы по порядку ожидания. */
      function parseAutoSyncQueueItem(item) {
        if (item && typeof item === "object" && item.type != null) {
          return {
            type: String(item.type || "").trim(),
            triggerType: String(item.triggerType || "schedule").trim() || "schedule",
          };
        }
        return { type: String(item || "").trim(), triggerType: "schedule" };
      }

      function formatAutoSyncQueueTypes(queue, autoSync) {
        if (!Array.isArray(queue) || !queue.length) return "пусто";
        return queue
          .map(function (item) {
            var p = parseAutoSyncQueueItem(item);
            if (!p.type) return "";
            return titleForAutoSyncTaskKey(autoSync, p.type) || p.type;
          })
          .filter(Boolean)
          .join(" → ");
      }

      /** Позиция в `autoSync.queue` по task_type (только задачи ещё не снятые воркером). */
      function buildAutoSyncQueueByTask(autoSync) {
        var out = Object.create(null);
        var q = autoSync && Array.isArray(autoSync.queue) ? autoSync.queue : [];
        q.forEach(function (item, idx) {
          var p = parseAutoSyncQueueItem(item);
          if (!p.type || out[p.type]) return;
          out[p.type] = {
            position: idx + 1,
            total: q.length,
            triggerType: p.triggerType,
          };
        });
        return out;
      }

      function formatQueuedAutoSyncLine(secKey, autoSync, queuedInfo) {
        var parts = ["В очереди автосинхронизации"];
        var rt = autoSync && Array.isArray(autoSync.running_tasks) ? autoSync.running_tasks : [];
        var ahead = rt
          .filter(function (k) {
            return String(k || "").trim() && String(k) !== String(secKey);
          })
          .map(function (k) {
            return titleForAutoSyncTaskKey(autoSync, k);
          })
          .filter(Boolean);
        if (ahead.length) parts.push("сейчас выполняется: " + ahead.join(", "));
        if (queuedInfo && Number(queuedInfo.position) > 1) {
          parts.push("позиция в очереди: " + queuedInfo.position + " из " + queuedInfo.total);
        }
        return parts.join(" · ");
      }

      function titleForAutoSyncTaskKey(autoSync, key) {
        var k = String(key || "").trim();
        if (!k) return "";
        var secs = resolveAutoSyncSections(autoSync || {});
        for (var i = 0; i < secs.length; i++) {
          if (secs[i].key === k) return String(secs[i].title || k);
        }
        return k;
      }

      function formatRunningAutoSyncTasks(autoSync) {
        var rt = autoSync && autoSync.running_tasks;
        if (!Array.isArray(rt) || !rt.length) return "";
        return rt
          .map(function (key) {
            return titleForAutoSyncTaskKey(autoSync, key);
          })
          .filter(Boolean)
          .join(", ");
      }

      function statusBadgeHtml(status) {
        var s = String(status || "").trim().toLowerCase();
        if (s === "completed") return '<span class="badge bg-success">Завершено</span>';
        if (s === "running") return '<span class="badge bg-primary">Выполняется</span>';
        if (s === "failed") return '<span class="badge bg-danger">Ошибка</span>';
        if (s === "interrupted") return '<span class="badge bg-warning text-dark">Прервано</span>';
        if (s === "queued") return '<span class="badge bg-secondary">В очереди</span>';
        if (s === "skipped") return '<span class="badge bg-secondary">Пропущено</span>';
        if (s) return '<span class="badge bg-light text-dark border">' + escapeText(s) + '</span>';
        return '<span class="badge bg-light text-dark border">—</span>';
      }

      function triggerBadgeHtml(trig) {
        var t = String(trig || "").trim().toLowerCase();
        if (t === "schedule") return '<span class="badge rounded-pill bg-info text-dark">по расписанию</span>';
        if (t === "manual") return '<span class="badge rounded-pill bg-secondary">вручную</span>';
        if (t === "manual_ui" || t === "manual_api") return '<span class="badge rounded-pill bg-secondary">вручную</span>';
        if (t) return '<span class="badge rounded-pill bg-light text-dark border">' + escapeText(t) + '</span>';
        return "";
      }

      function escapeText(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function autoSyncRunDurationSec(rec) {
        if (!rec || !rec.started_at || !rec.finished_at) return null;
        try {
          var a = new Date(rec.started_at).getTime();
          var b = new Date(rec.finished_at).getTime();
          if (!isFinite(a) || !isFinite(b) || b < a) return null;
          return Math.round((b - a) / 1000);
        } catch (_) {
          return null;
        }
      }

      function openAutoSyncRunLogModal(runIdStr) {
        var rec = dgProcAsRunLogById[runIdStr];

        if (titleEl) titleEl.textContent = "#" + String(rec.id) + " · " + tt;
        var msgRaw = String(rec.message || "").trim();
        var durSec = autoSyncRunDurationSec(rec);
        var lines = [
          "task_type: " + tt,
          "trigger_type: " + trig,

        ];
        if (durSec != null) lines.push("duration_sec: " + durSec);
        lines.push("", msgRaw || "(пустое сообщение)");
        if (
          st === "interrupted" &&
          (/перезапуск Node/i.test(msgRaw) || /закрыта при старте сервера/i.test(msgRaw))
        ) {
          lines.push("");
          lines.push(
            "Пояснение: это не сбой МойСклад — запись закрыта при остановке/перезапуске Node (процесс не вызвал finish)."
          );
          if (durSec != null && durSec < 300) {
            lines.push(
              "За " +
                durSec +
                " с до массовой выгрузки в МС обычно не доходят. Повторите «Запустить сейчас» и не перезапускайте сервер до завершения (~30–90 мин при ~5000 позиций)."
            );
          }
        }
        if (pre) pre.textContent = lines.join("\n");
        var isDim = tt.toLowerCase() === "dimensions";

        if ((isDim || isMinStock) && rec.started_at && rec.finished_at && dimWrap && dimBody) {

          qs.set("limit", "200");
          qs.set("from", new Date(rec.started_at).toISOString());
          qs.set("to", new Date(rec.finished_at).toISOString());
          var logUrl = isDim
            ? "/api/exports/dimensions/log/global?" +
              new URLSearchParams({
                action: "sync_ms_error",
                limit: "200",
                from: new Date(rec.started_at).toISOString(),
                to: new Date(rec.finished_at).toISOString(),
              }).toString()
            : "/api/processes/min-stock-export-errors?" + qs.toString();
          if (isDim) {
            foot.textContent =
              "Кнопка «Лог» — auto_sync_runs и отказы ms_dimensions_log. Для габаритов — «Ошибка МС» на «Габариты» → «Журнал изменений габаритов».";
          } else if (foot) {
            foot.textContent =
              "Кнопка «Лог» — auto_sync_runs и ошибки ms_min_stock_export_log за интервал запуска.";
          }
          fetch(logUrl, { credentials: "same-origin" })
            .then(function (r) {
              return r.json().then(function (j) {
                return { r: r, j: j };
              });
            })
            .then(function (x) {
              if (!x.r.ok || !x.j || !x.j.success) {
                dimBody.textContent =
                  "Не удалось загрузить журнал: " + String((x.j && x.j.error) || x.r.status || "?");
                return;
              }
              var rows = Array.isArray(x.j.rows) ? x.j.rows : [];
              if (!rows.length) {
                var dSec = autoSyncRunDurationSec(rec);
                if (String(rec.status || "").toLowerCase() === "interrupted" && dSec != null && dSec < 300) {
                  dimBody.textContent =
                    "За " +
                    dSec +
                    " с записей об ошибках нет: выгрузка в МойСклад не успела начаться (прервано перезапуском Node). Это ожидаемо для #" +
                    String(rec.id || "?") +
                    " — не ошибка МС.";
                } else {
                  dimBody.textContent =
                    "За интервал этого запуска записей об ошибках нет (ошибок не было или они вне интервала started_at…finished_at).";
                }
                return;
              }
              dimBody.textContent = rows
                .map(function (row) {
                  var t = row.created_at || row.changed_at ? fmtTimeMsk(row.created_at || row.changed_at) : "—";
                  if (isMinStock) {
                    return (
                      t +
                      "  " +
                      row.code +
                      "  min=" +
                      (row.min_stock != null ? row.min_stock : "—") +
                      "  http=" +
                      (row.http_status != null ? row.http_status : "0") +
                      ": " +
                      String(row.error_message || "").trim()
                    );
                  }
                  return t + "  " + row.code + "  " + String(row.note || "").trim();
                })
                .join("\n");
            })
            .catch(function (e) {
              dimBody.textContent = "Сеть: " + (e && e.message ? e.message : String(e));
            });
        } else if (dimWrap) {
          dimWrap.classList.add("d-none");
        }
        if (typeof dlg.showModal === "function") {
          try {
            dlg.showModal();
          } catch (e2) {
            window.alert(lines.join("\n"));
          }
        } else {
          window.alert(lines.join("\n"));
        }
      }

      function renderAutoSyncSections(sections, runs, isToday, liveByTask, autoSync) {

              var dateHint = document.createElement("div");
              dateHint.className = "small text-warning mb-2";

              runsBox.appendChild(dateHint);
            }
            runsBox.appendChild(liveNow);
          }
          if (showQueuedRow) {
            var queuedNow = document.createElement("div");
            queuedNow.className =
              "dg-proc-as-run dg-proc-as-run-queued border border-secondary-subtle rounded px-2 py-2 mb-2";
            var queuedMsg = formatQueuedAutoSyncLine(sec.key, autoSync || {}, queuedInfo);
            queuedNow.innerHTML =
              '<div class="dg-proc-as-run-top d-flex flex-wrap align-items-center gap-2 w-100">' +
              '<span class="dg-proc-as-run-time">ожидание</span>' +
              '<span class="dg-proc-as-run-status">' +
              statusBadgeHtml("queued") +
              " " +
              triggerBadgeHtml(queuedInfo.triggerType) +
              "</span></div>" +
              '<div class="text-muted small mt-1 dg-proc-as-run-msg" style="white-space:normal;word-break:break-word">' +
              escapeText(queuedMsg) +
              "</div>";
            runsBox.appendChild(queuedNow);
          }
          if (!list.length && !(liveActive && !hasRunningRow) && !showQueuedRow) {
            var empty = document.createElement("div");
            empty.className = "dg-proc-as-section-empty";
            empty.textContent = isToday
              ? "За сегодня запусков ещё не было"
              : "За выбранный день запусков не было";

          }
          if (list.length) {
            list.forEach(function (r) {
              var row = document.createElement("div");
              row.className = "dg-proc-as-run";
              var dur = "";
              if (r.started_at && r.finished_at) {
                var ms = new Date(r.finished_at).getTime() - new Date(r.started_at).getTime();
                if (isFinite(ms) && ms >= 0) {
                  if (ms < 60000) dur = Math.round(ms / 1000) + " с";
                  else if (ms < 3600000) dur = Math.round(ms / 60000) + " мин";
                  else dur = Math.floor(ms / 3600000) + " ч " + Math.round((ms % 3600000) / 60000) + " мин";
                }
              }
              var start = r.started_at ? fmtTimeMsk(r.started_at) : "—";
              var finish = r.finished_at ? fmtTimeMsk(r.finished_at) : "ещё идёт";
              var msgParts = [];

                      : "") +

                : "";

                '<div class="dg-proc-as-run-top d-flex flex-wrap align-items-center gap-2 w-100">' +
                '<span class="dg-proc-as-run-time">' +
                escapeText(start) +
                " → " +
                escapeText(finish) +
                (dur ? " · " + escapeText(dur) : "") +
                '</span><span class="dg-proc-as-run-status">' +
                statusBadgeHtml(r.status) +
                " " +
                triggerBadgeHtml(r.trigger_type) +
                '</span><button type="button" class="btn btn-sm btn-outline-secondary dg-proc-as-run-log-btn py-0 px-2" data-run-id="' +
                escapeText(String(r.id)) +
                '">Лог</button></div>' +
                msgHtml;
              runsBox.appendChild(row);
            });
          }
          block.appendChild(runsBox);
          root.appendChild(block);
        });
      }

      function fillSiteSelect(matchesSites) {
        var sel = document.getElementById("dg-proc-site");
        var prev = sel.value;
        sel.innerHTML = "";
        if (!matchesSites.length) {
          var o = document.createElement("option");
          o.value = "";
          o.textContent = "Нет сайтов";
          sel.appendChild(o);
          return;
        }
        matchesSites.forEach(function (s) {
          var opt = document.createElement("option");
          opt.value = String(s.id);
          opt.textContent = s.name || "Сайт #" + s.id;
          sel.appendChild(opt);
        });
        if (prev && [].some.call(sel.options, function (x) { return x.value === prev; })) sel.value = prev;
      }

      function applySiteFromResponse(json) {
        var matchesSites = Array.isArray(json.matchesSites) ? json.matchesSites : [];
        fillSiteSelect(matchesSites);
        var sel = document.getElementById("dg-proc-site");
        var responseSiteId = json.matches && json.matches.mySiteId ? String(json.matches.mySiteId) : "";
        var selectedBefore = getSelectedSiteId();
        if (responseSiteId) sel.value = responseSiteId;
        else if (!selectedBefore && matchesSites.length) sel.value = String(matchesSites[0].id);
      }

      function loadOverview(preferredSiteId) {
        var selected =
          preferredSiteId !== undefined && preferredSiteId !== null
            ? String(preferredSiteId)
            : getSelectedSiteId();
        loading = true;
        overviewFetchDepth += 1;
        var refBtn = document.getElementById("dg-proc-refresh-head");
        if (refBtn) refBtn.disabled = true;
        if (!overview) setBootLoad(true);
        var params = new URLSearchParams();
        if (selected) params.set("my_site_id", String(selected));
        if (forDate) params.set("for_date", String(forDate));
        var qs = params.toString();
        var url = "/api/processes/overview" + (qs ? "?" + qs : "");
        fetch(url, { credentials: "same-origin" })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok) throw new Error(x.j.error || "Не удалось загрузить сводку процессов");
            overview = x.j;
            /** Сервер может откорректировать дату (если за пределами окна) — синхронизируем UI. */
            if (overview.forDate && overview.forDate !== forDate) {
              forDate = overview.forDate;
              syncForDateUi();
            }
            if (Array.isArray(overview.forDateOptions) && overview.forDateOptions.length) {
              forDateOptions = overview.forDateOptions.slice();
              renderForDateChips();
            }
            applySiteFromResponse(x.j);
            if (!processesPrefsMerged) {
              mergeProcessesPrefsFromStorage();
              processesPrefsMerged = true;
            }
            renderFromOverview();
            /** Поллинг имеет смысл только за «сегодня»; для прошлых дней останавливаем. */
            if (overview.isToday === false) stopPoll();
            else if (!pollTimer) startPoll();
            showErr("");
          })
          .catch(function (e) {
            showErr(e.message || "Ошибка загрузки процессов");
          })
          .then(function () {
            loading = false;
            overviewFetchDepth = Math.max(0, overviewFetchDepth - 1);
            var rb = document.getElementById("dg-proc-refresh-head");
            if (rb && overviewFetchDepth === 0) rb.disabled = false;
            setBootLoad(false);
          });
      }

      function stopMsSync() {
        fetch("/api/ms/stop", { method: "POST", credentials: "same-origin" })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            if (!x.r.ok || !x.j.success) throw new Error(x.j.error || "Не удалось остановить синхронизацию");
            if (window.DatagonNotify && typeof window.DatagonNotify.toast === "function") {
              window.DatagonNotify.toast({ type: "success", message: "Синхронизация МойСклад остановлена", duration: 4500 });
            } else {
              alert("Синхронизация МойСклад остановлена");
            }
            loadOverview();
          })
          .catch(function (e) {
            var msg = e.message || "Ошибка остановки";
            if (window.DatagonNotify && typeof window.DatagonNotify.toast === "function") {
              window.DatagonNotify.toast({ type: "danger", message: msg, duration: 8000 });
            } else {
              alert(msg);
            }
          });
      }

      function renderForDateChips() {
        var box = document.getElementById("dg-proc-date-chips");
        if (!box) return;
        box.replaceChildren();
        var today = moscowTodayDate();
        forDateOptions.forEach(function (d, i) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn btn-sm btn-outline-secondary dg-proc-date-chip";
          if (d === forDate) btn.classList.add("active");
          var label;
          if (d === today) label = "Сегодня";
          else if (i === 1) label = "Вчера";
          else label = "−" + i;
          btn.textContent = label;
          btn.title = d;
          btn.setAttribute("data-date", d);
          btn.addEventListener("click", function () {
            if (forDate === d) return;
            forDate = d;
            syncForDateUi();
            loadOverview();
          });
          box.appendChild(btn);
        });
      }

      function syncForDateUi() {
        var input = document.getElementById("dg-proc-for-date");
        if (input) {
          if (forDateOptions.length) {
            input.max = forDateOptions[0];
            input.min = forDateOptions[forDateOptions.length - 1];
          }
          if (input.value !== forDate) input.value = forDate;
        }
        var box = document.getElementById("dg-proc-date-chips");
        if (box) {
          [].forEach.call(box.querySelectorAll(".dg-proc-date-chip"), function (b) {
            b.classList.toggle("active", b.getAttribute("data-date") === forDate);
          });
        }
      }

      (function bindForDate() {
        var input = document.getElementById("dg-proc-for-date");
        if (!input) return;
        syncForDateUi();
        renderForDateChips();
        input.addEventListener("change", function () {
          var v = String(input.value || "").trim();
          if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) {
            input.value = forDate;
            return;
          }
          /** Если ввели дату вне 14-дневного окна — мягко прижимаем к ближайшей допустимой. */
          if (forDateOptions.length && (v > forDateOptions[0] || v < forDateOptions[forDateOptions.length - 1])) {
            if (v > forDateOptions[0]) v = forDateOptions[0];
            else v = forDateOptions[forDateOptions.length - 1];
            input.value = v;
          }
          if (v === forDate) return;
          forDate = v;
          syncForDateUi();
          loadOverview();
        });
      })();

      (function processesFilterFieldVisibility() {
        var FIELD_GROUPS = [
          {
            title: "Фильтры",
            subtitle: "",
            items: [
              { key: "smart", title: "Умный поиск", hint: "" },
              { key: "site", title: "Мой сайт", hint: "" },
              { key: "refresh_inline", title: "Кнопка «Обновить сейчас»", hint: "" },
            ],
          },
          {
            title: "Действия",
            subtitle: "",
            items: [{ key: "filter_actions", title: "«Применить» и «По умолчанию»", hint: "" }],
          },
        ];
        if (window.DatagonFilterFieldsVisibility && window.DatagonFilterFieldsVisibility.init) {
          window.DatagonFilterFieldsVisibility.init({
            storageKeyPrefix: "datagon_processes_filter_fields_v2",
            attr: "data-dg-proc-filter-field",
            fieldGroups: FIELD_GROUPS,
            togglesRootId: "dg-proc-filter-blocks-toggles",
            idPrefix: "dg-proc-ff-",
            exposeAs: "DatagonProcessesFilterBlocks",
            onAfterApply: function () {},
          });
        }
      })();

      (function collapse() {
        var body = document.getElementById("dg-proc-filters-body");
        var btn = document.getElementById("dg-proc-filters-toggle");
        function applyStorage() {
          try {
            if (localStorage.getItem(FILTERS_KEY) === "1") {
              body.style.display = "none";
              btn.textContent = "Развернуть";
            } else {
              body.style.display = "";
              btn.textContent = "Свернуть";
            }
          } catch (e) {}
        }
        try {
          if (localStorage.getItem(FILTERS_KEY) === "1") body.style.display = "none";
        } catch (e) {}
        applyStorage();
        btn.addEventListener("click", function () {
          var hidden = body.style.display === "none";
          body.style.display = hidden ? "" : "none";
          btn.textContent = hidden ? "Свернуть" : "Развернуть";
          try {
            localStorage.setItem(FILTERS_KEY, hidden ? "0" : "1");
          } catch (e) {}
        });
      })();

      function startPoll() {
        stopPoll();
        pollTimer = setInterval(function () {
          if (processesPollShouldDefer()) return;
          loadOverview();
        }, 3000);
      }
      function stopPoll() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      (function initActivityJournalHeroCollapse() {
        var btn = document.getElementById("dg-act-hero-toggle");
        var body = document.getElementById("dg-act-hero-body");
        if (!btn || !body) return;
        function apply(collapsed) {
          body.style.display = collapsed ? "none" : "";
          btn.textContent = collapsed ? "Развернуть журнал" : "Свернуть журнал";
          btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
          try {
            localStorage.setItem(ACT_JOURNAL_COLLAPSE_KEY, collapsed ? "1" : "0");
          } catch (e) {}
        }
        try {
          apply(localStorage.getItem(ACT_JOURNAL_COLLAPSE_KEY) === "1");
        } catch (e2) {
          apply(false);
        }
        btn.addEventListener("click", function () {
          apply(body.style.display !== "none");
        });
      })();

      document.getElementById("dg-act-refresh").addEventListener("click", function () {
        actOffset = 0;
        loadActivityJournal();
      });
      document.getElementById("dg-act-user").addEventListener("change", function () {
        actOffset = 0;
        loadActivityJournal();
      });
      document.getElementById("dg-act-kind").addEventListener("change", function () {
        actOffset = 0;
        loadActivityJournal();
      });
      document.getElementById("dg-act-section").addEventListener("change", function () {
        actOffset = 0;
        loadActivityJournal();
      });
      document.getElementById("dg-act-from").addEventListener("change", function () {
        actOffset = 0;
        loadActivityJournal();
      });
      document.getElementById("dg-act-to").addEventListener("change", function () {
        actOffset = 0;
        loadActivityJournal();
      });
      document.getElementById("dg-act-reset-filters").addEventListener("click", function () {
        resetActivityJournalFilters();
        loadActivityJournal();
      });
      window.addEventListener("pageshow", function (e) {
        if (e && e.persisted) {
          resetActivityJournalFilters();
          loadActivityJournal();
        }
      });
      document.getElementById("dg-act-prev").addEventListener("click", function () {
        actOffset = Math.max(0, actOffset - actLimit);
        loadActivityJournal();
      });
      document.getElementById("dg-act-next").addEventListener("click", function () {
        if (actOffset + actLimit < actTotal) actOffset += actLimit;
        loadActivityJournal();
      });

      (function initAutoSyncRunLogDialog() {
        var dlg = document.getElementById("dg-proc-as-run-log-dialog");
        var btnClose = document.getElementById("dg-proc-as-run-log-d-close");
        var root = document.getElementById("dg-proc-as-sections");
        if (!dlg || !btnClose) return;
        btnClose.addEventListener("click", function () {
          if (typeof dlg.close === "function") dlg.close();
        });
        dlg.addEventListener("click", function (ev) {
          if (ev.target === dlg && typeof dlg.close === "function") dlg.close();
        });
        if (root) {
          root.addEventListener("click", function (ev) {
            var t = ev.target && ev.target.closest ? ev.target.closest(".dg-proc-as-run-log-btn") : null;
            if (!t) return;
            ev.preventDefault();
            var rid = t.getAttribute("data-run-id");
            if (rid) openAutoSyncRunLogModal(rid);
          });
        }
      })();

      bindProcessesSelectionPollGuard();
      loadOverview();
      resetActivityJournalFilters();
      loadActivityJournal();
      startPoll();
      window.addEventListener("beforeunload", stopPoll);
    })();
  </script>
