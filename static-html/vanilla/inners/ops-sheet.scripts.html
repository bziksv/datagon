<script>
(function () {
  "use strict";

  var OPS_COLS = [
    ["manager_name", "Менеджер"],
    ["turnover", "Оборот"],
    ["profit_before_tax", "Прибыль\nдо вычета налога"],
    ["profit_after_tax", "Прибыль\nс вычетом налога"],
    ["profit_pct", "Общий %\nприбыли за месяц"],
    ["bonus_current", "Премия за\nтекущий месяц"],
    ["applications_count", "Кол-во\nзаявок"],
    ["coefficient", "Коэффициент"],
    ["paid_applications", "Оплаченные\nзаявки"],
    ["apps_per_sale", "Отношение\nпродаж к заявкам"],
    ["avg_check", "Средний чек"],
    ["bonus_past", "Премия с учетом\nзаказов с прошлых месяцев"],
    ["salary", "Оклад с учетом\nотработанных дней"],
    ["fact_profit", "Фактическая прибыль\nза текущий месяц"],
    ["salary_paid", "Зарплата с учетом\nпремии за прошлые месяца"],
    ["company_profit", "Прибыль фирмы\nс вычетом оклада и премии"],
    ["company_pct", "% от оборота\nс вычетом зарплат"],
    ["plan_status", "План"],
  ];

  var MONEY_KEYS = {
    turnover: 1,
    profit_before_tax: 1,
    profit_after_tax: 1,
    bonus_current: 1,
    avg_check: 1,
    bonus_past: 1,
    salary: 1,
    fact_profit: 1,
    salary_paid: 1,
    company_profit: 1,
  };
  var PCT_KEYS = { profit_pct: 1, company_pct: 1 };
  var INT_KEYS = { applications_count: 1, paid_applications: 1 };
  var MANUAL_KEYS = {
    coefficient: 1,
    bonus_past: 1,
    salary: 1,
  };
  var FORMULA_HINTS = {
    turnover: "SUM(сумма оплаты без доставки) credit-менеджера за месяц",
    profit_before_tax: "SUM(net − доставка), без налога 16%",
    profit_after_tax: "SUM(разница / diff) с налогом 16%",
    profit_pct: "прибыль после налога / оборот × 100",
    bonus_current: "SUM(diff) × % МП. месяца / 100",
    applications_count:
      "задачи Planfix: постановщик = менеджер, месяц = дата создания, статус в корзине с галкой «в кол-во заявок»",
    coefficient: "Ручной ввод",
    paid_applications: "оплаченные продажи за месяц: один № счёта = одна продажа (НДС-позиции не удваивают)",
    apps_per_sale: "кол-во заявок / оплаченные заявки",
    avg_check: "оборот / оплаченные заявки",
    bonus_past: "Ручной ввод",
    salary: "Ручной ввод",
    fact_profit: "прибыль после налога − премия месяца − оклад",
    salary_paid: "оклад + премия с прошлыми месяцами",
    company_profit: "прибыль после налога − зарплата с премиями прошлых",
    company_pct: "прибыль фирмы / оборот × 100",
    plan_status: "выполнен, если оборот ≥ план менеджера",
  };

  var FILTERS_KEY = "datagon_ops_sheet_filters_collapsed_v1";
  var TABLE_COLLAPSE_KEY = "dg.ops-sheet.table-card.collapsed.v1";
  var PF_COLLAPSE_KEY = "datagon_ops_sheet_planfix_collapsed_v1";
  var COLS_KEY = "dg.ops.colvisible.v1";
  var WIDTHS_KEY = "dg.ops.colwidths.v1";
  var MONTH_SHORT = ["", "Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"];

  var cy = new Date().getFullYear();
  var curMonth = new Date().getMonth() + 1;
  var state = {
    year: cy,
    search: "",
    pf_months: [curMonth],
    jump_month: 0,
    pending: { year: cy, search: "", pf_months: [curMonth] },
    months: [],
    managers: [],
    years: [],
    can_write: false,
    visible: OPS_COLS.map(function (c) { return c[0]; }),
    widths: {},
    loading: false,
    pf: {
      buckets: [],
      statuses: [],
      unmatched: [],
      local_total: 0,
      report_total: null,
      report_meta: null,
      last_synced_at: null,
      configured: false,
      sync_script: null,
      unmapped: 0,
      account: "almamed",
      period: "",
      empty_status: 0,
      with_status: 0,
      task_q: "",
      task_page: 1,
      task_limit: 100,
      task_total: 0,
      task_pages: 1,
      task_shown: 0,
      task_rows: [],
      syncing: false,
    },
    pfExpanded: {},
  };

  function el(id) {
    return document.getElementById(id);
  }

  function fmt() {
    return window.DatagonFmt || null;
  }

  function formatMoney(v) {
    if (v == null || v === "") return "—";
    var f = fmt();
    return f && f.formatMoney ? f.formatMoney(v) : String(v);
  }

  function formatNum(v, digits) {
    if (v == null || v === "") return "—";
    var f = fmt();
    if (f && f.formatNumber) {
      return f.formatNumber(v, { maxFractionDigits: digits != null ? digits : 2, minFractionDigits: 0 });
    }
    return String(v);
  }

  function formatInt(v) {
    if (v == null || v === "") return "—";
    var f = fmt();
    return f && f.formatInteger ? f.formatInteger(v) : String(Math.round(v));
  }

  function parseInput(raw) {
    var f = fmt();
    if (f && f.parseNumberInput) return f.parseNumberInput(raw);
    var s = String(raw || "").trim().replace(/\s/g, "").replace(",", ".");
    if (!s) return null;
    var n = Number(s);
    return Number.isFinite(n) ? n : null;
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function labelHtml(label) {
    return escapeHtml(label).replace(/\n/g, "<br>");
  }

  function toast(type, message) {
    if (window.DatagonNotify && window.DatagonNotify.toast) {
      window.DatagonNotify.toast({ type: type || "info", message: message || "" });
    }
  }

  var urlSyncTimer = null;
  var SHARE_KEYS = ["year", "month", "search", "q", "page", "jump"];

  function hasShareQuery() {
    try {
      var p = new URLSearchParams(window.location.search || "");
      return SHARE_KEYS.some(function (k) {
        return p.get(k) != null && String(p.get(k)) !== "";
      });
    } catch (e) {
      return false;
    }
  }

  function normalizeMonthsList(raw, fallback) {
    var fb = Number(fallback);
    if (!Number.isFinite(fb) || fb < 0 || fb > 12) fb = curMonth;
    var arr = [];
    if (Array.isArray(raw)) arr = raw.slice();
    else if (raw == null || raw === "") arr = [fb];
    else {
      var s = String(raw).trim().toLowerCase();
      if (s === "all" || s === "0") return [0];
      arr = s.split(/[,;\s]+/).filter(Boolean);
    }
    var out = [];
    var whole = false;
    arr.forEach(function (x) {
      var n = Math.round(Number(x));
      if (!Number.isFinite(n)) return;
      if (n === 0) {
        whole = true;
        return;
      }
      if (n >= 1 && n <= 12 && out.indexOf(n) < 0) out.push(n);
    });
    if (whole || out.length >= 12) return [0];
    if (!out.length) return [fb === 0 ? 0 : fb];
    out.sort(function (a, b) {
      return a - b;
    });
    return out;
  }

  function parseShareMonths(raw) {
    if (raw == null || raw === "") return null;
    var m = String(raw).trim();
    if (m === "all" || m === "0") return [0];
    return normalizeMonthsList(m, curMonth);
  }

  function applyShareQueryToPending() {
    if (!hasShareQuery()) return false;
    var p = new URLSearchParams(window.location.search || "");
    var y = Number(p.get("year"));
    if (Number.isFinite(y) && y >= 2019 && y <= 2100) state.pending.year = y;
    if (p.has("months") || p.has("month")) {
      var pm = parseShareMonths(p.get("months") || p.get("month"));
      if (pm) state.pending.pf_months = pm;
    }
    if (p.has("search")) state.pending.search = p.get("search") || "";
    if (p.has("q")) state.pf.task_q = String(p.get("q") || "").trim();
    var page = Number(p.get("page"));
    if (Number.isFinite(page) && page > 1) state.pf.task_page = Math.round(page);
    if (p.has("jump")) {
      var jm = Number(p.get("jump"));
      state.jump_month = Number.isFinite(jm) && jm >= 1 && jm <= 12 ? Math.round(jm) : 0;
    }
    return true;
  }

  function syncUrlFromState() {
    var params = new URLSearchParams();
    params.set("year", String(state.year || cy));
    var months = pfMonthsFromUi();
    if (months[0] === 0) {
      params.set("month", "all");
    } else if (months.length === 1) {
      params.set("month", String(months[0]));
    } else {
      params.set("months", months.join(","));
      params.set("month", months.join(","));
    }
    if (state.search) params.set("search", state.search);
    if (state.pf.task_q) params.set("q", state.pf.task_q);
    if (Number(state.pf.task_page) > 1) params.set("page", String(state.pf.task_page));
    if (state.jump_month >= 1 && state.jump_month <= 12) params.set("jump", String(state.jump_month));
    var next = window.location.pathname + "?" + params.toString();
    try {
      window.history.replaceState(null, "", next);
    } catch (e) {}
  }

  function scheduleUrlSync() {
    if (urlSyncTimer) clearTimeout(urlSyncTimer);
    urlSyncTimer = setTimeout(function () {
      urlSyncTimer = null;
      syncUrlFromState();
    }, 50);
  }

  function paintFilterForm() {
    var y = el("dg-ops-f-year");
    var mirr = el("dg-ops-table-search-mirror");
    var tq = el("dg-ops-pf-tasks-search");
    if (y) y.value = String(state.pending.year || cy);
    if (mirr) mirr.value = String(state.pending.search || "");
    paintPfMonthSelect(state.pending.pf_months);
    if (tq) tq.value = String(state.pf.task_q || "");
  }

  function userStorageKey(base) {
    try {
      var u = (window.DatagonAuth && window.DatagonAuth.user && window.DatagonAuth.user.id) || "anon";
      return base + "." + u;
    } catch (e) {
      return base + ".anon";
    }
  }

  function loadVisible() {
    try {
      var raw = localStorage.getItem(userStorageKey(COLS_KEY));
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr) || !arr.length) return;
      var known = {};
      OPS_COLS.forEach(function (c) { known[c[0]] = 1; });
      var next = arr.filter(function (k) { return known[k]; });
      if (next.indexOf("manager_name") < 0) next.unshift("manager_name");
      if (next.length) state.visible = next;
    } catch (e) {}
  }

  function saveVisible() {
    try {
      localStorage.setItem(userStorageKey(COLS_KEY), JSON.stringify(state.visible));
    } catch (e) {}
  }

  function loadWidths() {
    try {
      var raw = localStorage.getItem(userStorageKey(WIDTHS_KEY));
      if (!raw) return;
      var obj = JSON.parse(raw);
      if (obj && typeof obj === "object") state.widths = obj;
    } catch (e) {}
  }

  function saveWidths() {
    try {
      localStorage.setItem(userStorageKey(WIDTHS_KEY), JSON.stringify(state.widths || {}));
    } catch (e) {}
  }

  function visibleCols() {
    var set = {};
    state.visible.forEach(function (k) { set[k] = 1; });
    return OPS_COLS.filter(function (c) { return set[c[0]]; });
  }

  function pctClass(v) {
    if (v == null || !Number.isFinite(Number(v))) return "";
    var n = Number(v);
    if (n < 5) return "dg-ops-pct-low";
    if (n >= 12) return "dg-ops-pct-high";
    return "dg-ops-pct-mid";
  }

  function setHint(text) {
    var h = el("dg-ops-status-hint");
    if (!h) return;
    if (!text) {
      h.style.display = "none";
      h.textContent = "";
      return;
    }
    h.style.display = "";
    h.textContent = text;
  }

  function syncDirtyMarker() {
    var btn = el("dg-ops-apply");
    if (!btn) return;
    var dirty =
      Number(state.pending.year) !== Number(state.year) ||
      monthsListKey(state.pending.pf_months) !== monthsListKey(state.pf_months) ||
      String(state.pending.search || "") !== String(state.search || "");
    btn.classList.toggle("dg-flt-dirty", dirty);
    btn.textContent = dirty ? "Применить •" : "Применить";
  }

  function fillYearSelect(years) {
    var sel = el("dg-ops-f-year");
    if (!sel) return;
    var list = (years && years.length ? years.slice() : [cy]).slice();
    if (list.indexOf(cy) < 0) list.unshift(cy);
    var py = Number(state.pending.year);
    if (Number.isFinite(py) && list.indexOf(py) < 0) list.push(py);
    list.sort(function (a, b) { return b - a; });
    sel.innerHTML = list
      .map(function (y) {
        return '<option value="' + y + '">' + y + "</option>";
      })
      .join("");
    sel.value = String(state.pending.year || cy);
  }

  function expandOpsTableCard() {
    var body = el("dg-ops-table-body");
    var btn = el("dg-ops-table-toggle");
    if (!body) return;
    try {
      localStorage.setItem(TABLE_COLLAPSE_KEY, "0");
    } catch (e) {}
    body.style.display = "";
    if (btn) btn.textContent = "Свернуть";
  }

  function jumpToMonth(month) {
    var m = Number(month);
    if (!m || m < 1 || m > 12) return;
    expandOpsTableCard();
    var host = el("dg-ops-month-jump");
    if (host) {
      var btns = host.querySelectorAll("button[data-ops-month]");
      for (var i = 0; i < btns.length; i += 1) {
        var on = Number(btns[i].getAttribute("data-ops-month")) === m;
        btns[i].classList.toggle("btn-primary", on);
        btns[i].classList.toggle("btn-outline-secondary", !on);
      }
    }
    var target = document.getElementById("ops-month-" + m);
    if (!target) {
      toast("warning", "Сначала нажмите «Применить» — ниже появятся 12 таблиц месяцев");
      return;
    }
    target.scrollIntoView({ behavior: "smooth", block: "start" });
    state.jump_month = m;
    scheduleUrlSync();
  }

  function renderMonthJump() {
    var host = el("dg-ops-month-jump");
    if (!host) return;
    host.innerHTML = "";
    for (var m = 1; m <= 12; m += 1) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "btn btn-sm btn-outline-secondary";
      b.textContent = MONTH_SHORT[m];
      b.setAttribute("data-ops-month", String(m));
      b.setAttribute("data-dg-no-activity", "1");
      b.title = "Прокрутить операционный лист к «" + MONTH_SHORT[m] + "»";
      b.addEventListener("click", function (ev) {
        jumpToMonth(ev.currentTarget.getAttribute("data-ops-month"));
      });
      host.appendChild(b);
    }
  }

  function cellWidthStyle(key) {
    var w = state.widths && state.widths[key];
    if (w && Number(w) >= 40) return "width:" + Number(w) + "px;min-width:" + Number(w) + "px;max-width:" + Number(w) + "px;";
    return "";
  }

  function formatCellValue(key, row) {
    var v = row[key];
    if (key === "manager_name") {
      var name = escapeHtml(row.manager_name || "");
      if (row.is_archived) {
        name += ' <span class="text-muted">(архив)</span>';
      }
      return name;
    }
    if (key === "plan_status") {
      if (!v) return "—";
      var ok = v === "выполнен";
      var tip =
        row.plan_amount != null
          ? "План: " + formatMoney(row.plan_amount) + "; факт: " + formatMoney(row.turnover)
          : "";
      return (
        '<span class="badge ' +
        (ok ? "bg-success" : "bg-danger") +
        '"' +
        (tip ? ' title="' + escapeHtml(tip) + '"' : "") +
        ">" +
        escapeHtml(v) +
        "</span>"
      );
    }
    if (MONEY_KEYS[key]) return escapeHtml(formatMoney(v));
    if (PCT_KEYS[key]) return escapeHtml(v == null ? "—" : formatNum(v, 2));
    if (INT_KEYS[key]) return escapeHtml(formatInt(v));
    if (key === "apps_per_sale" || key === "coefficient") return escapeHtml(v == null ? "—" : formatNum(v, 2));
    return escapeHtml(v == null || v === "" ? "—" : String(v));
  }

  function deriveClientTotals(rows) {
    function sum(key, money) {
      var any = false;
      var s = 0;
      rows.forEach(function (r) {
        var v = r[key];
        if (v == null || v === "") return;
        var n = Number(v);
        if (!Number.isFinite(n)) return;
        any = true;
        s += n;
      });
      if (!any) return null;
      return money ? Math.round(s * 100) / 100 : Math.round(s);
    }
    var turnover = sum("turnover", true) || 0;
    var profitAfter = sum("profit_after_tax", true) || 0;
    var bonusCurrent = sum("bonus_current", true) || 0;
    var apps = sum("applications_count", false);
    var paid = sum("paid_applications", false);
    var bonusPast = sum("bonus_past", true);
    var salary = sum("salary", true);
    var salaryN = salary == null ? 0 : salary;
    var bonusPastN = bonusPast == null ? 0 : bonusPast;
    var fact = Math.round((profitAfter - bonusCurrent - salaryN) * 100) / 100;
    var salaryPaid = Math.round((salaryN + bonusPastN) * 100) / 100;
    var company = Math.round((profitAfter - salaryPaid) * 100) / 100;
    return {
      manager_name: "ИТОГО",
      is_total: true,
      turnover: turnover,
      profit_before_tax: sum("profit_before_tax", true) || 0,
      profit_after_tax: profitAfter,
      profit_pct: turnover ? Math.round((profitAfter / turnover) * 10000) / 100 : null,
      bonus_current: bonusCurrent,
      applications_count: apps,
      coefficient: null,
      paid_applications: paid,
      apps_per_sale: paid && apps != null ? Math.round((apps / paid) * 10000) / 10000 : null,
      avg_check: paid ? Math.round((turnover / paid) * 100) / 100 : null,
      bonus_past: bonusPast,
      salary: salary,
      fact_profit: fact,
      salary_paid: salaryPaid,
      company_profit: company,
      company_pct: turnover ? Math.round((company / turnover) * 10000) / 100 : null,
      plan_status: null,
      plan_amount: null,
    };
  }

  function rowMatchesSearch(row) {
    var q = String(state.search || "")
      .trim()
      .toLowerCase();
    if (!q) return true;
    var name = String(row.manager_name || "").toLowerCase();
    var user = String(row.username || "").toLowerCase();
    return name.indexOf(q) >= 0 || user.indexOf(q) >= 0;
  }

  function rowIsAllZero(row) {
    if (!row || row.is_total) return false;
    var keys = [
      "turnover",
      "profit_before_tax",
      "profit_after_tax",
      "bonus_current",
      "applications_count",
      "paid_applications",
      "coefficient",
      "bonus_past",
      "salary",
      "fact_profit",
      "salary_paid",
      "company_profit",
    ];
    for (var i = 0; i < keys.length; i += 1) {
      var v = row[keys[i]];
      if (v == null || v === "") continue;
      var n = Number(v);
      if (Number.isFinite(n) && Math.abs(n) > 1e-9) return false;
    }
    return true;
  }

  function rowVisibleInSheet(row) {
    return rowMatchesSearch(row) && !rowIsAllZero(row);
  }

  function buildThead() {
    var cols = visibleCols();
    var ths = cols
      .map(function (c) {
        var key = c[0];
        var sticky = key === "manager_name" ? " dg-ops-sticky-name" : "";
        var hint = FORMULA_HINTS[key] ? ' title="' + escapeHtml(FORMULA_HINTS[key]) + '"' : "";
        return (
          '<th class="' +
          sticky +
          '" data-ops-col="' +
          escapeHtml(key) +
          '" style="' +
          cellWidthStyle(key) +
          '"' +
          hint +
          ">" +
          labelHtml(c[1]) +
          "</th>"
        );
      })
      .join("");
    return "<thead><tr>" + ths + "</tr></thead>";
  }

  function buildRowHtml(row, month) {
    var cols = visibleCols();
    var isTotal = !!row.is_total;
    var trClass = isTotal ? "dg-ops-row-total" : "";
    if (!isTotal && !rowVisibleInSheet(row)) trClass += (trClass ? " " : "") + "dg-ops-row-hidden";
    var tds = cols
      .map(function (c) {
        var key = c[0];
        var sticky = key === "manager_name" ? " dg-ops-sticky-name" : "";
        var classes = sticky;
        var num = MONEY_KEYS[key] || PCT_KEYS[key] || INT_KEYS[key] || key === "apps_per_sale" || key === "coefficient";
        if (num) classes += " dg-ops-num";
        if (PCT_KEYS[key]) classes += " " + pctClass(row[key]);
        var editable = !isTotal && state.can_write && MANUAL_KEYS[key];
        if (editable) classes += " dg-ops-cell-manual";
        var attrs = ' class="' + classes.trim() + '" data-ops-col="' + escapeHtml(key) + '" style="' + cellWidthStyle(key) + '"';
        if (editable) {
          attrs +=
            ' data-ops-edit="1" data-ops-month="' +
            month +
            '" data-ops-manager="' +
            escapeHtml(String(row.manager_user_id)) +
            '" data-ops-key="' +
            escapeHtml(key) +
            '"';
        }
        var hint = FORMULA_HINTS[key] && !editable ? ' title="' + escapeHtml(FORMULA_HINTS[key]) + '"' : "";
        return "<td" + attrs + hint + ">" + formatCellValue(key, row) + "</td>";
      })
      .join("");
    return '<tr class="' + trClass.trim() + '">' + tds + "</tr>";
  }

  function renderAll() {
    var host = el("dg-ops-months-host");
    var empty = el("dg-ops-empty");
    var yearLabel = el("dg-ops-year-label");
    if (yearLabel) yearLabel.textContent = state.year ? "· " + state.year : "";
    if (!host) return;
    host.innerHTML = "";
    if (!state.months || !state.months.length) {
      if (empty) empty.classList.remove("d-none");
      return;
    }
    if (empty) empty.classList.add("d-none");
    var thead = buildThead();
    state.months.forEach(function (block) {
      var visibleRows = (block.rows || []).filter(rowVisibleInSheet);
      var totals = state.search ? deriveClientTotals(visibleRows) : block.totals;
      var wrap = document.createElement("div");
      wrap.className = "dg-ops-month-block";

      if (totals && totals.profit_after_tax != null) metaParts.push("прибыль " + formatMoney(totals.profit_after_tax));
      if (totals && totals.profit_pct != null) metaParts.push(formatNum(totals.profit_pct, 2) + "%");
      var monthTitle = String(block.label || MONTH_SHORT[block.month] || "").trim();
      if (state.year) {
        monthTitle = monthTitle ? monthTitle.toUpperCase() + " — " + state.year : String(state.year);
      }
      wrap.innerHTML =
        '<div class="dg-ops-month-banner"><span>' +

      });
      if (totals) tbody.insertAdjacentHTML("beforeend", buildRowHtml(totals, block.month));

    });

      return r.json().then(function (j) {

          var err = new Error((j && j.error) || "HTTP " + r.status);

          throw err;
        }
        return j;

    });

  function setLogType(box, type) {

  function ensureProgressShell() {
    var box = el("dg-ops-action-log");
    if (!box) return null;
    if (box.getAttribute("data-ops-prog") !== "1") {
      box.innerHTML =
        '<div id="dg-ops-pf-prog-title"></div>' +
        '<div id="dg-ops-pf-prog-filters" class="small"></div>' +
        '<div id="dg-ops-pf-prog-stage"></div>' +
        '<div id="dg-ops-pf-prog-counts"></div>';
      box.setAttribute("data-ops-prog", "1");
    }
    return box;
  }

  function patchLiveProgress(j, sec) {
    // active:false — не трогаем DOM: иначе ensureProgressShell затирает журнал
    // пустой зелёной/синей плашкой (гонка с late-poll после завершения).
    if (j && j.success && j.active === false) return;
    var box = ensureProgressShell();
    if (!box) return;
    setLogType(box, "info");
    var title = "Синхронизация идёт, прошло " + fmtIntRu(sec) + " с…";
    setNodeText("dg-ops-pf-prog-title", title);
    setNodeText("dg-ops-pf-prog-filters", "Фильтры: " + planfixFiltersLine());
    setNodeText(
      "dg-ops-pf-prog-stage",
      "Этап: " + ((j && (j.message || j.stage)) || "ждём ответ сервера…")
    );
    var counts = "";
    if (j && (j.pages || j.fetched || j.stored || j.assigners_matched)) {
      counts =
        "Страниц: " +
        fmtIntRu(j.pages) +
        ", уникальных задач: " +
        fmtIntRu(j.fetched) +
        ", записано уникальных: " +
        fmtIntRu(j.stored);
      if (j.assigners_matched != null) {
        counts += "; постановщиков: " + fmtIntRu(j.assigners_matched);
      }
      if (j.unmatched_managers && j.unmatched_managers.length) {
        counts +=
          "; ⚠ нет в /user/list (часто уволенные — догрузим с задач по ФИО): " +
          j.unmatched_managers
            .map(function (n) {
              return String(n);
            })
            .join(", ");
      }
    } else {
      counts = "Ждём первую страницу / generate отчёта…";
    }
    setNodeText("dg-ops-pf-prog-counts", counts);
  }

  function paintPfMonthSelect(months) {
    var host = el("dg-ops-pf-months");
    if (!host) return;
    var want = normalizeMonthsList(months, curMonth);
    var wantSet = {};
    want.forEach(function (m) {
      wantSet[String(m)] = 1;
    });
    var btns = host.querySelectorAll("button[data-ops-pf-month]");
    for (var i = 0; i < btns.length; i += 1) {
      var b = btns[i];
      var v = b.getAttribute("data-ops-pf-month");
      var on = !!wantSet[v];
      b.classList.toggle("btn-primary", on);
      b.classList.toggle("btn-outline-secondary", !on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    }
  }

  function togglePfMonth(rawMonth) {
    var clicked = Math.round(Number(rawMonth));
    if (!Number.isFinite(clicked) || clicked < 0 || clicked > 12) return;
    var prev = normalizeMonthsList(state.pending.pf_months, curMonth);
    var next;
    if (clicked === 0) {
      next = [0];
    } else if (prev.indexOf(0) >= 0) {
      next = [clicked];
    } else if (prev.indexOf(clicked) >= 0) {
      next = prev.filter(function (m) {
        return m !== clicked;
      });
      if (!next.length) next = [clicked];
    } else {
      next = prev.concat([clicked]);
    }
    next = normalizeMonthsList(next, curMonth);
    state.pending.pf_months = next;
    paintPfMonthSelect(next);
    syncDirtyMarker();
  }

  function fillPfMonthSelect() {
    var host = el("dg-ops-pf-months");
    if (!host) return;
    host.innerHTML = "";
    function addBtn(val, label, extraClass) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "btn btn-sm btn-outline-secondary" + (extraClass ? " " + extraClass : "");
      b.textContent = label;
      b.setAttribute("data-ops-pf-month", String(val));
      b.setAttribute("data-dg-no-activity", "1");
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () {
        togglePfMonth(val);
      });
      host.appendChild(b);
    }
    addBtn(0, "Весь год", "is-year");
    for (var m = 1; m <= 12; m += 1) {
      addBtn(m, MONTH_SHORT[m]);
    }
    paintPfMonthSelect(state.pending.pf_months);
  }

  function formatPlanfixSummary(j, prefix) {

      "Поле: «" +
        escapeHtml((j.field && j.field.name) || "Статус Сделки/Письма") +
        "»" +
        (j.field && j.field.id ? " (id " + escapeHtml(String(j.field.id)) + ")" : ""),
      "Период: " + escapeHtml(j.period || planfixFiltersLine()),
      "Страниц: " + fmtIntRu(j.pages) +
        ", задач в выборке: " + fmtIntRu(j.total != null ? j.total : j.to_update),
    ];
    if (j.assigners_matched != null) {
      lines.push(
        "Постановщики в /user/list: " +
          fmtIntRu(j.assigners_matched) +

            ? " (" + j.assigner_names.map(function (n) { return escapeHtml(n); }).join(", ") + ")"
            : "")
      );
    }
    if (j.unmatched_managers && j.unmatched_managers.length) {
      lines.push(
        "Не в активном справочнике Planfix (/user/list) — задачи всё равно забираем доп. проходом по ФИО с заявки: " +
          j.unmatched_managers
            .map(function (n) {
              return escapeHtml(String(n));
            })
            .join(", ")
      );
    }
    if (j.field && j.field.lookup_error) {
      lines.push("<strong>Поле статуса:</strong> " + escapeHtml(j.field.lookup_error));
    }
    lines.push(
      "Записано: ✓ " + fmtIntRu(j.stored) +
        ", пропущено: " + fmtIntRu(j.skipped) +
        " (без номера " + fmtIntRu(j.no_id) + ", без даты " + fmtIntRu(j.no_date) +
        ", не менеджер продаж " + fmtIntRu(j.skipped_not_manager) + ")" +
        ", без статуса: " + fmtIntRu(j.empty_status) +
        ", локально за период: " + fmtIntRu(j.local_total) +
        ", время: " + fmtIntRu(j.duration_sec) + " с"
    );
    if (j.status_report) {
      lines.push(
        "Отчёт «Статус Сделки/Письма»: строк " +
          fmtIntRu(j.status_report.report_rows) +
          ", записано в задачи " +
          fmtIntRu(j.status_report.statuses_applied) +
          (j.status_report.covers_period === false
            ? " — сейв отчёта не содержит этот месяц, в Planfix сформируйте отчёт за нужный период"
            : "")
      );

    if (j.status_values_seen && j.status_values_seen.length) {
      lines.push("Статусы в выборке: " + j.status_values_seen.map(function (s) { return escapeHtml(s); }).join("; "));
    }
    if (j.sample_assigners && j.sample_assigners.length) {
      lines.push(

            .map(function (a) {
              return escapeHtml(a.name) + " (" + fmtIntRu(a.n) + ")";
            })
            .join("; ")
      );

    if (j.errors && j.errors.length) {
      lines.push("<strong>Ошибки:</strong>");
      j.errors.slice(0, 20).forEach(function (er) {
        lines.push("• " + escapeHtml(er.code || "?") + " — " + escapeHtml(er.error || "ошибка"));
      });

    return lines.join("<br>");

  function bucketSelectHtml(selected, suggested) {
    var cur = selected || suggested || "";
    var opts = ['<option value="">— не привязан —</option>'].concat(
      (state.pf.buckets || []).map(function (b) {
        return (
          '<option value="' +

          '"' +

  function isPfStatusSep(name, row) {
    if (row && (row.is_separator === true || row.is_separator === 1 || row.is_separator === "1")) return true;
    var s = String(name || "").trim();
    return /^__sep[:_-]/i.test(s) || /^[-–—_]{3,}$/.test(s);
  }

  function readMapItemsFromDom() {
    var tbody = el("dg-ops-pf-map-tbody");
    if (!tbody) return [];
    var rows = tbody.querySelectorAll("tr[data-ops-status]");
    var items = [];
    rows.forEach(function (tr) {
      var status = tr.getAttribute("data-ops-status") || "";
      var sep = tr.getAttribute("data-ops-sep") === "1";
      var sel = tr.querySelector("select.dg-ops-pf-bucket");
      var chk = tr.querySelector("input.dg-ops-pf-count");
      items.push({
        status_value: status,
        bucket: sep ? "" : sel ? sel.value : "",
        count_in_apps: sep ? false : !!(chk && chk.checked),
        is_separator: sep,
      });
    });
    return items;

  function statusRowHtml(s, idx) {
    var sep = isPfStatusSep(s.status_value, s);
    var grip =
      '<span class="dg-ops-pf-drag" title="Перетащить" aria-label="Перетащить">⋮⋮</span>';
    if (sep) {
      return (
        '<tr class="dg-ops-pf-sep" draggable="false" data-ops-sep="1" data-ops-status="' +
        escapeHtml(s.status_value) +
        '">' +
        '<td class="dg-ops-pf-grip-td">' +
        grip +
        "</td>" +
        '<td colspan="5" class="dg-ops-pf-sep-td"><span class="dg-ops-pf-sep-line">-----</span></td></tr>'
      );
    }
    var shownBucket = s.bucket || s.suggested_bucket || "";
    var countOn = !!s.count_in_apps;
    var mgrs = s.managers || [];
    var open = !!state.pfExpanded[s.status_value];
    var caret =
      mgrs.length
        ? '<button type="button" class="dg-ops-pf-expand" data-dg-no-activity="1" aria-expanded="' +
          (open ? "true" : "false") +
          '" title="' +
          (open ? "Свернуть постановщиков" : "Показать постановщиков") +

    var parent =
      '<tr draggable="false" data-ops-status="' +
      escapeHtml(s.status_value) +
      '">' +
      '<td class="dg-ops-pf-grip-td">' +
      grip +
      "</td>" +
      "<td>" +
      caret +
      '<span class="dg-ops-pf-status-name">' +
      (s.status_value
        ? escapeHtml(s.status_value)
        : "без статуса (Planfix не отдал поле)") +
      "</span>" +

      "</td>" +
      '<td class="dg-ops-num" title="Гистограмма отчёта Planfix 1:1, без отбора постановщик / шаблон КП">' +

      .map(function (m) {

  function renderPlanfixPanel() {
    var write = !!state.can_write;
    ["dg-ops-pf-sync", "dg-ops-pf-sync-report", "dg-ops-pf-save-map"].forEach(function (id) {
      var b = el(id);
      if (b) b.disabled = !write || !!state.pf.syncing;
    });
    var cancelBtn = el("dg-ops-pf-sync-cancel");
    if (cancelBtn) {
      cancelBtn.classList.toggle("d-none", !state.pf.syncing);
      cancelBtn.disabled = !write || !state.pf.syncing;
    }
    var badge = el("dg-ops-pf-script-badge");
    var sc = state.pf.sync_script;
    if (badge) {
      var badgeText = sc && sc.version ? "v" + sc.version + " · rev." + sc.revision : "";
      if (badge.textContent !== badgeText) badge.textContent = badgeText;
    }
    var tbody = el("dg-ops-pf-map-tbody");
    if (tbody) {
      var list = state.pf.statuses || [];
      if (!list.length) {
        tbody.innerHTML =
          '<tr><td colspan="6" class="text-muted">Нет строк за период — синхронизируйте выбранный месяц.</td></tr>';
      } else {
        tbody.innerHTML = list
          .map(function (s, idx) {
            return statusRowHtml(s, idx);
          })
          .join("");
      }
    }
    var insight = el("dg-ops-pf-insight");
    if (insight) {
      var tot = Number(state.pf.local_total || 0);
      var emptyN = Number(state.pf.empty_status || 0);
      var withN = Number(state.pf.with_status || 0);
      var period = state.pf.period || "";
      if (tot > 0 && emptyN === tot) {
        insight.className = "alert alert-warning py-2 px-3";
        insight.classList.remove("d-none");
        insight.innerHTML =
          "За <strong>" +
          escapeHtml(period || "период") +
          "</strong> в базе <strong>" +
          fmtIntRu(tot) +
          "</strong> задач без «Статус Сделки/Письма». Нажмите <strong>Синхронизировать Planfix</strong> ещё раз " +
          "(в конце синка статусы дописываются из отчёта). Перед этим в Planfix у отчёта выставьте тот же период.";
      } else if (tot === 0) {
        insight.className = "alert alert-info py-2 px-3";
        insight.classList.remove("d-none");
        insight.textContent =
          "За " + (period || "период") + " локально 0 задач. Выберите месяц/год и нажмите «Синхронизировать Planfix».";
      } else {
        insight.className = "alert alert-success py-2 px-3";
        insight.classList.remove("d-none");
        var repTot = state.pf.report_total;
        var rm = state.pf.report_meta || {};
        insight.innerHTML =
          "Период <strong>" +
          escapeHtml(period || "") +
          "</strong>: в заявках листа <strong>" +
          fmtIntRu(tot) +
          "</strong> (постановщик = менеджер продаж), со статусом " +
          fmtIntRu(withN) +
          ", без статуса " +
          fmtIntRu(emptyN) +
          ".<br><strong>В отчёте Planfix</strong> — 1:1 с гистограммой" +
          (rm.save_id ? " (сейв №" + escapeHtml(String(rm.save_id)) + ")" : "") +
          (repTot != null ? ": <strong>" + fmtIntRu(repTot) + "</strong> задач" : " (нет данных)") +
          ". <strong>В заявках листа</strong> меньше, если постановщик не менеджер продаж.";
      }
    }
    var um = el("dg-ops-pf-unmatched");
    if (um) {
      var parts = [];
      parts.push(
        "Локально за период" +
          (state.pf.period ? " (" + escapeHtml(state.pf.period) + ")" : "") +
          ": " +
          fmtIntRu(state.pf.local_total) +
          " задач" +
          (state.pf.empty_status ? ", без статуса: " + fmtIntRu(state.pf.empty_status) : "") +
          "."
      );
      if (state.pf.last_synced_at) parts.push("Последняя синхронизация: " + String(state.pf.last_synced_at) + ".");
      if (state.pf.unmapped) parts.push("Без корзины: " + fmtIntRu(state.pf.unmapped) + ".");
      if (!state.pf.configured) parts.push("Токен Planfix не задан (Настройки → Planfix).");
      var unmatched = state.pf.unmatched || [];
      if (unmatched.length) {
        parts.push(
          "Не сопоставлены постановщики: " +
            unmatched
              .slice(0, 12)
              .map(function (u) {
                return escapeHtml(u.name) + " (" + fmtIntRu(u.tasks) + ")";
              })
              .join("; ") +
            (unmatched.length > 12 ? "…" : "")
        );
      }
      var html = parts.join(" ");
      if (um.innerHTML !== html) um.innerHTML = html;
    }
  }

  function waitForActivePfSync(seed, opts) {
    opts = opts || {};
    var startedWait = Date.now();
    var seenActive = !!(seed && seed.active);
    if (seed && seed.active) {
      patchLiveProgress(seed, Number(seed.elapsed_sec) || 0);
    } else {
      patchLiveProgress({ message: "ждём старт синка на сервере…" }, 0);
    }
    return new Promise(function (resolve, reject) {
      var ticks = 0;
      function tick() {
        ticks += 1;
        fetch("/api/ops-sheet/planfix-sync-status", { credentials: "same-origin" })
          .then(function (r) {
            return r.json();
          })
          .then(function (j) {
            if (j && j.active) seenActive = true;
            var sec = Number(j && j.elapsed_sec) || Math.round((Date.now() - startedWait) / 1000);
            if (j && j.success && !j.active) {
              // Пока job ещё не помечен active — не считаем «готово» (гонка с POST).
              if (
                !seenActive &&
                j.stage !== "done" &&
                j.stage !== "error" &&
                j.stage !== "cancelled"
              ) {
                patchLiveProgress(
                  { message: "ждём старт синка на сервере…", stage: j.stage },
                  sec
                );
                if (ticks > 2400) {
                  reject(new Error("Синк Planfix не стартовал за 40 мин"));
                  return;
                }
                window.setTimeout(tick, 400);
                return;
              }
              if (j.stage === "cancelled") {
                resolve({
                  success: true,
                  cancelled: true,
                  attached: !!opts.existing,
                  pages: j.pages,
                  stored: j.stored,
                  fetched: j.fetched,
                  message: j.message,
                });
                return;
              }
              if (j.stage === "error" || j.last_error) {
                reject(new Error(j.last_error || j.message || "Синк Planfix завершился с ошибкой"));
                return;
              }
              // Не patchLiveProgress(active:false) — затрёт прогресс пустой плашкой.
              showActionLog(
                "info",
                "Синк завершён на сервере, обновляем таблицу статусов…<br>Фильтры: " +
                  planfixFiltersLine() +
                  (j.message ? "<br>Последний этап: " + escapeHtml(j.message) : ""),
                true
              );
              loadPlanfix()
                .then(function (panel) {
                  resolve({
                    success: true,
                    attached: !!opts.existing,
                    started: true,
                    pages: j.pages,
                    stored: j.stored,
                    total: j.fetched,
                    fetched: j.fetched,
                    duration_sec: sec,
                    period: j.year
                      ? Number(j.month)
                        ? "месяц " + j.month + " / " + j.year
                        : "весь " + j.year
                      : "",
                    statuses: panel && panel.statuses,
                    buckets: panel && panel.buckets,
                    local_total: panel && panel.local_total,
                    last_synced_at: panel && panel.last_synced_at,
                    empty_status: panel && panel.empty_status,
                    with_status: panel && panel.with_status,
                    unmatched_assigners: panel && panel.unmatched_assigners,
                    sync_script: panel && panel.sync_script,
                    status_report: j.status_report || (panel && panel.status_report) || null,
                  });
                })
                .catch(reject);
              return;
            }
            patchLiveProgress(j, sec);
            if (ticks > 2400) {
              reject(new Error("Синк Planfix не завершился за 40 мин — обновите страницу и проверьте журнал"));
              return null;
            }
            window.setTimeout(tick, 1000);
            return null;
          })
          .catch(function (e) {
            if (ticks > 2400) {
              reject(e);
              return;
            }
            window.setTimeout(tick, 1500);
          });
      }
      tick();
    });
  }

  function runPlanfixSync(opts) {
    opts = opts || {};
    var reportOnly = !!opts.reportOnly;
    var started = Date.now();
    var year = state.year;
    state.pf.syncing = true;
    renderPlanfixPanel();
    patchLiveProgress(
      { message: reportOnly ? "только отчёт Planfix…" : "старт полного синка Planfix…" },
      0
    );
    var lastProg = null;
    var pollAlive = true;
    var timer = setInterval(function () {
      if (!pollAlive) return;
      var sec = Math.round((Date.now() - started) / 1000);
      fetch("/api/ops-sheet/planfix-sync-status", { credentials: "same-origin" })
        .then(function (r) {
          return r.json();
        })
        .then(function (j) {
          if (!pollAlive) return;
          if (j && j.success) lastProg = j;
          // Late-ответ после clearInterval не должен затирать итоговый журнал.
          if (j && j.active === false) return;
          patchLiveProgress(lastProg || j, sec);
        })
        .catch(function () {
          if (!pollAlive) return;
          patchLiveProgress(lastProg, sec);
        });
    }, 1000);
    var months = pfMonthsFromUi();
    var body = { year: year, month: months.length === 1 ? months[0] : 0, months: months };
    if (reportOnly) body.report_only = 1;
    var run = function () {
      return fetch("/api/ops-sheet/planfix-sync", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }).then(function (r) {
        return r.json().then(function (j) {
          if (r.status === 409 || (j && j.attached && j.active)) {
            return waitForActivePfSync(j, { existing: true });
          }
          if (!r.ok || !j || j.success === false) {
            throw new Error((j && j.error) || "HTTP " + r.status);
          }
          if (j.started) {
            return waitForActivePfSync(j, { existing: false });
          }
          return j;
        });
      });
    };
    var btn = el(reportOnly ? "dg-ops-pf-sync-report" : "dg-ops-pf-sync");
    var p =
      window.DatagonNotify && window.DatagonNotify.busyRun && btn
        ? window.DatagonNotify.busyRun(btn, run)
        : run();
    return p
      .then(function (j) {
        pollAlive = false;
        clearInterval(timer);
        state.pf.syncing = false;
        renderPlanfixPanel();
        if (j && j.cancelled) {
          showActionLog(
            "warning",
            "Синк Planfix остановлен. " +
              escapeHtml(j.message || "") +
              "<br>Фильтры: " +
              planfixFiltersLine() +
              "<br>Период в БД может быть неполным — полный снимок после нового синка.",
            true
          );
          toast("warning", "Синк Planfix остановлен");
          return loadPlanfix().then(function () {
            return loadYear();
          });
        }
        applyPlanfixPanel(j);
        showActionLog(
          "success",
          formatPlanfixSummary(j, reportOnly ? "Только отчёт Planfix" : "Синхронизация Planfix"),
          true
        );
        toast("success", reportOnly ? "Отчёт Planfix обновлён" : "Синк Planfix завершён");
        return loadYear();
      })
      .catch(function (e) {
        pollAlive = false;
        clearInterval(timer);
        state.pf.syncing = false;
        renderPlanfixPanel();
        showActionLog("danger", "Ошибка: " + escapeHtml(e.message || e) + "<br>Фильтры: " + planfixFiltersLine(), true);
        toast("danger", e.message || "Planfix");
        return loadPlanfix();
      });
  }

  function savePlanfixMap(opts) {
    opts = opts || {};
    var items = readMapItemsFromDom();
    var box = el("dg-ops-pf-save-msg");
    function setMsg(type, html) {
      if (opts.silent && type !== "danger") return;
      if (!box) return;
      box.className = "alert mt-3 mb-0 alert-" + type;
      box.innerHTML = html;
      box.classList.remove("d-none");
    }
    if (!items.length) {
      setMsg("warning", "Сначала синхронизируйте Planfix — список статусов пустой.");
      return;
    }
    setMsg("warning", "Сохраняем…");
    var run = function () {
      return fetch("/api/ops-sheet/planfix-status-map", {
        method: "PUT",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          year: state.year,
          month: pfMonthFromUi(),
          months: pfMonthsFromUi(),
          items: items,
        }),
      }).then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok || !j || j.success === false) {
            throw new Error((j && j.error) || "HTTP " + r.status);
          }
          return j;
        });
      });
    };
    var btn = el("dg-ops-pf-save-map");
    var p =
      window.DatagonNotify && window.DatagonNotify.busyRun && btn
        ? window.DatagonNotify.busyRun(btn, run)

    return p
      .then(function (j) {
        applyPlanfixPanel(j);
        if (j.mismatches && j.mismatches.length) {

      .catch(function (e) {
        setMsg("danger", escapeHtml(e.message || "Ошибка сохранения"));
        toast("danger", e.message || "Не удалось сохранить привязку");
      });

  function findMonthBlock(month) {
    return (state.months || []).find(function (b) {
      return Number(b.month) === Number(month);
    });
  }

  function findRow(month, managerId) {
    var block = findMonthBlock(month);
    if (!block) return null;
    return (block.rows || []).find(function (r) {
      return Number(r.manager_user_id) === Number(managerId);
    });
  }

  function applySavedRow(month, row, totals) {
    var block = findMonthBlock(month);
    if (!block || !row) return;
    block.rows = (block.rows || []).map(function (r) {
      return Number(r.manager_user_id) === Number(row.manager_user_id) ? row : r;
    });
    if (totals) block.totals = totals;
    renderAll();
  }

  function saveManual(month, managerId, key, value) {
    var body = {
      year: state.year,
      month: Number(month),
      manager_user_id: Number(managerId),
    };
    body[key] = value;
    return fetch("/api/ops-sheet/manual", {
      method: "PUT",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || !j || j.success === false) {
          throw new Error((j && j.error) || "HTTP " + r.status);
        }
        applySavedRow(month, j.row, j.totals);
        toast("success", "Сохранено");
        return j;
      });
    });
  }

  function startEdit(td) {
    if (!td || td.getAttribute("data-ops-editing") === "1") return;
    if (!state.can_write) return;
    var key = td.getAttribute("data-ops-key");
    var month = td.getAttribute("data-ops-month");
    var managerId = td.getAttribute("data-ops-manager");
    var row = findRow(month, managerId);
    if (!row || !key) return;
    var prev = row[key];
    td.setAttribute("data-ops-editing", "1");
    td.classList.add("dg-ops-dirty");
    var input = document.createElement("input");
    input.type = "text";
    input.setAttribute("data-dg-no-activity", "1");
    if (prev == null || prev === "") input.value = "";
    else if (MONEY_KEYS[key] || key === "coefficient") input.value = formatNum(prev, key === "coefficient" ? 4 : 2);
    else input.value = String(prev);
    td.innerHTML = "";
    td.appendChild(input);
    input.focus();
    input.select();

    var done = false;
    function finish(commit) {
      if (done) return;
      done = true;
      td.removeAttribute("data-ops-editing");
      td.classList.remove("dg-ops-dirty");
      if (!commit) {
        td.innerHTML = formatCellValue(key, row);
        return;
      }
      var raw = input.value;
      var parsed;
      if (!String(raw).trim()) parsed = null;
      else if (INT_KEYS[key]) {
        parsed = parseInput(raw);
        if (parsed == null || parsed < 0 || Math.round(parsed) !== parsed) {
          toast("danger", "Нужно целое число ≥ 0");
          td.innerHTML = formatCellValue(key, row);
          return;
        }
        parsed = Math.round(parsed);
      } else {
        parsed = parseInput(raw);
        if (parsed == null) {
          toast("danger", "Некорректное число");
          td.innerHTML = formatCellValue(key, row);
          return;
        }
      }
      td.innerHTML = "…";
      saveManual(month, managerId, key, parsed).catch(function (e) {
        toast("danger", e.message || "Ошибка сохранения");
        td.innerHTML = formatCellValue(key, row);
      });
    }

    input.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") {
        ev.preventDefault();
        finish(true);
      } else if (ev.key === "Escape") {
        ev.preventDefault();
        finish(false);
      }
    });
    input.addEventListener("blur", function () {
      setTimeout(function () {
        finish(true);
      }, 0);
    });
  }

  function columnControls() {
    var wrap = el("dg-ops-toolbox-panels");
    var colPanel = el("dg-ops-columns-panel");
    var wPanel = el("dg-ops-widths-panel");
    function syncWrap() {
      var open =
        (colPanel && colPanel.classList.contains("open")) ||
        (wPanel && wPanel.classList.contains("open"));
      if (wrap) wrap.classList.toggle("d-none", !open);
    }
    function closeAll() {
      if (colPanel) colPanel.classList.remove("open");
      if (wPanel) wPanel.classList.remove("open");
      syncWrap();
    }
    if (el("dg-ops-columns-toggle")) {
      el("dg-ops-columns-toggle").addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (wPanel) wPanel.classList.remove("open");
        if (colPanel) colPanel.classList.toggle("open");
        syncWrap();
      });
    }
    if (el("dg-ops-widths-toggle")) {
      el("dg-ops-widths-toggle").addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (colPanel) colPanel.classList.remove("open");
        if (wPanel) wPanel.classList.toggle("open");
        syncWrap();
      });
    }
    document.addEventListener("click", function (ev) {
      if (wrap && wrap.contains(ev.target)) return;
      if (ev.target && ev.target.closest && ev.target.closest("#dg-ops-columns-toggle, #dg-ops-widths-toggle")) return;
      closeAll();
    });
    if (el("dg-ops-columns-all")) {
      el("dg-ops-columns-all").addEventListener("click", function () {
        state.visible = OPS_COLS.map(function (c) { return c[0]; });
        saveVisible();
        renderColumnControls();
        renderAll();
      });
    }
    if (el("dg-ops-columns-default")) {
      el("dg-ops-columns-default").addEventListener("click", function () {
        state.visible = OPS_COLS.map(function (c) { return c[0]; });
        saveVisible();
        renderColumnControls();
        renderAll();
      });
    }
    if (el("dg-ops-columns-list")) {
      el("dg-ops-columns-list").addEventListener("change", function (ev) {
        var t = ev.target;
        if (!t || !t.getAttribute("data-ops-col")) return;
        var key = t.getAttribute("data-ops-col");
        if (key === "manager_name") return;
        var on = !!t.checked;
        if (on && state.visible.indexOf(key) < 0) state.visible.push(key);
        if (!on) state.visible = state.visible.filter(function (k) { return k !== key; });
        if (state.visible.indexOf("manager_name") < 0) state.visible.unshift("manager_name");
        saveVisible();
        renderAll();
      });
    }
    if (el("dg-ops-widths-default")) {
      el("dg-ops-widths-default").addEventListener("click", function () {
        state.widths = {};
        saveWidths();
        renderWidthControls();
        renderAll();
      });
    }
    if (el("dg-ops-widths-list")) {
      el("dg-ops-widths-list").addEventListener("change", function (ev) {
        var t = ev.target;
        if (!t || !t.getAttribute("data-ops-width")) return;
        var key = t.getAttribute("data-ops-width");
        var n = Number(t.value);
        if (Number.isFinite(n) && n >= 40) state.widths[key] = Math.round(n);
        else delete state.widths[key];
        saveWidths();
        renderAll();
      });
    }
    renderColumnControls();
    renderWidthControls();
  }

  function filtersCollapse() {
    var body = el("dg-ops-filters-body");
    var btn = el("dg-ops-filters-toggle");
    if (!body || !btn) return;
    function apply() {
      var c = false;
      try { c = localStorage.getItem(FILTERS_KEY) === "1"; } catch (e) {}
      body.style.display = c ? "none" : "";
      btn.textContent = c ? "Развернуть" : "Свернуть";
    }
    btn.addEventListener("click", function () {
      var c = false;
      try { c = localStorage.getItem(FILTERS_KEY) === "1"; } catch (e) {}
      try { localStorage.setItem(FILTERS_KEY, c ? "0" : "1"); } catch (e2) {}
      apply();
    });
    apply();
  }

  function tableCardCollapse() {
    var body = el("dg-ops-table-body");
    var btn = el("dg-ops-table-toggle");
    if (!body || !btn) return;
    function apply() {
      var c = false;
      try { c = localStorage.getItem(TABLE_COLLAPSE_KEY) === "1"; } catch (e) {}
      body.style.display = c ? "none" : "";
      btn.textContent = c ? "Развернуть" : "Свернуть";
    }
    btn.addEventListener("click", function () {
      var c = false;
      try { c = localStorage.getItem(TABLE_COLLAPSE_KEY) === "1"; } catch (e) {}
      try { localStorage.setItem(TABLE_COLLAPSE_KEY, c ? "0" : "1"); } catch (e2) {}
      apply();
    });
    apply();
  }

  function bindHeaderSearchMirror() {
    var b = el("dg-ops-table-search-mirror");
    if (!b) return;
    b.addEventListener("input", function () {
      state.pending.search = b.value;
      syncDirtyMarker();
    });
    b.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") {
        ev.preventDefault();
        if (el("dg-ops-apply")) el("dg-ops-apply").click();
      } else if (ev.key === "Escape") {
        b.value = "";
        state.pending.search = "";
        commitFilters();
      }
    });
    b.addEventListener("search", function () {
      if (!b.value) {
        state.pending.search = "";
        commitFilters();
      }
    });
  }

  function bindFilters() {
    var y = el("dg-ops-f-year");
    if (y) {
      y.addEventListener("change", function () {
        state.pending.year = Number(y.value) || cy;
        syncDirtyMarker();
      });
    }
    if (el("dg-ops-apply")) {
      el("dg-ops-apply").addEventListener("click", function () {
        commitFilters();
      });
    }
    if (el("dg-ops-reset")) {
      el("dg-ops-reset").addEventListener("click", function () {
        resetFilters();
      });
    }
  }

  function planfixCardCollapse() {
    var body = el("dg-ops-pf-body");
    var btn = el("dg-ops-pf-toggle");
    if (!body || !btn) return;
    function apply() {
      var c = false;
      try { c = localStorage.getItem(PF_COLLAPSE_KEY) === "1"; } catch (e) {}
      body.style.display = c ? "none" : "";
      btn.textContent = c ? "Развернуть" : "Свернуть";
    }
    btn.addEventListener("click", function () {
      var c = false;
      try { c = localStorage.getItem(PF_COLLAPSE_KEY) === "1"; } catch (e) {}
      try { localStorage.setItem(PF_COLLAPSE_KEY, c ? "0" : "1"); } catch (e2) {}
      apply();
    });
    apply();
  }

  function pfMapParentRow(node) {
    var tr = node && node.closest ? node.closest("tr") : null;
    if (!tr) return null;
    if (tr.getAttribute("data-ops-child") === "1") {
      var p = tr.previousElementSibling;
      while (p && p.getAttribute("data-ops-child") === "1") p = p.previousElementSibling;
      return p;
    }
    return tr;
  }

  function pfMapGroup(parent) {
    var nodes = [parent];
    var n = parent.nextElementSibling;
    while (n && n.getAttribute("data-ops-child") === "1") {
      nodes.push(n);
      n = n.nextElementSibling;
    }
    return nodes;
  }

  function bindPlanfixMapDrag(tbody) {
    var dragRow = null;
    var dragGroup = [];
    tbody.addEventListener("mousedown", function (ev) {
      var handle = ev.target && ev.target.closest ? ev.target.closest(".dg-ops-pf-drag") : null;
      var tr = pfMapParentRow(ev.target);
      if (tr && tr.hasAttribute("data-ops-status")) tr.draggable = !!handle;
    });
    tbody.addEventListener("dragstart", function (ev) {
      var handle = ev.target && ev.target.closest ? ev.target.closest(".dg-ops-pf-drag") : null;
      var tr = pfMapParentRow(ev.target);
      if (!tr || !handle || !tr.hasAttribute("data-ops-status")) {
        ev.preventDefault();
        return;
      }
      dragRow = tr;
      dragGroup = pfMapGroup(tr);
      dragGroup.forEach(function (n) {
        n.classList.add("dg-ops-pf-dragging");
      });
      try {
        ev.dataTransfer.effectAllowed = "move";
        ev.dataTransfer.setData("text/plain", tr.getAttribute("data-ops-status") || "");
      } catch (e) {}
    });
    tbody.addEventListener("dragover", function (ev) {
      if (!dragRow) return;
      ev.preventDefault();
      try {
        ev.dataTransfer.dropEffect = "move";
      } catch (e2) {}
      var over = pfMapParentRow(ev.target);
      if (!over || over === dragRow || dragGroup.indexOf(over) >= 0) return;
      if (!over.hasAttribute("data-ops-status")) return;
      var overGroup = pfMapGroup(over);
      var rect = over.getBoundingClientRect();
      var before = ev.clientY < rect.top + rect.height / 2;
      if (before) {
        dragGroup.forEach(function (n) {
          tbody.insertBefore(n, over);
        });
      } else {
        var ref = overGroup[overGroup.length - 1].nextSibling;
        dragGroup.forEach(function (n) {
          tbody.insertBefore(n, ref);
        });
      }
    });
    tbody.addEventListener("drop", function (ev) {
      ev.preventDefault();
    });
    tbody.addEventListener("dragend", function () {
      dragGroup.forEach(function (n) {
        n.classList.remove("dg-ops-pf-dragging");
      });
      dragRow = null;
      dragGroup = [];
      tbody.querySelectorAll("tr[data-ops-status]").forEach(function (tr) {
        tr.draggable = false;
      });
      if (state.can_write) savePlanfixMap({ silent: true });
    });
  }

  function bindPlanfixMapExpand(tbody) {
    tbody.addEventListener("click", function (ev) {
      var t = ev.target;
      if (!t || !t.closest) return;
      if (t.closest("select, input, a, .dg-ops-pf-drag, .dg-ops-pf-grip-td, .form-check")) return;
      var td = t.closest("td");
      if (td && td.querySelector("select, input")) return;
      var child = t.closest("tr.dg-ops-pf-child");
      var tr = t.closest("tr[data-ops-status]");
      if (child || !tr || tr.getAttribute("data-ops-sep") === "1") return;
      var st = tr.getAttribute("data-ops-status") || "";
      var row = (state.pf.statuses || []).find(function (s) {
        return s.status_value === st;
      });
      if (!row || !(row.managers || []).length) return;
      if (state.pfExpanded[st]) delete state.pfExpanded[st];
      else state.pfExpanded[st] = 1;
      renderPlanfixPanel();
    });
  }

  function bindPlanfix() {
    if (el("dg-ops-pf-sync")) {
      el("dg-ops-pf-sync").addEventListener("click", function () {
        var months = pfMonthsFromUi();
        this.setAttribute(
          "data-dg-notify-start",
          months[0] === 0
            ? "Забираем весь год одним прогоном…"
            : months.length === 1
              ? "Забираем заявки Planfix за " + pfMonthsLabel(months) + "…"
              : "Забираем заявки Planfix за " + months.length + " мес.: " + pfMonthsLabel(months) + "…"
        );
        runPlanfixSync();
      });
    }
    if (el("dg-ops-pf-sync-report")) {
      el("dg-ops-pf-sync-report").addEventListener("click", function () {
        this.setAttribute(
          "data-dg-notify-start",
          "Обновляем отчёт Planfix (" + pfMonthsLabel() + ", заявки не трогаем)…"
        );
        runPlanfixSync({ reportOnly: true });
      });
    }
    if (el("dg-ops-pf-sync-cancel")) {
      el("dg-ops-pf-sync-cancel").addEventListener("click", function () {
        var btn = this;
        var run = function () {
          return fetch("/api/ops-sheet/planfix-sync-cancel", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: "{}",
          }).then(function (r) {
            return r.json().then(function (j) {
              if (!r.ok || !j || j.success === false) {
                throw new Error((j && j.error) || "HTTP " + r.status);
              }
              return j;
            });
          });
        };
        var p =
          window.DatagonNotify && window.DatagonNotify.busyRun
            ? window.DatagonNotify.busyRun(btn, run)
            : run();
        p.then(function (j) {
          toast("warning", j && j.cancelled ? "Остановка синка Planfix…" : (j && j.message) || "Синк не идёт");
        }).catch(function (e) {
          toast("danger", e.message || "Не удалось остановить");
        });
      });
    }
    if (el("dg-ops-pf-save-map")) {
      el("dg-ops-pf-save-map").addEventListener("click", function () {
        savePlanfixMap();
      });
    }
    var tbody = el("dg-ops-pf-map-tbody");
    if (tbody) {
      tbody.addEventListener("change", function (ev) {
        var t = ev.target;
        if (!t || !t.classList.contains("dg-ops-pf-bucket")) return;
        var tr = t.closest("tr");
        if (!tr) return;
        var chk = tr.querySelector("input.dg-ops-pf-count");
        if (!chk) return;
        var key = t.value;
        chk.disabled = !key;
        if (!key) {
          chk.checked = false;
          return;
        }
        var b = (state.pf.buckets || []).find(function (x) { return x.key === key; });
        if (b && b.countDefault === false) chk.checked = false;
        else chk.checked = true;
      });
      bindPlanfixMapDrag(tbody);
      bindPlanfixMapExpand(tbody);
    }
    function commitPfTasks() {
      var inp = el("dg-ops-pf-tasks-search");
      state.pf.task_q = inp ? String(inp.value || "").trim() : "";
      state.pf.task_page = 1;
      return loadPlanfixTasks();
    }
    if (el("dg-ops-pf-tasks-apply")) {
      el("dg-ops-pf-tasks-apply").addEventListener("click", function () {
        commitPfTasks();
      });
    }
    var tsearch = el("dg-ops-pf-tasks-search");
    if (tsearch) {
      tsearch.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") {
          ev.preventDefault();
          commitPfTasks();
        } else if (ev.key === "Escape") {
          tsearch.value = "";
          commitPfTasks();
        }
      });
    }
    if (el("dg-ops-pf-tasks-prev")) {
      el("dg-ops-pf-tasks-prev").addEventListener("click", function () {
        if (state.pf.task_page <= 1) return;
        state.pf.task_page -= 1;
        loadPlanfixTasks();
      });
    }
    if (el("dg-ops-pf-tasks-next")) {
      el("dg-ops-pf-tasks-next").addEventListener("click", function () {
        if (state.pf.task_page >= state.pf.task_pages) return;
        state.pf.task_page += 1;
        loadPlanfixTasks();
      });
    }
  }

  function bindTableEdit() {
    var host = el("dg-ops-months-host");
    if (!host) return;
    host.addEventListener("click", function (ev) {
      var td = ev.target && ev.target.closest ? ev.target.closest("td[data-ops-edit='1']") : null;
      if (!td || td.getAttribute("data-ops-editing") === "1") return;
      if (ev.target && ev.target.tagName === "INPUT") return;
      startEdit(td);
    });
  }

  function init() {
    var fromUrl = applyShareQueryToPending();
    loadVisible();
    loadWidths();
    renderMonthJump();
    filtersCollapse();
    tableCardCollapse();
    planfixCardCollapse();
    columnControls();
    bindHeaderSearchMirror();
    bindFilters();
    bindTableEdit();
    bindPlanfix();
    fillPfMonthSelect();
    paintFilterForm();
    syncDirtyMarker();
    loadMeta()
      .then(function () {
        if (!fromUrl) {
          state.pending.year = state.year || cy;
        }
        fillYearSelect(state.years);
        fillPfMonthSelect();
        paintFilterForm();
        return commitFilters({ keepTaskPage: fromUrl }).then(function () {
          return fetch("/api/ops-sheet/planfix-sync-status", { credentials: "same-origin" })
            .then(function (r) {
              return r.json();
            })
            .then(function (j) {
              if (j && j.active) return runPlanfixSync();
              return null;
            })
            .catch(function () {
              return null;
            });
        });
      })
      .catch(function (e) {
        setHint("Ошибка: " + (e.message || e));
        toast("danger", e.message || "Не удалось загрузить meta");
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
