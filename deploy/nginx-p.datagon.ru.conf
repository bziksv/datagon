# =============================================================================
# p.datagon.ru — пример nginx (HTTP → HTTPS + TLS proxy)
# =============================================================================
#
# F-DEP-01: канон = 301 с :80 на HTTPS + HSTS на :443.
# НЕ используйте этот файл без HTTPS-redirect (старый вариант проксировал :80
# напрямую на Node — cleartext сессия). Предпочтительный полный пример:
#   deploy/nginx-p.datagon.ru-frontend.conf
#
# ВАЖНО про «убрал public» в nginx:
#   В репозитории сборка SPA лежит в  public/architectui-react-pro/
#   Express тоже читает оттуда (server.js → __dirname/public/...).
#   Если в nginx root = только .../p.datagon.ru (БЕЗ public), то для URL
#   /architectui-react-pro/static/... nginx будет искать файлы в
#   .../p.datagon.ru/architectui-react-pro/... — их там НЕТ, пока не:
#     - вернуть root .../p.datagon.ru/public  (рекомендуется), ИЛИ
#     - сделать симлинк из корня сайта на public/architectui-react-pro
#
# Про «бекенд в режиме FastCGI» в панели:
#   Datagon — это Node (pm2 parser-app), не PHP-FPM. Запросы /api/* и то,
#   что не попало в отдачу статики, должны идти proxy_pass на 127.0.0.1:3000.
#   Если весь location / отдан FastCGI/PHP — /api и UI от Node перестанут работать.
#
# SSL: впиши свои пути (панель / ls /var/www/httpd-cert/).
#
# Проверки после reload:
#   nginx -t && systemctl reload nginx
#   curl -sI  http://p.datagon.ru/ | head -5          # → 301 https
#   curl -sI  https://p.datagon.ru/ | head -8          # → HSTS + 200
#   curl -s   https://p.datagon.ru/api/auth/me -H 'Accept: application/json' | head -c 200; echo
# =============================================================================

server {
    server_name p.datagon.ru;
    listen 155.212.171.103:80;
    charset utf-8;

    access_log /var/www/p_datagon_ru_usr/data/logs/p.datagon.ru-access.log;
    error_log  /var/www/p_datagon_ru_usr/data/logs/p.datagon.ru-error.log;

    # F-DEP-01: не проксировать HTTP на Node — только редирект на HTTPS.
    return 301 https://$host$request_uri;
}

server {
    server_name p.datagon.ru;

    listen 155.212.171.103:443 ssl;
    http2 on;
    charset utf-8;

    ssl_certificate     /var/www/httpd-cert/p.datagon.ru.crt;
    ssl_certificate_key /var/www/httpd-cert/p.datagon.ru.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # F-DEP-01 / F-DEP-03 (дублировать в location /, иначе nginx может не наследовать add_header):
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; form-action 'self'" always;

    access_log /var/www/p_datagon_ru_usr/data/logs/p.datagon.ru-access.log;
    error_log  /var/www/p_datagon_ru_usr/data/logs/p.datagon.ru-error.log;

    location ~* \.(jpg|jpeg|gif|png|svg|js|css|ico|woff|woff2|ttf|eot|otf|mp4|webm|ogg|mp3|wav|zip|pdf|doc|docx|xls|xlsx|csv|xml|json)$ {
        root /var/www/p_datagon_ru_usr/data/www/p.datagon.ru/public;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; form-action 'self'" always;
    }

    # include "/etc/nginx/fastpanel2-sites/p_datagon_ru_usr/p.datagon.ru.includes";
}
